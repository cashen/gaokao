<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>同学你好 - 高考学校体验摘要</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--primary:#155e75;--text:#17242d;--muted:#60717a;--border:#dce6e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 20px}.brand{color:var(--primary);font-weight:800}.hero{text-align:center;padding:60px 0 30px}.hero h1{font-size:42px}.hero p{color:var(--muted)}.search{display:flex;gap:12px;max-width:680px;margin:30px auto}.search input{flex:1;height:56px;border:1px solid var(--border);border-radius:16px;padding:0 18px;font-size:18px}.btn{height:56px;border:0;border-radius:16px;background:var(--primary);color:white;padding:0 28px;font-weight:700}.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px;margin-top:20px}.summary{line-height:1.9;white-space:pre-wrap}.error{background:#fff0ec}.footer{margin-top:40px;border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:600px){.search{display:block}.search input,.btn{width:100%;margin-bottom:12px}}
</style></head>
<body><div class="wrap"><div class="brand">Gaokao OS / 同学你好</div><section class="hero"><h1>同学你好</h1><p>输入一所大学，快速了解学生视角下的学校体验。</p><div class="search"><input id="school" value="吉林大学" placeholder="输入学校名称"><button id="btn" class="btn">开始了解</button></div></section><div id="result"></div><footer class="footer">内容来源：srgaoxiao.com，本页面仅提供阅读入口。<br>同学你好 v1.0.4 · 更新于 2026-07-19</footer></div>
<script>
const box=document.getElementById('result');const input=document.getElementById('school');const btn=document.getElementById('btn');btn.onclick=querySchool;
async function querySchool(){const school=input.value.trim();if(!school)return;box.innerHTML='<div class="card">正在获取...</div>';try{const r=await fetch('/api/tongxue-summary?school='+encodeURIComponent(school),{cache:'no-store'});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw new Error('API返回的不是JSON：'+text.slice(0,100))}if(!r.ok||d.error)throw new Error(d.message||'暂无摘要');const s=typeof d.source==='object'?d.source:{name:d.source||'srgaoxiao.com',url:d.url||'#'};box.innerHTML='<div class="card"><h2>'+esc(d.school||school)+'</h2><p>来源：'+esc(s.name)+'</p><hr><h3>同学们普遍认为</h3><div class="summary">'+esc(d.summary)+'</div><p><a href="'+esc(s.url)+'" target="_blank">查看完整详细信息 →</a></p></div>'}catch(e){box.innerHTML='<div class="card error"><b>暂时没有取得 AI 摘要</b><p>'+esc(e.message)+'</p></div>'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
