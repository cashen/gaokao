<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同学你好 - 高考学校体验摘要</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--primary:#155e75;--action:#c65f25;--text:#17242d;--muted:#60717a;--border:#dce6e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:auto;padding:32px 20px}.brand{color:var(--primary);font-weight:700}.hero{text-align:center;padding:70px 0 30px}.hero h1{font-size:42px;margin:16px 0 8px}.hero p{color:var(--muted)}.search{display:flex;gap:12px;max-width:680px;margin:30px auto}.search input{flex:1;height:56px;border:1px solid var(--border);border-radius:16px;padding:0 18px;font-size:18px;background:#fff}.btn{height:56px;border:0;border-radius:16px;background:var(--primary);color:#fff;padding:0 28px;font-size:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;margin-top:20px;box-shadow:0 8px 24px rgba(20,40,50,.05)}.source{font-size:14px;color:var(--muted)}.summary{line-height:1.9;white-space:pre-wrap}.link{color:var(--primary)}@media(max-width:600px){.wrap{padding:20px 14px}.hero{padding-top:40px}.hero h1{font-size:32px}.search{display:block}.search input,.btn{width:100%;margin-bottom:12px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">Gaokao OS / 同学你好</div>
<section class="hero">
<h1>同学你好</h1>
<p>输入一所大学，快速了解学生视角下的学校体验。</p>
<div class="search"><input id="school" placeholder="输入学校名称，例如：吉林大学"><button class="btn" onclick="querySchool()">开始了解</button></div>
</section>
<div id="result"></div>
</div>
<script>
async function querySchool(){
 const school=document.getElementById('school').value.trim();
 if(!school)return;
 const box=document.getElementById('result');
 box.innerHTML='<div class="card">正在获取 '+school+' 的学生体验摘要...</div>';
 try{
 const r=await fetch('/api/tongxue-summary?school='+encodeURIComponent(school));
 const d=await r.json();
 box.innerHTML='<div class="card"><h2>'+d.school+'</h2><div class="source">来源：'+d.source+'（AI摘要来源网站）</div><hr><div class="summary">'+d.summary+'</div><p><a class="link" href="'+d.url+'" target="_blank">查看完整详细信息 →</a></p></div>';
 }catch(e){box.innerHTML='<div class="card">暂时无法获取，请稍后重试。</div>'}
}
</script>
</body>
</html>
