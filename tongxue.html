<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>同学你好 - 高考学校体验摘要</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--primary:#155e75;--primary-hover:#0f4a5c;--action:#c65f25;--text:#17242d;--muted:#60717a;--border:#dce6e2;--danger:#9a4336;--danger-bg:#fff0ec}
*{box-sizing:border-box}html{min-height:100%}body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 20px 20px}.brand{color:var(--primary);font-weight:800}.hero{text-align:center;padding:64px 0 30px}.hero h1{font-size:42px;line-height:1.15;margin:16px 0 8px}.hero p{color:var(--muted);font-size:18px;line-height:1.7}.search{display:flex;gap:12px;max-width:680px;margin:30px auto}.search input{flex:1;min-width:0;height:56px;border:1px solid var(--border);border-radius:16px;padding:0 18px;font-size:18px;background:#fff;color:var(--text);outline:none}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,94,117,.12)}.btn{height:56px;border:0;border-radius:16px;background:var(--primary);color:#fff;padding:0 28px;font-size:16px;font-weight:700;cursor:pointer}.btn:hover{background:var(--primary-hover)}.btn:disabled{opacity:.65;cursor:wait}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;margin-top:20px;box-shadow:0 8px 24px rgba(20,40,50,.05)}.card h2{font-size:30px;margin:0 0 18px}.source{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}.summary-title{margin:22px 0 10px;font-size:16px;color:var(--primary);font-weight:800}.summary{font-size:17px;line-height:1.95;white-space:pre-wrap;word-break:break-word}.link{display:inline-flex;margin-top:18px;color:var(--primary);font-weight:700;text-underline-offset:4px}.error{border-color:rgba(154,67,54,.22);background:var(--danger-bg);color:var(--danger)}.loading{color:var(--muted)}.footer{margin-top:38px;padding:20px 0 8px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.7;text-align:center}.version{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--primary);font-weight:700}
@media(max-width:600px){.wrap{padding:18px 14px 14px}.hero{padding:38px 0 20px}.hero h1{font-size:32px}.hero p{font-size:15px}.search{display:block;margin-top:22px}.search input,.btn{width:100%;margin-bottom:12px}.card{padding:20px;border-radius:18px}.card h2{font-size:25px}.summary{font-size:16px;line-height:1.85}.footer{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">Gaokao OS / 同学你好</div>
<section class="hero">
<h1>同学你好</h1>
<p>输入一所大学，快速了解学生视角下的学校体验。</p>
<div class="search">
<input id="school" autocomplete="off" inputmode="search" placeholder="输入学校全名，例如：吉林大学" aria-label="学校名称">
<button id="queryButton" class="btn" type="button">开始了解</button>
</div>
</section>
<div id="result" aria-live="polite"></div>
<footer class="footer">
<div>内容实时取自 srgaoxiao.com 的公开 AI 摘要；本站仅提供阅读入口，详细评价请以来源页面为准。</div>
<div class="version">同学你好 v1.0.3 · 更新于 2026-07-19</div>
</footer>
</div>
<script>
const PAGE_VERSION='v1.0.3';
const schoolInput=document.getElementById('school');
const queryButton=document.getElementById('queryButton');
const resultBox=document.getElementById('result');

queryButton.addEventListener('click',querySchool);
schoolInput.addEventListener('keydown',(event)=>{if(event.key==='Enter')querySchool();});

async function querySchool(){
 const school=schoolInput.value.trim();
 if(!school){schoolInput.focus();return;}
 queryButton.disabled=true;
 queryButton.textContent='正在获取';
 resultBox.innerHTML='<div class="card loading">正在实时获取 '+escapeHtml(school)+' 的学生视角 AI 摘要…</div>';
 try{
  const response=await fetch('/api/tongxue-summary?school='+encodeURIComponent(school),{cache:'no-store'});
  const data=await response.json();
  if(!response.ok||data.error)throw new Error(data.message||'暂时无法获取学生评价摘要');
  const source=normalizeSource(data.source,school);
  resultBox.innerHTML='<article class="card">'
   +'<h2>'+escapeHtml(data.school||school)+'</h2>'
   +'<div class="source"><span>来源：'+escapeHtml(source.name)+'</span><span>实时获取</span><span>解析器 '+escapeHtml(data.version||PAGE_VERSION)+'</span></div>'
   +'<div class="summary-title">同学们普遍认为</div>'
   +'<div class="summary">'+escapeHtml(data.summary||'暂未取得摘要。')+'</div>'
   +'<a class="link" href="'+escapeAttribute(source.url)+'" target="_blank" rel="noopener noreferrer">查看完整详细信息 →</a>'
   +'</article>';
 }catch(error){
  resultBox.innerHTML='<div class="card error"><strong>暂时没有取得 AI 摘要</strong><p>'+escapeHtml(error.message||'请稍后重试。')+'</p></div>';
 }finally{
  queryButton.disabled=false;
  queryButton.textContent='开始了解';
 }
}

function normalizeSource(source,school){
 if(source&&typeof source==='object'){
  return {name:String(source.name||'srgaoxiao.com'),url:String(source.url||buildSourceUrl(school))};
 }
 return {name:typeof source==='string'?source:'srgaoxiao.com',url:buildSourceUrl(school)};
}
function buildSourceUrl(school){return 'https://srgaoxiao.com/school/'+encodeURIComponent(school);}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function escapeAttribute(value){return escapeHtml(value).replace(/`/g,'&#96;');}
</script>
</body>
</html>
