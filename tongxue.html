<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同学你好 - 看看学校里的真实体验</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--primary:#155e75;--primary-hover:#0f4a5c;--text:#17242d;--muted:#60717a;--border:#dce6e2;--soft:#e8f3f5;--warm:#fff6ed;--warm-border:#f0d4bc;--warm-text:#8d4b20;--danger:#9a4336;--danger-bg:#fff0ec;--danger-border:#efc5ba;--shadow:0 14px 38px rgba(20,40,50,.07)}
*{box-sizing:border-box}
html{min-height:100%}
body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit}a{color:inherit}[hidden]{display:none!important}
button,a,input,summary{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{box-shadow:0 0 0 3px rgba(21,94,117,.18);border-radius:8px}
.wrap{max-width:1040px;margin:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{color:var(--primary);font-weight:850;font-size:18px}.back-home{color:var(--muted);font-size:13px;font-weight:750;text-decoration:none}.back-home:hover{color:var(--primary)}
.hero{text-align:center;padding:44px 0 30px}.hero h1{font-size:42px;line-height:1.15;margin:15px 0 10px}.hero p{max-width:730px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.75}.hero p span{display:block;font-size:14px;margin-top:3px}
.search-box{max-width:760px;margin:26px auto 0;text-align:left}.search-row{display:flex;gap:12px;align-items:flex-start}.input-wrap{position:relative;flex:1;min-width:0}
.search-input{width:100%;height:58px;border:1px solid var(--border);border-radius:16px;padding:0 48px 0 20px;font-size:18px;background:#fff;color:var(--text)}.search-input:focus{border-color:var(--primary)}
.input-state{position:absolute;right:17px;top:20px;width:18px;height:18px;border:2px solid #9bb0b7;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.btn{height:58px;border:0;border-radius:16px;background:var(--primary);color:#fff;padding:0 25px;font-size:16px;font-weight:850;cursor:pointer;white-space:nowrap}.btn:hover:not(:disabled){background:var(--primary-hover)}.btn:disabled{opacity:.52;cursor:not-allowed}
.quick-examples{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:11px 4px 0;color:var(--muted);font-size:12px}.quick-example{border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--primary);padding:5px 10px;font-size:12px;font-weight:750;cursor:pointer}.quick-example:hover{background:var(--soft);border-color:#bdd9df}
.suggestions{position:absolute;z-index:20;left:0;right:0;top:66px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:7px;box-shadow:0 18px 44px rgba(20,40,50,.14);max-height:360px;overflow:auto}
.suggestion{width:100%;border:0;background:transparent;border-radius:11px;padding:11px 13px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--text);cursor:pointer}.suggestion:hover,.suggestion.active{background:var(--soft)}
.suggestion-main{min-width:0}.suggestion-name{display:block;font-size:15px;font-weight:850;line-height:1.45}.suggestion-meta{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}.suggestion-type{flex:none;border-radius:999px;background:#f2f5f4;color:var(--muted);font-size:11px;padding:4px 8px}.suggestion-empty{padding:13px;color:var(--muted);font-size:13px;line-height:1.7}
.resolve-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 4px 0;color:var(--primary);font-size:13px;font-weight:750;line-height:1.6}.resolve-hint::before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:11px}.resolve-change{border:0;background:transparent;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12px}.index-status{margin:9px 4px 0;color:var(--muted);font-size:12px}
.result-shell,.state-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;margin-top:24px;box-shadow:var(--shadow)}.result-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.result-head h2{font-size:31px;line-height:1.25;margin:0}.badge{flex:none;display:inline-flex;align-items:center;border-radius:999px;padding:7px 11px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:850}.badge.review{background:#eef5ff;color:#315e8a}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}.meta-chip{display:inline-flex;align-items:center;min-height:28px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:#fbfcfc;color:var(--muted);font-size:12px}.meta-chip.resolve{border-color:#bdd9df;background:var(--soft);color:var(--primary);font-weight:850}.divider{height:1px;background:var(--border);margin:22px 0}
.section-heading{display:flex;align-items:center;gap:9px;margin:0 0 16px;color:var(--primary);font-size:17px;font-weight:900}.section-heading::before{content:"";width:4px;height:19px;border-radius:3px;background:var(--primary)}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.insight-card{min-width:0;border:1px solid var(--border);border-radius:17px;padding:18px;background:#fbfcfc}.insight-card.attention{background:var(--warm);border-color:var(--warm-border)}.insight-title{display:flex;align-items:center;gap:9px;margin:0 0 11px;font-size:15px;font-weight:900}.insight-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(21,94,117,.10)}.attention .insight-dot{background:#c65f25;box-shadow:0 0 0 4px rgba(198,95,37,.11)}.insight-list{margin:0;padding:0;list-style:none}.insight-list li{position:relative;padding:0 0 9px 16px;font-size:15px;line-height:1.82;word-break:break-word}.insight-list li:last-child{padding-bottom:0}.insight-list li::before{content:"";position:absolute;left:1px;top:.78em;width:5px;height:5px;border-radius:50%;background:#8da7af}
.raw-summary{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px;color:var(--muted);font-size:13px}.raw-summary summary,.technical-details summary{cursor:pointer;color:var(--primary);font-weight:850}.raw-summary-text{margin-top:10px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.review-intro{margin:0 0 18px;padding:16px 18px;border:1px solid var(--warm-border);border-radius:16px;background:var(--warm);color:var(--warm-text);font-size:14px;line-height:1.8}.review-intro strong{display:block;margin-bottom:2px;font-size:16px;color:#7b3f18}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.review-card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--border);border-radius:18px;padding:18px;background:#fff;box-shadow:0 6px 18px rgba(20,40,50,.035)}.review-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:11px}.review-author{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;font-weight:900}.review-avatar{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:13px;font-weight:900}.review-author-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.review-date{flex:none;color:var(--muted);font-size:11px;line-height:1.6;text-align:right}.review-tags{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 11px}.review-tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;background:#f3f6f5;color:var(--muted);font-size:10px;font-weight:750}.review-tag.verified{background:#eaf5ee;color:#36704a}.review-tag.question{background:#fff4df;color:#9a5c0a}.review-content{font-size:15px;line-height:1.85;word-break:break-word;white-space:pre-wrap}.review-content.collapsed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;overflow:hidden;white-space:normal}.review-expand{align-self:flex-start;margin:8px 0 0;padding:0;border:0;background:transparent;color:var(--primary);font-size:12px;font-weight:850;cursor:pointer}.review-rating{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:15px;padding-top:13px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.review-score{font-size:17px;font-weight:900;color:#b36a18}.rating-note{font-size:10px}.rating-details{margin-top:9px;color:var(--muted);font-size:11px}.rating-details summary{cursor:pointer;color:var(--primary);font-weight:850}.rating-dims{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.rating-dim{border-radius:999px;padding:4px 8px;background:#f6f8f7;color:var(--muted)}.review-footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:14px;color:var(--muted);font-size:11px}.review-source{margin-left:auto;color:var(--primary);font-weight:850;text-decoration:none}.review-source:hover{text-decoration:underline}
.load-more-wrap{display:flex;justify-content:center;margin-top:20px}.load-more{height:44px;border:1px solid var(--border);border-radius:13px;background:#fff;color:var(--primary);padding:0 24px;font-weight:850;cursor:pointer}.load-more:hover:not(:disabled){border-color:var(--primary);background:var(--soft)}.load-more:disabled{opacity:.55;cursor:wait}
.source-note{margin-top:20px;padding:15px 17px;border-radius:14px;background:#f8faf9;color:var(--muted);font-size:13px;line-height:1.75}.technical-details{margin-top:14px;border-top:1px dashed var(--border);padding-top:13px;color:var(--muted);font-size:12px}.technical-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.technical-item{border-radius:999px;background:#f5f7f6;padding:4px 9px}.link{display:inline-flex;align-items:center;margin-top:18px;color:var(--primary);font-weight:850;text-underline-offset:4px}.loading{color:var(--muted);text-align:center;padding-block:34px}.notice{border-color:var(--warm-border);background:var(--warm);color:var(--warm-text)}.error{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}.state-card h2{font-size:21px;margin:0 0 10px}.state-card p{margin:0;line-height:1.8}.state-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.state-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:17px}.state-actions .link{margin-top:0}.action-button{border:0;background:transparent;color:var(--primary);font-weight:850;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px}.state-card details{margin-top:15px;color:var(--muted);font-size:12px}.diagnostic{margin-top:8px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice-card{border:1px solid var(--warm-border);background:#fff;border-radius:15px;padding:15px;text-align:left;color:var(--text);cursor:pointer}.choice-card:hover,.choice-card:focus-visible{border-color:var(--primary)}.choice-name{display:block;font-weight:900;font-size:16px;line-height:1.45}.choice-note{display:block;margin-top:5px;color:var(--muted);font-size:12px}.footer{margin-top:42px;padding:22px 0 8px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.8;text-align:center}.version{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--primary);font-weight:850}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.wrap{padding:16px 14px calc(18px + env(safe-area-inset-bottom))}.brand{font-size:16px}.hero{padding:30px 0 20px}.hero h1{font-size:32px}.hero p{font-size:15px}.search-row{display:block}.search-input,.btn{width:100%;height:54px}.btn{margin-top:12px}.suggestions{top:62px}.result-shell,.state-card{padding:21px;border-radius:18px}.result-head{display:block}.result-head h2{font-size:26px}.badge{margin-top:12px}.summary-grid,.review-grid,.choice-grid{grid-template-columns:1fr}.insight-card,.review-card{padding:16px}.insight-list li{font-size:15px;line-height:1.75}.review-card-head{align-items:center}.footer{text-align:left}}
@media(prefers-reduced-motion:reduce){.input-state{animation:none;border-top-color:#9bb0b7}.btn,.quick-example,.choice-card{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="brand">Gaokao OS / 同学你好</div><a class="back-home" href="/">← 返回首页</a></div>
  <section class="hero">
    <h1>同学你好</h1>
    <p>输入学校名，看看公开评价里常提到的校园生活、学习氛围和就业感受。<span>简称和轻微错别字也能识别。</span></p>
    <div class="search-box">
      <div class="search-row">
        <div class="input-wrap">
          <input id="school" class="search-input" autocomplete="off" inputmode="search" placeholder="输入学校名，如：辽科大" aria-label="学校名称" aria-autocomplete="list" aria-controls="schoolSuggestions" aria-expanded="false" aria-describedby="indexStatus" autofocus>
          <span id="inputState" class="input-state" aria-hidden="true"></span>
          <div id="schoolSuggestions" class="suggestions" role="listbox" hidden></div>
        </div>
        <button id="queryButton" class="btn" type="button" disabled>查看学校体验</button>
      </div>
      <div class="quick-examples"><span>试试：</span><button class="quick-example" type="button" data-example="吉林大学">吉林大学</button><button class="quick-example" type="button" data-example="辽科大">辽科大</button><button class="quick-example" type="button" data-example="大工">大工</button></div>
      <div id="resolveHint" class="resolve-hint" hidden></div>
      <div id="indexStatus" class="index-status">正在载入教育部高校名单…</div>
    </div>
  </section>
  <div id="result" aria-live="polite"></div>
  <div id="liveStatus" class="sr-only" aria-live="polite"></div>
  <footer class="footer">
    <div>这些内容反映部分评论者的个人体验，可能受到专业、校区、年级和个人感受影响。了解学校时，请同时核验招生章程、校区安排、培养方案和官方就业信息。</div>
    <div class="version">同学你好 v1.1.1 · 更新于 2026-07-19</div>
  </footer>
</div>
<script type="module">
import { loadSchoolNameResolver } from '/school-name-resolver.js';

const PAGE_VERSION='v1.1.1';
const SOURCE_ORIGIN='https://srgaoxiao.com';
const SCHOOL_DATA_URL='/school-name-index.generated.json';
const REVIEW_DIMENSION_LABELS={dormitory:'宿舍',cafeteria:'食堂',faculty:'师资',environment:'环境',culture:'氛围',employment:'就业',safety:'安全'};
const schoolInput=document.getElementById('school');
const queryButton=document.getElementById('queryButton');
const resultBox=document.getElementById('result');
const suggestionsBox=document.getElementById('schoolSuggestions');
const resolveHint=document.getElementById('resolveHint');
const indexStatus=document.getElementById('indexStatus');
const inputState=document.getElementById('inputState');
const liveStatus=document.getElementById('liveStatus');
let resolver=null,resolverError=null,suggestions=[],activeSuggestion=-1,selectedOfficialName='',inputTimer=0,currentResolution=null,activeReviewState=null;
let schoolMetaIndex=new Map();

class TongxueError extends Error{constructor(code,message,data={}){super(message);this.name='TongxueError';this.code=code;this.data=data;}}

initializeResolver();

async function initializeResolver(){
  try{
    resolver=await loadSchoolNameResolver();
    try{schoolMetaIndex=await loadSchoolMetadata();}catch{}
    indexStatus.textContent='已支持教育部公布的 '+resolver.count.toLocaleString('zh-CN')+' 所普通高校';
  }catch(error){resolverError=error;indexStatus.textContent='高校名单暂时没有加载完成，请稍后再试。';}
  finally{inputState.hidden=true;updateButtonState();}
}

async function loadSchoolMetadata(){
  const response=await fetch(SCHOOL_DATA_URL,{cache:'force-cache',headers:{accept:'application/json'}});
  if(!response.ok)throw new Error('metadata unavailable');
  const payload=await response.json();
  return new Map((Array.isArray(payload?.schools)?payload.schools:[]).map(item=>[String(item.name||''),item]));
}

schoolInput.addEventListener('input',()=>{selectedOfficialName='';currentResolution=null;activeReviewState=null;hideResolveHint();updateButtonState();clearTimeout(inputTimer);inputTimer=setTimeout(updateSuggestions,110);});
schoolInput.addEventListener('focus',()=>{if(schoolInput.value.trim().length>=2)updateSuggestions();});
schoolInput.addEventListener('keydown',event=>{
  if(!suggestionsBox.hidden&&suggestions.length){
    if(event.key==='ArrowDown'){event.preventDefault();setActiveSuggestion(Math.min(activeSuggestion+1,suggestions.length-1));return;}
    if(event.key==='ArrowUp'){event.preventDefault();setActiveSuggestion(Math.max(activeSuggestion-1,0));return;}
    if(event.key==='Escape'){closeSuggestions();return;}
    if(event.key==='Enter'&&activeSuggestion>=0){event.preventDefault();chooseSuggestion(suggestions[activeSuggestion]);return;}
  }
  if(event.key==='Enter'&&!queryButton.disabled){event.preventDefault();querySchool();}
});
queryButton.addEventListener('click',querySchool);
document.addEventListener('pointerdown',event=>{if(!event.target.closest('.input-wrap'))closeSuggestions();});
document.querySelectorAll('[data-example]').forEach(button=>button.addEventListener('click',()=>{schoolInput.value=button.dataset.example||'';selectedOfficialName='';hideResolveHint();updateButtonState();querySchool();}));

function updateButtonState(){queryButton.disabled=!schoolInput.value.trim()||!resolver||Boolean(resolverError);}
function updateSuggestions(){
  const query=normalizeSchool(schoolInput.value);
  if(!resolver||query.length<2){closeSuggestions();return;}
  suggestions=resolver.search(query,{limit:8});activeSuggestion=-1;
  if(!suggestions.length){suggestionsBox.innerHTML='<div class="suggestion-empty">暂时没有找到明显匹配。可以补充学校所在地区，或输入更完整的名称。</div>';openSuggestions();return;}
  suggestionsBox.innerHTML=suggestions.map((item,index)=>{
    const meta=schoolMetaIndex.get(item.officialName)||{};
    const detail=[meta.location,meta.level].filter(Boolean).join(' · ');
    return '<button id="schoolOption'+index+'" class="suggestion" type="button" role="option" data-index="'+index+'" aria-selected="false">'
      +'<span class="suggestion-main"><span class="suggestion-name">'+escapeHtml(item.officialName)+'</span>'+(detail?'<span class="suggestion-meta">'+escapeHtml(detail)+'</span>':'')+'</span>'
      +'<span class="suggestion-type">'+escapeHtml(matchTypeLabel(item.matchType))+'</span></button>';
  }).join('');
  suggestionsBox.querySelectorAll('[data-index]').forEach(button=>{button.addEventListener('pointerdown',event=>event.preventDefault());button.addEventListener('click',()=>chooseSuggestion(suggestions[Number(button.dataset.index)]));});
  openSuggestions();
}
function chooseSuggestion(candidate){
  if(!candidate)return;
  const original=normalizeSchool(schoolInput.value);selectedOfficialName=candidate.officialName;schoolInput.value=candidate.officialName;closeSuggestions();
  currentResolution={status:'resolved',input:original,resolvedName:candidate.officialName,matchType:candidate.matchType||'candidate',confidence:candidate.score||0,candidates:[]};
  if(original&&original!==candidate.officialName)showResolveHint(original,candidate.officialName);else hideResolveHint();updateButtonState();
}
function openSuggestions(){suggestionsBox.hidden=false;schoolInput.setAttribute('aria-expanded','true');}
function closeSuggestions(){suggestionsBox.hidden=true;schoolInput.setAttribute('aria-expanded','false');schoolInput.removeAttribute('aria-activedescendant');activeSuggestion=-1;}
function setActiveSuggestion(index){
  activeSuggestion=index;suggestionsBox.querySelectorAll('[data-index]').forEach((button,i)=>{const active=i===index;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));if(active){button.scrollIntoView({block:'nearest'});schoolInput.setAttribute('aria-activedescendant',button.id);}});
}

async function querySchool(){
  const originalInput=normalizeSchool(schoolInput.value);if(!originalInput){schoolInput.focus();return;}if(!resolver){renderLocalFailure('高校名单还没有加载完成，请稍后再试。');return;}closeSuggestions();
  const resolution=selectedOfficialName&&selectedOfficialName===originalInput?{status:'resolved',input:originalInput,resolvedName:selectedOfficialName,matchType:'candidate',confidence:1,candidates:[]}:resolver.resolve(originalInput,{limit:8});
  if(resolution.status==='ambiguous'){renderSchoolChoices(originalInput,resolution.candidates);return;}
  if(resolution.status!=='resolved'||!resolution.resolvedName){renderSchoolNotMatched(originalInput,resolution.candidates||[]);return;}
  selectedOfficialName=resolution.resolvedName;currentResolution=resolution;schoolInput.value=resolution.resolvedName;if(originalInput!==resolution.resolvedName)showResolveHint(originalInput,resolution.resolvedName);else hideResolveHint();
  await performExperienceQuery(resolution.resolvedName,originalInput,resolution);
}
async function performExperienceQuery(officialName,originalInput,resolution){
  activeReviewState=null;queryButton.disabled=true;queryButton.textContent='正在查找';resultBox.innerHTML='<div class="state-card loading">已找到“'+escapeHtml(officialName)+'”<br>正在查找这所学校的公开评价…</div>';
  try{const data=await fetchExperience(officialName,originalInput,1);renderResult(data,officialName,resolution);}catch(error){renderFailure(error,officialName,resolution);}finally{updateButtonState();queryButton.textContent='查看学校体验';}
}
async function fetchExperience(school,originalInput,page=1){
  let response;try{response=await fetch('/api/tongxue-summary?school='+encodeURIComponent(school)+'&input='+encodeURIComponent(originalInput||school)+'&page='+encodeURIComponent(String(page)),{cache:'no-store',headers:{accept:'application/json'}});}catch(error){throw new TongxueError('network_error','暂时无法连接学校体验服务。',{cause:String(error)});}
  const raw=await response.text();if(looksLikeHtml(raw))throw new TongxueError('api_route_missed','学校体验服务没有正常运行。',{raw:raw.slice(0,180)});
  let data;try{data=JSON.parse(raw||'{}');}catch{throw new TongxueError('api_invalid_json','学校体验服务返回了无法识别的内容。',{raw:raw.slice(0,300)});}
  if(!response.ok||data.ok===false||data.error)throw new TongxueError(data.error||'api_error',data.message||'暂时没有取得学校体验信息。',data);
  if(data.mode==='ai_summary'){if(!isUsefulSummary(data.summary))throw new TongxueError('summary_invalid','来源摘要暂时无法正常显示。',data);return data;}
  if(data.mode==='recent_reviews'){if(!Array.isArray(data.reviews)||!data.reviews.length)throw new TongxueError('reviews_invalid','近期评论暂时无法正常显示。',data);return data;}
  if(data.mode==='no_content')return data;throw new TongxueError('mode_invalid','暂时无法识别来源内容。',data);
}
function renderResult(data,school,resolution){if(data.mode==='recent_reviews'){renderReviewsResult(data,school,resolution);return;}if(data.mode==='no_content'){renderNoContent(data,school,resolution);return;}renderSummaryResult(data,school,resolution);}

function renderSummaryResult(data,school,resolution){
  activeReviewState=null;const source=normalizeSource(data.source,school);const meta=data.schoolMeta||{};const groups=buildSummaryGroups(data.summary);
  const groupHtml=groups.map(group=>'<section class="insight-card '+(group.key==='attention'?'attention':'')+'"><h3 class="insight-title"><span class="insight-dot"></span>'+escapeHtml(group.title)+'</h3><ul class="insight-list">'+group.items.map(item=>'<li>'+escapeHtml(item)+'</li>').join('')+'</ul></section>').join('');
  resultBox.innerHTML='<article class="result-shell"><div class="result-head"><h2 id="resultTitle" tabindex="-1">'+escapeHtml(data.school||school)+'</h2><span class="badge">来源 AI 摘要</span></div>'
    +'<div class="meta">'+buildMetaChips(meta,data,resolution)+'</div><div class="divider"></div><div class="section-heading">来源站整理的主要观点</div><div class="summary-grid">'+groupHtml+'</div>'
    +'<details class="raw-summary"><summary>查看来源摘要原文</summary><div class="raw-summary-text">'+escapeHtml(tidySummary(data.summary))+'</div></details>'
    +'<div class="source-note">以下内容由来源站根据公开评论生成，本站仅按主题归类展示，不自行增加评价。它反映部分评论者的个人体验，不代表学校官方结论，也不应单独作为报考依据。</div>'
    +'<a class="link" href="'+escapeAttribute(source.url)+'" target="_blank" rel="noopener noreferrer">查看来源站全部评论 →</a>'+buildTechnicalDetails(meta,data,source)+'</article>';
  focusResult();
}
function renderReviewsResult(data,school,resolution){activeReviewState={school:data.school||school,originalInput:resolution?.input||school,resolution,schoolMeta:data.schoolMeta||{},source:normalizeSource(data.source,school),fetchedAt:data.fetchedAt,transport:data.transport,version:data.version||PAGE_VERSION,reviews:dedupeReviews(data.reviews||[]),pagination:data.reviewPagination||{page:1,pageSize:6,total:(data.reviews||[]).length,totalPages:1,hasMore:false}};renderActiveReviews();}
function renderActiveReviews(){
  const state=activeReviewState;if(!state)return;const data={school:state.school,schoolMeta:state.schoolMeta,fetchedAt:state.fetchedAt,transport:state.transport,version:state.version};const cards=state.reviews.map((review,index)=>renderReviewCard(review,index)).join('');
  const loadMore=state.pagination?.hasMore?'<div class="load-more-wrap"><button id="loadMoreReviews" class="load-more" type="button">加载更多近期评论</button></div>':'';
  resultBox.innerHTML='<article class="result-shell"><div class="result-head"><h2 id="resultTitle" tabindex="-1">'+escapeHtml(state.school)+'</h2><span class="badge review">近期公开评论</span></div><div class="meta">'+buildMetaChips(state.schoolMeta,data,state.resolution)+'</div><div class="divider"></div>'
    +'<div class="review-intro"><strong>来源站当前未提供 AI 摘要</strong>下面按发布时间展示近期公开评论，帮助你了解不同同学的个人体验。</div><div class="section-heading">最近发布的评论</div><div class="review-grid">'+cards+'</div>'+loadMore
    +'<div class="source-note">评论来自来源站公开接口。本站仅清理页面格式和危险标签，并按时间排序展示，不改写评论观点。匿名评论和未认证评论请结合多条信息判断。</div>'
    +'<a class="link" href="'+escapeAttribute(state.source.url)+'" target="_blank" rel="noopener noreferrer">查看来源站全部评论 →</a>'+buildTechnicalDetails(state.schoolMeta,data,state.source)+'</article>';
  bindReviewInteractions();focusResult();
}
function renderReviewCard(review,index){
  const content=String(review?.content||'').trim();const isLong=content.length>240||content.split(/\n/).length>5;const tags=[];
  if(review?.isVerified)tags.push('<span class="review-tag verified">已认证本校学生</span>');if(review?.campus)tags.push('<span class="review-tag">'+escapeHtml(review.campus)+'</span>');if(review?.isQuestion)tags.push('<span class="review-tag question">提问</span>');
  const tagsHtml=tags.length?'<div class="review-tags">'+tags.join('')+'</div>':'';const ratingHtml=renderReviewRating(review?.rating);const social=[];if(Number(review?.likes)>0)social.push('👍 '+Number(review.likes)+' 赞');if(Number(review?.replies)>0)social.push('💬 '+Number(review.replies)+' 回复');const author=String(review?.authorLabel||'匿名同学');const sourceUrl=String(review?.sourceUrl||activeReviewState?.source?.url||'#');
  return '<article class="review-card"><div class="review-card-head"><div class="review-author"><span class="review-avatar">'+escapeHtml(author.slice(0,1)||'同')+'</span><span class="review-author-name">'+escapeHtml(author)+'</span></div><time class="review-date">'+escapeHtml(formatReviewDate(review?.createdAt))+'</time></div>'+tagsHtml
    +'<div id="reviewContent'+index+'" class="review-content '+(isLong?'collapsed':'')+'">'+escapeHtml(content)+'</div>'+(isLong?'<button class="review-expand" type="button" data-expand="'+index+'" aria-controls="reviewContent'+index+'" aria-expanded="false">展开全文</button>':'')+ratingHtml
    +'<div class="review-footer">'+social.map(item=>'<span>'+escapeHtml(item)+'</span>').join('')+'<a class="review-source" href="'+escapeAttribute(sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看原评论 →</a></div></article>';
}
function renderReviewRating(rating){
  if(!rating||!Number.isFinite(Number(rating.overall)))return'';const dimensions=rating.dimensions&&typeof rating.dimensions==='object'?rating.dimensions:{};const dimItems=Object.entries(dimensions).filter(([,value])=>Number.isFinite(Number(value))).map(([key,value])=>'<span class="rating-dim">'+escapeHtml(REVIEW_DIMENSION_LABELS[key]||key)+' '+Number(value).toFixed(1)+'</span>').join('');
  return '<div class="review-rating"><span>体验评分</span><span class="review-score">'+Number(rating.overall).toFixed(1)+'</span><span>/ 5.0</span><span class="rating-note">按来源分项计算</span></div>'+(dimItems?'<details class="rating-details"><summary>查看分项评分</summary><div class="rating-dims">'+dimItems+'</div></details>':'');
}
function bindReviewInteractions(){resultBox.querySelectorAll('[data-expand]').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.expand);const content=document.getElementById('reviewContent'+index);if(!content)return;const collapsed=content.classList.toggle('collapsed');button.textContent=collapsed?'展开全文':'收起全文';button.setAttribute('aria-expanded',String(!collapsed));}));document.getElementById('loadMoreReviews')?.addEventListener('click',loadMoreReviews);}
async function loadMoreReviews(){
  const state=activeReviewState;const button=document.getElementById('loadMoreReviews');if(!state||!button||!state.pagination?.hasMore)return;const nextPage=Number(state.pagination.page||1)+1;const before=state.reviews.length;button.disabled=true;button.textContent='正在加载';
  try{const data=await fetchExperience(state.school,state.originalInput,nextPage);if(data.mode!=='recent_reviews')throw new TongxueError('reviews_page_invalid','后续评论页没有返回评论列表。',data);state.reviews=dedupeReviews([...state.reviews,...data.reviews]);state.pagination=data.reviewPagination||{...state.pagination,page:nextPage,hasMore:false};state.fetchedAt=data.fetchedAt||state.fetchedAt;state.transport=data.transport||state.transport;const added=state.reviews.length-before;renderActiveReviews();announce('已新增 '+added+' 条评论');}
  catch(error){button.disabled=false;button.textContent='加载失败，点击重试';button.title=error?.message||'加载失败';announce('评论加载失败，可以再次点击重试');}
}
function renderNoContent(data,school,resolution){
  activeReviewState=null;const source=normalizeSource(data.source,school);const meta=data.schoolMeta||{};const resolutionChip=resolution?.input&&resolution.input!==school?'<span class="meta-chip resolve">'+escapeHtml(resolution.input)+' → '+escapeHtml(school)+'</span>':'';
  resultBox.innerHTML='<div class="state-card notice"><h2 id="resultTitle" tabindex="-1">来源站暂时没有可展示内容</h2><p>学校名称已经确认，但来源站目前没有 AI 摘要，也没有公开评论。这不代表学校没有学生评价，只表示当前来源中没有可展示的数据。</p><div class="state-meta">'+resolutionChip+buildStateMeta(meta,data)+'</div><div class="state-actions"><a class="link" href="'+escapeAttribute(source.url)+'" target="_blank" rel="noopener noreferrer">查看来源页面 →</a><button class="action-button" type="button" data-retry="1">稍后重新获取</button></div>'+buildTechnicalDetails(meta,data,source)+'</div>';
  resultBox.querySelector('[data-retry="1"]')?.addEventListener('click',querySchool);focusResult();
}
function renderSchoolChoices(input,candidates){
  const list=(candidates||[]).slice(0,8);resultBox.innerHTML='<div class="state-card notice"><h2 id="resultTitle" tabindex="-1">请确认你想查询的学校</h2><p>“'+escapeHtml(input)+'”可能对应多所学校。为避免查错，请选择正式校名后再查询。</p><div class="choice-grid">'
    +list.map((candidate,index)=>{const meta=schoolMetaIndex.get(candidate.officialName)||{};const detail=[meta.location,meta.level].filter(Boolean).join(' · ');return '<button type="button" class="choice-card" data-choice="'+index+'"><span class="choice-name">'+escapeHtml(candidate.officialName)+'</span><span class="choice-note">'+escapeHtml(detail||matchTypeLabel(candidate.matchType))+' · 选择后立即查询</span></button>';}).join('')+'</div></div>';
  resultBox.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{const candidate=list[Number(button.dataset.choice)];if(!candidate)return;const resolution={status:'resolved',input,resolvedName:candidate.officialName,matchType:'user_choice',confidence:candidate.score||0,candidates:[]};selectedOfficialName=candidate.officialName;currentResolution=resolution;schoolInput.value=candidate.officialName;showResolveHint(input,candidate.officialName);performExperienceQuery(candidate.officialName,input,resolution);}));focusResult();
}
function renderSchoolNotMatched(input,candidates){const suggestionsHtml=(candidates||[]).length?'<div class="state-meta">'+candidates.map(item=>'<span class="meta-chip">'+escapeHtml(item.officialName)+'</span>').join('')+'</div>':'';resultBox.innerHTML='<div class="state-card notice"><h2 id="resultTitle" tabindex="-1">还不能确定是哪所学校</h2><p>没有在教育部高校名单中唯一识别“'+escapeHtml(input)+'”。请补充省份、城市或输入更完整的名称，避免查错学校。</p>'+suggestionsHtml+'</div>';focusResult();}
function renderLocalFailure(message){resultBox.innerHTML='<div class="state-card error"><h2 id="resultTitle" tabindex="-1">学校名称识别暂不可用</h2><p>'+escapeHtml(message)+'</p></div>';focusResult();}
function renderFailure(error,school,resolution){
  activeReviewState=null;const code=error instanceof TongxueError?error.code:'unknown';const data=error instanceof TongxueError?error.data||{}:{};const meta=data.schoolMeta||{};const source=normalizeSource(data.source,school);let title='暂时没能读取学校信息';let message='学校名称已经确认，但来源站当前连接不稳定。可以稍后再试，或直接查看来源页面。';let css='error';
  if(code==='reviews_api_unavailable'){title='学校已找到，但近期评论暂时读取失败';message='来源站当前没有提供 AI 摘要，评论这次也没有成功读取。这不是“学校没有评论”的结论。';css='notice';}
  else if(code==='school_not_found'){title='来源站暂时没有这所学校的记录';message='本站已经匹配到正式校名，但来源站目前没有对应学校页面。';css='notice';}
  else if(code==='summary_api_unavailable'||code==='source_api_unavailable'){title='来源站暂时无法访问';message='学校名称已经确认，但来源站这次没有正常返回内容。';css='notice';}
  const resolutionChip=resolution?.input&&resolution.input!==school?'<span class="meta-chip resolve">'+escapeHtml(resolution.input)+' → '+escapeHtml(school)+'</span>':'';
  resultBox.innerHTML='<div class="state-card '+css+'"><h2 id="resultTitle" tabindex="-1">'+escapeHtml(title)+'</h2><p>'+escapeHtml(message)+'</p><div class="state-meta">'+resolutionChip+buildStateMeta(meta,data)+'</div><div class="state-actions"><a class="link" href="'+escapeAttribute(source.url)+'" target="_blank" rel="noopener noreferrer">查看来源页面 →</a><button class="action-button" type="button" data-retry="1">重新尝试</button></div><details><summary>技术诊断（供排查）</summary><div class="diagnostic">'+escapeHtml(buildDiagnosticText(code,error,data))+'</div></details></div>';
  resultBox.querySelector('[data-retry="1"]')?.addEventListener('click',querySchool);focusResult();
}
function buildMetaChips(meta,data,resolution){
  const values=[];if(resolution?.input&&resolution.input!==(data.school||''))values.push({text:resolution.input+' → '+(data.school||resolution.resolvedName),resolve:true});if(meta.province||meta.city)values.push({text:[meta.province,meta.city].filter(Boolean).join(' · ')});if(meta.type)values.push({text:meta.type});if(Number.isFinite(Number(meta.reviewCount)))values.push({text:Number(meta.reviewCount)+' 条公开评价'});if(data.fetchedAt)values.push({text:'更新：'+formatTime(data.fetchedAt)});return values.filter(item=>item.text).map(item=>'<span class="meta-chip '+(item.resolve?'resolve':'')+'">'+escapeHtml(item.text)+'</span>').join('');
}
function buildStateMeta(meta,data){const values=[];if(meta.name)values.push(meta.name);if(meta.province||meta.city)values.push([meta.province,meta.city].filter(Boolean).join(' · '));if(Number.isFinite(Number(meta.reviewCount)))values.push(Number(meta.reviewCount)+' 条公开评价');return values.map(value=>'<span class="meta-chip">'+escapeHtml(value)+'</span>').join('');}
function buildTechnicalDetails(meta,data,source){
  const items=['来源：'+(source?.name||'srgaoxiao.com')];if(data?.transport)items.push('获取方式：'+data.transport);if(data?.version)items.push('内容接口：'+data.version);items.push('页面：'+PAGE_VERSION);if(meta?.id!==undefined&&meta?.id!==null)items.push('来源学校编号：'+meta.id);
  return '<details class="technical-details"><summary>数据来源与技术信息</summary><div class="technical-list">'+items.map(item=>'<span class="technical-item">'+escapeHtml(item)+'</span>').join('')+'</div></details>';
}
function buildSummaryGroups(summary){const text=tidySummary(summary).replace(/，但/g,'。但').replace(/，不过/g,'。不过').replace(/，然而/g,'。然而').replace(/；/g,'。');const sentences=(text.match(/[^。！？\n]+[。！？]?/g)||[text]).map(item=>item.trim()).filter(item=>item.length>2);const defs=[{key:'life',title:'校园与生活',words:['宿舍','寝室','食堂','校区','校园','交通','环境','空调','卫浴','生活','住宿','设施']},{key:'study',title:'学习与管理',words:['师资','课程','教学','学习','管理','跑操','自习','考试','课堂','形式主义','老师']},{key:'career',title:'就业与发展',words:['就业','实习','转专业','保研','考研','升学','科研','机会','发展','深造','资源']},{key:'attention',title:'需要留意',words:['但','不过','然而','较差','不足','较少','受限','问题','偏高','争议','参差','槽点']},{key:'overall',title:'综合印象',words:[]}];const groups=new Map(defs.map(item=>[item.key,{...item,items:[]}])) ;for(const sentence of sentences){let selected;if(defs[3].words.some(word=>sentence.includes(word))&&/^(但|不过|然而)|较差|不足|较少|受限|问题|偏高|争议|参差|槽点/.test(sentence))selected=defs[3];else selected=defs.find(item=>!['attention','overall'].includes(item.key)&&item.words.some(word=>sentence.includes(word)));if(!selected)selected=defs[4];groups.get(selected.key).items.push(sentence);}const output=['overall','life','study','career','attention'].map(key=>groups.get(key)).filter(group=>group.items.length);return output.length?output:[{key:'overall',title:'综合印象',items:[tidySummary(summary)]}];}
function dedupeReviews(reviews){const seen=new Set();return(Array.isArray(reviews)?reviews:[]).filter(review=>{const key=review?.id!==null&&review?.id!==undefined?'id:'+review.id:'content:'+String(review?.content||'').replace(/\s+/g,'').slice(0,500);if(seen.has(key))return false;seen.add(key);return Boolean(String(review?.content||'').trim());});}
function buildDiagnosticText(code,error,data){const lines=['错误类型：'+code,'信息：'+(error?.message||'未知错误')];if(Array.isArray(data.diagnostics)){for(const item of data.diagnostics)lines.push([item.stage,item.host,'HTTP '+item.status,item.contentType,item.length+' bytes',item.parseError].filter(Boolean).join(' | '));}return lines.join('\n');}
function showResolveHint(input,officialName){resolveHint.innerHTML='<span>已识别：'+escapeHtml(input)+' → '+escapeHtml(officialName)+'</span><button type="button" class="resolve-change">不是这所？</button>';resolveHint.hidden=false;resolveHint.querySelector('button')?.addEventListener('click',()=>{selectedOfficialName='';currentResolution=null;schoolInput.value=input;hideResolveHint();schoolInput.focus();updateSuggestions();});}
function hideResolveHint(){resolveHint.hidden=true;resolveHint.textContent='';}
function matchTypeLabel(type){if(String(type).includes('official_exact'))return'正式校名';if(String(type).includes('alias_exact'))return'常用简称';if(String(type).includes('prefix'))return'名称匹配';if(String(type).includes('contains'))return'名称相近';if(String(type).includes('fuzzy'))return'可能是';if(type==='generic_shortcut')return'简称候选';return'学校候选';}
function normalizeSource(source,school){if(source&&typeof source==='object')return{name:String(source.name||'srgaoxiao.com'),url:String(source.url||buildSourceUrl(school))};return{name:'srgaoxiao.com',url:buildSourceUrl(school)};}
function buildSourceUrl(school){return SOURCE_ORIGIN+'/school/'+encodeURIComponent(normalizeSchool(school));}
function normalizeSchool(value){return String(value||'').replace(/\s+/g,' ').trim();}
function tidySummary(value){return String(value||'').replace(/\r/g,'').replace(/\s*([，。！？；：、])\s*/g,'$1').replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();}
function isUsefulSummary(value){const text=tidySummary(value);return text.length>=20&&text.length<=5000;}
function formatTime(value){const date=new Date(value||Date.now());return Number.isNaN(date.getTime())?'刚刚':date.toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function formatReviewDate(value){const date=new Date(value||'');if(Number.isNaN(date.getTime()))return String(value||'时间未知').slice(0,16);return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);}
function looksLikeHtml(value){const text=String(value||'').trim().toLowerCase();return text.startsWith('<!doctype html')||text.startsWith('<html')||text.includes('<html');}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function escapeAttribute(value){return escapeHtml(value).replace(/`/g,'&#96;');}
function focusResult(){requestAnimationFrame(()=>document.getElementById('resultTitle')?.focus({preventScroll:false}));}
function announce(message){liveStatus.textContent='';requestAnimationFrame(()=>{liveStatus.textContent=message;});}
</script>
