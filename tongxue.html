<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>同学你好 - 高考学校体验摘要</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--primary:#155e75;--primary-hover:#0f4a5c;--text:#17242d;--muted:#60717a;--border:#dce6e2;--soft:#e8f3f5;--warm:#fff6ed;--warm-border:#f0d4bc;--warm-text:#8d4b20;--danger:#9a4336;--danger-bg:#fff0ec;--danger-border:#efc5ba;--shadow:0 14px 38px rgba(20,40,50,.07)}
*{box-sizing:border-box}html{min-height:100%}body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}a{color:inherit}[hidden]{display:none!important}
.wrap{max-width:1000px;margin:auto;padding:28px 20px calc(24px + env(safe-area-inset-bottom))}.brand{color:var(--primary);font-weight:800;font-size:18px}.hero{text-align:center;padding:58px 0 34px}.hero h1{font-size:42px;line-height:1.15;margin:16px 0 10px}.hero p{color:var(--muted);font-size:18px;line-height:1.7;margin:0}
.search-box{max-width:760px;margin:30px auto 0;text-align:left}.search-row{display:flex;gap:12px;align-items:flex-start}.input-wrap{position:relative;flex:1;min-width:0}.search-input{width:100%;height:58px;border:1px solid var(--border);border-radius:16px;padding:0 48px 0 20px;font-size:18px;background:#fff;color:var(--text);outline:none}.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,94,117,.13)}.input-state{position:absolute;right:17px;top:20px;width:18px;height:18px;border:2px solid #9bb0b7;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.btn{height:58px;border:0;border-radius:16px;background:var(--primary);color:#fff;padding:0 30px;font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap}.btn:hover:not(:disabled){background:var(--primary-hover)}.btn:disabled{opacity:.52;cursor:not-allowed}
.suggestions{position:absolute;z-index:20;left:0;right:0;top:66px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:7px;box-shadow:0 18px 44px rgba(20,40,50,.14);max-height:360px;overflow:auto}.suggestion{width:100%;border:0;background:transparent;border-radius:11px;padding:12px 13px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--text);cursor:pointer}.suggestion:hover,.suggestion.active{background:var(--soft)}.suggestion-name{font-size:15px;font-weight:800;line-height:1.45}.suggestion-type{flex:none;border-radius:999px;background:#f2f5f4;color:var(--muted);font-size:11px;padding:4px 8px}.suggestion-empty{padding:13px;color:var(--muted);font-size:13px;line-height:1.7}.resolve-hint{display:flex;align-items:center;gap:8px;margin:10px 4px 0;color:var(--primary);font-size:13px;font-weight:700;line-height:1.6}.resolve-hint::before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:11px}.index-status{margin:9px 4px 0;color:var(--muted);font-size:12px}
.result-shell,.state-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:30px;margin-top:24px;box-shadow:var(--shadow)}.result-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.result-head h2{font-size:31px;line-height:1.25;margin:0}.badge{flex:none;display:inline-flex;align-items:center;border-radius:999px;padding:7px 11px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:800}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}.meta-chip{display:inline-flex;align-items:center;min-height:28px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;background:#fbfcfc;color:var(--muted);font-size:12px}.meta-chip.resolve{border-color:#bdd9df;background:var(--soft);color:var(--primary);font-weight:800}.divider{height:1px;background:var(--border);margin:22px 0}.summary-heading{display:flex;align-items:center;gap:9px;margin:0 0 16px;color:var(--primary);font-size:17px;font-weight:900}.summary-heading::before{content:"";width:4px;height:19px;border-radius:3px;background:var(--primary)}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.insight-card{min-width:0;border:1px solid var(--border);border-radius:17px;padding:18px;background:#fbfcfc}.insight-card.attention{background:var(--warm);border-color:var(--warm-border)}.insight-title{display:flex;align-items:center;gap:9px;margin:0 0 11px;font-size:15px;font-weight:900;color:var(--text)}.insight-dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(21,94,117,.10)}.attention .insight-dot{background:#c65f25;box-shadow:0 0 0 4px rgba(198,95,37,.11)}.insight-list{margin:0;padding:0;list-style:none}.insight-list li{position:relative;margin:0;padding:0 0 9px 16px;font-size:15px;line-height:1.82;word-break:break-word}.insight-list li:last-child{padding-bottom:0}.insight-list li::before{content:"";position:absolute;left:1px;top:.78em;width:5px;height:5px;border-radius:50%;background:#8da7af}.raw-summary{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px;color:var(--muted);font-size:13px}.raw-summary summary{cursor:pointer;color:var(--primary);font-weight:800}.raw-summary-text{margin-top:10px;line-height:1.85;white-space:pre-wrap;word-break:break-word}.source-note{margin-top:20px;padding:15px 17px;border-radius:14px;background:#f8faf9;color:var(--muted);font-size:13px;line-height:1.75}.link{display:inline-flex;align-items:center;margin-top:18px;color:var(--primary);font-weight:800;text-underline-offset:4px}.loading{color:var(--muted);text-align:center;padding-block:34px}.notice{border-color:var(--warm-border);background:var(--warm);color:var(--warm-text)}.error{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}.state-card h2{font-size:21px;margin:0 0 10px}.state-card p{margin:0;line-height:1.8}.state-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.state-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:17px}.state-actions .link{margin-top:0}.state-card details{margin-top:15px;color:var(--muted);font-size:12px}.diagnostic{margin-top:8px;white-space:pre-wrap;word-break:break-word;line-height:1.7}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice-card{border:1px solid var(--warm-border);background:#fff;border-radius:15px;padding:15px;text-align:left;color:var(--text);cursor:pointer}.choice-card:hover,.choice-card:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,94,117,.1);outline:none}.choice-name{display:block;font-weight:900;font-size:16px;line-height:1.45}.choice-note{display:block;margin-top:5px;color:var(--muted);font-size:12px}.footer{margin-top:42px;padding:22px 0 8px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.8;text-align:center}.version{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--primary);font-weight:800}
@media(max-width:700px){.wrap{padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.brand{font-size:16px}.hero{padding:38px 0 22px}.hero h1{font-size:32px}.hero p{font-size:15px}.search-row{display:block}.search-input,.btn{width:100%;height:54px}.btn{margin-top:12px}.suggestions{top:62px}.result-shell,.state-card{padding:21px;border-radius:18px}.result-head{display:block}.result-head h2{font-size:26px}.badge{margin-top:12px}.summary-grid,.choice-grid{grid-template-columns:1fr}.insight-card{padding:16px}.insight-list li{font-size:15px;line-height:1.75}.footer{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Gaokao OS / 同学你好</div>
  <section class="hero">
    <h1>同学你好</h1>
    <p>学校全名、常用简称或轻微错别字都可以；确认正式校名后再读取来源 AI 摘要。</p>
    <div class="search-box">
      <div class="search-row">
        <div class="input-wrap">
          <input id="school" class="search-input" autocomplete="off" inputmode="search" placeholder="例如：辽科大、吉林大学、大连理功大学" aria-label="学校名称" aria-autocomplete="list" aria-controls="schoolSuggestions" aria-expanded="false" autofocus>
          <span id="inputState" class="input-state" aria-hidden="true"></span>
          <div id="schoolSuggestions" class="suggestions" role="listbox" hidden></div>
        </div>
        <button id="queryButton" class="btn" type="button" disabled>开始了解</button>
      </div>
      <div id="resolveHint" class="resolve-hint" hidden></div>
      <div id="indexStatus" class="index-status">正在载入全站高校名单…</div>
    </div>
  </section>
  <div id="result" aria-live="polite"></div>
  <footer class="footer">
    <div>校名先在本站高校名单中完成正式名称、简称和错别字匹配，再通过 srgaoxiao.com 当前公开 API 实时取得摘要。</div>
    <div class="version">同学你好 v1.0.9 · 更新于 2026-07-19</div>
  </footer>
</div>
<script type="module">
import { loadSchoolNameResolver } from '/school-name-resolver.js';

const PAGE_VERSION='v1.0.9';
const SOURCE_ORIGIN='https://srgaoxiao.com';
const schoolInput=document.getElementById('school');
const queryButton=document.getElementById('queryButton');
const resultBox=document.getElementById('result');
const suggestionsBox=document.getElementById('schoolSuggestions');
const resolveHint=document.getElementById('resolveHint');
const indexStatus=document.getElementById('indexStatus');
const inputState=document.getElementById('inputState');
let resolver=null,resolverError=null,suggestions=[],activeSuggestion=-1,selectedOfficialName='',inputTimer=0,currentResolution=null;

class TongxueError extends Error{constructor(code,message,data={}){super(message);this.name='TongxueError';this.code=code;this.data=data;}}
initializeResolver();

async function initializeResolver(){
  try{resolver=await loadSchoolNameResolver();indexStatus.textContent='已载入 '+resolver.count.toLocaleString('zh-CN')+' 所高校名称，支持简称与相似名称识别。';}
  catch(error){resolverError=error;indexStatus.textContent='高校名单暂时加载失败，当前不能安全纠正简称。';}
  finally{inputState.hidden=true;updateButtonState();}
}

schoolInput.addEventListener('input',()=>{selectedOfficialName='';currentResolution=null;hideResolveHint();updateButtonState();clearTimeout(inputTimer);inputTimer=setTimeout(updateSuggestions,110);});
schoolInput.addEventListener('focus',()=>{if(schoolInput.value.trim().length>=2)updateSuggestions();});
schoolInput.addEventListener('keydown',event=>{
  if(!suggestionsBox.hidden&&suggestions.length){
    if(event.key==='ArrowDown'){event.preventDefault();setActiveSuggestion(Math.min(activeSuggestion+1,suggestions.length-1));return;}
    if(event.key==='ArrowUp'){event.preventDefault();setActiveSuggestion(Math.max(activeSuggestion-1,0));return;}
    if(event.key==='Escape'){closeSuggestions();return;}
    if(event.key==='Enter'&&activeSuggestion>=0){event.preventDefault();chooseSuggestion(suggestions[activeSuggestion]);return;}
  }
  if(event.key==='Enter'&&!queryButton.disabled){event.preventDefault();querySchool();}
});
queryButton.addEventListener('click',querySchool);
document.addEventListener('pointerdown',event=>{if(!event.target.closest('.input-wrap'))closeSuggestions();});

function updateButtonState(){queryButton.disabled=!schoolInput.value.trim()||!resolver||Boolean(resolverError);}
function updateSuggestions(){
  const query=normalizeSchool(schoolInput.value);
  if(!resolver||query.length<2){closeSuggestions();return;}
  suggestions=resolver.search(query,{limit:8});activeSuggestion=-1;
  if(!suggestions.length){suggestionsBox.innerHTML='<div class="suggestion-empty">没有找到明显匹配。请继续输入学校所在地区或更完整的名称。</div>';openSuggestions();return;}
  suggestionsBox.innerHTML=suggestions.map((item,index)=>'<button class="suggestion" type="button" role="option" data-index="'+index+'" aria-selected="false"><span class="suggestion-name">'+escapeHtml(item.officialName)+'</span><span class="suggestion-type">'+escapeHtml(matchTypeLabel(item.matchType))+'</span></button>').join('');
  suggestionsBox.querySelectorAll('[data-index]').forEach(button=>{button.addEventListener('pointerdown',event=>event.preventDefault());button.addEventListener('click',()=>chooseSuggestion(suggestions[Number(button.dataset.index)]));});
  openSuggestions();
}
function chooseSuggestion(candidate){
  if(!candidate)return;
  const original=normalizeSchool(schoolInput.value);selectedOfficialName=candidate.officialName;schoolInput.value=candidate.officialName;closeSuggestions();
  currentResolution={status:'resolved',input:original,resolvedName:candidate.officialName,matchType:candidate.matchType||'candidate',confidence:candidate.score||0,candidates:[]};
  if(original&&original!==candidate.officialName)showResolveHint(original,candidate.officialName);else hideResolveHint();updateButtonState();
}
function openSuggestions(){suggestionsBox.hidden=false;schoolInput.setAttribute('aria-expanded','true');}
function closeSuggestions(){suggestionsBox.hidden=true;schoolInput.setAttribute('aria-expanded','false');activeSuggestion=-1;}
function setActiveSuggestion(index){activeSuggestion=index;suggestionsBox.querySelectorAll('[data-index]').forEach((button,i)=>{const active=i===index;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));if(active)button.scrollIntoView({block:'nearest'});});}

async function querySchool(){
  const originalInput=normalizeSchool(schoolInput.value);if(!originalInput){schoolInput.focus();return;}
  if(!resolver){renderLocalFailure('高校名单还没有加载完成，请稍后再试。');return;}
  closeSuggestions();
  let resolution=selectedOfficialName&&selectedOfficialName===originalInput?{status:'resolved',input:originalInput,resolvedName:selectedOfficialName,matchType:'candidate',confidence:1,candidates:[]}:resolver.resolve(originalInput,{limit:8});
  if(resolution.status==='ambiguous'){renderSchoolChoices(originalInput,resolution.candidates);return;}
  if(resolution.status!=='resolved'||!resolution.resolvedName){renderSchoolNotMatched(originalInput,resolution.candidates||[]);return;}
  selectedOfficialName=resolution.resolvedName;currentResolution=resolution;schoolInput.value=resolution.resolvedName;
  if(originalInput!==resolution.resolvedName)showResolveHint(originalInput,resolution.resolvedName);else hideResolveHint();
  await performSummaryQuery(resolution.resolvedName,originalInput,resolution);
}

async function performSummaryQuery(officialName,originalInput,resolution){
  queryButton.disabled=true;queryButton.textContent='正在获取';
  resultBox.innerHTML='<div class="state-card loading">已确认正式校名“'+escapeHtml(officialName)+'”，正在读取来源 AI 摘要…</div>';
  try{const data=await fetchSummary(officialName,originalInput);renderResult(data,officialName,resolution);}
  catch(error){renderFailure(error,officialName,resolution);}
  finally{updateButtonState();queryButton.textContent='开始了解';}
}

async function fetchSummary(school,originalInput){
  let response;try{response=await fetch('/api/tongxue-summary?school='+encodeURIComponent(school)+'&input='+encodeURIComponent(originalInput||school),{cache:'no-store',headers:{accept:'application/json'}});}catch(error){throw new TongxueError('network_error','浏览器没有连接到本站摘要接口。',{cause:String(error)});}
  const raw=await response.text();
  if(looksLikeHtml(raw))throw new TongxueError('api_route_missed','摘要接口返回了 HTML，Cloudflare Pages Function 没有命中。',{raw:raw.slice(0,180)});
  let data;try{data=JSON.parse(raw||'{}');}catch(error){throw new TongxueError('api_invalid_json','本站摘要接口返回内容不是有效 JSON。',{raw:raw.slice(0,300)});}
  if(!response.ok||data.ok===false||data.error)throw new TongxueError(data.error||'api_error',data.message||'摘要接口暂时没有取得内容。',data);
  if(!isUsefulSummary(data.summary))throw new TongxueError('summary_invalid','来源 API 返回了成功状态，但摘要正文为空或异常。',data);
  return data;
}

function renderSchoolChoices(input,candidates){
  const list=(candidates||[]).slice(0,8);
  resultBox.innerHTML='<div class="state-card notice"><h2>请确认你想查询的学校</h2><p>“'+escapeHtml(input)+'”可能对应多所学校。为避免查错，系统不会自动猜测。</p><div class="choice-grid">'+list.map((candidate,index)=>'<button type="button" class="choice-card" data-choice="'+index+'"><span class="choice-name">'+escapeHtml(candidate.officialName)+'</span><span class="choice-note">'+escapeHtml(matchTypeLabel(candidate.matchType))+' · 选择后立即查询</span></button>').join('')+'</div></div>';
  resultBox.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{
    const candidate=list[Number(button.dataset.choice)];if(!candidate)return;
    const resolution={status:'resolved',input,resolvedName:candidate.officialName,matchType:'user_choice',confidence:candidate.score||0,candidates:[]};
    selectedOfficialName=candidate.officialName;currentResolution=resolution;schoolInput.value=candidate.officialName;showResolveHint(input,candidate.officialName);performSummaryQuery(candidate.officialName,input,resolution);
  }));
}
function renderSchoolNotMatched(input,candidates){
  const suggestionsHtml=(candidates||[]).length?'<div class="state-meta">'+candidates.map(item=>'<span class="meta-chip">'+escapeHtml(item.officialName)+'</span>').join('')+'</div>':'';
  resultBox.innerHTML='<div class="state-card notice"><h2>没有安全匹配到正式校名</h2><p>没有在本站高校名单中唯一识别“'+escapeHtml(input)+'”。请补充省份、城市或输入更完整名称，系统不会为了完成搜索而随意猜测。</p>'+suggestionsHtml+'</div>';
}
function renderLocalFailure(message){resultBox.innerHTML='<div class="state-card error"><h2>学校名称识别暂不可用</h2><p>'+escapeHtml(message)+'</p></div>';}

function renderResult(data,school,resolution){
  const source=normalizeSource(data.source,school),meta=data.schoolMeta||{},groups=buildSummaryGroups(data.summary);
  const groupHtml=groups.map(group=>'<section class="insight-card '+(group.key==='attention'?'attention':'')+'"><h3 class="insight-title"><span class="insight-dot"></span>'+escapeHtml(group.title)+'</h3><ul class="insight-list">'+group.items.map(item=>'<li>'+escapeHtml(item)+'</li>').join('')+'</ul></section>').join('');
  resultBox.innerHTML='<article class="result-shell"><div class="result-head"><h2>'+escapeHtml(data.school||school)+'</h2><span class="badge">来源 AI 摘要</span></div><div class="meta">'+buildMetaChips(meta,data,resolution)+'</div><div class="divider"></div><div class="summary-heading">同学们普遍认为</div><div class="summary-grid">'+groupHtml+'</div><details class="raw-summary"><summary>查看来源 AI 摘要原文</summary><div class="raw-summary-text">'+escapeHtml(tidySummary(data.summary))+'</div></details><div class="source-note">卡片内容全部来自来源 API 返回的摘要原句。本站只按关键词分组，不增加评分、不补写观点；学生评价具有个人差异，不代表学校官方结论。</div><a class="link" href="'+escapeAttribute(source.url)+'" target="_blank" rel="noopener noreferrer">查看完整学生评价与来源页面 →</a></article>';
}

function renderFailure(error,school,resolution){
  const code=error instanceof TongxueError?error.code:'unknown',data=error instanceof TongxueError?error.data||{}:{},meta=data.schoolMeta||{},source=normalizeSource(data.source,school);
  let title='暂时没有取得 AI 摘要',message='摘要接口暂时无法完成请求，可以稍后重试。',css='error';
  if(code==='summary_not_available'){title='来源站尚未生成这所学校的 AI 摘要';message='正式校名已经确认，学校详情也已找到，但来源 AI 摘要接口当前明确返回 summary: null。这不是名称匹配失败。';css='notice';}
  else if(code==='school_not_found'){title='来源站没有找到这所学校';message='本站已经匹配到正式校名，但来源站学校接口没有对应记录。';css='notice';}
  else if(code==='summary_api_unavailable'||code==='source_api_unavailable'){title='来源公开 API 暂时不可用';message='本站接口已经运行，但来源站这次没有返回可解析的 JSON。';css='notice';}
  else if(code==='api_route_missed'){title='Cloudflare 摘要接口没有命中';message='当前部署只返回了静态页面，没有运行 functions/api/tongxue-summary.js。';}
  else if(code==='network_error'){title='本站摘要接口连接失败';message='浏览器没有连接到同域 Cloudflare Function，请稍后重试。';}
  const resolutionChip=resolution?.input&&resolution.input!==school?'<span class="meta-chip resolve">'+escapeHtml(resolution.input)+' → '+escapeHtml(school)+'</span>':'';
  resultBox.innerHTML='<div class="state-card '+css+'"><h2>'+escapeHtml(title)+'</h2><p>'+escapeHtml(message)+'</p><div class="state-meta">'+resolutionChip+buildStateMeta(meta,data)+'</div><div class="state-actions"><a class="link" href="'+escapeAttribute(source.url)+'" target="_blank" rel="noopener noreferrer">查看来源页面 →</a><a class="link" href="#" data-retry="1">重新尝试</a></div><details><summary>查看诊断信息</summary><div class="diagnostic">'+escapeHtml(buildDiagnosticText(code,error,data))+'</div></details></div>';
  resultBox.querySelector('[data-retry="1"]')?.addEventListener('click',event=>{event.preventDefault();querySchool();});
}

function buildMetaChips(meta,data,resolution){
  const values=[];
  if(resolution?.input&&resolution.input!==(data.school||''))values.push({text:resolution.input+' → '+(data.school||resolution.resolvedName),resolve:true});
  if(meta.province||meta.city)values.push({text:[meta.province,meta.city].filter(Boolean).join(' · ')});if(meta.type)values.push({text:meta.type});if(Number.isFinite(Number(meta.rating)))values.push({text:'评分 '+Number(meta.rating).toFixed(1)});if(Number.isFinite(Number(meta.reviewCount)))values.push({text:Number(meta.reviewCount)+' 条评价'});if(meta.tags)values.push({text:meta.tags});values.push({text:'来源：srgaoxiao.com'});if(data.fetchedAt)values.push({text:'获取：'+formatTime(data.fetchedAt)});if(data.transport)values.push({text:data.transport});values.push({text:'接口 '+String(data.version||PAGE_VERSION)});
  return values.filter(item=>item.text).map(item=>'<span class="meta-chip '+(item.resolve?'resolve':'')+'">'+escapeHtml(item.text)+'</span>').join('');
}
function buildStateMeta(meta,data){const values=[];if(meta.id!==undefined&&meta.id!==null)values.push('来源 schoolId：'+meta.id);if(meta.name)values.push(meta.name);if(meta.province||meta.city)values.push([meta.province,meta.city].filter(Boolean).join(' · '));if(Number.isFinite(Number(meta.reviewCount)))values.push(Number(meta.reviewCount)+' 条评价');if(data.version)values.push('接口 '+data.version);return values.map(value=>'<span class="meta-chip">'+escapeHtml(value)+'</span>').join('');}
function buildSummaryGroups(summary){
  const text=tidySummary(summary).replace(/，但/g,'。但').replace(/，不过/g,'。不过').replace(/，然而/g,'。然而').replace(/；/g,'。');
  const sentences=(text.match(/[^。！？\n]+[。！？]?/g)||[text]).map(item=>item.trim()).filter(item=>item.length>2);
  const defs=[{key:'life',title:'校园与生活',words:['宿舍','寝室','食堂','校区','校园','交通','环境','空调','卫浴','生活','住宿','设施']},{key:'study',title:'学习与管理',words:['师资','课程','教学','学习','管理','跑操','自习','考试','课堂','形式主义','老师']},{key:'career',title:'就业与发展',words:['就业','实习','转专业','保研','考研','升学','科研','机会','发展','深造','资源']},{key:'attention',title:'需要留意',words:['但','不过','然而','较差','不足','较少','受限','问题','偏高','争议','参差','槽点']},{key:'overall',title:'综合印象',words:[]}];
  const groups=new Map(defs.map(item=>[item.key,{...item,items:[]}]))
  for(const sentence of sentences){let selected;if(defs[3].words.some(word=>sentence.includes(word))&&/^(但|不过|然而)|较差|不足|较少|受限|问题|偏高|争议|参差|槽点/.test(sentence))selected=defs[3];else selected=defs.find(item=>!['attention','overall'].includes(item.key)&&item.words.some(word=>sentence.includes(word)));if(!selected)selected=defs[4];groups.get(selected.key).items.push(sentence);}
  const output=['overall','life','study','career','attention'].map(key=>groups.get(key)).filter(group=>group.items.length);return output.length?output:[{key:'overall',title:'综合印象',items:[tidySummary(summary)]}];
}
function buildDiagnosticText(code,error,data){const lines=['错误类型：'+code,'信息：'+(error?.message||'未知错误')];if(Array.isArray(data.diagnostics))for(const item of data.diagnostics)lines.push([item.stage,item.host,'HTTP '+item.status,item.contentType,item.length+' bytes',item.parseError].filter(Boolean).join(' | '));return lines.join('\n');}
function showResolveHint(input,officialName){resolveHint.textContent='已将“'+input+'”识别为“'+officialName+'”';resolveHint.hidden=false;}
function hideResolveHint(){resolveHint.hidden=true;resolveHint.textContent='';}
function matchTypeLabel(type){if(String(type).includes('exact'))return'完全匹配';if(String(type).includes('prefix'))return'前缀匹配';if(String(type).includes('contains'))return'包含匹配';if(String(type).includes('fuzzy'))return'相似名称';if(type==='generic_shortcut')return'简称候选';return'学校候选';}
function normalizeSource(source,school){if(source&&typeof source==='object')return{name:String(source.name||'srgaoxiao.com'),url:String(source.url||buildSourceUrl(school))};return{name:'srgaoxiao.com',url:buildSourceUrl(school)};}
function buildSourceUrl(school){return SOURCE_ORIGIN+'/school/'+encodeURIComponent(normalizeSchool(school));}
function normalizeSchool(value){return String(value||'').replace(/\s+/g,' ').trim();}
function tidySummary(value){return String(value||'').replace(/\r/g,'').replace(/\s*([，。！？；：、])\s*/g,'$1').replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();}
function isUsefulSummary(value){const text=tidySummary(value);return text.length>=20&&text.length<=5000;}
function formatTime(value){const date=new Date(value||Date.now());return Number.isNaN(date.getTime())?'刚刚':date.toLocaleString('zh-CN',{hour12:false});}
function looksLikeHtml(value){const text=String(value||'').trim().toLowerCase();return text.startsWith('<!doctype html')||text.startsWith('<html')||text.includes('<html');}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function escapeAttribute(value){return escapeHtml(value).replace(/`/g,'&#96;');}
