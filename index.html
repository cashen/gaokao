
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2027年高考倒计时</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        
        .countdown-box {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .countdown-box:active {
            transform: scale(0.95);
        }
        
        .glow {
            text-shadow: 0 0 25px rgba(234, 179, 8, 0.9);
        }
        
        .bg-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-red-700 via-red-600 to-amber-600 min-h-[100dvh] text-white overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(at_center,#ffffff12_0%,transparent_70%)] bg-grid"></div>
    
    <div class="relative max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12 min-h-[100dvh] flex flex-col">
        <!-- 头部 -->
        <div class="text-center mb-8 sm:mb-12">
            <div class="inline-flex items-center gap-3 mb-4">
                <i class="fa-solid fa-graduation-cap text-4xl sm:text-5xl"></i>
                <h1 class="text-5xl sm:text-6xl font-black tracking-widest glow">2027 高考</h1>
            </div>
            <p class="text-xl sm:text-2xl font-medium text-amber-200">十年寒窗，一朝金榜题名！</p>
            <div class="mt-3 text-amber-100 text-base sm:text-lg">
                <i class="fa-solid fa-calendar-days"></i> 
                2027年6月7日 — 6月9日
            </div>
        </div>

        <!-- 主倒计时 -->
        <div class="flex-1 flex items-center justify-center">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 w-full max-w-4xl">
                <!-- 天 -->
                <div class="countdown-box bg-white/10 backdrop-blur-lg rounded-3xl p-6 sm:p-8 text-center border border-white/20">
                    <div id="days" class="text-6xl sm:text-7xl lg:text-8xl font-black tabular-nums">000</div>
                    <div class="text-lg sm:text-xl font-medium mt-2 tracking-widest">天</div>
                </div>
                <!-- 时 -->
                <div class="countdown-box bg-white/10 backdrop-blur-lg rounded-3xl p-6 sm:p-8 text-center border border-white/20">
                    <div id="hours" class="text-6xl sm:text-7xl lg:text-8xl font-black tabular-nums">00</div>
                    <div class="text-lg sm:text-xl font-medium mt-2 tracking-widest">小时</div>
                </div>
                <!-- 分 -->
                <div class="countdown-box bg-white/10 backdrop-blur-lg rounded-3xl p-6 sm:p-8 text-center border border-white/20">
                    <div id="minutes" class="text-6xl sm:text-7xl lg:text-8xl font-black tabular-nums">00</div>
                    <div class="text-lg sm:text-xl font-medium mt-2 tracking-widest">分钟</div>
                </div>
                <!-- 秒 -->
                <div class="countdown-box bg-white/10 backdrop-blur-lg rounded-3xl p-6 sm:p-8 text-center border border-white/20">
                    <div id="seconds" class="text-6xl sm:text-7xl lg:text-8xl font-black tabular-nums">00</div>
                    <div class="text-lg sm:text-xl font-medium mt-2 tracking-widest">秒</div>
                </div>
            </div>
        </div>

        <!-- 励志区 -->
        <div class="mt-12 sm:mt-16 text-center">
            <div class="max-w-lg mx-auto bg-white/10 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-white/20">
                <p class="text-xl sm:text-2xl font-medium leading-relaxed">
                    “宝剑锋从磨砺出，梅花香自苦寒来”<br>
                    <span class="text-amber-200 text-base sm:text-lg">—— 距离梦想，只剩最后冲刺！</span>
                </p>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="mt-10 max-w-md mx-auto w-full px-4">
            <div class="flex justify-between text-xs text-amber-100 mb-2">
                <span>已走过的路</span>
                <span id="percent">0%</span>
            </div>
            <div class="h-2.5 bg-white/20 rounded-full overflow-hidden">
                <div id="progress" class="h-full bg-gradient-to-r from-amber-300 to-yellow-300 w-0 transition-all duration-700"></div>
            </div>
        </div>

        <!-- 脚注 -->
        <div class="text-center mt-auto pt-10 text-white/60 text-xs sm:text-sm">
           
            <p class="mt-6 text-[10px]">愿每一位考生金榜题名，前程似锦！🚀</p>
        </div>
    </div>

    <script>
        const TARGET_DATE = new Date('2027-06-07T09:00:00+08:00');

        function updateCountdown() {
            const now = new Date();
            let diff = TARGET_DATE - now;

            if (diff <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('percent').textContent = '100%';
                document.getElementById('progress').style.width = '100%';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(3, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            // 进度条
            const totalDaysApprox = 480;
            const passed = totalDaysApprox - days;
            const percent = Math.min(Math.floor((passed / totalDaysApprox) * 100), 100);
            document.getElementById('percent').textContent = percent + '%';
            document.getElementById('progress').style.width = percent + '%';
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 空格键小彩蛋
        document.addEventListener('keydown', e => {
            if (e.key === ' ') {
                document.querySelectorAll('.countdown-box').forEach(box => {
                    box.style.transform = 'scale(1.1)';
                    setTimeout(() => box.style.transform = 'scale(1)', 180);
                });
            }
        });
    </script>

</body>
</html>
