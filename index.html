<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高考倒计时 | 2027 / 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #182033;
      --muted: #697386;
      --soft: #f8efe4;
      --paper: rgba(255, 255, 255, 0.82);
      --line: rgba(75, 85, 99, 0.14);
      --blue: #2f67d8;
      --green: #168466;
      --amber: #c87525;
      --warm: #f7b267;
      --shadow: 0 24px 70px rgba(43, 52, 70, 0.13);
    }

    * { box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 13% 9%, rgba(247, 178, 103, 0.26), transparent 30%),
        radial-gradient(circle at 86% 16%, rgba(47, 103, 216, 0.16), transparent 26%),
        radial-gradient(circle at 52% 92%, rgba(22, 132, 102, 0.15), transparent 34%),
        linear-gradient(135deg, #fff8ef 0%, #f7fbff 46%, #f2fbf5 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(24, 32, 51, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 32, 51, 0.026) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.92), transparent 80%);
    }

    .num {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .shell {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(200, 117, 37, 0.22);
      border-radius: 999px;
      background: rgba(255, 248, 239, 0.82);
      color: #9a5a1f;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 12px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #d97706;
      box-shadow: 0 0 0 5px rgba(217, 119, 6, 0.12);
    }

    .now-card {
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.64);
      box-shadow: 0 14px 38px rgba(43, 52, 70, 0.08);
    }

    .progress-track {
      position: relative;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(100, 116, 139, 0.14);
    }

    .progress-bar {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #c87525, #2f67d8, #168466);
      transition: width 420ms ease;
    }

    .progress-bar::after {
      position: absolute;
      top: 50%;
      right: 0;
      width: 12px;
      height: 12px;
      content: "";
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.42), 0 2px 8px rgba(24, 32, 51, 0.22);
      transform: translate(38%, -50%);
    }

    .count-card {
      position: relative;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(43, 52, 70, 0.10);
    }

    .count-card::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      content: "";
      background: linear-gradient(180deg, var(--blue), var(--green));
    }

    .count-card.secondary::before {
      background: linear-gradient(180deg, var(--amber), var(--blue));
    }

    .status-pill {
      border-radius: 999px;
      background: rgba(47, 103, 216, 0.08);
      color: #2452aa;
      font-size: 14px;
      font-weight: 900;
      padding: 6px 12px;
      white-space: nowrap;
    }

    .secondary .status-pill {
      background: rgba(200, 117, 37, 0.11);
      color: #9a5a1f;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .time-box {
      position: relative;
      min-width: 0;
      max-width: 100%;
      border: 1px solid rgba(24, 32, 51, 0.08);
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 62%, #f6f7f9 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.92),
        0 8px 20px rgba(24, 32, 51, 0.045);
    }

    .time-box.primary-day {
      background: linear-gradient(180deg, #fffaf3 0%, #ffffff 58%, #f7fafc 100%);
    }

    .time-label {
      margin-top: 4px;
      color: #667085;
      font-size: 12px;
      font-weight: 800;
    }

    .second-box {
      isolation: isolate;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .second-wrap {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .second-ring {
      --second-progress: 0%;
      --ring-color: #2f67d8;
      position: relative;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: conic-gradient(var(--ring-color) var(--second-progress), rgba(24, 32, 51, 0.075) 0);
      box-shadow: 0 7px 18px rgba(24, 32, 51, 0.075);
      transition: background 220ms linear;
    }

    .second-ring::after {
      position: absolute;
      inset: 5px;
      content: "";
      border-radius: 999px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(24, 32, 51, 0.06);
    }

    .second-num {
      min-width: 2ch;
      line-height: 1;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .second-num.is-ticking {
      opacity: 0.58;
      transform: translateY(1px) scale(0.99);
    }

    .hint-card {
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.56);
      color: #596579;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .nav-link {
      display: flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(47, 103, 216, 0.17);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.70);
      color: #2452aa;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      border-color: rgba(47, 103, 216, 0.42);
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(47, 103, 216, 0.12);
      outline: none;
      transform: translateY(-2px);
    }

    @media (max-width: 860px) {
      .nav-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      main {
        display: block !important;
        width: 100vw !important;
        max-width: 100vw !important;
        padding-right: 14px !important;
        padding-left: 14px !important;
        overflow: hidden;
      }

      .shell {
        border-radius: 24px !important;
        padding: 22px 16px !important;
      }

      .count-card {
        border-radius: 18px;
        padding: 18px 16px 18px 20px !important;
      }

      .count-card > .card-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .time-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .time-box {
        border-radius: 14px;
        padding-top: 14px !important;
        padding-bottom: 14px !important;
      }

      .time-box .main-num {
        font-size: 2.05rem !important;
        line-height: 1.08;
      }

      .second-wrap {
        min-height: 36px;
      }

      .second-ring {
        width: 28px;
        height: 28px;
      }

      .nav-grid {
        grid-template-columns: 1fr;
      }

      .nav-link {
        min-height: 46px;
        justify-content: flex-start;
        padding: 0 14px;
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar,
      .second-ring,
      .second-num,
      .nav-link {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center px-4 py-8 sm:px-6 lg:px-8">
    <section class="shell rounded-[30px] px-5 py-7 sm:px-8 sm:py-9 lg:px-10">
      <header class="grid gap-6 md:grid-cols-[1.12fr_0.88fr] md:items-end">
        <div>
          <p class="badge mb-3"><span class="badge-dot" aria-hidden="true"></span> 高考时间提醒</p>
          <h1 class="text-4xl font-black leading-tight text-slate-950 sm:text-5xl">
            高考倒计时
          </h1>
          <p class="mt-4 max-w-2xl text-base leading-7 text-slate-600 sm:text-lg">
            以北京时间 6 月 7 日 09:00 为目标。天数放大，秒数收住，看得清，也不制造焦虑。
          </p>
        </div>

        <div class="now-card rounded-2xl p-4 text-sm leading-6 text-slate-600">
          <div class="flex items-center justify-between gap-3">
            <span class="font-bold text-slate-800">当前北京时间</span>
            <span id="nowText" class="num text-right font-semibold text-slate-700">--</span>
          </div>
          <div class="mt-3 progress-track" aria-hidden="true">
            <div id="dayProgress" class="progress-bar"></div>
          </div>
          <p id="dayProgressText" class="mt-2 text-xs font-semibold text-slate-500">今日进度 --</p>
        </div>
      </header>

      <section class="mt-8 grid gap-4 lg:grid-cols-2 lg:gap-5" aria-label="高考倒计时">
        <article class="count-card p-5 pl-6 sm:p-6 sm:pl-7">
          <div class="card-head mb-5 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 class="text-2xl font-black text-slate-900">2027 高考</h2>
              <p class="mt-1 text-sm text-slate-500">目标时间：2027-06-07 09:00</p>
            </div>
            <span id="status2027" class="status-pill">倒计时中</span>
          </div>

          <div class="time-grid text-center">
            <div class="time-box primary-day px-2 py-4">
              <p id="d2027" class="main-num num text-3xl font-black text-slate-950 sm:text-4xl">000</p>
              <p class="time-label">天</p>
            </div>
            <div class="time-box px-2 py-4">
              <p id="h2027" class="main-num num text-3xl font-black text-slate-950 sm:text-4xl">00</p>
              <p class="time-label">时</p>
            </div>
            <div class="time-box px-2 py-4">
              <p id="m2027" class="main-num num text-3xl font-black text-slate-950 sm:text-4xl">00</p>
              <p class="time-label">分</p>
            </div>
            <div class="time-box second-box px-2 py-4" style="--ring-color: #2f67d8;">
              <div class="second-wrap">
                <span id="ring2027" class="second-ring" aria-hidden="true"></span>
                <p id="s2027" class="second-num num text-3xl font-black text-slate-950 sm:text-4xl" aria-label="秒">00</p>
              </div>
              <p class="time-label">秒</p>
            </div>
          </div>
        </article>

        <article class="count-card secondary p-5 pl-6 sm:p-6 sm:pl-7">
          <div class="card-head mb-5 flex flex-wrap items-start justify-between gap-3">
            <div>
              <h2 class="text-2xl font-black text-slate-900">2026 高考</h2>
              <p class="mt-1 text-sm text-slate-500">目标时间：2026-06-07 09:00</p>
            </div>
            <span id="status2026" class="status-pill">倒计时中</span>
          </div>

          <div class="time-grid text-center">
            <div class="time-box primary-day px-2 py-4">
              <p id="d2026" class="main-num num text-3xl font-black text-slate-950 sm:text-4xl">000</p>
              <p class="time-label">天</p>
            </div>
            <div class="time-box px-2 py-4">
              <p id="h2026" class="main-num num text-3xl font-black text-slate-950 sm:text-4xl">00</p>
              <p class="time-label">时</p>
            </div>
            <div class="time-box px-2 py-4">
              <p id="m2026" class="main-num num text-3xl font-black text-slate-950 sm:text-4xl">00</p>
              <p class="time-label">分</p>
            </div>
            <div class="time-box second-box px-2 py-4" style="--ring-color: #c87525;">
              <div class="second-wrap">
                <span id="ring2026" class="second-ring" aria-hidden="true"></span>
                <p id="s2026" class="second-num num text-3xl font-black text-slate-950 sm:text-4xl" aria-label="秒">00</p>
              </div>
              <p class="time-label">秒</p>
            </div>
          </div>
        </article>
      </section>

      <p class="hint-card mt-6 px-4 py-3 text-center text-sm leading-6">
        仅供时间参考，具体考试安排请以官方公布为准。
      </p>

      <nav class="nav-grid mt-5" aria-label="高考数据导航">
        <a href="/fenxi" class="nav-link">辽宁物理类高考志愿初选工具</a>
        <a href="./liaoning.html" class="nav-link">辽宁学科评估</a>
        <a href="./zy.html" class="nav-link">辽宁投档数据</a>
        <a href="./ln2025.html" class="nav-link">2025 报考观察</a>
        <a href="./lngk.html" class="nav-link">专业难度观察</a>
        <a href="./gaokao-confusable-major-guide.html" class="nav-link">易混专业指北</a>
      </nav>
    </section>
  </main>

  <script>
    const CONFIG = {
      2027: new Date("2027-06-07T09:00:00+08:00"),
      2026: new Date("2026-06-07T09:00:00+08:00")
    };

    const beijingFormatter = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    const beijingPartsFormatter = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    function pad(value, length = 2) {
      return String(value).padStart(length, "0");
    }

    function setText(id, value) {
      const element = document.getElementById(id);
      if (element) {
        element.textContent = value;
      }
    }

    function getBeijingTimeParts(date) {
      const parts = beijingPartsFormatter.formatToParts(date);
      const map = {};
      for (const part of parts) {
        if (part.type !== "literal") {
          map[part.type] = Number(part.value);
        }
      }
      return map;
    }

    function setSecondText(year, value) {
      const element = document.getElementById(`s${year}`);
      const ring = document.getElementById(`ring${year}`);

      if (!element) {
        return;
      }

      const nextValue = String(value);
      if (element.textContent === nextValue) {
        return;
      }

      element.classList.remove("is-ticking");
      void element.offsetWidth;

      element.textContent = nextValue;
      element.classList.add("is-ticking");

      window.setTimeout(() => {
        element.classList.remove("is-ticking");
      }, 180);

      if (ring) {
        const secondNumber = Number(nextValue);
        const progress = ((secondNumber + 1) / 60) * 100;
        ring.style.setProperty("--second-progress", `${progress.toFixed(2)}%`);
      }
    }

    function renderYear(year) {
      const now = new Date();
      const target = CONFIG[year];
      const diff = target - now;
      const status = document.getElementById(`status${year}`);

      if (diff <= 0) {
        setText(`d${year}`, "000");
        setText(`h${year}`, "00");
        setText(`m${year}`, "00");
        setSecondText(year, "00");
        if (status) {
          status.textContent = "已开始";
        }
        return;
      }

      const oneSecond = 1000;
      const oneMinute = oneSecond * 60;
      const oneHour = oneMinute * 60;
      const oneDay = oneHour * 24;

      const days = Math.floor(diff / oneDay);
      const hours = Math.floor((diff % oneDay) / oneHour);
      const minutes = Math.floor((diff % oneHour) / oneMinute);
      const seconds = Math.floor((diff % oneMinute) / oneSecond);

      setText(`d${year}`, pad(days, 3));
      setText(`h${year}`, pad(hours));
      setText(`m${year}`, pad(minutes));
      setSecondText(year, pad(seconds));

      if (status) {
        if (days <= 7) {
          status.textContent = "最后一周";
        } else if (days <= 30) {
          status.textContent = "冲刺阶段";
        } else if (days <= 100) {
          status.textContent = "百日内";
        } else {
          status.textContent = "倒计时中";
        }
      }
    }

    function renderNow() {
      const now = new Date();
      const parts = getBeijingTimeParts(now);
      const seconds = parts.hour * 3600 + parts.minute * 60 + parts.second;
      const progress = (seconds / 86400) * 100;

      setText("nowText", beijingFormatter.format(now));
      setText("dayProgressText", `今日进度 ${progress.toFixed(1)}%`);

      const dayProgress = document.getElementById("dayProgress");
      if (dayProgress) {
        dayProgress.style.width = `${progress.toFixed(2)}%`;
      }
    }

    function tick() {
      renderYear(2027);
      renderYear(2026);
      renderNow();
    }

    function startClock() {
      tick();
      const delay = 1000 - (Date.now() % 1000);
      window.setTimeout(() => {
        tick();
        window.setInterval(tick, 1000);
      }, delay);
    }

    startClock();
  </script>
</body>
</html>
