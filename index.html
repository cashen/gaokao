<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高考倒计时 · 2027 / 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .link-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: nowrap;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 4px 4px;
      -webkit-overflow-scrolling: touch;
    }

    .link-bar::-webkit-scrollbar {
      display: none;
    }

    .nav-link {
      font-size: 14px;
      color: #2563eb;
      text-decoration: underline;
      text-underline-offset: 3px;
      flex: 0 0 auto;
    }

    .nav-link:hover {
      color: #1e40af;
    }

    @media (max-width: 640px) {
      .link-bar {
        justify-content: flex-start;
        gap: 14px;
        padding-left: 2px;
        padding-right: 2px;
      }

      .nav-link {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="max-w-5xl mx-auto px-4 py-8 sm:py-12">
    <header class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold">高考倒计时</h1>
      <p class="mt-2 text-slate-600">2027 与 2026 高考时间提醒</p>
    </header>

    <section class="grid md:grid-cols-2 gap-4 sm:gap-6">
      <article class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-slate-800">2027 高考</h2>
          <span class="text-xs text-slate-500">2027/06/07 09:00</span>
        </div>

        <div class="grid grid-cols-4 gap-2 text-center">
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="d2027" class="num text-2xl font-bold">000</p>
            <p class="text-xs text-slate-500">天</p>
          </div>
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="h2027" class="num text-2xl font-bold">00</p>
            <p class="text-xs text-slate-500">时</p>
          </div>
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="m2027" class="num text-2xl font-bold">00</p>
            <p class="text-xs text-slate-500">分</p>
          </div>
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="s2027" class="num text-2xl font-bold">00</p>
            <p class="text-xs text-slate-500">秒</p>
          </div>
        </div>
      </article>

      <article class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-6 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-slate-800">2026 高考</h2>
          <span class="text-xs text-slate-500">2026/06/07 09:00</span>
        </div>

        <div class="grid grid-cols-4 gap-2 text-center">
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="d2026" class="num text-2xl font-bold">000</p>
            <p class="text-xs text-slate-500">天</p>
          </div>
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="h2026" class="num text-2xl font-bold">00</p>
            <p class="text-xs text-slate-500">时</p>
          </div>
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="m2026" class="num text-2xl font-bold">00</p>
            <p class="text-xs text-slate-500">分</p>
          </div>
          <div class="rounded-lg bg-slate-50 py-3">
            <p id="s2026" class="num text-2xl font-bold">00</p>
            <p class="text-xs text-slate-500">秒</p>
          </div>
        </div>
      </article>
    </section>

    <p class="text-center text-sm text-slate-500 mt-6">
      仅供时间参考，请以官方考试安排为准。
    </p>

    <nav class="link-bar mt-4" aria-label="高考数据导航">
      <a href="./liaoning.html" class="nav-link">辽宁省高考学科评估</a>
      <a href="./zy" class="nav-link">辽宁物理类 2024/2025 投档数据观察（高校口径）</a>
      <a href="./ln2025.html" class="nav-link">辽宁物理类 2025 报考观察（考生口径）</a>
      <a href="./lngk.html" class="nav-link">辽宁物理类 2025年专业难度观察（367-625）</a>
    </nav>
  </main>

  <script>
    const CONFIG = {
      2027: new Date("2027-06-07T09:00:00+08:00"),
      2026: new Date("2026-06-07T09:00:00+08:00")
    };

    function pad(value, length = 2) {
      return String(value).padStart(length, "0");
    }

    function renderYear(year) {
      const now = new Date();
      const target = CONFIG[year];
      const diff = target - now;

      const elements = {
        days: document.getElementById(`d${year}`),
        hours: document.getElementById(`h${year}`),
        minutes: document.getElementById(`m${year}`),
        seconds: document.getElementById(`s${year}`)
      };

      if (diff <= 0) {
        elements.days.textContent = "000";
        elements.hours.textContent = "00";
        elements.minutes.textContent = "00";
        elements.seconds.textContent = "00";
        return;
      }

      const oneSecond = 1000;
      const oneMinute = oneSecond * 60;
      const oneHour = oneMinute * 60;
      const oneDay = oneHour * 24;

      const days = Math.floor(diff / oneDay);
      const hours = Math.floor((diff % oneDay) / oneHour);
      const minutes = Math.floor((diff % oneHour) / oneMinute);
      const seconds = Math.floor((diff % oneMinute) / oneSecond);

      elements.days.textContent = pad(days, 3);
      elements.hours.textContent = pad(hours);
      elements.minutes.textContent = pad(minutes);
      elements.seconds.textContent = pad(seconds);
    }

    function tick() {
      renderYear(2027);
      renderYear(2026);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
