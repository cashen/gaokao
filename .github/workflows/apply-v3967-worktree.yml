name: Materialize v3967 governed files

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Recover archive and inspect TAR
        id: recover
        continue-on-error: true
        run: |
          set +e
          cat .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07 > /tmp/v3967-new.b64
          base64 --decode /tmp/v3967-new.b64 > /tmp/v3967-new.truncated.tar.xz
          xz -dc /tmp/v3967-new.truncated.tar.xz > /tmp/v3967-new.tar 2> /tmp/v3967-xz.err
          mkdir -p /tmp/v3967-probe
          tar -tvf /tmp/v3967-new.tar > /tmp/v3967-tar-list.txt 2> /tmp/v3967-tar-list.err
          tar_list_status=$?
          tar -xf /tmp/v3967-new.tar -C /tmp/v3967-probe 2> /tmp/v3967-tar-extract.err
          tar_extract_status=$?
          {
            echo '== xz error =='
            cat /tmp/v3967-xz.err
            echo '== recovered tar size =='
            wc -c /tmp/v3967-new.tar
            echo '== tar list status =='
            echo "$tar_list_status"
            echo '== tar list count =='
            wc -l /tmp/v3967-tar-list.txt
            echo '== tar entries =='
            cat /tmp/v3967-tar-list.txt
            echo '== tar list error =='
            cat /tmp/v3967-tar-list.err
            echo '== tar extract status =='
            echo "$tar_extract_status"
            echo '== extracted files =='
            find /tmp/v3967-probe -type f -printf '%s %p\n' | sort
            echo '== extracted count =='
            find /tmp/v3967-probe -type f | wc -l
            echo '== tar extract error =='
            cat /tmp/v3967-tar-extract.err
          } > .v3967-tar-diagnostic.txt
          cat .v3967-tar-diagnostic.txt
          test "$tar_list_status" -eq 0
          test "$tar_extract_status" -eq 0
          test "$(wc -l < /tmp/v3967-tar-list.txt)" -eq 54
          test "$(find /tmp/v3967-probe -type f | wc -l)" -eq 54

      - name: Commit TAR diagnostic on failure
        if: steps.recover.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v3967-tar-diagnostic.txt
          git commit -m 'diagnostic: identify incomplete v3967 TAR entry'
          git push origin HEAD:${{ github.head_ref }}
          exit 1

      - name: Materialize governed files
        if: steps.recover.outcome == 'success'
        run: |
          set -euxo pipefail
          cp -a /tmp/v3967-probe/. .
          rm -f .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07 .v3967-verify-diagnostic.txt .v3967-archive-diagnostic.txt .v3967-tar-diagnostic.txt

      - name: Verify governed release before commit
        if: steps.recover.outcome == 'success'
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3967.mjs
          node tools/audit-resource-execution-v3967.mjs
          node tools/audit-derived-assets-v3967.mjs
          node tools/audit-algorithm-parity-v3967.mjs
          node tools/audit-css-component-isolation-v3967.mjs
          node tools/audit-report-execution-v3967.mjs
          node tools/audit-three-year-rank-evidence-v3967.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          python3 tools/ln-2026/verify-generated-release-v3967.py
          python3 tools/ln-2026/verify-final-release-v10.py

      - name: Commit governed files
        if: steps.recover.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.9.67.0：补齐资源执行中心、算法与组件治理文件'
          git push origin HEAD:${{ github.head_ref }}
