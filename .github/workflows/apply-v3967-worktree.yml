name: Materialize v3967 governed files

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild verified full copy patch
        run: |
          set -euxo pipefail
          cat \
            .v3967-all-copy-00 \
            .v3967-all-copy-01 \
            .v3967-all-copy-02 \
            .v3967-all-copy-03a \
            .v3967-all-copy-03b \
            .v3967-all-copy-03c \
            .v3967-all-copy-03d > /tmp/v3967-all-copy.patch.xz.b64
          echo '2e077133f0439e2a3ffe76906311f8405529ca65d685a62c87e800bd60373fef  /tmp/v3967-all-copy.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/v3967-all-copy.patch.xz.b64 > /tmp/v3967-all-copy.patch.xz
          echo 'e523379d9a6319a8327708136237551c7f3d4a8dfbd431350dffcc75e72fe02a  /tmp/v3967-all-copy.patch.xz' | sha256sum -c -
          xz -t /tmp/v3967-all-copy.patch.xz
          xz -dc /tmp/v3967-all-copy.patch.xz > /tmp/v3967-all-copy.patch
          test "$(grep -c '^diff --git ' /tmp/v3967-all-copy.patch)" -eq 54

      - name: Apply complete governed worktree
        run: |
          set -euxo pipefail
          cat > /tmp/v3967-targets.txt <<'EOF'
          analysis/2026/three-year-rank-evidence-audit-v3967.json
          ln-rank/css/history-evidence.v3967_0.css
          ln-rank/css/ln-rank-workspace.v3967_0.css
          ln-rank/css/school-all-mode.v3967_0.css
          ln-rank/js/app-runtime.v3967_0.js
          ln-rank/js/app.v3967_0.js
          ln-rank/js/feature/diagnose/api.v3967_0.js
          ln-rank/js/feature/diagnose/controller.v3967_0.js
          ln-rank/js/feature/feishu/index.v3967_0.js
          ln-rank/js/feature/feishu/report-controller.v3967_0.js
          ln-rank/js/feature/major-pool/history-score-render.v3967_0.js
          ln-rank/js/feature/major-pool/index.v3967_0.js
          ln-rank/js/feature/major-pool/render.v3967_0.js
          ln-rank/js/feature/report/payload-builder.v3967_0.js
          ln-rank/js/feature/school-majors/school-all-mode.v3967_0.js
          ln-rank/js/feature/selection-pool/analysis.v3967_0.js
          ln-rank/js/feature/selection-pool/controller.v3967_0.js
          ln-rank/js/feature/selection-pool/index.v3967_0.js
          ln-rank/js/feature/selection-pool/store.v3967_0.js
          ln-rank/js/feature/trend/data.v3967_0.js
          ln-rank/js/feature/trend/index.v3967_0.js
          ln-rank/js/feature/trend/integration.v3967_0.js
          ln-rank/js/feature/trend/rules.v3967_0.js
          ln-rank/js/local-mainline/local-mainline-app.v3967_0.js
          ln-rank/js/major-difficulty-2026-core.v3967_0.js
          ln-rank/js/major-difficulty-2026.v3967_0.js
          ln-rank/js/selection-pool-runtime.v3967_0.js
          ln-rank/js/selection-pool.v3967_0.js
          ln-rank/js/ux/family-home.v3967_0.js
          ln-rank/js/workspace/family-card-presenter.v3967_0.js
          ln-rank/js/workspace/result-commit.v3967_0.js
          ln-rank/js/workspace/selection-workspace-orchestrator.v3967_0.js
          shared/algorithms/position/historical-rank-selection.v3967_0.js
          shared/algorithms/ranking/result-ranking.v3967_0.js
          shared/algorithms/trend/trend-interpretation.v3967_0.js
          shared/governance/derived-asset-trace.v3967_0.json
          shared/governance/resource-execution-contract.v3967_0.js
          shared/resources/auxiliary/liaoning-key-subjects.v3967_0.js
          shared/resources/release/release-presenter.v3967_0.js
          shared/resources/release/runtime-cache-contract.v3967_0.js
          shared/resources/trends/liaoning-major-trend.v3967_0.js
          shared/ui/component-registry.v3967_0.js
          tongxue/app/tongxue-runtime-v159-r3967.js
          tools/audit-algorithm-parity-v3967.mjs
          tools/audit-css-component-isolation-v3967.mjs
          tools/audit-derived-assets-v3967.mjs
          tools/audit-report-execution-v3967.mjs
          tools/audit-resource-execution-v3967.mjs
          tools/audit-three-year-rank-evidence-v3967.mjs
          tools/browser-resource-execution-v3967.mjs
          tools/build-derived-asset-trace-v3967.mjs
          tools/ln-2026/verify-final-release-v10.py
          tools/ln-2026/verify-generated-release-v3967.py
          zy2026/assets/zy2026.v3967_0.js
          EOF
          sed -i 's/^          //' /tmp/v3967-targets.txt
          while IFS= read -r path; do
            git rm -f --ignore-unmatch -- "$path"
            rm -f -- "$path"
          done < /tmp/v3967-targets.txt
          git apply --check --verbose /tmp/v3967-all-copy.patch
          git apply --binary --index --verbose /tmp/v3967-all-copy.patch
          while IFS= read -r path; do test -f "$path"; done < /tmp/v3967-targets.txt
          rm -f .v3967-* 

      - name: Verify governed release before commit
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3967.mjs
          node tools/audit-resource-execution-v3967.mjs
          node tools/audit-derived-assets-v3967.mjs
          node tools/audit-algorithm-parity-v3967.mjs
          node tools/audit-css-component-isolation-v3967.mjs
          node tools/audit-report-execution-v3967.mjs
          node tools/audit-three-year-rank-evidence-v3967.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          python3 tools/ln-2026/verify-generated-release-v3967.py
          python3 tools/ln-2026/verify-final-release-v10.py

      - name: Commit governed files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.9.67.0：补齐资源执行中心、算法与组件治理文件'
          git push origin HEAD:${{ github.head_ref }}
