name: Materialize v3967 governed files

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild transport archive
        run: |
          set -euxo pipefail
          cat .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07 > /tmp/v3967-new.b64
          base64 --decode /tmp/v3967-new.b64 > /tmp/v3967-new.truncated.tar.xz
          sha256sum /tmp/v3967-new.truncated.tar.xz

      - name: Recover validated XZ data block
        run: |
          set -euxo pipefail
          set +e
          xz -dc /tmp/v3967-new.truncated.tar.xz > /tmp/v3967-new.tar
          xz_status=$?
          set -e
          echo "original_xz_status=${xz_status}"
          test -s /tmp/v3967-new.tar
          tar -tf /tmp/v3967-new.tar | tee /tmp/v3967-new-files.txt
          test "$(wc -l < /tmp/v3967-new-files.txt)" -eq 54
          ! grep -E '(^/|(^|/)\.\.(/|$))' /tmp/v3967-new-files.txt
          test "$(sort /tmp/v3967-new-files.txt | uniq | wc -l)" -eq 54
          mkdir /tmp/v3967-probe
          tar -xf /tmp/v3967-new.tar -C /tmp/v3967-probe
          test "$(find /tmp/v3967-probe -type f | wc -l)" -eq 54
          xz -c -9 /tmp/v3967-new.tar > /tmp/v3967-new.repaired.tar.xz
          xz -t /tmp/v3967-new.repaired.tar.xz
          sha256sum /tmp/v3967-new.repaired.tar.xz

      - name: Materialize governed files
        run: |
          set -euxo pipefail
          tar -xf /tmp/v3967-new.tar
          rm -f .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07 .v3967-verify-diagnostic.txt .v3967-archive-diagnostic.txt

      - name: Verify governed release before commit
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3967.mjs
          node tools/audit-resource-execution-v3967.mjs
          node tools/audit-derived-assets-v3967.mjs
          node tools/audit-algorithm-parity-v3967.mjs
          node tools/audit-css-component-isolation-v3967.mjs
          node tools/audit-report-execution-v3967.mjs
          node tools/audit-three-year-rank-evidence-v3967.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          python3 tools/ln-2026/verify-generated-release-v3967.py
          python3 tools/ln-2026/verify-final-release-v10.py

      - name: Commit governed files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.9.67.0：补齐资源执行中心、算法与组件治理文件'
          git push origin HEAD:${{ github.head_ref }}
