name: Apply v3967 governed worktree

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild verified patch archive
        run: |
          set -euxo pipefail
          wc -c .v3967-patch-00 .v3967-patch-01
          git hash-object .v3967-patch-00
          git hash-object .v3967-patch-01
          cat .v3967-patch-00 .v3967-patch-01 | base64 --decode > /tmp/v3967.patch.xz
          echo '6880d4db487eb8f9ec1a33d56357aea40f6908303d6c3a6113795958e1a1fc36  /tmp/v3967.patch.xz' | sha256sum -c -
          xz -t /tmp/v3967.patch.xz
          xz -dc /tmp/v3967.patch.xz > /tmp/v3967.patch
          wc -c /tmp/v3967.patch

      - name: Check and apply governed patch
        run: |
          set -euxo pipefail
          git status --short
          if ! git apply --check --verbose /tmp/v3967.patch > /tmp/v3967-apply-check.log 2>&1; then
            cat /tmp/v3967-apply-check.log
            cp /tmp/v3967-apply-check.log .v3967-apply-diagnostic.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .v3967-apply-diagnostic.txt
            git commit -m 'diagnostic: capture v3967 patch conflict'
            git push origin HEAD:${{ github.head_ref }}
            exit 1
          fi
          git apply --binary --index --verbose /tmp/v3967.patch
          rm -f .v3967-patch-00 .v3967-patch-01 .v3967-apply-trigger .v3967-apply-diagnostic.txt

      - name: Verify governed release before commit
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3967.mjs
          node tools/audit-resource-execution-v3967.mjs
          node tools/audit-derived-assets-v3967.mjs
          node tools/audit-algorithm-parity-v3967.mjs
          node tools/audit-css-component-isolation-v3967.mjs
          node tools/audit-report-execution-v3967.mjs
          node tools/audit-three-year-rank-evidence-v3967.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          python3 tools/ln-2026/verify-generated-release-v3967.py
          python3 tools/ln-2026/verify-final-release-v10.py

      - name: Commit governed worktree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.9.67.0：升级全站资源执行中心与组件自适应治理'
          git push origin HEAD:${{ github.head_ref }}
