name: Diagnose v3967 governed release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run every governed audit and preserve results
        run: |
          set +e
          failures=0
          : > .v3967-audit-diagnostic.txt
          run_check() {
            echo "===== $* =====" | tee -a .v3967-audit-diagnostic.txt
            "$@" >> .v3967-audit-diagnostic.txt 2>&1
            status=$?
            echo "EXIT=$status" | tee -a .v3967-audit-diagnostic.txt
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_check node tools/audit-resource-execution-v3967.mjs
          run_check node tools/audit-derived-assets-v3967.mjs
          run_check node tools/audit-algorithm-parity-v3967.mjs
          run_check node tools/audit-css-component-isolation-v3967.mjs
          run_check node tools/audit-report-execution-v3967.mjs
          run_check node tools/audit-three-year-rank-evidence-v3967.mjs
          run_check node tools/verify-school-profile-center-v3957.mjs
          run_check node tools/verify-card-ai-2026-v3955.mjs
          run_check python3 tools/ln-2026/verify-generated-release-v3967.py
          run_check python3 tools/ln-2026/verify-final-release-v10.py
          echo "TOTAL_FAILURES=$failures" | tee -a .v3967-audit-diagnostic.txt
          cat .v3967-audit-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v3967-audit-diagnostic.txt
          git commit -m 'diagnostic: capture v3967 governed audit results'
          git push origin HEAD:${{ github.head_ref }}
          test "$failures" -eq 0
