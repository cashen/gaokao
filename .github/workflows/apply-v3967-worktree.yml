name: Materialize v3967 governed files

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild and inspect complete archive
        id: archive
        continue-on-error: true
        run: |
          set +e
          {
            echo '== source chunks =='
            find . -maxdepth 1 -name '.v3967-new-*' -type f -printf '%f %s\n' | sort
            find . -maxdepth 1 -name '.v3967-new-*' -type f -printf '%f\n' | sort | xargs cat > /tmp/v3967-new.b64
            echo '== combined base64 =='
            wc -c /tmp/v3967-new.b64
            sha256sum /tmp/v3967-new.b64
            base64 --decode /tmp/v3967-new.b64 > /tmp/v3967-new.tar.xz
            echo "base64_exit=$?"
            wc -c /tmp/v3967-new.tar.xz
            sha256sum /tmp/v3967-new.tar.xz
            echo '== xz test =='
            xz -tv /tmp/v3967-new.tar.xz
            echo "xz_exit=$?"
            echo '== archive list =='
            tar -tf /tmp/v3967-new.tar.xz > /tmp/v3967-new-list.txt
            echo "tar_exit=$?"
            wc -l /tmp/v3967-new-list.txt
            cat /tmp/v3967-new-list.txt
          } > .v3967-full-archive-diagnostic.txt 2>&1
          cat .v3967-full-archive-diagnostic.txt
          echo 'a885b9ee431c42685e417c185134f4aef4100ea70ffb7b2c2622b26c7292c47e  /tmp/v3967-new.tar.xz' | sha256sum -c -
          xz -t /tmp/v3967-new.tar.xz
          test "$(wc -l < /tmp/v3967-new-list.txt)" -eq 54

      - name: Save archive diagnostic
        if: steps.archive.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v3967-full-archive-diagnostic.txt
          git commit -m 'diagnostic: inspect complete v3967 archive'
          git push origin HEAD:${{ github.head_ref }}
          exit 1

      - name: Materialize governed files
        if: steps.archive.outcome == 'success'
        run: |
          set -euxo pipefail
          tar -xf /tmp/v3967-new.tar.xz
          rm -f .v3967-new-* .v3967-remain-* .v3967-tail-* .v3967-*-diagnostic.txt

      - name: Verify governed release before commit
        if: steps.archive.outcome == 'success'
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3967.mjs
          node tools/audit-resource-execution-v3967.mjs
          node tools/audit-derived-assets-v3967.mjs
          node tools/audit-algorithm-parity-v3967.mjs
          node tools/audit-css-component-isolation-v3967.mjs
          node tools/audit-report-execution-v3967.mjs
          node tools/audit-three-year-rank-evidence-v3967.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          python3 tools/ln-2026/verify-generated-release-v3967.py
          python3 tools/ln-2026/verify-final-release-v10.py

      - name: Commit governed files
        if: steps.archive.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.9.67.0：补齐资源执行中心、算法与组件治理文件'
          git push origin HEAD:${{ github.head_ref }}
