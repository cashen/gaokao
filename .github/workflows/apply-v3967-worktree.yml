name: Materialize v3967 governed files

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3967-resource-execution-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Diagnose archive assembly
        id: diagnose
        continue-on-error: true
        run: |
          set +e
          {
            echo '== chunk sizes =='
            wc -c .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07
            cat .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07 > /tmp/v3967-new.b64
            echo '== combined base64 =='
            wc -c /tmp/v3967-new.b64
            tail -c 160 /tmp/v3967-new.b64 | sed 's/./&/g'
            echo
            echo '== decode =='
            base64 --decode /tmp/v3967-new.b64 > /tmp/v3967-new.tar.xz
            echo "base64_exit=$?"
            wc -c /tmp/v3967-new.tar.xz
            sha256sum /tmp/v3967-new.tar.xz
            echo '== xz test =='
            xz -tv /tmp/v3967-new.tar.xz
            echo "xz_exit=$?"
            echo '== xz list =='
            xz --list --verbose /tmp/v3967-new.tar.xz
            echo "xz_list_exit=$?"
            echo '== decoded tail =='
            tail -c 128 /tmp/v3967-new.tar.xz | od -An -tx1
          } > .v3967-archive-diagnostic.txt 2>&1
          cat .v3967-archive-diagnostic.txt
          xz -t /tmp/v3967-new.tar.xz

      - name: Commit archive diagnostic on failure
        if: steps.diagnose.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .v3967-archive-diagnostic.txt
          git commit -m 'diagnostic: record v3967 archive assembly failure'
          git push origin HEAD:${{ github.head_ref }}
          exit 1

      - name: Validate TAR manifest
        if: steps.diagnose.outcome == 'success'
        run: |
          set -euxo pipefail
          xz -dc /tmp/v3967-new.tar.xz > /tmp/v3967-new.tar
          tar -tf /tmp/v3967-new.tar | tee /tmp/v3967-new-files.txt
          test "$(wc -l < /tmp/v3967-new-files.txt)" -eq 54
          ! grep -E '(^/|(^|/)\.\.(/|$))' /tmp/v3967-new-files.txt
          test "$(sort /tmp/v3967-new-files.txt | uniq | wc -l)" -eq 54

      - name: Materialize governed files
        if: steps.diagnose.outcome == 'success'
        run: |
          set -euxo pipefail
          tar -xf /tmp/v3967-new.tar
          rm -f .v3967-new-00 .v3967-new-01 .v3967-new-02 .v3967-new-03 .v3967-new-04 .v3967-new-05 .v3967-new-06 .v3967-new-07 .v3967-verify-diagnostic.txt .v3967-archive-diagnostic.txt

      - name: Verify governed release before commit
        if: steps.diagnose.outcome == 'success'
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3967.mjs
          node tools/audit-resource-execution-v3967.mjs
          node tools/audit-derived-assets-v3967.mjs
          node tools/audit-algorithm-parity-v3967.mjs
          node tools/audit-css-component-isolation-v3967.mjs
          node tools/audit-report-execution-v3967.mjs
          node tools/audit-three-year-rank-evidence-v3967.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          python3 tools/ln-2026/verify-generated-release-v3967.py
          python3 tools/ln-2026/verify-final-release-v10.py

      - name: Commit governed files
        if: steps.diagnose.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'v3.9.67.0：补齐资源执行中心、算法与组件治理文件'
          git push origin HEAD:${{ github.head_ref }}
