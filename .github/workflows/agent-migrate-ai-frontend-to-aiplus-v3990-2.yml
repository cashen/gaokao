name: Temporary migrate AI frontend to aiplus

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - '.github/workflows/agent-migrate-ai-frontend-to-aiplus-v3990-2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate frontend and harden human dialogue routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          ai=Path('ai'); plus=Path('aiplus')
          assert ai.is_dir()
          plus.mkdir(exist_ok=True)
          for src in ai.iterdir():
              if src.name!='index.html': shutil.copy2(src,plus/src.name)
          shutil.rmtree(ai)

          targets=[Path('aiplus/index.html'),Path('aiplus/app.v3990_1.js'),Path('shared/resources/release/current-release.js'),Path('shared/resources/release/site-runtime-contract.v3990_1.js'),Path('ln-rank/site-active-generation.v3990_1.json'),Path('tools/verify-ai-workspace-v3990_0.mjs'),Path('tools/verify-ai-workspace-v3990_1.mjs'),Path('tools/verify-aiplus-school-official-v3990_2.mjs'),Path('tools/verify-ai-school-history-bridge-v3992_2.mjs'),Path('tools/browser-ai-workspace-v3990_0.mjs'),Path('tools/browser-ai-workspace-v3990_1.mjs')]
          reps=[("'/ai/","'/aiplus/"),('"/ai/','"/aiplus/'),('../ai/','../aiplus/'),('ai/index.html','aiplus/index.html'),('ai/app.v3990_0.js','aiplus/app.v3990_0.js'),('ai/app.v3990_1.js','aiplus/app.v3990_1.js'),('ai/workspace.v3990_0.css','aiplus/workspace.v3990_0.css'),('ai/workspace.v3990_1.css','aiplus/workspace.v3990_1.css'),('ai/agent.v3992_0.css','aiplus/agent.v3992_0.css'),('ai/render.v3991_0.js','aiplus/render.v3991_0.js'),('ai/render.v3992_0.js','aiplus/render.v3992_0.js'),('ai/parent-starter.v3992_1.js','aiplus/parent-starter.v3992_1.js'),('}/ai/','}/aiplus/'),('/ai/?candidate=','/aiplus/?candidate=')]
          for p in targets:
              if not p.exists(): continue
              t=p.read_text(); old=t
              for a,b in reps:t=t.replace(a,b)
              if p==Path('tools/verify-ai-workspace-v3990_1.mjs'):
                  t=t.replace("assert.ok(html.includes('ai-human-advisor-agent-v3992_0'));assert.ok(html.includes('想到哪就继续问'));","assert.ok(html.includes('data-ai-advisor-generation=\"ai-human-advisor-agent-v3992_0\"'));assert.ok(html.includes('data-ai-plus=\"school-official-qa\"'));assert.ok(html.includes('先把学校看懂，再讨论孩子要不要去。'));")
              if t!=old:p.write_text(t)

          ci=Path('functions/_lib/ai/command-interpreter.js'); t=ci.read_text()
          old="const MAJOR_TERMS=Object.freeze(['计算机','软件工程','软件','数据科学','人工智能','电子信息','电气','自动化','通信','机械','能源','石油','化工','材料','冶金','土木','建筑','医学','临床医学','口腔医学','药学','护理','法学','师范','数学','物理','化学','生物','会计','金融','经济','工商管理','新闻','中文','外语','英语','农学','动物医学','食品']);"
          new="const MAJOR_TERMS=Object.freeze(['测控技术与仪器','计算机科学与技术','软件工程','计算机','计科','软工','软件','数据科学','人工智能','电子信息','电气','自动化','测控','通信','机械','能源','石油','化工','材料','冶金','土木','建筑','医学','临床医学','口腔医学','药学','护理','法学','师范','数学','物理','化学','生物','会计','金融','经济','工商管理','新闻','中文','外语','英语','农学','动物医学','食品']);\nconst MAJOR_ALIASES=Object.freeze({测控:'测控技术与仪器',计科:'计算机科学与技术',软工:'软件工程'});\nfunction normalizeMajorTerm(value){return MAJOR_ALIASES[value]||value;}"
          assert old in t; t=t.replace(old,new,1)
          t=t.replace("function positiveMajors(text){return unique(majorMentions(text).filter(x=>!x.negative).map(x=>x.term),8);}","function positiveMajors(text){return unique(majorMentions(text).filter(x=>!x.negative).map(x=>normalizeMajorTerm(x.term)),8);}",1)
