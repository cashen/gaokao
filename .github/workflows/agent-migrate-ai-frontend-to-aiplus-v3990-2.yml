name: Temporary migrate AI frontend to aiplus

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - '.github/workflows/agent-migrate-ai-frontend-to-aiplus-v3990-2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated migration patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/.agent-migrate-ai-frontend-to-aiplus-v3990_2.py
          python tools/.agent-aiplus-dialog-noise-fix-v3990_2.py
          python tools/.agent-aiplus-school-major-disambiguation-v3990_2.py
      - name: Audit removed frontend ownership
        shell: bash
        run: |
          set -euo pipefail
          test ! -e ai
          if git grep -nE "['\"]/ai/|\.\./ai/|\}/ai/|['\"(]ai/(index|app|workspace|agent|render|parent-starter)" -- ':!functions/api/ai/**' ':!functions/_lib/ai/**' ':!shared/ai/**' ':!.github/workflows/agent-migrate-ai-frontend-to-aiplus-v3990-2.yml' ':!tools/.agent-migrate-ai-frontend-to-aiplus-v3990_2.py' ':!tools/.agent-aiplus-dialog-noise-fix-v3990_2.py' ':!tools/.agent-aiplus-school-major-disambiguation-v3990_2.py' ':!.github/workflows/verify-ai-workspace-v3990_1.yml' ':!.github/workflows/verify-ln-2026-final.yml'; then
            echo 'stale /ai frontend reference found' >&2
            exit 1
          fi
          git diff --check
      - name: Verify AI Plus runtime and human dialogue
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check aiplus/app.v3990_0.js
          node --check aiplus/app.v3990_1.js
          node --check aiplus/render.v3991_0.js
          node --check aiplus/render.v3992_0.js
          node tools/verify-aiplus-school-official-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
      - name: Commit tested product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cashen'
          git config user.email '54cashen@gmail.com'
          git add -A ':!.github/workflows/agent-migrate-ai-frontend-to-aiplus-v3990-2.yml' ':!tools/.agent-migrate-ai-frontend-to-aiplus-v3990_2.py' ':!tools/.agent-aiplus-dialog-noise-fix-v3990_2.py' ':!tools/.agent-aiplus-school-major-disambiguation-v3990_2.py' ':!.github/workflows/verify-ai-workspace-v3990_1.yml' ':!.github/workflows/verify-ln-2026-final.yml'
          git commit -m 'refactor: consolidate AI frontend and harden human dialogue routing'
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
