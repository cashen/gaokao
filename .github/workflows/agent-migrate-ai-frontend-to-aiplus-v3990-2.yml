name: Temporary migrate AI frontend to aiplus

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - '.github/workflows/agent-migrate-ai-frontend-to-aiplus-v3990-2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move frontend ownership to aiplus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          ai = root / 'ai'
          plus = root / 'aiplus'
          assert ai.is_dir(), 'ai directory missing before migration'
          plus.mkdir(exist_ok=True)

          # Preserve every historical/static AI asset, but keep the AI Plus index as the only page entry.
          for src in ai.iterdir():
              if src.name == 'index.html':
                  continue
              dst = plus / src.name
              if dst.exists():
                  raise SystemExit(f'destination already exists: {dst}')
              shutil.copy2(src, dst)
          shutil.rmtree(ai)

          targets = [
              Path('aiplus/index.html'),
              Path('aiplus/app.v3990_1.js'),
              Path('shared/resources/release/current-release.js'),
              Path('shared/resources/release/site-runtime-contract.v3990_1.js'),
              Path('ln-rank/site-active-generation.v3990_1.json'),
              Path('tools/verify-ai-workspace-v3990_0.mjs'),
              Path('tools/verify-ai-workspace-v3990_1.mjs'),
              Path('tools/browser-ai-workspace-v3990_1.mjs'),
              Path('.github/workflows/verify-ai-workspace-v3990_1.yml'),
              Path('.github/workflows/verify-ln-2026-final.yml'),
          ]

          replacements = [
              ("'/ai/", "'/aiplus/"),
              ('"/ai/', '"/aiplus/'),
              ('../ai/', '../aiplus/'),
              ('ai/index.html', 'aiplus/index.html'),
              ('ai/app.v3990_1.js', 'aiplus/app.v3990_1.js'),
              ('ai/workspace.v3990_1.css', 'aiplus/workspace.v3990_1.css'),
              ('ai/agent.v3992_0.css', 'aiplus/agent.v3992_0.css'),
              ('ai/render.v3992_0.js', 'aiplus/render.v3992_0.js'),
              ('ai/parent-starter.v3992_1.js', 'aiplus/parent-starter.v3992_1.js'),
              ('}/ai/', '}/aiplus/'),
              ('/ai/?candidate=', '/aiplus/?candidate='),
          ]

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if path == Path('.github/workflows/verify-ai-workspace-v3990_1.yml'):
                  text = text.replace("      - 'ai/**'\n", '')
                  text = text.replace("^(ai/|aiplus/|", "^(aiplus/|")
              if text != original:
                  path.write_text(text)

          # AI Plus is now the only frontend owner; API namespaces remain /api/ai/*.
          assert not Path('ai').exists()
          idx = Path('aiplus/index.html').read_text()
          assert '/aiplus/workspace.v3990_1.css' in idx
          assert '/aiplus/agent.v3992_0.css' in idx
          assert '/aiplus/app.v3990_1.js' in idx
          assert 'href="/aiplus/"' in idx
          app = Path('aiplus/app.v3990_1.js').read_text()
          assert "from '/aiplus/render.v3992_0.js" in app
          assert "from '/aiplus/parent-starter.v3992_1.js" in app
          PY

          if git grep -nE "['\"]/ai/|\.\./ai/|\}/ai/" -- ':!functions/api/ai/**' ':!functions/_lib/ai/**' ':!shared/ai/**'; then
            echo 'Found stale frontend /ai/ reference after migration.' >&2
            exit 1
          fi
          test ! -e ai
          git diff --check
      - name: Verify AI Plus runtime after migration
        shell: bash
        run: |
          set -euo pipefail
          node --check aiplus/app.v3990_1.js
          node --check aiplus/render.v3992_0.js
          node --check aiplus/parent-starter.v3992_1.js
          node tools/verify-aiplus-school-official-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Commit tested migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cashen'
          git config user.email '54cashen@gmail.com'
          git add -A
          git status --short
          git commit -m 'refactor: make aiplus the only AI frontend directory'
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
