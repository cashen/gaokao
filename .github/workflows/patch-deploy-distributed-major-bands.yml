name: Patch distributed major-bands deploy contract

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/patch-deploy-distributed-major-bands.yml'

permissions:
  contents: write

jobs:
  patch-deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Synchronize distributed bucket-worker deploy checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/deploy-cloudflare-pages-main.yml')
          text=path.read_text()
          text=text.replace('static-major-bands-v3972-2', 'distributed-major-bands-buckets-v3972-2')
          text=text.replace(
              '          grep -q "loadMajorBandsStaticWindow" functions/api/major-bands.js\n'
              '          grep -q "build-time-static-score-index-request-scoped-buckets" functions/api/major-bands.js\n'
              '          if grep -Eq "streamFenxiChunkRecords|loadManifest|fetchFenxiJson" functions/api/major-bands.js; then\n'
              "            echo 'major-bands still references runtime admission chunk scanning'\n"
              '            exit 1\n'
              '          fi\n',
              '          grep -q "selectMajorBandsStaticBuckets" functions/_lib/major-bands-static-provider.js\n'
              '          grep -q "loadMajorBandsStaticBucket" functions/_lib/major-bands-static-provider.js\n'
              '          grep -q "processMajorBandsStaticBucket" functions/_lib/major-bands-bucket-engine.js\n'
              '          grep -q "major-bands-bucket-v3972_2" functions/api/major-bands-bucket.js\n'
              '          grep -q "selectMajorBandsStaticBuckets" functions/api/major-bands.js\n'
              '          grep -q "/api/major-bands-bucket" functions/api/major-bands.js\n'
              '          grep -q "distributed-bucket-workers" functions/api/major-bands.js\n'
              '          if grep -Eq "loadMajorBandsStaticWindow|streamFenxiChunkRecords|loadManifest|fetchFenxiJson" functions/api/major-bands.js; then\n'
              "            echo 'major-bands still performs multi-bucket or raw admission scanning in one Worker'\n"
              '            exit 1\n'
              '          fi\n'
          )
          text=text.replace(
              '          node --check functions/_lib/major-bands-static-provider.js\n'
              '          node --check functions/api/major-bands.js\n',
              '          node --check functions/_lib/major-bands-static-provider.js\n'
              '          node --check functions/_lib/major-bands-bucket-engine.js\n'
              '          node --check functions/api/major-bands-bucket.js\n'
              '          node --check functions/api/major-bands.js\n'
          )
          old="""          if(manifest.version!=='major-bands-static-v3972_2'||manifest.architecture!=='build-time-static-score-index') throw new Error('static major-bands contract');
          if(manifest.recordCount!==11628||!manifest.integrity?.completeEvaluation) throw new Error('static major-bands coverage');
          if(manifest.integrity.duplicateRecordCount!==0||manifest.integrity.unresolvedRecordCount!==0) throw new Error('static major-bands integrity');
          if(audit.indexBytes>15000000) throw new Error(`static major-bands budget ${audit.indexBytes}`);
"""
          new="""          if(manifest.version!=='major-bands-static-v3972_2'||manifest.architecture!=='build-time-static-score-index'||manifest.encoding!=='schema-row-array-atomic-v2') throw new Error('static major-bands contract');
          if(manifest.bucketSize!==5) throw new Error(`static major-bands bucket size ${manifest.bucketSize}`);
          if(manifest.recordCount!==11628||!manifest.integrity?.completeEvaluation||manifest.integrity.evaluatedRecordCount!==11628) throw new Error('static major-bands coverage');
          if(manifest.integrity.duplicateRecordCount!==0||manifest.integrity.unresolvedRecordCount!==0) throw new Error('static major-bands integrity');
          if(!Array.isArray(manifest.buckets)||manifest.buckets.length<60||manifest.buckets.reduce((sum,item)=>sum+Number(item.recordCount||0),0)!==11628) throw new Error('static major-bands bucket coverage');
          if(audit.indexBytes>8500000) throw new Error(`static major-bands budget ${audit.indexBytes}`);
          if(Math.max(...manifest.buckets.map(item=>Number(item.bytes||0)))>800000) throw new Error('static major-bands single bucket budget');
"""
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('deploy static audit block not found')
          required=[
              'distributed-major-bands-buckets-v3972-2',
              'major-bands-bucket-v3972_2',
              'selectMajorBandsStaticBuckets',
              'processMajorBandsStaticBucket',
              'schema-row-array-atomic-v2',
              'manifest.bucketSize!==5',
              '2>&1 | tee'
          ]
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit(f'deploy distributed contract missing: {missing}')
          if 'loadMajorBandsStaticWindow" functions/api/major-bands.js' in text:
              raise SystemExit('deploy contract still allows multi-bucket parent loading')
          path.write_text(text)
          PY
          git add .github/workflows/deploy-cloudflare-pages-main.yml
          if git diff --cached --quiet; then
            echo 'distributed deploy contract already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deploy): require distributed bounded score-bucket workers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
