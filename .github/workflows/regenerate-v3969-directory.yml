name: Regenerate v3969 admission directory

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3969-unified-school-query'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild deterministic admission directory
        run: |
          set -euo pipefail
          node tools/build-school-admission-directory-v3969.mjs
          node -e "const x=require('./shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json');if(x.generatorVersion!=='school-admission-directory-builder-v3969_0'||!x.schools.some(s=>s.officialName==='沈阳化工大学'))process.exit(1)"
          git diff --check
      - name: Commit deterministic directory
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: regenerate deterministic v3969 admission school directory'
          git push origin HEAD:${{ github.head_ref }}
