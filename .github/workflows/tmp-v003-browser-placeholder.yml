name: tmp v003 browser placeholder
on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths: ['.github/workflows/tmp-v003-browser-placeholder.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only placeholder contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-ai-workspace-v3990_1.mjs')
          s=p.read_text()
          old="assert(promptPlaceholder.includes('介绍下辽宁科技大学'),'AI Plus natural-language school placeholder missing');"
          new="assert(promptPlaceholder.includes('568分')&&promptPlaceholder.includes('普通家庭')&&promptPlaceholder.includes('怎么选'),'AI Plus parent decision placeholder missing');"
          if s.count(old)!=1: raise SystemExit(f'placeholder anchor count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check tools/browser-ai-workspace-v3990_1.mjs
          git diff --check
      - name: Commit browser contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-ai-workspace-v3990_1.mjs
          git commit -m 'test：同步 v0.03 家长决策输入提示合同'
          git push origin HEAD:agent/aiplus-parent-decision-v003
