name: Diagnose v3972.5 production surfaces

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose-production:
    if: github.event.pull_request.head.ref == 'verify/v3972-5-cache-production-20260802'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect live release and page markers
        run: |
          set -euo pipefail
          token="${GITHUB_SHA}-$(date +%s%N)"
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36'
          for base in 'https://gaokao-4y9.pages.dev' 'https://gaokao.powers.org.cn'; do
            label="$(printf '%s' "$base" | sed -E 's#https://##; s#[^a-zA-Z0-9]+#-#g')"
            release_file="/tmp/${label}-release.js"
            bot_page_file="/tmp/${label}-bot-ln-rank.html"
            browser_page_file="/tmp/${label}-browser-ln-rank.html"
            release_status="$(curl --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$release_file" -w '%{http_code}' "${base}/shared/resources/release/current-release.js?diagnose=${token}")"
            bot_page_status="$(curl --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$bot_page_file" -w '%{http_code}' "${base}/ln-rank/?diagnose=${token}")"
            browser_page_status="$(curl --silent --show-error --location --max-time 35 -A "$browser_ua" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' -H 'Accept-Language: zh-CN,zh;q=0.9,en;q=0.8' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o "$browser_page_file" -w '%{http_code}' "${base}/ln-rank/?diagnose-browser=${token}")"
            echo "BASE=${base} releaseStatus=${release_status} botPageStatus=${bot_page_status} browserPageStatus=${browser_page_status} releaseBytes=$(wc -c < "$release_file") botPageBytes=$(wc -c < "$bot_page_file") browserPageBytes=$(wc -c < "$browser_page_file")"
            for pattern in \
              "display: 'v3.9.72.5'" \
              "display: 'v3.9.72.2'" \
              "siteRuntimeGeneration: 'v3972_5'" \
              "asset: '3972_5'" \
              "majorBandsBucketCacheVersion: 'major-bands-bucket-cache-v3972_5'"; do
              if grep -Fq "$pattern" "$release_file"; then echo "release MATCH ${pattern}"; else echo "release MISS ${pattern}"; fi
            done
            for page_kind in bot browser; do
              page_file="/tmp/${label}-${page_kind}-ln-rank.html"
              for pattern in \
                'data-release="v3.9.72.5"' \
                'data-release="v3.9.72.2"' \
                'data-site-runtime-generation="v3972_5"'; do
                if grep -Fq "$pattern" "$page_file"; then echo "${page_kind}Page MATCH ${pattern}"; else echo "${page_kind}Page MISS ${pattern}"; fi
              done
              title="$(sed -n -E 's#.*<title>([^<]+)</title>.*#\1#Ip' "$page_file" | head -1 || true)"
              echo "${page_kind}Page title=${title:-missing}"
            done
          done

      - name: Upload surface samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3972-5-production-surface-samples
          path: |
            /tmp/*-release.js
            /tmp/*-ln-rank.html
          if-no-files-found: warn
          retention-days: 3
