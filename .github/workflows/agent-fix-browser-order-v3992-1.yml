name: Temporary browser journey ordering v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[browser-order-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep persistence journey adjacent to its seeded context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-ai-workspace-v3990_1.mjs'); text=p.read_text()
          old="await coreHumanJourney(page,device.name);await parentEntryUiJourney(page,device.name);await schoolHistoryAliasJourney(page,device.name);await scoreBandParentJourneys(page,device.name);await profilePersistence(page,device.name);await latestWins(page,device.name);"
          new="await coreHumanJourney(page,device.name);await profilePersistence(page,device.name);await parentEntryUiJourney(page,device.name);await schoolHistoryAliasJourney(page,device.name);await scoreBandParentJourneys(page,device.name);await latestWins(page,device.name);"
          if old not in text: raise SystemExit('browser journey order anchor missing')
          p.write_text(text.replace(old,new,1))
          PY
          node --check tools/browser-ai-workspace-v3990_1.mjs
      - name: Commit clean correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-agent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/agent-fix-browser-order-v3992-1.yml
          git add tools/browser-ai-workspace-v3990_1.mjs
          git commit -m 'test: keep profile persistence next to seeded conversation [browser-order-fixed]'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
