name: Temporary AIPLuS background direction contract proof

on:
  push:
    branches:
      - agent/tmp-aiplus-background-direction-contract
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tmp-aiplus-background-direction-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical contract patch
        run: python3 tools/tmp-aiplus-background-direction-contract.py
      - name: Inspect diff
        run: git diff --check && git status --short
      - name: Syntax check modified graph
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/background-resource-adapter.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/next-action-engine.js
          node --check functions/_lib/ai/answer-composer.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check aiplus/render.v3992_0.js
          node --check tools/verify-aiplus-aek-v001.mjs
          node --check tools/audit-aiplus-v002-ui.mjs
      - name: Run focused permanent gates
        run: |
          set -euo pipefail
          node tools/verify-aiplus-aek-v001.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-routing-grid-v001.mjs
          node tools/verify-aiplus-human-intent-matrix-v001.mjs
          node tools/verify-aiplus-school-topic-grid-v001.mjs
          node tools/verify-aiplus-major-topic-grid-v001.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-aiplus-v002-contract.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/audit-aiplus-v002-ui.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
      - name: Commit only tested product changes
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-aiplus-background-direction-contract.yml tools/tmp-aiplus-background-direction-contract.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/background-resource-adapter.js functions/_lib/ai/tool-registry.js functions/_lib/ai/next-action-engine.js functions/_lib/ai/answer-composer.js functions/_lib/ai/advisor-presentation.js aiplus/render.v3992_0.js tools/verify-aiplus-aek-v001.mjs tools/audit-aiplus-v002-ui.mjs
          git commit -m 'Fix background directions vs admissions majors [skip ci]'
          git push origin HEAD:agent/tmp-aiplus-background-direction-contract
