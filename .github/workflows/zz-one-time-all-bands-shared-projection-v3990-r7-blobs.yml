name: Materialize verified all-bands shared projection blobs v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-all-bands-shared-projection-v3990-r7-blobs.yml'

permissions:
  contents: write

jobs:
  materialize-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact verified patch
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/zz-one-time-all-bands-shared-projection-v3990.yml', aliases: true)
          steps = workflow.fetch('jobs').fetch('patch-and-verify').fetch('steps')
          patch = steps.find { |step| step['name'] == 'Patch one-pass all-bands shared projection' }
          raise 'base patch step missing' unless patch && patch['run']
          File.write('/tmp/v3990-shared-patch-full.sh', patch.fetch('run'))
          RUBY

          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/v3990-shared-patch-full.sh').read_text(encoding='utf-8')
          function_anchor = "def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one anchor, got {count}')\n    return text.replace(old, new, 1)\n"
          function_patch = function_anchor + "\ndef replace_first(text, old, new, label):\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f'{label}: expected at least one anchor, got {count}')\n    return text.replace(old, new, 1)\n"
          if source.count(function_anchor) != 1:
              raise SystemExit(f'replace helper anchor count={source.count(function_anchor)}')
          source = source.replace(function_anchor, function_patch, 1)
          call_anchor = "verifier = replace_once(\n    verifier,\n    \"  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\\n\",\n"
          call_patch = "verifier = replace_first(\n    verifier,\n    \"  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\\n\",\n"
          if source.count(call_anchor) != 1:
              raise SystemExit(f'hit call anchor count={source.count(call_anchor)}')
          source = source.replace(call_anchor, call_patch, 1)
          aggregate_anchor = "      aggregate: allBandsShared.processed.stats,\\n      keywordQuery: allBandsShared.processed.keywordQuery,\\n"
          aggregate_patch = "      aggregate: {\\n        ...allBandsShared.processed.stats,\\n        requestedBand,\\n        sortPasses: ordered.length > 1 ? 1 : 0\\n      },\\n      keywordQuery: allBandsShared.processed.keywordQuery,\\n"
          if source.count(aggregate_anchor) != 1:
              raise SystemExit(f'band aggregate anchor count={source.count(aggregate_anchor)}')
          source = source.replace(aggregate_anchor, aggregate_patch, 1)
          marker = "\nnode --check functions/api/major-bands.js\n"
          if marker not in source:
              raise SystemExit('post-patch audit marker absent')
          patch_only = source.split(marker, 1)[0] + "\n"
          Path('/tmp/v3990-shared-patch-only.sh').write_text(patch_only, encoding='utf-8')
          PY

          bash /tmp/v3990-shared-patch-only.sh
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          ruby -e "require 'yaml'; ['.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml','.github/workflows/verify-production-api-health-v3971.yml'].each { |f| YAML.load_file(f, aliases: true) }"
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs >/tmp/v3990-shared-cache-audit.json
          git diff --check

      - name: Create GitHub blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            functions/api/major-bands.js
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs
            tools/audit-major-bands-query-execution-cache-v3990_0.mjs
            .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml
            .github/workflows/verify-production-api-health-v3971.yml
          )
          echo '{"base":"'"$GITHUB_SHA"'","files":{}}' >/tmp/v3990-shared-blobs.json
          for file in "${files[@]}"; do
            payload="$(jq -n --arg content "$(base64 -w0 "$file")" '{content:$content,encoding:"base64"}')"
            response="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              -d "$payload")"
            sha="$(jq -r '.sha // empty' <<<"$response")"
            test -n "$sha"
            tmp="$(mktemp)"
            jq --arg file "$file" --arg sha "$sha" '.files[$file]=$sha' /tmp/v3990-shared-blobs.json >"$tmp"
            mv "$tmp" /tmp/v3990-shared-blobs.json
          done
          cat /tmp/v3990-shared-blobs.json

      - name: Upload blob manifest
        uses: actions/upload-artifact@v4
        with:
          name: v3990-all-bands-shared-projection-blobs
          path: |
            /tmp/v3990-shared-blobs.json
            /tmp/v3990-shared-cache-audit.json
          if-no-files-found: error
          retention-days: 7
