name: tmp AIPLuS FDW next action contract

on:
  push:
    branches: [agent/aiplus-family-decision-workbench]
    paths: ['.github/workflows/tmp-aiplus-fdw-next-action-contract.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-family-decision-workbench
          fetch-depth: 0
      - name: Apply checked verifier patcher
        run: |
          node --check tools/tmp-aiplus-fdw-next-action-contract.mjs
          node tools/tmp-aiplus-fdw-next-action-contract.mjs
      - name: Prove upgraded contracts
        run: |
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node --check tools/verify-aiplus-family-decision-workbench-v003.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-aiplus-family-decision-workbench-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
      - name: Commit permanent verifiers and remove construction files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-aiplus-fdw-next-action-contract.yml tools/tmp-aiplus-fdw-next-action-contract.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/verify-ai-workspace-v3990_1.mjs tools/verify-aiplus-family-decision-workbench-v003.mjs
          git commit -m 'test(aiplus): lock family decision next-action ownership'
          git push origin HEAD:agent/aiplus-family-decision-workbench
