name: Temporary deterministic AI short-circuit v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[deterministic-shortcircuit-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic interpreter short-circuit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/ai/command-interpreter.js'); text=p.read_text()
          old="export async function interpretAiCommand(text,workspace={},env={}){\n  const fallback=deterministicBase(text,workspace);\n  if(fallback.agentTask==='fact_rank_lookup'&&fallback.score&&!fallback.mentorProfile?.enabled)return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[]}};\n  const provider=await runAiProvider(env,promptMessages(text,workspace,fallback),{maxTokens:650,reasoningEffort:'low'});"
          new="export function shouldShortCircuitAiProvider(command={}){return Boolean(command?.taskLocked&&!command?.requiresConfirmation&&Number(command?.confidence||0)>=.9);}\nexport async function interpretAiCommand(text,workspace={},env={}){\n  const fallback=deterministicBase(text,workspace);\n  if(shouldShortCircuitAiProvider(fallback))return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[],skipped:true,skipReason:'high-confidence-task-locked'}};\n  if(fallback.agentTask==='fact_rank_lookup'&&fallback.score&&!fallback.mentorProfile?.enabled)return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[]}};\n  const provider=await runAiProvider(env,promptMessages(text,workspace,fallback),{maxTokens:650,reasoningEffort:'low'});"
          if old not in text: raise SystemExit('interpretAiCommand anchor missing')
          p.write_text(text.replace(old,new,1))
          p=Path('tools/verify-ai-workspace-v3990_1.mjs'); text=p.read_text()
          old_import="import { deterministicCommand,interpretAiCommand } from '../functions/_lib/ai/command-interpreter.js';"
          new_import="import { deterministicCommand,interpretAiCommand,shouldShortCircuitAiProvider } from '../functions/_lib/ai/command-interpreter.js';"
          if old_import not in text: raise SystemExit('command import anchor missing')
          text=text.replace(old_import,new_import,1)
          marker='async function testModelCanCorrectTaskNotFacts(){'
          insert="async function testLockedCommandsSkipProvider(){let calls=0;const workspace=createAiWorkspace({examContext:{score:440},activeView:{score:440,regionKeys:['ln'],majorKeywords:[],schoolNames:[],bottomLineMode:'all'}});const deterministic=deterministicCommand('中外合作也可以，预算可以上浮',workspace);assert.equal(deterministic.agentTask,'candidate_refinement');assert.equal(deterministic.bottomLineMode,'public_include_sino');assert.equal(shouldShortCircuitAiProvider(deterministic),true);const result=await interpretAiCommand('中外合作也可以，预算可以上浮',workspace,{AI_PROVIDER:'workers-ai',AI_WORKSPACE_MODEL:DEFAULT_WORKERS_AI_MODEL,AI:{run:async()=>{calls++;throw new Error('locked deterministic command must not call model');}}});assert.equal(calls,0);assert.equal(result.command.agentTask,'candidate_refinement');assert.equal(result.provider.skipped,true);const history=deterministicCommand('沈航的电气呢',createAiWorkspace({examContext:{score:580},agentContext:{currentTask:'school_major_history',focus:{school:'沈阳工业大学',major:'电气'}}}));assert.equal(shouldShortCircuitAiProvider(history),true);}\n\n"
          if marker not in text: raise SystemExit('model test marker missing')
          text=text.replace(marker,insert+marker,1)
          old_calls='testCandidatePatchJourney();testTaskSwitchAndReference();testBackgroundTasks();testExplicitContextPolicy();testGeoAndDelta();testWorkspaceMigrationAndMemory();await testModelCanCorrectTaskNotFacts();'
          new_calls='testCandidatePatchJourney();testTaskSwitchAndReference();testBackgroundTasks();testExplicitContextPolicy();testGeoAndDelta();testWorkspaceMigrationAndMemory();await testLockedCommandsSkipProvider();await testModelCanCorrectTaskNotFacts();'
          if old_calls not in text: raise SystemExit('test call anchor missing')
          p.write_text(text.replace(old_calls,new_calls,1))
          PY
          node --check functions/_lib/ai/command-interpreter.js
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-agent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/agent-fix-deterministic-shortcircuit-v3992-1.yml
          git add functions/_lib/ai/command-interpreter.js tools/verify-ai-workspace-v3990_1.mjs
          git commit -m 'v3.9.90.1：确定性任务短路模型释放 Worker 预算 v3992_1 [deterministic-shortcircuit-fixed]'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
