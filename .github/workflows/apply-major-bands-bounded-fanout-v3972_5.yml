name: Apply major-bands bounded fanout v3972.5

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/major-bands-bounded-fanout-v3972-5'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded fanout and verify contracts
        run: |
          set -euo pipefail
          python3 tools/apply-major-bands-bounded-fanout-v3972_5.py
          node --check functions/api/major-bands.js
          node --check functions/_lib/major-bands-bucket-orchestrator.v3972_5.js
          node --experimental-default-type=module tools/audit-major-bands-bounded-fanout-v3972_5.mjs
          node --experimental-default-type=module tools/audit-canonical-release-version-v3972_5.mjs
          node --experimental-default-type=module tools/audit-site-runtime-generation-v3972_5.mjs
          python3 tools/ln-2026/verify-final-release-v3970.py

          git diff --name-only | tee /tmp/major-bands-bounded-fanout-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/major-bands-bounded-fanout-files.txt; then
            echo 'protected path changed'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/api/major-bands.js \
            shared/resources/release/current-release.js \
            shared/governance/resource-execution-contract.v3972_5.js \
            docs/skills/unified-site-release/SKILL.md
          git commit -m 'fix(major-bands): bound child Worker fanout and retry transients'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
