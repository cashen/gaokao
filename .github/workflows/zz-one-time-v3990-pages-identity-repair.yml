name: One-time v3990 Pages identity repair

on:
  push:
    branches:
      - agent/pages-git-identity-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-pages-identity-repair.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pages-git-identity-v3990_0
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact Pages identity verifier
        run: python3 tools/zz_patch_v3990_pages_identity.py
      - name: Verify source contracts and exact Preview SHA
        env:
          PAGES_BASE: https://agent-pages-git-identity-v39.gaokao-4y9.pages.dev
          CUSTOM_BASE: https://agent-pages-git-identity-v39.gaokao-4y9.pages.dev
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYMENT_BRANCH: agent/pages-git-identity-v3990_0
          VERIFY_MAJOR_BANDS: 'false'
          PRODUCTION_RESOURCE_ATTEMPTS: '45'
          PRODUCTION_RESOURCE_WAIT_MS: '10000'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-pages-identity-preview.json
        run: |
          set -euo pipefail
          node --check functions/api/pages-deployment-identity.js
          node --check tools/verify-production-resource-graph-v3990_0.mjs
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-canonical-release-version-v3990_0.mjs
          node tools/audit-site-runtime-generation-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          node tools/verify-production-resource-graph-v3990_0.mjs \
            2>&1 | tee /tmp/v3990-pages-identity-preview.log
      - name: Commit verified identity tools
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-production-resource-graph-v3990_0.mjs tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'fix(release): verify exact Cloudflare Pages deployment SHA'
          git push origin HEAD:agent/pages-git-identity-v3990_0
      - name: Upload identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-pages-deployment-identity
          path: |
            /tmp/v3990-pages-identity-preview.json
            /tmp/v3990-pages-identity-preview.log
          if-no-files-found: warn
          retention-days: 7
