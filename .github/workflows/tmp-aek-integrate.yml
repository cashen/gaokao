name: tmp-aek-integrate
on:
  push:
    branches:
      - agent/aiplus-authoritative-education-knowledge
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-authoritative-education-knowledge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply AEK integration patch
        run: node tools/tmp-aek-integrate.mjs
      - name: Commit integrated AEK runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "AEK: integrate knowledge runtime into canonical owners [skip ci]"
          git push origin HEAD:agent/aiplus-authoritative-education-knowledge
