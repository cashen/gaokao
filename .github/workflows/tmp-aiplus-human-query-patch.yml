name: TEMP AIPLuS human query patch

on:
  push:
    branches: [agent/aiplus-major-introduction-knowledge]
    paths:
      - '.github/workflows/tmp-aiplus-human-query-patch.yml'
      - 'tools/tmp-aiplus-human-query-patch.mjs'
      - 'tools/tmp-aiplus-human-topic-patch.mjs'
      - 'functions/_lib/ai/human-query-frame.js'
      - 'tools/verify-aiplus-routing-grid-v001.mjs'
      - 'tools/verify-aiplus-school-topic-grid-v001.mjs'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-major-introduction-knowledge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic routing patch
        run: |
          node tools/tmp-aiplus-human-query-patch.mjs
          node tools/tmp-aiplus-human-topic-patch.mjs
      - name: Verify patched graph
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/human-query-frame.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/api/ai/major-history.js
          node tools/verify-aiplus-routing-grid-v001.mjs
          node tools/verify-aiplus-school-topic-grid-v001.mjs
          node tools/verify-aiplus-human-intent-matrix-v001.mjs
          node tools/verify-aiplus-aek-v001.mjs
          node tools/verify-aiplus-aek-journeys-v001.mjs
          node tools/verify-aiplus-aek-human-language-v001.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
      - name: Commit patched canonical owners
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add functions/_lib/ai/human-query-frame.js functions/_lib/ai/command-interpreter.js functions/_lib/ai/agent-task-kernel.js functions/_lib/ai/tool-registry.js functions/_lib/ai/turn-orchestrator.js functions/api/ai/major-history.js tools/verify-aiplus-aek-v001.mjs tools/verify-aiplus-routing-grid-v001.mjs tools/verify-aiplus-school-topic-grid-v001.mjs .github/workflows/verify-aiplus-parent-decision-v003.yml
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AIPLuS: unify human routing slots and score windows'
          git push origin HEAD:agent/aiplus-major-introduction-knowledge
