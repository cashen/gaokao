name: Temporary CHSI Cloudflare runtime diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe branch Preview official-school endpoint
        shell: bash
        run: |
          set -euo pipefail
          base='https://agent-aiplus-school-official.gaokao-4y9.pages.dev'
          for attempt in $(seq 1 20); do
            code=$(curl -sS -o /tmp/aiplus-official.json -w '%{http_code}' --max-time 20 "$base/api/ai/school-official?school=%E8%BE%BD%E5%AE%81%E7%9F%B3%E6%B2%B9%E5%8C%96%E5%B7%A5%E5%A4%A7%E5%AD%A6&question=%E8%BF%99%E6%89%80%E5%AD%A6%E6%A0%A1%E6%98%AF%E4%BB%80%E4%B9%88%E5%AE%9A%E4%BD%8D" || true)
            echo "attempt=$attempt status=$code bytes=$(wc -c </tmp/aiplus-official.json 2>/dev/null || echo 0)"
            head -c 1200 /tmp/aiplus-official.json 2>/dev/null || true
            echo
            if [ "$code" = 200 ]; then exit 0; fi
            sleep 2
          done
          exit 1
