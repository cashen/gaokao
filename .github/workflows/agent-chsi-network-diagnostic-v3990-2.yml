name: Temporary CHSI Reader search-shape diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect school search result markdown
        shell: bash
        run: |
          set -euo pipefail
          target='https://gaokao.chsi.com.cn/sch/search.do?searchType=1&yxmc=%E8%BE%BD%E5%AE%81%E7%9F%B3%E6%B2%B9%E5%8C%96%E5%B7%A5%E5%A4%A7%E5%AD%A6&zymc=&sySsdm=&ssdm=&yxls=&yxlx=&xlcc=&bxlx='
          code=$(curl -sS -L -o /tmp/reader-body --max-time 30 -w '%{http_code}' -H 'Accept: text/plain' "https://r.jina.ai/$target" || true)
          echo "status=$code bytes=$(wc -c </tmp/reader-body 2>/dev/null || echo 0)"
          echo '--- exact school lines'
          grep -n -C 3 '辽宁石油化工大学' /tmp/reader-body || true
          echo '--- schoolInfo lines'
          grep -n -C 2 -E 'schoolInfo|schId-124|schId=124' /tmp/reader-body | head -120 || true
          echo '--- tail'
          tail -100 /tmp/reader-body
          [ "$code" = 200 ]
