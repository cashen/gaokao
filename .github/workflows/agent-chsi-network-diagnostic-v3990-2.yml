name: Temporary CHSI Reader link-summary diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Reader JSON links for school search
        shell: bash
        run: |
          set -euo pipefail
          target='https://gaokao.chsi.com.cn/sch/search.do?searchType=1&yxmc=%E8%BE%BD%E5%AE%81%E7%9F%B3%E6%B2%B9%E5%8C%96%E5%B7%A5%E5%A4%A7%E5%AD%A6&zymc=&sySsdm=&ssdm=&yxls=&yxlx=&xlcc=&bxlx='
          code=$(curl -sS -L -o /tmp/reader.json --max-time 30 -w '%{http_code}' \
            -H 'Accept: application/json' -H 'X-With-Links-Summary: all' -H 'X-Retain-Images: none' \
            "https://r.jina.ai/$target" || true)
          echo "status=$code bytes=$(wc -c </tmp/reader.json 2>/dev/null || echo 0)"
          python - <<'PY'
          import json
          p=json.load(open('/tmp/reader.json'))
          print('top_keys=',sorted(p.keys()) if isinstance(p,dict) else type(p).__name__)
          data=p.get('data',p) if isinstance(p,dict) else {}
          if isinstance(data,dict):
              print('data_keys=',sorted(data.keys()))
              print('url=',data.get('url'))
              print('title=',data.get('title'))
              links=data.get('links') or data.get('linksSummary') or []
              print('links_type=',type(links).__name__,'count=',len(links) if hasattr(links,'__len__') else '?')
              if isinstance(links,dict): items=list(links.items())
              elif isinstance(links,list): items=[(i,x) for i,x in enumerate(links)]
              else: items=[]
              for key,item in items:
                  s=json.dumps(item,ensure_ascii=False) if not isinstance(item,str) else item
                  if '辽宁石油化工大学' in s or 'schoolInfo' in s or 'schId' in s or '10148' in s:
                      print('MATCH',key,s[:1500])
              content=str(data.get('content',''))
              for line in content.splitlines():
                  if '辽宁石油化工大学' in line or '10148' in line:
                      print('CONTENT',line[:1500])
          PY
          [ "$code" = 200 ]
