name: Temporary CHSI Reader transport diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Jina Reader against CHSI public pages
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            'https://gaokao.chsi.com.cn/sch/search.do?searchType=1&yxmc=%E8%BE%BD%E5%AE%81%E7%9F%B3%E6%B2%B9%E5%8C%96%E5%B7%A5%E5%A4%A7%E5%AD%A6&zymc=&sySsdm=&ssdm=&yxls=&yxlx=&xlcc=&bxlx='
            'https://gaokao.chsi.com.cn/sch/schoolInfo--schId-124,categoryId-1167668,mindex-1.dhtml'
            'https://gaokao.chsi.com.cn/sch/schoolInfo--schId-179,categoryId-88121,mindex-4.dhtml'
          )
          ok=0
          for target in "${targets[@]}"; do
            url="https://r.jina.ai/$target"
            echo "--- target=$target"
            code=$(curl -sS -L -o /tmp/reader-body -D /tmp/reader-head --max-time 30 -w '%{http_code}' -H 'Accept: text/plain' "$url" || true)
            bytes=$(wc -c </tmp/reader-body 2>/dev/null || echo 0)
            echo "status=$code bytes=$bytes"
            head -c 1200 /tmp/reader-body 2>/dev/null || true
            echo
            if [ "$code" = 200 ] && grep -q '阳光高考' /tmp/reader-body; then ok=$((ok+1)); fi
          done
          echo "reader_successes=$ok"
          [ "$ok" -ge 2 ]
