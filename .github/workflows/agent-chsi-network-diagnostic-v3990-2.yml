name: Temporary CHSI URL locator diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve CHSI detail URLs from domain-limited public search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,urllib.parse,re,html
          for school in ['辽宁石油化工大学','东北石油大学','辽宁科技大学']:
              q=f'site:gaokao.chsi.com.cn/sch/schoolInfo {school}'
              url='https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)
              p=subprocess.run(['curl','-sS','-L','--max-time','25','-A','Mozilla/5.0','-H','Accept-Language: zh-CN,zh;q=0.9',url],capture_output=True,text=True)
              print('\n--- direct',school,'exit',p.returncode,'bytes',len(p.stdout))
              text=html.unescape(p.stdout)
              urls=[]
              for candidate in re.findall(r'(?:uddg=)?(https?%3A%2F%2Fgaokao\.chsi\.com\.cn%2Fsch%2FschoolInfo[^&"<>\s]+|https://gaokao\.chsi\.com\.cn/sch/schoolInfo[^"<>\s]+)',text,re.I):
                  u=urllib.parse.unquote(candidate)
                  if u not in urls: urls.append(u)
              print('URLS',urls[:20])
              for line in text.splitlines():
                  if school in line or 'gaokao.chsi.com.cn/sch/schoolInfo' in line: print('LINE',re.sub('<[^>]+>',' ',line)[:1800])
          PY
