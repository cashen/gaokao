name: Temporary CHSI Google locator diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve CHSI detail URLs from Google domain-limited search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,urllib.parse,re
          for school in ['辽宁石油化工大学','东北石油大学','辽宁科技大学']:
              q=f'site:gaokao.chsi.com.cn/sch/schoolInfo {school}'
              target='https://www.google.com/search?hl=zh-CN&num=10&q='+urllib.parse.quote(q)
              p=subprocess.run(['curl','-sS','-L','--max-time','35','-H','Accept: text/plain','https://r.jina.ai/'+target],capture_output=True,text=True)
              text=p.stdout
              print('\n---',school,'exit',p.returncode,'bytes',len(text))
              urls=[]
              for m in re.finditer(r'https://gaokao\.chsi\.com\.cn/sch/schoolInfo[^\s\)\]<>"\']+',text):
                  u=m.group(0).rstrip('.,;')
                  if u not in urls: urls.append(u)
              print('URLS=',urls[:20])
              for line in text.splitlines():
                  if school in line or 'gaokao.chsi.com.cn/sch/schoolInfo' in line: print('LINE',line[:1800])
          PY
