name: Temporary CHSI URL discovery diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover CHSI schoolInfo URLs through public search pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,urllib.parse,re
          schools=['辽宁石油化工大学','东北石油大学','辽宁科技大学']
          for school in schools:
              q=f'site:gaokao.chsi.com.cn/sch/schoolInfo {school}'
              bing='https://www.bing.com/search?q='+urllib.parse.quote(q)
              reader='https://r.jina.ai/'+bing
              p=subprocess.run(['curl','-sS','-L','--max-time','35','-H','Accept: text/plain',reader],capture_output=True,text=True)
              print('\n---',school,'exit=',p.returncode,'bytes=',len(p.stdout))
              if p.returncode: print(p.stderr[:300]); continue
              text=p.stdout
              urls=[]
              for m in re.finditer(r'https://gaokao\.chsi\.com\.cn/sch/schoolInfo[^\s\)\]<>"\']+',text):
                  u=m.group(0).replace('&amp;','&').rstrip('.,;')
                  if u not in urls: urls.append(u)
              print('CHSI_URLS=',urls[:20])
              for line in text.splitlines():
                  if school in line or ('gaokao.chsi.com.cn/sch/schoolInfo' in line): print('LINE',line[:1600])
          PY
