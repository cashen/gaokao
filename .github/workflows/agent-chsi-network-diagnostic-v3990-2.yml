name: Temporary CHSI frontend-resource diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Reader external resources and API hints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,json
          targets=[
            'https://gaokao.chsi.com.cn/sch/search--ss-on,option-qg,searchType-1,start-0.dhtml',
            'https://gaokao.chsi.com.cn/wap/sch/schinfomain/124'
          ]
          for target in targets:
              p=subprocess.run(['curl','-sS','-L','--max-time','30','-H','Accept: application/json','-H','X-With-Links-Summary: all','https://r.jina.ai/'+target],capture_output=True,text=True)
              print('\n--- target',target,'exit',p.returncode,'bytes',len(p.stdout))
              if p.returncode: print(p.stderr[:500]); continue
              data=json.loads(p.stdout).get('data',{})
              print('url=',data.get('url'),'title=',data.get('title'))
              ext=data.get('external')
              print('external_type=',type(ext).__name__)
              print(json.dumps(ext,ensure_ascii=False)[:12000])
              blob=json.dumps(data,ensure_ascii=False)
              for needle in ['api/','schId','yxmc','school','axios','ajax','10148']:
                  if needle in blob: print('HAS',needle)
          PY
