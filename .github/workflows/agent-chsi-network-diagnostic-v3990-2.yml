name: Temporary CHSI URL locator diagnostic v3990_2 r2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decode domain-limited search result links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,urllib.parse,re,html
          for school in ['辽宁石油化工大学','东北石油大学','辽宁科技大学']:
              q=f'site:gaokao.chsi.com.cn/sch/schoolInfo {school}'
              url='https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)
              p=subprocess.run(['curl','-sS','-L','--max-time','25','-A','Mozilla/5.0','-H','Accept-Language: zh-CN,zh;q=0.9',url],capture_output=True,text=True)
              text=html.unescape(p.stdout)
              print('\n---',school,'exit',p.returncode,'bytes',len(text))
              anchors=re.findall(r'<a[^>]+class="[^"]*result__a[^"]*"[^>]+href="([^"]+)"[^>]*>(.*?)</a>',text,re.I|re.S)
              print('result_anchors=',len(anchors))
              resolved=[]
              for href,title_html in anchors[:15]:
                  title=re.sub(r'<[^>]+>',' ',title_html); title=re.sub(r'\s+',' ',title).strip()
                  raw=html.unescape(href)
                  absolute=urllib.parse.urljoin('https://duckduckgo.com',raw)
                  parsed=urllib.parse.urlparse(absolute)
                  qs=urllib.parse.parse_qs(parsed.query)
                  dest=qs.get('uddg',[''])[0] if 'uddg' in qs else absolute
                  dest=urllib.parse.unquote(dest)
                  print('RESULT',title,'=>',dest[:1500])
                  if dest.startswith('https://gaokao.chsi.com.cn/sch/schoolInfo') and school in title:
                      resolved.append(dest)
              print('MATCHES=',resolved)
              if not resolved: print('NO_MATCH')
          PY
