name: Temporary CHSI charter-entity diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve school IDs from official charter index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.parse,subprocess,json,re
          schools=['辽宁石油化工大学','东北石油大学','辽宁科技大学']
          for school in schools:
              target='https://gaokao.chsi.com.cn/zsgs/zhangcheng/listVerifedZszc.do?method=index&yxmc='+urllib.parse.quote(school)
              reader='https://r.jina.ai/'+target
              p=subprocess.run(['curl','-sS','-L','--max-time','30','-H','Accept: application/json','-H','X-With-Links-Summary: all',reader],capture_output=True,text=True)
              print('\n---',school,'exit=',p.returncode,'bytes=',len(p.stdout))
              if p.returncode: print(p.stderr[:500]); continue
              data=json.loads(p.stdout).get('data',{})
              print('source=',data.get('url'),'title=',data.get('title'))
              blob=json.dumps(data.get('links',[]),ensure_ascii=False)+'\n'+str(data.get('content',''))
              matches=[]
              for m in re.finditer(r'https://gaokao\.chsi\.com\.cn/zsgs/zhangcheng/[^\s\)"\\]+',blob):
                  u=m.group(0)
                  if 'schId-' in u or 'schId=' in u:
                      matches.append(u)
              for u in list(dict.fromkeys(matches))[:12]: print('CHARTER',u)
              ids=re.findall(r'schId[-=](\d+)',blob)
              print('SCH_IDS=',list(dict.fromkeys(ids))[:20])
              for line in str(data.get('content','')).splitlines():
                  if school in line or '招生章程' in line and ('2026' in line or '2025' in line): print('CONTENT',line[:1200])
          PY
