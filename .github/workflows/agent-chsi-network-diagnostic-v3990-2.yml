name: Temporary CHSI charter HTML diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect charter index raw/rendered HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,urllib.parse,json,re
          for school in ['辽宁石油化工大学','东北石油大学','辽宁科技大学']:
              target='https://gaokao.chsi.com.cn/zsgs/zhangcheng/listVerifedZszc.do?method=index&yxmc='+urllib.parse.quote(school)
              p=subprocess.run(['curl','-sS','-L','--max-time','35','-H','Accept: application/json','-H','X-Respond-With: html','-H','X-No-Cache: true','https://r.jina.ai/'+target],capture_output=True,text=True)
              print('\n---',school,'exit=',p.returncode,'bytes=',len(p.stdout))
              if p.returncode: print(p.stderr[:300]); continue
              try: data=json.loads(p.stdout).get('data',{})
              except Exception as e: print('json_error',e,p.stdout[:500]); continue
              html=str(data.get('html') or data.get('content') or '')
              print('source=',data.get('url'),'title=',data.get('title'),'html_bytes=',len(html))
              for pattern in [r'schId[-=](\d+)',r'infoId[-=](\d+)',r'listVerifedZszc[^"\'<>\s]+',r'20(?:25|26)[^<]{0,80}招生章程']:
                  print('PATTERN',pattern,list(dict.fromkeys(re.findall(pattern,html)))[:40])
              at=html.find(school)
              if at>=0: print('CONTEXT',html[max(0,at-2500):at+7000])
          PY
