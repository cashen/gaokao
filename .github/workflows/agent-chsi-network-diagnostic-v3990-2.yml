name: Temporary CHSI cross-province card diagnostic v3990_2

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-chsi-network-diagnostic-v3990-2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Reader cards for cross-province schools
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,urllib.parse
          for school in ['东北石油大学','辽宁科技大学']:
              target='https://gaokao.chsi.com.cn/sch/search.do?searchType=1&yxmc='+urllib.parse.quote(school)+'&zymc=&sySsdm=&ssdm=&yxls=&yxlx=&xlcc=&bxlx='
              p=subprocess.run(['curl','-sS','-L','--max-time','35','-H','Accept: text/plain','https://r.jina.ai/'+target],capture_output=True,text=True)
              print('\n---',school,'exit=',p.returncode,'bytes=',len(p.stdout))
              text=p.stdout
              for line_no,line in enumerate(text.splitlines(),1):
                  if school in line or 'common/xh/' in line or '主管部门' in line or '满意度' in line:
                      print(f'{line_no}: {line[:1600]}')
              print('HEAD')
              print('\n'.join(text.splitlines()[:80]))
          PY
