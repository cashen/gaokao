name: Verify v3968 unified academic background development

on:
  push:
    branches:
      - agent/v3968-unified-academic-background

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify protected paths
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | tee /tmp/changed.txt
          ! grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/changed.txt
      - name: Verify JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            shared/resources/background/academic-background-contract.v3968_0.js \
            shared/resources/background/academic-background-source-registry.v3968_0.js \
            shared/algorithms/background/academic-background-matcher.v3968_0.js \
            shared/governance/resource-execution-contract.v3968_0.js \
            shared/resources/resource-registry.js \
            shared/resources/release/current-release.js \
            shared/resources/release/release-presenter.v3968_0.js \
            shared/algorithms/algorithm-registry.js \
            functions/_lib/academic-background-provider.js \
            functions/_lib/academic-background-api.js \
            functions/api/academic-background.js \
            functions/api/local-mainline.js \
            functions/api/211-mainline.js \
            ln-rank/js/academic-background/academic-background-app.v3968_0.js \
            tools/audit-academic-background-v3968.mjs
          do
            node --check "$file"
          done
      - name: Verify unified background execution
        run: node tools/audit-academic-background-v3968.mjs
      - name: Verify release contract compatibility
        run: |
          set -euo pipefail
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
