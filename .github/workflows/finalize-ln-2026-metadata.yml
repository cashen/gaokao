name: Finalize LN 2026 release metadata

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Finalize metadata and entry copy
        run: python3 tools/ln-2026/finalize-release-metadata.py
      - name: Validate metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in ('ln-rank/active-assets.json','ln-rank/release-meta.json'):
              data=json.loads(Path(path).read_text())
              assert data['version']=='v3.9.51.0'
              assert data['activeDataYear']==2026
              assert data['audienceYear']==2027
              assert data['centeredThreeYearTrendContract'] is True
          active=json.loads(Path('ln-rank/active-assets.json').read_text())
          assert 'js/app.v3951_0.js' in active['jsEntry']
          assert 'js/major-trend-render.v3951_0.js' in active['jsEntry']
          assert 'major-trend-2026.html' in active['html']
          PY
      - name: Commit final metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ln-rank/active-assets.json ln-rank/release-meta.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize LN 2026 release metadata [metadata-ln2026]"
            git push origin HEAD:${{ github.head_ref }}
          fi
