name: PR137 exact school cache

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - .github/workflows/pr137-exact-school-cache.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add bounded exact-school result reuse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('functions/_lib/ln-rank-manifest.js')
          s = p.read_text(encoding='utf-8')
          anchor = "const chunkCache = new Map();\nconst RECORD_START"
          replacement = """const chunkCache = new Map();
          const EXACT_SCHOOL_CACHE_TTL_MS = 45 * 1000;
          const EXACT_SCHOOL_CACHE_MAX_ENTRIES = 8;
          const EXACT_SCHOOL_CACHE_MAX_RECORDS = 800;
          const exactSchoolCache = new Map();
          let exactSchoolCacheRecordCount = 0;
          const RECORD_START"""
          assert s.count(anchor) == 1, 'cache constant anchor'
          s = s.replace(anchor, replacement)

          insert_anchor = "function findRecordsArrayStart(text) {"
          helpers = """function exactSchoolCacheKey(files = [], schoolNames = []) {
            const fileKey = [...new Set((Array.isArray(files) ? files : []).map(value => String(value || '').trim()).filter(Boolean))].sort().join('|');
            const schoolKey = [...new Set((Array.isArray(schoolNames) ? schoolNames : []).map(value => String(value || '').trim()).filter(Boolean))].sort().join('|');
            return `${fileKey}::${schoolKey}`;
          }

          function removeExactSchoolCacheEntry(key) {
            const entry = exactSchoolCache.get(key);
            if (!entry) return;
            exactSchoolCache.delete(key);
            exactSchoolCacheRecordCount = Math.max(0, exactSchoolCacheRecordCount - Number(entry.recordCount || 0));
          }

          function pruneExactSchoolCache(now = Date.now()) {
            for (const [key, entry] of exactSchoolCache) {
              if (now - Number(entry.time || 0) >= EXACT_SCHOOL_CACHE_TTL_MS) removeExactSchoolCacheEntry(key);
            }
          }

          function readExactSchoolCache(key) {
            pruneExactSchoolCache();
            const entry = exactSchoolCache.get(key);
            if (!entry) return null;
            exactSchoolCache.delete(key);
            exactSchoolCache.set(key, entry);
            return {
              records: entry.records.map(record => ({ ...record })),
              scanned: entry.scanned,
              chunkFiles: [...entry.chunkFiles],
              modes: [...entry.modes],
              cacheStatus: 'hit'
            };
          }

          function putExactSchoolCache(key, result) {
            const records = Array.isArray(result?.records) ? result.records : [];
            if (!key || !records.length || records.length > EXACT_SCHOOL_CACHE_MAX_RECORDS) return false;
            pruneExactSchoolCache();
            removeExactSchoolCacheEntry(key);
            while (
              exactSchoolCache.size >= EXACT_SCHOOL_CACHE_MAX_ENTRIES
              || exactSchoolCacheRecordCount + records.length > EXACT_SCHOOL_CACHE_MAX_RECORDS
            ) {
              const oldest = exactSchoolCache.keys().next().value;
              if (oldest === undefined) break;
              removeExactSchoolCacheEntry(oldest);
            }
            if (exactSchoolCacheRecordCount + records.length > EXACT_SCHOOL_CACHE_MAX_RECORDS) return false;
            const entry = {
              time: Date.now(),
              records: records.map(record => ({ ...record })),
              scanned: Number(result.scanned || 0),
              chunkFiles: Object.freeze([...(result.chunkFiles || [])]),
              modes: Object.freeze([...(result.modes || [])]),
              recordCount: records.length
            };
            exactSchoolCache.set(key, entry);
            exactSchoolCacheRecordCount += records.length;
            return true;
          }

          export function exactSchoolRecordCacheState() {
            pruneExactSchoolCache();
            return Object.freeze({
              ttlMs: EXACT_SCHOOL_CACHE_TTL_MS,
              maxEntries: EXACT_SCHOOL_CACHE_MAX_ENTRIES,
              maxRecords: EXACT_SCHOOL_CACHE_MAX_RECORDS,
              entries: exactSchoolCache.size,
              records: exactSchoolCacheRecordCount,
              bounded: exactSchoolCache.size <= EXACT_SCHOOL_CACHE_MAX_ENTRIES
                && exactSchoolCacheRecordCount <= EXACT_SCHOOL_CACHE_MAX_RECORDS
            });
          }

          export function clearExactSchoolRecordCacheForTest() {
            exactSchoolCache.clear();
            exactSchoolCacheRecordCount = 0;
          }

          """
          assert s.count(insert_anchor) == 1, 'helper insertion anchor'
          s = s.replace(insert_anchor, helpers + insert_anchor)

          start = "export async function loadExactSchoolRecordsFromFiles(request, env, files, schoolNames, predicate) {\n  const manifest = await loadManifest(request, env);"
          replacement = """export async function loadExactSchoolRecordsFromFiles(request, env, files, schoolNames, predicate) {
            const manifest = await loadManifest(request, env);"""
          assert s.count(start) == 1
          s = s.replace(start, replacement)
          requested_anchor = "  const requested = [...new Set((Array.isArray(files) ? files : []).filter(file => byFile.has(file)))];\n  const records = [];"
          requested_new = """  const requested = [...new Set((Array.isArray(files) ? files : []).filter(file => byFile.has(file)))];
            const cacheKey = exactSchoolCacheKey(requested, schoolNames);
            const cached = readExactSchoolCache(cacheKey);
            if (cached) return { manifest, ...cached };
            const records = [];"""
          assert s.count(requested_anchor) == 1
          s = s.replace(requested_anchor, requested_new)
          return_anchor = "  return { manifest, records, scanned, chunkFiles: requested, modes };\n}"
          return_new = """  const result = { records, scanned, chunkFiles: requested, modes, cacheStatus: 'miss' };
            putExactSchoolCache(cacheKey, result);
            return { manifest, ...result };
          }"""
          assert s.count(return_anchor) == 1
          s = s.replace(return_anchor, return_new)
          p.write_text(s, encoding='utf-8')

          p = Path('tools/verify-ai-school-history-bridge-v3992_2.mjs')
          s = p.read_text(encoding='utf-8')
          old_import = "import { loadMatchingRecordsFromFiles, loadExactSchoolRecordsFromFiles } from '../functions/_lib/ln-rank-manifest.js';"
          new_import = "import { loadMatchingRecordsFromFiles, loadExactSchoolRecordsFromFiles, clearExactSchoolRecordCacheForTest, exactSchoolRecordCacheState } from '../functions/_lib/ln-rank-manifest.js';"
          assert s.count(old_import) == 1
          s = s.replace(old_import, new_import)
          source_anchor = "assert.ok(manifestLoader.includes(\"mode: 'exact-school-native-text-scan'\"),'exact-school native text scan marker missing');"
          source_new = source_anchor + "\nassert.ok(manifestLoader.includes('EXACT_SCHOOL_CACHE_TTL_MS = 45 * 1000'),'exact-school server cache TTL missing');\nassert.ok(manifestLoader.includes('EXACT_SCHOOL_CACHE_MAX_ENTRIES = 8'),'exact-school server cache entry cap missing');\nassert.ok(manifestLoader.includes('EXACT_SCHOOL_CACHE_MAX_RECORDS = 800'),'exact-school server cache record cap missing');"
          assert s.count(source_anchor) == 1
          s = s.replace(source_anchor, source_new)
          s = s.replace("const env={ASSETS:{fetch:async request=>{", "let assetFetchCount=0;\nconst env={ASSETS:{fetch:async request=>{assetFetchCount+=1;", 1)
          try_anchor = "try{\n  const request=new Request('https://preview.example/api/school-majors');"
          try_new = "try{\n  clearExactSchoolRecordCacheForTest();\n  const request=new Request('https://preview.example/api/school-majors');"
          assert s.count(try_anchor) == 1
          s = s.replace(try_anchor, try_new)
          loop_end = "    assert.ok(exact.modes.length===schoolEntry.chunkFiles2026.length&&exact.modes.every(mode=>mode==='exact-school-native-text-scan'),`native exact-school fast path did not hold: ${schoolEntry.officialName} ${exact.modes.join(',')}`);\n  }\n  const allFiles=[...chunkFiles];"
          cache_test = """    assert.ok(exact.modes.length===schoolEntry.chunkFiles2026.length&&exact.modes.every(mode=>mode==='exact-school-native-text-scan'),`native exact-school fast path did not hold: ${schoolEntry.officialName} ${exact.modes.join(',')}`);
            if(schoolEntry===industrial){
              const beforeCacheHitFetches=assetFetchCount;
              const cached=await loadExactSchoolRecordsFromFiles(request,env,schoolEntry.chunkFiles2026,[...(schoolEntry.admissionNames||[]),schoolEntry.officialName],raw=>accepted.has(String(rawSchool(raw)||'').trim()));
              assert.equal(cached.cacheStatus,'hit','second exact-school read must hit bounded server cache');
              assert.equal(assetFetchCount,beforeCacheHitFetches,'exact-school cache hit must not fetch chunk asset again');
              assert.deepEqual(cached.records,expected,'exact-school cache hit truth set drift');
              assert.notEqual(cached.records,exact.records,'cache hit must return a fresh records array');
              const cacheState=exactSchoolRecordCacheState();
              assert.equal(cacheState.ttlMs,45000,'exact-school cache TTL drift');
              assert.equal(cacheState.maxEntries,8,'exact-school cache entry cap drift');
              assert.equal(cacheState.maxRecords,800,'exact-school cache record cap drift');
              assert.equal(cacheState.bounded,true,'exact-school cache must remain bounded');
            }
          }
          const allFiles=[...chunkFiles];"""
          assert s.count(loop_end) == 1, 'loop cache test anchor'
          s = s.replace(loop_end, cache_test)
          checks_anchor = "'exact-school-native-text-scan-truth-set-equal','bounded-school-history-session-cache'"
          checks_new = "'exact-school-native-text-scan-truth-set-equal','bounded-exact-school-server-cache','bounded-school-history-session-cache'"
          assert s.count(checks_anchor) == 1
          s = s.replace(checks_anchor, checks_new)
          p.write_text(s, encoding='utf-8')
          PY

          node --check functions/_lib/ln-rank-manifest.js
          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-major-bands-platform-upgrade-v3990_1.mjs
          git diff --check
      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr137-exact-school-cache.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/_lib/ln-rank-manifest.js tools/verify-ai-school-history-bridge-v3992_2.mjs .github/workflows/pr137-exact-school-cache.yml
          git commit -m "perf: reuse bounded exact-school history rows"
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
