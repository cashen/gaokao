name: Execute lightweight AI alias patch v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply, verify and commit product files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_ai_school_cache_release_v3992_1.py
          node --check functions/_lib/school-query-provider.v3969.js
          node --check functions/_lib/ai/tool-registry.js
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          git diff --check
          git diff --exit-code origin/main -- tongxue/data/school-name-resolver-v150.js
          git config user.name cashen
          git config user.email 54cashen@gmail.com
          git add functions/_lib/school-query-provider.v3969.js functions/_lib/ai/tool-registry.js tools/verify-ai-workspace-v3990_1.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'v3.9.90.1：释放AI学校查询常驻缓存 v3992_1'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
