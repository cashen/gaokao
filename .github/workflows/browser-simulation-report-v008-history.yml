name: Browser simulation report v008 history

on:
  pull_request:
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/css/simulation-report-v007-mobile.css'
      - 'ln-rank/css/simulation-report-v008-history-hint.css'
      - 'ln-rank/js/simulation-report-v007-workbench.js'
      - 'ln-rank/js/simulation-report-v008-history-hint.js'
      - 'tools/browser-simulation-report-v008-history.mjs'
      - '.github/workflows/browser-simulation-report-v008-history.yml'
  push:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/css/simulation-report-v008-history-hint.css'
      - 'ln-rank/js/simulation-report-v008-history-hint.js'
      - 'tools/browser-simulation-report-v008-history.mjs'
      - '.github/workflows/browser-simulation-report-v008-history.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 >/tmp/gaokao-http.log 2>&1 &
      - run: node tools/browser-simulation-report-v008-history.mjs
