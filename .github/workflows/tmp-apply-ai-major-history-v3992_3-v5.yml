name: temporary persist verified AIPLuS major region history

on:
  push:
    branches:
      - agent/aiplus-major-region-history-v3990_1
    paths:
      - .github/workflows/tmp-apply-ai-major-history-v3992_3-v5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-major-region-history-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce verified permanent code
        run: python3 tools/tmp_apply_ai_major_history_v3992_3_v4.py
      - name: Rebuild canonical derived index
        run: node tools/build-ai-major-history-index-v3990_1.mjs
      - name: Re-run exact user journey gate
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check functions/api/ai/major-history.js
          node --check aiplus/app.v3990_1.js
          node --check tools/browser-ai-workspace-v3990_1.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
      - name: Persist business code without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cashen
          git config user.email 54cashen@gmail.com
          git add functions/_lib/ai/agent-task-kernel.js functions/_lib/ai/command-interpreter.js functions/_lib/ai/tool-registry.js functions/_lib/ai/turn-orchestrator.js functions/_lib/ai/advisor-presentation.js functions/api/ai/major-history.js aiplus/app.v3990_1.js tools/browser-ai-workspace-v3990_1.mjs tools/build-ai-major-history-index-v3990_1.mjs tools/verify-ai-major-region-history-v3992_3.mjs ln-rank/data/ai-major-history-v3990_1
          git diff --cached --quiet && { echo 'no staged business changes'; exit 1; }
          git commit -m 'feat: answer major region score-history questions'
          git push origin HEAD:agent/aiplus-major-region-history-v3990_1
