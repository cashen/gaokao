name: Bootstrap release v3966

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - tools/run-release-v3966.txt

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release migration
        run: |
          node tools/prepare-release-v3966.mjs
          node tools/ln-2026/patch-ln-2024-rank-corrections-v3966.mjs
          node tools/ln-2026/patch-runtime-contract-v3966.mjs
          python3 tools/ln-2026/patch-three-year-population-v3966.py
          node tools/ln-2026/finalize-v3966-transport.mjs
      - name: Check generated source
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "node --check $file"
            node --check "$file"
          done < <(git diff --name-only | grep -E '\.(js|mjs)$')
          python3 -m py_compile tools/ln-2026/build-release.py tools/ln-2026/verify-final-release-v9.py
          node tools/verify-card-ai-2026-v3955.mjs
          node tools/tongxue/verify-directory.mjs
      - name: Audit three-year rank evidence
        run: node tools/audit-three-year-rank-evidence-v3966.mjs
      - name: Commit release graph
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            _headers \
            .github/workflows/verify-dual-search-v3963.yml \
            .github/workflows/verify-ln-2026-final.yml \
            index.html \
            ln-rank \
            zy2026.html \
            zy2026 \
            tongxue/index.html \
            tongxue/changelog.html \
            tongxue/app/tongxue-runtime-v159-r3966.js \
            functions/_lib/ln-2024-physics-score-rank.js \
            tools/audit-three-year-rank-evidence-v3966.mjs \
            tools/prepare-release-v3966.mjs \
            tools/verify-card-ai-2026-v3955.mjs \
            tools/tongxue/verify-directory.mjs \
            tools/ln-2026/build-release.py \
            tools/ln-2026/verify-final-release-v9.py \
            analysis/2026/three-year-rank-evidence-audit-v3966.json
          if git diff --cached --quiet; then
            echo 'Release graph already synchronized.'
            exit 0
          fi
          git commit -m '补齐v3966飞书报告传输链与全站门禁'
          git push origin HEAD:${{ github.head_ref }}
