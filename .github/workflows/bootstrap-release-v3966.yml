name: Bootstrap release v3966

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - tools/run-release-v3966.txt

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release migration
        run: |
          node tools/prepare-release-v3966.mjs
          python3 tools/ln-2026/patch-three-year-population-v3966.py
      - name: Check generated source
        run: |
          set +e
          : > /tmp/v3966-source-check.log
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "node --check $file" | tee -a /tmp/v3966-source-check.log
            node --check "$file" >> /tmp/v3966-source-check.log 2>&1 || status=$?
          done < <(git diff --name-only | grep -E '\.(js|mjs)$')
          python3 -m py_compile tools/ln-2026/build-release.py >> /tmp/v3966-source-check.log 2>&1 || status=$?
          cat /tmp/v3966-source-check.log
          if [ "${status:-0}" -ne 0 ]; then
            mkdir -p analysis/2026
            cp /tmp/v3966-source-check.log analysis/2026/v3966-release-source-check-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add analysis/2026/v3966-release-source-check-error.txt
            git commit -m '记录v3966发布源代码诊断' || true
            git push origin HEAD:${{ github.head_ref }} || true
            exit "${status:-1}"
          fi
      - name: Commit release graph
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _headers index.html ln-rank zy2026.html zy2026 tongxue/index.html tongxue/changelog.html tongxue/app/tongxue-runtime-v159-r3966.js tools/ln-2026/build-release.py
          git commit -m '同步v3.9.66.0全站发布图'
          git push origin HEAD:${{ github.head_ref }}
