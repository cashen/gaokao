name: Bootstrap release v3966

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - tools/run-release-v3966.txt

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release migration
        run: node tools/prepare-release-v3966.mjs
      - name: Check generated JavaScript
        run: |
          set -euo pipefail
          git diff --name-only | grep -E '\.(js|mjs)$' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Commit release graph
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _headers index.html ln-rank zy2026.html zy2026 tongxue/index.html tongxue/changelog.html tongxue/app/tongxue-runtime-v159-r3966.js
          git commit -m '同步v3.9.66.0全站发布图'
          git push origin HEAD:${{ github.head_ref }}
