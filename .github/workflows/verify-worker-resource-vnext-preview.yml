name: Verify Worker resource vNext Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'data/zy2026/**'
      - 'functions/**'
      - 'shared/**'
      - 'tools/verify-worker-resource-vnext-preview.mjs'
      - 'tools/audit-worker-resource-architecture-vnext.mjs'
      - 'tools/verify-school-runtime-projection-vnext.mjs'
      - 'tools/verify-major-runtime-projection-vnext.mjs'
      - 'tools/verify-school-majors-runtime-vnext.mjs'
      - '.github/workflows/verify-worker-resource-vnext-preview.yml'

permissions:
  contents: read
  checks: read
  issues: read

jobs:
  preview-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stress script syntax
        run: node --check tools/verify-worker-resource-vnext-preview.mjs
      - name: Resolve exact-head Cloudflare Branch Functions Preview
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          preview_base=''
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            summary="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].output.summary // empty' <<<"$checks" 2>/dev/null || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then
              echo "Cloudflare Pages failed for exact head ${EXPECTED_SHA}." >&2
              exit 2
            fi

            : > /tmp/vnext-preview-candidates.txt
            if [ "$conclusion" = success ]; then
              mapfile -t check_urls < <(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$summary" | awk '!seen[$0]++')
              if [ "${#check_urls[@]}" -ge 2 ]; then
                printf '%s\n' "${check_urls[1]}" >> /tmp/vnext-preview-candidates.txt
              fi
            fi

            comments="$(curl -fsSL --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"

            jq -r '.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]") | .body // empty' <<<"$comments" 2>/dev/null \
              | grep -A2 'Branch Preview URL:' \
              | grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' \
              >> /tmp/vnext-preview-candidates.txt || true
            awk 'NF && !seen[$0]++' /tmp/vnext-preview-candidates.txt > /tmp/vnext-preview-candidates.dedup
            mv /tmp/vnext-preview-candidates.dedup /tmp/vnext-preview-candidates.txt

            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              body="$(curl -fsSL --max-time 25 \
                -H 'Accept: application/json' \
                -H 'Cache-Control: no-cache' \
                -H 'Pragma: no-cache' \
                "${candidate}/api/ai/health?vnextSha=${EXPECTED_SHA}&attempt=${attempt}" || true)"
              got_sha="$(jq -r '.deployment.commitSha // empty' <<<"$body" 2>/dev/null || true)"
              got_branch="$(jq -r '.deployment.branch // empty' <<<"$body" 2>/dev/null || true)"
              if [ "$got_sha" = "$EXPECTED_SHA" ] && [ -n "$got_branch" ]; then
                preview_base="$candidate"
                break
              fi
            done < /tmp/vnext-preview-candidates.txt

            if [ -n "$preview_base" ]; then
              break
            fi
            sleep 8
          done
          if [ -z "$preview_base" ]; then
            echo "No Cloudflare Branch Functions Preview proved exact head ${EXPECTED_SHA}." >&2
            cat /tmp/vnext-preview-candidates.txt >&2 2>/dev/null || true
            exit 3
          fi
          echo "preview_base=$preview_base" >> "$GITHUB_OUTPUT"
          echo "Exact-head Branch Functions Preview: $preview_base"
      - name: Run staged school concurrency and mixed workload
        env:
          TARGET_BASE: ${{ steps.resolve.outputs.preview_base }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          WORKER_VNEXT_PREVIEW_EVIDENCE: /tmp/worker-resource-vnext-preview.json
          REQUEST_TIMEOUT_MS: '30000'
          P95_LIMIT_MS: '15000'
          HARD_LIMIT_MS: '30000'
        run: node tools/verify-worker-resource-vnext-preview.mjs
      - name: Upload Worker vNext Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-resource-vnext-preview
          path: /tmp/worker-resource-vnext-preview.json
          if-no-files-found: warn
          retention-days: 7
