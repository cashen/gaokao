name: Verify simulation report v002 browser print

on:
  pull_request:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/js/simulation-report.v001.js'
      - 'ln-rank/css/simulation-report.v001.css'
      - 'tools/verify-simulation-report-v002-browser.mjs'
  push:
    branches: [feat/simulation-report-v002-paper-check-sheet]

jobs:
  browser-print:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/gaokao-http.log 2>&1 &
      - name: Verify responsive and multi-page print behavior
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: node tools/verify-simulation-report-v002-browser.mjs
