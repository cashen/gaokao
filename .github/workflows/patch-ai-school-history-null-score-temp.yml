name: Patch AI school history null score temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-ai-school-history-null-score-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply null-safe school history request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/ai/tool-registry.js')
          text=p.read_text()
          old="function requestForSchoolHistory(context,{school,majorKeyword='',candidateScore=null}={}){const sourceUrl=new URL(context.request.url),url=new URL('/api/school-majors',sourceUrl.origin);url.searchParams.set('school',clean(school,120));url.searchParams.set('schoolIntent','school');url.searchParams.set('offset','0');url.searchParams.set('limit','100');url.searchParams.set('sort',Number.isFinite(Number(candidateScore))?'position-near':'score-desc');if(majorKeyword)url.searchParams.set('majorKeyword',clean(majorKeyword,160));if(Number.isFinite(Number(candidateScore)))url.searchParams.set('candidateScore',String(Math.round(Number(candidateScore))));return new Request(url.toString(),{method:'GET',headers:{accept:'application/json'}});}"
          new="function requestForSchoolHistory(context,{school,majorKeyword='',candidateScore=null}={}){const sourceUrl=new URL(context.request.url),url=new URL('/api/school-majors',sourceUrl.origin),normalizedScore=normalizeOptionalCandidateScore(candidateScore);url.searchParams.set('school',clean(school,120));url.searchParams.set('schoolIntent','school');url.searchParams.set('offset','0');url.searchParams.set('limit','100');url.searchParams.set('sort',normalizedScore===null?'score-desc':'position-near');if(majorKeyword)url.searchParams.set('majorKeyword',clean(majorKeyword,160));if(normalizedScore!==null)url.searchParams.set('candidateScore',String(normalizedScore));return new Request(url.toString(),{method:'GET',headers:{accept:'application/json'}});}"
          if text.count(old)!=1: raise SystemExit('school history request anchor changed')
          p.write_text(text.replace(old,new))
          v=Path('tools/verify-ai-school-history-bridge-v3992_2.mjs')
          vt=v.read_text()
          anchor="assert.ok(tool.includes(\"url.searchParams.set('schoolIntent','school')\"),'school history exact-school intent missing');"
          extra=anchor+"\nassert.ok(tool.includes('normalizedScore=normalizeOptionalCandidateScore(candidateScore)'),'school history must preserve null candidate score');\nassert.ok(tool.includes(\"normalizedScore===null?'score-desc':'position-near'\"),'school history null score sort boundary missing');"
          if vt.count(anchor)!=1: raise SystemExit('school history verifier anchor changed')
          v.write_text(vt.replace(anchor,extra))
          PY
          node --check functions/_lib/ai/tool-registry.js
          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          git rm .github/workflows/patch-ai-school-history-null-score-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/tool-registry.js tools/verify-ai-school-history-bridge-v3992_2.mjs
          git commit -m 'fix: preserve null score in school history bridge'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
