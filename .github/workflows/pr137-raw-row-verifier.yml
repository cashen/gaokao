name: PR137 raw row verifier

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - .github/workflows/pr137-raw-row-verifier.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update verifier
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/verify-major-bands-preview-concurrency-v3990_1.mjs')
          s = p.read_text(encoding='utf-8')
          old = "      ? 'serialized-json'\n      : result.payload?.source?.requestedBandOrderPageSource === 'raw-row-reuse'\n        ? 'serialized-json'\n        : 'full-record',"
          new = "      ? 'serialized-json'\n      : result.payload?.source?.requestedBandOrderPageSource === 'raw-row-reuse'\n        ? 'array-reference'\n        : 'full-record',"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          node --check tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          node tools/verify-major-bands-refinement-projection-v3990_1.mjs
          git diff --check
      - name: Commit and clean helper
        run: |
          rm .github/workflows/pr137-raw-row-verifier.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/verify-major-bands-preview-concurrency-v3990_1.mjs .github/workflows/pr137-raw-row-verifier.yml
          git commit -m "test: enforce request-local raw-row ownership"
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
