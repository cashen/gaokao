name: Temporary AI Plus 500 diagnostic

on:
  push:
    branches: [agent/aiplus-500-diagnostic-646b]
    paths: ['.github/workflows/agent-aiplus-500-diagnostic.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace exact browser-style deterministic chain
        env:
          PREVIEW_BASE: https://agent-migrate-ai-frontend-to.gaokao-4y9.pages.dev
          EXPECTED_SHA: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
        run: |
          node --input-type=module <<'NODE'
          import {createAiWorkspace,buildAiTurnRequestPayload} from './shared/ai/ai-workspace-contract.v3992_0.js';
          const base=process.env.PREVIEW_BASE,expected=process.env.EXPECTED_SHA,input='500分，辽宁省内先看能上的学校';
          const health=await fetch(`${base}/api/ai/health?diag=${Date.now()}`,{headers:{'cache-control':'no-cache'}});
          const healthText=await health.text();
          console.log('HEALTH',health.status,healthText.slice(0,1200));
          if(!health.ok||!healthText.includes(expected))throw new Error('branch Preview is not exact expected SHA');
          const fields=['id','school','major','score2026','rank2026','schoolCode2026','majorCode2026','displayLocation','city','province','projectLabel','bandKey','band','scoreDelta2026','rankGap2026','is985','is211','isSinoForeign','isHighFee','feeType','natureLabel','tuition'];
          const compactRecord=r=>Object.fromEntries(fields.filter(k=>r?.[k]!==undefined&&r?.[k]!==null&&r?.[k]!=='').map(k=>[k,r[k]]));
          const compactMajorBands=d=>{const band=k=>({count:Number(d?.bands?.[k]?.count||0),records:Array.isArray(d?.bands?.[k]?.records)?d.bands[k].records.slice(0,16).map(compactRecord):[]});return{ok:Boolean(d?.ok),meta:d?.meta||{},counts:d?.counts||{},bands:{upper:band('upper'),near:band('near'),steady:band('steady')},searchAdvices:Array.isArray(d?.searchAdvices)?d.searchAdvices.slice(0,8):[],filterConflicts:Array.isArray(d?.filterConflicts)?d.filterConflicts.slice(0,8):[],keywordWarnings:Array.isArray(d?.keywordWarnings)?d.keywordWarnings.slice(0,8):[],source:d?.source||{}}};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let run=1;run<=3;run++){
            console.log(`\n===== CHAIN ${run} =====`);
            const workspace=createAiWorkspace(),toolResults={};let confirmedCommand=null,final=false;
            for(let hop=0;hop<5;hop++){
              const body=buildAiTurnRequestPayload(workspace,{input,confirmedCommand,deterministicToolResults:toolResults});
              const started=Date.now();
              const turn=await fetch(`${base}/api/ai/turn?diag=${run}-${hop}-${Date.now()}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});
              const turnText=await turn.text();let data=null;try{data=JSON.parse(turnText)}catch{}
              console.log('TURN',run,hop,'status',turn.status,'ms',Date.now()-started,'cf-ray',turn.headers.get('cf-ray'),'body',turnText.slice(0,2000));
              if(!turn.ok||!data?.ok)break;
              if(!data.pendingDeterministicTool){final=true;break;}
              const tool=data.toolRequest;
              console.log('TOOL_REQUEST',JSON.stringify(tool));
              const toolStarted=Date.now();
              const response=await fetch(new URL(tool.url,base),{headers:{accept:'application/json','cache-control':'no-cache'},cache:'no-store'});
              const text=await response.text();let payload=null;try{payload=JSON.parse(text)}catch{}
              console.log('TOOL',run,hop,'kind',tool.kind,'status',response.status,'ms',Date.now()-toolStarted,'cf-ray',response.headers.get('cf-ray'),'error_code',payload?.error_code,'error_name',payload?.error_name,'body',text.slice(0,2400));
              if(!response.ok||!payload?.ok)break;
              if(tool.kind!=='major_bands')throw new Error(`unexpected tool kind ${tool.kind}`);
              toolResults[tool.key]={kind:'major_bands',key:tool.key,url:tool.url,status:response.status,payload:compactMajorBands(payload)};
              confirmedCommand=data.command;
            }
            console.log('CHAIN_RESULT',run,final?'FINAL_OK':'STOPPED');
            await sleep(800);
          }
          NODE
