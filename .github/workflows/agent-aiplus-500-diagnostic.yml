name: Temporary allocation-free page ID scan test

on:
  push:
    branches: [agent/aiplus-500-diagnostic-646b]
    paths:
      - '.github/workflows/agent-aiplus-500-diagnostic.yml'
      - 'tools/.agent-allocation-free-page-id-scan.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch diagnostic patcher
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/aiplus-500-diagnostic-646b:tools/.agent-allocation-free-page-id-scan.py > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
      - name: Verify native truth and full rank kernel
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/major-bands-static-provider.js
          node --check tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node tools/verify-major-bands-predecode-region-v3990_1.mjs
          node tools/audit-major-bands-rank-kernel-v3990_1.mjs
      - name: Commit tested scanner change to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cashen
          git config user.email 54cashen@gmail.com
          git add functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          git commit -m 'perf: avoid row text allocation for non-page IDs'
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
