name: Temporary AI Plus sequence diagnostic

on:
  push:
    branches: [agent/aiplus-500-diagnostic-646b]
    paths: ['.github/workflows/agent-aiplus-500-diagnostic.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace score sequence then advisory
        env:
          PREVIEW_BASE: https://agent-migrate-ai-frontend-to.gaokao-4y9.pages.dev
          EXPECTED_SHA: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
        run: |
          node --input-type=module <<'NODE'
          import {createAiWorkspace,buildAiTurnRequestPayload,applyAiWorkspaceEvent} from './shared/ai/ai-workspace-contract.v3992_0.js';
          const base=process.env.PREVIEW_BASE,expected=process.env.EXPECTED_SHA;
          const health=async label=>{const r=await fetch(`${base}/api/ai/health?seq=${label}-${Date.now()}`,{headers:{'cache-control':'no-cache'}});const t=await r.text();console.log('HEALTH',label,r.status,r.headers.get('cf-ray'),t.slice(0,420));if(!t.includes(expected))throw new Error('wrong Preview SHA');};
          const fields=['id','school','major','score2026','rank2026','schoolCode2026','majorCode2026','displayLocation','city','province','projectLabel','bandKey','band','scoreDelta2026','rankGap2026','is985','is211','isSinoForeign','isHighFee','feeType','natureLabel','tuition'];
          const compactRecord=r=>Object.fromEntries(fields.filter(k=>r?.[k]!==undefined&&r?.[k]!==null&&r?.[k]!=='').map(k=>[k,r[k]]));
          const compactMajorBands=d=>{const band=k=>({count:Number(d?.bands?.[k]?.count||0),records:Array.isArray(d?.bands?.[k]?.records)?d.bands[k].records.slice(0,16).map(compactRecord):[]});return{ok:Boolean(d?.ok),meta:d?.meta||{},counts:d?.counts||{},bands:{upper:band('upper'),near:band('near'),steady:band('steady')},searchAdvices:Array.isArray(d?.searchAdvices)?d.searchAdvices.slice(0,8):[],filterConflicts:Array.isArray(d?.filterConflicts)?d.filterConflicts.slice(0,8):[],keywordWarnings:Array.isArray(d?.keywordWarnings)?d.keywordWarnings.slice(0,8):[],source:d?.source||{}}};
          const taskIdForResult=(workspace,taskAction)=>taskAction==='branch'?workspace.tasks[0]?.id||workspace.mainTaskId:workspace.mainTaskId;
          async function execute(input,workspace){const toolResults={};let confirmedCommand=null;for(let hop=0;hop<5;hop++){const body=buildAiTurnRequestPayload(workspace,{input,confirmedCommand,deterministicToolResults:toolResults});console.log('REQUEST',input,'hop',hop,'bytes',Buffer.byteLength(JSON.stringify(body)));const started=Date.now();const r=await fetch(`${base}/api/ai/turn?seq=${encodeURIComponent(input)}-${hop}-${Date.now()}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});const t=await r.text();let data=null;try{data=JSON.parse(t)}catch{}console.log('TURN',input,'hop',hop,r.status,Date.now()-started,'ms',r.headers.get('cf-ray'),'pending',data?.pendingDeterministicTool,'err',data?.error||data?.message||'');if(!r.ok||!data?.ok)return{workspace,ok:false,status:r.status,text:t};if(data.pendingDeterministicTool){const tool=data.toolRequest,ts=Date.now(),tr=await fetch(new URL(tool.url,base),{headers:{accept:'application/json','cache-control':'no-cache'},cache:'no-store'}),tt=await tr.text();let payload=null;try{payload=JSON.parse(tt)}catch{}console.log('TOOL',input,tool.kind,tr.status,Date.now()-ts,'ms',tr.headers.get('cf-ray'),'err',payload?.error_code||payload?.error_name||payload?.message||'');if(!tr.ok||!payload?.ok)return{workspace,ok:false,status:tr.status,text:tt};if(tool.kind!=='major_bands')throw new Error(`unexpected tool ${tool.kind}`);toolResults[tool.key]={kind:'major_bands',key:tool.key,url:tool.url,status:tr.status,payload:compactMajorBands(payload)};confirmedCommand=data.command;continue;}workspace=applyAiWorkspaceEvent(workspace,data.event);const turn=data.turnRecord||{userText:input,assistantSummary:(data.blocks||[]).map(x=>x.text).filter(Boolean).join(' '),changeSummary:data.result?.changeSummary||'',blocks:data.blocks||[],command:data.command,stage:data.result?.decisionStage||'start',task:data.command?.agentTask||'',focus:data.command?.focus||{}};workspace=applyAiWorkspaceEvent(workspace,{type:'result_committed',payload:{taskId:taskIdForResult(workspace,data.taskAction),result:data.result,turn}});return{workspace,ok:true,data};}return{workspace,ok:false,status:599,text:'too many hops'};}
          await health('start');
          const prompts=['350分，全国先看还能研究哪些学校','440分，辽宁省内先看能上的学校','500分，辽宁省内先看能上的学校','580分，省内机械看看','620分，全国先看能上的学校'];
          let last620=null;
          for(const prompt of prompts){let w=createAiWorkspace();const result=await execute(prompt,w);console.log('CHAIN_RESULT',prompt,result.ok,result.status||200);if(!result.ok)throw new Error(`${prompt} failed ${result.status} ${String(result.text).slice(0,500)}`);if(prompt.startsWith('620'))last620=result.workspace;await health(prompt.slice(0,3));await new Promise(r=>setTimeout(r,250));}
          const advisory='学校平台和专业质量怎么平衡';
          const advisoryPayload=buildAiTurnRequestPayload(last620,{input:advisory});
          console.log('ADVISORY_WORKSPACE',JSON.stringify({bytes:Buffer.byteLength(JSON.stringify(advisoryPayload)),tasks:advisoryPayload.workspace.tasks?.length,recentTurns:advisoryPayload.workspace.recentTurns?.length,lastCandidateRecords:advisoryPayload.workspace.lastResult?.candidates?.records?.length,viewHistory:advisoryPayload.workspace.viewHistory?.length}));
          for(let i=1;i<=8;i++){const started=Date.now();const r=await fetch(`${base}/api/ai/turn?seqAdvice=${i}-${Date.now()}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json','cache-control':'no-cache'},body:JSON.stringify(advisoryPayload)});const t=await r.text();console.log('ADVISORY',i,r.status,Date.now()-started,'ms',r.headers.get('cf-ray'),t.slice(0,900));await new Promise(r=>setTimeout(r,250));}
          await health('end');
          NODE
