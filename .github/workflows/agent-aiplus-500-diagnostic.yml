name: Temporary AI Plus advisory diagnostic

on:
  push:
    branches: [agent/aiplus-500-diagnostic-646b]
    paths: ['.github/workflows/agent-aiplus-500-diagnostic.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trace deterministic lock and live advisory turn
        env:
          PREVIEW_BASE: https://agent-migrate-ai-frontend-to.gaokao-4y9.pages.dev
          EXPECTED_SHA: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
        run: |
          node --input-type=module <<'NODE'
          import {createAiWorkspace,buildAiTurnRequestPayload} from './shared/ai/ai-workspace-contract.v3992_0.js';
          import {deterministicCommand,interpretAiCommand,shouldShortCircuitAiProvider,resolveAiSchoolMentions} from './functions/_lib/ai/command-interpreter.js';
          const input='学校平台和专业质量怎么平衡';
          const workspace=createAiWorkspace({examContext:{score:620},activeView:{score:620,regionKeys:['all'],majorKeywords:[],schoolNames:[],bottomLineMode:'all'},agentContext:{currentTask:'candidate_discovery',focus:{}}});
          const command=deterministicCommand(input,workspace);
          console.log('DETERMINISTIC',JSON.stringify({agentTask:command.agentTask,taskLocked:command.taskLocked,confidence:command.confidence,candidate:command.changeSet,shortCircuit:shouldShortCircuitAiProvider(command)}));
          let modelCalls=0;
          const interpreted=await interpretAiCommand(input,workspace,{AI_PROVIDER:'workers-ai',AI:{run:async()=>{modelCalls++;throw new Error('model should not be called');}}});
          console.log('INTERPRETED',JSON.stringify({agentTask:interpreted.command.agentTask,taskLocked:interpreted.command.taskLocked,provider:interpreted.provider,modelCalls}));
          const base=process.env.PREVIEW_BASE,expected=process.env.EXPECTED_SHA;
          const health=await (await fetch(`${base}/api/ai/health?diag=${Date.now()}`,{headers:{'cache-control':'no-cache'}})).text();
          if(!health.includes(expected))throw new Error('wrong Preview SHA');
          for(let i=1;i<=5;i++){
            const body=buildAiTurnRequestPayload(workspace,{input});
            const started=Date.now();
            const response=await fetch(`${base}/api/ai/turn?advisoryDiag=${i}-${Date.now()}`,{method:'POST',headers:{'content-type':'application/json','accept':'application/json','cache-control':'no-cache'},body:JSON.stringify(body)});
            const text=await response.text();
            console.log('LIVE',i,'status',response.status,'ms',Date.now()-started,'cf-ray',response.headers.get('cf-ray'),'body',text.slice(0,2600));
            await new Promise(r=>setTimeout(r,500));
          }
          NODE
