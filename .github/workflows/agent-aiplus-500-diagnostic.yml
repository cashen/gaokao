name: Temporary AI Plus browser network diagnostic

on:
  push:
    branches: [agent/aiplus-500-diagnostic-646b]
    paths: ['.github/workflows/agent-aiplus-500-diagnostic.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instrument browser network failures
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-ai-workspace-v3990_1.mjs')
          s=p.read_text()
          old="page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));page.on('console',m=>{"
          new="page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));page.on('response',async r=>{if(r.status()>=500){let body='';try{body=(await r.text()).slice(0,2000);}catch{}let post='';try{post=r.request().postData()||'';}catch{}console.error('DIAG_HTTP_FAILURE',JSON.stringify({status:r.status(),url:r.url(),cfRay:r.headers()['cf-ray']||'',post:post.slice(0,1600),body}));}});page.on('console',m=>{"
          if old not in s: raise SystemExit('browser instrumentation anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run full browser journey with endpoint diagnostics
        env:
          AI_PREVIEW_BASE: https://agent-migrate-ai-frontend-to.gaokao-4y9.pages.dev
          AI_EXPECTED_SHA: 646b1fed7cc4ecbb5a6bee4149de46ebb70674a3
          AI_ARTIFACT_DIR: /tmp/aiplus-network-diag
        run: node tools/browser-ai-workspace-v3990_1.mjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiplus-network-diag
          path: /tmp/aiplus-network-diag
          if-no-files-found: warn
          retention-days: 3
