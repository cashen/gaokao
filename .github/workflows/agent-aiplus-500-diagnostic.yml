name: Temporary cold ordered score hints test

on:
  push:
    branches: [agent/aiplus-500-diagnostic-646b]
    paths:
      - '.github/workflows/agent-aiplus-500-diagnostic.yml'
      - 'tools/.agent-cold-order-score-hints.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cold ordered score hints
        shell: bash
        run: |
          set -euo pipefail
          git show origin/agent/aiplus-500-diagnostic-646b:tools/.agent-cold-order-score-hints.py > /tmp/patch.py
          python /tmp/patch.py
          git diff --check
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_1.mjs
      - name: Verify source truth
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node tools/verify-major-bands-predecode-region-v3990_1.mjs
          node tools/audit-major-bands-rank-kernel-v3990_1.mjs
      - name: Commit tested cold snapshot fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cashen
          git config user.email 54cashen@gmail.com
          git add functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          git commit -m 'fix: persist score hints in cold ordered snapshots'
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
