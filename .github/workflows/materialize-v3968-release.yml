name: Materialize v3968 release graph

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate immutable wrappers and active release graph
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil

          def copy_replace(src, dst, pairs):
              text=Path(src).read_text()
              for old,new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing marker {old!r} in {src}')
                  text=text.replace(old,new)
              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              Path(dst).write_text(text)

          copy_replace('ln-rank/js/app.v3967_0.js','ln-rank/js/app.v3968_0.js',[
              ('resource-execution-v3967_0','resource-execution-v3968_0'),
              ('app-runtime.v3967_0.js?v=3967_0','app-runtime.v3968_0.js?v=3968_0'),
              ('ln-rank-runtime-v3967_0','ln-rank-runtime-v3968_0')
          ])
          copy_replace('ln-rank/js/app-runtime.v3967_0.js','ln-rank/js/app-runtime.v3968_0.js',[
              ('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0'),
              ('current-release.js?v=3967_0','current-release.js?v=3968_0'),
              ('runtime-cache-contract.v3967_0.js?v=3967_0','runtime-cache-contract.v3968_0.js?v=3968_0'),
              ('algorithm-registry.js?v=3967_0','algorithm-registry.js?v=3968_0')
          ])
          p=Path('ln-rank/js/app-runtime.v3968_0.js')
          s=p.read_text()
          s=s.replace('resourceExecution: CURRENT_RELEASE.resourceExecutionVersion\n});','resourceExecution: CURRENT_RELEASE.resourceExecutionVersion,\n  academicBackground: CURRENT_RELEASE.academicBackgroundVersion\n});')
          s=s.replace("historyEvidence: CURRENT_RELEASE.historyEvidenceVersion\n    });","historyEvidence: CURRENT_RELEASE.historyEvidenceVersion,\n      academicBackground: CURRENT_RELEASE.academicBackgroundVersion\n    });")
          p.write_text(s)

          copy_replace('ln-rank/js/selection-pool.v3967_0.js','ln-rank/js/selection-pool.v3968_0.js',[
              ('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0'),
              ('current-release.js?v=3967_0','current-release.js?v=3968_0'),
              ('algorithm-registry.js?v=3967_0','algorithm-registry.js?v=3968_0'),
              ('selection-runtime-v3967_0','selection-runtime-v3968_0')
          ])
          copy_replace('ln-rank/js/ux/family-home.v3967_0.js','ln-rank/js/ux/family-home.v3968_0.js',[
              ('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0'),
              ('family-home-runtime-v3965_0','family-home-runtime-v3968_0')
          ])
          copy_replace('ln-rank/js/major-difficulty-2026.v3967_0.js','ln-rank/js/major-difficulty-2026.v3968_0.js',[
              ('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0')
          ])
          copy_replace('zy2026/assets/zy2026.v3967_0.js','zy2026/assets/zy2026.v3968_0.js',[
              ('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0')
          ])
          copy_replace('tongxue/app/tongxue-runtime-v159-r3967.js','tongxue/app/tongxue-runtime-v159-r3968.js',[
              ('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0')
          ])

          html_pairs={
            'index.html':[('family-home.v3967_0.js?v=3967_0','family-home.v3968_0.js?v=3968_0')],
            'ln-rank/index.html':[('app.v3967_0.js?v=3967_0','app.v3968_0.js?v=3968_0')],
            'ln-rank/selection-pool.html':[('selection-pool.v3967_0.js?v=3967_0','selection-pool.v3968_0.js?v=3968_0')],
            'ln2026.html':[('major-difficulty-2026.v3967_0.js?v=3967_0','major-difficulty-2026.v3968_0.js?v=3968_0')],
            'zy2026/index.html':[('zy2026.v3967_0.js?v=3967_0','zy2026.v3968_0.js?v=3968_0')],
            'tongxue/index.html':[('tongxue-runtime-v159-r3967.js?v=3967_0','tongxue-runtime-v159-r3968.js?v=3968_0')],
            'just_for_liaoning.html':[('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0')]
          }
          for rel,pairs in html_pairs.items():
              p=Path(rel); s=p.read_text()
              for old,new in pairs:
                  if old not in s: raise SystemExit(f'missing {old} in {rel}')
                  s=s.replace(old,new)
              s=s.replace('v3.9.67.0','v3.9.68.0')
              p.write_text(s)

          for rel in ['tongxue/changelog.html','changelog.html','ln-rank/changelog.html']:
              p=Path(rel)
              if p.exists():
                  s=p.read_text().replace('v3.9.67.0','v3.9.68.0').replace('release-presenter.v3967_0.js?v=3967_0','release-presenter.v3968_0.js?v=3968_0')
                  p.write_text(s)

          Path('VERSION.txt').write_text('v3.9.68.0\n')
          Path('ln-rank/VERSION.txt').write_text('v3.9.68.0\n')

          def update_manifest(rel):
              p=Path(rel); data=json.loads(p.read_text())
              data.update({
                'version':'v3.9.68.0',
                'assetVersion':'v3968_0',
                'releaseName':'v3.9.68.0-unified-academic-background-evidence-no-fenxi',
                'generatedAt':'2026-07-27T04:00:00Z',
                'releaseGate':'resource-execution-v3968_0, academic-background-single-owner, official-source-gate, three-year-history-evidence, rank-distance-2026, protected-fenxi-runtime-unchanged',
                'sharedResourceCenterVersion':'v3968_0',
                'resourceOwnershipVersion':'resource-ownership-v3968_0',
                'uiOrchestrationVersion':'ui-orchestration-v3968_0',
                'algorithmOrchestrationVersion':'algorithm-orchestration-v3968',
                'runtimeCacheQueryVersion':'v3968_0',
                'runtimeCacheContractVersion':'runtime-cache-coherence-v3968_0',
                'mainJs':'js/app.v3968_0.js',
                'mainRuntimeJs':'js/app-runtime.v3968_0.js',
                'selectionPoolJs':'js/selection-pool.v3968_0.js',
                'familyHomeJs':'js/ux/family-home.v3968_0.js',
                'majorDifficultyJs':'js/major-difficulty-2026.v3968_0.js',
                'runtimeCacheResource':'../shared/resources/release/runtime-cache-contract.v3968_0.js',
                'academicBackgroundContract':'../shared/resources/background/academic-background-contract.v3968_0.js',
                'academicBackgroundSources':'../shared/resources/background/academic-background-source-registry.v3968_0.js',
                'academicBackgroundMatcher':'../shared/algorithms/background/academic-background-matcher.v3968_0.js',
                'academicBackgroundRuntime':'js/academic-background/academic-background-app.v3968_0.js',
                'academicBackgroundCss':'css/academic-background.v3968_0.css',
                'academicBackgroundApi':'../functions/api/academic-background.js',
                'academicBackgroundScopes':['liaoning','211'],
                'academicBackgroundAdmissionYears':[2026,2025,2024],
                'academicBackgroundEvidenceYearSeparateContract':True,
                'academicBackgroundLegacyInputOnlyContract':True,
                'academicBackgroundOfficialSourceGateContract':True,
                'academicBackgroundSingleMatcherContract':True,
                'academicBackgroundRankDistanceContract':True
              })
              if isinstance(data.get('structure2026'),dict): data['structure2026']['js']='../zy2026/assets/zy2026.v3968_0.js'
              js=list(data.get('jsEntry') or [])
              replace={
                'js/app.v3967_0.js':'js/app.v3968_0.js',
                'js/app-runtime.v3967_0.js':'js/app-runtime.v3968_0.js',
                'js/selection-pool.v3967_0.js':'js/selection-pool.v3968_0.js',
                'js/ux/family-home.v3967_0.js':'js/ux/family-home.v3968_0.js',
                'js/major-difficulty-2026.v3967_0.js':'js/major-difficulty-2026.v3968_0.js',
                '../zy2026/assets/zy2026.v3967_0.js':'../zy2026/assets/zy2026.v3968_0.js',
                '../tongxue/app/tongxue-runtime-v159-r3967.js':'../tongxue/app/tongxue-runtime-v159-r3968.js',
                '../shared/resources/release/runtime-cache-contract.v3967_0.js':'../shared/resources/release/runtime-cache-contract.v3968_0.js',
                '../shared/resources/release/release-presenter.v3967_0.js':'../shared/resources/release/release-presenter.v3968_0.js',
                '../shared/governance/resource-execution-contract.v3967_0.js':'../shared/governance/resource-execution-contract.v3968_0.js'
              }
              js=[replace.get(x,x) for x in js if x not in {'js/local-mainline/local-mainline-app.v3967_0.js','js/211-mainline/211-mainline-app.v3951_0.js'}]
              additions=[
                'js/academic-background/academic-background-app.v3968_0.js',
                '../shared/resources/background/academic-background-contract.v3968_0.js',
                '../shared/resources/background/academic-background-source-registry.v3968_0.js',
                '../shared/algorithms/background/academic-background-matcher.v3968_0.js'
              ]
              for item in additions:
                  if item not in js: js.append(item)
              data['jsEntry']=js
              css=list(data.get('cssEntry') or [])
              if 'css/academic-background.v3968_0.css' not in css: css.append('css/academic-background.v3968_0.css')
              data['cssEntry']=css
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          update_manifest('ln-rank/active-assets.json')
          update_manifest('ln-rank/release-meta.json')

          p=Path('shared/resources/release/current-release.js'); s=p.read_text()
          s=s.replace("runtimeCacheVersion: 'runtime-cache-coherence-v3967_0'","runtimeCacheVersion: 'runtime-cache-coherence-v3968_0'")
          s=s.replace("tongxueRuntimeVersion: 'tongxue-runtime-v159-r3967'","tongxueRuntimeVersion: 'tongxue-runtime-v159-r3968'")
          s=s.replace("runtimeCache: '/shared/resources/release/runtime-cache-contract.v3967_0.js'","runtimeCache: '/shared/resources/release/runtime-cache-contract.v3968_0.js'")
          s=s.replace("runtimeBootstrap: '/ln-rank/js/app.v3967_0.js'","runtimeBootstrap: '/ln-rank/js/app.v3968_0.js'")
          s=s.replace("tongxueRuntime: '/tongxue/app/tongxue-runtime-v159-r3967.js'","tongxueRuntime: '/tongxue/app/tongxue-runtime-v159-r3968.js'")
          p.write_text(s)

          p=Path('functions/_lib/release-contract.js'); s=p.read_text()
          marker='  resourceExecutionCenterContract: true,\n'
          if marker not in s: raise SystemExit('release contract marker missing')
          block=(marker+
            '  academicBackgroundSingleOwnerContract: true,\n'
            '  academicBackgroundOfficialSourceGateContract: true,\n'
            '  academicBackgroundEvidenceYearSeparateContract: true,\n'
            '  academicBackgroundLegacyInputOnlyContract: true,\n'
            '  academicBackgroundUnifiedScopeContract: true,\n'
            '  academicBackgroundThreeYearAdmissionEvidenceContract: true,\n'
            '  academicBackgroundRankDistancePrimaryContract: true,\n')
          s=s.replace(marker,block,1)
          p.write_text(s)

          p=Path('_headers'); s=p.read_text()
          assets=[
            '/ln-rank/js/app.v3968_0.js','/ln-rank/js/app-runtime.v3968_0.js','/ln-rank/js/selection-pool.v3968_0.js',
            '/ln-rank/js/ux/family-home.v3968_0.js','/ln-rank/js/major-difficulty-2026.v3968_0.js',
            '/ln-rank/js/academic-background/academic-background-app.v3968_0.js','/ln-rank/css/academic-background.v3968_0.css',
            '/zy2026/assets/zy2026.v3968_0.js','/tongxue/app/tongxue-runtime-v159-r3968.js',
            '/shared/resources/release/release-presenter.v3968_0.js','/shared/resources/release/runtime-cache-contract.v3968_0.js',
            '/shared/governance/resource-execution-contract.v3968_0.js','/shared/resources/background/academic-background-contract.v3968_0.js',
            '/shared/resources/background/academic-background-source-registry.v3968_0.js','/shared/algorithms/background/academic-background-matcher.v3968_0.js'
          ]
          for asset in assets:
              if asset not in s: s += f'\n{asset}\n  Cache-Control: public, max-age=31536000, immutable\n'
          p.write_text(s)
          PY
      - name: Verify materialized release
        run: |
          set -euo pipefail
          for file in \
            ln-rank/js/app.v3968_0.js ln-rank/js/app-runtime.v3968_0.js \
            ln-rank/js/selection-pool.v3968_0.js ln-rank/js/ux/family-home.v3968_0.js \
            ln-rank/js/major-difficulty-2026.v3968_0.js zy2026/assets/zy2026.v3968_0.js \
            tongxue/app/tongxue-runtime-v159-r3968.js \
            shared/resources/release/runtime-cache-contract.v3968_0.js; do node --check "$file"; done
          node tools/audit-academic-background-v3968.mjs
          git diff --check
      - name: Commit generated release graph
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows/materialize-v3968-release.yml'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'v3.9.68.0：生成统一背景资产活动发布图'
          git push origin HEAD:${{ github.head_ref }}
