name: tmp restore AIPLuS mocked v002_3

on:
  push:
    branches:
      - agent/aiplus-region-directory-semantics-ui-v002_3
    paths:
      - '.github/workflows/tmp-restore-aiplus-mocked-v002_3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-region-directory-semantics-ui-v002_3
          fetch-depth: 0
      - name: Patch only current asset identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-aiplus-v002-mocked.mjs')
          s=p.read_text()
          old='data-ai-plus-assets="aiplus-assets-v002_1"'
          new='data-ai-plus-assets="aiplus-assets-v002_3"'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy asset marker, found {count}')
          s=s.replace(old,new,1)
          if s.count(new) != 1:
              raise SystemExit('current asset marker did not converge to exactly one')
          p.write_text(s)
          PY
          node --check tools/browser-aiplus-v002-mocked.mjs
          grep -q "relative==='/'||relative==='/aiplus'||relative==='/aiplus/'" tools/browser-aiplus-v002-mocked.mjs
          grep -q 'data-ai-plus-assets="aiplus-assets-v002_3"' tools/browser-aiplus-v002-mocked.mjs
          git diff --check
      - name: Commit restored runner contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-aiplus-v002-mocked.mjs
          git diff --cached --check
          git commit -m 'test: align restored mocked browser asset contract with v002_3'
          git push origin HEAD:agent/aiplus-region-directory-semantics-ui-v002_3
