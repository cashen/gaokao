name: Verify public company map

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - "Public_company/**"
      - ".github/workflows/verify-public-company-map.yml"
  push:
    branches: [main]
    paths:
      - "Public_company/**"
      - ".github/workflows/verify-public-company-map.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-company-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Public_company/source

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Public_company/source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate data, tests and production build
        run: npm run release

      - name: Confirm generated files match committed release
        run: git diff --exit-code -- ../index.html ../assets ../data

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify map interactions on desktop and mobile
        run: npm run test:browser
