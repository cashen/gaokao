name: Write v3969 active metadata

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  write:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3969-unified-school-query'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize and commit active metadata
        run: |
          set -euo pipefail
          node tools/build-active-release-metadata-v3969.mjs --write
          node tools/build-active-release-metadata-v3969.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ln-rank/active-assets.json ln-rank/release-meta.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: normalize v3969 active release metadata'
          git push origin HEAD:${{ github.head_ref }}
