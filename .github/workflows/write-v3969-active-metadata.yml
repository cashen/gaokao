name: Write v3969 active metadata

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  write:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3969-unified-school-query'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize metadata, refresh trace, and commit atomically
        run: |
          set -euo pipefail
          node tools/build-active-release-metadata-v3969.mjs --write
          node tools/build-derived-asset-trace-v3969.mjs --write
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/browser-resource-execution-v3969.mjs')
          source = path.read_text(encoding='utf-8')
          old = "assert.equal(state.release, 'v3.9.68.0');"
          new = "assert.equal(state.release, 'v3.9.69.0');"
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one stale auxiliary release assertion, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          node tools/build-active-release-metadata-v3969.mjs
          node tools/build-derived-asset-trace-v3969.mjs
          node --check tools/browser-resource-execution-v3969.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ln-rank/active-assets.json ln-rank/release-meta.json shared/governance/derived-asset-trace.v3969_0.json tools/browser-resource-execution-v3969.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'test: align auxiliary browser release assertion with v3969'
          git push origin HEAD:${{ github.head_ref }}
