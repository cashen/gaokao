name: temporary build exact-SHA Preview resolver patches

on:
  push:
    branches:
      - agent/aiplus-natural-school-history-v3990_1
    paths:
      - .github/workflows/tmp-build-preview-resolver-patches.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-natural-school-history-v3990_1
          fetch-depth: 1
      - name: Generate patched workflow copies
        run: python3 tools/tmp_patch_cloudflare_preview_resolvers.py
      - name: Verify generated YAML contracts
        run: |
          set -euo pipefail
          for f in tools/tmp_generated_verify-production-api-health-v3971.yml tools/tmp_generated_verify-major-bands-bounded-fanout-v3972_5.yml; do
            grep -q 'output.summary // empty' "$f"
            grep -q 'summary_urls' "$f"
            grep -q 'cloudflare-workers-and-pages\[bot\]' "$f"
          done
      - name: Commit generated ordinary files
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tools/tmp_generated_verify-production-api-health-v3971.yml tools/tmp_generated_verify-major-bands-bounded-fanout-v3972_5.yml
          git commit -m 'Generate exact-SHA Preview resolver workflow copies'
          git push origin HEAD:agent/aiplus-natural-school-history-v3990_1
