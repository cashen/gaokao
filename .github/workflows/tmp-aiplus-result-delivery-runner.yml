name: Temporary AIPLuS result delivery runner

on:
  push:
    branches:
      - agent/aiplus-human-result-delivery

permissions:
  contents: write

jobs:
  build-clean-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-human-result-delivery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute staged patch and prove it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          python - <<'RUNPY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/verify-ai-major-region-history-v3992_3.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          code=textwrap.dedent(source[start:end])
          compile(code,'staged-aiplus-result-delivery.py','exec')
          exec(code,{'__name__':'__main__'})
          RUNPY
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          rm -f .github/workflows/tmp-aiplus-result-delivery-runner.yml
          git diff --check
      - name: Commit only the clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'AIPLuS: close major history result-delivery gap'
          git push origin HEAD:agent/aiplus-human-result-delivery
