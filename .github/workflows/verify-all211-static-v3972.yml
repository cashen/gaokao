name: Verify all211 static v3972.2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'ln-rank/211-mainline.html'
      - 'ln-rank/css/all211-static.v3972_0.css'
      - 'ln-rank/js/academic-background/all211-static-app.v3972_0.js'
      - 'ln-rank/data/211-static/**'
      - 'tools/assemble-academic-background-static-v3972.mjs'
      - 'tools/audit-211-static-v3972.mjs'
      - 'tools/browser-all211-static-v3972.mjs'
      - 'tools/lib/211-static-*.mjs'
      - 'functions/api/academic-background.js'
      - 'functions/api/211-mainline.js'
      - 'functions/_lib/211-mainline-kb.js'
      - 'functions/_lib/211-static-compat-response.js'
      - 'shared/resources/background/double-first-class-disciplines.2022*.js'
      - 'shared/resources/release/**'
      - '.github/workflows/verify-all211-static-v3972.yml'
  push:
    branches: [main]
    paths:
      - 'ln-rank/211-mainline.html'
      - 'ln-rank/css/all211-static.v3972_0.css'
      - 'ln-rank/js/academic-background/all211-static-app.v3972_0.js'
      - 'ln-rank/data/211-static/**'
      - 'functions/api/academic-background.js'
      - 'functions/api/211-mainline.js'
      - 'functions/_lib/211-mainline-kb.js'
      - 'functions/_lib/211-static-compat-response.js'
      - 'shared/resources/release/**'
      - '.github/workflows/verify-all211-static-v3972.yml'

permissions:
  contents: read

jobs:
  all211-static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect runtime boundaries and verify generated data
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git diff --name-only "$base" HEAD | tee /tmp/all211-static-files.txt
            if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/all211-static-files.txt; then exit 1; fi
          fi
          for file in \
            ln-rank/js/academic-background/all211-static-app.v3972_0.js \
            shared/resources/release/current-release.js \
            shared/resources/release/release-presenter.v3972_0.js \
            shared/resources/background/double-first-class-disciplines.2022.js \
            functions/_lib/211-mainline-kb.js \
            functions/_lib/211-static-compat-response.js \
            functions/api/academic-background.js \
            functions/api/211-mainline.js \
            tools/assemble-academic-background-static-v3972.mjs \
            tools/audit-211-static-v3972.mjs \
            tools/browser-all211-static-v3972.mjs \
            tools/lib/211-static-evidence.v3972.mjs \
            tools/lib/211-static-records.v3972.mjs; do
            node --check "$file"
          done

          if grep -Eq 'school-profile-center|double-first-class-disciplines' functions/_lib/211-mainline-kb.js; then
            echo 'Functions 211 adapter imports build-time evidence graph'
            exit 1
          fi
          if grep -q 'academic-background-provider' tools/lib/211-static-records.v3972.mjs; then
            echo 'Static 211 builder depends on Functions provider'
            exit 1
          fi
          grep -q 'build-time-static-index' functions/_lib/211-static-compat-response.js
          grep -q 'scannedCount: 0' functions/_lib/211-static-compat-response.js

          node --experimental-default-type=module - <<'NODE'
          import { handle211StaticCompatibility } from './functions/_lib/211-static-compat-response.js';
          const response = handle211StaticCompatibility(new Request('https://example.test/api/academic-background?scope=211&mode=score&score=579'));
          const data = await response.json();
          if(response.status !== 200 || !data.migratedToStatic || data.scannedCount !== 0 || data.matchedCount !== 0) throw new Error(JSON.stringify(data));
          console.log(JSON.stringify(data));
          NODE

          node --experimental-default-type=module tools/assemble-academic-background-static-v3972.mjs | tee /tmp/all211-static-assemble.out
          git diff --exit-code -- ln-rank/data/211-static/211-static-index.v3972_0.json ln-rank/data/211-static/211-static-audit.v3972_0.json
          node tools/audit-211-static-v3972.mjs | tee /tmp/all211-static-audit.out
          if grep -q '/api/academic-background' ln-rank/211-mainline.html ln-rank/js/academic-background/all211-static-app.v3972_0.js; then exit 1; fi
          grep -q 'all211-static-app.v3972_0.js' ln-rank/211-mainline.html
          grep -q 'all-211-static-v3972_0' shared/resources/release/current-release.js
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify real PC Pad Android journeys
        run: |
          set -euo pipefail
          python3 -m http.server 8789 >/tmp/all211-static-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          ALL211_BASE=http://127.0.0.1:8789 node tools/browser-all211-static-v3972.mjs | tee /tmp/all211-static-browser.out
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all211-static-v3972-2-verification
          path: |
            /tmp/all211-static-*
          if-no-files-found: warn
          retention-days: 7
