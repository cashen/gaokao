name: temporary fix major-history browser device variable

on:
  push:
    branches:
      - agent/aiplus-major-region-history-v3990_1
    paths:
      - .github/workflows/tmp-fix-major-history-browser-device.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-major-region-history-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch exact browser variable typo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-ai-workspace-v3990_1.mjs')
          s=p.read_text(encoding='utf-8')
          old='await majorRegionHistoryJourney(page,d.name);'
          new='await majorRegionHistoryJourney(page,device.name);'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one typo, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check tools/browser-ai-workspace-v3990_1.mjs
          grep -Fq 'await majorRegionHistoryJourney(page,device.name);' tools/browser-ai-workspace-v3990_1.mjs
          if grep -Fq 'await majorRegionHistoryJourney(page,d.name);' tools/browser-ai-workspace-v3990_1.mjs; then exit 1; fi
      - name: Commit verified one-line test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cashen
          git config user.email 54cashen@gmail.com
          git add tools/browser-ai-workspace-v3990_1.mjs
          git diff --cached --check
          git commit -m 'test: run major-history browser journey per device'
          git push origin HEAD:agent/aiplus-major-region-history-v3990_1
