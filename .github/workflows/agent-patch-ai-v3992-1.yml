name: Temporary AI parent journey patch v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited parent-journey repair
        shell: bash
        run: |
          set -euo pipefail
          python .agent/patch-v3992-1.py
          node --check tongxue/data/school-name-resolver-v150.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check ai/render.v3992_0.js
          node --check ai/app.v3990_1.js
          node --check ai/parent-starter.v3992_1.js
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node --check tools/browser-ai-workspace-v3990_1.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Guard scope and commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$|ln-rank/data/|functions/_lib/rank-|functions/api/major-bands\.js$)'; then
            echo 'protected path changed' >&2
            exit 1
          fi
          git config user.name 'chatgpt-agent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/agent-patch-ai-v3992-1.yml .agent/patch-v3992-1.py
          git add -A
          git commit -m 'v3.9.90.1：修复学校查询并补齐真人家长旅程 v3992_1 [agent-patched-v3992-1]'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
