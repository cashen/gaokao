name: Temporary AI parent journey patch v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited parent-journey repair
        shell: bash
        run: |
          set -euo pipefail
          run_named() {
            label="$1"; shift
            set +e
            output="$($@ 2>&1)"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$output"
              compact="$(printf '%s' "$output" | tail -c 1200 | tr '\n' ' ')"
              echo "::error title=$label::$compact"
              exit "$status"
            fi
          }
          run_named patch-python python .agent/patch-v3992-1.py
          run_named check-school-alias node --check tongxue/data/school-name-resolver-v150.js
          run_named check-command node --check functions/_lib/ai/command-interpreter.js
          run_named check-kernel node --check functions/_lib/ai/agent-task-kernel.js
          run_named check-tools node --check functions/_lib/ai/tool-registry.js
          run_named check-orchestrator node --check functions/_lib/ai/turn-orchestrator.js
          run_named check-presentation node --check functions/_lib/ai/advisor-presentation.js
          run_named check-render node --check ai/render.v3992_0.js
          run_named check-app node --check ai/app.v3990_1.js
          run_named check-starter node --check ai/parent-starter.v3992_1.js
          run_named check-static-test node --check tools/verify-ai-workspace-v3990_1.mjs
          run_named check-browser-test node --check tools/browser-ai-workspace-v3990_1.mjs
          run_named static-parent-gates node tools/verify-ai-workspace-v3990_1.mjs
      - name: Guard scope and commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$|ln-rank/data/|functions/_lib/rank-|functions/api/major-bands\.js$)'; then
            echo 'protected path changed' >&2
            exit 1
          fi
          git config user.name 'chatgpt-agent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/agent-patch-ai-v3992-1.yml .agent/patch-v3992-1.py
          git add -A
          git commit -m 'v3.9.90.1：修复学校查询并补齐真人家长旅程 v3992_1 [agent-patched-v3992-1]'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
