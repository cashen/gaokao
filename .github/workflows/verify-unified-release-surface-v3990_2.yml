name: Verify unified release surface v3990_3

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'index.html'
      - 'changelog.html'
      - 'aiplus/index.html'
      - 'ln-rank/index.html'
      - 'ln-rank/local-mainline.html'
      - 'ln-rank/211-mainline.html'
      - 'ln-rank/selection-pool.html'
      - 'ln-rank/self-check.html'
      - 'ln-rank/js/app*.js'
      - 'ln-rank/site-active-generation.v3990_3.json'
      - 'ln2026.html'
      - 'zy2026.html'
      - 'major-path/**'
      - 'Public_company/**'
      - 'tongxue/**'
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/site-runtime-contract.v3990_3.js'
      - 'shared/resources/release/active-resource-manifest.v3990_3.js'
      - 'shared/resources/release/release-footer.v3990_3.js'
      - 'shared/resources/release/release-footer.v3990_3.css'
      - 'tools/audit-unified-release-surface-v001.mjs'
      - 'tools/audit-canonical-release-version-v3990_3.mjs'
      - 'tools/audit-architecture-handoff-v3990_3.mjs'
      - '.github/workflows/verify-unified-release-surface-v3990_2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-release-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and release surface
        run: |
          set -euo pipefail
          node --check tools/audit-unified-release-surface-v001.mjs
          node --check shared/resources/release/current-release.js
          node --check shared/resources/release/site-runtime-contract.v3990_3.js
          node --check shared/resources/release/active-resource-manifest.v3990_3.js
          node --check shared/resources/release/release-footer.v3990_3.js
          node tools/audit-unified-release-surface-v001.mjs
          node tools/audit-canonical-release-version-v3990_3.mjs
          node tools/audit-architecture-handoff-v3990_3.mjs
      - name: Check formatting and protected paths
        run: |
          set -euo pipefail
          git diff --check
          if [ "$(git ls-tree -r origin/main | wc -l)" -ge 100 ] && git diff --name-only origin/main...HEAD | grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$|functions/_lib/release-contract\.js$)'; then
            echo 'Protected path changed'
            exit 1
          fi
