name: TEMP finalize AIPLuS decision focus v0.06

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/tmp-finalize-decision-focus-v006.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply coherent Preview ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/verify-ai-workspace-v3990_1.yml')
          text = workflow.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "      - name: Resolve exact-SHA Cloudflare deployment\n",
              "      - name: Resolve exact-SHA Cloudflare Check and coherent branch Functions preview\n",
              'preview step name'
          )

          replace_once(
              '''              if [ -n "$immutable_preview" ]; then
                break
              fi
            fi
            sleep 8
          done
          test -n "$immutable_preview"
          echo "immutable_preview=$immutable_preview" >> "$GITHUB_OUTPUT"
          echo "preview_base=$immutable_preview" >> "$GITHUB_OUTPUT"
          echo "branch_preview=$branch_preview" >> "$GITHUB_OUTPUT"
          echo "Exact deployment: $immutable_preview"
          if [ -n "$branch_preview" ]; then echo "Branch alias (diagnostic only): $branch_preview"; fi
''',
              '''              if [ -n "$immutable_preview" ] && [ -n "$branch_preview" ]; then
                break
              fi
            fi
            sleep 8
          done
          test -n "$immutable_preview"
          test -n "$branch_preview"
          if [ "$immutable_preview" = "$branch_preview" ]; then
            echo 'Cloudflare branch Functions preview was not resolved separately from immutable static deployment.' >&2
            exit 3
          fi
          echo "immutable_preview=$immutable_preview" >> "$GITHUB_OUTPUT"
          echo "preview_base=$branch_preview" >> "$GITHUB_OUTPUT"
          echo "branch_preview=$branch_preview" >> "$GITHUB_OUTPUT"
          echo "Exact static deployment: $immutable_preview"
          echo "Exact-head branch Functions preview: $branch_preview"
''',
              'preview resolution block'
          )

          replace_once(
              '''        env:
          PREVIEW_BASE: ${{ steps.resolve-preview.outputs.preview_base }}
          IMMUTABLE_PREVIEW: ${{ steps.resolve-preview.outputs.immutable_preview }}
        shell: bash
''',
              '''        env:
          PREVIEW_BASE: ${{ steps.resolve-preview.outputs.preview_base }}
          IMMUTABLE_PREVIEW: ${{ steps.resolve-preview.outputs.immutable_preview }}
          BRANCH_PREVIEW: ${{ steps.resolve-preview.outputs.branch_preview }}
        shell: bash
''',
              'preview env block'
          )

          replace_once(
              '''          health="$(request_get immutable-health "${PREVIEW_BASE}/api/ai/health?candidate=${EXPECTED_SHA}-immutable")"
          require_text immutable-health "\\"commitSha\\":\\"${EXPECTED_SHA}\\"" "$health"
          require_text immutable-health '"apiVersion":"ai-health-api-v0.02"' "$health"
          require_text immutable-health '"semanticMode":"intent-task-spec-v0.02"' "$health"

          page="$(request_get aiplus-page "${PREVIEW_BASE}/aiplus/?candidate=${EXPECTED_SHA}")"
''',
              '''          health=''
          ready=0
          for attempt in $(seq 1 60); do
            health="$(request_get branch-health "${BRANCH_PREVIEW}/api/ai/health?candidate=${EXPECTED_SHA}-${attempt}" || true)"
            if jq -e --arg sha "$EXPECTED_SHA" '.ok == true and .deployment.commitSha == $sha and .apiVersion == "ai-health-api-v0.02" and .workspace.semanticMode == "intent-task-spec-v0.02"' >/dev/null <<<"$health"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Branch Functions Preview never exposed exact head ${EXPECTED_SHA}. Immutable static deployment was ${IMMUTABLE_PREVIEW}." >&2
            exit 4
          fi

          immutable_page="$(request_get immutable-aiplus-page "${IMMUTABLE_PREVIEW}/aiplus/?candidate=${EXPECTED_SHA}-static")"
          require_text immutable-aiplus-page 'data-ai-workspace="ai-workspace-v3992_1"' "$immutable_page"
          require_text immutable-aiplus-page 'data-site-runtime-generation="v3990_1"' "$immutable_page"
          require_text immutable-aiplus-page 'data-ai-plus="family-advisor"' "$immutable_page"
          immutable_index="$(request_get immutable-school-index "${IMMUTABLE_PREVIEW}/data/zy2026/school-index.json?candidate=${EXPECTED_SHA}-static")"
          branch_index="$(request_get branch-school-index "${BRANCH_PREVIEW}/data/zy2026/school-index.json?candidate=${EXPECTED_SHA}-branch")"
          immutable_index_hash="$(printf '%s' "$immutable_index" | sha256sum | awk '{print $1}')"
          branch_index_hash="$(printf '%s' "$branch_index" | sha256sum | awk '{print $1}')"
          if [ "$immutable_index_hash" != "$branch_index_hash" ]; then
            echo "Branch static asset graph differs from exact immutable deployment: ${branch_index_hash} != ${immutable_index_hash}" >&2
            exit 5
          fi

          page="$(request_get aiplus-page "${PREVIEW_BASE}/aiplus/?candidate=${EXPECTED_SHA}")"
''',
              'health ownership block'
          )

          workflow.write_text(text)
          PY

          node --check shared/ai/decision-progress.v003.js
          node --check tools/verify-aiplus-decision-focus-v006.mjs
          node tools/verify-aiplus-decision-focus-v006.mjs
          grep -Fq 'preview_base=$branch_preview' .github/workflows/verify-ai-workspace-v3990_1.yml
          grep -Fq '.deployment.commitSha == $sha' .github/workflows/verify-ai-workspace-v3990_1.yml
          grep -Fq 'Branch static asset graph differs from exact immutable deployment' .github/workflows/verify-ai-workspace-v3990_1.yml
          git rm .github/workflows/tmp-aiplus-preview-asset-coherence.yml
          git rm functions/api/ai/tmp-asset-diag.js
          git rm .github/workflows/tmp-finalize-decision-focus-v006.yml
      - name: Commit clean final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --check
          git add .github/workflows/verify-ai-workspace-v3990_1.yml
          git diff --cached --name-only | grep -Fx '.github/workflows/verify-ai-workspace-v3990_1.yml'
          git diff --cached --name-only | grep -Fx '.github/workflows/tmp-aiplus-preview-asset-coherence.yml'
          git diff --cached --name-only | grep -Fx 'functions/api/ai/tmp-asset-diag.js'
          git diff --cached --name-only | grep -Fx '.github/workflows/tmp-finalize-decision-focus-v006.yml'
          git commit -m 'fix(aiplus): bind Preview to coherent exact-head graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
