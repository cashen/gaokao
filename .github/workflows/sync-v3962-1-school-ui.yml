name: Sync v3962.1 school UI release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  sync-release:
    if: github.head_ref == 'fix/v3.9.62.1-school-ui-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize release metadata and checks
        run: python3 tools/release/sync-v3962-1-school-ui.py
      - name: Validate synchronized files
        run: |
          python3 -m json.tool ln-rank/release-meta.json >/dev/null
          python3 -m json.tool ln-rank/active-assets.json >/dev/null
          node --check ln-rank/js/feature/school-majors/school-all-mode.v3962_1.js
          node --check tools/audit-school-ui-governance-v3962_1.mjs
          node tools/audit-school-ui-governance-v3962_1.mjs
      - name: Commit synchronized release files
        run: |
          if git diff --quiet; then
            echo 'No release synchronization changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            index.html \
            ln-rank/active-assets.json \
            ln-rank/release-meta.json \
            ln-rank/selection-pool.html \
            ln-rank/css/selection-workspace.v3961_0.css \
            ln-rank/css/school-all-mode.v3962_1.css \
            ln2026.html \
            zy2026.html \
            zy2026/index.html \
            tools/ln-2026/verify-final-release-v5.py \
            tools/check-ln-2026-release.mjs \
            tools/audit-ui-orchestration-v3959.mjs \
            tools/audit-selection-workspace-v3961.mjs \
            tools/audit-algorithm-orchestration-v3960.mjs \
            tools/verify-family-decision-v3955.mjs \
            tools/audit-shared-resource-center-v3957.mjs \
            tools/audit-school-ui-governance-v3962_1.mjs
          git commit -m 'release: synchronize v3.9.62.1 governance metadata'
          git push origin HEAD:${{ github.head_ref }}
