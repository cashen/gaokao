name: Patch Preview same-origin verifier temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-preview-same-origin-verifier-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply same-origin Preview verifier patch
        shell: bash
        run: |
          set -euo pipefail
          python .agent/patch-preview-same-origin-verifier.py
          node --check tools/verify-production-resource-graph-v3990_0.mjs
          node --check tools/verify-production-resource-graph-v3990_1.mjs
          grep -q "same-origin-as-pages" tools/verify-production-resource-graph-v3990_0.mjs
          grep -q "reusedFrom: 'pages-same-origin'" tools/verify-production-resource-graph-v3990_0.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-production-resource-graph-v3990_0.mjs
          git commit -m 'test: dedupe same-origin Preview deep verification'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
