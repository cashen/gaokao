name: One-time v3990 challenge boundary fix

on:
  push:
    branches:
      - agent/production-challenge-boundary-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-challenge-boundary-fix.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-challenge-boundary-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 tools/zz_patch_v3990_challenge_boundary.py
      - name: Verify source and live production boundary
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          RELEASE_SHA: f366b34a10da05a3bf3e4c736231d7826ecfe67d
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          VERIFY_MAJOR_BANDS: 'true'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-challenge-boundary-production.json
        run: |
          set -euo pipefail
          node --check tools/verify-production-resource-graph-v3990_0.mjs
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          node tools/verify-production-resource-graph-v3990_0.mjs | tee /tmp/v3990-challenge-boundary-production.log
      - name: Commit verified tools
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-production-resource-graph-v3990_0.mjs tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'fix(release): separate custom challenge from API truth checks'
          git push origin HEAD:agent/production-challenge-boundary-v3990_0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-challenge-boundary-verifier-evidence
          path: |
            /tmp/v3990-challenge-boundary-production.json
            /tmp/v3990-challenge-boundary-production.log
          if-no-files-found: warn
          retention-days: 7
