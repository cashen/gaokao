name: Diagnose Preview concurrent major-bands

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/diagnose-preview-concurrent-major-bands.yml'

permissions:
  contents: read

jobs:
  diagnose-concurrent-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PREVIEW_BASE: https://hotfix-v3972-2-production-ga.gaokao-4y9.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact distributed Preview generation
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            marker="$(curl --fail --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/404.html?concurrent-diagnostic=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'distributed-major-bands-buckets-v3972-2' <<<"$marker"; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
      - name: Capture strict concurrent request sets
        run: |
          set -euo pipefail
          node --input-type=module > /tmp/concurrent-preview-diagnostic.jsonl <<'NODE'
          const base=process.env.PREVIEW_BASE;
          async function request(label,url){
            const started=Date.now();
            try{
              const response=await fetch(url,{headers:{accept:'application/json','cache-control':'no-cache',pragma:'no-cache'}});
              const text=await response.text();
              return {
                label,status:response.status,elapsedMs:Date.now()-started,
                contentType:response.headers.get('content-type')||'',
                cfRay:response.headers.get('cf-ray')||'',
                body:text.slice(0,12000)
              };
            }catch(error){
              return {label,status:0,elapsedMs:Date.now()-started,error:error?.stack||error?.message||String(error)};
            }
          }
          for(let cycle=1;cycle<=3;cycle+=1){
            const token=`diag-${cycle}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const urls=[
              ['runtime',`${base}/api/ln-rank-runtime-health?stress=${token}`],
              ['health',`${base}/api/major-bands-health?probe=1&stress=${token}`],
              ['score',`${base}/api/major-bands?candidateScore=579&limit=16&stress=${token}`],
              ['school',`${base}/api/major-bands?candidateScore=650&schoolKeyword=${encodeURIComponent('东北大学')}&limit=16&stress=${token}`]
            ];
            const results=await Promise.all(urls.map(([label,url])=>request(label,url)));
            console.log(JSON.stringify({cycle,results}));
          }
          NODE
          cat /tmp/concurrent-preview-diagnostic.jsonl
      - name: Upload concurrent diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrent-preview-diagnostic
          path: /tmp/concurrent-preview-diagnostic.jsonl
          if-no-files-found: error
          retention-days: 3
