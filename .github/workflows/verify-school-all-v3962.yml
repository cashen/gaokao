name: Verify school mode v3962.2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  school-all-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check protected paths
        run: |
          set -euo pipefail
          base=$(git merge-base origin/main HEAD)
          git diff --name-only "$base"...HEAD | tee /tmp/school-mode-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/school-mode-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi

      - name: Check school mode JavaScript syntax
        run: |
          node --check functions/api/school-majors.js
          node --check ln-rank/js/feature/school-majors/school-all-mode.v3962_2.js
          node --check tools/audit-school-all-mode-v3962.mjs
          node --check tools/audit-school-mode-static-v3962_2.mjs
          node --check tools/browser-school-mode-journey-v3962_2.mjs

      - name: Enforce static shared UI ownership
        id: static_governance
        shell: bash
        run: |
          set +e
          node tools/audit-school-mode-static-v3962_2.mjs > /tmp/school-mode-governance.out 2> /tmp/school-mode-governance.err
          status=$?
          cat /tmp/school-mode-governance.out
          if [ "$status" -ne 0 ]; then
            echo '--- SCHOOL MODE GOVERNANCE ERROR ---'
            cat /tmp/school-mode-governance.err
            exit "$status"
          fi

      - name: Audit shared resources and real 2026 data
        id: school_all_audit
        shell: bash
        run: |
          set +e
          node tools/audit-school-all-mode-v3962.mjs > /tmp/school-all-audit.out 2> /tmp/school-all-audit.err
          status=$?
          cat /tmp/school-all-audit.out
          if [ "$status" -ne 0 ]; then
            echo '--- SCHOOL ALL AUDIT ERROR ---'
            cat /tmp/school-all-audit.err
            exit "$status"
          fi

      - name: Upload static audit diagnostics
        if: failure() && (steps.static_governance.outcome == 'failure' || steps.school_all_audit.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: school-mode-v3962-2-audit-error
          path: |
            /tmp/school-mode-governance.out
            /tmp/school-mode-governance.err
            /tmp/school-all-audit.out
            /tmp/school-all-audit.err
          if-no-files-found: warn
          retention-days: 2

      - name: Smoke-test governed static resources
        run: |
          python3 -m http.server 8765 >/tmp/school-mode-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          for path in \
            /ln-rank/ \
            /ln-rank/js/app.v3961_0.js \
            /ln-rank/js/feature/school-majors/school-all-mode.v3962_2.js \
            /ln-rank/css/school-all-mode.v3962_2.css \
            /shared/ui/components/mode-switch.v3962_2.css \
            /shared/ui/tokens/semantic.v3959_0.css \
            /shared/ui/contracts/action-contract.v3959_0.js \
            /shared/resources/schools/school-resource-center.js \
            /shared/resources/schools/school-identity-center.js; do
            echo "GET $path"
            curl --fail --silent --show-error "http://127.0.0.1:8765$path" >/dev/null
          done

      - name: Install Chromium layout test
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Verify actual PC Pad Android school flow
        id: browser_ui
        shell: bash
        run: |
          set +e
          python3 -m http.server 8765 >/tmp/school-mode-browser-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          SCHOOL_UI_ARTIFACT_DIR=/tmp/school-mode-v3962_2 node tools/browser-school-mode-journey-v3962_2.mjs > /tmp/school-mode-browser.out 2> /tmp/school-mode-browser.err
          status=$?
          cat /tmp/school-mode-browser.out
          if [ "$status" -ne 0 ]; then
            echo '--- SCHOOL MODE BROWSER ERROR ---'
            cat /tmp/school-mode-browser.err
            exit "$status"
          fi

      - name: Upload browser journey diagnostics
        if: failure() && steps.browser_ui.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: school-mode-v3962-2-browser-error
          path: |
            /tmp/school-mode-browser.out
            /tmp/school-mode-browser.err
            /tmp/school-mode-browser-http.log
            /tmp/school-mode-v3962_2
          if-no-files-found: warn
          retention-days: 3
