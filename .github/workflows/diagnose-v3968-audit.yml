name: Diagnose v3968 academic background audit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture current audit result
        run: |
          set +e
          node tools/audit-academic-background-v3968.mjs > v3968-audit-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> v3968-audit-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v3968-audit-diagnostic.txt
          git commit -m 'chore: refresh v3968 audit diagnostic' || true
          git push origin HEAD:${{ github.head_ref }}
          exit $code
