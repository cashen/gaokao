name: Temporary UEC source capability probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-uec-source-probe.yml'
      - 'docs/architecture/UNIFIED-EXPERIENCE-CONTEXT-STATUS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/unified-experience-context-v001'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe published mirrors and discover public API strings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          hosts=(
            'https://eo.srgaoxiao.cn'
            'https://eo.srgaoxiao.com'
            'https://srgaoxiao.cn'
            'https://srgaoxiao.com'
          )
          : > probe/summary.txt
          for host in "${hosts[@]}"; do
            safe=$(echo "$host" | sed 's#https://##; s#[./:]#_#g')
            echo "=== $host ===" | tee -a probe/summary.txt
            code=$(curl -L --connect-timeout 5 --max-time 15 -A 'Mozilla/5.0 UEC-source-audit' -sS -o "probe/${safe}.html" -w '%{http_code}' "$host/" || true)
            echo "homepage_status=$code bytes=$(wc -c < "probe/${safe}.html" 2>/dev/null || echo 0)" | tee -a probe/summary.txt
            if [[ "$code" == "200" ]]; then
              python - "$PWD/probe/${safe}.html" "$PWD/probe/${safe}-scripts.txt" <<'PY'
          import re,sys
          html=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          open(sys.argv[2],'w',encoding='utf-8').write(''.join(item+'\n' for item in srcs[:40]))
          PY
              : > "probe/${safe}-api-strings.txt"
              : > "probe/${safe}-major-context.txt"
              while IFS= read -r src || [[ -n "$src" ]]; do
                [[ -z "$src" ]] && continue
                if [[ "$src" =~ ^https?:// ]]; then asset="$src"; else asset="${host}${src}"; fi
                body=$(curl -L --connect-timeout 5 --max-time 15 -A 'Mozilla/5.0 UEC-source-audit' -sS "$asset" || true)
                printf '%s' "$body" > "probe/${safe}-asset-$(basename "$src")"
                python - "$PWD/probe/${safe}-asset-$(basename "$src")" "$PWD/probe/${safe}-api-strings.txt" "$PWD/probe/${safe}-major-context.txt" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          apis=sorted(set(re.findall(r'/api/[A-Za-z0-9_?&=/%.,${}:()\[\]-]+',text)))
          with open(sys.argv[2],'a',encoding='utf-8') as out:
              for item in apis: out.write(item+'\n')
          with open(sys.argv[3],'a',encoding='utf-8') as out:
              for m in re.finditer(r'(major|profession|specialty|专业)',text,re.I):
                  out.write(text[max(0,m.start()-160):min(len(text),m.end()+260)]+'\n---\n')
          PY
              done < "probe/${safe}-scripts.txt"
              sort -u "probe/${safe}-api-strings.txt" -o "probe/${safe}-api-strings.txt" || true
              echo "scripts=$(wc -l < "probe/${safe}-scripts.txt" 2>/dev/null || echo 0) api_strings=$(wc -l < "probe/${safe}-api-strings.txt" 2>/dev/null || echo 0)" | tee -a probe/summary.txt
              grep -Ei 'major|profession|specialty|review' "probe/${safe}-api-strings.txt" | tee -a probe/summary.txt || true
            fi
          done
          echo '--- known school endpoint sanity ---' | tee -a probe/summary.txt
          for host in 'https://eo.srgaoxiao.cn' 'https://eo.srgaoxiao.com' 'https://srgaoxiao.cn' 'https://srgaoxiao.com'; do
            status=$(curl -L --connect-timeout 5 --max-time 12 -A 'Mozilla/5.0 UEC-source-audit' -H 'accept: application/json' -sS -o /tmp/school.json -w '%{http_code}' "$host/api/schools/%E8%BE%BD%E5%AE%81%E7%A7%91%E6%8A%80%E5%A4%A7%E5%AD%A6" || true)
            echo "$host school_detail_status=$status bytes=$(wc -c < /tmp/school.json 2>/dev/null || echo 0)" | tee -a probe/summary.txt
            if [[ "$status" == "200" ]]; then cp /tmp/school.json "probe/$(echo "$host" | sed 's#https://##; s#[./:]#_#g')-school-detail.json"; fi
          done

      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: uec-source-probe
          path: probe
          if-no-files-found: error
          retention-days: 1
