name: Temporary UEC source capability probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-uec-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/unified-experience-context-v001'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live specialty list/detail/review schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          host='https://eo.srgaoxiao.cn'
          curl -L --connect-timeout 5 --max-time 20 -A 'Mozilla/5.0 UEC-source-audit' -H 'accept: application/json' -sS \
            "$host/api/specialties?keyword=%E7%94%B5%E6%B0%94%E5%B7%A5%E7%A8%8B%E5%8F%8A%E5%85%B6%E8%87%AA%E5%8A%A8%E5%8C%96&sort=popularity&page=1&pageSize=10" -o probe/list.json
          python - <<'PY'
          import json
          p=json.load(open('probe/list.json'))
          rows=p.get('data') if isinstance(p,dict) else None
          assert isinstance(rows,list) and rows, 'specialty search returned no rows'
          exact=next((r for r in rows if r.get('name')=='电气工程及其自动化'),rows[0])
          assert exact.get('id') is not None and exact.get('slug')
          open('probe/selected.json','w').write(json.dumps({'id':exact['id'],'slug':exact['slug'],'name':exact.get('name'),'code':exact.get('code')},ensure_ascii=False))
          print('list_keys=', sorted(p.keys()))
          print('row_keys=', sorted(exact.keys()))
          print('selected=', {'id':exact['id'],'slug':exact['slug'],'name':exact.get('name'),'code':exact.get('code')})
          PY
          id=$(python -c "import json;print(json.load(open('probe/selected.json'))['id'])")
          slug=$(python -c "import json;print(json.load(open('probe/selected.json'))['slug'])")
          curl -L --connect-timeout 5 --max-time 20 -A 'Mozilla/5.0 UEC-source-audit' -H 'accept: application/json' -sS "$host/api/specialties/$slug" -o probe/detail.json
          curl -L --connect-timeout 5 --max-time 20 -A 'Mozilla/5.0 UEC-source-audit' -H 'accept: application/json' -sS "$host/api/specialties/$id/reviews?sort=new" -o probe/reviews.json
          python - <<'PY'
          import json
          d=json.load(open('probe/detail.json')); r=json.load(open('probe/reviews.json'))
          print('detail_keys=', sorted(d.keys()) if isinstance(d,dict) else type(d).__name__)
          rows=(r.get('data') or []) if isinstance(r,dict) else []
          print('review_payload_keys=', sorted(r.keys()) if isinstance(r,dict) else type(r).__name__)
          print('review_count=', len(rows))
          if rows:
              print('review_keys=', sorted(rows[0].keys()))
              schoolish=[k for k in rows[0] if 'school' in k.lower() or 'college' in k.lower() or 'university' in k.lower() or 'campus' in k.lower()]
              print('school_binding_keys=', schoolish)
              safe={k:rows[0].get(k) for k in rows[0] if k in {'id','content','created_at','isVerified','is_verified','isAnonymous','is_anonymous','nickname','rating','like_count','reply_count','school_id','schoolId','school_name','schoolName','campus','campus_name'}}
              if 'content' in safe: safe['content']=str(safe['content'])[:120]
              print('review_safe_sample=', safe)
          PY

      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: uec-source-probe
          path: probe
          if-no-files-found: error
          retention-days: 1
