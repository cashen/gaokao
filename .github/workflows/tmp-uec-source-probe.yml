name: Temporary UEC source capability probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-uec-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/unified-experience-context-v001'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover specialty routes and source API schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          host='https://eo.srgaoxiao.cn'
          curl -L --connect-timeout 5 --max-time 20 -A 'Mozilla/5.0 UEC-source-audit' -sS "$host/" -o probe/home.html
          main=$(python - <<'PY'
          import re
          h=open('probe/home.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<script[^>]+src=["\']([^"\']+)',h,re.I)
          print(m.group(1) if m else '')
          PY
          )
          test -n "$main"
          curl -L --connect-timeout 5 --max-time 20 -A 'Mozilla/5.0 UEC-source-audit' -sS "$host$main" -o probe/main.js
          python - <<'PY'
          import re
          s=open('probe/main.js',encoding='utf-8',errors='ignore').read()
          names=sorted(set(re.findall(r'assets/Specialty(?:List|Detail)-[A-Za-z0-9_-]+\.js',s)))
          open('probe/specialty-assets.txt','w').write(''.join(x+'\n' for x in names))
          print('specialty assets:',names)
          PY
          : > probe/source-api-evidence.txt
          while IFS= read -r asset || [[ -n "$asset" ]]; do
            test -n "$asset" || continue
            out="probe/$(basename "$asset")"
            curl -L --connect-timeout 5 --max-time 20 -A 'Mozilla/5.0 UEC-source-audit' -sS "$host/$asset" -o "$out"
            python - "$out" >> probe/source-api-evidence.txt <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          print('\n###',sys.argv[1])
          literals=[]
          for m in re.finditer(r'(specialt|review|major|school)',s,re.I):
              frag=s[max(0,m.start()-220):min(len(s),m.start()+520)].replace('\n',' ')
              if '/api' in frag or 'fetch(' in frag or 'Pi' in frag or 'Dr' in frag or 'specialt' in frag.lower() or 'review' in frag.lower(): literals.append(frag)
          seen=set()
          for frag in literals:
              if frag in seen: continue
              seen.add(frag); print(frag); print('---')
              if len(seen)>=120: break
          PY
          done < probe/specialty-assets.txt
          echo '--- discovered specialty assets ---'
          cat probe/specialty-assets.txt
          echo '--- endpoint-like fragments ---'
          grep -Eio '.{0,120}(specialt|review).{0,220}' probe/source-api-evidence.txt | head -n 160 || true

      - name: Upload source probe
        uses: actions/upload-artifact@v4
        with:
          name: uec-source-probe
          path: probe
          if-no-files-found: error
          retention-days: 1
