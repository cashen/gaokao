name: Apply PR137 request raw-row reference

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - .github/workflows/apply-pr137-request-raw-row-reference.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove per-candidate raw-row stringify from explicit bands
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api = Path('functions/api/major-bands.js')
          s = api.read_text(encoding='utf-8')
          old = "rawRowStorage: minimalOrderProjection ? 'serialized-json' : undefined,"
          new = "rawRowStorage: minimalOrderProjection ? 'array-reference' : undefined,"
          assert s.count(old) == 1, f'explicit raw-row anchor count={s.count(old)}'
          s = s.replace(old, new)
          api.write_text(s, encoding='utf-8')

          verifier = Path('tools/verify-major-bands-refinement-projection-v3990_1.mjs')
          v = verifier.read_text(encoding='utf-8')
          anchor = "assert.ok(!apiSource.includes(\"minimalOrderProjection = filters.region === 'all'\"), 'region refinement regressed to full-record ordering');"
          addition = anchor + "\nassert.ok(apiSource.includes(\"rawRowStorage: minimalOrderProjection ? 'array-reference' : undefined\"), 'explicit-band projection must reuse request-local raw-row references');\nassert.ok(!apiSource.includes(\"rawRowStorage: minimalOrderProjection ? 'serialized-json' : undefined\"), 'explicit-band projection must not stringify every candidate raw row');"
          assert v.count(anchor) == 1, 'verifier anchor mismatch'
          verifier.write_text(v.replace(anchor, addition), encoding='utf-8')
          PY

          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-refinement-projection-v3990_1.mjs
          node tools/verify-major-bands-refinement-projection-v3990_1.mjs
          node tools/verify-major-bands-predecode-region-v3990_1.mjs
          node tools/audit-major-bands-request-band-scope-v3990_0.mjs
          git diff --check
      - name: Commit business fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-pr137-request-raw-row-reference.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/api/major-bands.js tools/verify-major-bands-refinement-projection-v3990_1.mjs .github/workflows/apply-pr137-request-raw-row-reference.yml
          git commit -m "perf: reuse request-local raw rows for candidate pages"
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
