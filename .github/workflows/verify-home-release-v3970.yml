name: Verify root home unified site generation v3990.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'AGENTS.md'
      - 'docs/skills/unified-site-release/**'
      - 'index.html'
      - 'ln-rank/js/ux/family-home.v3990_1.js'
      - 'ln-rank/site-active-generation.v3990_1.json'
      - 'shared/resources/release/**'
      - 'shared/resources/resource-registry.js'
      - 'shared/governance/**'
      - 'shared/ui/**'
      - 'functions/_lib/release-contract.js'
      - 'tools/audit-home-release-ownership-v3970.mjs'
      - 'tools/audit-site-runtime-generation-v3990_1.mjs'
      - 'tools/browser-home-release-v3990_1.mjs'
      - '_headers'
      - '.github/workflows/verify-home-release-v3970.yml'
      - '.github/workflows/verify-production-release-v3970.yml'

permissions:
  contents: write

jobs:
  home-release:
    if: github.event.pull_request.head.ref == 'agent/home-countdown-seconds-v3990_2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve canonical registered workflow and normalize builder
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/verify-home-release-v3970.yml > /tmp/home-workflow-main.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp-home-countdown-v3990_2-builder.mjs')
          s = p.read_text()
          bad = "\x1b[96m\\`距离2027年高考还有\\${days}天\\${hours}小时\\${minutes}分\\${seconds}秒\\`\x1b[0m"
          good = "'距离2027年高考还有' + days + '天' + hours + '小时' + minutes + '分' + seconds + '秒'"
          if bad not in s:
              raise SystemExit('temporary builder ANSI marker not found')
          p.write_text(s.replace(bad, good))
          PY
          node --check tools/tmp-home-countdown-v3990_2-builder.mjs

      - name: Build coherent v3990_2 release tree
        run: node tools/tmp-home-countdown-v3990_2-builder.mjs

      - name: Restore normal workflow and compatibility filenames
        shell: bash
        run: |
          set -euo pipefail
          sed -e 's/v3\.9\.90\.1/v3.9.90.2/g' -e 's/v3990_1/v3990_2/g' -e 's/3990_1/3990_2/g' \
            /tmp/home-workflow-main.yml > .github/workflows/verify-home-release-v3970.yml
          python3 - <<'PY'
          from pathlib import Path
          for rel in ['tools/audit-architecture-handoff-v3990_2.mjs', 'docs/architecture/START-HERE.md']:
              p = Path(rel)
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace('.github/workflows/verify-ai-workspace-v3990_2.yml', '.github/workflows/verify-ai-workspace-v3990_1.yml')
              p.write_text(s)
          PY

      - name: Verify generated source before commit
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp-home-countdown-v3990_2-builder.mjs
          test ! -e .github/workflows/tmp-home-countdown-v3990_2-builder.yml
          node --check ln-rank/js/ux/family-home.v3990_2.js
          node --check shared/resources/release/site-runtime-contract.v3990_2.js
          node --check shared/resources/release/runtime-cache-contract.v3990_2.js
          node tools/audit-canonical-release-version-v3990_2.mjs
          node tools/audit-site-runtime-generation-v3990_2.mjs
          node tools/audit-home-release-ownership-v3970.mjs
          node tools/audit-architecture-handoff-v3990_2.mjs
          git diff --check
          git diff --name-only HEAD | tee /tmp/home-countdown-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/home-countdown-files.txt; then
            echo 'Protected path touched.' >&2
            exit 1
          fi
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'data-countdown-precision="second"' index.html
          grep -q 'setInterval(renderCountdown, 1000)' ln-rank/js/ux/family-home.v3990_2.js

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'v3.9.90.2：首页高考倒计时精确到秒'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
