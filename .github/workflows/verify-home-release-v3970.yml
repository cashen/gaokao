name: Verify root home unified site generation r031

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'AGENTS.md'
      - 'docs/skills/unified-site-release/**'
      - 'index.html'
      - 'ln-rank/js/ux/family-home.v3990_3.js'
      - 'ln-rank/site-active-generation.v3990_3.json'
      - 'shared/resources/release/**'
      - 'shared/resources/resource-registry.js'
      - 'shared/governance/**'
      - 'shared/ui/**'
      - 'functions/_lib/release-contract.js'
      - 'tools/audit-home-release-ownership-v3970.mjs'
      - 'tools/audit-site-runtime-generation-v3990_3.mjs'
      - 'tools/browser-home-release-v3990_3.mjs'
      - 'tools/verify-home-countdown-redesign-v001.mjs'
      - 'docs/plans/home-countdown-redesign-v001.md'
      - '.codex/progress/home-countdown-redesign-v001.json'
      - '_headers'
      - '.github/workflows/verify-home-release-v3970.yml'
      - '.github/workflows/verify-production-release-v3970.yml'

permissions:
  contents: read

jobs:
  home-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check protected paths and syntax
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3990-2-home-files.txt
          if [ "$(git ls-tree -r "$base" | wc -l)" -ge 100 ] && grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3990-2-home-files.txt; then exit 1; fi
          if [ "$(git ls-tree -r "$base" | wc -l)" -ge 100 ]; then
            git diff --name-only "$base" HEAD -- '*.js' '*.mjs' | while IFS= read -r file; do [ -f "$file" ] && node --check "$file"; done
          else
            node --check shared/resources/release/current-release.js
            node --check shared/resources/release/active-resource-manifest.v3990_3.js
            node --check tools/verify-unified-visual-responsive-v3990_3.mjs
          fi
          sed -e 's/v3\.9\.90\.0/v3.9.90.3/g' -e 's/v3990_0/v3990_3/g' -e 's/3990_0/3990_3/g' \
            tools/ln-2026/verify-final-release-v3990_0.py > /tmp/verify-final-release-v3990_3.py
          python3 -m py_compile /tmp/verify-final-release-v3990_3.py

      - name: Verify homepage and site generation contracts
        run: |
          set -euo pipefail
          python3 /tmp/verify-final-release-v3990_3.py | tee /tmp/v3990-2-home-release.out
          node tools/audit-site-runtime-generation-v3990_3.mjs | tee /tmp/v3990-2-site-generation.out
          node tools/audit-home-release-ownership-v3970.mjs | tee /tmp/v3990-2-home-audit.out
          node tools/verify-home-countdown-redesign-v001.mjs | tee /tmp/v3990-2-home-redesign.out

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify root home on phone pad and desktop
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3990-2-home-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          V3970_HOME_ARTIFACT_DIR=/tmp/v3990-2-home-browser node tools/browser-home-release-v3990_3.mjs | tee /tmp/v3990-2-home-browser.out

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-2-root-home-results
          path: |
            /tmp/v3990-2-home-*.txt
            /tmp/v3990-2-home-*.out
            /tmp/v3990-2-home-*.log
            /tmp/v3990-2-home-browser
          if-no-files-found: warn
          retention-days: 3
