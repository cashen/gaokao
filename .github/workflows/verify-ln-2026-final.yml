name: Verify LN 2026 final release v3965.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check protected paths
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3965-final-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3965-final-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi

      - name: Verify final release contract
        env:
          LN_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python3 tools/ln-2026/verify-final-release-v8.py > /tmp/v3965-final-verify.out 2> /tmp/v3965-final-verify.err
          status=$?
          cat /tmp/v3965-final-verify.out
          if [ "$status" -ne 0 ]; then
            echo '--- v3965 final release verification error ---'
            cat /tmp/v3965-final-verify.err
            exit "$status"
          fi

      - name: Compile changed source and verification tools
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD -- '*.js' '*.mjs' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
          python3 -m py_compile \
            tools/ln-2026/build-release.py \
            tools/ln-2026/verify-generated-release.py \
            tools/ln-2026/integrate-release.py \
            tools/ln-2026/audit-trend-method.py \
            tools/ln-2026/rebuild-centered-trend-analysis.py \
            tools/ln-2026/build-zy2026-structure.py \
            tools/ln-2026/run-build-zy2026-structure.py \
            tools/ln-2026/verify-final-release-v8.py \
            tools/schools/school_resource_bundle.py \
            tools/schools/school_resource_artifact_compat.py \
            tools/schools/build-school-profile-center-v3957.py \
            tools/tongxue/build-moe-2026-school-index.py \
            tools/tongxue/build-school-region-index-v150.py

      - name: Verify generated data source contract
        run: python3 tools/ln-2026/verify-generated-release.py

      - name: Rebuild official 2026 school resources once
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check xlrd==2.0.1
          mkdir -p /tmp/school-resources-v3965
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/school-resources-v3965/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/school-resources-v3965/moe-2026-schools.xls)" -gt 20000
          python3 tools/schools/school_resource_bundle.py --xls /tmp/school-resources-v3965/moe-2026-schools.xls
          python3 tools/schools/school_resource_artifact_compat.py
          node tools/tongxue/build-school-initial-index-v141.mjs
          node tools/tongxue/build-school-initial-index-v150.mjs
          git diff --exit-code -- \
            shared/resources/schools/school-profile-data.20260617-v3957.js \
            tongxue/data/school-name-index.generated.json \
            tongxue/data/school-search-index.20260617.json \
            tongxue/data/school-search-index.20260617-v150.json

      - name: Exercise critical runtime modules
        run: |
          node --experimental-default-type=module - <<'NODE'
          import { CURRENT_RELEASE } from './shared/resources/release/current-release.js';
          import { getScoreGuard } from './ln-rank/js/core/score-guard.js';
          import { classifySelectionPosition } from './ln-rank/js/domain/selection-band-policy.v3963_1.js';
          import { resolveCanonicalPosition } from './shared/algorithms/position/canonical-position.v3963_0.js';
          import { lookupScoreRank } from './functions/_lib/rank-table-provider.js';
          import { resolveCompactSchoolResource } from './shared/resources/schools/school-resource-center.js';
          if (CURRENT_RELEASE.display !== 'v3.9.65.0' || CURRENT_RELEASE.assetVersion !== 'v3965_0') throw new Error(JSON.stringify(CURRENT_RELEASE));
          if (CURRENT_RELEASE.selectionWorkspaceVersion !== 'selection-workspace-orchestration-v3965_0') throw new Error('workspace owner mismatch');
          if (CURRENT_RELEASE.reportFrontendVersion !== 'feishu-browser-v3965_0') throw new Error('report owner mismatch');
          if (CURRENT_RELEASE.tongxueRuntimeVersion !== 'tongxue-runtime-v159') throw new Error('Tongxue owner mismatch');
          for (const [score, rank] of [[700,41],[600,14235],[508,49824],[344,119069],[150,141691]]) {
            const result = lookupScoreRank({ year:2026, region:'ln', subject:'physics', score });
            if (!result || result.rankEnd !== rank) throw new Error(`rank ${score}: ${JSON.stringify(result)}`);
          }
          const guard = getScoreGuard(600);
          if (!guard.canQuery) throw new Error('600 must be queryable');
          const canonical = resolveCanonicalPosition({ candidateScore:600, candidateRank:14235, recordScore:595, recordRank:16500, rangePreset:'standard' });
          const selected = classifySelectionPosition({ candidateScore:600, candidateRank:14235, recordScore:595, recordRank:16500, rangePreset:'standard' });
          if (canonical.bandKey !== 'near' || selected.key !== canonical.bandKey) throw new Error(JSON.stringify({ canonical, selected }));
          if (resolveCompactSchoolResource('大连理工大学盘锦校区')?.entityId !== 'dlut-panjin') throw new Error('school identity mismatch');
          console.log('critical runtime module checks passed');
          NODE

      - name: Audit resources algorithms UI reports and runtime ownership
        run: |
          node tools/audit-resource-ownership-v3958.mjs
          node tools/audit-algorithm-orchestration-v3960.mjs
          node tools/audit-runtime-ownership-v3965.mjs
          node tools/audit-static-content-types-v3965.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs
          node tools/verify-feishu-report-v3956.mjs

      - name: Smoke-test active release graph
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3965-final-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          for path in \
            / \
            /ln-rank/ \
            /ln-rank/selection-pool.html \
            /tongxue/ \
            /shared/resources/release/current-release.js \
            /shared/resources/release/runtime-cache-contract.v3965_0.js \
            /shared/ui/ui-registry.v3965_0.js \
            /shared/ui/shell/family-shell.v3965_0.js \
            /ln-rank/js/app.v3965_0.js \
            /ln-rank/js/app-runtime.v3965_0.js \
            /ln-rank/js/workspace/selection-workspace-orchestrator.v3965_0.js \
            /ln-rank/js/feature/feishu/index.v3965_0.js \
            /tongxue/app/tongxue-runtime-v159.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8765$path" >/dev/null
          done

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3965-final-diagnostics
          path: |
            /tmp/v3965-final-*
            /tmp/school-resources-v3965
          if-no-files-found: warn
          retention-days: 3
