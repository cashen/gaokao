name: Verify LN 2026 final release v3969.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check protected paths and compile changed source
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3969-final-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3969-final-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi
          git diff --name-only "$base" HEAD -- '*.js' '*.mjs' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
          python3 -m py_compile \
            tools/ln-2026/verify-final-release-v10.py \
            tools/ln-2026/verify-final-release-v3969.py \
            tools/ln-2026/verify-generated-release-v3968.py \
            tools/schools/school_resource_bundle.py \
            tools/schools/school_resource_artifact_compat.py \
            tools/tongxue/build-moe-2026-school-index.py \
            tools/tongxue/build-school-region-index-v150.py

      - name: Verify v3969 release and school query execution
        run: |
          set -euo pipefail
          python3 tools/ln-2026/verify-final-release-v3969.py | tee /tmp/v3969-final-release.out
          node tools/audit-school-query-v3969.mjs 2>&1 | tee /tmp/v3969-school-query.out
          node tools/build-derived-asset-trace-v3969.mjs 2>&1 | tee /tmp/v3969-derived-trace.out
          node tools/audit-algorithm-parity-v3967.mjs 2>&1 | tee /tmp/v3969-algorithm-parity.out
          node tools/audit-report-execution-v3967.mjs 2>&1 | tee /tmp/v3969-report-execution.out
          node tools/audit-css-component-isolation-v3967.mjs 2>&1 | tee /tmp/v3969-css-isolation.out
          node tools/audit-academic-background-v3968.mjs 2>&1 | tee /tmp/v3969-academic-background.out
          python3 tools/ln-2026/verify-generated-release-v3968.py | tee /tmp/v3969-generated-release.out

      - name: Verify deterministic admission directory
        run: |
          set -euo pipefail
          node tools/build-school-admission-directory-v3969.mjs | tee /tmp/v3969-admission-directory.out
          git diff --exit-code -- shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json

      - name: Verify critical owners and three-year rank facts
        run: |
          node --experimental-default-type=module - <<'NODE'
          import fs from 'node:fs';
          import { CURRENT_RELEASE } from './shared/resources/release/current-release.js';
          import { RESOURCE_EXECUTION_VERSION, RESOURCE_EXECUTION_REGISTRY } from './shared/governance/resource-execution-contract.v3969_0.js';
          import { ALGORITHM_CONTRACT } from './shared/algorithms/algorithm-registry.js';
          import { LN_RANK_RUNTIME_CACHE_CONTRACT } from './shared/resources/release/runtime-cache-contract.v3969_0.js';
          import { lookupScoreRank, getRankTableRows, getRankPopulation, validateScoreRank } from './functions/_lib/rank-table-provider.js';
          import { buildHistoricalScoreRankEvidence } from './functions/_lib/historical-score-rank-evidence.js';
          if(CURRENT_RELEASE.display!=='v3.9.69.0'||CURRENT_RELEASE.assetVersion!=='v3969_0') throw new Error(JSON.stringify(CURRENT_RELEASE));
          if(CURRENT_RELEASE.resourceExecutionVersion!==RESOURCE_EXECUTION_VERSION) throw new Error('resource execution owner');
          if(CURRENT_RELEASE.schoolQueryVersion!=='school-query-contract-v3969_0') throw new Error('school query owner');
          if(ALGORITHM_CONTRACT.version!=='algorithm-orchestration-v3969') throw new Error('algorithm owner');
          if(LN_RANK_RUNTIME_CACHE_CONTRACT.version!=='runtime-cache-coherence-v3969_0') throw new Error('cache owner');
          if(RESOURCE_EXECUTION_REGISTRY.schoolQuery.provider!=='/functions/_lib/school-query-provider.v3969.js') throw new Error('school provider owner');
          for(const [year,score,rank] of [[2024,600,14612],[2025,600,13601],[2026,600,14235],[2024,368,116198],[2025,367,118109],[2026,344,119069]]){
            const row=lookupScoreRank({year,region:'ln',subject:'physics',score});
            if(row?.rankEnd!==rank) throw new Error(`rank ${year}/${score}`);
            if(getRankTableRows({year,region:'ln',subject:'physics'}).length<500) throw new Error(`rows ${year}`);
          }
          if(getRankPopulation({year:2026,policy:'table-total'})!==141691) throw new Error('population owner');
          const evidence=buildHistoricalScoreRankEvidence({score2026:600,rank2026:14235,score2025:600,rank2025:13601,score2024:600,rank2024:14612,historyMatchLevel:'exact'});
          if(evidence.version!=='ln-physics-history-evidence-v3967_0'||!evidence.comparison.canCompareThreeYears) throw new Error(JSON.stringify(evidence));
          if(validateScoreRank({year:2024,score:600,rank:999999}).status!=='conflict') throw new Error('conflict validation');
          const directory=JSON.parse(fs.readFileSync('shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json','utf8'));
          if(!directory.schools.some(row=>row.officialName==='沈阳化工大学')) throw new Error('沈阳化工大学 missing');
          console.log('critical v3969 owners passed');
          NODE
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs

      - name: Rebuild official school resources and admission overlay once
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check xlrd==2.0.1
          mkdir -p /tmp/school-resources-v3969
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/school-resources-v3969/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/school-resources-v3969/moe-2026-schools.xls)" -gt 20000
          python3 tools/schools/school_resource_bundle.py --xls /tmp/school-resources-v3969/moe-2026-schools.xls
          python3 tools/schools/school_resource_artifact_compat.py
          node tools/tongxue/build-school-initial-index-v141.mjs
          node tools/tongxue/build-school-initial-index-v150.mjs
          node tools/build-school-admission-directory-v3969.mjs
          git diff --exit-code -- \
            shared/resources/schools/school-profile-data.20260617-v3957.js \
            tongxue/data/school-name-index.generated.json \
            tongxue/data/school-search-index.20260617.json \
            tongxue/data/school-search-index.20260617-v150.json \
            shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json

      - name: Smoke-test active execution graph
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3969-final-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          paths=(
            / /ln-rank/ /ln-rank/selection-pool.html /ln-rank/local-mainline.html /ln-rank/211-mainline.html /ln2026.html /zy2026/ /tongxue/ /just_for_liaoning.html
            /shared/resources/release/current-release.js
            /shared/resources/release/release-presenter.v3969_0.js
            /shared/resources/release/runtime-cache-contract.v3969_0.js
            /shared/governance/resource-execution-contract.v3969_0.js
            /shared/governance/derived-asset-trace.v3969_0.json
            /shared/resources/schools/school-query-contract.v3969_0.js
            /shared/resources/schools/school-query-engine.v3969_0.js
            /shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json
            /ln-rank/js/app.v3969_0.js
            /ln-rank/js/app-runtime.v3969_0.js
            /ln-rank/js/workspace/selection-workspace-orchestrator.v3969_0.js
            /ln-rank/js/feature/school-majors/school-all-mode.v3969_0.js
            /ln-rank/js/selection-pool.v3968_0.js
            /ln-rank/js/academic-background/academic-background-app.v3968_0.js
            /tongxue/app/tongxue-runtime-v159-r3968.js
          )
          for path in "${paths[@]}"; do curl --fail --silent --show-error "http://127.0.0.1:8765$path" >/dev/null; done

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3969-final-diagnostics
          path: |
            /tmp/v3969-*
            /tmp/school-resources-v3969
          if-no-files-found: warn
          retention-days: 3
