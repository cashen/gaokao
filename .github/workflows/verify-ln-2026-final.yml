name: Verify LN 2026 final release v3972.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check protected paths and compile source
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3972-final-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3972-final-files.txt; then exit 1; fi
          git diff --name-only "$base" HEAD -- '*.js' '*.mjs' | while IFS= read -r file; do [ -f "$file" ] && node --check "$file"; done
          python3 -m py_compile \
            tools/ln-2026/verify-final-release-v3970.py \
            tools/ln-2026/verify-generated-release-v3968.py \
            tools/ln-2026/verify-generated-release-v3971.py \
            tools/schools/school_resource_bundle.py \
            tools/schools/school_resource_artifact_compat.py \
            tools/tongxue/build-moe-2026-school-index.py \
            tools/tongxue/build-school-region-index-v150.py

      - name: Verify v3970 assets under v3.9.72.0 release
        run: |
          set -euo pipefail
          python3 tools/ln-2026/verify-final-release-v3970.py | tee /tmp/v3972-final-release.out
          node tools/audit-family-action-v3970.mjs | tee /tmp/v3972-family-action.out
          node tools/audit-school-query-v3970.mjs | tee /tmp/v3972-school-query.out
          node tools/build-derived-asset-trace-v3970.mjs | tee /tmp/v3972-derived-trace.out
          node tools/audit-algorithm-parity-v3967.mjs | tee /tmp/v3972-algorithm-parity.out
          node tools/audit-report-execution-v3967.mjs | tee /tmp/v3972-report-execution.out
          node tools/audit-css-component-isolation-v3967.mjs | tee /tmp/v3972-css-isolation.out
          node tools/audit-academic-background-v3970.mjs | tee /tmp/v3972-academic-background.out
          python3 tools/ln-2026/verify-generated-release-v3971.py | tee /tmp/v3972-generated-release.out

      - name: Verify deterministic admission directory
        run: |
          set -euo pipefail
          node tools/build-school-admission-directory-v3969.mjs | tee /tmp/v3972-admission-directory.out
          git diff --exit-code -- shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json

      - name: Verify critical owners and three-year facts
        run: |
          node --experimental-default-type=module - <<'NODE'
          import fs from 'node:fs';
          import { CURRENT_RELEASE } from './shared/resources/release/current-release.js';
          import { RESOURCE_EXECUTION_VERSION, RESOURCE_EXECUTION_REGISTRY } from './shared/governance/resource-execution-contract.v3970_0.js';
          import { ALGORITHM_CONTRACT } from './shared/algorithms/algorithm-registry.js';
          import { LN_RANK_RUNTIME_CACHE_CONTRACT } from './shared/resources/release/runtime-cache-contract.v3970_0.js';
          import { lookupScoreRank, getRankTableRows, getRankPopulation, validateScoreRank } from './functions/_lib/rank-table-provider.js';
          import { buildHistoricalScoreRankEvidence } from './functions/_lib/historical-score-rank-evidence.js';
          if(CURRENT_RELEASE.display!=='v3.9.72.0'||CURRENT_RELEASE.assetVersion!=='v3970_0'||CURRENT_RELEASE.assetReleaseVersion!=='v3.9.70.0') throw new Error(JSON.stringify(CURRENT_RELEASE));
          if(CURRENT_RELEASE.resourceExecutionVersion!==RESOURCE_EXECUTION_VERSION) throw new Error('resource execution owner');
          if(CURRENT_RELEASE.schoolQueryVersion!=='school-query-contract-v3969_0') throw new Error('school query owner');
          if(CURRENT_RELEASE.resourceOwners.industryMap!=='/Public_company/') throw new Error('industry map owner');
          if(CURRENT_RELEASE.all211DataVersion!=='all-211-static-v3972_0'||CURRENT_RELEASE.all211Architecture!=='build-time-static-index') throw new Error('211 static owner');
          if(ALGORITHM_CONTRACT.version!=='algorithm-orchestration-v3969') throw new Error('algorithm owner');
          if(LN_RANK_RUNTIME_CACHE_CONTRACT.version!=='runtime-cache-coherence-v3970_0') throw new Error('cache owner');
          if(RESOURCE_EXECUTION_REGISTRY.familyAction.owner!=='/shared/ui/components/family-plan-entry.v3970_0.js') throw new Error('family action owner');
          for(const [year,score,rank] of [[2024,600,14612],[2025,600,13601],[2026,600,14235],[2024,368,116198],[2025,367,118109],[2026,344,119069]]){
            const row=lookupScoreRank({year,region:'ln',subject:'physics',score});
            if(row?.rankEnd!==rank) throw new Error(`rank ${year}/${score}`);
            if(getRankTableRows({year,region:'ln',subject:'physics'}).length<500) throw new Error(`rows ${year}`);
          }
          if(getRankPopulation({year:2026,policy:'table-total'})!==141691) throw new Error('population owner');
          const evidence=buildHistoricalScoreRankEvidence({score2026:600,rank2026:14235,score2025:600,rank2025:13601,score2024:600,rank2024:14612,historyMatchLevel:'exact'});
          if(evidence.version!=='ln-physics-history-evidence-v3967_0'||!evidence.comparison.canCompareThreeYears) throw new Error(JSON.stringify(evidence));
          if(validateScoreRank({year:2024,score:600,rank:999999}).status!=='conflict') throw new Error('conflict validation');
          const directory=JSON.parse(fs.readFileSync('shared/resources/schools/liaoning-2026-admission-school-directory.v3969_0.json','utf8'));
          if(!directory.schools.some(row=>row.officialName==='沈阳化工大学')) throw new Error('沈阳化工大学 missing');
          const all211=JSON.parse(fs.readFileSync('ln-rank/data/211-static/211-static-index.v3972_0.json','utf8'));
          if(!all211.meta.completeEvaluation||all211.records.length!==2494||all211.scoreBands.length!==8) throw new Error('211 static integrity');
          console.log('critical v3970 owners and v3972 static 211 passed');
          NODE
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs

      - name: Smoke-test active execution graph
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3972-final-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          paths=(
            / /Public_company/ /ln-rank/ /ln-rank/selection-pool.html /ln-rank/local-mainline.html /ln-rank/211-mainline.html /ln2026.html /zy2026/ /tongxue/ /just_for_liaoning.html
            /shared/resources/release/current-release.js
            /shared/resources/release/release-presenter.v3970_0.js
            /shared/resources/release/release-presenter.v3972_0.js
            /shared/resources/release/runtime-cache-contract.v3970_0.js
            /shared/governance/resource-execution-contract.v3970_0.js
            /shared/governance/derived-asset-trace.v3970_0.json
            /shared/ui/component-registry.v3970_0.js
            /shared/ui/components/family-plan-entry.v3970_0.js
            /shared/ui/components/family-plan-entry.v3970_0.css
            /ln-rank/js/app.v3970_0.js
            /ln-rank/js/app-runtime.v3970_0.js
            /ln-rank/js/selection-pool.v3970_0.js
            /ln-rank/js/domain/family-plan-copy-adapter.v3970_0.js
            /ln-rank/js/academic-background/all211-static-app.v3972_0.js
            /ln-rank/css/all211-static.v3972_0.css
            /ln-rank/data/211-static/211-static-index.v3972_0.json
            /shared/resources/schools/school-query-contract.v3969_0.js
            /shared/resources/schools/school-query-engine.v3969_0.js
          )
          for path in "${paths[@]}"; do curl --fail --silent --show-error "http://127.0.0.1:8765$path" >/dev/null; done

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3972-final-diagnostics
          path: /tmp/v3972-*
          if-no-files-found: warn
          retention-days: 3
