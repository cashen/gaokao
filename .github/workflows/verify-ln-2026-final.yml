name: Verify LN 2026 final release

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify protected paths, data, pages and contracts
        run: python3 tools/ln-2026/verify-final-release-v3.py
      - name: Verify generated data source contract
        run: python3 tools/ln-2026/verify-generated-release.py
      - name: Compile readable Python build tools
        run: |
          python3 -m py_compile \
            tools/ln-2026/build-release.py \
            tools/ln-2026/verify-generated-release.py \
            tools/ln-2026/integrate-release.py \
            tools/ln-2026/audit-trend-method.py \
            tools/ln-2026/rebuild-centered-trend-analysis.py \
            tools/ln-2026/build-zy2026-structure.py \
            tools/ln-2026/run-build-zy2026-structure.py \
            tools/ln-2026/finalize-v3953-assets.py \
            tools/ln-2026/verify-final-release.py \
            tools/ln-2026/verify-final-release-v2.py \
            tools/ln-2026/verify-final-release-v3.py
      - name: Check changed JavaScript syntax
        run: |
          set -euo pipefail
          git diff --name-only 62b31b2c2ce32d760ad142c9bdd49662a7603fe7...HEAD -- '*.js' '*.mjs' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "node --check $file"
            node --check "$file"
          done
      - name: Exercise critical runtime modules
        run: |
          node --experimental-default-type=module - <<'NODE'
          import { getScoreGuard } from './ln-rank/js/core/score-guard.js';
          import { classifySelectionDelta } from './ln-rank/js/domain/selection-band-policy.js';
          import { lookupScoreRank, findEquivalentScoreByRank } from './functions/_lib/rank-table-provider.js';
          import { buildHistoryScore } from './functions/_lib/history-score-engine.js';
          const expected = new Map([[751,['invalidHigh',false]],[750,['topRange',true]],[700,['topRange',true]],[508,['normal',true]],[507,['underSpecial',true]],[344,['underSpecial',true]],[343,['belowCoverage',false]],[150,['belowCoverage',false]],[149,['belowCoverage',false]]]);
          for (const [score,[key,canQuery]] of expected) { const state=getScoreGuard(score); if(state.key!==key||state.canQuery!==canQuery) throw new Error(`score guard ${score}: ${JSON.stringify(state)}`); }
          for (const [delta,key] of [[5,'upper'],[-5,'near'],[-20,'steady'],[20,'outside']]) { const result=classifySelectionDelta(delta,'standard'); if(result.key!==key) throw new Error(`band ${delta}: ${JSON.stringify(result)}`); }
          for (const [score,rank] of [[700,41],[600,14235],[508,49824],[344,119069],[150,141691]]) { const result=lookupScoreRank({year:2026,region:'ln',subject:'physics',score}); if(!result||result.rankEnd!==rank) throw new Error(`rank ${score}: ${JSON.stringify(result)}`); }
          const equivalent=findEquivalentScoreByRank({targetYear:2026,region:'ln',subject:'physics',rank:14235}); if(!equivalent||equivalent.score!==600) throw new Error(`equivalent rank: ${JSON.stringify(equivalent)}`);
          const history=buildHistoryScore({score2026:583,rank2026:21460,score2025:578,rank2025:22700,score2024:590,rank2024:21980}); if(history.rankDelta26vs25!==-1240||!history.rankTrendText.includes('录取所需位次')) throw new Error(`history: ${JSON.stringify(history)}`);
          console.log('critical runtime module checks passed');
          NODE
      - name: Run compact release contract
        run: node tools/check-ln-2026-release.mjs
      - name: Smoke-test current static pages
        run: |
          python3 -m http.server 8765 >/tmp/ln2026-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          for path in / /ln-rank/ /ln-rank/selection-pool.html /ln-rank/local-mainline.html /ln-rank/211-mainline.html /ln-rank/major-trend-2026.html /ln2026.html /lngk2026.html /zy2026 /zy2026/ /zy.html /zy2026.html; do
            echo "GET $path"
            curl --fail --silent --show-error "http://127.0.0.1:8765$path" >/dev/null
          done
