name: Temporary align AIPLuS human-query-frame gate v0.04

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-update-aiplus-human-query-frame-gate-v001.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.ref == 'agent/unified-background-context-v001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Align only the active current-owner expectation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/verify-aiplus-parent-decision-v003.yml')
          s=p.read_text()
          old="AI_HUMAN_QUERY_FRAME_VERSION='ai-human-query-frame-v0.03'"
          new="AI_HUMAN_QUERY_FRAME_VERSION='ai-human-query-frame-v0.04'"
          if new not in s:
              if old not in s: raise SystemExit('active query-frame gate contract drift')
              s=s.replace(old,new,1)
              p.write_text(s)
          if old in p.read_text(): raise SystemExit('stale v0.03 current-owner expectation remains')
          PY
      - name: Persist only if PR head stayed exact
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-aiplus-parent-decision-v003.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Align AIPLuS human-query-frame gate with v0.04'
          git push origin "HEAD:${HEAD_BRANCH}"
