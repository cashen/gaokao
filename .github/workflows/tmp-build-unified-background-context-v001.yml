name: Temporary build unified background context v0.01

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/build-background-context-index-v001.mjs'
      - '.github/workflows/tmp-build-unified-background-context-v001.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/unified-background-context-v001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compact unified background context index
        run: node tools/build-background-context-index-v001.mjs
      - name: Verify generated files and lightweight budget
        run: |
          test -s ln-rank/data/background-context/background-context-index.v001.json
          test -s ln-rank/data/background-context/background-context-audit.v001.json
          node - <<'NODE'
          const fs = require('fs');
          const p = 'ln-rank/data/background-context/background-context-index.v001.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (data.version !== 'academic-background-context-static-v0.01') throw new Error('version mismatch');
          if (!data.meta?.scopeCounts?.liaoning || !data.meta?.scopeCounts?.['211']) throw new Error('missing scope');
          const bytes = fs.statSync(p).size;
          if (bytes > 900000) throw new Error(`index too large: ${bytes}`);
          console.log(JSON.stringify({ bytes, meta: data.meta }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: background-context-v001-generated
          path: |
            ln-rank/data/background-context/background-context-index.v001.json
            ln-rank/data/background-context/background-context-audit.v001.json
          if-no-files-found: error
          retention-days: 1
      - name: Persist generated artifacts on the program branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD" || { echo "branch moved: expected $EXPECTED_HEAD got $remote_head"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ln-rank/data/background-context/background-context-index.v001.json ln-rank/data/background-context/background-context-audit.v001.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate unified background context static index"
          git push origin "HEAD:${HEAD_BRANCH}"
