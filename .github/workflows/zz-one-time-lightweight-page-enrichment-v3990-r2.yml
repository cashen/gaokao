name: One-time lightweight page enrichment v3990 r2

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-lightweight-page-enrichment-v3990-r2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse audited patch with canonical import correction
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/zz-one-time-lightweight-page-enrichment-v3990.yml', aliases: true)
          steps = workflow.fetch('jobs').fetch('patch-and-verify').fetch('steps')
          patch = steps.find { |step| step['name'] == 'Patch lightweight ranking candidates and current-page retention' }
          verify = steps.find { |step| step['name'] == 'Verify full local API and concurrency' }
          raise 'patch step missing' unless patch && patch['run']
          raise 'verify step missing' unless verify && verify['run']
          File.write('/tmp/v3990-lightweight-patch.sh', patch['run'])
          File.write('/tmp/v3990-lightweight-verify.sh', verify['run'])
          RUBY

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v3990-lightweight-patch.sh')
          script = path.read_text(encoding='utf-8')
          anchor = "api = api_path.read_text(encoding='utf-8')\n"
          correction = anchor + '''canonical_import = """import {\n  normalizePositionPreset,\n  rankWindowsForCandidate,\n  rankBandRangeText\n} from '../../shared/algorithms/position/canonical-position.v3963_0.js';\n"""\ncanonical_import_patch = """import {\n  normalizePositionPreset,\n  rankWindowsForCandidate,\n  rankBandRangeText,\n  resolveCanonicalPosition\n} from '../../shared/algorithms/position/canonical-position.v3963_0.js';\n"""\nassert canonical_import in api\napi = api.replace(canonical_import, canonical_import_patch, 1)\n'''
          if script.count(anchor) != 1:
              raise SystemExit(f'API source anchor count={script.count(anchor)}')
          script = script.replace(anchor, correction, 1)
          path.write_text(script, encoding='utf-8')
          PY

          bash /tmp/v3990-lightweight-patch.sh

      - name: Verify full local API and concurrency
        run: |
          set -euo pipefail
          bash /tmp/v3990-lightweight-verify.sh

      - name: Stage workflows and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-lightweight-page-enrichment-v3990' || true)
          test "${#workflows[@]}" -ge 1
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools shared ln-rank VERSION.txt docs index.html
          git commit -m 'fix(rank): defer enrichment until current page'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-lightweight-page-enrichment-r2
          path: |
            /tmp/v3990-lightweight-ready.json
            /tmp/v3990-lightweight-page-local-concurrency.json
            /tmp/v3990-lightweight-page-wrangler.log
          if-no-files-found: warn
          retention-days: 7
