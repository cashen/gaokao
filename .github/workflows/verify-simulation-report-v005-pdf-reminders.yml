name: Verify simulation report v005 PDF and reminders

on:
  pull_request:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/js/simulation-report-v005-pdf-reminders.js'
      - 'tools/verify-simulation-report-v005-pdf-reminders.mjs'
      - '.github/workflows/verify-simulation-report-v005-pdf-reminders.yml'
  push:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/js/simulation-report-v005-pdf-reminders.js'
      - 'tools/verify-simulation-report-v005-pdf-reminders.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify v005 PDF and reminder contracts
        run: node tools/verify-simulation-report-v005-pdf-reminders.mjs
