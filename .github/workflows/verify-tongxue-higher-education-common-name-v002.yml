name: Verify Tongxue higher education common names v002

on:
  pull_request:
    paths:
      - 'shared/resources/higher-education/higher-education-common-names.v002.js'
      - 'tongxue/app/tongxue-runtime-result-view-v159.js'
      - 'tongxue/app/tongxue-runtime-result-view-core-v159.js'
      - 'tools/tongxue/verify-higher-education-common-name-v002.mjs'
      - 'docs/plans/tongxue-higher-education-common-name-v004.md'
  push:
    branches:
      - 'feat/tongxue-higher-education-common-name-v001'
    paths:
      - 'shared/resources/higher-education/higher-education-common-names.v002.js'
      - 'tongxue/app/tongxue-runtime-result-view-v159.js'
      - 'tongxue/app/tongxue-runtime-result-view-core-v159.js'
      - 'tools/tongxue/verify-higher-education-common-name-v002.mjs'
      - 'docs/plans/tongxue-higher-education-common-name-v004.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run focused verifier
        run: node tools/tongxue/verify-higher-education-common-name-v002.mjs
