name: Temporary UEC canonical registry restore

on:
  push:
    branches:
      - agent/unified-experience-context-v001
    paths:
      - '.github/workflows/verify-unified-experience-context-v001.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-unified-experience-context-v001.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-experience-context-v001
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore main tool-registry owner and reapply only Student Voice delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:functions/_lib/ai/tool-registry.js > functions/_lib/ai/tool-registry.js
          python - <<'PY'
          from pathlib import Path
          path=Path('functions/_lib/ai/tool-registry.js')
          text=path.read_text()
          anchor="import {isScoreWindow,scoreWithinConstraint} from './human-query-frame.js';\n"
          addition="import {runStudentVoice as runUnifiedStudentVoice} from './student-voice-tool-adapter.js';\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('student voice import anchor missing')
              text=text.replace(anchor,anchor+addition,1)
          old_import="import {\n  EXPERIENCE_TOPIC_KEYWORDS,EXPERIENCE_TOPIC_LABELS,normalizeExperienceTopic,normalizeProjectScope\n} from '../../../shared/ai/aiplus-product-contract.v002.js';"
          new_import="import {normalizeProjectScope} from '../../../shared/ai/aiplus-product-contract.v002.js';"
          if old_import in text:
              text=text.replace(old_import,new_import,1)
          start=text.find('function topicMatches(text,topic)')
          end=text.find('function majorHistoryRecord(record={})',start)
          if start < 0 or end < 0:
              raise SystemExit('legacy school experience block markers missing')
          replacement=("export async function runSchoolExperience(context,{school,topic='general'}={}){return runUnifiedStudentVoice(context,{scope:'school',school,topic,compatibility:'legacy_school_experience'});}\n"
                       "export async function runStudentVoice(context,options={}){return runUnifiedStudentVoice(context,options);}\n\n")
          text=text[:start]+replacement+text[end:]
          path.write_text(text)
          PY
          node --check functions/_lib/ai/tool-registry.js
          node tools/verify-ai-workspace-v3990_2.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-aiplus-v002-contract.mjs
          node tools/verify-aiplus-student-voice-v001.mjs
          node tools/verify-major-bands-platform-upgrade-v3990_2.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-unified-experience-context-v001.mjs
          git show HEAD^:.github/workflows/verify-unified-experience-context-v001.yml > .github/workflows/verify-unified-experience-context-v001.yml
          rm -f .github/workflows/tmp-uec-restore-tool-registry-export.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/_lib/ai/tool-registry.js .github/workflows/verify-unified-experience-context-v001.yml
          git add -A .github/workflows/tmp-uec-restore-tool-registry-export.yml
          git commit -m 'Restore canonical AIPLuS tool registry around Student Voice'
          git push origin HEAD:agent/unified-experience-context-v001
