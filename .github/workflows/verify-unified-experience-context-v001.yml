name: Build v3990.3 Tongxue major handoff via registered UEC gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build-repair:
    if: github.event.pull_request.head.ref == 'agent/tongxue-major-handoff-v3990_3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve canonical UEC workflow and normalize builder
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/verify-unified-experience-context-v001.yml > /tmp/uec-workflow-main.yml
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs')
          s = p.read_text()
          replacements = [
            (".replace('/tongxue/app/tongxue-runtime-v159-r3968.js?v=3968_0', '/tongxue/app/tongxue-runtime-v160-r3990_3.js?v=3990_3')", ".replace('./app/tongxue-runtime-v159-r3968.js?v=3968_0', './app/tongxue-runtime-v160-r3990_3.js?v=3990_3')", 1),
            ("assert.equal(target.searchParams.get('returnTo'),returnTo);", "assert.equal(target.searchParams.get('returnTo'),sanitizeStudentVoiceReturnTarget(returnTo));", 1),
            ("assert.equal(parsed.returnTo,returnTo);", "assert.equal(parsed.returnTo,sanitizeStudentVoiceReturnTarget(returnTo));", 1),
            ("assert(u.searchParams.get('returnTo')==='/ln-rank/?mode=school-all&schoolSort=position-near&school=沈阳建筑大学',", "assert(decodeURIComponent(u.searchParams.get('returnTo')||'')==='/ln-rank/?mode=school-all&schoolSort=position-near&school=沈阳建筑大学',", 1),
            ("if(url.pathname==='/ln-rank/mock.html')", "if(url.pathname==='/ln-rank/')", 1),
            ("/ln-rank/mock.html?mode=school-all&schoolSort=position-near&school=沈阳建筑大学", "/ln-rank/?mode=school-all&schoolSort=position-near&school=沈阳建筑大学", 1),
          ]
          for old, new, expected in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} occurrences of {old!r}, got {count}')
              s = s.replace(old, new)
          start_marker = "write('tools/browser-student-voice-handoff-v002.mjs', `"
          end_marker = "\n// Permanent UEC workflow follows v0.02 navigation and browser proof."
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          segment = s[start:end]
          normalized = re.sub(r'(?<!\\)\$\{', r'\\${', segment)
          if normalized == segment:
              raise SystemExit('browser template had no unescaped interpolation to normalize')
          s = s[:start] + normalized + s[end:]
          p.write_text(s)
          PY
          node --check tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs

      - name: Build coherent v3990_3 repair tree
        run: node tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs

      - name: Align generated current Tongxue contracts and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            Path('tools/audit-canonical-release-version-v3990_3.mjs'): [
              ("'tongxue-runtime-v159-r3968'", "'tongxue-runtime-v160-r3990_3'", 1),
            ],
            Path('tools/audit-site-runtime-generation-v3990_3.mjs'): [
              ("tongxue: 'tongxue-runtime-v159-r3968'", "tongxue: 'tongxue-runtime-v160-r3990_3'", 1),
            ],
          }
          for path, items in replacements.items():
              text = path.read_text()
              for old, new, expected in items:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text)

          old_browser = Path('tools/browser-tongxue-runtime-v159.mjs').read_text()
          new_browser = old_browser.replace('__TONGXUE_RUNTIME_V159__', '__TONGXUE_RUNTIME_V160__').replace('test-v159', 'test-v160').replace('v159-http', 'v160-http')
          if '__TONGXUE_RUNTIME_V159__' in new_browser:
              raise SystemExit('Tongxue v160 browser regression still references V159 global')
          Path('tools/browser-tongxue-runtime-v160.mjs').write_text(new_browser)

          workflow_path = Path('.github/workflows/tongxue-live-verification.yml')
          workflow = workflow_path.read_text()
          workflow = workflow.replace('tools/browser-tongxue-runtime-v159.mjs', 'tools/browser-tongxue-runtime-v160.mjs')
          workflow = workflow.replace('/tmp/tongxue-v159-http.log', '/tmp/tongxue-v160-http.log')
          if 'tools/browser-tongxue-runtime-v159.mjs' in workflow:
              raise SystemExit('current Tongxue live workflow still runs v159 browser regression')
          workflow_path.write_text(workflow)
          PY
          node --check tools/audit-canonical-release-version-v3990_3.mjs
          node --check tools/audit-site-runtime-generation-v3990_3.mjs
          node --check tools/browser-tongxue-runtime-v160.mjs
          grep -q '__TONGXUE_RUNTIME_V160__' tools/browser-tongxue-runtime-v160.mjs
          grep -q 'tools/browser-tongxue-runtime-v160.mjs' .github/workflows/tongxue-live-verification.yml

      - name: Restore permanent UEC workflow at current generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/uec-workflow-main.yml').read_text()
          src = src.replace('v3990_2', 'v3990_3').replace('3990_2', '3990_3')
          src = src.replace('tools/verify-student-voice-navigation-v001.mjs', 'tools/verify-student-voice-navigation-v002.mjs')
          if "tools/browser-student-voice-handoff-v002.mjs" not in src:
              src = src.replace("      - 'tools/verify-student-voice-navigation-v002.mjs'", "      - 'tools/verify-student-voice-navigation-v002.mjs'\n      - 'tools/browser-student-voice-handoff-v002.mjs'")
              src = src.replace("      - name: Student Voice cross-product navigation contract\n        run: node tools/verify-student-voice-navigation-v002.mjs", "      - name: Student Voice cross-product navigation contract\n        run: node tools/verify-student-voice-navigation-v002.mjs\n      - name: Install Chromium for Student Voice handoff\n        run: |\n          npm install --no-save --no-package-lock playwright@1.55.0\n          npx playwright install --with-deps chromium\n      - name: Student Voice ln-rank to Tongxue browser handoff\n        run: node tools/browser-student-voice-handoff-v002.mjs")
          Path('.github/workflows/verify-unified-experience-context-v001.yml').write_text(src)
          PY

      - name: Verify generated source and exact school-all handoff
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs
          test ! -e .github/workflows/tmp-tongxue-major-handoff-v3990_3-builder.yml
          node --check shared/resources/experience/student-voice-navigation.v002.js
          node --check ln-rank/js/workspace/major-path-handoff.v004.js
          node --check tongxue/app/tongxue-runtime-v160-r3990_3.js
          node --check tongxue/app/tongxue-runtime-controller-v160.js
          node --check tongxue/app/tongxue-runtime-result-view-v160.js
          node --check tools/browser-student-voice-handoff-v002.mjs
          node --check tools/browser-tongxue-runtime-v160.mjs
          node tools/verify-student-voice-navigation-v002.mjs
          node tools/audit-canonical-release-version-v3990_3.mjs
          node tools/audit-site-runtime-generation-v3990_3.mjs
          node tools/audit-architecture-handoff-v3990_3.mjs
          git diff --check
          git diff --name-only HEAD | tee /tmp/repair-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/repair-files.txt; then
            echo 'Protected path touched.' >&2
            exit 1
          fi
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'tongxue-runtime-v160-r3990_3.js?v=3990_3' tongxue/index.html
          grep -q 'major-path-handoff.v004.js?v=004_0' ln-rank/js/app.v3990_3.js

      - name: Install Chromium and run four-terminal handoff browser proof
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tools/browser-student-voice-handoff-v002.mjs

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'v3.9.90.3：修复 ln-rank 到同学你好专业直达与缓存身份'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
