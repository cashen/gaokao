name: One-time ordered-id pagination v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-ordered-id-pagination-v3990.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch ordered-ID pagination and page-only decode
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('functions/_lib/major-bands-static-provider.js')
          provider = provider_path.read_text(encoding='utf-8')
          old = '''  const schema = Array.isArray(manifest.recordSchema) ? manifest.recordSchema : [];\n  const rankIndex = schema.indexOf('rank2026');\n  const rankRange = options.rankRange && Number.isFinite(Number(options.rankRange.minRank)) && Number.isFinite(Number(options.rankRange.maxRank))\n    ? Object.freeze({\n        minRank: Number(options.rankRange.minRank),\n        maxRank: Number(options.rankRange.maxRank)\n      })\n    : null;\n  const selectedRows = rankRange && rankIndex >= 0\n    ? payload.rows.filter(row => majorBandsRankValueMatchesRange(row?.[rankIndex], rankRange))\n    : payload.rows;\n  return {\n    manifest,\n    bucket,\n    records: selectedRows.map(row => decodeRow(row, schema)),\n    rowCount: payload.rows.length,\n    decodedRowCount: selectedRows.length,\n    rankRowsSkipped: payload.rows.length - selectedRows.length,\n    rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n    rankRange,\n'''
          new = '''  const schema = Array.isArray(manifest.recordSchema) ? manifest.recordSchema : [];\n  const rankIndex = schema.indexOf('rank2026');\n  const idIndex = schema.indexOf('id');\n  const rankRange = options.rankRange && Number.isFinite(Number(options.rankRange.minRank)) && Number.isFinite(Number(options.rankRange.maxRank))\n    ? Object.freeze({\n        minRank: Number(options.rankRange.minRank),\n        maxRank: Number(options.rankRange.maxRank)\n      })\n    : null;\n  const allowedIds = options.allowedIds instanceof Set ? options.allowedIds : null;\n  const rankFilteredRows = rankRange && rankIndex >= 0\n    ? payload.rows.filter(row => majorBandsRankValueMatchesRange(row?.[rankIndex], rankRange))\n    : payload.rows;\n  const selectedRows = allowedIds && idIndex >= 0\n    ? rankFilteredRows.filter(row => allowedIds.has(String(row?.[idIndex] || '')))\n    : rankFilteredRows;\n  return {\n    manifest,\n    bucket,\n    records: selectedRows.map(row => decodeRow(row, schema)),\n    rowCount: payload.rows.length,\n    decodedRowCount: selectedRows.length,\n    rankRowsSkipped: payload.rows.length - selectedRows.length,\n    pageIdRowsSkipped: rankFilteredRows.length - selectedRows.length,\n    pageIdFilterCount: allowedIds?.size || 0,\n    pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n    rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n    rankRange,\n'''
          assert old in provider
          provider_path.write_text(provider.replace(old, new, 1), encoding='utf-8')

          loader_path = Path('functions/_lib/major-bands-rank-bucket-loader.v3990_0.js')
          loader = loader_path.read_text(encoding='utf-8')
          old_key = '''function bucketReadKey(indexBucket, scope = {}) {\n  const range = scope.requestedRange;\n  const suffix = range && Number.isFinite(Number(range.minRank)) && Number.isFinite(Number(range.maxRank))\n    ? `${Number(range.minRank)}:${Number(range.maxRank)}`\n    : 'all-ranks';\n  return `${indexBucket.file}|${suffix}`;\n}\n\nasync function readBucket(context, indexBucket, scope) {\n  const cacheKey = bucketReadKey(indexBucket, scope);\n'''
          new_key = '''function pageIdFingerprint(allowedIds) {\n  if (!(allowedIds instanceof Set) || !allowedIds.size) return 'all-ids';\n  let hash = 0x811c9dc5;\n  for (const id of [...allowedIds].sort()) {\n    const value = String(id || '');\n    for (let index = 0; index < value.length; index += 1) {\n      hash ^= value.charCodeAt(index);\n      hash = Math.imul(hash, 0x01000193) >>> 0;\n    }\n  }\n  return `${allowedIds.size}:${hash.toString(16).padStart(8, '0')}`;\n}\n\nfunction bucketReadKey(indexBucket, scope = {}, options = {}) {\n  const range = scope.requestedRange;\n  const suffix = range && Number.isFinite(Number(range.minRank)) && Number.isFinite(Number(range.maxRank))\n    ? `${Number(range.minRank)}:${Number(range.maxRank)}`\n    : 'all-ranks';\n  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}`;\n}\n\nasync function readBucket(context, indexBucket, scope, options = {}) {\n  const cacheKey = bucketReadKey(indexBucket, scope, options);\n'''
          assert old_key in loader
          loader = loader.replace(old_key, new_key, 1)
          old_load = '''  entry.promise = loadMajorBandsStaticRankBucket(context.request, indexBucket.file, {\n    assets: context.env?.ASSETS,\n    rankRange: scope.requestedRange\n  }).then(loaded => {\n'''
          new_load = '''  entry.promise = loadMajorBandsStaticRankBucket(context.request, indexBucket.file, {\n    assets: context.env?.ASSETS,\n    rankRange: scope.requestedRange,\n    allowedIds: options.allowedIds\n  }).then(loaded => {\n'''
          assert old_load in loader
          loader = loader.replace(old_load, new_load, 1)
          loader = loader.replace(
              'export async function loadMajorBandsRankWindow(context, selectedBuckets = []) {',
              'export async function loadMajorBandsRankWindow(context, selectedBuckets = [], options = {}) {',
              1
          )
          assert 'results[index] = await readBucket(context, buckets[index], scope);' in loader
          loader = loader.replace(
              'results[index] = await readBucket(context, buckets[index], scope);',
              'results[index] = await readBucket(context, buckets[index], scope, options);',
              1
          )
          loader = loader.replace(
              '        rankRowsSkipped: 0,\n        rankRowFilterVersion:',
              "        rankRowsSkipped: 0,\n        pageIdRowsSkipped: 0,\n        pageIdFilterCount: options.allowedIds instanceof Set ? options.allowedIds.size : 0,\n        pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n        rankRowFilterVersion:",
              1
          )
          loader = loader.replace(
              '  let rankRowsSkipped = 0;\n',
              '  let rankRowsSkipped = 0;\n  let pageIdRowsSkipped = 0;\n',
              1
          )
          loader = loader.replace(
              '    rankRowsSkipped += Number(result.loaded.rankRowsSkipped || 0);\n',
              '    rankRowsSkipped += Number(result.loaded.rankRowsSkipped || 0);\n    pageIdRowsSkipped += Number(result.loaded.pageIdRowsSkipped || 0);\n',
              1
          )
          loader = loader.replace(
              '      rankRowsSkipped,\n      rankRowFilterVersion:',
              "      rankRowsSkipped,\n      pageIdRowsSkipped,\n      pageIdFilterCount: options.allowedIds instanceof Set ? options.allowedIds.size : 0,\n      pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n      rankRowFilterVersion:",
              1
          )
          loader_path.write_text(loader, encoding='utf-8')

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')
          bottom_import = '''import {\n  normalizeBottomLineMode,\n  bottomLineModeSummary\n} from '../_lib/bottomline-policy.js';\n'''
          bottom_patch = '''import {\n  getBottomLineEligibility,\n  normalizeBottomLineMode,\n  bottomLineModeSummary\n} from '../_lib/bottomline-policy.js';\n'''
          assert bottom_import in api
          api = api.replace(bottom_import, bottom_patch, 1)

          band_anchor = "const BAND_KEYS = Object.freeze(['upper', 'near', 'steady']);\n"
          cache_code = '''const BAND_KEYS = Object.freeze(['upper', 'near', 'steady']);\nexport const MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION = 'major-bands-requested-band-order-id-cache-v3990_0';\nconst REQUESTED_BAND_ORDER_CACHE_TTL_MS = 30_000;\nconst REQUESTED_BAND_ORDER_CACHE_MAX_IDS = 6000;\nconst REQUESTED_BAND_ORDER_CACHE_MAX_CHARS = 500_000;\nlet requestedBandOrderCache = null;\n\nfunction readRequestedBandOrderSnapshot(identity, now = Date.now()) {\n  if (!requestedBandOrderCache || requestedBandOrderCache.expiresAt <= now) {\n    requestedBandOrderCache = null;\n    return null;\n  }\n  if (requestedBandOrderCache.identity !== identity) return null;\n  try {\n    return JSON.parse(requestedBandOrderCache.serialized);\n  } catch {\n    requestedBandOrderCache = null;\n    return null;\n  }\n}\n\nfunction retainRequestedBandOrderSnapshot(identity, snapshot) {\n  const ids = Array.isArray(snapshot?.orderedIds) ? snapshot.orderedIds : [];\n  if (ids.length > REQUESTED_BAND_ORDER_CACHE_MAX_IDS) return false;\n  const serialized = JSON.stringify(snapshot);\n  if (serialized.length > REQUESTED_BAND_ORDER_CACHE_MAX_CHARS) return false;\n  requestedBandOrderCache = {\n    identity,\n    serialized,\n    expiresAt: Date.now() + REQUESTED_BAND_ORDER_CACHE_TTL_MS\n  };\n  return true;\n}\n\nfunction requestedBandOrderCacheState(identity = '') {\n  const snapshot = readRequestedBandOrderSnapshot(identity);\n  return {\n    version: MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION,\n    hit: Boolean(snapshot),\n    completed: requestedBandOrderCache ? 1 : 0,\n    ids: snapshot?.orderedIds?.length || 0,\n    maxIds: REQUESTED_BAND_ORDER_CACHE_MAX_IDS,\n    maxChars: REQUESTED_BAND_ORDER_CACHE_MAX_CHARS,\n    ttlMs: REQUESTED_BAND_ORDER_CACHE_TTL_MS,\n    serializedOrderIdsOnly: true,\n    retainsDecodedRows: false,\n    retainsEnrichedRecords: false\n  };\n}\n'''
          assert band_anchor in api
          api = api.replace(band_anchor, cache_code, 1)

          helper_anchor = 'export async function onRequest(context) {'
          helper = '''async function executeRequestedBandOrderedPage(context, input) {\n  const {\n    candidateScore, rangePreset, filters, schoolNames, schoolFilter, requestedBand,\n    pageOffset, pageLimit, executionBaseIdentity\n  } = input;\n  const orderIdentity = `${executionBaseIdentity}|ordered-id-snapshot`;\n  let retained = readRequestedBandOrderSnapshot(orderIdentity);\n  let heavyExecution = null;\n  let orderedRecords = null;\n  let loadedStats = null;\n  let selectedBuckets = null;\n  let orderCacheStatus = retained ? 'ordered-id-hit' : 'ordered-id-miss';\n\n  if (!retained) {\n    heavyExecution = await executeMajorBandsQueryOnce(orderIdentity, async () => {\n      const candidateRank = rankContextForScore(candidateScore);\n      const totalRank = getRankPopulation({ year: 2026, region: 'ln', subject: 'physics', policy: 'table-total' });\n      const rankWindows = rankWindowsForCandidate(candidateRank?.rankForGap, rangePreset, totalRank);\n      const selected = selectMajorBandsRankBuckets(rankWindows);\n      const loaded = await loadMajorBandsRankWindow(context, selected);\n      const processed = processMajorBandsRankWindow(loaded.records, {\n        candidateScore,\n        candidateRank,\n        rangePreset,\n        region: filters.region,\n        majorKeyword: '',\n        bottomLineMode: filters.bottomLineMode,\n        specialProjectMode: filters.specialProjectMode,\n        schoolFilter,\n        acceptedSchoolNames: schoolNames\n      });\n      const ordered = processed.grouped[requestedBand].ordered;\n      const identity = queryIdentity({ candidateScore, rangePreset, filters, schoolNames, band: requestedBand });\n      const orderSnapshot = {\n        version: MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION,\n        candidateRank,\n        totalRank,\n        rankWindows,\n        aggregate: processed.stats,\n        keywordQuery: processed.keywordQuery,\n        orderedIds: ordered.map(record => record.id),\n        snapshot: majorBandsSnapshotId(ordered, identity)\n      };\n      return {\n        retained: orderSnapshot,\n        orderedRecords: ordered,\n        loadedStats: loaded.stats,\n        selectedBuckets: selected\n      };\n    });\n    const built = heavyExecution.value;\n    retained = built.retained;\n    orderedRecords = built.orderedRecords;\n    loadedStats = built.loadedStats;\n    selectedBuckets = built.selectedBuckets;\n    retainRequestedBandOrderSnapshot(orderIdentity, retained);\n    orderCacheStatus = heavyExecution.joinedInFlight ? 'ordered-id-singleflight-hit' : 'ordered-id-miss';\n  }\n\n  const orderedIds = Array.isArray(retained.orderedIds) ? retained.orderedIds : [];\n  const pageIds = orderedIds.slice(pageOffset, pageOffset + pageLimit);\n  let pageRecords;\n  if (orderedRecords) {\n    pageRecords = orderedRecords.slice(pageOffset, pageOffset + pageLimit);\n  } else {\n    selectedBuckets = selectMajorBandsRankBuckets(retained.rankWindows);\n    const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, { allowedIds: new Set(pageIds) });\n    loadedStats = loaded.stats;\n    const byId = new Map(loaded.records.map(record => [record.id, record]));\n    pageRecords = pageIds.map(id => byId.get(id)).filter(Boolean);\n    if (pageRecords.length !== pageIds.length) {\n      throw new Error(`位次有序 ID 页记录不完整：${pageRecords.length}/${pageIds.length}`);\n    }\n    for (const record of pageRecords) {\n      const canonicalPosition = resolveCanonicalPosition({\n        candidateScore,\n        candidateRank: retained.candidateRank?.rankForGap,\n        recordScore: record.score2026 ?? record.score,\n        recordRank: record.rank2026 ?? record.rank,\n        rangePreset\n      });\n      const bottomLineEligibility = filters.bottomLineMode === 'all'\n        ? { status: 'pass', reason: 'mode_does_not_exclude' }\n        : getBottomLineEligibility(record, filters.bottomLineMode);\n      Object.assign(record, {\n        band: requestedBand,\n        bandKey: requestedBand,\n        canonicalPosition: {\n          bandKey: canonicalPosition.bandKey,\n          positionDistance: canonicalPosition.positionDistance,\n          evidenceStrength: canonicalPosition.evidenceStrength,\n          classificationBasis: canonicalPosition.classificationBasis\n        },\n        bottomLineEligibility: bottomLineEligibility.status,\n        bottomLineEligibilityReason: bottomLineEligibility.reason,\n        specialProject: record.specialProject?.hasSpecialProject != null\n          ? record.specialProject\n          : detectSpecialProject(record)\n      });\n    }\n  }\n\n  const compactPage = pageRecords.map(record => compactMajorBandsBucketCandidate(record));\n  const nextOffset = pageOffset + compactPage.length;\n  const hasMore = nextOffset < orderedIds.length;\n  const compactGrouped = {};\n  for (const key of BAND_KEYS) {\n    const identity = queryIdentity({ candidateScore, rangePreset, filters, schoolNames, band: key });\n    if (key === requestedBand) {\n      compactGrouped[key] = {\n        ordered: compactPage,\n        count: orderedIds.length,\n        snapshot: retained.snapshot,\n        retentionScope: 'current-requested-band-page-from-ordered-ids',\n        pagination: {\n          offset: pageOffset,\n          limit: pageLimit,\n          returned: compactPage.length,\n          hasMore,\n          nextOffset: hasMore ? nextOffset : null,\n          order: MAJOR_BANDS_RESULT_ORDER_VERSION,\n          snapshot: retained.snapshot\n        }\n      };\n    } else {\n      compactGrouped[key] = {\n        ordered: [],\n        count: 0,\n        snapshot: majorBandsSnapshotId([], identity),\n        retentionScope: 'hidden-band',\n        pagination: null\n      };\n    }\n  }\n  return {\n    value: {\n      candidateRank: retained.candidateRank,\n      totalRank: retained.totalRank,\n      rankWindows: retained.rankWindows,\n      selectedBuckets,\n      loadedStats,\n      aggregate: retained.aggregate,\n      keywordQuery: retained.keywordQuery,\n      compactGrouped,\n      cacheRetention: {\n        mode: 'compact-requested-band-current-page-from-ordered-ids',\n        recordCount: compactPage.length,\n        estimatedBytes: JSON.stringify(compactPage).length,\n        requestedBand,\n        pageOffset,\n        pageLimit,\n        retainCompleted: false\n      }\n    },\n    cacheStatus: heavyExecution?.cacheStatus || orderCacheStatus,\n    joinedInFlight: Boolean(heavyExecution?.joinedInFlight),\n    waitedForExecutionSlot: Boolean(heavyExecution?.waitedForExecutionSlot),\n    orderCacheStatus,\n    orderCacheIdCount: orderedIds.length,\n    pageDecodedRecordCount: pageRecords.length,\n    orderCacheState: requestedBandOrderCacheState(orderIdentity)\n  };\n}\n\n'''
          assert helper_anchor in api
          api = api.replace(helper_anchor, helper + helper_anchor, 1)

          identity_anchor = '''    const executionIdentity = `${executionBaseIdentity}|current-page:${pageOffset}:${pageLimit}`;\n    const execution = await executeMajorBandsQueryOnce(executionIdentity, async () => {\n'''
          identity_patch = '''    const executionIdentity = `${executionBaseIdentity}|current-page:${pageOffset}:${pageLimit}`;\n    const execution = !filters.majorKeyword\n      ? await executeRequestedBandOrderedPage(context, {\n          candidateScore, rangePreset, filters, schoolNames, schoolFilter, requestedBand,\n          pageOffset, pageLimit, executionBaseIdentity\n        })\n      : await executeMajorBandsQueryOnce(executionIdentity, async () => {\n'''
          assert identity_anchor in api
          api = api.replace(identity_anchor, identity_patch, 1)

          source_anchor = '''        queryExecutionPageLimit: cacheRetention.pageLimit,\n        queryMemoryMode: aggregate.memoryMode,\n'''
          source_patch = '''        queryExecutionPageLimit: cacheRetention.pageLimit,\n        requestedBandOrderCacheVersion: MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION,\n        requestedBandOrderCacheStatus: execution.orderCacheStatus || 'keyword-bypass',\n        requestedBandOrderIds: Number(execution.orderCacheIdCount || 0),\n        requestedBandPageDecodedRecords: Number(execution.pageDecodedRecordCount || cacheRetention.recordCount || 0),\n        requestedBandOrderCacheRetainsDecodedRows: false,\n        requestedBandOrderCacheRetainsEnrichedRecords: false,\n        queryMemoryMode: aggregate.memoryMode,\n'''
          assert source_anchor in api
          api = api.replace(source_anchor, source_patch, 1)
          source_rows_anchor = '''        rankRowsSkipped: loadedStats.rankRowsSkipped,\n        rankBucketConcurrency: loadedStats.peakConcurrency,\n'''
          source_rows_patch = '''        rankRowsSkipped: loadedStats.rankRowsSkipped,\n        pageIdRowsSkipped: loadedStats.pageIdRowsSkipped || 0,\n        pageIdFilterCount: loadedStats.pageIdFilterCount || 0,\n        pageIdFilterVersion: loadedStats.pageIdFilterVersion || 'major-bands-page-id-predecode-filter-v3990_0',\n        rankBucketConcurrency: loadedStats.peakConcurrency,\n'''
          assert source_rows_anchor in api
          api = api.replace(source_rows_anchor, source_rows_patch, 1)
          api_path.write_text(api, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          version_anchor = "const expectedQueryMemoryMode = 'requested-band-lightweight-order-current-page-v3990_0';\n"
          version_patch = version_anchor + "const expectedOrderIdCacheVersion = 'major-bands-requested-band-order-id-cache-v3990_0';\nconst expectedPageIdFilterVersion = 'major-bands-page-id-predecode-filter-v3990_0';\n"
          assert version_anchor in verifier
          verifier = verifier.replace(version_anchor, version_patch, 1)
          allowed_old = "    : ['miss', 'singleflight-hit', 'serialized-compact-hit'];\n"
          allowed_new = "    : ['miss', 'singleflight-hit', 'serialized-compact-hit', 'ordered-id-hit', 'ordered-id-miss', 'ordered-id-singleflight-hit'];\n"
          assert allowed_old in verifier
          verifier = verifier.replace(allowed_old, allowed_new, 1)
          check_anchor = '''  assert.equal(result.payload?.source?.queryMemoryMode, expectedQueryMemoryMode, `${result.scenario}: query memory deployment`);\n'''
          check_patch = check_anchor + '''  assert.equal(result.payload?.source?.requestedBandOrderCacheVersion, expectedOrderIdCacheVersion, `${result.scenario}: ordered-ID cache deployment`);\n  assert.equal(result.payload?.source?.requestedBandOrderCacheRetainsDecodedRows, false, `${result.scenario}: ordered-ID cache retained decoded rows`);\n  assert.equal(result.payload?.source?.requestedBandOrderCacheRetainsEnrichedRecords, false, `${result.scenario}: ordered-ID cache retained enriched records`);\n  assert.equal(result.payload?.source?.pageIdFilterVersion, expectedPageIdFilterVersion, `${result.scenario}: page-ID predecode filter`);\n'''
          assert check_anchor in verifier
          verifier = verifier.replace(check_anchor, check_patch, 1)
          retention_old = "    assert.equal(result.payload?.source?.queryExecutionRetentionMode, 'compact-requested-band-current-page', `${result.scenario}: requested-band retention mode`);\n"
          retention_new = "    assert.ok(['compact-requested-band-current-page', 'compact-requested-band-current-page-from-ordered-ids'].includes(result.payload?.source?.queryExecutionRetentionMode), `${result.scenario}: requested-band retention mode`);\n"
          assert retention_old in verifier
          verifier = verifier.replace(retention_old, retention_new, 1)
          decode_anchor = '''    assert.ok(Number(result.payload?.source?.sortPasses || 0) <= 1, `${result.scenario}: requested-band performed more than one sort`);\n'''
          decode_patch = decode_anchor + '''    if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\n      assert.ok(Number(result.payload?.source?.rankDecodedRowCount || 0) <= Number(group.pagination?.limit || 0), `${result.scenario}: ordered-ID hit decoded more than current page`);\n      assert.ok(Number(result.payload?.source?.requestedBandPageDecodedRecords || 0) <= Number(group.pagination?.limit || 0), `${result.scenario}: ordered-ID page exceeded limit`);\n    }\n'''
          assert decode_anchor in verifier
          verifier = verifier.replace(decode_anchor, decode_patch, 1)
          evidence_anchor = '  rankRowFilterVersion: expectedRankRowFilterVersion,\n'
          evidence_patch = evidence_anchor + '  orderedIdCacheVersion: expectedOrderIdCacheVersion,\n  pageIdFilterVersion: expectedPageIdFilterVersion,\n'
          assert evidence_anchor in verifier
          verifier = verifier.replace(evidence_anchor, evidence_patch, 1)
          verifier_path.write_text(verifier, encoding='utf-8')

          rank_audit_path = Path('tools/audit-major-bands-rank-kernel-v3990_0.mjs')
          rank_audit = rank_audit_path.read_text(encoding='utf-8')
          api_anchor = "const apiSource = fs.readFileSync('functions/api/major-bands.js', 'utf8');\n"
          api_patch = api_anchor + '''for (const required of [\n  "MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION = 'major-bands-requested-band-order-id-cache-v3990_0'",\n  'executeRequestedBandOrderedPage',\n  'orderedIds: ordered.map(record => record.id)',\n  'allowedIds: new Set(pageIds)',\n  'requestedBandOrderCacheRetainsDecodedRows: false',\n  'requestedBandOrderCacheRetainsEnrichedRecords: false'\n]) assert.ok(apiSource.includes(required), `ordered-ID pagination contract missing ${required}`);\n'''
          assert api_anchor in rank_audit
          rank_audit = rank_audit.replace(api_anchor, api_patch, 1)
          rank_audit_path.write_text(rank_audit, encoding='utf-8')

          cache_audit_path = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          cache_audit = cache_audit_path.read_text(encoding='utf-8')
          required_anchor = "  'rankingCandidateMode: aggregate.rankingCandidateMode',\n"
          required_patch = required_anchor + "  'executeRequestedBandOrderedPage',\n  'requestedBandOrderCacheVersion: MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION',\n  \"mode: 'compact-requested-band-current-page-from-ordered-ids'\",\n"
          assert required_anchor in cache_audit
          cache_audit = cache_audit.replace(required_anchor, required_patch, 1)
          cache_audit_path.write_text(cache_audit, encoding='utf-8')

          for workflow_path in [\n              Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'),\n              Path('.github/workflows/verify-production-api-health-v3971.yml')\n          ]:
              workflow = workflow_path.read_text(encoding='utf-8')
              if '<<<"$body"' in workflow:
                  anchor = "              && grep -q '\"queryMemoryMode\":\"requested-band-lightweight-order-current-page-v3990_0\"' <<<\"$body\" \\\n"
                  patch = anchor + "              && grep -q '\"requestedBandOrderCacheVersion\":\"major-bands-requested-band-order-id-cache-v3990_0\"' <<<\"$body\" \\\n"
              else:
                  anchor = "              && grep -q '\"queryMemoryMode\":\"requested-band-lightweight-order-current-page-v3990_0\"' <<<\"$api\" \\\n"
                  patch = anchor + "              && grep -q '\"requestedBandOrderCacheVersion\":\"major-bands-requested-band-order-id-cache-v3990_0\"' <<<\"$api\" \\\n"
              assert anchor in workflow
              workflow_path.write_text(workflow.replace(anchor, patch, 1), encoding='utf-8')
          PY

          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_0.js
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f, aliases: true) }"
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs

      - name: Verify repeated pagination and full local pressure
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8799 --compatibility-date=2026-07-01 >/tmp/v3990-ordered-id-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/v3990-ordered-id-ready.json -w '%{http_code}' 'http://127.0.0.1:8799/api/major-bands?candidateScore=508&rangePreset=standard&band=near&limit=37&offset=0' || true)"
            if [ "$status" = '200' ] && grep -q 'major-bands-requested-band-order-id-cache-v3990_0' /tmp/v3990-ordered-id-ready.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-ordered-id-ready.json || true; cat /tmp/v3990-ordered-id-wrangler.log; exit 1; fi

          node --input-type=module - <<'NODE'
          const base = 'http://127.0.0.1:8799';
          for (let traversal = 0; traversal < 3; traversal += 1) {
            let offset = 0;
            let count = null;
            const seen = new Set();
            while (true) {
              const response = await fetch(`${base}/api/major-bands?candidateScore=449&rangePreset=safe&band=near&limit=40&offset=${offset}&traversal=${traversal}`);
              const text = await response.text();
              if (response.status !== 200) throw new Error(`traversal ${traversal} offset ${offset}: HTTP ${response.status} ${text.slice(0, 200)}`);
              const payload = JSON.parse(text);
              const group = payload.bands.near;
              if (count == null) count = group.count;
              if (group.count !== count) throw new Error('count drift');
              for (const record of group.records) {
                if (seen.has(record.id)) throw new Error(`duplicate ${record.id}`);
                seen.add(record.id);
              }
              if (payload.source.requestedBandOrderCacheStatus === 'ordered-id-hit') {
                if (Number(payload.source.rankDecodedRowCount || 0) > Number(group.pagination.limit || 0)) throw new Error('ordered-ID hit decoded too many rows');
                if (payload.source.pageIdFilterVersion !== 'major-bands-page-id-predecode-filter-v3990_0') throw new Error('page-ID filter missing');
              }
              if (!group.pagination.hasMore) break;
              if (!(group.pagination.nextOffset > offset)) throw new Error('nextOffset not strict');
              offset = group.pagination.nextOffset;
            }
            if (seen.size !== count) throw new Error(`traversal ${traversal}: ${seen.size} != ${count}`);
          }
          NODE

          TARGET_BASE='http://127.0.0.1:8799' \
          CONCURRENCY_LEVELS='1,5,10,25,50' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='12000' \
          P95_LIMIT_MS='7000' \
          P99_LIMIT_MS='12000' \
          HARD_LIMIT_MS='20000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-ordered-id-local-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs

      - name: Stage workflows and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-ordered-id-pagination-v3990.yml' || true)
          test "${#workflows[@]}" -ge 1
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools
          git commit -m 'fix(rank): paginate through ordered ID snapshots'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-ordered-id-pagination
          path: |
            /tmp/v3990-ordered-id-ready.json
            /tmp/v3990-ordered-id-local-concurrency.json
            /tmp/v3990-ordered-id-wrangler.log
          if-no-files-found: warn
          retention-days: 7
