name: One-time v3990 production static diagnostic

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-production-static-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-production-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f366b34a10da05a3bf3e4c736231d7826ecfe67d
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current production static graph once
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          RELEASE_SHA: f366b34a10da05a3bf3e4c736231d7826ecfe67d
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          VERIFY_MAJOR_BANDS: 'false'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-production-static-diagnostic.json
        run: |
          set -o pipefail
          node tools/verify-production-resource-graph-v3990_0.mjs 2>&1 | tee /tmp/v3990-production-static-diagnostic.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-production-static-diagnostic
          path: |
            /tmp/v3990-production-static-diagnostic.json
            /tmp/v3990-production-static-diagnostic.log
          if-no-files-found: warn
          retention-days: 3
