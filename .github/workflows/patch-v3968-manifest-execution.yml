name: Patch v3968 manifest execution metadata

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align manifests and trace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          for rel in ['ln-rank/active-assets.json','ln-rank/release-meta.json']:
              p=Path(rel); data=json.loads(p.read_text())
              data['resourceExecutionVersion']='resource-execution-v3968_0'
              data['derivationTraceVersion']='derivation-trace-v3968_0'
              data['academicBackgroundVersion']='academic-background-v3968_0'
              data['academicBackgroundMatcherVersion']='academic-background-matcher-v3968_0'
              data['academicBackgroundProviderVersion']='academic-background-provider-v3968_0'
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node tools/build-derived-asset-trace-v3968.mjs --write
          node tools/build-derived-asset-trace-v3968.mjs
          node tools/audit-derived-assets-v3968.mjs
          python3 tools/ln-2026/verify-final-release-v3968.py
          git diff --check
      - name: Commit manifest ownership correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ln-rank/active-assets.json ln-rank/release-meta.json shared/governance/derived-asset-trace.v3968_0.json
          git commit -m 'fix: align v3968 manifest execution and derivation ownership'
          git push origin HEAD:${{ github.head_ref }}
