name: Bootstrap LN 2024 rank table

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - tools/ln-2026/build-ln-2024-rank-table.py
      - .github/workflows/bootstrap-ln-2024-rank.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR runtime
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr >/dev/null
          python -m pip install -q --disable-pip-version-check pillow
      - name: Preserve all authoritative source images
        run: |
          set -euo pipefail
          mkdir -p /tmp/ln-2024-rank-debug
          base='https://jyt.ln.gov.cn/jyt/imageDir/2024/06/img_pc_site'
          curl --fail --silent --show-error --location "$base/2024062510272296122.jpg" -o /tmp/ln-2024-rank-debug/official-page-1.jpg
          curl --fail --silent --show-error --location "$base/2024062510272259656.jpg" -o /tmp/ln-2024-rank-debug/official-page-2.jpg
          curl --fail --silent --show-error --location "$base/2024062510272212732.jpg" -o /tmp/ln-2024-rank-debug/official-page-3.jpg
          curl --fail --silent --show-error --location "$base/2024062510272389940.jpg" -o /tmp/ln-2024-rank-debug/official-page-4.jpg
      - name: Build and validate 2024 official rank table
        env:
          PYTHONUNBUFFERED: '1'
          LN_2024_DEBUG_DIR: /tmp/ln-2024-rank-debug
        run: |
          set +e
          mkdir -p analysis/2026
          python tools/ln-2026/build-ln-2024-rank-table.py > /tmp/ln-2024-rank-build.log 2>&1
          status=$?
          cat /tmp/ln-2024-rank-build.log
          echo "$status" > /tmp/ln-2024-rank-debug/exit-status.txt
          cp /tmp/ln-2024-rank-build.log /tmp/ln-2024-rank-debug/build.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/ln-2024-rank-build.log analysis/2026/ln-2024-rank-build-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add analysis/2026/ln-2024-rank-build-error.txt
            git commit -m '记录2024一分一段生成诊断' || true
            git push origin HEAD:${{ github.head_ref }} || true
            exit "$status"
          fi
      - name: Upload OCR diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ln-2024-rank-ocr-${{ github.run_id }}
          path: /tmp/ln-2024-rank-debug
          if-no-files-found: warn
          retention-days: 3
      - name: Commit generated immutable resources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ln-2024-physics-score-rank.js analysis/2026/ln-2024-rank-source-audit.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m '生成2024辽宁物理类官方一分一段资源'
          git push origin HEAD:${{ github.head_ref }}
