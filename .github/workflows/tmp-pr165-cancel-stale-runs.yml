name: TEMP PR165 cancel stale runs

on:
  push:
    branches: [agent/aiplus-major-introduction-knowledge]
    paths:
      - '.github/workflows/tmp-pr165-cancel-stale-runs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale PR #165 branch runs
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'agent/aiplus-major-introduction-knowledge';
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch,
              per_page: 100,
            });
            const stale = runs.filter(run =>
              run.id !== context.runId &&
              run.event === 'pull_request' &&
              ['queued','in_progress','waiting','requested','pending'].includes(run.status)
            );
            core.info(`Cancelling ${stale.length} stale PR runs on ${branch}`);
            for (const run of stale) {
              core.info(`cancel ${run.id} ${run.name} ${run.head_sha} ${run.status}`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }
