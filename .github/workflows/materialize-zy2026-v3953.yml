name: Materialize ZY2026 structure data

on:
  push:
    branches:
      - agent/zy2026-structure-v3953
    paths:
      - 'tools/ln-2026/build-zy2026-structure.py'
      - 'tools/ln-2026/finalize-v3953-assets.py'
      - '.github/workflows/materialize-zy2026-v3953.yml'
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false
      - name: Build audited 2025 to 2026 structure relations
        shell: bash
        run: |
          set +e
          python3 tools/ln-2026/build-zy2026-structure.py > /tmp/zy2026-build.out 2> /tmp/zy2026-build.err
          status=$?
          cat /tmp/zy2026-build.out
          if [ "$status" -ne 0 ]; then
            echo '--- ZY2026 BUILD ERROR ---'
            tail -n 60 /tmp/zy2026-build.err
            exit "$status"
          fi
      - name: Finalize v3953 pages and active asset contracts
        run: python3 tools/ln-2026/finalize-v3953-assets.py
      - name: Remove temporary bootstrap and materialization files
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-zy2026-v3953.yml
          rm -f .github/workflows/materialize-zy2026-v3953.yml
      - name: Commit generated structure data and release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .bootstrap \
            .github/workflows/bootstrap-zy2026-v3953.yml \
            .github/workflows/materialize-zy2026-v3953.yml \
            data/zy2026 \
            analysis/2026/zy2026-audit.json \
            analysis/2026/zy2026-summary.json \
            analysis/2026/zy2026-relations.json \
            ln-rank/data/major-trend-2026.json \
            ln-rank/release-meta.json \
            ln-rank/active-assets.json \
            ln-rank/index.html \
            ln-rank/selection-pool.html \
            ln-rank/local-mainline.html \
            ln-rank/211-mainline.html \
            ln-rank/major-trend-2026.html \
            ln2026.html lngk2026.html \
            index.html e.html zy.html zy2026.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Materialize ZY2026 data and finalize v3.9.53.0'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
