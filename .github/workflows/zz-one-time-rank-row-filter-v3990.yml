name: One-time rank row filter v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reapply audited row-filter patch and validate contracts
        run: |
          set -euo pipefail
          git show 03b8b3ea9f820a57c6717548ba22b41ef93f0a2b:.github/workflows/zz-one-time-rank-row-filter-v3990.yml > /tmp/v3990-original-row-filter.yml
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0])
            steps = doc.fetch("jobs").fetch("patch").fetch("steps")
            step = steps.find { |item| item["name"] == "Apply exact rank-row predecode filtering" }
            abort "original patch step missing" unless step && step["run"]
            print step["run"]
          ' /tmp/v3990-original-row-filter.yml > /tmp/v3990-original-row-filter-run.sh
          awk '{ print } /^PY$/ { exit }' /tmp/v3990-original-row-filter-run.sh > /tmp/v3990-apply-row-filter.sh
          grep -q "python3 - <<'PY'" /tmp/v3990-apply-row-filter.sh
          tail -n 1 /tmp/v3990-apply-row-filter.sh | grep -qx 'PY'
          bash /tmp/v3990-apply-row-filter.sh

          python3 - <<'PY'
          from pathlib import Path

          patch_dir = Path('tools/.workflow-contract-patches-v3990')
          expected = {
              'verify-major-bands-bounded-fanout-v3972_5.yml',
              'verify-production-api-health-v3971.yml',
              'verify-production-resource-graph-v3972_6.yml'
          }
          actual = {path.name for path in patch_dir.glob('*.yml')}
          if actual != expected:
              raise SystemExit(f'unexpected staged workflows: {sorted(actual)}')

          for path in patch_dir.glob('*.yml'):
              lines = path.read_text(encoding='utf-8').splitlines()
              fixed = []
              for line in lines:
                  if line.startswith('grep -q "'):
                      line = '          ' + line
                  fixed.append(line)
              path.write_text('\n'.join(fixed) + '\n', encoding='utf-8')
          PY

          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_0.js
          node --check functions/api/major-bands.js
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-request-band-scope-v3990_0.mjs
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/v3990-row-filter-rank-audit.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_0.mjs
          for file in tools/.workflow-contract-patches-v3990/*.yml; do
            ruby -e "require 'yaml'; YAML.parse_file(ARGV[0])" "$file"
            if grep -n '^grep -q ' "$file"; then
              echo "unindented staged command remains: $file"
              exit 1
            fi
          done

      - name: Verify worst-case API and complete local concurrency
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8796 --compatibility-date=2026-07-01 >/tmp/v3990-row-filter-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8796/api/major-bands?candidateScore=358&rangePreset=safe&band=upper&limit=37&offset=0' >/tmp/v3990-row-filter-worst.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/v3990-row-filter-worst.json', 'utf8'));
          if (payload?.ok !== true) throw new Error('358-safe-upper failed');
          if (payload?.source?.rankRowFilterVersion !== 'major-bands-rank-row-filter-v3990_0') throw new Error('row filter version');
          if (!(Number(payload?.source?.rankRowsSkipped) > 0)) throw new Error('worst case did not skip rows');
          if (Number(payload?.source?.rankBucketMaxConcurrency) > 1) throw new Error('bucket concurrency exceeded one');
          if (Number(payload?.source?.rankRawRowCount) !== Number(payload?.source?.rankDecodedRowCount) + Number(payload?.source?.rankRowsSkipped)) throw new Error('row accounting');
          console.log(JSON.stringify({
            ok: true,
            count: payload.bands.upper.count,
            chunksRead: payload.source.chunksRead,
            rawRows: payload.source.rankRawRowCount,
            decodedRows: payload.source.rankDecodedRowCount,
            skippedRows: payload.source.rankRowsSkipped,
            elapsedMs: payload.meta.elapsedMs
          }, null, 2));
          NODE
          TARGET_BASE='http://127.0.0.1:8796' \
          CONCURRENCY_LEVELS='1,5,10,25,50' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='15000' \
          P95_LIMIT_MS='8000' \
          P99_LIMIT_MS='15000' \
          HARD_LIMIT_MS='25000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-row-filter-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs

      - name: Commit ordinary files and staged workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/major-bands-static-provider.js \
            functions/_lib/major-bands-rank-bucket-loader.v3990_0.js \
            functions/api/major-bands.js \
            tools/audit-major-bands-rank-kernel-v3990_0.mjs \
            tools/audit-major-bands-query-execution-cache-v3990_0.mjs \
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs \
            tools/.workflow-contract-patches-v3990
          git diff --cached --check
          git commit -m 'perf(rank): filter rank rows before materialization'
          git push origin HEAD:agent/rank-kernel-v3990_0
