name: Deploy main to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/deploy-cloudflare-pages-main.yml'
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/cloudflare-git-deployment.v3990_2.json'
      - 'shared/governance/production-resource-verification-contract.v3990_2.js'
      - 'tools/audit-canonical-release-version-v3990_2.mjs'
      - 'tools/audit-cloudflare-git-production-v3990_2.mjs'
      - 'tools/audit-production-resource-verification-v3990_2.mjs'
      - 'tools/audit-site-runtime-generation-v3990_2.mjs'
      - 'tools/verify-cloudflare-git-production-v3990_0.mjs'
      - 'tools/verify-production-resource-graph-v3990_2.mjs'
      - 'tools/verify-production-baseline-v3971.mjs'
      - 'functions/api/major-bands.js'
      - 'functions/api/major-bands-health.js'
      - 'functions/_lib/major-bands-*.js'

permissions:
  contents: read
  checks: read

# Retired direct-upload signatures retained only for the legacy drift auditor.
# They are comments, never executable deployment commands:
# wrangler@4.28.1 pages deploy .
# --commit-hash="$GITHUB_SHA"

concurrency:
  group: cloudflare-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployable v3.9.90.2 source and production contracts
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_sha"
          test -f 404.html
          grep -q '页面不存在' 404.html
          grep -q "display: 'v3.9.90.2'" shared/resources/release/current-release.js
          grep -q "siteRuntimeGeneration: 'v3990_2'" shared/resources/release/current-release.js
          grep -q "sharedResourceGraphVersion: 'site-resource-graph-v3990_2'" shared/resources/release/current-release.js
          grep -q 'cloudflare-pages-git-production-identity-v3990_2' shared/resources/release/cloudflare-git-deployment.v3990_2.json
          grep -q 'exact-github-sha-check-plus-immutable-preview-and-production-artifact-equivalence' shared/resources/release/cloudflare-git-deployment.v3990_2.json
          test -f ln-rank/data/major-bands-static-v3972_2/manifest.json
          test -f ln-rank/data/major-bands-static-v3972_2/audit.json
          test ! -e functions/api/local-strength.js
          test ! -e functions/_lib/local-strength-api.js
          for file in \
            functions/api/major-bands.js \
            functions/api/major-bands-health.js \
            functions/_lib/major-bands-static-provider.js \
            functions/_lib/major-bands-rank-bucket-loader.v3990_2.js \
            functions/_lib/major-bands-rank-query-kernel.v3990_2.js \
            functions/_lib/major-bands-query-execution-cache.v3990_1.js \
            tools/audit-canonical-release-version-v3990_2.mjs \
            tools/audit-cloudflare-git-production-v3990_2.mjs \
            tools/audit-production-resource-verification-v3990_2.mjs \
            tools/audit-site-runtime-generation-v3990_2.mjs \
            tools/verify-cloudflare-git-production-v3990_0.mjs \
            tools/verify-production-resource-graph-v3990_2.mjs \
            tools/verify-production-baseline-v3971.mjs; do
            node --check "$file"
          done
          node tools/audit-canonical-release-version-v3990_2.mjs
          node tools/audit-site-runtime-generation-v3990_2.mjs
          node tools/audit-production-resource-verification-v3990_2.mjs
          node tools/audit-cloudflare-git-production-v3990_2.mjs

          # Keep one maintained exact-SHA verifier algorithm. The v3990_2 release
          # maps only its release/generation marker strings at execution time.
          sed \
            -e 's/v3\.9\.90\.0/v3.9.90.2/g' \
            -e 's/v3990_0/v3990_2/g' \
            -e 's/3990_0/3990_2/g' \
            tools/verify-cloudflare-git-production-v3990_0.mjs > /tmp/verify-cloudflare-git-production-v3990_2.mjs
          node --check /tmp/verify-cloudflare-git-production-v3990_2.mjs

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CF_PROJECT_NAME: gaokao
      PAGES_BASE: https://gaokao-4y9.pages.dev
      CUSTOM_BASE: https://gaokao.powers.org.cn
      RELEASE_SHA: ${{ github.sha }}
      VERIFY_MAJOR_BANDS: 'true'
      EXPECTED_RELEASE: v3.9.90.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact main ref before deployment attestation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
      - name: Build current Cloudflare Git verifier from single maintained algorithm
        run: |
          set -euo pipefail
          sed \
            -e 's/v3\.9\.90\.0/v3.9.90.2/g' \
            -e 's/v3990_0/v3990_2/g' \
            -e 's/3990_0/3990_2/g' \
            tools/verify-cloudflare-git-production-v3990_0.mjs > /tmp/verify-cloudflare-git-production-v3990_2.mjs
          node --check /tmp/verify-cloudflare-git-production-v3990_2.mjs
      - name: Wait for exact Cloudflare Git production deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_GIT_DEPLOYMENT_ATTEMPTS: '45'
          CLOUDFLARE_GIT_DEPLOYMENT_WAIT_MS: '10000'
          CLOUDFLARE_GIT_DEPLOYMENT_EVIDENCE: /tmp/cloudflare-pages-v3990-1-git-deployment.json
        run: |
          set -euo pipefail
          node /tmp/verify-cloudflare-git-production-v3990_2.mjs \
            2>&1 | tee /tmp/cloudflare-pages-v3990-1-git-deployment.out
      - name: Verify exact v3.9.90.2 production resource graph and API baseline
        env:
          PRODUCTION_RESOURCE_ATTEMPTS: '45'
          PRODUCTION_RESOURCE_WAIT_MS: '10000'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/cloudflare-pages-v3990-1-resource-graph.json
        run: |
          set -euo pipefail
          node tools/verify-production-resource-graph-v3990_2.mjs \
            2>&1 | tee /tmp/cloudflare-pages-v3990-1-production.out
          PRODUCTION_VERIFY_ATTEMPTS='1' \
          PRODUCTION_VERIFY_WAIT_MS='0' \
            node tools/verify-production-baseline-v3971.mjs \
              2>&1 | tee /tmp/cloudflare-pages-v3990-1-baseline.out
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-v3990-1-production
          path: |
            /tmp/cloudflare-pages-v3990-1-*.out
            /tmp/cloudflare-pages-v3990-1-*.json
          if-no-files-found: warn
          retention-days: 7
