name: Patch PR80 Tongxue verifier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Align Tongxue directory verifier with v3968
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/tongxue/verify-directory.mjs')
          s=p.read_text()
          replacements={
            "readFile('tongxue/app/tongxue-runtime-v159-r3967.js', 'utf8')":"readFile('tongxue/app/tongxue-runtime-v159-r3968.js', 'utf8')",
            "requireText(page, './app/tongxue-runtime-v159-r3967.js?v=3967_0', '页面入口');":"requireText(page, './app/tongxue-runtime-v159-r3968.js?v=3968_0', '页面入口');",
            "requireText(entry, \"release-presenter.v3967_0.js?v=3967_0\", 'v3967发布展示器');":"requireText(entry, \"release-presenter.v3968_0.js?v=3968_0\", 'v3968发布展示器');"
          }
          for old,new in replacements.items():
            if old not in s: raise SystemExit(f'missing marker: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check tools/tongxue/verify-directory.mjs
          node tools/tongxue/verify-directory.mjs
          git diff --check
      - name: Commit verifier correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/tongxue/verify-directory.mjs
          git commit -m 'test: align Tongxue directory verifier with v3968'
          git push origin HEAD:${{ github.head_ref }}
