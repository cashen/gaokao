name: Verify main tree integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-tree-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tree-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject sparse or incomplete deployable trees
        env:
          TREE_GUARD_MODE: main
          TREE_GUARD_BASE: ''
          TREE_GUARD_HEAD: ${{ github.sha }}
        run: >-
          node tools/verify-main-tree-integrity-v001.mjs
          "$TREE_GUARD_MODE"
          "$TREE_GUARD_BASE"
          "$TREE_GUARD_HEAD"
