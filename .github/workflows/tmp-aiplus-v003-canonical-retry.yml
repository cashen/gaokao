name: tmp AIPLuS v0.03 canonical retry

on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/tmp-aiplus-v003-canonical-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only canonical server owners
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_aiplus_v003_canonical_continuation.py
          python tools/tmp_aiplus_v003_school_boundary.py
          python tools/tmp_aiplus_v003_protocol_test.py
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/verify-aiplus-parent-semantics-v003.mjs')
          s=p.read_text()
          needles=[
            "assert.equal(turn.result?.decisionResearch?.plan?.scoreUsed,false,'remembered score must not silently execute in orchestrator');",
            "assert.equal(explicitTurn.result?.decisionResearch?.plan?.scoreUsed,true);",
            "assert.equal(followTurn.result?.decisionResearch?.plan?.scoreUsed,false);"
          ]
          for needle in needles:
            if s.count(needle)!=1: raise SystemExit(f'pending-result assertion count={s.count(needle)} for {needle[:60]}')
            s=s.replace(needle,'')
          p.write_text(s)
          PY
      - name: Verify semantic and legacy contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
          git diff --check
      - name: Commit verified canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/ai/ai-workspace-contract.v3992_0.js functions/_lib/ai/command-interpreter.js functions/_lib/ai/turn-orchestrator.js tools/verify-aiplus-parent-semantics-v003.mjs
          git commit -m 'AIPLuS：统一复合决策的服务端语义真相'
          git push origin HEAD:agent/aiplus-parent-decision-v003
