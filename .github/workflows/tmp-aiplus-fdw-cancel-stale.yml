name: tmp AIPLuS FDW cancel stale

on:
  push:
    branches: [agent/aiplus-family-decision-workbench]
    paths: ['.github/workflows/tmp-aiplus-fdw-cancel-stale.yml']

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-family-decision-workbench
          fetch-depth: 0
      - name: Cancel only stale PR166 branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_WORKFLOW: tmp AIPLuS FDW browser cache
        shell: bash
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          echo "current=$current"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Faiplus-family-decision-workbench&per_page=100" --jq '.workflow_runs[] | [.id,.head_sha,.status,.name,.event] | @tsv' |
          while IFS=$'\t' read -r id sha status name event; do
            [ "$id" = "${GITHUB_RUN_ID}" ] && continue
            [ "$name" = "$KEEP_WORKFLOW" ] && continue
            [ "$sha" = "$current" ] && continue
            case "$status" in queued|in_progress|waiting|requested|pending) ;; *) continue ;; esac
            echo "cancel stale run $id $sha $status $name"
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
          done
