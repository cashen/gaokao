name: Prepare AI semantic v3990_1 release tree

on:
  push:
    branches:
      - agent/ai-semantic-active-view-v3990_1

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build coherent v3.9.90.1 generation
        run: node tools/prepare-ai-semantic-release-v3990_1.mjs
      - name: Bind major negation to the local spoken object
        run: node tools/patch-ai-command-negation-v3990_1.mjs
      - name: Separate persistent family profile from active view
        run: node tools/patch-ai-family-persistence-v3990_1.mjs
      - name: Verify history restore through its executable UI path
        run: node tools/patch-ai-verifier-history-guard-v3990_1.mjs
      - name: Verify generated semantic source before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-contract.v3990_1.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/major-bands-rank-query-kernel.v3990_1.js
          node --check ai/app.v3990_1.js
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/audit-canonical-release-version-v3990_1.mjs
          node tools/audit-site-runtime-generation-v3990_1.mjs
          node tools/audit-unified-resource-graph-v3990_1.mjs
          node tools/audit-major-bands-rank-kernel-v3990_1.mjs
      - name: Keep workflow files connector-owned
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          git diff --quiet -- .github/workflows
      - name: Commit generated release tree
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          if ! git diff --cached --quiet -- .github/workflows; then
            echo 'Generated commit must not mutate workflow files.' >&2
            exit 2
          fi
          git commit -m 'v3.9.90.1：接入 AI 活人语义与统一运行代'
          git push origin "HEAD:${GITHUB_REF_NAME}"
