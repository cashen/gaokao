name: Finalize AI semantic local-state migration v3990_1

on:
  push:
    branches:
      - agent/ai-semantic-active-view-v3990_1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the existing IndexedDB workspace across v3990_1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          app_path = Path('ai/app.v3990_1.js')
          app = app_path.read_text()
          before = "// Keep the original IndexedDB name so existing v3990_1 workspaces migrate in-place.\nconst DB_NAME = 'gaokao-ai-workspace-v3990_1';"
          after = "// Keep the original IndexedDB name so existing v3990_0 workspaces migrate in-place.\nconst DB_NAME = 'gaokao-ai-workspace-v3990_0';"
          if before not in app:
              raise SystemExit('AI local-state migration source changed; refusing blind patch')
          app_path.write_text(app.replace(before, after, 1))

          verify_path = Path('tools/verify-ai-workspace-v3990_1.mjs')
          verify = verify_path.read_text()
          marker = "function testSourceGuards(){const app=read('ai/app.v3990_1.js');"
          replacement = marker + "assert.ok(app.includes(\"const DB_NAME = 'gaokao-ai-workspace-v3990_0'\"),'v3990_1 must migrate the existing AI IndexedDB workspace in place');"
          if marker not in verify:
              raise SystemExit('AI verifier source changed; refusing blind patch')
          if 'must migrate the existing AI IndexedDB workspace in place' not in verify:
              verify = verify.replace(marker, replacement, 1)
          verify_path.write_text(verify)
          PY
      - name: Verify semantic runtime and release contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check ai/app.v3990_1.js
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/audit-canonical-release-version-v3990_1.mjs
          node tools/audit-site-runtime-generation-v3990_1.mjs
          node tools/audit-unified-resource-graph-v3990_1.mjs
      - name: Commit only the local-state compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/app.v3990_1.js tools/verify-ai-workspace-v3990_1.mjs
          git diff --cached --quiet && { echo 'Expected local-state compatibility changes are missing.' >&2; exit 1; }
          git commit -m 'v3.9.90.1：保留 AI 工作区本地历史迁移'
          git push origin "HEAD:${GITHUB_REF_NAME}"
