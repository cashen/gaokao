name: Patch school-history session cache temp
on:
  push:
    branches:
      - agent/ai-workspace-request-budget-v3992_3
    paths:
      - .agent/patch-school-history-session-cache-v3992_3.py
      - .github/workflows/patch-school-history-session-cache-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-workspace-request-budget-v3992_3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded session cache patch
        run: python .agent/patch-school-history-session-cache-v3992_3.py
      - name: Verify source and AI contracts
        run: |
          node --check ai/app.v3990_1.js
          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/app.v3990_1.js tools/verify-ai-school-history-bridge-v3992_2.mjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "perf: reuse bounded school-history facts within session"
          git push origin HEAD:agent/ai-workspace-request-budget-v3992_3
