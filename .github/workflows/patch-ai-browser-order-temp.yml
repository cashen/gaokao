name: Patch AI browser order temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-ai-browser-order-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - name: Preserve profile journey before isolated fault injection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-ai-workspace-v3990_1.mjs')
          text=p.read_text()
          old="await coreHumanJourney(page,device.name);await transientMajorBandsRecovery(page,device.name);await profilePersistence(page,device.name);await parentEntryUiJourney(page,device.name);"
          new="await coreHumanJourney(page,device.name);await profilePersistence(page,device.name);await transientMajorBandsRecovery(page,device.name);await parentEntryUiJourney(page,device.name);"
          if text.count(old)!=1: raise SystemExit('browser call order changed unexpectedly')
          p.write_text(text.replace(old,new))
          PY
          node --check tools/browser-ai-workspace-v3990_1.mjs
          git rm .github/workflows/patch-ai-browser-order-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-ai-workspace-v3990_1.mjs
          git commit -m 'test: isolate transient bridge recovery journey'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
