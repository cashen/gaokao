name: Verify production release v3970

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for custom domain to serve current main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3970-production
          success=0
          for attempt in $(seq 1 36); do
            token="${RELEASE_SHA}-${attempt}-$(date +%s)"
            root="https://gaokao.powers.org.cn/?release-check=${token}"
            workspace="https://gaokao.powers.org.cn/ln-rank/?release-check=${token}"
            release="https://gaokao.powers.org.cn/shared/resources/release/current-release.js?release-check=${token}"
            curl --fail --silent --show-error --location --max-time 25 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$root" -o /tmp/v3970-production/root.html || true
            curl --fail --silent --show-error --location --max-time 25 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$workspace" -o /tmp/v3970-production/workspace.html || true
            curl --fail --silent --show-error --location --max-time 25 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$release" -o /tmp/v3970-production/current-release.js || true

            if grep -q 'data-release="v3.9.70.0"' /tmp/v3970-production/root.html 2>/dev/null \
              && grep -q 'family-home.v3970_0.js?v=3970_0' /tmp/v3970-production/root.html 2>/dev/null \
              && ! grep -q 'family-home.v3968_0.js' /tmp/v3970-production/root.html 2>/dev/null \
              && grep -q 'data-release="v3.9.70.0"' /tmp/v3970-production/workspace.html 2>/dev/null \
              && grep -q 'app.v3970_0.js?v=3970_0' /tmp/v3970-production/workspace.html 2>/dev/null \
              && grep -q "display: 'v3.9.70.0'" /tmp/v3970-production/current-release.js 2>/dev/null \
              && grep -q "homeRuntime: '/ln-rank/js/ux/family-home.v3970_0.js'" /tmp/v3970-production/current-release.js 2>/dev/null; then
              success=1
              printf 'production release ready on attempt %s\n' "$attempt"
              break
            fi
            printf 'attempt %s: custom domain has not switched to the complete v3970 release yet\n' "$attempt"
            sleep 20
          done
          if [ "$success" -ne 1 ]; then
            printf '%s\n' 'Root response:'
            head -c 2000 /tmp/v3970-production/root.html 2>/dev/null || true
            printf '\n%s\n' 'Workspace response:'
            head -c 2000 /tmp/v3970-production/workspace.html 2>/dev/null || true
            printf '\n%s\n' 'Release response:'
            head -c 2000 /tmp/v3970-production/current-release.js 2>/dev/null || true
            exit 1
          fi

      - name: Verify response freshness and versioned home runtime
        run: |
          set -euo pipefail
          token='${{ github.sha }}-headers'
          curl --fail --silent --show-error --location --dump-header /tmp/v3970-production/root.headers \
            -H 'Cache-Control: no-cache' "https://gaokao.powers.org.cn/?release-check=${token}" -o /dev/null
          curl --fail --silent --show-error --location --dump-header /tmp/v3970-production/home-runtime.headers \
            "https://gaokao.powers.org.cn/ln-rank/js/ux/family-home.v3970_0.js?v=3970_0" -o /tmp/v3970-production/home-runtime.js
          grep -Eiq 'cache-control:.*(no-cache|must-revalidate)' /tmp/v3970-production/root.headers
          grep -Eiq 'content-type:.*(application|text)/javascript' /tmp/v3970-production/home-runtime.headers
          # Pages Functions responses do not inherit _headers. The truthful delivery contract is
          # a versioned URL, exact runtime contents, an ETag, and either revalidation or immutable caching.
          grep -Eiq '^etag:' /tmp/v3970-production/home-runtime.headers
          grep -Eiq 'cache-control:.*(must-revalidate|immutable)' /tmp/v3970-production/home-runtime.headers
          grep -q "HOME_RUNTIME_VERSION = 'family-home-runtime-v3970_0'" /tmp/v3970-production/home-runtime.js
          ! grep -q 'family-home-runtime-v3968_0' /tmp/v3970-production/home-runtime.js

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3970-production-release-evidence
          path: /tmp/v3970-production
          if-no-files-found: warn
          retention-days: 7
