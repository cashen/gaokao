name: Verify production release v3972.6

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'AGENTS.md'
      - 'docs/skills/unified-site-release/**'
      - '.github/workflows/verify-production-release-v3970.yml'
      - 'index.html'
      - 'ln-rank/index.html'
      - 'ln-rank/selection-pool.html'
      - 'ln-rank/site-active-generation.v3972_6.json'
      - 'ln-rank/js/app.v3972_6.js'
      - 'ln-rank/js/app-runtime.v3972_6.js'
      - 'ln-rank/js/workspace/selection-workspace-orchestrator.v3972_6.js'
      - 'shared/resources/release/**'
      - 'shared/resources/resource-registry.js'
      - 'shared/governance/**'
      - 'shared/ui/ui-resource-registry.v3972_6.js'
      - 'shared/ui/interaction/interaction-transaction.v3972_6.*'
      - 'tools/audit-site-runtime-generation-v3972_6.mjs'
      - 'tools/audit-unified-resource-graph-v3972_6.mjs'
      - 'tools/ln-2026/verify-final-release-v3972_6.py'
      - 'tools/verify-production-resource-graph-v3972_6.mjs'
      - '_headers'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production source graph
        run: |
          set -euo pipefail
          node tools/audit-canonical-release-version-v3972_6.mjs
          node tools/audit-site-runtime-generation-v3972_6.mjs
          node tools/audit-unified-resource-graph-v3972_6.mjs
          node tools/audit-production-resource-verification-v3972_6.mjs
          python3 tools/ln-2026/verify-final-release-v3972_6.py
          node --check shared/resources/release/site-runtime-contract.v3972_6.js
          node --check shared/resources/release/runtime-cache-contract.v3972_6.js
          node --check shared/governance/resource-execution-contract.v3972_6.js
          node --check shared/ui/interaction/interaction-transaction.v3972_6.js
          node --check ln-rank/js/app.v3972_6.js
          node --check ln-rank/js/app-runtime.v3972_6.js
          node --check ln-rank/js/workspace/selection-workspace-orchestrator.v3972_6.js
          node --check ln-rank/js/selection-pool.v3972_5.js
          node --check ln-rank/js/selection-pool-runtime.v3972_5.js

      - name: Exercise production verifier against local graph
        env:
          PAGES_BASE: http://127.0.0.1:8796
          CUSTOM_BASE: http://127.0.0.1:8796
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          VERIFY_RUNTIME_HEALTH: 'false'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3972-6-production-release-local.json
        run: |
          set -euo pipefail
          python3 -m http.server 8796 >/tmp/v3972-6-production-release-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          node tools/verify-production-resource-graph-v3972_6.mjs

  production-release:
    if: github.event_name != 'pull_request'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Pages and custom-domain release ownership
        env:
          RELEASE_SHA: ${{ github.sha }}
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          PRODUCTION_RESOURCE_ATTEMPTS: '42'
          PRODUCTION_RESOURCE_WAIT_MS: '20000'
          VERIFY_RUNTIME_HEALTH: 'true'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3972-6-production-release.json
        run: |
          set -euo pipefail
          node tools/verify-production-resource-graph-v3972_6.mjs

      - name: Verify preserved static business resources
        run: |
          set -euo pipefail
          token="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error "https://gaokao-4y9.pages.dev/ln-rank/data/211-static/211-static-index.v3972_0.json?check=${token}" | grep -q 'all-211-static-v3972_0'
          curl --fail --silent --show-error "https://gaokao-4y9.pages.dev/ln-rank/data/local-strength/local-strength-index.v3971_2.json?check=${token}" | grep -q 'local-strength-static-v3971_2'
          curl --fail --silent --show-error "https://gaokao-4y9.pages.dev/ln-rank/js/selection-pool.v3972_5.js?check=${token}" | grep -q 'selection-runtime-v3972_5'

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3972-6-production-release-evidence
          path: /tmp/v3972-6-production-release*
          if-no-files-found: warn
          retention-days: 7
