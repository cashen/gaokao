name: Verify production release v3990.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'AGENTS.md'
      - 'docs/skills/unified-site-release/**'
      - '.github/workflows/verify-production-release-v3970.yml'
      - 'index.html'
      - 'ln-rank/index.html'
      - 'ln-rank/selection-pool.html'
      - 'ln-rank/site-active-generation.v3990_3.json'
      - 'ln-rank/js/app.v3990_3.js'
      - 'ln-rank/js/app-runtime.v3990_3.js'
      - 'ln-rank/js/workspace/selection-workspace-orchestrator.v3990_3.js'
      - 'functions/api/major-bands.js'
      - 'functions/_lib/major-bands-rank-*.v3990_3.js'
      - 'functions/_lib/major-bands-response-transport.v3990_3.js'
      - 'shared/resources/release/**'
      - 'shared/resources/resource-registry.js'
      - 'shared/governance/**'
      - 'shared/ui/ui-resource-registry.v3990_3.js'
      - 'shared/ui/interaction/interaction-transaction.v3990_3.*'
      - 'tools/audit-site-runtime-generation-v3990_3.mjs'
      - 'tools/audit-unified-resource-graph-v3990_3.mjs'
      - 'tools/verify-production-resource-graph-v3990_3.mjs'
      - '_headers'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production source graph
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-canonical-release-version-v3990_3.mjs
          node tools/audit-site-runtime-generation-v3990_3.mjs
          node tools/audit-unified-resource-graph-v3990_3.mjs
          node tools/audit-production-resource-verification-v3990_3.mjs
          node tools/audit-major-bands-rank-kernel-v3990_3.mjs
          sed -e 's/v3\.9\.90\.0/v3.9.90.3/g' -e 's/v3990_0/v3990_3/g' -e 's/3990_0/3990_3/g' \
            tools/ln-2026/verify-final-release-v3990_0.py > /tmp/verify-final-release-v3990_3.py
          python3 /tmp/verify-final-release-v3990_3.py
          node --check shared/resources/release/site-runtime-contract.v3990_3.js
          node --check shared/resources/release/runtime-cache-contract.v3990_3.js
          node --check shared/governance/resource-execution-contract.v3990_3.js
          node --check shared/ui/interaction/interaction-transaction.v3990_3.js
          node --check ln-rank/js/app.v3990_3.js
          node --check ln-rank/js/app-runtime.v3990_3.js
          node --check ln-rank/js/workspace/selection-workspace-orchestrator.v3990_3.js
          node --check ln-rank/js/selection-pool.v3990_3.js
          node --check ln-rank/js/selection-pool-runtime.v3990_3.js
          node --check functions/api/major-bands.js
          node --check functions/_lib/major-bands-rank-index.v3990_3.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_3.js
          node --check functions/_lib/major-bands-rank-query-kernel.v3990_3.js
          node --check functions/_lib/major-bands-result-order.v3990_3.js
          node --check functions/_lib/major-bands-response-transport.v3990_3.js

      - name: Exercise production verifier against local Pages graph
        env:
          PAGES_BASE: http://127.0.0.1:8796
          CUSTOM_BASE: http://127.0.0.1:8796
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          VERIFY_RUNTIME_HEALTH: 'true'
          VERIFY_MAJOR_BANDS: 'true'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-1-production-release-local.json
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8796 --compatibility-date=2026-07-01 >/tmp/v3990-1-production-release-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS 'http://127.0.0.1:8796/api/ln-rank-runtime-health' >/tmp/v3990-1-production-release-runtime.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-1-production-release-wrangler.log; exit 1; fi
          node tools/verify-production-resource-graph-v3990_3.mjs

      - name: Upload local release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-1-production-release-local-evidence
          path: |
            /tmp/v3990-1-production-release-local.json
            /tmp/v3990-1-production-release-runtime.json
            /tmp/v3990-1-production-release-wrangler.log
          if-no-files-found: warn
          retention-days: 7

  production-release:
    if: github.event_name != 'pull_request'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Pages and custom-domain release ownership
        env:
          RELEASE_SHA: ${{ github.sha }}
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          PRODUCTION_RESOURCE_ATTEMPTS: '42'
          PRODUCTION_RESOURCE_WAIT_MS: '20000'
          VERIFY_RUNTIME_HEALTH: 'true'
          VERIFY_MAJOR_BANDS: 'true'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-1-production-release.json
        run: node tools/verify-production-resource-graph-v3990_3.mjs

      - name: Verify active and preserved static business resources
        run: |
          set -euo pipefail
          token="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error "https://gaokao-4y9.pages.dev/ln-rank/data/211-static/211-static-index.v3972_0.json?check=${token}" | grep -q 'all-211-static-v3972_0'
          curl --fail --silent --show-error "https://gaokao-4y9.pages.dev/ln-rank/data/local-strength/local-strength-index.v3971_2.json?check=${token}" | grep -q 'local-strength-static-v3971_2'
          curl --fail --silent --show-error "https://gaokao-4y9.pages.dev/ln-rank/js/selection-pool.v3990_3.js?check=${token}" | grep -q 'v3990_3'

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-1-production-release-evidence
          path: /tmp/v3990-1-production-release*
          if-no-files-found: warn
          retention-days: 7
