name: Temporary page-id native prefilter v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-page-id-native-prefilter-v3990-1.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add scalar page-ID prefilter before full row parse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          def dec(value): return base64.b64decode(value).decode()
          provider = Path('functions/_lib/major-bands-static-provider.js')
          text = provider.read_text()
          version_marker = "export const MAJOR_BANDS_RANK_ROW_NATIVE_SCAN_VERSION = 'major-bands-rank-row-native-scan-v3990_1';"
          version_add = version_marker + "\nexport const MAJOR_BANDS_PAGE_ID_NATIVE_PREFILTER_VERSION = 'major-bands-page-id-native-prefilter-v3990_1';"
          scan_marker = "export function scanMajorBandsStaticRankRowsText(text, options = {}) {"
          helper = dec('')
          replacements = [
            (version_marker, version_add),
            (scan_marker, helper + scan_marker),
            (dec('ICBsZXQgcm93Q291bnQgPSAwOwogIGxldCByYW5rTWF0Y2hlZENvdW50ID0gMDsKICBsZXQgY3Vyc29yID0gcm93c1N0YXJ0ICsgMTs='), dec('ICBsZXQgcm93Q291bnQgPSAwOwogIGxldCByYW5rTWF0Y2hlZENvdW50ID0gMDsKICBsZXQgZnVsbFJvd1BhcnNlQ291bnQgPSAwOwogIGxldCBwYWdlSWRTY2FsYXJQcmVmaWx0ZXJDb3VudCA9IDA7CiAgbGV0IGN1cnNvciA9IHJvd3NTdGFydCArIDE7')),
            (dec(''), dec('')),
            (dec('ICAgIHJvd0NvdW50LAogICAgcmFua01hdGNoZWRDb3VudCwKICAgIG1vZGU6ICduYXRpdmUtcm93LXRleHQtc2NhbicsCiAgICBzY2FuVmVyc2lvbjogTUFKT1JfQkFORFNfUkFOS19ST1dfTkFUSVZFX1NDQU5fVkVSU0lPTg=='), dec(''))
          ]
          for old, new in replacements:
              if text.count(old) != 1: raise SystemExit(f'provider anchor count={text.count(old)}')
              text = text.replace(old, new, 1)
          provider.write_text(text)

          verifier = Path('tools/verify-major-bands-rank-native-scan-v3990_1.mjs')
          v = verifier.read_text()
          simple = [
            ("  MAJOR_BANDS_RANK_ROW_NATIVE_SCAN_VERSION,", "  MAJOR_BANDS_RANK_ROW_NATIVE_SCAN_VERSION,\n  MAJOR_BANDS_PAGE_ID_NATIVE_PREFILTER_VERSION,"),
            ("assert.equal(MAJOR_BANDS_RANK_ROW_NATIVE_SCAN_VERSION, 'major-bands-rank-row-native-scan-v3990_1');", "assert.equal(MAJOR_BANDS_RANK_ROW_NATIVE_SCAN_VERSION, 'major-bands-rank-row-native-scan-v3990_1');\nassert.equal(MAJOR_BANDS_PAGE_ID_NATIVE_PREFILTER_VERSION, 'major-bands-page-id-native-prefilter-v3990_1');"),
            ("let allowedScanned = 0;", "let allowedScanned = 0;\nlet allowedFullRowParses = 0;\nlet allowedScalarPrefilters = 0;"),
            ("  allowedScanned += selective.rows.length;", "  allowedScanned += selective.rows.length;\n  allowedFullRowParses += selective.fullRowParseCount;\n  allowedScalarPrefilters += selective.pageIdScalarPrefilterCount;"),
            ("assert.equal(allowedScanned, allowedTruth, 'selective allowed-ID truth total');", "assert.equal(allowedScanned, allowedTruth, 'selective allowed-ID truth total');\nassert.equal(allowedFullRowParses, allowedTruth, 'allowed-ID full row parse total');\nassert.equal(allowedScalarPrefilters, Number(manifest.recordCount), 'allowed-ID scalar prefilter total');"),
            ("  selectiveTruthEqual: true,\n  wholeBucketResponseJsonRequired: false", "  selectiveTruthEqual: true,\n  pageIdScalarPrefilterVersion: MAJOR_BANDS_PAGE_ID_NATIVE_PREFILTER_VERSION,\n  pageIdFullRowParses: allowedFullRowParses,\n  pageIdScalarPrefilters: allowedScalarPrefilters,\n  fullRowParseOnlyForAllowedIds: true,\n  wholeBucketResponseJsonRequired: false")
          ]
          simple.append((dec('ICBhc3NlcnQuZXF1YWwoc2VsZWN0aXZlLnJhbmtNYXRjaGVkQ291bnQsIHJhbmtUcnV0aC5sZW5ndGgsIGAke2J1Y2tldC5maWxlfTogcmFuayB0cnV0aCBjb3VudGApOwogIGFzc2VydC5kZWVwRXF1YWwoc2VsZWN0aXZlLnJvd3MsIGFsbG93ZWRSb3dzVHJ1dGgsIGAke2J1Y2tldC5maWxlfTogcmFuay9pZCB0cnV0aCBtaXNtYXRjaGApOw=='), dec('')))
          for old, new in simple:
              if v.count(old) != 1: raise SystemExit(f'verifier anchor count={v.count(old)}')
              v = v.replace(old, new, 1)
          verifier.write_text(v)
          PY
          git diff --check
          node --check functions/_lib/major-bands-static-provider.js
          node --check tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node --experimental-default-type=module tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_1.mjs >/tmp/major-bands-audit.log
          tail -n 40 /tmp/major-bands-audit.log
          git diff -- functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs
      - name: Commit tested page-ID prefilter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          git commit -m "perf: prefilter page IDs before full row parse"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
