name: One-time all-bands shared projection v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-all-bands-shared-projection-v3990.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch one-pass all-bands shared projection
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')

          api = replace_once(
              api,
              "export const MAJOR_BANDS_ALL_BANDS_EXECUTION_MODE = 'sequential-internal-band-requests-v3990_0';\nconst BAND_KEYS = Object.freeze(['upper', 'near', 'steady']);\n",
              "export const MAJOR_BANDS_ALL_BANDS_EXECUTION_MODE = 'sequential-internal-band-requests-v3990_0';\nexport const MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION = 'major-bands-all-bands-shared-projection-v3990_0';\nconst BAND_KEYS = Object.freeze(['upper', 'near', 'steady']);\n",
              'all-bands shared version'
          )

          old_all_bands_open = '''async function executeAllBandsSequentially(context, sourceUrl, input) {\n  const execution = await executeMajorBandsAllBandsPageOnce(allBandsPageIdentity(input), async () => {\n    const payloads = [];\n    for (const band of BAND_KEYS) {\n      const response = await onRequest({\n        ...context,\n        request: requestForBand(context.request, sourceUrl, band)\n      });\n'''
          new_all_bands_open = '''async function executeAllBandsSequentially(context, sourceUrl, input) {\n  const execution = await executeMajorBandsAllBandsPageOnce(allBandsPageIdentity(input), async () => {\n    const sharedProjectionEligible = input.filters.region === 'all'\n      && !input.filters.schoolKeyword\n      && !input.filters.schoolEntityId\n      && !input.filters.majorKeyword\n      && input.filters.bottomLineMode === 'all'\n      && input.filters.specialProjectMode === 'hide_eligibility_projects';\n    let allBandsShared = null;\n    if (sharedProjectionEligible) {\n      const candidateRank = rankContextForScore(input.candidateScore);\n      const totalRank = getRankPopulation({ year: 2026, region: 'ln', subject: 'physics', policy: 'table-total' });\n      const rankWindows = rankWindowsForCandidate(candidateRank?.rankForGap, input.rangePreset, totalRank);\n      const selectedBuckets = selectMajorBandsRankBuckets(rankWindows);\n      const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, {\n        projection: MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION\n      });\n      const processed = processMajorBandsRankWindow(loaded.records, {\n        candidateScore: input.candidateScore,\n        candidateRank,\n        rangePreset: input.rangePreset,\n        region: input.filters.region,\n        majorKeyword: '',\n        bottomLineMode: input.filters.bottomLineMode,\n        specialProjectMode: input.filters.specialProjectMode,\n        schoolFilter: false,\n        acceptedSchoolNames: []\n      });\n      allBandsShared = {\n        version: MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION,\n        candidateRank,\n        totalRank,\n        rankWindows,\n        selectedBuckets,\n        loadedStats: loaded.stats,\n        processed,\n        bandUses: 0,\n        physicalProjectionPasses: selectedBuckets.length ? 1 : 0,\n        fallbackPageRefetches: 0\n      };\n    }\n\n    const payloads = [];\n    for (const band of BAND_KEYS) {\n      const response = await onRequest({\n        ...context,\n        majorBandsAllBandsShared: allBandsShared,\n        request: requestForBand(context.request, sourceUrl, band)\n      });\n'''
          api = replace_once(api, old_all_bands_open, new_all_bands_open, 'all-bands open')

          after_payloads = '''      payloads.push(await response.json());\n    }\n\n    const byBand = Object.fromEntries(BAND_KEYS.map((band, index) => [band, payloads[index]]));\n'''
          after_payloads_patch = '''      payloads.push(await response.json());\n    }\n\n    const sharedAggregate = allBandsShared?.processed?.stats || null;\n    const sharedLoadedStats = allBandsShared?.loadedStats || null;\n    const sharedSelectedBucketCount = Array.isArray(allBandsShared?.selectedBuckets)\n      ? allBandsShared.selectedBuckets.length\n      : 0;\n    const sharedBandUses = Number(allBandsShared?.bandUses || 0);\n    const sharedPhysicalProjectionPasses = Number(allBandsShared?.physicalProjectionPasses || 0);\n    const sharedFallbackPageRefetches = Number(allBandsShared?.fallbackPageRefetches || 0);\n    let sharedTransientProjectionReleased = false;\n    if (allBandsShared) {\n      allBandsShared.processed = null;\n      allBandsShared.loadedStats = null;\n      allBandsShared.selectedBuckets = null;\n      sharedTransientProjectionReleased = allBandsShared.processed === null\n        && allBandsShared.loadedStats === null\n        && allBandsShared.selectedBuckets === null;\n    }\n\n    const byBand = Object.fromEntries(BAND_KEYS.map((band, index) => [band, payloads[index]]));\n'''
          api = replace_once(api, after_payloads, after_payloads_patch, 'shared release')

          metrics_old = '''    const keywordQuery = payloads[0].keywordQuery || {};\n    const matchSummary = mergeNumericTree(payloads.map(payload => payload.matchSummary));\n    const specialProjectStats = mergeNumericTree(payloads.map(payload => payload.source?.specialProjectStats));\n    const bottomLineUnresolved = numericSum(payloads, ['source', 'bottomLineUnresolved']);\n    const specialProjectShown = numericSum(payloads, ['source', 'specialProjectShown']);\n    const specialProjectHidden = numericSum(payloads, ['source', 'specialProjectHidden']);\n'''
          metrics_new = '''    const keywordQuery = payloads[0].keywordQuery || {};\n    const matchSummary = sharedAggregate?.matchSummary\n      ? mergeNumericTree([sharedAggregate.matchSummary])\n      : mergeNumericTree(payloads.map(payload => payload.matchSummary));\n    const specialProjectStats = sharedAggregate?.specialProjectStats\n      ? mergeNumericTree([sharedAggregate.specialProjectStats])\n      : mergeNumericTree(payloads.map(payload => payload.source?.specialProjectStats));\n    const bottomLineUnresolved = sharedAggregate\n      ? Number(sharedAggregate.bottomLineUnresolved || 0)\n      : numericSum(payloads, ['source', 'bottomLineUnresolved']);\n    const specialProjectShown = sharedAggregate\n      ? Number(sharedAggregate.specialProjectShown || 0)\n      : numericSum(payloads, ['source', 'specialProjectShown']);\n    const specialProjectHidden = sharedAggregate\n      ? Number(sharedAggregate.specialProjectHidden || 0)\n      : numericSum(payloads, ['source', 'specialProjectHidden']);\n'''
          api = replace_once(api, metrics_old, metrics_new, 'shared aggregate metrics')

          replacements = {
              "      rankBucketReadsTotal: numericSum(payloads, ['source', 'chunksRead']),": "      rankBucketReadsTotal: allBandsShared ? sharedSelectedBucketCount : numericSum(payloads, ['source', 'chunksRead']),",
              "      rawScanned: numericSum(payloads, ['source', 'rawScanned']),": "      rawScanned: sharedAggregate ? Number(sharedAggregate.rawScanned || 0) : numericSum(payloads, ['source', 'rawScanned']),",
              "      canonicalCandidate: numericSum(payloads, ['source', 'canonicalCandidate']),": "      canonicalCandidate: sharedAggregate ? Number(sharedAggregate.canonicalCandidate || 0) : numericSum(payloads, ['source', 'canonicalCandidate']),",
              "      rawCandidate: numericSum(payloads, ['source', 'rawCandidate']),": "      rawCandidate: sharedAggregate ? Number(sharedAggregate.rawCandidate || 0) : numericSum(payloads, ['source', 'rawCandidate']),",
              "      normalized: numericSum(payloads, ['source', 'normalized']),": "      normalized: sharedAggregate ? Number(sharedAggregate.normalized || 0) : numericSum(payloads, ['source', 'normalized']),",
              "      staticIndexBytes: numericSum(payloads, ['source', 'staticIndexBytes']),": "      staticIndexBytes: sharedLoadedStats ? Number(sharedLoadedStats.staticIndexBytes || 0) : numericSum(payloads, ['source', 'staticIndexBytes']),",
              "      bottomLineExcluded: numericSum(payloads, ['source', 'bottomLineExcluded']),": "      bottomLineExcluded: sharedAggregate ? Number(sharedAggregate.bottomLineExcluded || 0) : numericSum(payloads, ['source', 'bottomLineExcluded']),",
              "      majorKeywordExcluded: numericSum(payloads, ['source', 'majorKeywordExcluded']),": "      majorKeywordExcluded: sharedAggregate ? Number(sharedAggregate.majorKeywordExcluded || 0) : numericSum(payloads, ['source', 'majorKeywordExcluded']),",
              "      majorHitCount: numericSum(payloads, ['source', 'majorHitCount']),": "      majorHitCount: sharedAggregate ? Number(sharedAggregate.majorHitCount || 0) : numericSum(payloads, ['source', 'majorHitCount']),",
              "      projectHitCount: numericSum(payloads, ['source', 'projectHitCount']),": "      projectHitCount: sharedAggregate ? Number(sharedAggregate.projectHitCount || 0) : numericSum(payloads, ['source', 'projectHitCount']),",
              "      industryHitCount: numericSum(payloads, ['source', 'industryHitCount']),": "      industryHitCount: sharedAggregate ? Number(sharedAggregate.industryHitCount || 0) : numericSum(payloads, ['source', 'industryHitCount']),",
              "      rankBucketCacheHits: numericSum(payloads, ['source', 'rankBucketCacheHits']),": "      rankBucketCacheHits: sharedLoadedStats ? Number(sharedLoadedStats.cacheHits || 0) : numericSum(payloads, ['source', 'rankBucketCacheHits']),",
              "      rankBucketCacheMisses: numericSum(payloads, ['source', 'rankBucketCacheMisses']),": "      rankBucketCacheMisses: sharedLoadedStats ? Number(sharedLoadedStats.cacheMisses || 0) : numericSum(payloads, ['source', 'rankBucketCacheMisses']),",
              "      rankRawRowCount: numericSum(payloads, ['source', 'rankRawRowCount']),": "      rankRawRowCount: sharedLoadedStats ? Number(sharedLoadedStats.rawRowCount || 0) : numericSum(payloads, ['source', 'rankRawRowCount']),",
              "      rankDecodedRowCount: numericSum(payloads, ['source', 'rankDecodedRowCount']),": "      rankDecodedRowCount: sharedLoadedStats ? Number(sharedLoadedStats.decodedRowCount || 0) : numericSum(payloads, ['source', 'rankDecodedRowCount']),",
              "      rankRowsSkipped: numericSum(payloads, ['source', 'rankRowsSkipped']),": "      rankRowsSkipped: sharedLoadedStats ? Number(sharedLoadedStats.rankRowsSkipped || 0) : numericSum(payloads, ['source', 'rankRowsSkipped']),",
              "      rankBucketConcurrency: Math.max(...payloads.map(payload => Number(payload.source?.rankBucketConcurrency || 0))),": "      rankBucketConcurrency: sharedLoadedStats ? Number(sharedLoadedStats.peakConcurrency || 0) : Math.max(...payloads.map(payload => Number(payload.source?.rankBucketConcurrency || 0))),",
              "      rankBucketMaxConcurrency: Math.max(...payloads.map(payload => Number(payload.source?.rankBucketMaxConcurrency || 0))),": "      rankBucketMaxConcurrency: sharedLoadedStats ? Number(sharedLoadedStats.maxConcurrency || 0) : Math.max(...payloads.map(payload => Number(payload.source?.rankBucketMaxConcurrency || 0))),",
              "      sortPasses: numericSum(payloads, ['source', 'sortPasses']),": "      sortPasses: sharedAggregate ? Number(sharedAggregate.sortPasses || 0) : numericSum(payloads, ['source', 'sortPasses']),"
          }
          for old, new in replacements.items():
              api = replace_once(api, old, new, f'source metric {old.strip()}')

          shared_source_anchor = '''      allBandsExecutionMode: MAJOR_BANDS_ALL_BANDS_EXECUTION_MODE,\n      allBandsPageCacheVersion: MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n      sequentialBandPasses: BAND_KEYS.length,\n'''
          shared_source_patch = '''      allBandsExecutionMode: MAJOR_BANDS_ALL_BANDS_EXECUTION_MODE,\n      allBandsPageCacheVersion: MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n      allBandsSharedProjectionVersion: MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION,\n      allBandsPhysicalProjectionPasses: allBandsShared ? sharedPhysicalProjectionPasses : 0,\n      allBandsSharedProjectionReuses: allBandsShared ? Math.max(0, sharedBandUses - 1) : 0,\n      allBandsFallbackPageRefetches: allBandsShared ? sharedFallbackPageRefetches : BAND_KEYS.length,\n      allBandsPhysicalAssetPasses: allBandsShared ? sharedPhysicalProjectionPasses : BAND_KEYS.length,\n      allBandsTransientProjectionReleased: allBandsShared ? sharedTransientProjectionReleased : true,\n      sequentialBandPasses: BAND_KEYS.length,\n'''
          api = replace_once(api, shared_source_anchor, shared_source_patch, 'all-bands source telemetry')

          requested_start = '''  const orderIdentity = `${executionBaseIdentity}|ordered-id-snapshot`;\n  const minimalOrderProjection = filters.region === 'all'\n    && !schoolFilter\n    && filters.bottomLineMode === 'all'\n    && filters.specialProjectMode === 'hide_eligibility_projects';\n  let retained = readRequestedBandOrderSnapshot(orderIdentity);\n'''
          requested_start_patch = '''  const orderIdentity = `${executionBaseIdentity}|ordered-id-snapshot`;\n  const allBandsShared = context?.majorBandsAllBandsShared?.version === MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION\n    ? context.majorBandsAllBandsShared\n    : null;\n  const minimalOrderProjection = filters.region === 'all'\n    && !schoolFilter\n    && filters.bottomLineMode === 'all'\n    && filters.specialProjectMode === 'hide_eligibility_projects';\n  let retained = allBandsShared ? null : readRequestedBandOrderSnapshot(orderIdentity);\n'''
          api = replace_once(api, requested_start, requested_start_patch, 'requested shared start')

          requested_branch = '''  let orderPageSource = 'page-id-refetch';\n  let orderCacheStatus = retained ? 'ordered-id-hit' : 'ordered-id-miss';\n\n  if (!retained) {\n'''
          requested_branch_patch = '''  let orderPageSource = 'page-id-refetch';\n  let orderCacheStatus = retained ? 'ordered-id-hit' : 'ordered-id-miss';\n\n  if (allBandsShared?.processed) {\n    const ordered = allBandsShared.processed.grouped[requestedBand].ordered;\n    const identity = queryIdentity({ candidateScore, rangePreset, filters, schoolNames, band: requestedBand });\n    retained = {\n      version: MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION,\n      candidateRank: allBandsShared.candidateRank,\n      totalRank: allBandsShared.totalRank,\n      rankWindows: allBandsShared.rankWindows,\n      aggregate: allBandsShared.processed.stats,\n      keywordQuery: allBandsShared.processed.keywordQuery,\n      orderProjectionVersion: allBandsShared.loadedStats.projectionVersion,\n      orderMinimalProjection: allBandsShared.loadedStats.minimalProjection === true,\n      orderRawRowCount: allBandsShared.loadedStats.rawRowCount,\n      orderDecodedRowCount: allBandsShared.loadedStats.decodedRowCount,\n      orderedIds: ordered.map(record => record.id),\n      snapshot: majorBandsSnapshotId(ordered, identity)\n    };\n    const orderedPage = ordered.slice(pageOffset, pageOffset + pageLimit);\n    pageRecords = orderedPage.map(record => {\n      if (!Array.isArray(record.majorBandsRawRow) || !Array.isArray(record.majorBandsRawSchema)) {\n        throw new Error(`位次共享投影缺少原始行引用：${record.id || 'unknown'}`);\n      }\n      return decodeMajorBandsStaticRow(record.majorBandsRawRow, record.majorBandsRawSchema);\n    });\n    loadedStats = allBandsShared.loadedStats;\n    selectedBuckets = allBandsShared.selectedBuckets;\n    retainRequestedBandOrderSnapshot(orderIdentity, retained);\n    orderCacheStatus = 'all-bands-shared-projection';\n    orderPageSource = 'all-bands-shared-projection';\n    allBandsShared.bandUses = Number(allBandsShared.bandUses || 0) + 1;\n  } else if (!retained) {\n'''
          api = replace_once(api, requested_branch, requested_branch_patch, 'requested shared branch')

          api_path.write_text(api, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          verifier = replace_once(
              verifier,
              "const expectedAllBandsExecutionMode = 'sequential-internal-band-requests-v3990_0';\n",
              "const expectedAllBandsExecutionMode = 'sequential-internal-band-requests-v3990_0';\nconst expectedAllBandsSharedProjectionVersion = 'major-bands-all-bands-shared-projection-v3990_0';\n",
              'verifier shared constant'
          )
          verifier = replace_once(
              verifier,
              "  assert.ok(['raw-row-reuse', 'full-record-reuse', 'page-id-refetch'].includes(result.payload?.source?.requestedBandOrderPageSource), `${result.scenario}: invalid order page source`);\n",
              "  assert.ok(['raw-row-reuse', 'full-record-reuse', 'page-id-refetch', 'all-bands-shared-projection'].includes(result.payload?.source?.requestedBandOrderPageSource), `${result.scenario}: invalid order page source`);\n",
              'verifier page source list'
          )
          verifier = replace_once(
              verifier,
              "  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-miss') {\n",
              "  if (!result.allBands && result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-miss') {\n",
              'verifier miss condition'
          )
          verifier = replace_once(
              verifier,
              "  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\n",
              "  if (!result.allBands && result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\n",
              'verifier hit condition'
          )
          all_band_assert_anchor = '''    assert.equal(result.payload?.source?.allBandsExecutionMode, expectedAllBandsExecutionMode, `${result.scenario}: sequential all-band execution mode`);\n    assert.equal(result.payload?.source?.allBandsPageCacheVersion, expectedAllBandsPageCacheVersion, `${result.scenario}: final all-band page cache deployment`);\n'''
          all_band_assert_patch = '''    assert.equal(result.payload?.source?.allBandsExecutionMode, expectedAllBandsExecutionMode, `${result.scenario}: sequential all-band execution mode`);\n    assert.equal(result.payload?.source?.allBandsPageCacheVersion, expectedAllBandsPageCacheVersion, `${result.scenario}: final all-band page cache deployment`);\n    assert.equal(result.payload?.source?.allBandsSharedProjectionVersion, expectedAllBandsSharedProjectionVersion, `${result.scenario}: shared all-band projection deployment`);\n    assert.equal(Number(result.payload?.source?.allBandsPhysicalProjectionPasses), 1, `${result.scenario}: all-band physical projection passes`);\n    assert.equal(Number(result.payload?.source?.allBandsSharedProjectionReuses), 2, `${result.scenario}: all-band projection reuse count`);\n    assert.equal(Number(result.payload?.source?.allBandsFallbackPageRefetches), 0, `${result.scenario}: all-band fallback page refetch`);\n    assert.ok(Number(result.payload?.source?.allBandsPhysicalAssetPasses) <= 1, `${result.scenario}: all-band physical asset passes`);\n    assert.equal(result.payload?.source?.allBandsTransientProjectionReleased, true, `${result.scenario}: all-band transient projection retained`);\n    assert.equal(result.payload?.source?.requestedBandOrderPageSource, 'all-bands-shared-projection', `${result.scenario}: all-band page source`);\n'''
          verifier = replace_once(verifier, all_band_assert_anchor, all_band_assert_patch, 'verifier all-band assertions')
          verifier_path.write_text(verifier, encoding='utf-8')

          audit_path = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          audit = audit_path.read_text(encoding='utf-8')
          audit = replace_once(
              audit,
              "const ALL_BANDS_EXECUTION_MODE = 'sequential-internal-band-requests-v3990_0';\n",
              "const ALL_BANDS_EXECUTION_MODE = 'sequential-internal-band-requests-v3990_0';\nconst ALL_BANDS_SHARED_PROJECTION_VERSION = 'major-bands-all-bands-shared-projection-v3990_0';\n",
              'audit shared constant'
          )
          audit_required_anchor = '''  'async function executeAllBandsSequentially',\n  'for (const band of BAND_KEYS)',\n'''
          audit_required_patch = '''  'async function executeAllBandsSequentially',\n  `MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION = '${ALL_BANDS_SHARED_PROJECTION_VERSION}'`,\n  'majorBandsAllBandsShared: allBandsShared',\n  'allBandsShared?.processed',\n  "orderCacheStatus = 'all-bands-shared-projection'",\n  "orderPageSource = 'all-bands-shared-projection'",\n  'allBandsPhysicalProjectionPasses:',\n  'allBandsSharedProjectionReuses:',\n  'allBandsFallbackPageRefetches:',\n  'allBandsPhysicalAssetPasses:',\n  'allBandsTransientProjectionReleased:',\n  'allBandsShared.processed = null',\n  'for (const band of BAND_KEYS)',\n'''
          audit = replace_once(audit, audit_required_anchor, audit_required_patch, 'audit shared API markers')
          verifier_audit_anchor = '''  `expectedAllBandsExecutionMode = '${ALL_BANDS_EXECUTION_MODE}'`,\n  "expectedAllBandsPageCacheVersion = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'",\n'''
          verifier_audit_patch = '''  `expectedAllBandsExecutionMode = '${ALL_BANDS_EXECUTION_MODE}'`,\n  `expectedAllBandsSharedProjectionVersion = '${ALL_BANDS_SHARED_PROJECTION_VERSION}'`,\n  "expectedAllBandsPageCacheVersion = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'",\n  'allBandsPhysicalProjectionPasses), 1',\n  'allBandsSharedProjectionReuses), 2',\n  'allBandsFallbackPageRefetches), 0',\n  'allBandsPhysicalAssetPasses) <= 1',\n  'allBandsTransientProjectionReleased, true',\n'''
          audit = replace_once(audit, verifier_audit_anchor, verifier_audit_patch, 'audit verifier markers')
          audit_path.write_text(audit, encoding='utf-8')

          rank_workflow_path = Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml')
          rank_workflow = rank_workflow_path.read_text(encoding='utf-8')
          rank_workflow = replace_once(
              rank_workflow,
              "          grep -q \"MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'\" functions/_lib/major-bands-all-bands-page-cache.v3990_0.js\n",
              "          grep -q \"MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'\" functions/_lib/major-bands-all-bands-page-cache.v3990_0.js\n          grep -q \"MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION = 'major-bands-all-bands-shared-projection-v3990_0'\" functions/api/major-bands.js\n",
              'rank workflow source marker'
          )
          rank_body_anchor = '''            body="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${TARGET_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&deploy=${GITHUB_SHA}-${attempt}" || true)"\n            if grep -q '\"queryKernelVersion\":\"major-bands-rank-query-kernel-v3990_0\"' <<<"$body" \\\n'''
          rank_body_patch = '''            body="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${TARGET_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&deploy=${GITHUB_SHA}-${attempt}" || true)"\n            all_body="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${TARGET_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&limit=16&deploy=${GITHUB_SHA}-${attempt}" || true)"\n            if grep -q '\"queryKernelVersion\":\"major-bands-rank-query-kernel-v3990_0\"' <<<"$body" \\\n'''
          rank_workflow = replace_once(rank_workflow, rank_body_anchor, rank_body_patch, 'rank workflow all-body probe')
          rank_condition_anchor = '''              && grep -q '\"bucketWorkerCount\":0' <<<"$body"; then\n'''
          rank_condition_patch = '''              && grep -q '\"bucketWorkerCount\":0' <<<"$body" \\\n              && grep -q '\"allBandsSharedProjectionVersion\":\"major-bands-all-bands-shared-projection-v3990_0\"' <<<"$all_body" \\\n              && grep -q '\"allBandsPhysicalAssetPasses\":1' <<<"$all_body"; then\n'''
          rank_workflow = replace_once(rank_workflow, rank_condition_anchor, rank_condition_patch, 'rank workflow shared condition')
          rank_workflow_path.write_text(rank_workflow, encoding='utf-8')

          prod_workflow_path = Path('.github/workflows/verify-production-api-health-v3971.yml')
          prod_workflow = prod_workflow_path.read_text(encoding='utf-8')
          prod_workflow = replace_once(
              prod_workflow,
              "          grep -q \"MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'\" functions/_lib/major-bands-all-bands-page-cache.v3990_0.js\n",
              "          grep -q \"MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'\" functions/_lib/major-bands-all-bands-page-cache.v3990_0.js\n          grep -q \"MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION = 'major-bands-all-bands-shared-projection-v3990_0'\" functions/api/major-bands.js\n",
              'production workflow source marker'
          )
          prod_api_anchor = '''            api="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&candidate=${GITHUB_SHA}-${attempt}" || true)"\n            if grep -q "display: 'v3.9.90.0'" <<<"$release" \\\n'''
          prod_api_patch = '''            api="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&candidate=${GITHUB_SHA}-${attempt}" || true)"\n            all_api="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&limit=16&candidate=${GITHUB_SHA}-${attempt}" || true)"\n            if grep -q "display: 'v3.9.90.0'" <<<"$release" \\\n'''
          prod_workflow = replace_once(prod_workflow, prod_api_anchor, prod_api_patch, 'production workflow all-api probe')
          prod_condition_anchor = '''              && grep -q '\"publicHttpSelfFanout\":false' <<<"$api"; then\n'''
          prod_condition_patch = '''              && grep -q '\"publicHttpSelfFanout\":false' <<<"$api" \\\n              && grep -q '\"allBandsSharedProjectionVersion\":\"major-bands-all-bands-shared-projection-v3990_0\"' <<<"$all_api" \\\n              && grep -q '\"allBandsPhysicalAssetPasses\":1' <<<"$all_api"; then\n'''
          prod_workflow = replace_once(prod_workflow, prod_condition_anchor, prod_condition_patch, 'production workflow shared condition')
          prod_workflow_path.write_text(prod_workflow, encoding='utf-8')
          PY

          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f, aliases: true) }"
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/v3990-all-bands-shared-rank.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs

      - name: Verify cold all-bands projection and full local pressure
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8794 --compatibility-date=2026-07-01 >/tmp/v3990-all-bands-shared-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8794/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16' >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-all-bands-shared-wrangler.log; exit 1; fi

          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const base = 'http://127.0.0.1:8794';
          async function get(path) {
            const response = await fetch(`${base}${path}`);
            const text = await response.text();
            let payload = null;
            try { payload = JSON.parse(text); } catch {}
            assert.equal(response.status, 200, `${path}: HTTP ${response.status} ${payload?.message || text.slice(0, 160)}`);
            assert.equal(payload?.ok, true, `${path}: ok=false`);
            return payload;
          }
          function verifyAll(payload, label) {
            const source = payload.source || {};
            assert.equal(source.allBandsSharedProjectionVersion, 'major-bands-all-bands-shared-projection-v3990_0', `${label}: version`);
            assert.equal(Number(source.allBandsPhysicalProjectionPasses), 1, `${label}: projection passes`);
            assert.equal(Number(source.allBandsSharedProjectionReuses), 2, `${label}: reuse count`);
            assert.equal(Number(source.allBandsFallbackPageRefetches), 0, `${label}: fallback refetch`);
            assert.ok(Number(source.allBandsPhysicalAssetPasses) <= 1, `${label}: physical asset passes`);
            assert.equal(source.allBandsTransientProjectionReleased, true, `${label}: transient release`);
            assert.equal(source.requestedBandOrderPageSource, 'all-bands-shared-projection', `${label}: page source`);
            assert.equal(Number(source.rankRawRowCount), Number(source.rankDecodedRowCount) + Number(source.rankRowsSkipped), `${label}: row accounting`);
            for (const band of ['upper', 'near', 'steady']) {
              const group = payload.bands?.[band];
              assert.ok(group, `${label}/${band}: missing group`);
              assert.ok(group.pagination?.snapshot, `${label}/${band}: missing snapshot`);
              assert.ok((group.records || []).length <= 37, `${label}/${band}: page overflow`);
              if (group.pagination?.hasMore) assert.ok(Number(group.pagination.nextOffset) > Number(group.pagination.offset));
              else assert.equal(group.pagination?.nextOffset, null);
            }
          }
          const first = await get(`/api/major-bands?candidateScore=579&rangePreset=standard&limit=37&stress=cold-all-${Date.now()}`);
          verifyAll(first, 'cold-all');
          await get(`/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=37&stress=release-${Date.now()}`);
          const second = await get(`/api/major-bands?candidateScore=579&rangePreset=standard&limit=37&stress=second-all-${Date.now()}`);
          verifyAll(second, 'second-all');
          fs.writeFileSync('/tmp/v3990-all-bands-shared-cold.json', JSON.stringify({ ok: true, first: first.source, second: second.source }, null, 2));
          NODE

          TARGET_BASE='http://127.0.0.1:8794' \
          CONCURRENCY_LEVELS='1,5,10,25,50' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='12000' \
          P95_LIMIT_MS='7000' \
          P99_LIMIT_MS='12000' \
          HARD_LIMIT_MS='20000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-all-bands-shared-local-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs

      - name: Commit verified shared projection
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            functions/api/major-bands.js \
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs \
            tools/audit-major-bands-query-execution-cache-v3990_0.mjs \
            .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml \
            .github/workflows/verify-production-api-health-v3971.yml
          git diff --cached --check
          git commit -m 'fix(rank): share one projection across initial bands'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-all-bands-shared-projection
          path: |
            /tmp/v3990-all-bands-shared-*.json
            /tmp/v3990-all-bands-shared-wrangler.log
          if-no-files-found: warn
          retention-days: 7
