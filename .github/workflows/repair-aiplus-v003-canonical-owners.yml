name: Repair AIPLuS v0.03 canonical owners

on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/repair-aiplus-v003-canonical-owners.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fold decision semantics into canonical owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(); count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              p.write_text(s.replace(old,new))

          # Workspace remains the sole state/transport owner for bounded semantic memory.
          replace_once(
              'shared/ai/ai-workspace-contract.v3992_0.js',
              'nowIso,makeId,cloneValue,cleanText,uniqueStrings,normalizedScore,normalizedRank,viewSeed,turnSeed,agentContextSeed,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch',
              'nowIso,makeId,cloneValue,cleanText,uniqueStrings,normalizedScore,normalizedRank,viewSeed,turnSeed,agentContextSeed,semanticFrameSeed,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch',
              'workspace model import')
          replace_once(
              'shared/ai/ai-workspace-contract.v3992_0.js',
              'export {AI_WORKSPACE_CONTRACT_VERSION,AI_EVENT_CONTRACT_VERSION,AI_RESULT_DELTA_VERSION,AI_ACTIVE_VIEW_VERSION,AI_DECISION_PROFILE_VERSION,AI_CONVERSATION_MEMORY_VERSION,AI_TURN_HISTORY_VERSION,AI_AGENT_CONTEXT_VERSION,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch};',
              'export {AI_WORKSPACE_CONTRACT_VERSION,AI_EVENT_CONTRACT_VERSION,AI_RESULT_DELTA_VERSION,AI_ACTIVE_VIEW_VERSION,AI_DECISION_PROFILE_VERSION,AI_CONVERSATION_MEMORY_VERSION,AI_TURN_HISTORY_VERSION,AI_AGENT_CONTEXT_VERSION,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch,semanticFrameSeed};',
              'workspace export')
          replace_once(
              'shared/ai/ai-workspace-contract.v3992_0.js',
              "agentContext:{version:cleanText(workspace.agentContext?.version,80),currentTask:cleanText(workspace.agentContext?.currentTask,80),previousTask:cleanText(workspace.agentContext?.previousTask,80),focus:compactFocusForServer(workspace.agentContext?.focus||{}),contextUsage:workspace.agentContext?.contextUsage||{}},",
              "agentContext:{version:cleanText(workspace.agentContext?.version,80),currentTask:cleanText(workspace.agentContext?.currentTask,80),previousTask:cleanText(workspace.agentContext?.previousTask,80),focus:compactFocusForServer(workspace.agentContext?.focus||{}),semanticFrame:semanticFrameSeed(workspace.agentContext?.semanticFrame),contextUsage:workspace.agentContext?.contextUsage||{}},",
              'workspace server compaction')

          # Canonical school resolver wins; regex fragments may not become parallel entity truth.
          replace_once(
              'functions/_lib/ai/command-interpreter.js',
              "function schoolNamesFromText(text,resolvedSchoolNames=[]){const source=String(text||''),matches=source.match(/[\\u4e00-\\u9fa5]{2,30}?(?:高等专科学校|专科学校|大学|学院)/g)||[],full=matches.map(v=>stripSchoolEntityLeadingAction(v,120));return unique([...(resolvedSchoolNames||[]),...full],4);}",
              "function schoolNamesFromText(text,resolvedSchoolNames=[]){const source=String(text||''),resolved=unique(resolvedSchoolNames||[],4),matches=source.match(/[\\u4e00-\\u9fa5]{2,30}?(?:高等专科学校|专科学校|大学|学院)/g)||[],full=matches.map(v=>{let candidate=stripSchoolEntityLeadingAction(v,120);const parts=candidate.split(/(?:和|跟|与|、|以及)/),tail=parts[parts.length-1]||'';if(parts.length>1&&/[\\u4e00-\\u9fa5]{2,30}(?:高等专科学校|专科学校|大学|学院)$/.test(tail))candidate=tail;return candidate;}).filter(candidate=>candidate&&!resolved.some(name=>candidate!==name&&candidate.endsWith(name)));return unique([...resolved,...full],4);}",
              'school entity boundary')

          p=Path('functions/_lib/ai/command-interpreter.js'); s=p.read_text()
          old="""export async function interpretAiCommand(text,workspace={},env={},request=null){
  const directoryQuestion=looksRegionSchoolDirectoryLanguage(text);
  let resolvedRegion=null;
  if(directoryQuestion||positiveMajors(text).length||workspace?.agentContext?.currentTask==='region_school_directory'){try{const resource=await import('./school-directory-resource.js');resolvedRegion=await resource.resolveSchoolDirectoryRegion({request,env},text,workspace);}catch{resolvedRegion=null;}}
  const resolvedSchool=directoryQuestion&&resolvedRegion?.key?{schoolNames:[],matchedAliases:[]}:await resolveAiSchoolMentionsDetailed(text,{request,env}),resolvedSchoolNames=resolvedSchool.schoolNames;
  const fallback=deterministicBase(text,workspace,resolvedSchoolNames,resolvedSchool.matchedAliases,resolvedRegion);
  if(shouldShortCircuitAiProvider(fallback))return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[],skipped:true,skipReason:'high-confidence-task-locked'}};
  if(fallback.agentTask==='fact_rank_lookup'&&fallback.score&&!fallback.mentorProfile?.enabled)return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[]}};
  const provider=await runAiProvider(env,promptMessages(text,workspace,fallback),{maxTokens:650,reasoningEffort:'low'});
  if(!provider.ok)return{command:fallback,provider};
  const parsed=parseJsonText(provider.text);
  return{command:normalizeModelCommand(parsed,text,workspace,fallback),provider};
}"""
          new="""export async function deterministicResolvedCommand(text,workspace={},env={},request=null){
  const directoryQuestion=looksRegionSchoolDirectoryLanguage(text);
  let resolvedRegion=null;
  if(directoryQuestion||positiveMajors(text).length||workspace?.agentContext?.currentTask==='region_school_directory'){try{const resource=await import('./school-directory-resource.js');resolvedRegion=await resource.resolveSchoolDirectoryRegion({request,env},text,workspace);}catch{resolvedRegion=null;}}
  const resolvedSchool=directoryQuestion&&resolvedRegion?.key?{schoolNames:[],matchedAliases:[]}:await resolveAiSchoolMentionsDetailed(text,{request,env});
  return deterministicBase(text,workspace,resolvedSchool.schoolNames,resolvedSchool.matchedAliases,resolvedRegion);
}
export async function interpretAiCommand(text,workspace={},env={},request=null){
  const fallback=await deterministicResolvedCommand(text,workspace,env,request);
  if(shouldShortCircuitAiProvider(fallback))return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[],skipped:true,skipReason:'high-confidence-task-locked'}};
  if(fallback.agentTask==='fact_rank_lookup'&&fallback.score&&!fallback.mentorProfile?.enabled)return{command:fallback,provider:{ok:false,provider:'deterministic',model:'',latencyMs:0,failures:[]}};
  const provider=await runAiProvider(env,promptMessages(text,workspace,fallback),{maxTokens:650,reasoningEffort:'low'});
  if(!provider.ok)return{command:fallback,provider};
  const parsed=parseJsonText(provider.text);
  return{command:normalizeModelCommand(parsed,text,workspace,fallback),provider};
}"""
          if s.count(old)!=1: raise SystemExit(f'interpreter resolver anchor: {s.count(old)}')
          p.write_text(s.replace(old,new))

          # confirmedCommand is a protocol marker, not a trusted business-semantics owner.
          replace_once('functions/_lib/ai/turn-orchestrator.js',
              "import {interpretAiCommand,deterministicCommand} from './command-interpreter.js';",
              "import {interpretAiCommand,deterministicCommand,deterministicResolvedCommand} from './command-interpreter.js';",
              'orchestrator resolver import')
          replace_once('functions/_lib/ai/turn-orchestrator.js',
              "function validateConfirmedCommand(value,input,workspace,preserveResolvedFocus=false){if(!value||typeof value!=='object')return null;const fallback=deterministicCommand(input,workspace),stableFocus=preserveResolvedFocus&&value.focus&&typeof value.focus==='object'?clone(value.focus):fallback.focus;return{...fallback,...value,changeSet:fallback.changeSet,score:fallback.score,regionKeys:fallback.regionKeys,majorKeywords:fallback.majorKeywords,schoolNames:fallback.schoolNames,bottomLineMode:fallback.bottomLineMode,focus:stableFocus,semanticFrame:null,rawText:clean(input,1200),question:clean(input,1200),requiresConfirmation:false,confidence:Math.max(.8,Number(value.confidence||.8)),source:`${clean(value.source,30)||'confirmed'}-confirmed`};}",
              "async function validateConfirmedCommand(value,input,workspace,env={},request=null){if(!value||typeof value!=='object')return null;const fallback=await deterministicResolvedCommand(input,workspace,env,request);return{...fallback,semanticFrame:null,rawText:clean(input,1200),question:clean(input,1200),source:`${clean(fallback.source,30)||'deterministic'}-confirmed`};}",
              'confirmed command canonicalization')
          replace_once('functions/_lib/ai/turn-orchestrator.js',
              "let interpreted;const deterministicContinuation=Object.keys(executionContext.aiDeterministicToolResults).length>0,confirmed=validateConfirmedCommand(payload.confirmedCommand,input||payload.confirmedCommand?.rawText||'',workspace,deterministicContinuation);",
              "let interpreted;const deterministicContinuation=Object.keys(executionContext.aiDeterministicToolResults).length>0,confirmed=await validateConfirmedCommand(payload.confirmedCommand,input||payload.confirmedCommand?.rawText||'',workspace,context.env||{},context.request||null);",
              'confirmed invocation')

          # Permanent proof: composite decision context survives the real browser/server compaction boundary.
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "import {createAiWorkspace} from '../shared/ai/ai-workspace-contract.v3992_0.js';",
              "import {createAiWorkspace,compactAiWorkspaceForServer} from '../shared/ai/ai-workspace-contract.v3992_0.js';",
              'verifier workspace import')
          marker="const followWorkspace=createAiWorkspace({examContext:{score:568},activeView:base.activeView,agentContext:{currentTask:'decision_research',semanticFrame:pairFrame,focus:{schools:pair.schoolNames,majors:pair.majorKeywords}}});"
          replacement=marker+"\nconst persistedFollowWorkspace=createAiWorkspace(compactAiWorkspaceForServer(followWorkspace,{input:'那如果我愿意读研呢'}));\nassert.deepEqual(persistedFollowWorkspace.agentContext.semanticFrame?.comparisonPairs,pairFrame.comparisonPairs,'decision semantic frame must survive browser/server compaction');"
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',marker,replacement,'semantic frame transport proof')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const follow=deterministicCommand('那如果我愿意读研呢',followWorkspace,[],[]);",
              "const follow=deterministicCommand('那如果我愿意读研呢',persistedFollowWorkspace,[],[]);",
              'follow command uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const followFrame=buildParentSemanticFrame('那如果我愿意读研呢',{schools:follow.schoolNames,majors:follow.majorKeywords,regionKeys:follow.regionKeys,score:follow.score||followWorkspace.examContext.score,mentorProfile:follow.mentorProfile,workspace:followWorkspace});",
              "const followFrame=buildParentSemanticFrame('那如果我愿意读研呢',{schools:follow.schoolNames,majors:follow.majorKeywords,regionKeys:follow.regionKeys,score:follow.score||persistedFollowWorkspace.examContext.score,mentorProfile:follow.mentorProfile,workspace:persistedFollowWorkspace});",
              'follow frame uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const followPlan=buildEvidencePlan({...follow,agentTask:'decision_research',semanticFrame:followFrame},followWorkspace,followWorkspace.activeView);",
              "const followPlan=buildEvidencePlan({...follow,agentTask:'decision_research',semanticFrame:followFrame},persistedFollowWorkspace,persistedFollowWorkspace.activeView);",
              'follow plan uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const refFrame=buildParentSemanticFrame('第二个就业呢',{schools:['大连交通大学'],majors:['自动化'],score:568,workspace:followWorkspace});",
              "const refFrame=buildParentSemanticFrame('第二个就业呢',{schools:['大连交通大学'],majors:['自动化'],score:568,workspace:persistedFollowWorkspace});",
              'reference frame uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const refPlan=buildEvidencePlan({agentTask:'decision_research',scoreUsage:'remembered',semanticFrame:refFrame},followWorkspace,followWorkspace.activeView);",
              "const refPlan=buildEvidencePlan({agentTask:'decision_research',scoreUsage:'remembered',semanticFrame:refFrame},persistedFollowWorkspace,persistedFollowWorkspace.activeView);",
              'reference plan uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const refScoreFrame=buildParentSemanticFrame('第二个568分现实吗',{schools:['大连交通大学'],majors:['自动化'],score:568,workspace:followWorkspace});const refScorePlan=buildEvidencePlan({agentTask:'decision_research',scoreUsage:'remembered',semanticFrame:refScoreFrame},followWorkspace,followWorkspace.activeView);",
              "const refScoreFrame=buildParentSemanticFrame('第二个568分现实吗',{schools:['大连交通大学'],majors:['自动化'],score:568,workspace:persistedFollowWorkspace});const refScorePlan=buildEvidencePlan({agentTask:'decision_research',scoreUsage:'remembered',semanticFrame:refScoreFrame},persistedFollowWorkspace,persistedFollowWorkspace.activeView);",
              'reference score uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const followTurn=await orchestrateAiTurn(ctx,{input:'那如果我愿意读研呢',workspace:followWorkspace,confirmedCommand:follow});",
              "const followTurn=await orchestrateAiTurn(ctx,{input:'那如果我愿意读研呢',workspace:persistedFollowWorkspace,confirmedCommand:follow});",
              'orchestrated follow uses transported workspace')
          replace_once('tools/verify-aiplus-parent-semantics-v003.mjs',
              "const refCommand=deterministicCommand('第二个就业呢',followWorkspace,[],[]);const refTurn=await orchestrateAiTurn(ctx,{input:'第二个就业呢',workspace:followWorkspace,confirmedCommand:refCommand});",
              "const refCommand=deterministicCommand('第二个就业呢',persistedFollowWorkspace,[],[]);const refTurn=await orchestrateAiTurn(ctx,{input:'第二个就业呢',workspace:persistedFollowWorkspace,confirmedCommand:refCommand});",
              'orchestrated reference uses transported workspace')
          PY
      - name: Verify repaired owners
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
          git diff --check
      - name: Commit verified repair and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-aiplus-v003-canonical-owners.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'AIPLuS：统一复合决策语义与 continuation 所有权'
          git push origin HEAD:agent/aiplus-parent-decision-v003
