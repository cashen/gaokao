name: tmp-aek-finalize
on:
  push:
    branches:
      - agent/aiplus-authoritative-education-knowledge
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-authoritative-education-knowledge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify AEK checkpoint
        run: node tools/tmp-aek-finalize.mjs
      - name: Commit verified checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "AEK: consolidate knowledge architecture and QA gate"
          git push origin HEAD:agent/aiplus-authoritative-education-knowledge
