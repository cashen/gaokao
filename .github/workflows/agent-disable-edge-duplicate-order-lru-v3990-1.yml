name: Temporary edge duplicate order LRU optimizer v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-disable-edge-duplicate-order-lru-v3990-1.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disable duplicate module ordered-ID retention when Edge cache exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          api = Path('functions/api/major-bands.js')
          text = api.read_text()
          marker1 = "  const orderEdgeCacheRequest = orderEdgeCache ? requestedBandOrderEdgeCacheRequest(context.request) : null;"
          repl1 = marker1 + "\n  const moduleOrderCacheEnabled = !orderEdgeCache;"
          marker2 = "  let retained = allBandsShared ? null : readRequestedBandOrderSnapshot(orderIdentity);"
          repl2 = "  let retained = allBandsShared ? null : (moduleOrderCacheEnabled ? readRequestedBandOrderSnapshot(orderIdentity) : null);"
          marker3 = "      retainRequestedBandOrderSnapshot(orderIdentity, retained);"
          repl3 = "      if (moduleOrderCacheEnabled) retainRequestedBandOrderSnapshot(orderIdentity, retained);"
          marker4 = "    retainRequestedBandOrderSnapshot(orderIdentity, retained);"
          repl4 = "    if (moduleOrderCacheEnabled) retainRequestedBandOrderSnapshot(orderIdentity, retained);"
          marker5 = "    orderCacheState: requestedBandOrderCacheState(orderIdentity),"
          repl5 = marker5 + "\n    orderModuleCacheEnabled: moduleOrderCacheEnabled,"
          marker6 = "        requestedBandOrderCacheBounded: execution.orderCacheState?.bounded !== false,"
          repl6 = marker6 + "\n        requestedBandOrderModuleCacheEnabled: execution.orderModuleCacheEnabled !== false,"
          for marker, replacement, expected in [(marker1,repl1,1),(marker2,repl2,1),(marker3,repl3,1),(marker4,repl4,1),(marker5,repl5,1),(marker6,repl6,1)]:
              if text.count(marker) != expected:
                  raise SystemExit(f'api anchor count={text.count(marker)} marker={marker[:60]}')
              text = text.replace(marker, replacement, 1)
          api.write_text(text)
          verify = Path('tools/verify-major-bands-preview-concurrency-v3990_1.mjs')
          v = verify.read_text()
          marker = "  assert.ok(Number(result.payload?.source?.requestedBandOrderCacheTotalChars || 0) <= 750000, `${result.scenario}: ordered-ID LRU total chars`);"
          addition = marker + "\n  if (!result.allBands && !['unavailable', 'keyword-bypass', 'shared-projection'].includes(result.payload?.source?.requestedBandOrderEdgeCacheStatus)) {\n    assert.equal(result.payload?.source?.requestedBandOrderModuleCacheEnabled, false, `${result.scenario}: Edge mode retained module ordered-ID cache`);\n    assert.equal(Number(result.payload?.source?.requestedBandOrderCacheEntries || 0), 0, `${result.scenario}: Edge mode module ordered-ID entries`);\n  }"
          if v.count(marker) != 1:
              raise SystemExit(f'verifier module-LRU anchor count={v.count(marker)}')
          verify.write_text(v.replace(marker, addition, 1))
          PY
          git diff --check
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_1.mjs >/tmp/major-bands-audit.log
          tail -n 40 /tmp/major-bands-audit.log
          git diff -- functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
      - name: Commit tested Edge-primary order cache policy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          git commit -m "perf: avoid duplicate ordered-ID module retention on Edge"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
