name: Verify architecture handoff v3990.1

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture-handoff:
    name: architecture-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify handoff and ownership boundaries
        run: node tools/audit-architecture-handoff-v3990_1.mjs

      - name: Re-run current site runtime ownership audit
        run: node tools/audit-site-runtime-generation-v3990_1.mjs

      - name: Re-run AIPLuS product/UI ownership audit
        run: node tools/audit-aiplus-v002-ui.mjs

      - name: Re-run Cloudflare production ownership audit
        run: node tools/audit-cloudflare-git-production-v3990_1.mjs
