name: Verify architecture handoff v3990.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-handoff:
    name: architecture-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify handoff and ownership boundaries
        run: node tools/audit-architecture-handoff-v3990_2.mjs

      - name: Re-run current site runtime ownership audit
        run: node tools/audit-site-runtime-generation-v3990_2.mjs

      - name: Re-run AIPLuS product/UI ownership audit
        run: node tools/audit-aiplus-v002-ui.mjs

      - name: Re-run Cloudflare production ownership audit
        run: node tools/audit-cloudflare-git-production-v3990_2.mjs
