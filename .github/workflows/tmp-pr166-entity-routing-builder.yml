name: tmp PR166 entity routing builder

on:
  push:
    branches:
      - agent/tmp-pr166-entity-routing-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR166 target
        uses: actions/checkout@v4
        with:
          ref: agent/aiplus-family-decision-workbench
          fetch-depth: 0
          path: target
      - name: Checkout isolated builder
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-pr166-entity-routing-builder
          fetch-depth: 1
          path: builder
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard exact PR166 head
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "67c9f9a355f1f603b361205b3b0de4a9aa9e2612"
      - name: Apply compact entity routing remediation
        working-directory: target
        run: python ../builder/tools/tmp_pr166_entity_routing_builder.py
      - name: Preserve semantic-owner boundaries
        working-directory: target
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/ai/command-interpreter.js')
          s=p.read_text(encoding='utf-8')
          old="const point=scoreConstraint?.kind==='point';\n  const short=source.length<=64;"
          new="const point=scoreConstraint?.kind==='point',noScoreConstraint=scoreConstraint?.kind==='none';\n  const short=source.length<=64;"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          for old,new in [
            ("if(!point&&!schools.length&&majors.length===1&&geo?.explicit&&source.length<=40)","if(noScoreConstraint&&!schools.length&&majors.length===1&&geo?.explicit&&source.length<=40)"),
            ("if(!point&&!schools.length&&!majors.length&&geo?.explicit&&source.length<=20)","if(noScoreConstraint&&!schools.length&&!majors.length&&geo?.explicit&&source.length<=20)"),
            ("if(!point&&!geo?.explicit&&schools.length===1&&majors.length===1&&!residue)","if(noScoreConstraint&&!geo?.explicit&&schools.length===1&&majors.length===1&&!residue)"),
            ("if(!point&&!geo?.explicit&&schools.length===1&&!majors.length&&!residue)","if(noScoreConstraint&&!geo?.explicit&&schools.length===1&&!majors.length&&!residue)"),
            ("if(!point&&!geo?.explicit&&!schools.length&&majors.length===1&&!residue)","if(noScoreConstraint&&!geo?.explicit&&!schools.length&&majors.length===1&&!residue)"),
          ]:
            assert s.count(old)==1, old
            s=s.replace(old,new,1)
          old="|方案|为什么|是什么|什么是)/.test(source);"
          new="|方案|为什么|是什么|什么是|哪些|哪个|什么|啥|哪里|哪儿|积累|底子|特色|推荐|值得|就业|前景|课程|学什么)/.test(source);"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('functions/_lib/ai/agent-task-kernel.js')
          s=p.read_text(encoding='utf-8')
          old="if(workspace?.examContext?.score)return candidateTaskForCompactEntity(workspace);"
          new="if(workspace?.examContext?.score||candidateTaskForCompactEntity(workspace)==='candidate_refinement')return candidateTaskForCompactEntity(workspace);"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old="if(workspace?.examContext?.score||['candidate_discovery','candidate_refinement'].includes(priorTask))return candidateTaskForCompactEntity(workspace);"
          new="if(workspace?.examContext?.score||['candidate_discovery','candidate_refinement'].includes(priorTask)||candidateTaskForCompactEntity(workspace)==='candidate_refinement')return candidateTaskForCompactEntity(workspace);"
          assert s.count(old)==2
          s=s.replace(old,new,2)
          p.write_text(s,encoding='utf-8')

          p=Path('tools/verify-aiplus-routing-grid-v001.mjs')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("assert.equal(compactMajorEmpty.focus.major,'电气工程及其自动化');","assert.equal(compactMajorEmpty.focus.major,normalizeMajorLanguage('电气'));") ,
            ("assert.equal(compactPair.focus.major,'电气工程及其自动化');","assert.equal(compactPair.focus.major,normalizeMajorLanguage('电气'));") ,
            ("assert.equal(majorDrill.focus.major,'电气工程及其自动化');","assert.equal(majorDrill.focus.major,normalizeMajorLanguage('电气'));") ,
          ]
          for old,new in replacements:
            assert s.count(old)==1, old
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Run focused routing and workspace proofs before any PR commit
        working-directory: target
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check functions/_lib/ai/advisor-presentation.js
          node tools/verify-aiplus-routing-grid-v001.mjs
          node tools/verify-aiplus-human-intent-matrix-v001.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-aiplus-family-decision-workbench-v003.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
          git diff --check
      - name: Commit exactly one tested PR166 remediation
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/agent-task-kernel.js functions/_lib/ai/command-interpreter.js shared/ai/ai-workspace-contract.v3992_0.js functions/_lib/ai/advisor-presentation.js tools/verify-aiplus-routing-grid-v001.mjs tools/verify-ai-workspace-v3990_1.mjs docs/architecture/AIPLUS-FAMILY-DECISION-WORKBENCH-STATUS.md
          git diff --cached --quiet && { echo 'No remediation diff produced.' >&2; exit 3; }
          git commit -m 'AIPLuS: unify compact entity intent routing'
          git push origin HEAD:agent/aiplus-family-decision-workbench
