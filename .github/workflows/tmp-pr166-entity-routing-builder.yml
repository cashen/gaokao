name: tmp PR166 entity routing builder

on:
  push:
    branches:
      - agent/tmp-pr166-entity-routing-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-family-decision-workbench
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard exact PR166 head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "67c9f9a355f1f603b361205b3b0de4a9aa9e2612"
      - name: Apply compact entity routing remediation
        run: python tools/tmp_pr166_entity_routing_builder.py
      - name: Run focused routing and workspace proofs before any PR commit
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check functions/_lib/ai/advisor-presentation.js
          node tools/verify-aiplus-routing-grid-v001.mjs
          node tools/verify-aiplus-human-intent-matrix-v001.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-aiplus-family-decision-workbench-v003.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
          git diff --check
      - name: Commit exactly one tested PR166 remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/agent-task-kernel.js functions/_lib/ai/command-interpreter.js shared/ai/ai-workspace-contract.v3992_0.js functions/_lib/ai/advisor-presentation.js tools/verify-aiplus-routing-grid-v001.mjs tools/verify-ai-workspace-v3990_1.mjs docs/architecture/AIPLUS-FAMILY-DECISION-WORKBENCH-STATUS.md
          git diff --cached --quiet && { echo 'No remediation diff produced.' >&2; exit 3; }
          git commit -m 'AIPLuS: unify compact entity intent routing'
          git push origin HEAD:agent/aiplus-family-decision-workbench
