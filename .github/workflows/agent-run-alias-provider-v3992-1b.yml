name: Rerun corrected AI alias provider v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - name: Execute corrected product-only patch with complete alias tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/agent-alias-provider-v3992-1.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(source) if line.strip()=='run: |')+1
          block=[]
          for line in source[start:]:
              if line and not line.startswith('          '): break
              block.append(line[10:] if line.startswith('          ') else '')
          script='\n'.join(block)+'\n'
          wrong='s=s.replace("import {deterministicCommand,shouldShortCircuitAiProvider} from \'../functions/_lib/ai/command-interpreter.js\';","import {deterministicCommand,shouldShortCircuitAiProvider,resolveAiSchoolMentions} from \'../functions/_lib/ai/command-interpreter.js\';")'
          fixed='s=s.replace("import { deterministicCommand,interpretAiCommand,shouldShortCircuitAiProvider } from \'../functions/_lib/ai/command-interpreter.js\';","import { deterministicCommand,interpretAiCommand,shouldShortCircuitAiProvider,resolveAiSchoolMentions } from \'../functions/_lib/ai/command-interpreter.js\';")'
          if wrong not in script: raise SystemExit('source runner import replacement not found')
          script=script.replace(wrong,fixed,1)
          anchor='s=s.replace("c=cmd(\'辽科大的电气呢\',history);","c=cmd(\'辽科大的电气呢\',history,liaoningTech);")'
          extra='s=s.replace("c=cmd(\'辽科大\',majorBg);","c=cmd(\'辽科大\',majorBg,liaoningTech);")'
          if anchor not in script: raise SystemExit('alias test injection anchor not found')
          script=script.replace(anchor,anchor+'\n          '+extra,1)
          script=script.replace("git rm .github/workflows/agent-alias-provider-v3992-1.yml\n",'')
          Path('/tmp/alias-product-fix.sh').write_text(script)
          PY
          bash /tmp/alias-product-fix.sh
