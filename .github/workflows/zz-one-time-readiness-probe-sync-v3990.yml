name: One-time rank readiness probe sync v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage synchronized readiness workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              'verify-major-bands-bounded-fanout-v3972_5.yml': 2,
              'verify-production-api-health-v3971.yml': 1
          }
          patch_dir = Path('tools/.workflow-contract-patches-v3990')
          patch_dir.mkdir(parents=True, exist_ok=True)

          old_probe = '\"rankBucketMaxConcurrency\":2'
          new_probe = '\"rankBucketMaxConcurrency\":1'
          row_probe = '\"rankRowFilterVersion\":\"major-bands-rank-row-filter-v3990_0\"'

          for name, expected_count in targets.items():
              source = Path('.github/workflows') / name
              text = source.read_text(encoding='utf-8')
              if text.count(old_probe) != expected_count:
                  raise SystemExit(f'{name}: expected {expected_count} stale probes, found {text.count(old_probe)}')
              text = text.replace(old_probe, new_probe)

              lines = text.splitlines()
              output = []
              inserted = 0
              for line in lines:
                  if new_probe in line:
                      variable = '$api' if '<<<"$api"' in line else '$body'
                      indent = line[:len(line) - len(line.lstrip())]
                      continuation = line.rstrip().endswith('\\')
                      probe_line = f'{indent}&& grep -q \'{row_probe}\' <<<"{variable}"'
                      if continuation:
                          probe_line += ' \\'
                      if not output or row_probe not in output[-1]:
                          output.append(probe_line)
                          inserted += 1
                  output.append(line)
              text = '\n'.join(output) + '\n'

              if text.count(new_probe) != expected_count:
                  raise SystemExit(f'{name}: expected {expected_count} synchronized concurrency probes')
              if text.count(row_probe) < expected_count:
                  raise SystemExit(f'{name}: expected at least {expected_count} row-filter readiness probes')
              if old_probe in text:
                  raise SystemExit(f'{name}: stale concurrency probe remains')
              if inserted != expected_count:
                  raise SystemExit(f'{name}: inserted {inserted}, expected {expected_count} row-filter probes')
              (patch_dir / name).write_text(text, encoding='utf-8')

          print({name: (patch_dir / name).stat().st_size for name in targets})
          PY

          for file in tools/.workflow-contract-patches-v3990/*.yml; do
            ruby -e "require 'yaml'; YAML.parse_file(ARGV[0])" "$file"
          done
          grep -q '"rankBucketMaxConcurrency":1' tools/.workflow-contract-patches-v3990/verify-major-bands-bounded-fanout-v3972_5.yml
          grep -q '"rankRowFilterVersion":"major-bands-rank-row-filter-v3990_0"' tools/.workflow-contract-patches-v3990/verify-major-bands-bounded-fanout-v3972_5.yml
          grep -q '"rankBucketMaxConcurrency":1' tools/.workflow-contract-patches-v3990/verify-production-api-health-v3971.yml
          grep -q '"rankRowFilterVersion":"major-bands-rank-row-filter-v3990_0"' tools/.workflow-contract-patches-v3990/verify-production-api-health-v3971.yml

      - name: Commit staged workflow blobs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/.workflow-contract-patches-v3990
          git diff --cached --check
          git commit -m 'test(rank): stage synchronized readiness probes'
          git push origin HEAD:agent/rank-kernel-v3990_0
