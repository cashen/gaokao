name: Sync resource center v3962

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync-resource-center:
    if: github.head_ref == 'feat/v3.9.62-school-all-majors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize resource center version
        run: python3 tools/release/sync-resource-center-v3962.py
      - name: Validate synchronization
        run: |
          python3 -m json.tool ln-rank/release-meta.json >/dev/null
          python3 -m json.tool ln-rank/active-assets.json >/dev/null
          python3 tools/ln-2026/verify-final-release-v5.py
          node tools/audit-shared-resource-center-v3957.mjs
      - name: Commit synchronized files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD -- .github tools/release/sync-resource-center-v3962.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No resource center synchronization changes needed'
            exit 0
          fi
          git commit -m 'release: synchronize v3962 shared resource center'
          git push origin HEAD:${{ github.head_ref }}
