name: One-time minimal order projection v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-minimal-order-projection-v3990.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch minimal cold-order projection and workflow readiness
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('functions/_lib/major-bands-static-provider.js')
          provider = provider_path.read_text(encoding='utf-8')
          version_anchor = "export const MAJOR_BANDS_RANK_ROW_FILTER_VERSION = 'major-bands-rank-row-filter-v3990_0';\n"
          version_patch = version_anchor + "export const MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION = 'major-bands-rank-order-minimal-projection-v3990_0';\n"
          assert provider.count(version_anchor) == 1
          provider = provider.replace(version_anchor, version_patch, 1)

          projection_code = '''\nconst NO_SPECIAL_PROJECT_FOR_ORDER = Object.freeze({\n  hasSpecialProject: false,\n  keys: Object.freeze([]),\n  labels: Object.freeze([]),\n  primaryLabel: '',\n  reviewPoints: Object.freeze([])\n});\n\nexport function buildMajorBandsRankOrderProjectionSchema(schema = []) {\n  const index = key => schema.indexOf(key);\n  return Object.freeze({\n    id: index('id'),\n    school: index('school'),\n    major: index('major'),\n    score2026: index('score2026'),\n    rank2026: index('rank2026'),\n    specialHas: index('specialHas'),\n    specialKeys: index('specialKeys'),\n    specialLabels: index('specialLabels'),\n    specialPrimaryLabel: index('specialPrimaryLabel'),\n    specialReviewPoints: index('specialReviewPoints')\n  });\n}\n\nexport function decodeMajorBandsRankOrderRow(row = [], projectionSchema = {}) {\n  const value = key => Number.isInteger(projectionSchema[key]) && projectionSchema[key] >= 0\n    ? row[projectionSchema[key]]\n    : undefined;\n  const specialHas = Boolean(value('specialHas'));\n  const record = {\n    id: value('id'),\n    school: value('school'),\n    major: value('major'),\n    score2026: value('score2026'),\n    rank2026: value('rank2026'),\n    specialProject: NO_SPECIAL_PROJECT_FOR_ORDER\n  };\n  if (specialHas) {\n    record.specialProject = {\n      hasSpecialProject: true,\n      keys: Array.isArray(value('specialKeys')) ? value('specialKeys') : [],\n      labels: Array.isArray(value('specialLabels')) ? value('specialLabels') : [],\n      primaryLabel: value('specialPrimaryLabel') || '',\n      reviewPoints: Array.isArray(value('specialReviewPoints')) ? value('specialReviewPoints') : []\n    };\n  }\n  return record;\n}\n\n'''
          intersects_anchor = 'function intersects(bucket, scoreWindow) {'
          assert provider.count(intersects_anchor) == 1
          provider = provider.replace(intersects_anchor, projection_code + intersects_anchor, 1)

          decode_anchor = '''  const selectedRows = allowedIds && idIndex >= 0\n    ? rankFilteredRows.filter(row => allowedIds.has(String(row?.[idIndex] || '')))\n    : rankFilteredRows;\n  return {\n    manifest,\n    bucket,\n    records: selectedRows.map(row => decodeRow(row, schema)),\n'''
          decode_patch = '''  const selectedRows = allowedIds && idIndex >= 0\n    ? rankFilteredRows.filter(row => allowedIds.has(String(row?.[idIndex] || '')))\n    : rankFilteredRows;\n  const projectionVersion = options.projection === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION\n    ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION\n    : 'full-record-v3990_0';\n  const projectionSchema = projectionVersion === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION\n    ? buildMajorBandsRankOrderProjectionSchema(schema)\n    : null;\n  const records = projectionSchema\n    ? selectedRows.map(row => decodeMajorBandsRankOrderRow(row, projectionSchema))\n    : selectedRows.map(row => decodeRow(row, schema));\n  return {\n    manifest,\n    bucket,\n    records,\n    projectionVersion,\n    minimalProjection: projectionVersion === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n'''
          assert provider.count(decode_anchor) == 1
          provider_path.write_text(provider.replace(decode_anchor, decode_patch, 1), encoding='utf-8')

          loader_path = Path('functions/_lib/major-bands-rank-bucket-loader.v3990_0.js')
          loader = loader_path.read_text(encoding='utf-8')
          import_anchor = '''import {\n  MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n  loadMajorBandsStaticRankBucket\n} from './major-bands-static-provider.js';\n'''
          import_patch = '''import {\n  MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n  MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n  loadMajorBandsStaticRankBucket\n} from './major-bands-static-provider.js';\n'''
          assert loader.count(import_anchor) == 1
          loader = loader.replace(import_anchor, import_patch, 1)
          loader = loader.replace(
              'export { MAJOR_BANDS_RANK_ROW_FILTER_VERSION };',
              'export { MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION, MAJOR_BANDS_RANK_ROW_FILTER_VERSION };',
              1
          )
          key_anchor = "  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}`;\n"
          key_patch = "  const projection = options.projection || 'full-record-v3990_0';\n  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}|${projection}`;\n"
          assert loader.count(key_anchor) == 1
          loader = loader.replace(key_anchor, key_patch, 1)
          load_anchor = '''    rankRange: scope.requestedRange,\n    allowedIds: options.allowedIds\n'''
          load_patch = '''    rankRange: scope.requestedRange,\n    allowedIds: options.allowedIds,\n    projection: options.projection\n'''
          assert loader.count(load_anchor) == 1
          loader = loader.replace(load_anchor, load_patch, 1)
          stats_anchor = '''        pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n        rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n'''
          stats_patch = '''        pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n        projectionVersion: options.projection || 'full-record-v3990_0',\n        minimalProjection: options.projection === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n        rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n'''
          assert loader.count(stats_anchor) == 1
          loader = loader.replace(stats_anchor, stats_patch, 1)
          final_stats_anchor = '''      pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n      rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n'''
          final_stats_patch = '''      pageIdFilterVersion: 'major-bands-page-id-predecode-filter-v3990_0',\n      projectionVersion: results[0]?.loaded?.projectionVersion || options.projection || 'full-record-v3990_0',\n      minimalProjection: results.every(result => result?.loaded?.minimalProjection === true),\n      rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n'''
          assert loader.count(final_stats_anchor) == 1
          loader_path.write_text(loader.replace(final_stats_anchor, final_stats_patch, 1), encoding='utf-8')

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')
          api_import_anchor = '''  MAJOR_BANDS_RANK_BUCKET_CACHE_VERSION,\n  MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n  loadMajorBandsRankWindow\n'''
          api_import_patch = '''  MAJOR_BANDS_RANK_BUCKET_CACHE_VERSION,\n  MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n  MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n  loadMajorBandsRankWindow\n'''
          assert api.count(api_import_anchor) == 1
          api = api.replace(api_import_anchor, api_import_patch, 1)
          helper_start = '''  const orderIdentity = `${executionBaseIdentity}|ordered-id-snapshot`;\n  let retained = readRequestedBandOrderSnapshot(orderIdentity);\n  let heavyExecution = null;\n  let orderedRecords = null;\n  let loadedStats = null;\n'''
          helper_patch = '''  const orderIdentity = `${executionBaseIdentity}|ordered-id-snapshot`;\n  const minimalOrderProjection = filters.region === 'all'\n    && !schoolFilter\n    && filters.bottomLineMode === 'all'\n    && filters.specialProjectMode === 'hide_eligibility_projects';\n  let retained = readRequestedBandOrderSnapshot(orderIdentity);\n  let heavyExecution = null;\n  let loadedStats = null;\n'''
          assert api.count(helper_start) == 1
          api = api.replace(helper_start, helper_patch, 1)
          order_load_anchor = '      const loaded = await loadMajorBandsRankWindow(context, selected);\n'
          order_load_patch = '''      const loaded = await loadMajorBandsRankWindow(context, selected, {\n        projection: minimalOrderProjection ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined\n      });\n'''
          assert api.count(order_load_anchor) == 1
          api = api.replace(order_load_anchor, order_load_patch, 1)
          snapshot_anchor = '''        keywordQuery: processed.keywordQuery,\n        orderedIds: ordered.map(record => record.id),\n        snapshot: majorBandsSnapshotId(ordered, identity)\n'''
          snapshot_patch = '''        keywordQuery: processed.keywordQuery,\n        orderProjectionVersion: loaded.stats.projectionVersion,\n        orderMinimalProjection: loaded.stats.minimalProjection === true,\n        orderRawRowCount: loaded.stats.rawRowCount,\n        orderDecodedRowCount: loaded.stats.decodedRowCount,\n        orderedIds: ordered.map(record => record.id),\n        snapshot: majorBandsSnapshotId(ordered, identity)\n'''
          assert api.count(snapshot_anchor) == 1
          api = api.replace(snapshot_anchor, snapshot_patch, 1)
          return_anchor = '''      return {\n        retained: orderSnapshot,\n        orderedRecords: ordered,\n        loadedStats: loaded.stats,\n        selectedBuckets: selected\n      };\n'''
          return_patch = '''      return {\n        retained: orderSnapshot,\n        loadedStats: loaded.stats,\n        selectedBuckets: selected\n      };\n'''
          assert api.count(return_anchor) == 1
          api = api.replace(return_anchor, return_patch, 1)
          built_anchor = '''    retained = built.retained;\n    orderedRecords = built.orderedRecords;\n    loadedStats = built.loadedStats;\n'''
          built_patch = '''    retained = built.retained;\n    loadedStats = built.loadedStats;\n'''
          assert api.count(built_anchor) == 1
          api = api.replace(built_anchor, built_patch, 1)
          page_branch = '''  let pageRecords;\n  if (orderedRecords) {\n    pageRecords = orderedRecords.slice(pageOffset, pageOffset + pageLimit);\n  } else {\n    selectedBuckets = selectMajorBandsRankBuckets(retained.rankWindows);\n    const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, { allowedIds: new Set(pageIds) });\n    loadedStats = loaded.stats;\n    const byId = new Map(loaded.records.map(record => [record.id, record]));\n    pageRecords = pageIds.map(id => byId.get(id)).filter(Boolean);\n    if (pageRecords.length !== pageIds.length) {\n      throw new Error(`位次有序 ID 页记录不完整：${pageRecords.length}/${pageIds.length}`);\n    }\n    for (const record of pageRecords) {\n'''
          page_patch = '''  selectedBuckets = selectMajorBandsRankBuckets(retained.rankWindows);\n  const pageLoaded = await loadMajorBandsRankWindow(context, selectedBuckets, { allowedIds: new Set(pageIds) });\n  loadedStats = pageLoaded.stats;\n  const byId = new Map(pageLoaded.records.map(record => [record.id, record]));\n  const pageRecords = pageIds.map(id => byId.get(id)).filter(Boolean);\n  if (pageRecords.length !== pageIds.length) {\n    throw new Error(`位次有序 ID 页记录不完整：${pageRecords.length}/${pageIds.length}`);\n  }\n  for (const record of pageRecords) {\n'''
          assert api.count(page_branch) == 1
          api = api.replace(page_branch, page_patch, 1)
          close_anchor = '''      });\n    }\n  }\n\n  const compactPage = pageRecords.map(record => compactMajorBandsBucketCandidate(record));\n'''
          close_patch = '''      });\n  }\n\n  const compactPage = pageRecords.map(record => compactMajorBandsBucketCandidate(record));\n'''
          assert api.count(close_anchor) == 1
          api = api.replace(close_anchor, close_patch, 1)
          source_anchor = '''        requestedBandPageDecodedRecords: Number(execution.pageDecodedRecordCount || cacheRetention.recordCount || 0),\n        requestedBandOrderCacheRetainsDecodedRows: false,\n'''
          source_patch = '''        requestedBandPageDecodedRecords: Number(execution.pageDecodedRecordCount || cacheRetention.recordCount || 0),\n        requestedBandOrderProjectionVersion: execution.value?.orderProjectionVersion || retained?.orderProjectionVersion || MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n        requestedBandOrderMinimalProjection: execution.value?.orderMinimalProjection ?? retained?.orderMinimalProjection ?? false,\n        requestedBandOrderBuildRawRows: Number(execution.value?.orderRawRowCount || retained?.orderRawRowCount || 0),\n        requestedBandOrderBuildDecodedRows: Number(execution.value?.orderDecodedRowCount || retained?.orderDecodedRowCount || 0),\n        requestedBandOrderCacheRetainsDecodedRows: false,\n'''
          if api.count(source_anchor) != 1:
              raise SystemExit(f'API source telemetry anchor count={api.count(source_anchor)}')
          api = api.replace(source_anchor, source_patch, 1)
          api_path.write_text(api, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          constant_anchor = "const expectedPageIdFilterVersion = 'major-bands-page-id-predecode-filter-v3990_0';\n"
          constant_patch = constant_anchor + "const expectedOrderProjectionVersion = 'major-bands-rank-order-minimal-projection-v3990_0';\n"
          assert verifier.count(constant_anchor) == 1
          verifier = verifier.replace(constant_anchor, constant_patch, 1)
          verify_anchor = '''  assert.equal(result.payload?.source?.requestedBandOrderCacheRetainsEnrichedRecords, false, `${result.scenario}: ordered-ID cache retained enriched records`);\n'''
          verify_patch = verify_anchor + '''  assert.equal(result.payload?.source?.requestedBandOrderProjectionVersion, expectedOrderProjectionVersion, `${result.scenario}: minimal order projection deployment`);\n  assert.equal(result.payload?.source?.requestedBandOrderMinimalProjection, true, `${result.scenario}: default query did not use minimal projection`);\n  assert.ok(Number(result.payload?.source?.requestedBandPageDecodedRecords || 0) <= Number(result.payload?.meta?.pageSize || 80), `${result.scenario}: page decoded more than page size`);\n'''
          assert verifier.count(verify_anchor) == 1
          verifier = verifier.replace(verify_anchor, verify_patch, 1)
          evidence_anchor = '  pageIdFilterVersion: expectedPageIdFilterVersion,\n'
          evidence_patch = evidence_anchor + '  orderProjectionVersion: expectedOrderProjectionVersion,\n'
          assert verifier.count(evidence_anchor) == 1
          verifier_path.write_text(verifier.replace(evidence_anchor, evidence_patch, 1), encoding='utf-8')

          audit_path = Path('tools/audit-major-bands-rank-kernel-v3990_0.mjs')
          audit = audit_path.read_text(encoding='utf-8')
          import_anchor = '''import {\n  MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n  majorBandsRankValueMatchesRange\n} from '../functions/_lib/major-bands-static-provider.js';\n'''
          import_patch = '''import {\n  MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n  MAJOR_BANDS_RANK_ROW_FILTER_VERSION,\n  buildMajorBandsRankOrderProjectionSchema,\n  decodeMajorBandsRankOrderRow,\n  majorBandsRankValueMatchesRange\n} from '../functions/_lib/major-bands-static-provider.js';\n'''
          assert audit.count(import_anchor) == 1
          audit = audit.replace(import_anchor, import_patch, 1)
          map_anchor = '''const buckets = new Map();\nconst allRecords = [];\n'''
          map_patch = '''const buckets = new Map();\nconst projectedBuckets = new Map();\nconst allRecords = [];\nconst projectionSchema = buildMajorBandsRankOrderProjectionSchema(schema);\n'''
          assert audit.count(map_anchor) == 1
          audit = audit.replace(map_anchor, map_patch, 1)
          bucket_anchor = '''  const records = payload.rows.map(decodeRow);\n  buckets.set(bucket.file, records);\n  allRecords.push(...records);\n'''
          bucket_patch = '''  const records = payload.rows.map(decodeRow);\n  const projectedRecords = payload.rows.map(row => decodeMajorBandsRankOrderRow(row, projectionSchema));\n  buckets.set(bucket.file, records);\n  projectedBuckets.set(bucket.file, projectedRecords);\n  allRecords.push(...records);\n'''
          assert audit.count(bucket_anchor) == 1
          audit = audit.replace(bucket_anchor, bucket_patch, 1)
          helper_anchor = '''function selectedRecords(selected) {\n  return selected.flatMap(bucket => buckets.get(bucket.file) || []);\n}\n'''
          helper_patch = helper_anchor + '''\nfunction selectedProjectedRecords(selected) {\n  return selected.flatMap(bucket => projectedBuckets.get(bucket.file) || []);\n}\n'''
          assert audit.count(helper_anchor) == 1
          audit = audit.replace(helper_anchor, helper_patch, 1)
          summary_anchor = '''  rankRowFilterCases: 0,\n'''
          summary_patch = '''  orderProjectionVersion: MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n  orderProjectionCases: 0,\n  rankRowFilterCases: 0,\n'''
          assert audit.count(summary_anchor) == 1
          audit = audit.replace(summary_anchor, summary_patch, 1)
          band_anchor = '''      const filteredRecords = rawScopedRecords.filter(record => (\n        majorBandsRankValueMatchesRange(record.rank2026, query.windows[band])\n      ));\n'''
          band_patch = band_anchor + '''      const projectedFilteredRecords = selectedProjectedRecords(scoped.buckets).filter(record => (\n        majorBandsRankValueMatchesRange(record.rank2026, query.windows[band])\n      ));\n      const defaultOptions = {\n        candidateScore: score,\n        candidateRank: query.candidateRank,\n        rangePreset: preset,\n        region: 'all',\n        majorKeyword: '',\n        bottomLineMode: 'all',\n        specialProjectMode: 'hide_eligibility_projects',\n        schoolFilter: false,\n        acceptedSchoolNames: [],\n        requestedBand: band,\n        mutateSourceRecords: false\n      };\n      const fullOrder = processMajorBandsRankWindow(filteredRecords, defaultOptions).grouped[band].ordered.map(record => record.id);\n      const projectedOrder = processMajorBandsRankWindow(projectedFilteredRecords, defaultOptions).grouped[band].ordered.map(record => record.id);\n      assert.deepEqual(projectedOrder, fullOrder, `${score}/${preset}/${band}: minimal projection order`);\n      summary.orderProjectionCases += 1;\n'''
          assert audit.count(band_anchor) == 1
          audit = audit.replace(band_anchor, band_patch, 1)
          final_anchor = 'assert.equal(summary.kernelSetEqualQueries, summary.rankQueries);\n'
          final_patch = final_anchor + "assert.equal(summary.orderProjectionCases, 365 * presets.length * 3);\n"
          assert audit.count(final_anchor) == 1
          audit_path.write_text(audit.replace(final_anchor, final_patch, 1), encoding='utf-8')

          cache_audit_path = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          cache_audit = cache_audit_path.read_text(encoding='utf-8')
          req_anchor = "  'requestedBandOrderCacheBounded: execution.orderCacheState?.bounded !== false',\n"
          req_patch = req_anchor + "  'requestedBandOrderProjectionVersion: execution.value?.orderProjectionVersion',\n  'projection: minimalOrderProjection ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined',\n"
          assert cache_audit.count(req_anchor) == 1
          cache_audit_path.write_text(cache_audit.replace(req_anchor, req_patch, 1), encoding='utf-8')

          for workflow_path in [
              Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'),
              Path('.github/workflows/verify-production-api-health-v3971.yml')
          ]:
              workflow = workflow_path.read_text(encoding='utf-8')
              if '<<<"$body"' in workflow:
                  anchor = "              && grep -q '\"requestedBandOrderCacheVersion\":\"major-bands-requested-band-order-id-lru-v3990_0\"' <<<\"$body\" \\\n"
                  patch = anchor + "              && grep -q '\"requestedBandOrderProjectionVersion\":\"major-bands-rank-order-minimal-projection-v3990_0\"' <<<\"$body\" \\\n"
              else:
                  anchor = "              && grep -q '\"requestedBandOrderCacheVersion\":\"major-bands-requested-band-order-id-lru-v3990_0\"' <<<\"$api\" \\\n"
                  patch = anchor + "              && grep -q '\"requestedBandOrderProjectionVersion\":\"major-bands-rank-order-minimal-projection-v3990_0\"' <<<\"$api\" \\\n"
              assert workflow.count(anchor) == 1
              workflow_path.write_text(workflow.replace(anchor, patch, 1), encoding='utf-8')

          graph_path = Path('.github/workflows/verify-unified-resource-graph-v3972_6.yml')
          graph = graph_path.read_text(encoding='utf-8')
          smoke_anchor = '''          sleep 1\n          for path in \\\n'''
          smoke_patch = '''          ready=0\n          for attempt in $(seq 1 60); do\n            if curl --fail --silent --show-error 'http://127.0.0.1:8794/shared/resources/release/current-release.js' >/dev/null; then\n              ready=1\n              break\n            fi\n            sleep 0.2\n          done\n          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-0-resource-http.log; exit 1; fi\n          for path in \\\n'''
          assert graph.count(smoke_anchor) == 1
          graph_path.write_text(graph.replace(smoke_anchor, smoke_patch, 1), encoding='utf-8')
          PY

          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_0.js
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f, aliases: true) }"
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs

      - name: Verify default projection and full local pressure
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8801 --compatibility-date=2026-07-01 >/tmp/v3990-minimal-projection-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/v3990-minimal-projection-ready.json -w '%{http_code}' 'http://127.0.0.1:8801/api/major-bands?candidateScore=519&rangePreset=wide&band=steady&limit=37&offset=0' || true)"
            if [ "$status" = '200' ] && grep -q 'major-bands-rank-order-minimal-projection-v3990_0' /tmp/v3990-minimal-projection-ready.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-minimal-projection-ready.json || true; cat /tmp/v3990-minimal-projection-wrangler.log; exit 1; fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/v3990-minimal-projection-ready.json', 'utf8'));
          if (payload.source?.requestedBandOrderProjectionVersion !== 'major-bands-rank-order-minimal-projection-v3990_0') throw new Error('projection version');
          if (payload.source?.requestedBandOrderMinimalProjection !== true) throw new Error('minimal projection disabled');
          if (Number(payload.source?.requestedBandPageDecodedRecords || 0) > 37) throw new Error('page decode budget');
          if (payload.source?.requestedBandOrderCacheRetainsDecodedRows !== false) throw new Error('order cache retained decoded rows');
          NODE
          TARGET_BASE='http://127.0.0.1:8801' \
          CONCURRENCY_LEVELS='1,5,10,25,50' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='12000' \
          P95_LIMIT_MS='7000' \
          P99_LIMIT_MS='12000' \
          HARD_LIMIT_MS='20000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-minimal-projection-local-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs

      - name: Stage workflows and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-minimal-order-projection-v3990.yml' || true)
          test "${#workflows[@]}" -eq 3
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools
          git commit -m 'fix(rank): project minimal rows before cold ordering'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
