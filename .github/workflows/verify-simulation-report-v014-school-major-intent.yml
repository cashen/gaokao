name: Verify simulation report v014 school major intent
on:
  pull_request:
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/js/simulation-report-v014-school-major-intent.js'
      - 'ln-rank/css/simulation-report-v014-school-major-intent.css'
      - 'ln-rank/data/simulation-workbench-release-v014.json'
      - 'docs/plans/simulation-school-major-intent-v014.md'
      - 'tools/verify-simulation-report-v014-school-major-intent.mjs'
      - 'tools/browser-simulation-report-v014-school-major-intent.mjs'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/verify-simulation-report-v014-school-major-intent.mjs
  browser:
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: (node -e "const http=require('http'),fs=require('fs'),path=require('path');http.createServer((req,res)=>{let p=path.join(process.cwd(),decodeURIComponent(new URL(req.url,'http://127.0.0.1').pathname));if(!fs.existsSync(p)||fs.statSync(p).isDirectory())return res.writeHead(404).end();res.writeHead(200,{'content-type':p.endsWith('.js')?'text/javascript':p.endsWith('.json')?'application/json':'text/html'});fs.createReadStream(p).pipe(res)}).listen(4173,'127.0.0.1')" &) && node tools/browser-simulation-report-v014-school-major-intent.mjs
