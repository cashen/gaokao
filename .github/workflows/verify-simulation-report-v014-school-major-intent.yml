name: Verify simulation report v014 school major intent
on:
  pull_request:
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/js/simulation-report-v014-school-major-intent.js'
      - 'ln-rank/css/simulation-report-v014-school-major-intent.css'
      - 'ln-rank/data/simulation-workbench-release-v014.json'
      - 'docs/plans/simulation-school-major-intent-v014.md'
      - 'tools/verify-simulation-report-v014-school-major-intent.mjs'
      - 'tools/browser-simulation-report-v014-school-major-intent.mjs'
      - '.github/workflows/verify-simulation-report-v014-school-major-intent.yml'
  push:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/js/simulation-report-v014-school-major-intent.js'
      - 'ln-rank/css/simulation-report-v014-school-major-intent.css'
      - 'ln-rank/data/simulation-workbench-release-v014.json'
      - 'tools/verify-simulation-report-v014-school-major-intent.mjs'
      - 'tools/browser-simulation-report-v014-school-major-intent.mjs'
      - '.github/workflows/verify-simulation-report-v014-school-major-intent.yml'
  workflow_dispatch:
concurrency:
  group: simulation-report-v014-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-simulation-report-v014-school-major-intent.mjs
  browser:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gaokao-http.log 2>&1 &
      - run: node tools/browser-simulation-report-v014-school-major-intent.mjs
