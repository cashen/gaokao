name: PR137 platform upgrade prefilter

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - .github/workflows/pr137-platform-upgrade-prefilter.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical platform upgrade prefilter
        shell: bash
        run: |
          set -euo pipefail
          cat > functions/_lib/platform-upgrade-policy.js <<'EOF'
          import { resolveSchoolProfile } from '../../shared/resources/schools/school-profile-center.js';

          export const PLATFORM_UPGRADE_POLICY_VERSION = 'platform-upgrade-policy-v3990_1';
          const SCHOOL_TIER_CACHE_MAX = 1024;
          const schoolTierCache = new Map();

          function clean(value, max = 160) {
            return String(value == null ? '' : value).trim().slice(0, max);
          }

          export function normalizePlatformTarget(value = '') {
            const target = clean(value, 12);
            return target === '985' || target === '211' ? target : '';
          }

          export function isPlatformBudgetProject(record = {}) {
            const feeType = clean(record?.feeType, 40);
            return record?.isSinoForeign === true
              || record?.isHighFee === true
              || feeType === 'sino_foreign'
              || feeType === 'high_fee';
          }

          function schoolTier(record = {}) {
            const school = clean(record?.school || record?.schoolName, 160);
            if (!school) return Object.freeze({ is985: false, is211: false });
            const cached = schoolTierCache.get(school);
            if (cached) return cached;
            const profile = record?.schoolProfile || resolveSchoolProfile(school, record) || null;
            const tier = Object.freeze({
              is985: Boolean(profile?.is985),
              is211: Boolean(profile?.is211 || profile?.is985)
            });
            if (schoolTierCache.size >= SCHOOL_TIER_CACHE_MAX) {
              const oldest = schoolTierCache.keys().next().value;
              if (oldest !== undefined) schoolTierCache.delete(oldest);
            }
            schoolTierCache.set(school, tier);
            return tier;
          }

          export function matchesPlatformUpgradeRecord(record = {}, target = '') {
            const normalized = normalizePlatformTarget(target);
            if (!normalized) return true;
            if (!isPlatformBudgetProject(record)) return false;
            const tier = schoolTier(record);
            return normalized === '985' ? tier.is985 : tier.is211;
          }

          export function platformUpgradePolicyState() {
            return Object.freeze({
              version: PLATFORM_UPGRADE_POLICY_VERSION,
              schoolTierCacheEntries: schoolTierCache.size,
              schoolTierCacheMax: SCHOOL_TIER_CACHE_MAX,
              bounded: schoolTierCache.size <= SCHOOL_TIER_CACHE_MAX
            });
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              assert count == 1, f'{label}: {count}'
              p.write_text(s.replace(old, new), encoding='utf-8')

          # Static provider: projection fields + raw-row platform prefilter.
          p = Path('functions/_lib/major-bands-static-provider.js')
          s = p.read_text(encoding='utf-8')
          anchor = "import { matchRegionRule } from '../../shared/resources/geo/china-region-catalog.v3990_1.js';"
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + "\nimport { matchesPlatformUpgradeRecord, normalizePlatformTarget } from './platform-upgrade-policy.js';")
          s = s.replace("    feeType: index('feeType'),\n    tuition: index('tuition'),", "    feeType: index('feeType'),\n    isSinoForeign: index('isSinoForeign'),\n    isHighFee: index('isHighFee'),\n    tuition: index('tuition'),", 1)
          s = s.replace("    feeType: value('feeType'),\n    tuition: value('tuition'),", "    feeType: value('feeType'),\n    isSinoForeign: Boolean(value('isSinoForeign')),\n    isHighFee: Boolean(value('isHighFee')),\n    tuition: value('tuition'),", 1)
          insert_anchor = "export async function loadMajorBandsStaticRankBucket(request, bucketFile, options = {}) {"
          helper = """export function majorBandsStaticRowMatchesPlatformUpgrade(row = [], schema = [], target = '') {
            const normalized = normalizePlatformTarget(target);
            if (!normalized) return true;
            const index = name => schema.indexOf(name);
            const value = name => {
              const position = index(name);
              return position >= 0 ? row?.[position] : undefined;
            };
            return matchesPlatformUpgradeRecord({
              school: value('school'),
              feeType: value('feeType'),
              isSinoForeign: Boolean(value('isSinoForeign')),
              isHighFee: Boolean(value('isHighFee'))
            }, normalized);
          }

          """
          assert s.count(insert_anchor) == 1
          s = s.replace(insert_anchor, helper + insert_anchor)
          s = s.replace("  const cityIndex = schema.indexOf('city');\n  const predecodeRegion", "  const cityIndex = schema.indexOf('city');\n  const platformTarget = normalizePlatformTarget(options.platformTarget || '');\n  const predecodeRegion", 1)
          s = s.replace("  let regionMatchedCount = 0;\n  for (const row of payload.rows) {", "  let regionMatchedCount = 0;\n  let platformMatchedCount = 0;\n  for (const row of payload.rows) {", 1)
          s = s.replace("    regionMatchedCount += 1;\n    rows.push(row);", "    regionMatchedCount += 1;\n    if (!majorBandsStaticRowMatchesPlatformUpgrade(row, schema, platformTarget)) continue;\n    platformMatchedCount += 1;\n    rows.push(row);", 1)
          s = s.replace("    regionMatchedCount,\n    scanVersion:", "    regionMatchedCount,\n    platformMatchedCount,\n    scanVersion:", 1)
          s = s.replace("const selectedRows = scan.rows;", "const selectedRows = scan.rows;\n  const platformMatchedCount = Number.isFinite(Number(scan.platformMatchedCount))\n    ? Number(scan.platformMatchedCount)\n    : Number(scan.regionMatchedCount || 0);", 1)
          s = s.replace("    regionRowsSkipped: scan.rankMatchedCount - scan.regionMatchedCount,\n    predecodeRegion,", "    regionRowsSkipped: scan.rankMatchedCount - scan.regionMatchedCount,\n    platformRowsSkipped: scan.regionMatchedCount - platformMatchedCount,\n    platformTarget,\n    predecodeRegion,", 1)
          p.write_text(s, encoding='utf-8')

          # Bucket loader: platform target participates in pending-read identity and stats.
          p = Path('functions/_lib/major-bands-rank-bucket-loader.v3990_1.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  const predecodeRegion = String(options.predecodeRegion || 'all').trim() || 'all';\n  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}|${projection}|${rawRowStorage}|region:${predecodeRegion}`;", "  const predecodeRegion = String(options.predecodeRegion || 'all').trim() || 'all';\n  const platformTarget = String(options.platformTarget || '').trim() || 'all';\n  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}|${projection}|${rawRowStorage}|region:${predecodeRegion}|platform:${platformTarget}`;", 1)
          s = s.replace("    predecodeRegion: options.predecodeRegion,\n    projection:", "    predecodeRegion: options.predecodeRegion,\n    platformTarget: options.platformTarget,\n    projection:", 1)
          s = s.replace("        regionRowsSkipped: 0,\n        predecodeRegion:", "        regionRowsSkipped: 0,\n        platformRowsSkipped: 0,\n        platformTarget: String(options.platformTarget || '').trim(),\n        predecodeRegion:", 1)
          s = s.replace("  let regionRowsSkipped = 0;\n  let pageIdRowsSkipped = 0;", "  let regionRowsSkipped = 0;\n  let platformRowsSkipped = 0;\n  let pageIdRowsSkipped = 0;", 1)
          s = s.replace("    regionRowsSkipped += Number(result.loaded.regionRowsSkipped || 0);\n    pageIdRowsSkipped", "    regionRowsSkipped += Number(result.loaded.regionRowsSkipped || 0);\n    platformRowsSkipped += Number(result.loaded.platformRowsSkipped || 0);\n    pageIdRowsSkipped", 1)
          s = s.replace("      regionRowsSkipped,\n      predecodeRegion:", "      regionRowsSkipped,\n      platformRowsSkipped,\n      platformTarget: String(options.platformTarget || '').trim(),\n      predecodeRegion:", 1)
          p.write_text(s, encoding='utf-8')

          # Kernel: same canonical platform policy is the safety boundary even when predecode is bypassed.
          p = Path('functions/_lib/major-bands-rank-query-kernel.v3990_1.js')
          s = p.read_text(encoding='utf-8')
          import_anchor = "import { rankMajorBandsRecordsOnce } from './major-bands-result-order.v3990_1.js';"
          assert s.count(import_anchor) == 1
          s = s.replace(import_anchor, import_anchor + "\nimport { matchesPlatformUpgradeRecord, normalizePlatformTarget } from './platform-upgrade-policy.js';")
          s = s.replace("      bottomLineUnresolved: 0,\n      majorKeywordExcluded:", "      bottomLineUnresolved: 0,\n      platformTarget: '',\n      platformTargetExcluded: 0,\n      majorKeywordExcluded:", 1)
          s = s.replace("  const bottomLineMode = clean(options.bottomLineMode || 'all', 40);\n  const specialProjectMode", "  const bottomLineMode = clean(options.bottomLineMode || 'all', 40);\n  const platformTarget = normalizePlatformTarget(options.platformTarget || '');\n  const specialProjectMode", 1)
          s = s.replace("  let bottomLineUnresolved = 0;\n  let majorKeywordExcluded", "  let bottomLineUnresolved = 0;\n  let platformTargetExcluded = 0;\n  let majorKeywordExcluded", 1)
          s = s.replace("    if (!matchRegion(source, region)) return null;\n    canonicalCandidate += 1;", "    if (!matchRegion(source, region)) return null;\n    if (platformTarget && !matchesPlatformUpgradeRecord(source, platformTarget)) {\n      platformTargetExcluded += 1;\n      return null;\n    }\n    canonicalCandidate += 1;", 1)
          s = s.replace("      bottomLineUnresolved,\n      majorKeywordExcluded,", "      bottomLineUnresolved,\n      platformTarget,\n      platformTargetExcluded,\n      majorKeywordExcluded,", 1)
          p.write_text(s, encoding='utf-8')

          # AI tool adapter: platform target is delegated to major-bands and final preview reuses the same matcher.
          p = Path('functions/_lib/ai/tool-registry.js')
          s = p.read_text(encoding='utf-8')
          import_anchor = "} from './background-resource-adapter.js';"
          assert s.count(import_anchor) == 1
          s = s.replace(import_anchor, import_anchor + "\nimport { matchesPlatformUpgradeRecord, normalizePlatformTarget } from '../platform-upgrade-policy.js';")
          s = s.replace("if(params.schoolKeyword)url.searchParams.set('schoolKeyword',params.schoolKeyword);\n  url.searchParams.set('bottomLineMode'", "if(params.schoolKeyword)url.searchParams.set('schoolKeyword',params.schoolKeyword);if(params.platformTarget)url.searchParams.set('platformTarget',params.platformTarget);\n  url.searchParams.set('bottomLineMode'", 1)
          old_preview = "function platformUpgradePreview(records=[],target=''){\n  const tier=clean(target,12),matches=(records||[]).filter(record=>{const tierMatch=tier==='985'?record?.is985===true:(tier==='211'?record?.is211===true:false),budgetProject=record?.isSinoForeign===true||record?.isHighFee===true||['sino_foreign','high_fee'].includes(record?.feeType);return tierMatch&&budgetProject;});"
          new_preview = "function platformUpgradePreview(records=[],target=''){\n  const tier=normalizePlatformTarget(target),matches=(records||[]).filter(record=>matchesPlatformUpgradeRecord(record,tier));"
          assert s.count(old_preview) == 1, 'platform preview anchor'
          s = s.replace(old_preview, new_preview)
          old_params = "const params={score:numeric,rangePreset:'standard',region:executionRegion,majorKeyword:keyword,schoolKeyword,bottomLineMode,limit:16},executions=[];"
          new_params = "const normalizedPlatformTarget=normalizePlatformTarget(platformTarget),params={score:numeric,rangePreset:'standard',region:executionRegion,majorKeyword:keyword,schoolKeyword,bottomLineMode,platformTarget:normalizedPlatformTarget,limit:16},executions=[];"
          assert s.count(old_params) == 1, 'AI params anchor'
          s = s.replace(old_params, new_params)
          s = s.replace("if(platformTarget)merged.platformUpgrade=platformUpgradePreview(merged.records,platformTarget);", "if(normalizedPlatformTarget)merged.platformUpgrade=platformUpgradePreview(merged.records,normalizedPlatformTarget);", 1)
          p.write_text(s, encoding='utf-8')

          # major-bands API: parse target, isolate caches, pass to loader and kernel.
          p = Path('functions/api/major-bands.js')
          s = p.read_text(encoding='utf-8')
          import_anchor = "import { buildDisplayTags } from '../_lib/school-display-tags.js';"
          assert s.count(import_anchor) == 1
          s = s.replace(import_anchor, import_anchor + "\nimport { normalizePlatformTarget } from '../_lib/platform-upgrade-policy.js';")
          s = s.replace("    specialProjectMode: filters.specialProjectMode,\n    band", "    specialProjectMode: filters.specialProjectMode,\n    platformTarget: filters.platformTarget,\n    band", 1)
          s = s.replace("      specialProjectMode: normalizeSpecialProjectMode(url.searchParams.get('specialProjectMode') || 'hide_eligibility_projects')", "      specialProjectMode: normalizeSpecialProjectMode(url.searchParams.get('specialProjectMode') || 'hide_eligibility_projects'),\n      platformTarget: normalizePlatformTarget(url.searchParams.get('platformTarget') || '')", 1)
          # Every initial rank-window load that already has the canonical region receives the target prefilter.
          s = s.replace("predecodeRegion: filters.region,\n", "predecodeRegion: filters.region,\n        platformTarget: filters.platformTarget,\n")
          # Every kernel call in this API that carries the existing special-project filter also receives platform target.
          s = s.replace("specialProjectMode: filters.specialProjectMode,\n", "specialProjectMode: filters.specialProjectMode,\n        platformTarget: filters.platformTarget,\n")
          p.write_text(s, encoding='utf-8')

          # Projection verifier must cover the two direct budget booleans on all 11,628 rows.
          p = Path('tools/verify-major-bands-refinement-projection-v3990_1.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace("'nature','natureRaw','natureType','schoolNature','feeType',\n    'tuition'", "'nature','natureRaw','natureType','schoolNature','feeType','isSinoForeign','isHighFee',\n    'tuition'", 1)
          p.write_text(s, encoding='utf-8')

          # The main rank audit permanently owns the new platform verifier.
          p = Path('tools/audit-major-bands-rank-kernel-v3990_1.mjs')
          s = p.read_text(encoding='utf-8')
          anchor = "import './verify-major-bands-refinement-projection-v3990_1.mjs';"
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + "\nimport './verify-major-bands-platform-upgrade-v3990_1.mjs';")
          p.write_text(s, encoding='utf-8')
          PY

          cat > tools/verify-major-bands-platform-upgrade-v3990_1.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {
            buildMajorBandsRankOrderProjectionSchema,
            decodeMajorBandsRankOrderRow,
            decodeMajorBandsStaticRow,
            majorBandsStaticRowMatchesPlatformUpgrade
          } from '../functions/_lib/major-bands-static-provider.js';
          import { buildDisplayTags } from '../functions/_lib/school-display-tags.js';
          import {
            matchesPlatformUpgradeRecord,
            normalizePlatformTarget,
            platformUpgradePolicyState
          } from '../functions/_lib/platform-upgrade-policy.js';
          import { processMajorBandsRankWindow } from '../functions/_lib/major-bands-rank-query-kernel.v3990_1.js';
          import { lookupLn2026PhysicsScore } from '../functions/_lib/ln-2026-physics-score-rank.js';

          const manifest = JSON.parse(fs.readFileSync('ln-rank/data/major-bands-static-v3972_2/manifest.json', 'utf8'));
          const schema = manifest.recordSchema;
          const projectionSchema = buildMajorBandsRankOrderProjectionSchema(schema);
          const full = [];
          const projected = [];
          let checkedRows = 0;
          for (const bucket of manifest.buckets) {
            const payload = JSON.parse(fs.readFileSync(bucket.file.replace(/^\//, ''), 'utf8'));
            for (const row of payload.rows) {
              const record = decodeMajorBandsStaticRow(row, schema);
              const light = decodeMajorBandsRankOrderRow(row, projectionSchema, { rawRowStorage: 'array-reference' });
              assert.equal(light.isSinoForeign, Boolean(record.isSinoForeign), `${record.id}: sino projection`);
              assert.equal(light.isHighFee, Boolean(record.isHighFee), `${record.id}: high-fee projection`);
              const tagged = { ...record, ...buildDisplayTags(record) };
              for (const target of ['985', '211']) {
                const oldSemantics = (target === '985' ? tagged.is985 === true : tagged.is211 === true)
                  && (tagged.isSinoForeign === true || tagged.isHighFee === true || ['sino_foreign', 'high_fee'].includes(tagged.feeType));
                assert.equal(matchesPlatformUpgradeRecord(record, target), oldSemantics, `${record.id}/${target}: policy truth`);
                assert.equal(majorBandsStaticRowMatchesPlatformUpgrade(row, schema, target), oldSemantics, `${record.id}/${target}: raw-row truth`);
                assert.equal(matchesPlatformUpgradeRecord(light, target), oldSemantics, `${record.id}/${target}: projection truth`);
              }
              full.push(record);
              projected.push(light);
              checkedRows += 1;
            }
          }
          assert.equal(checkedRows, 11628, 'platform verifier must cover every static record');
          assert.equal(normalizePlatformTarget('985'), '985');
          assert.equal(normalizePlatformTarget('211'), '211');
          assert.equal(normalizePlatformTarget('双一流'), '');

          const cases = [];
          for (const score of [580, 620]) {
            const rank = lookupLn2026PhysicsScore(score);
            assert.ok(rank?.rankForGap, `${score}: rank missing`);
            for (const target of ['211', '985']) {
              for (const region of ['all', 'province:辽宁']) {
                for (const bottomLineMode of ['all', 'public_include_sino']) {
                  for (const band of ['upper', 'near', 'steady']) {
                    const options = {
                      candidateScore: score,
                      candidateRank: rank,
                      rangePreset: 'standard',
                      region,
                      majorKeyword: '',
                      bottomLineMode,
                      specialProjectMode: 'hide_eligibility_projects',
                      requestedBand: band,
                      mutateSourceRecords: false
                    };
                    const manualSource = full.filter(record => matchesPlatformUpgradeRecord(record, target));
                    const expected = processMajorBandsRankWindow(manualSource, options);
                    const actual = processMajorBandsRankWindow(projected, { ...options, platformTarget: target });
                    assert.deepEqual(
                      actual.grouped[band].ordered.map(record => record.id),
                      expected.grouped[band].ordered.map(record => record.id),
                      `${score}/${target}/${region}/${bottomLineMode}/${band}: ordered truth`
                    );
                    assert.equal(actual.grouped[band].count, expected.grouped[band].count, `${score}/${target}/${region}/${bottomLineMode}/${band}: count`);
                    cases.push(`${score}/${target}/${region}/${bottomLineMode}/${band}`);
                  }
                }
              }
            }
          }

          const api = fs.readFileSync('functions/api/major-bands.js', 'utf8');
          const tools = fs.readFileSync('functions/_lib/ai/tool-registry.js', 'utf8');
          assert.ok(api.includes("platformTarget: normalizePlatformTarget(url.searchParams.get('platformTarget') || '')"), 'major-bands must parse platformTarget');
          assert.ok(api.includes('platformTarget: filters.platformTarget'), 'platformTarget must enter query identity/kernel calls');
          assert.ok(tools.includes("url.searchParams.set('platformTarget',params.platformTarget)"), 'AI bridge must delegate platformTarget');
          assert.ok(tools.includes('matchesPlatformUpgradeRecord(record,tier)'), 'AI preview must share platform policy');
          const state = platformUpgradePolicyState();
          assert.equal(state.bounded, true, 'school tier cache must remain bounded');
          console.log(JSON.stringify({ version: 'major-bands-platform-upgrade-v3990_1', checkedRows, cases: cases.length, policyState: state, status: 'ok' }, null, 2));
          EOF

          node --check functions/_lib/platform-upgrade-policy.js
          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_1.js
          node --check functions/_lib/major-bands-rank-query-kernel.v3990_1.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-platform-upgrade-v3990_1.mjs
          node tools/verify-major-bands-platform-upgrade-v3990_1.mjs
          node tools/verify-major-bands-refinement-projection-v3990_1.mjs
          node tools/verify-major-bands-predecode-region-v3990_1.mjs
          node tools/audit-major-bands-request-band-scope-v3990_0.mjs
          git diff --check
      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr137-platform-upgrade-prefilter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/_lib/platform-upgrade-policy.js functions/_lib/major-bands-static-provider.js functions/_lib/major-bands-rank-bucket-loader.v3990_1.js functions/_lib/major-bands-rank-query-kernel.v3990_1.js functions/_lib/ai/tool-registry.js functions/api/major-bands.js tools/verify-major-bands-refinement-projection-v3990_1.mjs tools/verify-major-bands-platform-upgrade-v3990_1.mjs tools/audit-major-bands-rank-kernel-v3990_1.mjs .github/workflows/pr137-platform-upgrade-prefilter.yml
          git commit -m "perf: prefilter platform upgrade candidates"
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
