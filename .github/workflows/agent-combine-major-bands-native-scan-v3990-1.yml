name: Temporary major-bands native-scan integration v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-combine-major-bands-native-scan-v3990-1.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire native-scan verifier into source audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/audit-major-bands-rank-kernel-v3990_1.mjs')
          text = path.read_text()
          marker = "import assert from 'node:assert/strict';\n"
          addition = "import './verify-major-bands-rank-native-scan-v3990_1.mjs';\n"
          if text.count(marker) != 1:
              raise SystemExit(f'audit import marker count={text.count(marker)}')
          if addition not in text:
              text = text.replace(marker, marker + addition, 1)
          path.write_text(text)
          PY
          git diff --check
          node --check tools/audit-major-bands-rank-kernel-v3990_1.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_1.mjs >/tmp/native-audit.log
          grep -q '"fullTruthEqual": true' /tmp/native-audit.log
          grep -q '"selectiveTruthEqual": true' /tmp/native-audit.log
          git diff -- tools/audit-major-bands-rank-kernel-v3990_1.mjs
      - name: Commit audit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/audit-major-bands-rank-kernel-v3990_1.mjs
          git commit -m "test: gate native rank-row scan truth in source audit"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
