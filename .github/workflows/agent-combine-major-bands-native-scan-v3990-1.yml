name: Temporary major-bands native-scan integration v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-combine-major-bands-native-scan-v3990-1.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate native rank-row scan and semantic audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin e34d1001160f27c2e431b4743e304ceefb72d38f
          git show e34d1001160f27c2e431b4743e304ceefb72d38f:functions/_lib/major-bands-static-provider.js > functions/_lib/major-bands-static-provider.js
          git show e34d1001160f27c2e431b4743e304ceefb72d38f:tools/verify-major-bands-rank-native-scan-v3990_1.mjs > tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          python - <<'PY'
          from pathlib import Path

          audit = Path('tools/audit-major-bands-rank-kernel-v3990_1.mjs')
          text = audit.read_text()
          old = '''for (const required of [
            "MAJOR_BANDS_RANK_ROW_FILTER_VERSION = 'major-bands-rank-row-filter-v3990_1'",
            "const rankIndex = schema.indexOf('rank2026')",
            'payload.rows.filter(row => majorBandsRankValueMatchesRange',
            'rankRowsSkipped: payload.rows.length - selectedRows.length'
          ]) assert.ok(staticProviderSource.includes(required), `predecode rank-row filter missing ${required}`);'''
          new = '''for (const required of [
            "MAJOR_BANDS_RANK_ROW_FILTER_VERSION = 'major-bands-rank-row-filter-v3990_1'",
            "MAJOR_BANDS_RANK_ROW_NATIVE_SCAN_VERSION = 'major-bands-rank-row-native-scan-v3990_1'",
            'scanMajorBandsStaticRankRowsText',
            'majorBandsRankValueMatchesRange(row?.[rankIndex], rankRange)',
            "mode: 'native-row-text-scan'"
          ]) assert.ok(staticProviderSource.includes(required), `predecode native rank-row filter missing ${required}`);'''
          if text.count(old) != 1:
              raise SystemExit('static provider audit block not found exactly once')
          audit.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml')
          yml = workflow.read_text()
          check_anchor = '''            tools/build-major-bands-rank-index-v3990_1.mjs \\
            tools/verify-major-bands-preview-concurrency-v3990_1.mjs \\'''
          check_replacement = '''            tools/build-major-bands-rank-index-v3990_1.mjs \\
            tools/verify-major-bands-rank-native-scan-v3990_1.mjs \\
            tools/verify-major-bands-preview-concurrency-v3990_1.mjs \\'''
          run_anchor = '''          node tools/build-major-bands-rank-index-v3990_1.mjs
          git diff --exit-code -- functions/_lib/major-bands-rank-index.v3990_1.js'''
          run_replacement = '''          node tools/build-major-bands-rank-index-v3990_1.mjs
          node --experimental-default-type=module tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          git diff --exit-code -- functions/_lib/major-bands-rank-index.v3990_1.js'''
          if yml.count(check_anchor) != 1:
              raise SystemExit(f'workflow syntax-list anchor count={yml.count(check_anchor)}')
          if yml.count(run_anchor) != 1:
              raise SystemExit(f'workflow run anchor count={yml.count(run_anchor)}')
          yml = yml.replace(check_anchor, check_replacement, 1).replace(run_anchor, run_replacement, 1)
          workflow.write_text(yml)
          PY
          git diff --check
          node --check functions/_lib/major-bands-static-provider.js
          node --check tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node --check tools/audit-major-bands-rank-kernel-v3990_1.mjs
          node --experimental-default-type=module tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          git diff -- functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs tools/audit-major-bands-rank-kernel-v3990_1.mjs .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml
      - name: Commit product integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs tools/audit-major-bands-rank-kernel-v3990_1.mjs .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml
          git commit -m "perf: reduce major-bands cold rank-row object peak"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
