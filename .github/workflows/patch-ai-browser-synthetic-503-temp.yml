name: Patch AI browser synthetic 503 temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-ai-browser-synthetic-503-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch synthetic 503 browser gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/browser-ai-workspace-v3990_1.mjs')
          t=p.read_text()
          old="""async function transientMajorBandsRecovery(page,name){
            if(name!=='pc')return;
            await reset(page);let injected=false;
            await page.route('**/api/major-bands**',async route=>{if(!injected){injected=true;await route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({ok:false,message:'synthetic transient 503'})});return;}await route.continue();});
            try{const data=await submitTurn(page,'500分，辽宁省内先看能上的学校',{candidates:true});assert(injected,`${name}: transient 503 was not injected`);assert(data.result?.candidates?.ok===true,`${name}: deterministic bridge did not recover after transient 503`);}finally{await page.unroute('**/api/major-bands**');}
          }"""
          new="""async function transientMajorBandsRecovery(page,name){
            if(name!=='pc')return;
            await reset(page);let injected=false;page.__expectedSyntheticMajorBands503Count=0;
            await page.route('**/api/major-bands**',async route=>{if(!injected){injected=true;page.__expectedSyntheticMajorBands503Count=1;await route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({ok:false,message:'synthetic transient 503'})});return;}await route.continue();});
            try{const data=await submitTurn(page,'500分，辽宁省内先看能上的学校',{candidates:true});await page.waitForTimeout(150);assert(injected,`${name}: transient 503 was not injected`);assert(page.__expectedSyntheticMajorBands503Count===0,`${name}: synthetic 503 console evidence was not observed exactly once`);assert(data.result?.candidates?.ok===true,`${name}: deterministic bridge did not recover after transient 503`);}finally{page.__expectedSyntheticMajorBands503Count=0;await page.unroute('**/api/major-bands**');}
          }"""
          if old not in t: raise SystemExit('transient recovery anchor changed')
          t=t.replace(old,new)
          old="""for(const device of devices){const context=await browser.newContext({viewport:device.viewport,isMobile:Boolean(device.isMobile),hasTouch:Boolean(device.hasTouch),locale:'zh-CN'});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`);});try{"""
          new="""for(const device of devices){const context=await browser.newContext({viewport:device.viewport,isMobile:Boolean(device.isMobile),hasTouch:Boolean(device.hasTouch),locale:'zh-CN'});const page=await context.newPage();const errors=[];page.__expectedSyntheticMajorBands503Count=0;page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));page.on('console',m=>{if(m.type()!=='error')return;const text=m.text();if(page.__expectedSyntheticMajorBands503Count>0&&/Failed to load resource:.*status of 503/.test(text)){page.__expectedSyntheticMajorBands503Count-=1;return;}errors.push(`console:${text}`);});try{"""
          if old not in t: raise SystemExit('browser error collector anchor changed')
          p.write_text(t.replace(old,new))
          PY
          node --check tools/browser-ai-workspace-v3990_1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/browser-ai-workspace-v3990_1.mjs
          git commit -m 'test: isolate synthetic 503 browser evidence'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
