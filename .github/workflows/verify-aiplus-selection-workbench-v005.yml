name: Verify AIPLuS selection workbench v0.05

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'aiplus/**'
      - 'shared/ai/**'
      - 'ln-rank/js/feature/selection-pool/**'
      - 'tools/verify-aiplus-selection-workbench-v005.mjs'
      - 'tools/browser-aiplus-selection-workbench-v005.mjs'
      - 'docs/architecture/AIPLUS-SELECTION-DIAGNOSIS-STATUS.md'
      - 'docs/architecture/START-HERE.md'
      - '.github/workflows/verify-aiplus-selection-workbench-v005.yml'
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Selection workbench ownership and syntax
        run: |
          set -euo pipefail
          node --check aiplus/selection-workbench.v005.js
          node --check tools/verify-aiplus-selection-workbench-v005.mjs
          node --check tools/browser-aiplus-selection-workbench-v005.mjs
          node tools/verify-aiplus-selection-workbench-v005.mjs
      - name: Preserve AIPLuS decision and architecture contracts
        run: |
          set -euo pipefail
          node tools/verify-aiplus-family-decision-workbench-v003.mjs
          node tools/verify-ai-workspace-v3990_2.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-aiplus-aek-v001.mjs
          node tools/audit-aiplus-v002-ui.mjs
          node tools/audit-architecture-handoff-v3990_2.mjs
      - name: Protected boundaries
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test -n "$GITHUB_BASE_REF"
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            if [ "$(git ls-tree -r "origin/${GITHUB_BASE_REF}" | wc -l)" -ge 100 ]; then git diff --exit-code "origin/${GITHUB_BASE_REF}"...HEAD -- fenxi functions/fenxi functions/_middleware.js; fi
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            before="$PUSH_BEFORE"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then before="$(git rev-parse HEAD^1)"; fi
            git cat-file -e "${before}^{commit}"
            test "$(git rev-parse HEAD)" = "$PUSH_SHA"
            if [ "$(git ls-tree -r "$before" | wc -l)" -ge 100 ]; then git diff --exit-code "${before}..HEAD" -- fenxi functions/fenxi functions/_middleware.js; fi
          else
            exit 2
          fi
          grep -q 'LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'RELEASE_CONTRACT' functions/_lib/release-contract.js

  browser-combined:
    if: github.event_name == 'pull_request'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify local PC Pad Android selection journeys
        run: node tools/browser-aiplus-selection-workbench-v005.mjs
      - name: Re-run existing family workbench browser regression
        run: node tools/browser-aiplus-v002-mocked.mjs
      - name: Resolve exact-head Cloudflare Preview
        id: resolve-preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          immutable_preview=''
          short_sha="${EXPECTED_SHA:0:7}"
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            summary="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].output.summary // empty' <<<"$checks" 2>/dev/null || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then exit 2; fi
            if [ "$conclusion" = success ]; then
              grep -q "$short_sha" <<<"$summary"
              immutable_preview="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$summary" | head -n1 || true)"
              if [ -n "$immutable_preview" ]; then break; fi
            fi
            sleep 8
          done
          test -n "$immutable_preview"
          echo "preview_base=$immutable_preview" >> "$GITHUB_OUTPUT"
          echo "Exact selection Preview: $immutable_preview"
      - name: Verify exact Preview PC Pad Android
        env:
          AIPLUS_SELECTION_BASE: ${{ steps.resolve-preview.outputs.preview_base }}
        run: node tools/browser-aiplus-selection-workbench-v005.mjs

  browser-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.sha }}
      AIPLUS_SELECTION_BASE: https://gaokao-4y9.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for coherent exact-main Production graph
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          selection_js_path='/aiplus/selection-workbench.v005.js?v=005_0&fdw=003_0'
          selection_css_path='/aiplus/selection-workbench.v005.css?v=005_0&fdw=003_0'
          for attempt in $(seq 1 70); do
            cache_bust="selection-production=${EXPECTED_SHA}-${attempt}"
            page="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${AIPLUS_SELECTION_BASE}/aiplus/?${cache_bust}" || true)"
            health="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${AIPLUS_SELECTION_BASE}/api/ai/health?${cache_bust}" || true)"
            selection_js="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${AIPLUS_SELECTION_BASE}${selection_js_path}&${cache_bust}" || true)"
            selection_css="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${AIPLUS_SELECTION_BASE}${selection_css_path}&${cache_bust}" || true)"
            if grep -Fq 'data-ai-selection-workbench="aiplus-selection-workbench-v0.05"' <<<"$page" \
              && grep -Fq "src=\"${selection_js_path}\"" <<<"$page" \
              && grep -Fq "href=\"${selection_css_path}\"" <<<"$page" \
              && grep -Fq "\"commitSha\":\"${EXPECTED_SHA}\"" <<<"$health" \
              && grep -Fq '"release":"v3.9.90.2"' <<<"$health" \
              && grep -Fq "AIPLUS_SELECTION_WORKBENCH_VERSION = 'aiplus-selection-workbench-v0.05'" <<<"$selection_js" \
              && grep -Fq 'mountSelectionWorkbench' <<<"$selection_js" \
              && grep -Fq '.selection-workbench{display:grid' <<<"$selection_css" \
              && grep -Fq '.selection-diagnosis-grid{display:grid;grid-template-columns:1fr' <<<"$selection_css"; then
              ready=1
              break
            fi
            sleep 8
          done
          test "$ready" -eq 1
      - name: Verify Production PC Pad Android
        run: node tools/browser-aiplus-selection-workbench-v005.mjs

  publish-production-status:
    if: always() && github.event_name == 'push'
    needs: [source-contract, browser-production]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish durable Selection Workbench production status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          BROWSER_RESULT: ${{ needs.browser-production.result }}
          STATUS_CONTEXT: production/aiplus-selection-workbench-v0.05
        run: |
          set -euo pipefail
          state='failure'
          description='AIPLuS Selection Workbench production verification failed'
          if [ "$SOURCE_RESULT" = 'success' ] && [ "$BROWSER_RESULT" = 'success' ]; then
            state='success'
            description='AIPLuS Selection Workbench coherent graph and PC/Pad/Android passed'
          fi
          payload="$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3],target_url:process.argv[4]}))' \
            "$state" "$STATUS_CONTEXT" "$description" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/tmp/aiplus-selection-production-status.json
          cat /tmp/aiplus-selection-production-status.json
          test "$state" = 'success'
