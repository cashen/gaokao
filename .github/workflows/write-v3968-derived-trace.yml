name: Write v3968 derived asset trace

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  write:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify trace
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3968.mjs --write
          node tools/build-derived-asset-trace-v3968.mjs
          node tools/audit-derived-assets-v3968.mjs
          git diff --check
      - name: Commit trace
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/governance/derived-asset-trace.v3968_0.json
          git commit -m 'v3.9.68.0：固定统一背景资产派生哈希'
          git push origin HEAD:${{ github.head_ref }}
