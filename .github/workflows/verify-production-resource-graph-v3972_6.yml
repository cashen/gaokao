name: Verify production resource graph v3972.6

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/site-runtime-contract.v3972_6.js'
      - 'shared/resources/release/runtime-cache-contract.v3972_6.js'
      - 'shared/resources/resource-registry.js'
      - 'shared/ui/ui-resource-registry.v3972_6.js'
      - 'shared/ui/interaction/interaction-transaction.v3972_6.js'
      - 'shared/ui/interaction/interaction-transaction.v3972_6.css'
      - 'shared/governance/resource-execution-contract.v3972_6.js'
      - 'shared/governance/production-resource-verification-contract.v3972_6.js'
      - 'ln-rank/index.html'
      - 'ln-rank/site-active-generation.v3972_6.json'
      - 'ln-rank/self-check.html'
      - 'ln-rank/js/self-check.v3972_6.js'
      - 'ln-rank/js/app.v3972_6.js'
      - 'ln-rank/js/app-runtime.v3972_6.js'
      - 'ln-rank/js/workspace/selection-workspace-orchestrator.v3972_6.js'
      - 'tools/audit-production-resource-verification-v3972_6.mjs'
      - 'tools/verify-production-resource-graph-v3972_6.mjs'
      - '.github/workflows/verify-production-resource-graph-v3972_6.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify protected paths and source syntax
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git diff --name-only "$base" HEAD | tee /tmp/v3972-6-production-files.txt
            if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3972-6-production-files.txt; then exit 1; fi
          fi
          node --check shared/governance/production-resource-verification-contract.v3972_6.js
          node --check tools/audit-production-resource-verification-v3972_6.mjs
          node --check tools/verify-production-resource-graph-v3972_6.mjs

      - name: Verify production resource contract and canonical graph
        run: |
          set -euo pipefail
          node tools/audit-production-resource-verification-v3972_6.mjs | tee /tmp/v3972-6-production-contract.out
          node tools/audit-unified-resource-graph-v3972_6.mjs | tee /tmp/v3972-6-production-resource.out
          node tools/audit-site-runtime-generation-v3972_6.mjs | tee /tmp/v3972-6-production-runtime.out
          node tools/audit-canonical-release-version-v3972_6.mjs | tee /tmp/v3972-6-production-canonical.out

      - name: Exercise verifier against local source graph
        env:
          PAGES_BASE: http://127.0.0.1:8795
          CUSTOM_BASE: http://127.0.0.1:8795
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          VERIFY_RUNTIME_HEALTH: 'false'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3972-6-production-local.json
        run: |
          set -euo pipefail
          python3 -m http.server 8795 --bind 127.0.0.1 >/tmp/v3972-6-production-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              'http://127.0.0.1:8795/shared/resources/release/current-release.js' >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/v3972-6-production-http.log
            exit 1
          fi
          node tools/verify-production-resource-graph-v3972_6.mjs

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3972-6-production-resource-source
          path: /tmp/v3972-6-production-*
          if-no-files-found: warn
          retention-days: 7

  production-graph:
    if: github.event_name != 'pull_request'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Pages and custom-domain production resource graph
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          RELEASE_SHA: ${{ github.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '42'
          PRODUCTION_RESOURCE_WAIT_MS: '20000'
          VERIFY_RUNTIME_HEALTH: 'true'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3972-6-production-resource-graph.json
        run: |
          set -euo pipefail
          node tools/verify-production-resource-graph-v3972_6.mjs

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3972-6-production-resource-graph
          path: /tmp/v3972-6-production-resource-graph.json
          if-no-files-found: warn
          retention-days: 7

  publish-production-status:
    if: always() && github.event_name == 'push'
    needs: [source-contract, production-graph]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Publish durable production verification status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          PRODUCTION_RESULT: ${{ needs.production-graph.result }}
          STATUS_CONTEXT: production/resource-graph-v3972.6
        run: |
          set -euo pipefail
          state='failure'
          description='Production resource graph verification failed'
          if [ "$SOURCE_RESULT" = 'success' ] && [ "$PRODUCTION_RESULT" = 'success' ]; then
            state='success'
            description='Production v3972.6 interaction/resource graph checks passed'
          fi
          payload="$(node -e 'console.log(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3],target_url:process.argv[4]}))' \
            "$state" "$STATUS_CONTEXT" "$description" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload" >/tmp/v3972-6-production-status.json
          cat /tmp/v3972-6-production-status.json
          test "$state" = 'success'
