name: Agent v3965 release sync

on:
  push:
    branches:
      - agent/v3965-release-surface-ownership

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3965-release-surface-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate release ownership outputs
        run: node tools/fix-home-version-ownership-v3965.mjs
      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "Release outputs already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ln-rank tongxue zy2026.html zy2026 shared _headers
          git commit -m "同步 v3.9.65.0 全站发布生成结果"
          git push origin HEAD:agent/v3965-release-surface-ownership
