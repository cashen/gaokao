name: Verify AI decision workspace v3990_1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'ai/**'
      - 'shared/ai/**'
      - 'shared/resources/geo/china-region-catalog.v3990_1.js'
      - 'functions/api/ai/**'
      - 'functions/_lib/ai/**'
      - 'functions/_lib/major-filter.v3990_1.js'
      - 'tools/verify-ai-workspace-v3990_1.mjs'
      - 'tools/browser-ai-workspace-v3990_1.mjs'
      - '.github/workflows/verify-ai-workspace-v3990_1.yml'
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - 'shared/ai/**'
      - 'shared/resources/geo/china-region-catalog.v3990_1.js'
      - 'functions/api/ai/**'
      - 'functions/_lib/ai/**'
      - 'functions/_lib/major-filter.v3990_1.js'
      - 'tools/verify-ai-workspace-v3990_1.mjs'
      - 'tools/browser-ai-workspace-v3990_1.mjs'
      - '.github/workflows/verify-ai-workspace-v3990_1.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      runtime_changed: ${{ steps.change-scope.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce protected paths on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1 || true
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | tee /tmp/ai-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/ai-files.txt; then
            echo 'Protected path touched by AI workspace change.' >&2
            exit 1
          fi
      - name: Detect AI runtime changes
        id: change-scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/ai-files.txt
          if grep -E '^(ai/|shared/ai/|shared/resources/geo/china-region-catalog\.v3990_1\.js$|functions/api/ai/|functions/_lib/ai/|functions/_lib/major-filter\.v3990_1\.js$|tools/browser-ai-workspace-v3990_1\.mjs$)' /tmp/ai-files.txt; then
            echo 'runtime_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'runtime_changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify unified release identity and protected exports
        shell: bash
        run: |
          set -euo pipefail
          grep -q "display: 'v3.9.90.1'" shared/resources/release/current-release.js
          grep -q "siteRuntimeGeneration: 'v3990_1'" shared/resources/release/current-release.js
          grep -q 'data-release="v3.9.90.1"' ai/index.html
          grep -q 'data-site-runtime-generation="v3990_1"' ai/index.html
          grep -q 'LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'RELEASE_CONTRACT' functions/_lib/release-contract.js
      - name: Syntax check AI semantic runtime
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-contract.v3990_1.js
          node --check functions/_lib/ai/provider-router.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/evidence-registry.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/selection-review.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/api/ai/turn.js
          node --check functions/api/ai/health.js
          node --check functions/api/ai/model-probe.js
          node --check ai/app.v3990_1.js
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node --check tools/browser-ai-workspace-v3990_1.mjs
      - name: Run deterministic semantic workspace gates
        run: node tools/verify-ai-workspace-v3990_1.mjs

  preview-smoke:
    if: github.event_name == 'pull_request' && needs.source-contract.outputs.runtime_changed == 'true'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      preview_base: ${{ steps.resolve-preview.outputs.preview_base }}
      immutable_preview: ${{ steps.resolve-preview.outputs.immutable_preview }}
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Resolve exact-SHA Cloudflare Check and branch Functions preview
        id: resolve-preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch_preview=''
          immutable_preview=''
          short_sha="${EXPECTED_SHA:0:7}"
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            summary="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].output.summary // empty' <<<"$checks" 2>/dev/null || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then
              echo "Cloudflare exact-SHA Check failed for ${EXPECTED_SHA}." >&2
              exit 2
            fi
            if [ "$conclusion" = success ]; then
              immutable_preview="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$summary" | head -n1 || true)"
              comments="$(curl -fsSL --max-time 20 \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"
              cloudflare_body="$(jq -r '[.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]")][-1].body // empty' <<<"$comments" 2>/dev/null || true)"
              if grep -q "$short_sha" <<<"$cloudflare_body"; then
                branch_preview="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$cloudflare_body" | tail -n1 || true)"
              fi
              if [ -n "$immutable_preview" ] && [ -n "$branch_preview" ]; then
                break
              fi
            fi
            sleep 8
          done
          test -n "$immutable_preview"
          test -n "$branch_preview"
          if [ "$immutable_preview" = "$branch_preview" ]; then
            echo 'Cloudflare branch preview was not resolved separately from immutable deployment URL.' >&2
            exit 3
          fi
          echo "immutable_preview=$immutable_preview" >> "$GITHUB_OUTPUT"
          echo "preview_base=$branch_preview" >> "$GITHUB_OUTPUT"
          echo "Exact deployment: $immutable_preview"
          echo "Functions branch preview: $branch_preview"
      - name: Verify branch Preview serves exact head SHA and semantic API
        env:
          PREVIEW_BASE: ${{ steps.resolve-preview.outputs.preview_base }}
          IMMUTABLE_PREVIEW: ${{ steps.resolve-preview.outputs.immutable_preview }}
        shell: bash
        run: |
          set -euo pipefail

          request_get() {
            local label="$1" url="$2" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -o "$body" -w '%{http_code}' "$url" || true)"
            if [ "$status" != 200 ]; then
              echo "${label} failed: HTTP ${status} ${url}" >&2
              head -c 1200 "$body" >&2 || true
              echo >&2
              rm -f "$body"
              return 1
            fi
            cat "$body"
            rm -f "$body"
          }

          request_post() {
            local label="$1" url="$2" payload="$3" body status
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 80 \
              -H 'Content-Type: application/json' -H 'Cache-Control: no-cache' \
              -X POST -o "$body" -w '%{http_code}' "$url" --data "$payload" || true)"
            if [ "$status" != 200 ]; then
              echo "${label} failed: HTTP ${status} ${url}" >&2
              head -c 1600 "$body" >&2 || true
              echo >&2
              rm -f "$body"
              return 1
            fi
            cat "$body"
            rm -f "$body"
          }

          health=''
          ready=0
          for attempt in $(seq 1 60); do
            health="$(request_get health "${PREVIEW_BASE}/api/ai/health?candidate=${EXPECTED_SHA}-${attempt}" || true)"
            if grep -q "\"commitSha\":\"${EXPECTED_SHA}\"" <<<"$health" \
              && grep -q '"apiVersion":"ai-health-api-v3990_1"' <<<"$health" \
              && grep -q '"semanticMode":"command-active-view-history-v3990_1"' <<<"$health"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Branch Preview never exposed exact head ${EXPECTED_SHA}. Immutable deployment was ${IMMUTABLE_PREVIEW}." >&2
            exit 4
          fi

          page="$(request_get ai-page "${PREVIEW_BASE}/ai/?candidate=${EXPECTED_SHA}")"
          grep -q 'data-ai-workspace="ai-workspace-v3990_1"' <<<"$page"
          grep -q 'data-site-runtime-generation="v3990_1"' <<<"$page"

          rank_payload='{"workspace":{"contractVersion":"ai-workspace-contract-v3990_1","examContext":{},"activeView":{"regionKeys":["all"],"majorKeywords":[]},"viewHistory":[],"tasks":[],"hardConstraints":[],"softPreferences":[]},"input":"600分位次是多少"}'
          rank="$(request_post rank "${PREVIEW_BASE}/api/ai/turn?candidate=${EXPECTED_SHA}" "$rank_payload")"
          grep -q '"rankEnd":14235' <<<"$rank"

          province_payload='{"workspace":{"contractVersion":"ai-workspace-contract-v3990_1","examContext":{},"activeView":{"regionKeys":["all"],"majorKeywords":[]},"viewHistory":[],"tasks":[],"hardConstraints":[],"softPreferences":[]},"input":"580分，安徽电气"}'
          province="$(request_post province-major "${PREVIEW_BASE}/api/ai/turn?candidate=${EXPECTED_SHA}" "$province_payload")"
          grep -q '"regionKeys":\["province:安徽"\]' <<<"$province"
          grep -q '"majorKeywords":\["电气"\]' <<<"$province"

          comparison_payload='{"workspace":{"contractVersion":"ai-workspace-contract-v3990_1","examContext":{"score":580},"activeView":{"score":580,"regionKeys":["province:辽宁"],"majorKeywords":["电气"]},"viewHistory":[],"tasks":[],"hardConstraints":[],"softPreferences":[]},"input":"电气和机械怎么选"}'
          comparison="$(request_post major-comparison "${PREVIEW_BASE}/api/ai/turn?candidate=${EXPECTED_SHA}" "$comparison_payload")"
          grep -q '"kind":"major"' <<<"$comparison"
          grep -q '"pendingEvidenceDimensions"' <<<"$comparison"

          if grep -q '"workersModelConfigured":true\|"externalConfigured":true' <<<"$health"; then
            probe="$(request_post model-probe "${PREVIEW_BASE}/api/ai/model-probe?candidate=${EXPECTED_SHA}" '{}')"
            grep -q '"ok":true' <<<"$probe"
            grep -Eq '"model":"[^"]+"' <<<"$probe"
          fi

  browser-preview:
    if: github.event_name == 'pull_request' && needs.source-contract.outputs.runtime_changed == 'true' && needs.preview-smoke.result == 'success'
    needs: [source-contract, preview-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium journey runner
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify PC Pad Android human semantic journeys
        env:
          AI_PREVIEW_BASE: ${{ needs.preview-smoke.outputs.preview_base }}
          AI_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          AI_ARTIFACT_DIR: /tmp/ai-workspace-browser-v3990_1
        run: node tools/browser-ai-workspace-v3990_1.mjs
      - name: Upload AI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-workspace-browser-v3990_1
          path: /tmp/ai-workspace-browser-v3990_1
          if-no-files-found: warn
          retention-days: 7

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: https://gaokao-4y9.pages.dev
            mode: exact
          - base: https://gaokao.powers.org.cn
            mode: custom-boundary
    steps:
      - name: Verify exact AI production deployment, model echo, or managed boundary
        env:
          BASE: ${{ matrix.base }}
          VERIFY_MODE: ${{ matrix.mode }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 55); do
            if [ "$VERIFY_MODE" = custom-boundary ]; then
              headers="/tmp/ai-custom-${attempt}.headers"; body="/tmp/ai-custom-${attempt}.body"
              status="$(curl --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' -D "$headers" -o "$body" -w '%{http_code}' "${BASE}/api/ai/health?deploy=${EXPECTED_SHA}-${attempt}" || true)"
              if [ "$status" = 403 ] && grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "$headers" && grep -Eqi '^server:[[:space:]]*cloudflare' "$headers"; then ready=1; break; fi
            fi
            page="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/ai/?deploy=${EXPECTED_SHA}-${attempt}" || true)"
            health="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/api/ai/health?deploy=${EXPECTED_SHA}-${attempt}" || true)"
            rank="$(curl -fsSL --max-time 45 -H 'Content-Type: application/json' -X POST "${BASE}/api/ai/turn?deploy=${EXPECTED_SHA}-${attempt}" --data '{"workspace":{"contractVersion":"ai-workspace-contract-v3990_1","examContext":{},"activeView":{"regionKeys":["all"],"majorKeywords":[]},"viewHistory":[],"tasks":[],"hardConstraints":[],"softPreferences":[]},"input":"600分位次是多少"}' || true)"
            if grep -q 'data-ai-workspace="ai-workspace-v3990_1"' <<<"$page" \
              && grep -q '"apiVersion":"ai-health-api-v3990_1"' <<<"$health" \
              && grep -q '"release":"v3.9.90.1"' <<<"$health" \
              && grep -q '"siteRuntimeGeneration":"v3990_1"' <<<"$health" \
              && grep -q "\"commitSha\":\"${EXPECTED_SHA}\"" <<<"$health" \
              && grep -q '"rankEnd":14235' <<<"$rank"; then
              if grep -q '"workersModelConfigured":true\|"externalConfigured":true' <<<"$health"; then
                probe="$(curl -fsSL --max-time 45 -H 'Content-Type: application/json' -X POST "${BASE}/api/ai/model-probe?deploy=${EXPECTED_SHA}-${attempt}" --data '{}' || true)"
                grep -q '"ok":true' <<<"$probe" || { sleep 10; continue; }
                grep -Eq '"model":"[^"]+"' <<<"$probe" || { sleep 10; continue; }
              fi
              ready=1; break
            fi
            sleep 10
          done
          test "$ready" -eq 1
