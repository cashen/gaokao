name: tmp AIPLuS v0.03 workspace contract patch

on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/tmp-aiplus-v003-workspace-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical continuation and protocol-test patches
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_aiplus_v003_canonical_continuation.py
          python tools/tmp_aiplus_v003_school_boundary.py
          python tools/tmp_aiplus_v003_confirmed_hint.py
          python tools/tmp_aiplus_v003_protocol_test.py
      - name: Diagnose first decision phase
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {createAiWorkspace} from './shared/ai/ai-workspace-contract.v3992_0.js';
          import {orchestrateAiTurn} from './functions/_lib/ai/turn-orchestrator.js';
          const base=createAiWorkspace({examContext:{score:568},activeView:{score:568,regionKeys:['all'],majorKeywords:[],schoolNames:[],bottomLineMode:'all'}});
          const resolverSchools=[{officialName:'沈阳工业大学',province:'辽宁',city:'沈阳'},{officialName:'大连交通大学',province:'辽宁',city:'大连'},...Array.from({length:58},(_,i)=>({officialName:`测试占位大学${i+1}`,province:'辽宁',city:'沈阳'}))];
          const emptyBackground={version:'local-strength-static-v3971_2',records:[],schools:[],meta:{dataYear:2026},academicBackgroundMeta:{boundary:'test empty background'}};
          const ASSETS={fetch:async input=>{const pathname=new URL(input.url).pathname;if(pathname==='/ln-rank/data/local-strength/local-strength-audit.v3971_2.json')return new Response(JSON.stringify({schools:resolverSchools}),{status:200});if(pathname==='/ln-rank/data/local-strength/local-strength-index.v3971_2.json')return new Response(JSON.stringify(emptyBackground),{status:200});return new Response('{}',{status:404});}};
          const input='沈阳工业大学电气和大连交通大学自动化怎么选，考虑就业和考研';
          const turn=await orchestrateAiTurn({request:new Request('https://example.test/api/ai/turn'),env:{ASSETS}},{input,workspace:base});
          console.log(JSON.stringify({ok:turn.ok,pending:turn.pendingDeterministicTool,task:turn.command?.agentTask,schools:turn.command?.schoolNames,majors:turn.command?.majorKeywords,toolRequests:turn.toolRequests,resultKeys:Object.keys(turn.result||{}),decisionResearch:turn.result?.decisionResearch,toolError:turn.result?.toolError,answerStatus:turn.result?.answerStatus},null,2));
          EOF
      - name: Verify canonical continuation and preserved AI behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          git diff --check
      - name: Commit verified canonical continuation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/ai/ai-workspace-contract.v3992_0.js functions/_lib/ai/command-interpreter.js functions/_lib/ai/turn-orchestrator.js tools/verify-aiplus-parent-semantics-v003.mjs
          git commit -m 'AIPLuS：统一 confirmed continuation 的服务端实体真相'
          git push origin HEAD:agent/aiplus-parent-decision-v003
