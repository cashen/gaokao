name: tmp AIPLuS v0.03 workspace contract patch

on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/tmp-aiplus-v003-workspace-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical continuation patch
        run: python tools/tmp_aiplus_v003_canonical_continuation.py
      - name: Verify canonical continuation and preserved AI behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          git diff --check
      - name: Commit verified canonical continuation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/ai/ai-workspace-contract.v3992_0.js functions/_lib/ai/command-interpreter.js functions/_lib/ai/turn-orchestrator.js
          git commit -m 'AIPLuS：统一 confirmed continuation 的服务端实体真相'
          git push origin HEAD:agent/aiplus-parent-decision-v003
