name: tmp AIPLuS v0.03 workspace contract patch

on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/tmp-aiplus-v003-workspace-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical workspace server compaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('shared/ai/ai-workspace-contract.v3992_0.js')
          s=p.read_text()
          old="nowIso,makeId,cloneValue,cleanText,uniqueStrings,normalizedScore,normalizedRank,viewSeed,turnSeed,agentContextSeed,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch"
          new="nowIso,makeId,cloneValue,cleanText,uniqueStrings,normalizedScore,normalizedRank,viewSeed,turnSeed,agentContextSeed,semanticFrameSeed,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch"
          if s.count(old)!=1: raise SystemExit(f'import anchor count={s.count(old)}')
          s=s.replace(old,new)
          old="export {AI_WORKSPACE_CONTRACT_VERSION,AI_EVENT_CONTRACT_VERSION,AI_RESULT_DELTA_VERSION,AI_ACTIVE_VIEW_VERSION,AI_DECISION_PROFILE_VERSION,AI_CONVERSATION_MEMORY_VERSION,AI_TURN_HISTORY_VERSION,AI_AGENT_CONTEXT_VERSION,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch};"
          new="export {AI_WORKSPACE_CONTRACT_VERSION,AI_EVENT_CONTRACT_VERSION,AI_RESULT_DELTA_VERSION,AI_ACTIVE_VIEW_VERSION,AI_DECISION_PROFILE_VERSION,AI_CONVERSATION_MEMORY_VERSION,AI_TURN_HISTORY_VERSION,AI_AGENT_CONTEXT_VERSION,createAiWorkspace,activeViewLabel,regionKeyLabel,applyAiViewPatch,semanticFrameSeed};"
          if s.count(old)!=1: raise SystemExit(f'export anchor count={s.count(old)}')
          s=s.replace(old,new)
          old="agentContext:{version:cleanText(workspace.agentContext?.version,80),currentTask:cleanText(workspace.agentContext?.currentTask,80),previousTask:cleanText(workspace.agentContext?.previousTask,80),focus:compactFocusForServer(workspace.agentContext?.focus||{}),contextUsage:workspace.agentContext?.contextUsage||{}},"
          new="agentContext:{version:cleanText(workspace.agentContext?.version,80),currentTask:cleanText(workspace.agentContext?.currentTask,80),previousTask:cleanText(workspace.agentContext?.previousTask,80),focus:compactFocusForServer(workspace.agentContext?.focus||{}),semanticFrame:semanticFrameSeed(workspace.agentContext?.semanticFrame),contextUsage:workspace.agentContext?.contextUsage||{}},"
          if s.count(old)!=1: raise SystemExit(f'compact anchor count={s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          node --check shared/ai/ai-workspace-contract.v3992_0.js
      - name: Diagnose composite decision phase
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import {createAiWorkspace} from './shared/ai/ai-workspace-contract.v3992_0.js';
          import {deterministicCommand} from './functions/_lib/ai/command-interpreter.js';
          import {orchestrateAiTurn} from './functions/_lib/ai/turn-orchestrator.js';
          const base=createAiWorkspace({examContext:{score:568},activeView:{score:568,regionKeys:['all'],majorKeywords:[],schoolNames:[],bottomLineMode:'all'}});
          const input='沈阳工业大学电气和大连交通大学自动化怎么选，考虑就业和考研';
          const command=deterministicCommand(input,base,['沈阳工业大学','大连交通大学']);
          const turn=await orchestrateAiTurn({request:new Request('https://example.test/api/ai/turn'),env:{}},{input,workspace:base,confirmedCommand:command});
          console.log(JSON.stringify({atomic:{task:command.agentTask,schools:command.schoolNames,majors:command.majorKeywords,score:command.score,scoreUsage:command.scoreUsage},turn:{ok:turn.ok,pendingDeterministicTool:turn.pendingDeterministicTool,toolRequestCount:turn.toolRequestCount,toolRequests:turn.toolRequests,task:turn.command?.agentTask,frame:turn.command?.semanticFrame,plan:turn.result?.decisionResearch?.plan,decisionOk:turn.result?.decisionResearch?.ok,decisionCode:turn.result?.decisionResearch?.code,partial:turn.result?.decisionResearch?.partial,answerStatus:turn.result?.answerStatus}},null,2));
          EOF
          node tools/verify-aiplus-parent-semantics-v003.mjs || true
          git diff --check
      - name: Stop before commit
        shell: bash
        run: exit 0
