name: Tongxue live verification

on:
  pull_request:
    paths:
      - 'tongxue.html'
      - 'tongxue-performance-v112.js'
      - 'school-name-resolver.js'
      - 'school-name-index.generated.json'
      - 'school-search-index.20260617.json'
      - 'functions/api/tongxue-summary.js'
      - 'tools/build-moe-2026-school-index.py'
      - 'tools/verify-tongxue-live.mjs'
      - 'tools/verify-school-name-resolver.mjs'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1

      - name: Syntax and page shell check
        run: |
          cp functions/api/tongxue-summary.js /tmp/tongxue-summary.mjs
          node --check /tmp/tongxue-summary.mjs
          node --check school-name-resolver.js
          node --check tongxue-performance-v112.js
          node --check tools/verify-tongxue-live.mjs
          node --check tools/verify-school-name-resolver.mjs
          python -m py_compile tools/build-moe-2026-school-index.py
          python - <<'PY'
          from pathlib import Path
          html = Path('tongxue.html').read_text(encoding='utf-8')
          expected = '<script type="module" src="/tongxue-performance-v112.js"></script>'
          if expected not in html:
              raise SystemExit('External Tongxue runtime reference missing')
          if '<script type="module">' in html:
              raise SystemExit('Old inline runtime remains')
          if '同学你好 v1.1.2 · 更新于 2026-07-19' not in html:
              raise SystemExit('Tongxue v1.1.2 footer missing')
          if 'content-visibility:auto;contain-intrinsic-size:320px' not in html:
              raise SystemExit('Lazy review layout optimization missing')
          PY

      - name: Download official MOE 2026 XLS
        run: |
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            --header 'Accept: application/vnd.ms-excel,application/octet-stream;q=0.9,*/*;q=0.8' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/tongxue-live-artifact/moe-2026-schools.xls)" -gt 20000
          file /tmp/tongxue-live-artifact/moe-2026-schools.xls

      - name: Rebuild official and compact school JSON
        run: |
          python tools/build-moe-2026-school-index.py \
            --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            --output school-name-index.generated.json \
            --search-output school-search-index.20260617.json
          cp school-name-index.generated.json /tmp/tongxue-live-artifact/
          cp school-search-index.20260617.json /tmp/tongxue-live-artifact/

      - name: Verify generated indexes are committed
        run: git diff --exit-code -- school-name-index.generated.json school-search-index.20260617.json

      - name: Verify official school index and name resolver
        run: node tools/verify-school-name-resolver.mjs

      - name: Execute actual Function against live summary and review APIs
        env:
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: node tools/verify-tongxue-live.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxue-live-results
          path: /tmp/tongxue-live-artifact
          if-no-files-found: warn
          retention-days: 3
