name: Homepage one-time verified patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-homepage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact homepage patch
        run: python tools/patch-home-tongxue-link.py

      - name: Verify UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'href="./tongxue.html" class="resource-card life"',
              '<span class="resource-kicker">学校体验</span>',
              '<span class="resource-title">同学你好</span>',
              '查看来源 AI 摘要或近期真实评论。',
              '首页 v1.0.1 · 更新于 2026-07-19'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('缺少首页内容：' + repr(missing))
          if html.count('href="./tongxue.html"') != 1:
              raise SystemExit('同学你好链接数量异常')
          if html.count('Liaoning_Universit_Dorm_AC_Field_Guide.html') != 1:
              raise SystemExit('原宿舍空调链接异常')
          if html.count('<script') != 1 or html.count('</script>') != 1:
              raise SystemExit('首页脚本结构异常')
          print('Homepage UI contract passed.')
          PY

      - name: Restore workflow, remove temporary script and publish
        run: |
          git show HEAD^:.github/workflows/tongxue-live-verification.yml > .github/workflows/tongxue-live-verification.yml
          git rm tools/patch-home-tongxue-link.py
          git add index.html .github/workflows/tongxue-live-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Tongxue homepage link and homepage version'
          git push origin HEAD:main
