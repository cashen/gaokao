name: Tongxue directory migration commit

on:
  pull_request:
    paths:
      - 'tools/migrate-tongxue-directory-v121.py'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false
      - name: Apply verified migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tongxue.html')
          text=path.read_text(encoding='utf-8').replace('<title>同学你好 - 看看学长学姐怎么说</title>','<title>同学你好 - 看看学校里的真实体验</title>')
          path.write_text(text,encoding='utf-8')
          PY
          python3 tools/migrate-tongxue-directory-v121.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tongxue/index.html')
          text=path.read_text(encoding='utf-8').replace('<title>同学你好 - 看看学校里的真实体验</title>','<title>同学你好 - 看看学长学姐怎么说</title>')
          path.write_text(text,encoding='utf-8')
          PY
          git checkout HEAD -- .github/workflows/tongxue-live-verification.yml
      - name: Commit directory migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: consolidate Tongxue under directory'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
