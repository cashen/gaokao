name: Tongxue live verification

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tongxue.html'
      - 'tongxue/**'
      - 'shared/resources/schools/**'
      - 'shared/resources/geo/**'
      - 'shared/resources/release/**'
      - 'functions/api/tongxue-*.js'
      - 'functions/_lib/tongxue-*.js'
      - 'tools/tongxue/**'
      - 'tools/schools/**'
      - '_headers'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: Syntax contract
        run: |
          for file in \
            functions/api/tongxue-summary.js \
            functions/api/tongxue-school-portrait.js \
            functions/_lib/tongxue-school-portrait-core.js \
            functions/_lib/tongxue-school-portrait-base-v120.js \
            functions/_lib/tongxue-summary-base-v112.js \
            shared/resources/schools/*.js \
            tongxue/data/*.js \
            tongxue/app/*.js \
            tongxue/portrait/*.js \
            tongxue/share/*.js \
            tools/tongxue/*.mjs; do
            node --check "$file"
          done
          python -m py_compile \
            tools/schools/school_resource_bundle.py \
            tools/schools/school_resource_artifact_compat.py \
            tools/schools/build-school-profile-center-v3957.py \
            tools/tongxue/build-moe-2026-school-index.py \
            tools/tongxue/build-school-region-index-v150.py
      - name: Verify directory contract
        run: node tools/tongxue/verify-directory.mjs
      - name: Verify brand and final copy contract
        run: node tools/tongxue/verify-brand-ui-v152.mjs
      - name: Verify mouse keyboard IME and copy ownership
        run: node tools/tongxue/verify-interaction-v153.mjs
      - name: Verify direct school handoff
        run: node tools/tongxue/verify-direct-handoff-v155.mjs
      - name: Verify result-only direct experience
        run: node tools/tongxue/verify-direct-result-v158.mjs
      - name: Verify school entity contract
        run: node tools/tongxue/verify-school-entities-v130.mjs
      - name: Verify school input contracts
        run: |
          node tools/tongxue/verify-school-initials-v141.mjs
          node tools/tongxue/verify-school-input-fluency-v141.mjs
      - name: Verify school region contracts
        run: |
          node tools/tongxue/verify-school-region-v150.mjs
          node tools/tongxue/verify-school-region-ui-v150.mjs
      - name: Verify mobile share workflow
        run: node tools/tongxue/verify-share.mjs
      - name: Verify school experience portrait
        env:
          PORTRAIT_LIVE_SCHOOLS: 东北大学秦皇岛分校,哈尔滨工业大学（威海）
        run: node tools/tongxue/verify-portrait.mjs
      - name: Rebuild all official school resources once
        run: |
          set -euo pipefail
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/tongxue-live-artifact/moe-2026-schools.xls)" -gt 20000
          python tools/schools/school_resource_bundle.py --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls
          python tools/schools/school_resource_artifact_compat.py
          node tools/tongxue/build-school-initial-index-v141.mjs
          node tools/tongxue/build-school-initial-index-v150.mjs
          git diff --exit-code -- \
            shared/resources/schools/school-profile-data.20260617-v3957.js \
            tongxue/data/school-name-index.generated.json \
            tongxue/data/school-search-index.20260617.json \
            tongxue/data/school-search-index.20260617-v150.json
          node tools/tongxue/verify-school-name-resolver.mjs
          node tools/tongxue/verify-school-initials-v141.mjs
          node tools/tongxue/verify-school-input-fluency-v141.mjs
          node tools/tongxue/verify-school-region-v150.mjs
          node tools/tongxue/verify-school-region-ui-v150.mjs
          node tools/tongxue/verify-brand-ui-v152.mjs
          node tools/tongxue/verify-interaction-v153.mjs
          node tools/tongxue/verify-direct-handoff-v155.mjs
          node tools/tongxue/verify-direct-result-v158.mjs
      - name: Verify shared resource ownership
        run: node tools/audit-resource-ownership-v3958.mjs
      - name: Execute summary and review regression
        env:
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: node tools/tongxue/run-live-regression.mjs
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxue-live-results
          path: /tmp/tongxue-live-artifact
          if-no-files-found: warn
          retention-days: 3
