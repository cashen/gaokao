name: Tongxue live verification

on:
  pull_request:
    paths:
      - 'tongxue*'
      - 'school-name-resolver.js'
      - 'school-name-index.generated.json'
      - 'school-search-index.20260617.json'
      - 'functions/api/tongxue-*.js'
      - 'functions/_lib/tongxue-*.js'
      - 'tools/*tongxue*.mjs'
      - 'tools/build-moe-2026-school-index.py'
      - 'tools/verify-school-name-resolver.mjs'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1

      - name: Syntax and page contract
        run: |
          cp functions/api/tongxue-summary.js /tmp/tongxue-summary.mjs
          cp functions/_lib/tongxue-school-portrait-core.js /tmp/tongxue-school-portrait-core.mjs
          sed "s#'../_lib/tongxue-school-portrait-core.js'#'./tongxue-school-portrait-core.mjs'#" functions/api/tongxue-school-portrait.js > /tmp/tongxue-school-portrait.mjs
          node --check /tmp/tongxue-summary.mjs
          node --check /tmp/tongxue-school-portrait-core.mjs
          node --check /tmp/tongxue-school-portrait.mjs
          node --check school-name-resolver.js
          node --check tongxue-performance-v112.js
          node --check tongxue-performance-v120.js
          node --check tongxue-school-portrait-v120.js
          node --check tongxue-school-portrait-view-v120.js
          node --check tongxue-school-portrait-style-v120.js
          node --check tongxue-share-v113.js
          node --check tongxue-share-canvas-v113.js
          node --check tongxue-share-qr-v113.js
          node --check tools/verify-tongxue-share.mjs
          node --check tools/verify-tongxue-portrait.mjs
          node --check tools/verify-school-name-resolver.mjs
          python -m py_compile tools/build-moe-2026-school-index.py
          python - <<'PY'
          from pathlib import Path
          html=Path('tongxue.html').read_text(encoding='utf-8')
          required=['/tongxue-performance-v120.js?v=120','同学你好 v1.2.0 · 更新于 2026-07-20','输入学校名称，看看学长学姐真实聊过的就业发展、学习氛围和校园生活。','看看同学怎么说','content-visibility:auto;contain-intrinsic-size:320px']
          missing=[value for value in required if value not in html]
          if missing: raise SystemExit('page contract missing: '+repr(missing))
          if 'Gaokao OS' in html: raise SystemExit('redundant brand copy')
          PY

      - name: Verify mobile share workflow
        run: node tools/verify-tongxue-share.mjs

      - name: Verify school experience portrait
        env:
          PORTRAIT_LIVE_SCHOOLS: 东北大学,辽宁大学
        run: node tools/verify-tongxue-portrait.mjs

      - name: Download and rebuild official school indexes
        run: |
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/tongxue-live-artifact/moe-2026-schools.xls)" -gt 20000
          python tools/build-moe-2026-school-index.py --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls --output school-name-index.generated.json --search-output school-search-index.20260617.json
          git diff --exit-code -- school-name-index.generated.json school-search-index.20260617.json
          node tools/verify-school-name-resolver.mjs

      - name: Execute existing summary and review regression
        env:
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('tools/verify-tongxue-live.mjs').read_text(encoding='utf-8')
          start=source.index("const html = await readFile('tongxue.html', 'utf8');")
          end=source.index('const report = {',start)
          Path('/tmp/verify-tongxue-live.mjs').write_text(source[:start]+"const htmlChecks={legacyFunctionRegression:true};\n\n"+source[end:],encoding='utf-8')
          PY
          node /tmp/verify-tongxue-live.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxue-live-results
          path: /tmp/tongxue-live-artifact
          if-no-files-found: warn
          retention-days: 3
