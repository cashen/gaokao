name: Tongxue live verification

on:
  pull_request:
    paths:
      - 'index.html'
      - 'tongxue.html'
      - 'tongxue/**'
      - 'functions/api/tongxue-*.js'
      - 'functions/_lib/tongxue-*.js'
      - 'tools/tongxue/**'
      - '_headers'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revert-tongxue-v160-to-v150
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: Restore exact v1.5.0 release
        run: |
          set -euo pipefail
          BASE='b0679c74e1aa94516d3f9f88c201c0f532fcb02c'
          git checkout "$BASE" -- \
            .github/workflows/tongxue-live-verification.yml \
            _headers \
            functions/_lib/tongxue-school-portrait-base-v120.js \
            functions/_lib/tongxue-school-portrait-core.js \
            functions/api/tongxue-school-portrait.js \
            tongxue/changelog.html \
            tongxue/index.html \
            tools/tongxue/verify-directory.mjs \
            tools/tongxue/verify-portrait.mjs \
            tools/tongxue/verify-school-region-ui-v150.mjs \
            tools/tongxue/verify-share.mjs
          rm -f \
            functions/_lib/tongxue-school-portrait-base-v160.js \
            tongxue/app/tongxue-performance-v160.js \
            tongxue/portrait/tongxue-school-portrait-style-v160.js \
            tongxue/portrait/tongxue-school-portrait-v160.js \
            tongxue/portrait/tongxue-school-portrait-view-v160.js \
            tools/tongxue/verify-school-evidence-ui-v160.mjs \
            tools/tongxue/verify-school-evidence-v160.mjs
          git diff --name-status
          grep -q 'tongxue-v150-region-20260617' tongxue/index.html
          grep -q '同学你好 v1.5.0' tongxue/index.html
          grep -q 'tongxue-performance-v150.js?v=150' tongxue/index.html
          grep -q "const VERSION='v1.3.0'" functions/api/tongxue-school-portrait.js
          grep -q "const API_VERSION = 'v1.2.0';" functions/_lib/tongxue-school-portrait-base-v120.js
          test -f tongxue/app/tongxue-performance-v150.js
          for file in \
            functions/_lib/tongxue-school-portrait-base-v160.js \
            tongxue/app/tongxue-performance-v160.js \
            tongxue/portrait/tongxue-school-portrait-style-v160.js \
            tongxue/portrait/tongxue-school-portrait-v160.js \
            tongxue/portrait/tongxue-school-portrait-view-v160.js \
            tools/tongxue/verify-school-evidence-ui-v160.mjs \
            tools/tongxue/verify-school-evidence-v160.mjs; do
            test ! -e "$file"
          done
          if git diff --name-only | grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$|functions/_lib/release-contract\.js$)'; then
            echo 'protected path changed'
            exit 1
          fi
      - name: Syntax and directory contract
        run: |
          for file in \
            functions/api/tongxue-summary.js \
            functions/api/tongxue-school-portrait.js \
            functions/_lib/tongxue-school-portrait-core.js \
            functions/_lib/tongxue-school-portrait-base-v120.js \
            functions/_lib/tongxue-summary-base-v112.js \
            tongxue/data/*.js \
            tongxue/app/*.js \
            tongxue/portrait/*.js \
            tongxue/share/*.js \
            tools/tongxue/*.mjs; do
            node --check "$file"
          done
          python -m py_compile tools/tongxue/build-moe-2026-school-index.py tools/tongxue/build-school-region-index-v150.py
          node tools/tongxue/verify-directory.mjs
          node tools/tongxue/verify-school-entities-v130.mjs
          node tools/tongxue/verify-school-initials-v141.mjs
          node tools/tongxue/verify-school-input-fluency-v141.mjs
          node tools/tongxue/verify-school-region-v150.mjs
          node tools/tongxue/verify-school-region-ui-v150.mjs
      - name: Verify mobile share workflow
        run: node tools/tongxue/verify-share.mjs
      - name: Verify school experience portrait
        env:
          PORTRAIT_LIVE_SCHOOLS: 东北大学秦皇岛分校,哈尔滨工业大学（威海）
        run: node tools/tongxue/verify-portrait.mjs
      - name: Rebuild official school indexes
        run: |
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/tongxue-live-artifact/moe-2026-schools.xls)" -gt 20000
          python tools/tongxue/build-moe-2026-school-index.py --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls
          node tools/tongxue/build-school-initial-index-v141.mjs
          git diff --exit-code -- tongxue/data/school-name-index.generated.json tongxue/data/school-search-index.20260617.json
          python tools/tongxue/build-school-region-index-v150.py --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls
          node tools/tongxue/build-school-initial-index-v150.mjs
          git diff --exit-code -- tongxue/data/school-search-index.20260617-v150.json
          node tools/tongxue/verify-school-name-resolver.mjs
          node tools/tongxue/verify-school-initials-v141.mjs
          node tools/tongxue/verify-school-input-fluency-v141.mjs
          node tools/tongxue/verify-school-region-v150.mjs
          node tools/tongxue/verify-school-region-ui-v150.mjs
      - name: Execute summary and review regression
        env:
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: node tools/tongxue/run-live-regression.mjs
      - name: Commit exact v1.5.0 rollback
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/revert-tongxue-v160-to-v150'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'rollback produced no changes'; exit 1; }
          git commit -m 'revert: restore Tongxue v1.5.0 and remove v1.6.0'
          git push origin HEAD:agent/revert-tongxue-v160-to-v150
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxue-live-results
          path: /tmp/tongxue-live-artifact
          if-no-files-found: warn
          retention-days: 3
