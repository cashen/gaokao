name: Tongxue live verification

on:
  pull_request:
    paths:
      - 'tongxue.html'
      - 'tongxue-performance-v112.js'
      - 'tongxue-performance-v113.js'
      - 'tongxue-share-v113.js'
      - 'tongxue-share-canvas-v113.js'
      - 'tongxue-share-qr-v113.js'
      - 'school-name-resolver.js'
      - 'school-name-index.generated.json'
      - 'school-search-index.20260617.json'
      - 'functions/api/tongxue-summary.js'
      - 'tools/build-moe-2026-school-index.py'
      - 'tools/verify-tongxue-live.mjs'
      - 'tools/verify-school-name-resolver.mjs'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.1

      - name: Syntax and page shell check
        run: |
          cp functions/api/tongxue-summary.js /tmp/tongxue-summary.mjs
          node --check /tmp/tongxue-summary.mjs
          node --check school-name-resolver.js
          node --check tongxue-performance-v112.js
          node --check tongxue-performance-v113.js
          node --check tongxue-share-v113.js
          node --check tongxue-share-canvas-v113.js
          node --check tongxue-share-qr-v113.js
          node --check tools/verify-tongxue-live.mjs
          node --check tools/verify-school-name-resolver.mjs
          python -m py_compile tools/build-moe-2026-school-index.py
          python - <<'PY'
          from pathlib import Path
          html = Path('tongxue.html').read_text(encoding='utf-8')
          if '<script type="module" src="/tongxue-performance-v113.js"></script>' not in html:
              raise SystemExit('Tongxue v1.1.3 runtime reference missing')
          if '同学你好 v1.1.3 · 更新于 2026-07-19' not in html:
              raise SystemExit('Tongxue v1.1.3 footer missing')
          if 'content-visibility:auto;contain-intrinsic-size:320px' not in html:
              raise SystemExit('Lazy review layout optimization missing')
          PY

      - name: Verify mobile share image workflow
        run: |
          sed "s#from '/tongxue-share-canvas-v113.js'#from './tongxue-share-canvas-v113.mjs'#" tongxue-share-v113.js > /tmp/tongxue-share-v113.mjs
          sed "s#from '/tongxue-share-qr-v113.js'#from './tongxue-share-qr-v113.mjs'#" tongxue-share-canvas-v113.js > /tmp/tongxue-share-canvas-v113.mjs
          cp tongxue-share-qr-v113.js /tmp/tongxue-share-qr-v113.mjs
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const failures=[];
          const html=await readFile('tongxue.html','utf8');
          const wrapper=await readFile('tongxue-performance-v113.js','utf8');
          const share=await readFile('tongxue-share-v113.js','utf8');
          const canvasSource=await readFile('tongxue-share-canvas-v113.js','utf8');
          const qr=await readFile('tongxue-share-qr-v113.js','utf8');
          const {buildShareUrl,chooseShareReviews,buildShareCacheKey}=await import('file:///tmp/tongxue-share-v113.mjs');
          const canonical=buildShareUrl('https://gaokao.powers.org.cn/tongxue.html?old=1#x','辽宁科技大学');
          const sampleReviews=Array.from({length:8},(_,i)=>({id:i+1,content:'评论'+(i+1)}));
          const pureChecks={
            canonicalUrl:canonical==='https://gaokao.powers.org.cn/tongxue.html?school=%E8%BE%BD%E5%AE%81%E7%A7%91%E6%8A%80%E5%A4%A7%E5%AD%A6',
            featuredThree:chooseShareReviews(sampleReviews,'featured').length===3,
            fullCurrent:chooseShareReviews(sampleReviews,'full').length===8,
            cacheVariant:buildShareCacheKey({mode:'recent_reviews',school:'辽宁大学',reviews:sampleReviews},'featured')!==buildShareCacheKey({mode:'recent_reviews',school:'辽宁大学',reviews:sampleReviews},'full')
          };
          for(const [name,passed] of Object.entries(pureChecks))if(!passed)failures.push(name);

          class FakeContext{
            constructor(){this.fillStyle='';this.strokeStyle='';this.font='';this.lineWidth=1;this.textAlign='left';}
            fillRect(){} fillText(){} beginPath(){} moveTo(){} lineTo(){} stroke(){} arcTo(){} closePath(){} fill(){} drawImage(){}
            measureText(value){return{width:String(value||'').length*31};}
          }
          class FakeCanvas{
            constructor(){this.width=0;this.height=0;this.context=new FakeContext();}
            getContext(){return this.context;}
            toBlob(callback){callback(new Blob(['png'],{type:'image/png'}));}
          }
          globalThis.window={qrcode(){return{addData(){},make(){},getModuleCount(){return 21;},isDark(row,col){return (row+col)%3===0;}};}};
          globalThis.document={fonts:{ready:Promise.resolve()},createElement(type){if(type==='canvas')return new FakeCanvas();return{};},head:{append(){}}};
          if(typeof globalThis.File!=='function')globalThis.File=class File extends Blob{constructor(parts,name,options={}){super(parts,options);this.name=name;this.lastModified=Date.now();}};
          const originalCreateObjectURL=URL.createObjectURL;
          URL.createObjectURL=()=> 'blob:verification';
          const {generateShareAssets}=await import('file:///tmp/tongxue-share-canvas-v113.mjs');
          const longItems=Array.from({length:130},(_,i)=>`第${i+1}条很长的学校体验摘要，用于验证文字自动换行和多页图片生成，不允许内容溢出画布。`);
          const summaryAssets=await generateShareAssets({mode:'ai_summary',school:'超长摘要测试大学',meta:['辽宁 · 沈阳','本科'],groups:[{title:'综合印象',attention:false,items:longItems}],reviews:[],shareUrl:canonical},'featured');
          const longReviews=Array.from({length:18},(_,i)=>({author:'匿名同学',date:'2026/07/19',tags:['主校区'],content:`第${i+1}条评论：`+'校园生活与学习体验。'.repeat(90),rating:'4.2',dimensions:['宿舍 4.0','就业 4.3'],social:['👍 3 赞']}));
          const reviewAssets=await generateShareAssets({mode:'recent_reviews',school:'长评论测试大学',meta:['辽宁 · 沈阳','18 条公开评价'],groups:[],reviews:longReviews,shareUrl:canonical},'full');
          const executionChecks={
            summaryMultiPage:summaryAssets.files.length>1,
            reviewMultiPage:reviewAssets.files.length>1,
            pngFiles:[...summaryAssets.files,...reviewAssets.files].every(file=>file.type==='image/png'&&file.size>0),
            safeHeight:[...summaryAssets.files,...reviewAssets.files].length<100
          };
          if(originalCreateObjectURL)URL.createObjectURL=originalCreateObjectURL;
          for(const [name,passed] of Object.entries(executionChecks))if(!passed)failures.push(name);

          const checks={
            pageVersion:html.includes('同学你好 v1.1.3')&&html.includes('/tongxue-performance-v113.js'),
            keepsQueryRuntime:wrapper.includes('tongxue-performance-v112.js?v=113'),
            installsShare:wrapper.includes('installTongxueShare'),
            button:share.includes('生成分享图'),
            variants:share.includes('分享精选图')&&share.includes('完整评论长图'),
            nativeShare:share.includes('navigator.share')&&share.includes('navigator.canShare'),
            saveFallback:share.includes('保存图片')&&share.includes('长按预览图'),
            localOnly:share.includes('图片在本机生成，不会上传'),
            canvas:canvasSource.includes('const W=1080,H=3600')&&canvasSource.includes('canvas.toBlob'),
            multiPage:canvasSource.includes('${index+1}/${total}'),
            qr:qr.includes('qrcode-generator/1.4.4')&&canvasSource.includes('扫码查看最新内容'),
            currentReviews:share.includes("shell.querySelectorAll('.review-card')"),
            shareUrl:share.includes('history.replaceState')&&share.includes("searchParams.get('school')"),
            accessibility:share.includes('aria-modal')&&share.includes("event.key==='Escape'")
          };
          for(const [name,passed] of Object.entries(checks))if(!passed)failures.push(name);
          console.log('TONGXUE_SHARE_RESULTS '+JSON.stringify({checks,pureChecks,executionChecks,summaryPages:summaryAssets.files.length,reviewPages:reviewAssets.files.length,failures}));
          if(failures.length)process.exit(1);
          NODE

      - name: Download official MOE 2026 XLS
        run: |
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            --header 'Accept: application/vnd.ms-excel,application/octet-stream;q=0.9,*/*;q=0.8' \
            --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' \
            --output /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          test "$(stat -c%s /tmp/tongxue-live-artifact/moe-2026-schools.xls)" -gt 20000
          file /tmp/tongxue-live-artifact/moe-2026-schools.xls

      - name: Rebuild official and compact school JSON
        run: |
          python tools/build-moe-2026-school-index.py \
            --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls \
            --output school-name-index.generated.json \
            --search-output school-search-index.20260617.json
          cp school-name-index.generated.json /tmp/tongxue-live-artifact/
          cp school-search-index.20260617.json /tmp/tongxue-live-artifact/

      - name: Verify generated indexes are committed
        run: git diff --exit-code -- school-name-index.generated.json school-search-index.20260617.json

      - name: Verify official school index and name resolver
        run: node tools/verify-school-name-resolver.mjs

      - name: Execute actual Function against live summary and review APIs
        env:
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: node tools/verify-tongxue-live.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxue-live-results
          path: /tmp/tongxue-live-artifact
          if-no-files-found: warn
          retention-days: 3
