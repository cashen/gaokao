name: Tongxue directory migration diagnostic

on:
  pull_request:
    paths:
      - 'tools/migrate-tongxue-directory-v121.py'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false
      - name: Normalize current title for one-time migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tongxue.html')
          text=path.read_text(encoding='utf-8')
          text=text.replace('<title>同学你好 - 看看学长学姐怎么说</title>','<title>同学你好 - 看看学校里的真实体验</title>')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Run migration diagnostic
        shell: bash
        run: |
          set +e
          python3 tools/migrate-tongxue-directory-v121.py > /tmp/tongxue-migration.log 2>&1
          code=$?
          echo "$code" > /tmp/tongxue-migration-exit-code
          cat /tmp/tongxue-migration.log
          exit 0
      - name: Upload migration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tongxue-migration-diagnostic
          path: |
            /tmp/tongxue-migration.log
            /tmp/tongxue-migration-exit-code
          retention-days: 1
      - name: Fail when migration failed
        run: test "$(cat /tmp/tongxue-migration-exit-code)" = "0"
