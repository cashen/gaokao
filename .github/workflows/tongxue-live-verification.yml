name: Tongxue directory migration export

on:
  pull_request:
    paths:
      - 'tools/migrate-tongxue-directory-v121.py'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false
      - name: Normalize current title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tongxue.html')
          text=path.read_text(encoding='utf-8').replace('<title>同学你好 - 看看学长学姐怎么说</title>','<title>同学你好 - 看看学校里的真实体验</title>')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Apply migration and restore title
        run: |
          python3 tools/migrate-tongxue-directory-v121.py
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tongxue/index.html')
          text=path.read_text(encoding='utf-8').replace('<title>同学你好 - 看看学校里的真实体验</title>','<title>同学你好 - 看看学长学姐怎么说</title>')
          path.write_text(text,encoding='utf-8')
          PY
      - name: Export migrated files
        run: |
          tar -czf /tmp/tongxue-directory-v121.tar.gz \
            index.html tongxue.html tongxue tools/tongxue \
            .github/workflows/tongxue-live-verification.yml
      - uses: actions/upload-artifact@v4
        with:
          name: tongxue-directory-v121-tree
          path: /tmp/tongxue-directory-v121.tar.gz
          retention-days: 1
