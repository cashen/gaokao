name: Tongxue directory migration diagnostic

on:
  pull_request:
    paths:
      - 'tools/migrate-tongxue-directory-v121.py'
      - '.github/workflows/tongxue-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run migration diagnostic
        run: python tools/migrate-tongxue-directory-v121.py
