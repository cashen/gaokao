          cat > tools/tongxue/verify-higher-education-common-name-v001.mjs <<'EOF'
import assert from 'node:assert/strict';
import fs from 'node:fs';
import {
  HIGHER_EDUCATION_COMMON_NAME_TYPE,
  HIGHER_EDUCATION_COMMON_NAME_NOTICE,
  listHigherEducationCommonNames,
  resolveHigherEducationCommonNameSchools,
  higherEducationCommonNameHandoffPayload
} from '../../shared/resources/higher-education/higher-education-common-names.v001.js';

const resource = fs.readFileSync('shared/resources/higher-education/higher-education-common-names.v001.js', 'utf8');
const wrapper = fs.readFileSync('tongxue/app/tongxue-runtime-common-name-v001.js', 'utf8');
const page = fs.readFileSync('tongxue/index.html', 'utf8');
const release = fs.readFileSync('shared/resources/release/current-release.js', 'utf8');

const items = listHigherEducationCommonNames();
assert.equal(HIGHER_EDUCATION_COMMON_NAME_TYPE, '高校民间称谓');
assert.match(HIGHER_EDUCATION_COMMON_NAME_NOTICE, /不是教育部门的官方分类/);
assert.equal(items.length, 8);
for (const item of items) {
  const resolved = resolveHigherEducationCommonNameSchools(item.id);
  assert.equal(resolved.status, 'resolved', `${item.name} must resolve`);
  assert.ok(resolved.members.length >= 2, `${item.name} must have members`);
  assert.ok(item.sources?.length, `${item.name} must retain public sources`);
}

const mechanical = resolveHigherEducationCommonNameSchools('mechanical-five-tigers');
assert.deepEqual(mechanical.members.map(item => item.displayName), ['清华大学','上海交通大学','华中科技大学','西安交通大学','哈尔滨工业大学']);
const electrical = resolveHigherEducationCommonNameSchools('two-electronic-one-post');
assert.deepEqual(electrical.members.map(item => item.displayName), ['电子科技大学','西安电子科技大学','北京邮电大学']);

const payload = higherEducationCommonNameHandoffPayload('上海交通大学', 'shang-jiao');
assert.equal(payload.commonNameType, HIGHER_EDUCATION_COMMON_NAME_TYPE);
assert.equal(payload.canonicalSchoolName, '上海交通大学');
assert.equal(payload.sourceSurface, 'tongxue');
assert.equal(payload.sourceAction, 'view_common_name_schools');
assert.match(payload.handoffContractVersion, /^higher-education-common-name-handoff-v001$/);

assert.match(wrapper, /createBaseTongxueResultView/);
assert.match(wrapper, /高校民间称谓/);
assert.match(wrapper, /resolveHigherEducationCommonNameSchools/);
assert.doesNotMatch(wrapper, /fetch\(/);
assert.match(page, /tongxue-runtime-common-name-v001\.js/);
assert.match(release, /display: 'v3\.9\.90\.4'/);
assert.match(release, /releaseRevision: 'r052-tongxue-common-name'/);
assert.match(release, /tongxueCommonNameVersion: 'tongxue-common-name-v001'/);
console.log(`higher-education-common-name v001 verified: ${items.length} published common names`);
EOF

