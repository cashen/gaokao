name: One-time rank first-page compaction v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded first-page compaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('functions/api/major-bands.js')
          text = api.read_text(encoding='utf-8')

          snapshot_fn = """function compactRankedSnapshot(records = []) {
            const ordered = [];
            let estimatedBytes = 2;
            for (const record of Array.isArray(records) ? records : []) {
              const compact = compactMajorBandsBucketCandidate(record);
              ordered.push(compact);
              estimatedBytes += JSON.stringify(compact).length + 1;
            }
            return { ordered, estimatedBytes };
          }
          """
          page_fn = """
          function compactRankedPage(records = [], offset = 0, limit = 40) {
            const list = Array.isArray(records) ? records : [];
            const normalizedOffset = Math.max(0, Math.floor(Number(offset) || 0));
            const normalizedLimit = Math.max(1, Math.floor(Number(limit) || 1));
            const compact = compactRankedSnapshot(list.slice(normalizedOffset, normalizedOffset + normalizedLimit));
            const nextOffset = normalizedOffset + compact.ordered.length;
            const hasMore = nextOffset < list.length;
            return {
              ...compact,
              pagination: {
                offset: normalizedOffset,
                limit: normalizedLimit,
                returned: compact.ordered.length,
                hasMore,
                nextOffset: hasMore ? nextOffset : null
              }
            };
          }
          """
          if 'function compactRankedPage(' not in text:
              if snapshot_fn not in text:
                  raise SystemExit('compactRankedSnapshot anchor not found')
              text = text.replace(snapshot_fn, snapshot_fn + page_fn)

          old_identity = """    const executionIdentity = queryIdentity({
                candidateScore,
                rangePreset,
                filters,
                schoolNames,
                band: requestedBand,
                pageOffset,
                pageLimit
              });
          """
          new_identity = """    const executionBaseIdentity = queryIdentity({
                candidateScore,
                rangePreset,
                filters,
                schoolNames,
                band: requestedBand,
                pageOffset,
                pageLimit
              });
              const executionIdentity = pageOffset === 0
                ? `${executionBaseIdentity}|current-page:${pageOffset}:${pageLimit}`
                : `${executionBaseIdentity}|full-snapshot`;
          """
          if old_identity in text:
              text = text.replace(old_identity, new_identity, 1)
          elif '|current-page:${pageOffset}:${pageLimit}' not in text:
              raise SystemExit('execution identity anchor not found')

          old_compact = """        const retainFullBand = requestedBand === key;
                  const compact = retainFullBand
                    ? { ...compactRankedSnapshot(ordered), pagination: null }
                    : { ordered: [], estimatedBytes: 0, pagination: null };
                  compactGrouped[key] = {
                    ordered: compact.ordered,
                    count: ordered.length,
                    snapshot: majorBandsSnapshotId(ordered, identity),
                    retentionScope: retainFullBand ? 'full-requested-band' : 'hidden-band',
                    pagination: compact.pagination
                  };
          """
          new_compact = """        const retainFullBand = requestedBand === key;
                  const firstPageOnly = retainFullBand && pageOffset === 0;
                  const compact = retainFullBand
                    ? (firstPageOnly
                        ? compactRankedPage(ordered, pageOffset, pageLimit)
                        : { ...compactRankedSnapshot(ordered), pagination: null })
                    : { ordered: [], estimatedBytes: 0, pagination: null };
                  const snapshot = majorBandsSnapshotId(ordered, identity);
                  const pagination = compact.pagination
                    ? { ...compact.pagination, order: MAJOR_BANDS_RESULT_ORDER_VERSION, snapshot }
                    : null;
                  compactGrouped[key] = {
                    ordered: compact.ordered,
                    count: ordered.length,
                    snapshot,
                    retentionScope: retainFullBand
                      ? (firstPageOnly ? 'current-requested-band-page' : 'full-requested-band')
                      : 'hidden-band',
                    pagination
                  };
          """
          if old_compact in text:
              text = text.replace(old_compact, new_compact, 1)
          elif 'const firstPageOnly = retainFullBand && pageOffset === 0;' not in text:
              raise SystemExit('compact grouped anchor not found')

          old_retention = """          mode: 'compact-requested-band-snapshot',
                    recordCount: retainedRecordCount,
                    estimatedBytes: retainedEstimatedBytes,
                    requestedBand,
                    pageOffset: null,
                    pageLimit: null
          """
          new_retention = """          mode: pageOffset === 0
                      ? 'compact-requested-band-current-page'
                      : 'compact-requested-band-snapshot',
                    recordCount: retainedRecordCount,
                    estimatedBytes: retainedEstimatedBytes,
                    requestedBand,
                    pageOffset: pageOffset === 0 ? pageOffset : null,
                    pageLimit: pageOffset === 0 ? pageLimit : null
          """
          if old_retention in text:
              text = text.replace(old_retention, new_retention, 1)
          elif 'compact-requested-band-current-page' not in text:
              raise SystemExit('cache retention anchor not found')

          old_page = """      } else {
                  page = paginateMajorBandsRecords(ordered, {
                    offset: pageOffset,
                    limit: pageLimit,
                    queryIdentity: identity
                  });
                }
          """
          new_page = """      } else if (compactBand.pagination) {
                  page = {
                    records: ordered,
                    count: compactBand.count,
                    pagination: compactBand.pagination
                  };
                } else {
                  page = paginateMajorBandsRecords(ordered, {
                    offset: pageOffset,
                    limit: pageLimit,
                    queryIdentity: identity
                  });
                }
          """
          if old_page in text:
              text = text.replace(old_page, new_page, 1)
          elif '} else if (compactBand.pagination) {' not in text:
              raise SystemExit('response pagination anchor not found')

          api.write_text(text, encoding='utf-8')

          verifier = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          text = verifier.read_text(encoding='utf-8')
          old_assert = """    assert.equal(result.payload?.source?.queryExecutionRetentionMode, 'compact-requested-band-snapshot', `${result.scenario}: requested-band retention mode`);
          """
          new_assert = """    const firstPage = Number(group.pagination?.offset || 0) === 0;
              const expectedRetentionMode = firstPage
                ? 'compact-requested-band-current-page'
                : 'compact-requested-band-snapshot';
              assert.equal(result.payload?.source?.queryExecutionRetentionMode, expectedRetentionMode, `${result.scenario}: requested-band retention mode`);
              if (firstPage) {
                assert.ok(Number(result.payload?.source?.queryExecutionRetainedRecords || 0) <= Number(group.pagination?.limit || 0), `${result.scenario}: first page retained full band`);
                assert.equal(Number(result.payload?.source?.queryExecutionPageOffset), 0, `${result.scenario}: first-page execution offset`);
                assert.equal(Number(result.payload?.source?.queryExecutionPageLimit), Number(group.pagination?.limit), `${result.scenario}: first-page execution limit`);
              } else {
                assert.equal(Number(result.payload?.source?.queryExecutionRetainedRecords || 0), Number(group.count || 0), `${result.scenario}: deep page did not retain full compact snapshot`);
              }
          """
          if old_assert in text:
              text = text.replace(old_assert, new_assert, 1)
          elif 'first page retained full band' not in text:
              raise SystemExit('verifier retention assertion anchor not found')
          verifier.write_text(text, encoding='utf-8')

          audit = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          text = audit.read_text(encoding='utf-8')
          required_anchor = "  'async function executeAllBandsSequentially',"
          additions = """  'function compactRankedPage',
            '|current-page:${pageOffset}:${pageLimit}',
            '|full-snapshot',
            'const firstPageOnly = retainFullBand && pageOffset === 0;',
            "'compact-requested-band-current-page'",
            '} else if (compactBand.pagination) {',
          """
          if "'function compactRankedPage'" not in text:
              if required_anchor not in text:
                  raise SystemExit('audit API required anchor not found')
              text = text.replace(required_anchor, additions + required_anchor)
          verifier_anchor = "  \"expectedAllBandsPageCacheVersion = 'major-bands-all-bands-page-cache-v3990_0'\","
          verifier_addition = "  \"'compact-requested-band-current-page'\","
          if verifier_addition not in text:
              if verifier_anchor not in text:
                  raise SystemExit('audit verifier required anchor not found')
              text = text.replace(verifier_anchor, verifier_anchor + '\n' + verifier_addition)
          output_anchor = "  allBandRetentionMode: 'compact-current-page-per-band',"
          output_addition = "  requestedBandFirstPageRetentionMode: 'compact-requested-band-current-page',"
          if output_addition not in text:
              if output_anchor not in text:
                  raise SystemExit('audit output anchor not found')
              text = text.replace(output_anchor, output_anchor + '\n' + output_addition)
          audit.write_text(text, encoding='utf-8')
          PY

          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs

      - name: Verify first-page and deep-page contracts locally
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8794 --compatibility-date=2026-07-01 >/tmp/v3990-first-page-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8794/api/major-bands?candidateScore=508&rangePreset=standard&band=near&limit=37&offset=0' >/tmp/v3990-first-page.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          curl -fsS 'http://127.0.0.1:8794/api/major-bands?candidateScore=508&rangePreset=standard&band=near&limit=37&offset=80' >/tmp/v3990-deep-page.json
          curl -fsS 'http://127.0.0.1:8794/api/major-bands?candidateScore=579&rangePreset=standard&limit=37&offset=0' >/tmp/v3990-all-page.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const first=JSON.parse(fs.readFileSync('/tmp/v3990-first-page.json','utf8'));
          const deep=JSON.parse(fs.readFileSync('/tmp/v3990-deep-page.json','utf8'));
          const all=JSON.parse(fs.readFileSync('/tmp/v3990-all-page.json','utf8'));
          if(first?.source?.queryExecutionRetentionMode!=='compact-requested-band-current-page') throw new Error('first-page retention mode');
          if(first?.source?.queryExecutionRetainedRecords>37) throw new Error('first page retained full band');
          if(first?.bands?.near?.count!==1121||first?.bands?.near?.records?.length!==37) throw new Error('first-page truth');
          if(deep?.source?.queryExecutionRetentionMode!=='compact-requested-band-snapshot') throw new Error('deep-page retention mode');
          if(deep?.source?.queryExecutionRetainedRecords!==1121) throw new Error('deep page snapshot count');
          if(deep?.bands?.near?.pagination?.snapshot!==first?.bands?.near?.pagination?.snapshot) throw new Error('snapshot drift');
          if(all?.source?.allBandsExecutionMode!=='sequential-internal-band-requests-v3990_0') throw new Error('all-band mode');
          if(all?.bands?.upper?.records?.length>37||all?.bands?.near?.records?.length>37||all?.bands?.steady?.records?.length>37) throw new Error('all-band page retention');
          console.log(JSON.stringify({ok:true,firstRetained:first.source.queryExecutionRetainedRecords,deepRetained:deep.source.queryExecutionRetainedRecords,snapshot:first.bands.near.pagination.snapshot,allRetained:all.source.queryExecutionRetainedRecords},null,2));
          NODE

      - name: Commit bounded first-page compaction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/major-bands.js \
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs \
            tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          git diff --cached --check
          git commit -m 'perf(rank): compact only requested first pages'
          git push origin HEAD:agent/rank-kernel-v3990_0
