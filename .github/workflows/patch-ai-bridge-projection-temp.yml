name: Patch AI bridge projection temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-ai-bridge-projection-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded deterministic bridge projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('ai/app.v3990_1.js')
          text = app.read_text()
          old = "function compactMajorBandsToolPayload(data={}){const band=key=>({count:Number(data?.bands?.[key]?.count||0),records:Array.isArray(data?.bands?.[key]?.records)?data.bands[key].records.slice(0,24):[]});return{ok:Boolean(data.ok),meta:data.meta||{},counts:data.counts||{},bands:{upper:band('upper'),near:band('near'),steady:band('steady')},searchAdvices:Array.isArray(data.searchAdvices)?data.searchAdvices.slice(0,8):[],filterConflicts:Array.isArray(data.filterConflicts)?data.filterConflicts.slice(0,8):[],keywordWarnings:Array.isArray(data.keywordWarnings)?data.keywordWarnings.slice(0,8):[],source:data.source||{}};}"
          new = "const AI_BRIDGE_RECORD_FIELDS=Object.freeze(['id','school','major','score2026','rank2026','schoolCode2026','majorCode2026','displayLocation','city','province','projectLabel','bandKey','band','scoreDelta2026','rankGap2026','is985','is211','isSinoForeign','isHighFee','feeType','natureLabel','tuition']);\nfunction compactMajorBandsBridgeRecord(record={}){const out={};for(const key of AI_BRIDGE_RECORD_FIELDS){const value=record?.[key];if(value!==undefined&&value!==null&&value!=='')out[key]=value;}return out;}\nfunction compactMajorBandsToolPayload(data={}){const band=key=>({count:Number(data?.bands?.[key]?.count||0),records:Array.isArray(data?.bands?.[key]?.records)?data.bands[key].records.slice(0,16).map(compactMajorBandsBridgeRecord):[]});return{ok:Boolean(data.ok),meta:data.meta||{},counts:data.counts||{},bands:{upper:band('upper'),near:band('near'),steady:band('steady')},searchAdvices:Array.isArray(data.searchAdvices)?data.searchAdvices.slice(0,8):[],filterConflicts:Array.isArray(data.filterConflicts)?data.filterConflicts.slice(0,8):[],keywordWarnings:Array.isArray(data.keywordWarnings)?data.keywordWarnings.slice(0,8):[],source:data.source||{}};}"
          if text.count(old) != 1:
              raise SystemExit('app compact bridge source changed unexpectedly')
          text = text.replace(old, new)
          old_exec = "async function executeDeterministicTool(tool,controller){if(!tool||tool.kind!=='major_bands'||tool.method!=='GET'||typeof tool.key!=='string'||typeof tool.url!=='string'||tool.key!==tool.url||!tool.url.startsWith('/api/major-bands?'))throw new Error('确定性候选请求合同无效');const response=await fetch(tool.url,{method:'GET',headers:{accept:'application/json'},cache:'no-store',signal:controller.signal}),payload=await response.json().catch(()=>null);if(!response.ok||!payload?.ok)throw new Error(payload?.message||`候选事实查询失败（HTTP ${response.status}）`);return{kind:'major_bands',key:tool.key,url:tool.url,status:response.status,payload:compactMajorBandsToolPayload(payload)};}"
          new_exec = "async function executeDeterministicTool(tool,controller){if(!tool||tool.kind!=='major_bands'||tool.method!=='GET'||typeof tool.key!=='string'||typeof tool.url!=='string'||tool.key!==tool.url||!tool.url.startsWith('/api/major-bands?'))throw new Error('确定性候选请求合同无效');const response=await fetch(tool.url,{method:'GET',headers:{accept:'application/json'},cache:'no-store',signal:controller.signal}),payload=await response.json().catch(()=>null);if(!response.ok||!payload?.ok)throw new Error(payload?.message||`候选事实查询失败（HTTP ${response.status}）`);const compact=compactMajorBandsToolPayload(payload),bridgeBytes=new TextEncoder().encode(JSON.stringify(compact)).byteLength;if(bridgeBytes>80*1024)throw new Error('确定性候选桥接超过80KiB安全预算');return{kind:'major_bands',key:tool.key,url:tool.url,status:response.status,payload:compact};}"
          if text.count(old_exec) != 1:
              raise SystemExit('app deterministic executor source changed unexpectedly')
          app.write_text(text.replace(old_exec, new_exec))

          verifier = Path('tools/verify-ai-preview-tool-bridge-v3992_1.mjs')
          vtext = verifier.read_text()
          replacement = '''const AI_BRIDGE_RECORD_FIELDS = Object.freeze(['id','school','major','score2026','rank2026','schoolCode2026','majorCode2026','displayLocation','city','province','projectLabel','bandKey','band','scoreDelta2026','rankGap2026','is985','is211','isSinoForeign','isHighFee','feeType','natureLabel','tuition']);
          function compactBridgeRecord(record = {}) {
            const out = {};
            for (const key of AI_BRIDGE_RECORD_FIELDS) {
              const value = record?.[key];
              if (value !== undefined && value !== null && value !== '') out[key] = value;
            }
            return out;
          }
          function compactMajorBands(payload = {}) {
            const band = key => ({
              count: Number(payload?.bands?.[key]?.count || 0),
              records: Array.isArray(payload?.bands?.[key]?.records) ? payload.bands[key].records.slice(0, 16).map(compactBridgeRecord) : []
            });
            const compact = {
              ok: Boolean(payload.ok), meta: payload.meta || {}, counts: payload.counts || {},
              bands: { upper: band('upper'), near: band('near'), steady: band('steady') },
              searchAdvices: Array.isArray(payload.searchAdvices) ? payload.searchAdvices.slice(0, 8) : [],
              filterConflicts: Array.isArray(payload.filterConflicts) ? payload.filterConflicts.slice(0, 8) : [],
              keywordWarnings: Array.isArray(payload.keywordWarnings) ? payload.keywordWarnings.slice(0, 8) : [],
              source: payload.source || {}
            };
            const bytes = Buffer.byteLength(JSON.stringify(compact), 'utf8');
            assert.ok(bytes <= 80 * 1024, `deterministic bridge payload exceeded 80KiB: ${bytes}`);
            return compact;
          }

          async function postTurn'''
          vtext2, count = re.subn(r"function compactMajorBands\(payload = \{\}\) \{.*?\n\}\n\nasync function postTurn", replacement, vtext, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('preview bridge verifier source changed unexpectedly')
          verifier.write_text(vtext2)
          PY
          node --check ai/app.v3990_1.js
          node --check tools/verify-ai-preview-tool-bridge-v3992_1.mjs
          git rm .github/workflows/patch-ai-bridge-projection-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/app.v3990_1.js tools/verify-ai-preview-tool-bridge-v3992_1.mjs
          git commit -m 'fix: bound AI deterministic candidate bridge payload'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
