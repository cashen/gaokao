name: Repair temporary AI alias runner v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - name: Fix runner import anchor and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/agent-alias-provider-v3992-1.yml')
          s=p.read_text()
          old='s=s.replace("import {deterministicCommand,shouldShortCircuitAiProvider} from \'../functions/_lib/ai/command-interpreter.js\';","import {deterministicCommand,shouldShortCircuitAiProvider,resolveAiSchoolMentions} from \'../functions/_lib/ai/command-interpreter.js\';")'
          new='s=s.replace("import { deterministicCommand,interpretAiCommand,shouldShortCircuitAiProvider } from \'../functions/_lib/ai/command-interpreter.js\';","import { deterministicCommand,interpretAiCommand,shouldShortCircuitAiProvider,resolveAiSchoolMentions } from \'../functions/_lib/ai/command-interpreter.js\';")'
          if old not in s: raise SystemExit('temporary runner anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/agent-fix-alias-runner-v3992-1.yml
          git config user.name 'cashen'
          git config user.email '54cashen@gmail.com'
          git add .github/workflows/agent-alias-provider-v3992-1.yml
          git commit -m 'chore: repair temporary alias-provider import anchor'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
