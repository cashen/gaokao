name: Verify Tongxue school social labels v001

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'shared/resources/schools/school-social-labels.v001.js'
      - 'tongxue/app/tongxue-runtime-result-view-v159.js'
      - 'tools/verify-school-social-labels-v001.mjs'
      - 'tools/browser-tongxue-social-labels-v001.mjs'
      - '.github/workflows/verify-tongxue-social-labels-v001.yml'
  push:
    branches: [main]
    paths:
      - 'shared/resources/schools/school-social-labels.v001.js'
      - 'tongxue/app/tongxue-runtime-result-view-v159.js'
      - 'tools/verify-school-social-labels-v001.mjs'
      - 'tools/browser-tongxue-social-labels-v001.mjs'
      - '.github/workflows/verify-tongxue-social-labels-v001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          set -euo pipefail
          node --check shared/resources/schools/school-social-labels.v001.js
          node --check tongxue/app/tongxue-runtime-result-view-v159.js
          node --check tools/verify-school-social-labels-v001.mjs
          node --check tools/browser-tongxue-social-labels-v001.mjs
      - name: Source-derived relation contract
        run: node tools/verify-school-social-labels-v001.mjs

  browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verified Chromium
        run: bash .github/scripts/install-playwright-chromium.sh
      - name: Start static preview
        run: nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gaokao-social-labels-http.log 2>&1 &
      - name: Browser regression 390px
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tools/browser-tongxue-social-labels-v001.mjs
