name: Verify unified resource graph v3990.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resource-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify protected paths and changed source syntax
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git diff --name-only "$base" HEAD | tee /tmp/v3990-1-resource-files.txt
            if [ "$(git ls-tree -r "$base" | wc -l)" -ge 100 ] && grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3990-1-resource-files.txt; then exit 1; fi
          fi
          git diff --name-only '${{ github.event.pull_request.base.sha || github.event.before }}' HEAD -- '*.js' '*.mjs' 2>/dev/null | while IFS= read -r file; do [ -f "$file" ] && node --check "$file"; done
          node --check shared/resources/release/current-release.js
          node --check shared/resources/release/site-runtime-contract.v3990_2.js
          node --check shared/resources/release/runtime-cache-contract.v3990_2.js
          node --check shared/resources/release/release-presenter.v3990_2.js
          node --check shared/resources/resource-registry.js
          node --check shared/ui/ui-resource-registry.v3990_2.js
          node --check shared/ui/interaction/interaction-transaction.v3990_2.js
          node --check shared/governance/resource-execution-contract.v3990_2.js
          node --check ln-rank/js/app.v3990_2.js
          node --check ln-rank/js/app-runtime.v3990_2.js
          node --check ln-rank/js/workspace/selection-workspace-orchestrator.v3990_2.js
          node --check ln-rank/js/self-check.v3990_2.js
          node --check tools/audit-canonical-release-version-v3990_2.mjs
          node --check tools/audit-site-runtime-generation-v3990_2.mjs
          node --check tools/audit-unified-resource-graph-v3990_2.mjs
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js

      - name: Verify canonical release, runtime and resource owners
        run: |
          set -euo pipefail
          test ! -e ln-rank/active-assets.json
          test ! -e ln-rank/release-meta.json
          test ! -e .github/workflows/write-v3969-active-metadata.yml
          node tools/audit-canonical-release-version-v3990_2.mjs | tee /tmp/v3990-1-canonical.out
          node tools/audit-site-runtime-generation-v3990_2.mjs | tee /tmp/v3990-1-runtime.out
          node tools/audit-unified-resource-graph-v3990_2.mjs | tee /tmp/v3990-1-resource.out

      - name: Reject device-specific fixes and pre-activation DOM coupling
        run: |
          set -euo pipefail
          if grep -E 'navigator\.userAgent|Alook|Aluc|MiuiBrowser|HuaweiBrowser' shared/ui/interaction/interaction-transaction.v3990_2.js; then
            echo 'device or browser name branch found in interaction owner'
            exit 1
          fi
          if grep -E 'setNavigationAvailability\(|action\.disabled\s*=|container\.inert\s*=|pointer-events:\s*none' \
            shared/ui/interaction/interaction-transaction.v3990_2.js \
            shared/ui/interaction/interaction-transaction.v3990_2.css; then
            echo 'native chooser activation still mutates unrelated hit targets'
            exit 1
          fi
          test "$(grep -c "document.addEventListener('pointerdown'" shared/ui/interaction/interaction-transaction.v3990_2.js)" -eq 1
          grep -q 'if (HAS_POINTER_EVENTS)' shared/ui/interaction/interaction-transaction.v3990_2.js
          grep -q 'state.activationTimer = globalThis.setTimeout' shared/ui/interaction/interaction-transaction.v3990_2.js

      - name: Smoke-test current graph over HTTP
        run: |
          set -euo pipefail
          python3 -m http.server 8794 >/tmp/v3990-1-resource-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error 'http://127.0.0.1:8794/shared/resources/release/current-release.js' >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-1-resource-http.log; exit 1; fi
          for path in \
            /shared/resources/release/current-release.js \
            /shared/resources/release/site-runtime-contract.v3990_2.js \
            /shared/resources/release/runtime-cache-contract.v3990_2.js \
            /shared/resources/resource-registry.js \
            /shared/ui/ui-resource-registry.v3990_2.js \
            /shared/ui/interaction/interaction-transaction.v3990_2.js \
            /shared/ui/interaction/interaction-transaction.v3990_2.css \
            /shared/governance/resource-execution-contract.v3990_2.js \
            /ln-rank/site-active-generation.v3990_2.json \
            /ln-rank/js/app.v3990_2.js \
            /ln-rank/js/app-runtime.v3990_2.js \
            /ln-rank/js/workspace/selection-workspace-orchestrator.v3990_2.js \
            /ln-rank/self-check.html \
            /ln-rank/js/self-check.v3990_2.js \
            /ln-rank/; do
            curl --fail --silent --show-error "http://127.0.0.1:8794$path" >/dev/null
          done
          for retired in /ln-rank/active-assets.json /ln-rank/release-meta.json; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8794$retired")"
            test "$status" = '404'
          done

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-1-unified-resource-graph
          path: /tmp/v3990-1-*
          if-no-files-found: warn
          retention-days: 7
