name: One-time v3990 canonical all-bands edge cache

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-allbands-edge-cache.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply canonical cross-isolate all-bands cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')
          api = replace_once(
              api,
              "export const MAJOR_BANDS_ALL_BANDS_PAGE_LIMIT_CAP = 16;\nconst BAND_KEYS",
              "export const MAJOR_BANDS_ALL_BANDS_PAGE_LIMIT_CAP = 16;\nexport const MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION = 'major-bands-all-bands-edge-cache-canonical-v3990_0';\nconst ALL_BANDS_EDGE_CACHE_TTL_SECONDS = 60;\nconst BAND_KEYS",
              'edge cache constants'
          )
          api = replace_once(
              api,
              "function allBandsResponse(execution) {",
              "function allBandsEdgeCacheHandle() {\n  const cache = globalThis.caches?.default;\n  return cache && typeof cache.match === 'function' && typeof cache.put === 'function' ? cache : null;\n}\n\nfunction allBandsEdgeCacheRequest(sourceUrl, input) {\n  const url = new URL(sourceUrl);\n  url.searchParams.delete('stress');\n  url.searchParams.delete('deploy');\n  url.searchParams.delete('band');\n  url.searchParams.set('limit', String(input.pageLimit));\n  url.searchParams.set('__requestedLimit', String(input.requestedPageLimit));\n  url.searchParams.set('__edgeCache', MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION);\n  url.searchParams.sort();\n  return new Request(url.toString(), { method: 'GET' });\n}\n\nfunction responseWithAllBandsEdgeCacheStatus(response, status) {\n  const headers = new Headers(response.headers);\n  headers.set('x-gaokao-all-bands-edge-cache', status);\n  headers.set('x-gaokao-all-bands-edge-cache-version', MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION);\n  return new Response(response.body, {\n    status: response.status,\n    statusText: response.statusText,\n    headers\n  });\n}\n\nasync function readAllBandsEdgeCache(cache, request) {\n  try {\n    return await cache.match(request);\n  } catch {\n    return null;\n  }\n}\n\nasync function writeAllBandsEdgeCache(cache, request, execution) {\n  try {\n    await cache.put(request, allBandsResponse(execution, 'stored'));\n    return true;\n  } catch {\n    return false;\n  }\n}\n\nfunction allBandsResponse(execution, edgeCacheStatus = 'unavailable') {",
              'edge cache helpers'
          )
          api = replace_once(
              api,
              "      'x-gaokao-all-bands-page-cache': execution.cacheStatus",
              "      'x-gaokao-all-bands-page-cache': execution.cacheStatus,\n      'x-gaokao-all-bands-edge-cache': edgeCacheStatus,\n      'x-gaokao-all-bands-edge-cache-version': MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION",
              'edge cache response headers'
          )
          api = replace_once(
              api,
              "async function executeAllBandsSequentially(context, sourceUrl, input) {\n  const execution = await executeMajorBandsAllBandsPageOnce(allBandsPageIdentity(input), async () => {",
              "async function executeAllBandsSequentially(context, sourceUrl, input) {\n  const edgeCache = allBandsEdgeCacheHandle();\n  const edgeCacheRequest = edgeCache ? allBandsEdgeCacheRequest(sourceUrl, input) : null;\n  if (edgeCache && edgeCacheRequest) {\n    const cached = await readAllBandsEdgeCache(edgeCache, edgeCacheRequest);\n    if (cached) return responseWithAllBandsEdgeCacheStatus(cached, 'hit');\n  }\n\n  const execution = await executeMajorBandsAllBandsPageOnce(allBandsPageIdentity(input), async () => {",
              'edge cache read path'
          )
          api = replace_once(
              api,
              "      allBandsPageCacheVersion: MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n      allBandsSharedProjectionVersion:",
              "      allBandsPageCacheVersion: MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n      allBandsEdgeCacheVersion: MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION,\n      allBandsEdgeCacheCanonicalKey: true,\n      allBandsEdgeCacheTtlSeconds: ALL_BANDS_EDGE_CACHE_TTL_SECONDS,\n      allBandsSharedProjectionVersion:",
              'edge cache source telemetry'
          )
          api = replace_once(
              api,
              "  });\n  return allBandsResponse(execution);\n}\n\nasync function executeRequestedBandOrderedPage",
              "  });\n  const response = allBandsResponse(execution, edgeCache ? 'miss' : 'unavailable');\n  if (edgeCache && edgeCacheRequest && execution.status === 200) {\n    const stored = await writeAllBandsEdgeCache(edgeCache, edgeCacheRequest, execution);\n    if (!stored) return responseWithAllBandsEdgeCacheStatus(response, 'write-failed');\n  }\n  return response;\n}\n\nasync function executeRequestedBandOrderedPage",
              'edge cache write path'
          )
          api_path.write_text(api, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          verifier = replace_once(
              verifier,
              "const expectedAllBandsPageLimitCap = 16;",
              "const expectedAllBandsPageLimitCap = 16;\nconst expectedAllBandsEdgeCacheVersion = 'major-bands-all-bands-edge-cache-canonical-v3990_0';",
              'verifier edge cache constant'
          )
          verifier = replace_once(
              verifier,
              "      cloudflare1102: false\n    };",
              "      cloudflare1102: false,\n      allBandsEdgeCacheStatus: ''\n    };",
              'fetch error cache status'
          )
          verifier = replace_once(
              verifier,
              "    cloudflare1102,\n    payload,",
              "    cloudflare1102,\n    allBandsEdgeCacheStatus: response.headers.get('x-gaokao-all-bands-edge-cache') || '',\n    allBandsEdgeCacheVersion: response.headers.get('x-gaokao-all-bands-edge-cache-version') || '',\n    payload,",
              'response edge cache headers'
          )
          verifier = replace_once(
              verifier,
              "    assert.equal(Number(result.payload?.source?.allBandsPageLimitCap), expectedAllBandsPageLimitCap, `${result.scenario}: all-band page limit cap`);",
              "    assert.equal(Number(result.payload?.source?.allBandsPageLimitCap), expectedAllBandsPageLimitCap, `${result.scenario}: all-band page limit cap`);\n    assert.equal(result.payload?.source?.allBandsEdgeCacheVersion, expectedAllBandsEdgeCacheVersion, `${result.scenario}: all-band edge cache deployment`);\n    assert.equal(result.payload?.source?.allBandsEdgeCacheCanonicalKey, true, `${result.scenario}: all-band cache key is not canonical`);\n    assert.equal(result.allBandsEdgeCacheVersion, expectedAllBandsEdgeCacheVersion, `${result.scenario}: all-band edge cache header version`);\n    assert.ok(['hit', 'miss', 'unavailable', 'write-failed'].includes(result.allBandsEdgeCacheStatus), `${result.scenario}: invalid all-band edge cache status ${result.allBandsEdgeCacheStatus}`);",
              'verifier edge cache contract'
          )
          verifier = replace_once(
              verifier,
              "  validateResult(allResult);\n  const bandResults = {};",
              "  validateResult(allResult);\n  const edgeCacheProbe = await requestScenario(allScenario, `equivalence-edge-hit-${Date.now()}`);\n  validateResult(edgeCacheProbe);\n  if (base.startsWith('https://')) {\n    assert.equal(edgeCacheProbe.allBandsEdgeCacheStatus, 'hit', 'all-band canonical edge cache did not serve semantic repeat');\n  }\n  const bandResults = {};",
              'edge cache repeat probe'
          )
          verifier = replace_once(
              verifier,
              "    mode: expectedAllBandsExecutionMode,\n    bands:",
              "    mode: expectedAllBandsExecutionMode,\n    edgeCacheStatus: edgeCacheProbe.allBandsEdgeCacheStatus,\n    bands:",
              'edge cache evidence'
          )
          verifier_path.write_text(verifier, encoding='utf-8')

          cache_audit_path = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          cache_audit = cache_audit_path.read_text(encoding='utf-8')
          cache_audit = replace_once(
              cache_audit,
              "  'allBandsEffectivePageLimit: input.pageLimit',",
              "  'allBandsEffectivePageLimit: input.pageLimit',\n  \"MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION = 'major-bands-all-bands-edge-cache-canonical-v3990_0'\",\n  \"url.searchParams.delete('stress')\",\n  \"url.searchParams.delete('deploy')\",\n  \"cache.put(request, allBandsResponse(execution, 'stored'))\",",
              'query cache edge markers'
          )
          cache_audit_path.write_text(cache_audit, encoding='utf-8')

          resource_audit_path = Path('tools/audit-production-resource-verification-v3990_0.mjs')
          resource_audit = resource_audit_path.read_text(encoding='utf-8')
          resource_audit = replace_once(
              resource_audit,
              "  'allBandsEffectivePageLimit: input.pageLimit'",
              "  'allBandsEffectivePageLimit: input.pageLimit',\n  \"MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION = 'major-bands-all-bands-edge-cache-canonical-v3990_0'\",\n  \"url.searchParams.delete('stress')\",\n  \"url.searchParams.delete('deploy')\",\n  \"cache.put(request, allBandsResponse(execution, 'stored'))\"",
              'production edge markers'
          )
          resource_audit_path.write_text(resource_audit, encoding='utf-8')

          rank_workflow_path = Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml')
          rank_workflow = rank_workflow_path.read_text(encoding='utf-8')
          rank_workflow = replace_once(
              rank_workflow,
              "          grep -q \"expectedAllBandsPageLimitCap = 16\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs",
              "          grep -q \"expectedAllBandsPageLimitCap = 16\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs\n          grep -q \"MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION = 'major-bands-all-bands-edge-cache-canonical-v3990_0'\" functions/api/major-bands.js\n          grep -q \"url.searchParams.delete('stress')\" functions/api/major-bands.js\n          grep -q \"url.searchParams.delete('deploy')\" functions/api/major-bands.js\n          grep -q \"edgeCacheProbe.allBandsEdgeCacheStatus, 'hit'\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs",
              'rank workflow edge gates'
          )
          rank_workflow_path.write_text(rank_workflow, encoding='utf-8')

          prod_workflow_path = Path('.github/workflows/verify-production-api-health-v3971.yml')
          prod_workflow = prod_workflow_path.read_text(encoding='utf-8')
          prod_workflow = replace_once(
              prod_workflow,
              "          grep -q \"allBandsEffectivePageLimit\" functions/api/major-bands.js",
              "          grep -q \"allBandsEffectivePageLimit\" functions/api/major-bands.js\n          grep -q \"MAJOR_BANDS_ALL_BANDS_EDGE_CACHE_VERSION = 'major-bands-all-bands-edge-cache-canonical-v3990_0'\" functions/api/major-bands.js\n          grep -q \"url.searchParams.delete('stress')\" functions/api/major-bands.js\n          grep -q \"url.searchParams.delete('deploy')\" functions/api/major-bands.js",
              'production workflow edge gates'
          )
          prod_workflow_path.write_text(prod_workflow, encoding='utf-8')
          PY

      - name: Verify syntax, ownership and full rank truth
        run: |
          set -euo pipefail
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-major-bands-request-band-scope-v3990_0.mjs
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/v3990-edge-cache-rank-audit.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_0.mjs

      - name: Verify local Pages pressure and semantic equivalence
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8798 --compatibility-date=2026-07-01 >/tmp/v3990-edge-cache-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --max-time 20 'http://127.0.0.1:8798/api/major-bands?candidateScore=579&rangePreset=standard&limit=37' || true)"
            if grep -q '"allBandsEdgeCacheVersion":"major-bands-all-bands-edge-cache-canonical-v3990_0"' <<<"$body" \
              && grep -q '"allBandsEffectivePageLimit":16' <<<"$body"; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          TARGET_BASE=http://127.0.0.1:8798 \
          CONCURRENCY_LEVELS=1,5,10,25,50 \
          CONCURRENCY_WAVES=2 \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE=/tmp/v3990-edge-cache-local-pressure.json \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          kill "$worker_pid" 2>/dev/null || true
          wait "$worker_pid" 2>/dev/null || true
          trap - EXIT

      - name: Commit verified edge cache and remove staging workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-time-v3990-allbands-edge-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/major-bands.js \
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs \
            tools/audit-major-bands-query-execution-cache-v3990_0.mjs \
            tools/audit-production-resource-verification-v3990_0.mjs \
            .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml \
            .github/workflows/verify-production-api-health-v3971.yml \
            .github/workflows/zz-one-time-v3990-allbands-edge-cache.yml
          git commit -m 'perf(rank): cache canonical all-bands pages at edge'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload edge-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-allbands-edge-cache-evidence
          path: |
            /tmp/v3990-edge-cache-rank-audit.json
            /tmp/v3990-edge-cache-local-pressure.json
            /tmp/v3990-edge-cache-wrangler.log
          if-no-files-found: warn
          retention-days: 7
