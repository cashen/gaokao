name: Bootstrap LN v3.9.52.0 source

on:
  push:
    branches:
      - agent/ln-rank-human-difficulty-v3952
    paths:
      - '.bootstrap/v3952-rpart-*'
      - '.github/workflows/bootstrap-ln-v3952.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/v3952-rpart-*'
      - '.github/workflows/bootstrap-ln-v3952.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Decode and verify archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v3952-remain.tar.gz
          for part in .bootstrap/v3952-rpart-*; do
            echo "decoding ${part} ($(wc -c < "${part}") bytes)"
            base64 --decode "${part}" >> /tmp/v3952-remain.tar.gz
          done
          echo "archive bytes: $(wc -c < /tmp/v3952-remain.tar.gz)"
          gzip -t /tmp/v3952-remain.tar.gz
          tar -tzf /tmp/v3952-remain.tar.gz
      - name: Extract and commit sources
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v3952-remain.tar.gz
          git checkout -- .github/workflows/verify-ln-2026-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ln-rank tools
          if git diff --cached --quiet; then
            echo 'No materialization changes required.'
            exit 0
          fi
          git commit -m 'Materialize LN v3.9.52.0 reviewed sources'
      - name: Push materialized sources
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
