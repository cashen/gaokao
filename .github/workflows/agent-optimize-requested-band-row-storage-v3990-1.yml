name: Temporary requested-band row storage optimizer v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-optimize-requested-band-row-storage-v3990-1.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Serialize cold requested-band raw rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          api = Path('functions/api/major-bands.js')
          text = api.read_text()
          marker = "        projection: minimalOrderProjection ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined"
          replacement = marker + ",\n        rawRowStorage: minimalOrderProjection ? 'serialized-json' : undefined"
          if text.count(marker) != 1:
              raise SystemExit(f'cold requested-band projection anchor count={text.count(marker)}')
          api.write_text(text.replace(marker, replacement, 1))
          verify = Path('tools/verify-major-bands-preview-concurrency-v3990_1.mjs')
          v = verify.read_text()
          marker2 = "        ? 'array-reference'"
          replacement2 = "        ? 'serialized-json'"
          if v.count(marker2) != 1:
              raise SystemExit(f'verifier raw storage anchor count={v.count(marker2)}')
          verify.write_text(v.replace(marker2, replacement2, 1))
          PY
          git diff --check
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_1.mjs >/tmp/major-bands-audit.log
          tail -n 40 /tmp/major-bands-audit.log
          git diff -- functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
      - name: Commit tested storage optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          git commit -m "perf: serialize cold requested-band raw rows"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
