name: Temporary requested-band row storage optimizer v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-optimize-requested-band-row-storage-v3990-1.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Serialize cold requested-band raw rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api = Path('functions/api/major-bands.js')
          text = api.read_text()
          old = """      const loaded = await loadMajorBandsRankWindow(context, selected, {
        projection: minimalOrderProjection ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined
      });"""
          new = """      const loaded = await loadMajorBandsRankWindow(context, selected, {
        projection: minimalOrderProjection ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined,
        rawRowStorage: minimalOrderProjection ? 'serialized-json' : undefined
      });"""
          if text.count(old) != 1:
              raise SystemExit(f'cold requested-band load anchor count={text.count(old)}')
          api.write_text(text.replace(old, new, 1))

          verify = Path('tools/verify-major-bands-preview-concurrency-v3990_1.mjs')
          v = verify.read_text()
          old_storage = """    result.payload?.source?.requestedBandOrderPageSource === 'all-bands-shared-projection'
      ? 'serialized-json'
      : result.payload?.source?.requestedBandOrderPageSource === 'raw-row-reuse'
        ? 'array-reference'
        : 'full-record',"""
          new_storage = """    ['all-bands-shared-projection', 'raw-row-reuse'].includes(result.payload?.source?.requestedBandOrderPageSource)
      ? 'serialized-json'
      : 'full-record',"""
          if v.count(old_storage) != 1:
              raise SystemExit(f'verifier raw storage anchor count={v.count(old_storage)}')
          verify.write_text(v.replace(old_storage, new_storage, 1))
          PY
          git diff --check
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_1.mjs >/tmp/major-bands-audit.log
          grep -q '"fullTruthEqual": true' /tmp/major-bands-audit.log
          grep -q '"selectiveTruthEqual": true' /tmp/major-bands-audit.log
          grep -q '"ok":true' /tmp/major-bands-audit.log
          git diff -- functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
      - name: Commit tested storage optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/major-bands.js tools/verify-major-bands-preview-concurrency-v3990_1.mjs
          git commit -m "perf: serialize cold requested-band raw rows"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
