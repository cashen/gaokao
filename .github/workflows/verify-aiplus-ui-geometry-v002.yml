name: Verify AIPLuS UI geometry v0.02

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'aiplus/**'
      - '.github/scripts/install-playwright-chromium.sh'
      - 'tools/verify-aiplus-ui-geometry-v002.mjs'
      - 'tools/browser-aiplus-ui-geometry-v002.mjs'
      - 'tools/verify-aiplus-conversation-scroll-v002.mjs'
      - '.github/workflows/verify-aiplus-ui-geometry-v002.yml'
  push:
    branches: [main]
    paths:
      - 'aiplus/**'
      - '.github/scripts/install-playwright-chromium.sh'
      - 'tools/verify-aiplus-ui-geometry-v002.mjs'
      - 'tools/browser-aiplus-ui-geometry-v002.mjs'
      - 'tools/verify-aiplus-conversation-scroll-v002.mjs'
      - '.github/workflows/verify-aiplus-ui-geometry-v002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce protected paths on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1 || true
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | tee /tmp/aiplus-ui-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/aiplus-ui-files.txt; then
            echo 'Protected path touched by AIPLuS UI geometry change.' >&2
            exit 1
          fi
      - name: Verify geometry source contract
        run: |
          set -euo pipefail
          node --check tools/verify-aiplus-ui-geometry-v002.mjs
          node --check tools/browser-aiplus-ui-geometry-v002.mjs
          node --check tools/verify-aiplus-conversation-scroll-v002.mjs
          node tools/verify-aiplus-ui-geometry-v002.mjs
          node tools/verify-aiplus-conversation-scroll-v002.mjs

  geometry-browser:
    needs: geometry-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verified Chromium journey runner
        run: bash .github/scripts/install-playwright-chromium.sh
      - name: Verify PC Pad Android responsive geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/aiplus-ui-geometry-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          AIPLUS_GEOMETRY_BASE=http://127.0.0.1:8765 node tools/browser-aiplus-ui-geometry-v002.mjs
      - name: Upload geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiplus-ui-geometry-v002
          path: |
            /tmp/aiplus-ui-geometry
            /tmp/aiplus-ui-geometry-http.log
          if-no-files-found: warn
          retention-days: 7