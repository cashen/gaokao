name: Apply v3962 release migration

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate-release:
    if: github.head_ref == 'feat/v3.9.62-school-all-majors'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply synchronized release metadata
        run: python3 tools/release/apply-v3962-release.py
      - name: Validate generated changes
        run: |
          git diff --check
          python3 -m json.tool ln-rank/active-assets.json >/dev/null
          python3 -m json.tool ln-rank/release-meta.json >/dev/null
          node --check ln-rank/js/app.v3961_0.js
          node --check ln-rank/js/feature/school-majors/school-all-mode.v3962_0.js
      - name: Commit release synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No release synchronization changes needed'
            exit 0
          fi
          git commit -m 'release: publish v3.9.62.0 school-all majors'
          git push origin HEAD:${{ github.head_ref }}
