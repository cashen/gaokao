name: Patch AI school history bridge temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-ai-school-history-bridge-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Move school history facts outside AI Worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          tool = Path('functions/_lib/ai/tool-registry.js')
          text = tool.read_text()
          static_import = "import { queryAiSchoolHistory, AI_SCHOOL_HISTORY_RESOURCE_ADAPTER_VERSION } from './school-history-adapter.js';\n"
          if text.count(static_import) != 1:
              raise SystemExit('school-history static import anchor changed')
          text = text.replace(static_import, '')
          old_ver = "export const AI_SCHOOL_HISTORY_ADAPTER_VERSION=AI_SCHOOL_HISTORY_RESOURCE_ADAPTER_VERSION;"
          new_ver = "export const AI_SCHOOL_HISTORY_ADAPTER_VERSION='ai-school-history-browser-bridge-v3992_2';"
          if text.count(old_ver) != 1:
              raise SystemExit('school-history adapter version anchor changed')
          text = text.replace(old_ver, new_ver)

          anchor = "function majorBandsClientToolRequest(request){const key=majorBandsToolKey(request);return{kind:'major_bands',key,url:key,method:'GET',headers:{accept:'application/json'},bridgeVersion:AI_DETERMINISTIC_TOOL_BRIDGE_VERSION};}\n"
          addition = """function requestForSchoolHistory(context,{school,majorKeyword='',candidateScore=null}={}){const sourceUrl=new URL(context.request.url),url=new URL('/api/school-majors',sourceUrl.origin);url.searchParams.set('school',clean(school,120));url.searchParams.set('schoolIntent','school');url.searchParams.set('offset','0');url.searchParams.set('limit','100');url.searchParams.set('sort',Number.isFinite(Number(candidateScore))?'position-near':'score-desc');if(majorKeyword)url.searchParams.set('majorKeyword',clean(majorKeyword,160));if(Number.isFinite(Number(candidateScore)))url.searchParams.set('candidateScore',String(Math.round(Number(candidateScore))));return new Request(url.toString(),{method:'GET',headers:{accept:'application/json'}});}
function schoolHistoryToolKey(request){const url=new URL(request.url);return `${url.pathname}${url.search}`;}
function schoolHistoryClientToolRequest(request){const key=schoolHistoryToolKey(request);return{kind:'school_history',key,url:key,method:'GET',headers:{accept:'application/json'},bridgeVersion:AI_DETERMINISTIC_TOOL_BRIDGE_VERSION};}
function delegatedSchoolHistoryEntry(context,request){const key=schoolHistoryToolKey(request),entry=context?.aiDeterministicToolResults?.[key];if(!entry)return{ok:false,code:'client_tool_required',toolRequest:schoolHistoryClientToolRequest(request)};if(entry.kind!=='school_history'||entry.key!==key||entry.url!==key)return{ok:false,code:'client_tool_invalid',message:'学校历史事实回传与本轮请求不匹配。'};const status=Number(entry.status),payload=entry.payload;if(!Number.isFinite(status)||!payload||typeof payload!=='object')return{ok:false,code:'client_tool_invalid',message:'学校历史事实回传格式不完整。'};return{ok:true,status,payload};}
"""
          if text.count(anchor) != 1:
              raise SystemExit('major bridge anchor changed')
          text = text.replace(anchor, anchor + addition)

          old_history = """export async function runSchoolMajorHistory(context,{school,majorKeyword=''}={}){
  if(!school)return{ok:false,code:'school_required',message:'需要先明确一所学校。'};
  const payload=await queryAiSchoolHistory(context,{school,majorKeyword,candidateScore:null,limit:100});if(!payload.ok)return payload;
  return{ok:true,school:payload.school||school,majorKeyword:clean(majorKeyword,160),records:(payload.records||[]).map(historyRecord),summary:payload.summary||{},meta:payload.meta||{},source:payload.source||{},adapterVersion:AI_SCHOOL_HISTORY_ADAPTER_VERSION,scoreUsed:false,boundary:'只展示辽宁2026物理类实际投档记录；本轮不使用考生分数筛选。'};
}
export async function runFitAssessment(context,{school,majorKeyword='',score}={}){
  const numeric=Math.round(Number(score));if(!Number.isFinite(numeric))return{ok:false,code:'score_required',message:'需要已知参考分数才能判断当前可达性。'};
  const payload=await queryAiSchoolHistory(context,{school,majorKeyword,candidateScore:numeric,limit:100});if(!payload.ok)return payload;
  const records=(payload.records||[]).map(historyRecord),nearest=payload.summary?.nearestRecord||null;
  return{ok:true,school:payload.school||school,majorKeyword:clean(majorKeyword,160),candidateScore:numeric,candidateRank:payload.meta?.candidateReferenceRank2026||null,records,nearest,summary:payload.summary||{},meta:payload.meta||{},source:payload.source||{},adapterVersion:AI_SCHOOL_HISTORY_ADAPTER_VERSION,boundary:'只比较2026辽宁物理类历史投档位置，不预测2027录取结果。'};
}
"""
          new_history = """export async function runSchoolMajorHistory(context,{school,majorKeyword=''}={}){
  if(!school)return{ok:false,code:'school_required',message:'需要先明确一所学校。'};
  const request=requestForSchoolHistory(context,{school,majorKeyword,candidateScore:null}),delegated=delegatedSchoolHistoryEntry(context,request);if(!delegated.ok)return delegated;const{status,payload}=delegated;if(status<200||status>=300||!payload?.ok)return{ok:false,status,message:clean(payload?.message||'学校历史查询失败。',260)};
  return{ok:true,school:payload?.meta?.school||school,majorKeyword:clean(majorKeyword,160),records:(payload.records||[]).map(historyRecord),summary:payload.summary||{},meta:payload.meta||{},source:payload.source||{},adapterVersion:AI_SCHOOL_HISTORY_ADAPTER_VERSION,scoreUsed:false,boundary:'只展示辽宁2026物理类实际投档记录；学校历史事实由公开 school-majors 确定性接口执行，本轮不使用考生分数筛选。'};
}
export async function runFitAssessment(context,{school,majorKeyword='',score}={}){
  const numeric=Math.round(Number(score));if(!Number.isFinite(numeric))return{ok:false,code:'score_required',message:'需要已知参考分数才能判断当前可达性。'};
  const request=requestForSchoolHistory(context,{school,majorKeyword,candidateScore:numeric}),delegated=delegatedSchoolHistoryEntry(context,request);if(!delegated.ok)return delegated;const{status,payload}=delegated;if(status<200||status>=300||!payload?.ok)return{ok:false,status,message:clean(payload?.message||'学校历史查询失败。',260)};const records=(payload.records||[]).map(historyRecord),nearest=payload.summary?.nearestRecord||null;
  return{ok:true,school:payload?.meta?.school||school,majorKeyword:clean(majorKeyword,160),candidateScore:numeric,candidateRank:payload.meta?.candidateReferenceRank2026||null,records,nearest,summary:payload.summary||{},meta:payload.meta||{},source:payload.source||{},adapterVersion:AI_SCHOOL_HISTORY_ADAPTER_VERSION,boundary:'只比较2026辽宁物理类历史投档位置，不预测2027录取结果；事实查询在独立确定性 school-majors 请求中执行。'};
}
"""
          if text.count(old_history) != 1:
              raise SystemExit('school history function anchor changed')
          text = text.replace(old_history, new_history)
          tool.write_text(text)

          orchestrator = Path('functions/_lib/ai/turn-orchestrator.js')
          otext = orchestrator.read_text()
          old_pending = "function pendingDeterministicTool(result={}){for(const value of [result.candidates,result.background,result.comparison])if(value?.code==='client_tool_required'||value?.code==='client_tool_invalid')return value;return null;}"
          new_pending = "function pendingDeterministicTool(result={}){for(const value of [result.candidates,result.history,result.fit,result.background,result.comparison])if(value?.code==='client_tool_required'||value?.code==='client_tool_invalid')return value;return null;}"
          if otext.count(old_pending) != 1:
              raise SystemExit('pending deterministic tool anchor changed')
          orchestrator.write_text(otext.replace(old_pending,new_pending))

          app = Path('ai/app.v3990_1.js')
          atext = app.read_text()
          old_compact = "function compactMajorBandsToolPayload(data={}){const band=key=>({count:Number(data?.bands?.[key]?.count||0),records:Array.isArray(data?.bands?.[key]?.records)?data.bands[key].records.slice(0,16).map(compactMajorBandsBridgeRecord):[]});return{ok:Boolean(data.ok),meta:data.meta||{},counts:data.counts||{},bands:{upper:band('upper'),near:band('near'),steady:band('steady')},searchAdvices:Array.isArray(data.searchAdvices)?data.searchAdvices.slice(0,8):[],filterConflicts:Array.isArray(data.filterConflicts)?data.filterConflicts.slice(0,8):[],keywordWarnings:Array.isArray(data.keywordWarnings)?data.keywordWarnings.slice(0,8):[],source:data.source||{}};}"
          new_compact = old_compact + "\nfunction compactSchoolHistoryToolPayload(data={}){const meta=data?.meta||{},source=data?.source||{},summary=data?.summary||{};return{ok:Boolean(data.ok),meta:{school:meta.school||'',candidateScore:Number.isFinite(Number(meta.candidateScore))?Number(meta.candidateScore):null,candidateReferenceRank2026:Number.isFinite(Number(meta.candidateReferenceRank2026))?Number(meta.candidateReferenceRank2026):null,schoolRecordTotal:Number(meta.schoolRecordTotal||0),filteredTotal:Number(meta.filteredTotal||0),schoolQueryContractVersion:meta.schoolQueryContractVersion||'',admissionDirectoryVersion:meta.admissionDirectoryVersion||'',admissionDirectorySourceHash:meta.admissionDirectorySourceHash||''},summary,records:Array.isArray(data.records)?data.records.slice(0,100).map(compactMajorBandsBridgeRecord):[],source:{dataYear:Number(source.dataYear||2026),manifestVersion:source.manifestVersion||'',totalRecords:Number(source.totalRecords||0),rawScanned:Number(source.rawScanned||0),exactSchoolRecords:Number(source.exactSchoolRecords||0),mode:source.mode||''}};}"
          if atext.count(old_compact) != 1:
              raise SystemExit('compact major bands anchor changed')
          atext = atext.replace(old_compact,new_compact)
          start = atext.index("async function executeDeterministicTool(tool,controller){")
          end = atext.index("\nasync function executeTurn", start)
          old_exec = atext[start:end]
          new_exec = """function deterministicToolSpec(tool){if(!tool||tool.method!=='GET'||typeof tool.key!=='string'||typeof tool.url!=='string'||tool.key!==tool.url)return null;if(tool.kind==='major_bands'&&tool.url.startsWith('/api/major-bands?'))return{kind:'major_bands',budget:80*1024,compact:compactMajorBandsToolPayload,label:'候选事实'};if(tool.kind==='school_history'&&tool.url.startsWith('/api/school-majors?'))return{kind:'school_history',budget:48*1024,compact:compactSchoolHistoryToolPayload,label:'学校历史事实'};return null;}
function isWorkerResourceLimit(payload={}){return Number(payload?.error_code)===1102||payload?.error_name==='worker_exceeded_resources'||String(payload?.title||'').includes('Error 1102');}
async function executeDeterministicTool(tool,controller){const spec=deterministicToolSpec(tool);if(!spec)throw new Error('确定性事实请求合同无效');let lastError=null;for(let attempt=0;attempt<=DETERMINISTIC_RETRY_DELAYS.length;attempt+=1){try{const response=await fetch(tool.url,{method:'GET',headers:{accept:'application/json'},cache:'no-store',signal:controller.signal}),payload=await response.json().catch(()=>null);if(response.ok&&payload?.ok){const compact=spec.compact(payload),bridgeBytes=new TextEncoder().encode(JSON.stringify(compact)).byteLength;if(bridgeBytes>spec.budget)throw new Error(`${spec.label}桥接超过安全预算`);return{kind:spec.kind,key:tool.key,url:tool.url,status:response.status,payload:compact};}const error=new Error(payload?.message||payload?.detail||`${spec.label}查询失败（HTTP ${response.status}）`);error.status=response.status;error.workerResourceLimit=isWorkerResourceLimit(payload);if(error.workerResourceLimit||!DETERMINISTIC_TRANSIENT_STATUSES.has(response.status)||attempt===DETERMINISTIC_RETRY_DELAYS.length)throw error;lastError=error;}catch(error){if(controller.signal.aborted)throw error;const status=Number(error?.status||0),retryable=!error?.workerResourceLimit&&(status?DETERMINISTIC_TRANSIENT_STATUSES.has(status):error instanceof TypeError);if(!retryable||attempt===DETERMINISTIC_RETRY_DELAYS.length)throw error;lastError=error;}await deterministicRetryDelay(DETERMINISTIC_RETRY_DELAYS[attempt],controller.signal);}throw lastError||new Error(`${spec.label}查询失败`);}"
          app.write_text(atext[:start] + new_exec + atext[end:])

          boundary = Path('functions/_lib/ai/RESOURCE-BOUNDARY.md')
          btext = boundary.read_text()
          marker = "## School history\n\n"
          replacement = "## School history\n\nAI school-history turns do not parse the Liaoning admissions chunks inside `/api/ai/turn`. `tool-registry.js` emits a `school_history` deterministic browser tool request to the existing `/api/school-majors` contract. The browser returns only a bounded fact projection to the AI turn. This keeps the public deterministic endpoint as the one admissions algorithm/resource truth while preventing its large runtime graph and chunk parsing from becoming resident in the AI Worker.\n\nCloudflare Worker resource-limit responses (`1102`) are owner-action-required failures and are never retried as ordinary transient 503s.\n\n"
          if marker not in btext:
              raise SystemExit('resource boundary school history heading missing')
          # Replace only existing school-history intro paragraph block up to next heading.
          before, rest = btext.split(marker,1)
          if '\n## ' not in rest:
              raise SystemExit('resource boundary next heading missing')
          _, tail = rest.split('\n## ',1)
          boundary.write_text(before + replacement + '## ' + tail)

          verifier = Path('tools/verify-ai-school-history-bridge-v3992_2.mjs')
          verifier.write_text("""import fs from 'node:fs';
import assert from 'node:assert/strict';
const tool=fs.readFileSync('functions/_lib/ai/tool-registry.js','utf8');
const orchestrator=fs.readFileSync('functions/_lib/ai/turn-orchestrator.js','utf8');
const app=fs.readFileSync('ai/app.v3990_1.js','utf8');
assert.ok(!/import\\s+\\{[^}]*queryAiSchoolHistory[^}]*\\}\\s+from\\s+['\"]\\.\\/school-history-adapter\\.js['\"]/.test(tool),'AI base graph must not statically import school-history-adapter');
assert.ok(tool.includes("kind:'school_history'"),'school history deterministic tool kind missing');
assert.ok(tool.includes("new URL('/api/school-majors'"),'school history must reuse public deterministic school-majors endpoint');
assert.ok(tool.includes("url.searchParams.set('schoolIntent','school')"),'school history exact-school intent missing');
assert.ok(orchestrator.includes('result.history,result.fit'),'history/fit deterministic continuation missing');
assert.ok(app.includes("tool.kind==='school_history'&&tool.url.startsWith('/api/school-majors?')"),'browser school-history tool contract missing');
assert.ok(app.includes('budget:48*1024'),'school-history bridge byte budget missing');
assert.ok(app.includes('Number(payload?.error_code)===1102'),'1102 detection missing');
assert.ok(app.includes('error.workerResourceLimit'),'1102 no-retry guard missing');
console.log(JSON.stringify({ok:true,checks:['no-static-school-history-adapter','reuse-public-school-majors','history-fit-continuation','48k-school-history-bridge-budget','1102-no-retry']},null,2));
""")

          workflow = Path('.github/workflows/verify-ai-workspace-v3990_1.yml')
          wtext = workflow.read_text()
          syntax_anchor = "          node --check tools/browser-ai-workspace-v3990_1.mjs\n"
          if wtext.count(syntax_anchor) != 1:
              raise SystemExit('AI workflow syntax anchor changed')
          wtext = wtext.replace(syntax_anchor, syntax_anchor + "          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs\n")
          gate_anchor = "      - name: Run deterministic semantic workspace gates\n        run: node tools/verify-ai-workspace-v3990_1.mjs\n"
          gate_new = "      - name: Run deterministic semantic workspace gates\n        run: |\n          node tools/verify-ai-workspace-v3990_1.mjs\n          node tools/verify-ai-school-history-bridge-v3992_2.mjs\n"
          if wtext.count(gate_anchor) != 1:
              raise SystemExit('AI workflow gate anchor changed')
          workflow.write_text(wtext.replace(gate_anchor,gate_new))
          PY
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check ai/app.v3990_1.js
          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          git rm .github/workflows/patch-ai-school-history-bridge-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/tool-registry.js functions/_lib/ai/turn-orchestrator.js ai/app.v3990_1.js functions/_lib/ai/RESOURCE-BOUNDARY.md tools/verify-ai-school-history-bridge-v3992_2.mjs .github/workflows/verify-ai-workspace-v3990_1.yml
          git commit -m 'fix: isolate school history from AI Worker resources'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
