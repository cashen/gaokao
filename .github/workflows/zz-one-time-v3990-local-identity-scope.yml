name: One-time v3990 local identity scope

on:
  push:
    branches:
      - agent/pages-git-identity-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-local-identity-scope.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pages-git-identity-v3990_0
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply local identity scope
        run: python3 tools/zz_patch_v3990_local_identity_scope.py
      - name: Verify source audit and local graph exception
        env:
          PAGES_BASE: http://127.0.0.1:8795
          CUSTOM_BASE: http://127.0.0.1:8795
          RELEASE_SHA: ${{ github.sha }}
          VERIFY_RUNTIME_HEALTH: 'false'
          VERIFY_DEPLOYMENT_IDENTITY: 'false'
          VERIFY_MAJOR_BANDS: 'false'
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-local-identity-source.json
        run: |
          set -euo pipefail
          node --check tools/verify-production-resource-graph-v3990_0.mjs
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          python3 -m http.server 8795 --bind 127.0.0.1 >/tmp/v3990-local-identity-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
              'http://127.0.0.1:8795/shared/resources/release/current-release.js' >/dev/null; then break; fi
            sleep 1
          done
          node tools/verify-production-resource-graph-v3990_0.mjs \
            2>&1 | tee /tmp/v3990-local-identity-source.log
      - name: Verify exact Preview identity remains mandatory
        env:
          PAGES_BASE: https://agent-pages-git-identity-v39.gaokao-4y9.pages.dev
          CUSTOM_BASE: https://agent-pages-git-identity-v39.gaokao-4y9.pages.dev
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYMENT_BRANCH: agent/pages-git-identity-v3990_0
          VERIFY_RUNTIME_HEALTH: 'true'
          VERIFY_DEPLOYMENT_IDENTITY: 'true'
          VERIFY_MAJOR_BANDS: 'false'
          PRODUCTION_RESOURCE_ATTEMPTS: '45'
          PRODUCTION_RESOURCE_WAIT_MS: '10000'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-preview-identity-required.json
        run: |
          set -euo pipefail
          node tools/verify-production-resource-graph-v3990_0.mjs \
            2>&1 | tee /tmp/v3990-preview-identity-required.log
      - name: Commit verified identity scope
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-production-resource-graph-v3990_0.mjs tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'fix(release): scope deployment identity bypass to local source graph'
          git push origin HEAD:agent/pages-git-identity-v3990_0
      - name: Upload identity scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-local-identity-scope
          path: |
            /tmp/v3990-local-identity-*.json
            /tmp/v3990-local-identity-*.log
            /tmp/v3990-preview-identity-required.json
            /tmp/v3990-preview-identity-required.log
          if-no-files-found: warn
          retention-days: 7
