name: Temporary UEC browser contract migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-uec-browser-contract-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-experience-context-v001
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate AIPLuS browser bridge and fixture to canonical Student Voice response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Preserve canonical gateway evidence metadata through the browser bridge.
          app=Path('aiplus/app.v3990_1.js')
          text=app.read_text()
          old="function compactSchoolExperienceToolPayload(data={}){const source=data?.source||{},evidence=data?.evidence||{},major=data?.major&&typeof data.major==='object'?data.major:{};return{"
          new="function compactSchoolExperienceToolPayload(data={}){const source=data?.source||{},evidence=data?.evidence||{},major=data?.major&&typeof data.major==='object'?data.major:{},matchedEvidence=evidence.matchCount??evidence.matched,scannedEvidence=evidence.scannedCount??evidence.scanned,pagesEvidence=evidence.scannedPages??evidence.pages;return{"
          if old not in text: raise SystemExit('compactSchoolExperienceToolPayload header not found')
          text=text.replace(old,new,1)
          text=text.replace("matched:evidence.matched===null||evidence.matched===undefined||evidence.matched===''?null:(Number.isFinite(Number(evidence.matched))?Number(evidence.matched):null)","matched:matchedEvidence===null||matchedEvidence===undefined||matchedEvidence===''?null:(Number.isFinite(Number(matchedEvidence))?Number(matchedEvidence):null),matchCount:matchedEvidence===null||matchedEvidence===undefined||matchedEvidence===''?null:(Number.isFinite(Number(matchedEvidence))?Number(matchedEvidence):null)",1)
          text=text.replace("scanned:evidence.scanned===null||evidence.scanned===undefined||evidence.scanned===''?null:(Number.isFinite(Number(evidence.scanned))?Number(evidence.scanned):null)","scanned:scannedEvidence===null||scannedEvidence===undefined||scannedEvidence===''?null:(Number.isFinite(Number(scannedEvidence))?Number(scannedEvidence):null),scannedCount:scannedEvidence===null||scannedEvidence===undefined||scannedEvidence===''?null:(Number.isFinite(Number(scannedEvidence))?Number(scannedEvidence):null)",1)
          text=text.replace("pages:evidence.pages===null||evidence.pages===undefined||evidence.pages===''?null:(Number.isFinite(Number(evidence.pages))?Number(evidence.pages):null)","pages:pagesEvidence===null||pagesEvidence===undefined||pagesEvidence===''?null:(Number.isFinite(Number(pagesEvidence))?Number(pagesEvidence):null),scannedPages:pagesEvidence===null||pagesEvidence===undefined||pagesEvidence===''?null:(Number.isFinite(Number(pagesEvidence))?Number(pagesEvidence):null),sampleLevel:String(evidence.sampleLevel||'').slice(0,80)",1)
          app.write_text(text)

          # 2) Adapter reads canonical evidence names first, retaining old aliases for legacy bridge fixtures.
          adapter=Path('functions/_lib/ai/student-voice-tool-adapter.js')
          text=adapter.read_text()
          old="const hasContent=Boolean(summary||reviews.length),matched=Number.isFinite(Number(payload?.evidence?.matched))?Number(payload.evidence.matched):(summary?null:reviews.length),sampleCount=matched===null?reviews.length:Math.max(0,matched),resolvedMajor="
          new="const hasContent=Boolean(summary||reviews.length),evidenceMatched=payload?.evidence?.matchCount??payload?.evidence?.matched,matched=Number.isFinite(Number(evidenceMatched))?Number(evidenceMatched):(summary?null:reviews.length),sampleCount=matched===null?reviews.length:Math.max(0,matched),resolvedMajor="
          if old not in text: raise SystemExit('student voice evidence count expression not found')
          adapter.write_text(text.replace(old,new,1))

          # 3) Old AIPLuS mocked browser now emulates the real UEC gateway contract, not pre-UEC page-1 mixed reviews.
          browser=Path('tools/browser-aiplus-v002-mocked.mjs')
          text=browser.read_text()
          start=text.find('function experiencePayload(url){')
          end=text.find('\n}\n\nfunction officialPayload',start)
          if start < 0 or end < 0: raise SystemExit('experiencePayload block not found')
          replacement="""function experiencePayload(url){
            const school=url.searchParams.get('school')||'测试大学',topic=url.searchParams.get('topic')||'general';
            return{ok:true,mode:'topic_reviews',scope:'school',topic,school,reviews:[
              {id:'living-1',content:'宿舍是四人间，冬天有暖气，公共洗衣区使用比较方便。',createdAt:'2026-08-10T10:00:00+08:00',authorLabel:'匿名同学',evidenceScope:'school',verificationWeight:'none'},
              {id:'living-2',content:'食堂窗口不少，晚饭高峰期需要排队。',createdAt:'2026-08-08T10:00:00+08:00',authorLabel:'匿名同学',evidenceScope:'school',verificationWeight:'none'}
            ],evidence:{type:'student_voice',scope:'school',topic,matchCount:2,sampleLevel:'two_voices',scannedCount:8,scannedPages:2,exhaustive:true,sourceSummary:false,officialFact:false,rankingInput:false,recommendationScoreInput:false,verificationWeight:'none',disagreementPolicy:'preserve_not_average'},source:{id:'srgaoxiao',name:'神人高校网',url:'https://eo.srgaoxiao.cn/school/mock'},fetchedAt:'2026-08-21T02:00:00Z',transport:'话题定向公开评论 · 神人高校网镜像 1',contractVersion:'student-voice-contract-v0.01',sourceRegistryVersion:'student-voice-source-registry-v0.01',sourceGatewayVersion:'student-voice-source-gateway-v0.01'};
          }"""
          text=text[:start]+replacement+text[end+2:]
          old_assert="stream.includes('同学体验 · srgaoxiao.com')&&stream.includes('宿舍')&&stream.includes('食堂')"
          new_assert="stream.includes('神人高校网')&&stream.includes('宿舍')&&stream.includes('食堂')"
          if old_assert not in text: raise SystemExit('old experience source assertion not found')
          browser.write_text(text.replace(old_assert,new_assert,1))

          # 4) Permanent UEC/AIPLuS verifier locks both AIPLuS living compatibility and canonical evidence fields.
          verifier=Path('tools/verify-aiplus-student-voice-v001.mjs')
          text=verifier.read_text()
          text=text.replace("EXPERIENCE_TOPICS,EXPERIENCE_TOPIC_KEYWORDS,normalizeExperienceTopic","EXPERIENCE_TOPICS,EXPERIENCE_TOPIC_KEYWORDS,normalizeExperienceTopic,experienceTopicFromText",1)
          anchor="assert.equal(normalizeExperienceTopic('dormitory'),'dormitory');"
          addition="\nassert.equal(experienceTopicFromText('宿舍怎么样'),'living','AIPLuS v0.02 must preserve its combined living topic while Student Voice direct mode keeps dormitory');\nassert.equal(experienceTopicFromText('食堂怎么样'),'living','AIPLuS v0.02 must preserve its combined living topic while Student Voice direct mode keeps cafeteria');"
          if anchor not in text: raise SystemExit('AIPLuS topic compatibility verifier anchor missing')
          text=text.replace(anchor,anchor+addition,1)
          text=text.replace("evidence:{matched:2,scanned:10,pages:1,exhaustive:true,sampleLevel:'two_voices'}","evidence:{matchCount:2,scannedCount:10,scannedPages:1,exhaustive:true,sampleLevel:'two_voices'}",1)
          text=text.replace("evidence:{matched:1,scanned:12,pages:2,exhaustive:true,sampleLevel:'single_voice'}","evidence:{matchCount:1,scannedCount:12,scannedPages:2,exhaustive:true,sampleLevel:'single_voice'}",1)
          verifier.write_text(text)
          PY

          node --check aiplus/app.v3990_1.js
          node --check functions/_lib/ai/student-voice-tool-adapter.js
          node --check tools/browser-aiplus-v002-mocked.mjs
          node --check tools/verify-aiplus-student-voice-v001.mjs
          node tools/verify-unified-experience-context-v001.mjs
          node tools/verify-aiplus-student-voice-v001.mjs
          node tools/verify-aiplus-v002-contract.mjs
          bash .github/scripts/install-playwright-chromium.sh
          node tools/browser-aiplus-v002-mocked.mjs

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add aiplus/app.v3990_1.js functions/_lib/ai/student-voice-tool-adapter.js tools/browser-aiplus-v002-mocked.mjs tools/verify-aiplus-student-voice-v001.mjs
          git commit -m 'Align AIPLuS browser bridge with Student Voice gateway contract'
          git fetch origin agent/unified-experience-context-v001
          git rebase origin/agent/unified-experience-context-v001
          git push origin HEAD:agent/unified-experience-context-v001
