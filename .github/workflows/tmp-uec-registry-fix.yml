name: Temporary UEC registry fix

on:
  push:
    branches:
      - agent/unified-experience-context-v001

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'UEC registry builder:') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-experience-context-v001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/tmp_uec_registry_fix.py
      - run: |
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check tools/verify-aiplus-student-voice-v001.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/tool-registry.js
          git commit -m 'UEC registry builder: expose unified Student Voice adapter'
          git push origin HEAD:agent/unified-experience-context-v001
