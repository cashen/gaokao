name: One-time all-bands shared projection v3990 r6

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-all-bands-shared-projection-v3990-r6.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reuse shared projection patch with escaped band telemetry
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/zz-one-time-all-bands-shared-projection-v3990.yml', aliases: true)
          steps = workflow.fetch('jobs').fetch('patch-and-verify').fetch('steps')
          patch = steps.find { |step| step['name'] == 'Patch one-pass all-bands shared projection' }
          verify = steps.find { |step| step['name'] == 'Verify cold all-bands projection and full local pressure' }
          commit = steps.find { |step| step['name'] == 'Commit verified shared projection' }
          raise 'source steps missing' unless patch && verify && commit
          File.write('/tmp/v3990-shared-patch.sh', patch.fetch('run'))
          File.write('/tmp/v3990-shared-verify.sh', verify.fetch('run'))
          File.write('/tmp/v3990-shared-commit.sh', commit.fetch('run'))
          RUBY

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v3990-shared-patch.sh')
          script = path.read_text(encoding='utf-8')

          function_anchor = "def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one anchor, got {count}')\n    return text.replace(old, new, 1)\n"
          function_patch = function_anchor + "\ndef replace_first(text, old, new, label):\n    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f'{label}: expected at least one anchor, got {count}')\n    return text.replace(old, new, 1)\n"
          if script.count(function_anchor) != 1:
              raise SystemExit(f'replace helper anchor count={script.count(function_anchor)}')
          script = script.replace(function_anchor, function_patch, 1)

          call_anchor = "verifier = replace_once(\n    verifier,\n    \"  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\\n\",\n"
          call_patch = "verifier = replace_first(\n    verifier,\n    \"  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\\n\",\n"
          if script.count(call_anchor) != 1:
              raise SystemExit(f'hit call anchor count={script.count(call_anchor)}')
          script = script.replace(call_anchor, call_patch, 1)

          aggregate_anchor = "      aggregate: allBandsShared.processed.stats,\\n      keywordQuery: allBandsShared.processed.keywordQuery,\\n"
          aggregate_patch = "      aggregate: {\\n        ...allBandsShared.processed.stats,\\n        requestedBand,\\n        sortPasses: ordered.length > 1 ? 1 : 0\\n      },\\n      keywordQuery: allBandsShared.processed.keywordQuery,\\n"
          if script.count(aggregate_anchor) != 1:
              raise SystemExit(f'band aggregate anchor count={script.count(aggregate_anchor)}')
          script = script.replace(aggregate_anchor, aggregate_patch, 1)

          path.write_text(script, encoding='utf-8')
          PY

          bash /tmp/v3990-shared-patch.sh

      - name: Verify shared projection and full local pressure
        run: |
          set -euo pipefail
          bash /tmp/v3990-shared-verify.sh

      - name: Commit verified shared projection
        run: |
          set -euo pipefail
          bash /tmp/v3990-shared-commit.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-all-bands-shared-projection-r6
          path: |
            /tmp/v3990-all-bands-shared-*.json
            /tmp/v3990-all-bands-shared-wrangler.log
          if-no-files-found: warn
          retention-days: 7
