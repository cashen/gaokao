name: One-time v3990 snapshot challenge repair

on:
  push:
    branches:
      - agent/deploy-workflow-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-snapshot-challenge-repair.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deploy-workflow-v3990_0
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply strict snapshot challenge boundary
        run: python3 tools/zz_patch_v3990_snapshot_challenge.py
      - name: Verify source and live production snapshot boundary
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          RELEASE_SHA: ed37d369ccc4414ae2cddd7be2b435953e83ca29
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          PRODUCTION_PAGINATION_SNAPSHOT_EVIDENCE: /tmp/v3990-snapshot-challenge-evidence.json
        run: |
          set -euo pipefail
          node --check tools/verify-production-pagination-snapshot-guard-v3990_0.mjs
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          node tools/verify-production-pagination-snapshot-guard-v3990_0.mjs \
            2>&1 | tee /tmp/v3990-snapshot-challenge.log
      - name: Commit verified snapshot boundary
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-production-pagination-snapshot-guard-v3990_0.mjs tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'fix(release): apply strict snapshot challenge boundary'
          git push origin HEAD:agent/deploy-workflow-v3990_0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-snapshot-challenge-boundary
          path: |
            /tmp/v3990-snapshot-challenge-evidence.json
            /tmp/v3990-snapshot-challenge.log
          if-no-files-found: warn
          retention-days: 7
