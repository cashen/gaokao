# rerun after preserving public school-history record identity
name: Temporary ln-rank Worker vNext builder

on:
  push:
    branches:
      - agent/ln-rank-worker-resource-vnext
    paths:
      - .github/workflows/tmp-ln-rank-worker-vnext-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ln-rank-worker-resource-vnext
          fetch-depth: 0
      - name: Align builder with current school projection shape
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/tmp_ln_rank_worker_vnext_builder.py')
          s=p.read_text()
          s=s.replace("    if len(school_map) != 956:\n        raise SystemExit(f'projection school count before repartition != 956: {len(school_map)}')\n", "    record_bearing_school_count = sum(1 for school in school_map.values() if school_records(school))\n    if record_bearing_school_count != 956:\n        raise SystemExit(f'projection record-bearing school count != 956: nodes={len(school_map)} bearing={record_bearing_school_count}')\n")
          s=s.replace("    schools_index = index.get('schools') or {}\n    for key, item in schools_index.items():\n        actual_key = item.get('key') or key\n", "    schools_index = index.get('schools') or []\n    school_index_items = list(schools_index.values()) if isinstance(schools_index, dict) else list(schools_index)\n    for item in school_index_items:\n        actual_key = item.get('key') or item.get('name')\n", 1)
          s=s.replace("index['runtimeProjectionSchoolCount'] = len(school_map)", "index['runtimeProjectionSchoolCount'] = record_bearing_school_count")
          s=s.replace("    for key, item in schools_index.items():\n        actual_key = item.get('key') or key\n", "    for item in school_index_items:\n        actual_key = item.get('key') or item.get('name')\n", 1)
          s=s.replace("'schools': len(school_map),", "'schools': record_bearing_school_count,\n        'structuralSchoolNodes': len(school_map),")
          s=s.replace("schools.add(info.key);const rows=", "const rows=")
          s=s.replace("projected.push(...rows);if(info.recordCount2026", "projected.push(...rows);if(rows.length)schools.add(info.key);if(info.recordCount2026")
          p.write_text(s)
          PY
      - name: Build bounded school runtime projection and primary owners
        run: python3 tools/tmp_ln_rank_worker_vnext_builder.py
      - name: Patch major builder to exact-only Worker shards
        run: python3 tools/tmp_patch_major_runtime_source.py
      - name: Build canonical major runtime projection and migrate remaining consumers
        run: python3 tools/tmp_ln_rank_worker_vnext_consumer_fix_v2.py
      - name: Write current vNext endpoint verifier
        run: python3 tools/tmp_write_worker_vnext_endpoint_verifier.py
      - name: Migrate AIPLuS bridge verifier to bounded runtime owner
        run: python3 tools/tmp_patch_ai_school_history_bridge_vnext.py
      - name: Validate generated JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/school-record-runtime-provider.vnext.js
          node --check functions/_lib/ai/school-history-fact-source.js
          node --check functions/api/school-majors.js
          node --check functions/_lib/report-data-service-v3956.js
          node --check functions/_lib/ln-rank-manifest.js
          node --check functions/_lib/fenxi-manifest.js
          node --check functions/_lib/background-position-engine.js
          node --check functions/api/major-window.js
          node --check functions/api/school-geo-audit.js
          node --check functions/api/fenxi-catalog.js
          node --check tools/audit-worker-resource-architecture-vnext.mjs
          node --check tools/verify-school-runtime-projection-vnext.mjs
          node --check tools/verify-major-runtime-projection-vnext.mjs
          node --check tools/verify-school-majors-runtime-vnext.mjs
          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs
      - name: Verify projection truth, endpoint and Worker architecture
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-school-runtime-projection-vnext.mjs
          node tools/verify-major-runtime-projection-vnext.mjs
          node tools/audit-worker-resource-architecture-vnext.mjs
          node tools/verify-school-majors-runtime-vnext.mjs
      - name: Run current deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-major-bands-rank-kernel-v3990_1.mjs
          node tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node tools/audit-academic-background-v3970.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
      - name: Check protected boundaries and final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only HEAD | grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)'; then
            echo 'protected boundary changed' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('functions/_lib/release-contract.js','utf8');
          if(!s.includes('LN_RANK_RELEASE_CONTRACT')||!s.includes('RELEASE_CONTRACT')) throw new Error('release contract dual export lost');
          const manifest=fs.readFileSync('functions/_lib/fenxi-manifest.js','utf8');
          if(manifest.includes('loadAllRecords')||manifest.includes('Promise.all')) throw new Error('fenxi full loader survived');
          NODE
      - name: Commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-ln-rank-worker-vnext-builder.yml tools/tmp_ln_rank_worker_vnext_builder.py tools/tmp_ln_rank_worker_vnext_consumer_fix.py tools/tmp_ln_rank_worker_vnext_consumer_fix_v2.py tools/tmp_patch_major_runtime_source.py tools/tmp_write_worker_vnext_endpoint_verifier.py tools/tmp_patch_ai_school_history_bridge_vnext.py
          git add data/zy2026/school-index.json data/zy2026/major-index.json data/zy2026/chunks \
            functions/_lib/school-record-runtime-provider.vnext.js functions/_lib/ai/school-history-fact-source.js functions/api/school-majors.js \
            functions/_lib/report-data-service-v3956.js functions/_lib/ln-rank-manifest.js \
            functions/_lib/fenxi-manifest.js functions/_lib/background-position-engine.js \
            functions/api/major-window.js functions/api/school-geo-audit.js functions/api/fenxi-catalog.js \
            tools/audit-worker-resource-architecture-vnext.mjs tools/verify-school-runtime-projection-vnext.mjs \
            tools/verify-major-runtime-projection-vnext.mjs tools/verify-school-majors-runtime-vnext.mjs \
            tools/verify-ai-school-history-bridge-v3992_2.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ln-rank): bound Worker admission resource ownership'
          git push origin HEAD:agent/ln-rank-worker-resource-vnext
