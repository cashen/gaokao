name: Ops redeploy locked v3.9.72.2 main

on:
  push:
    branches:
      - ops/redeploy-v3972-2-main
    paths:
      - '.github/workflows/verify-production-api-health-v3971.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-locked-main:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LOCKED_MAIN_SHA: 658740a613af447d1f313fa794f59708b3d1aed9
      CF_PROJECT_NAME: gaokao-4y9
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 658740a613af447d1f313fa794f59708b3d1aed9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact locked release source
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$LOCKED_MAIN_SHA"
          grep -q "display: 'v3.9.72.2'" shared/resources/release/current-release.js
          grep -q "all211Architecture: 'build-time-static-index'" shared/resources/release/current-release.js
          test ! -e functions/api/local-strength.js
          test ! -e functions/_lib/local-strength-api.js
      - name: Verify Cloudflare deployment credentials are configured
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'missing CLOUDFLARE_API_TOKEN/CF_API_TOKEN'; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'missing CLOUDFLARE_ACCOUNT_ID/CF_ACCOUNT_ID'; exit 2; }
      - name: Deploy exact main commit to Cloudflare Pages
        run: |
          set -euo pipefail
          npx --yes wrangler@4.28.1 pages deploy . \
            --project-name="$CF_PROJECT_NAME" \
            --branch=main \
            --commit-hash="$LOCKED_MAIN_SHA" \
            --commit-message='v3.9.72.2 locked main redeploy'
      - name: Verify deployed release contract
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            token="${LOCKED_MAIN_SHA}-${attempt}-$(date +%s)"
            pages="$(curl --fail --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://gaokao-4y9.pages.dev/shared/resources/release/current-release.js?ops=${token}" || true)"
            custom="$(curl --fail --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://gaokao.powers.org.cn/shared/resources/release/current-release.js?ops=${token}" || true)"
            if grep -q "display: 'v3.9.72.2'" <<<"$pages" && grep -q "display: 'v3.9.72.2'" <<<"$custom"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
