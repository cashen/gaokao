name: Verify production API health v3971.2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  production-api-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify current production score school APIs and static LocalStrength
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3971-production-acceptance
          fetch() {
            local label="$1" url="$2"
            curl --silent --show-error --location --max-time 30 \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              --dump-header "/tmp/v3971-production-acceptance/${label}.headers" \
              --output "/tmp/v3971-production-acceptance/${label}.body" \
              --write-out '%{http_code}' "$url" > "/tmp/v3971-production-acceptance/${label}.status" || true
          }

          ready=0
          for attempt in $(seq 1 40); do
            token="${RELEASE_SHA}-${attempt}-$(date +%s)"
            fetch runtime "${PAGES_BASE}/api/ln-rank-runtime-health?release-check=${token}"
            fetch health "${PAGES_BASE}/api/major-bands-health?probe=1&release-check=${token}"
            fetch score "${PAGES_BASE}/api/major-bands?candidateScore=579&limit=16&release-check=${token}"
            fetch school "${PAGES_BASE}/api/major-bands?candidateScore=650&schoolKeyword=%E4%B8%9C%E5%8C%97%E5%A4%A7%E5%AD%A6&limit=16&release-check=${token}"
            fetch local-page "${PAGES_BASE}/ln-rank/local-mainline.html?release-check=${token}"
            fetch local-index "${PAGES_BASE}/ln-rank/data/local-strength/local-strength-index.v3971_2.json?release-check=${token}"
            fetch custom-score "${CUSTOM_BASE}/api/major-bands?candidateScore=579&limit=16&release-check=${token}"

            if node --input-type=module - <<'NODE'
              import fs from 'node:fs';
              const dir='/tmp/v3971-production-acceptance';
              const status=name=>Number(fs.readFileSync(`${dir}/${name}.status`,'utf8'));
              const read=name=>JSON.parse(fs.readFileSync(`${dir}/${name}.body`,'utf8'));
              for(const name of ['runtime','health','score','school','local-page','local-index']) if(status(name)!==200) process.exit(1);
              const runtime=read('runtime');
              const health=read('health');
              const score=read('score');
              const school=read('school');
              if(runtime.ok===false||health.ok===false||score.ok===false||school.ok===false) process.exit(1);
              const count=data=>['upper','near','steady'].reduce((sum,key)=>sum+(data.bands?.[key]?.records?.length||0),0);
              if(count(score)<1||count(school)<1) process.exit(1);
              const html=fs.readFileSync(`${dir}/local-page.body`,'utf8');
              const index=read('local-index');
              if(!html.includes('data-release="v3.9.71.2"')) process.exit(1);
              if(!html.includes('local-strength-app.v3971_2.js?v=3971_2')) process.exit(1);
              if(html.includes('/api/local-strength')) process.exit(1);
              if(index.version!=='local-strength-static-v3971_2'||!index.meta?.completeEvaluation) process.exit(1);
              if(index.meta.localAdmissionSchoolCount!==62||index.meta.evaluatedRecordCount!==1992||index.meta.matchedRecordCount!==243) process.exit(1);
              const customStatus=status('custom-score');
              if(customStatus===200){
                const custom=read('custom-score');
                if(custom.ok===false||count(custom)<1) process.exit(1);
              } else {
                const headers=fs.readFileSync(`${dir}/custom-score.headers`,'utf8');
                if(!/^cf-mitigated:\s*challenge/im.test(headers)) process.exit(1);
              }
              console.log(JSON.stringify({
                pagesRuntime:200,
                pagesHealth:200,
                scoreRecords:count(score),
                schoolRecords:count(school),
                localPageRelease:'v3.9.71.2',
                localIndex:{schools:62,evaluated:1992,matched:243},
                customDomain:customStatus===200?'json-200':'managed-challenge'
              },null,2));
NODE
            then
              ready=1
              break
            fi
            sleep 15
          done

          if [ "$ready" -ne 1 ]; then
            for label in runtime health score school local-page local-index custom-score; do
              echo "--- ${label} status ---"
              cat "/tmp/v3971-production-acceptance/${label}.status" 2>/dev/null || true
              echo "--- ${label} headers ---"
              head -c 1800 "/tmp/v3971-production-acceptance/${label}.headers" 2>/dev/null || true
              echo "--- ${label} body ---"
              head -c 2600 "/tmp/v3971-production-acceptance/${label}.body" 2>/dev/null || true
            done
            exit 1
          fi

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3971-production-acceptance
          path: /tmp/v3971-production-acceptance
          if-no-files-found: warn
          retention-days: 7
