name: Verify production API health v3990.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: read

jobs:
  production-api-health:
    concurrency:
      group: v3990-1-cloudflare-preview-${{ github.event.pull_request.head.sha || github.sha }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify canonical release and Worker resource contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            functions/_lib/fenxi-fetcher.js \
            functions/_lib/major-bands-static-provider.js \
            functions/_lib/major-bands-rank-index.v3990_2.js \
            functions/_lib/major-bands-rank-bucket-loader.v3990_2.js \
            functions/_lib/major-bands-query-execution-cache.v3990_1.js \
            functions/_lib/major-bands-all-bands-page-cache.v3990_1.js \
            functions/_lib/major-bands-rank-query-kernel.v3990_2.js \
            functions/_lib/major-bands-result-order.v3990_2.js \
            functions/_lib/major-bands-response-transport.v3990_2.js \
            functions/api/major-bands-bucket.js \
            functions/api/major-bands.js \
            functions/api/major-bands-health.js \
            ln-rank/js/local-strength/local-strength-app.v3971_2.js \
            tools/build-major-bands-static-v3972.mjs \
            tools/build-major-bands-rank-index-v3990_2.mjs \
            tools/audit-major-bands-rank-kernel-v3990_2.mjs \
            tools/verify-major-bands-preview-concurrency-v3990_2.mjs \
            tools/verify-live-ai-model-v3990_2.mjs \
            tools/verify-production-resource-graph-v3990_2.mjs \
            tools/verify-production-baseline-v3971.mjs \
            tools/audit-canonical-release-version-v3990_2.mjs \
            tools/audit-site-runtime-generation-v3990_2.mjs; do
            node --check "$file"
          done

          tmp=tools/.audit-major-bands-query-execution-cache-v3990_2.generated.mjs
          sed -e 's/v3990_0/v3990_2/g' -e 's/3990_0/3990_2/g' tools/audit-major-bands-query-execution-cache-v3990_0.mjs > "$tmp"
          node --check "$tmp"
          node "$tmp"
          rm -f "$tmp"

          node tools/audit-major-bands-rank-kernel-v3990_2.mjs
          node tools/audit-canonical-release-version-v3990_2.mjs
          node tools/audit-site-runtime-generation-v3990_2.mjs

          test -f 404.html
          grep -q '页面不存在' 404.html
          grep -q "maximumProbeChunks: 1" functions/api/major-bands-health.js
          grep -q "fullDatasetScan: false" functions/api/major-bands-health.js
          grep -q "bounded-manifest-plus-one-chunk" functions/api/major-bands-health.js
          grep -q "Large admission chunks are deliberately request-scoped" functions/_lib/fenxi-fetcher.js
          grep -q "loadMajorBandsStaticRankBucket" functions/_lib/major-bands-static-provider.js
          grep -q "MAJOR_BANDS_RANK_INDEX_VERSION" functions/api/major-bands.js
          grep -q "loadMajorBandsRankWindow" functions/api/major-bands.js
          grep -q "executeMajorBandsQueryOnce" functions/api/major-bands.js
          grep -q "processMajorBandsRankWindow" functions/api/major-bands.js
          grep -q "publicHttpSelfFanout: false" functions/api/major-bands.js
          grep -q "bucketWorkerCount: 0" functions/api/major-bands.js
          grep -q "MAX_LOAD_CONCURRENCY = 1" functions/_lib/major-bands-rank-bucket-loader.v3990_2.js
          grep -q "ALL_BANDS_LOAD_CONCURRENCY = 3" functions/_lib/major-bands-rank-bucket-loader.v3990_2.js
          grep -q "MAJOR_BANDS_RANK_BUCKET_LOADER_VERSION = 'major-bands-rank-bucket-loader-bounded-all-band-v3990_2'" functions/_lib/major-bands-rank-bucket-loader.v3990_2.js
          grep -q "MAJOR_BANDS_RANK_QUERY_MEMORY_MODE = 'requested-band-lightweight-order-current-page-v3990_2'" functions/_lib/major-bands-rank-query-kernel.v3990_2.js
          grep -q "const sortKeys = requestedBand ? \[requestedBand\] : BAND_KEYS" functions/_lib/major-bands-rank-query-kernel.v3990_2.js
          grep -q "MAJOR_BANDS_RESULT_ORDER_VERSION = 'major-bands-result-order-ephemeral-v3990_2'" functions/_lib/major-bands-result-order.v3990_2.js
          grep -q "const tuples = new WeakMap()" functions/_lib/major-bands-result-order.v3990_2.js
          grep -q "MAX_CONCURRENT_EXECUTIONS = 1" functions/_lib/major-bands-query-execution-cache.v3990_1.js
          grep -q "crossRequestResolverQueue: false" functions/_lib/major-bands-query-execution-cache.v3990_1.js
          grep -q "serializedSnapshotOnly: true" functions/_lib/major-bands-query-execution-cache.v3990_1.js
          if grep -Eq "runMajorBandsBucketWorkers|new URL\('/api/major-bands-bucket'|distributed-bucket-workers|maxCandidates|selected\.buckets\.length > 12|loadMajorBandsStaticWindow|streamFenxiChunkRecords|loadManifest|fetchFenxiJson" functions/api/major-bands.js; then
            echo 'retired self-fanout, candidate cap or raw scan returned'
            exit 1
          fi

          test ! -e functions/api/local-strength.js
          test ! -e functions/_lib/local-strength-api.js
          grep -q 'data-local-strength-score-position="local-strength-score-position-v3972_3"' ln-rank/local-mainline.html
          grep -q 'local-strength-app.v3971_2.js?v=3972_3' ln-rank/local-mainline.html
          grep -Fq 'const upper = ordered.filter(record => Number(record.rank2026) < rank);' ln-rank/js/local-strength/local-strength-app.v3971_2.js
          grep -Fq 'const lower = ordered.filter(record => Number(record.rank2026) > rank);' ln-rank/js/local-strength/local-strength-app.v3971_2.js

      - name: Verify local Wrangler concurrent resource journey
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8792 --compatibility-date=2026-07-01 >/tmp/v3990-1-worker-budget-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS 'http://127.0.0.1:8792/api/ln-rank-runtime-health' >/tmp/v3990-1-runtime.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-1-worker-budget-wrangler.log; exit 1; fi

          local_status="$(curl --silent --show-error -o /tmp/v3990-1-local-strength-absent.html -w '%{http_code}' 'http://127.0.0.1:8792/api/local-strength')"
          test "$local_status" = '404'
          grep -Eqi '<!doctype html|<html' /tmp/v3990-1-local-strength-absent.html
          if grep -Eqi '"scannedCount"|"matchedCount"|"architecture"|"records"' /tmp/v3990-1-local-strength-absent.html; then exit 1; fi

          curl -fsS 'http://127.0.0.1:8792/api/major-bands-health?probe=1' > /tmp/v3990-1-health.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health=JSON.parse(fs.readFileSync('/tmp/v3990-1-health.json','utf8'));
          if(health?.ok===false) throw new Error('health ok=false');
          if(health?.resourcePolicy?.fullDatasetProbeDisabled!==true) throw new Error('health full scan policy');
          if(health?.resourcePolicy?.maximumProbeChunks!==1) throw new Error('health probe chunk budget');
          if(health?.probe?.mode!=='bounded-manifest-plus-one-chunk'||health?.probe?.fullDatasetScan!==false) throw new Error('health probe mode');
          NODE

          TARGET_BASE='http://127.0.0.1:8792' \
          CONCURRENCY_LEVELS='1,5,10' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='15000' \
          P95_LIMIT_MS='8000' \
          P99_LIMIT_MS='15000' \
          HARD_LIMIT_MS='25000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-1-local-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_2.mjs

      - name: Capture current production Workers AI failure evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          AI_MODEL_PROBE_BASE: https://gaokao-4y9.pages.dev
          AI_MODEL_PROBE_ATTEMPTS: '2'
          AI_MODEL_PROBE_WAIT_MS: '5000'
          AI_MODEL_PROBE_REQUIRED: 'false'
        run: node tools/verify-live-ai-model-v3990_2.mjs 2>&1 | tee /tmp/v3990-1-production-ai-model-diagnostic.out

      - name: Resolve exact-SHA Cloudflare branch Preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${EXPECTED_SHA:0:7}"
          preview_base=''
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            summary="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].output.summary // empty' <<<"$checks" 2>/dev/null || true)"
            if [ -z "$conclusion" ]; then
              comments="$(curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"
              body="$(jq -r '[.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]")][-1].body // empty' <<<"$comments" 2>/dev/null || true)"
              if grep -q "$short_sha" <<<"$body" && grep -q 'Deploy successful' <<<"$body"; then summary="$body"; conclusion=success; fi
            fi
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then exit 2; fi
            if [ "$conclusion" = success ]; then
              mapfile -t check_urls < <(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$summary" | awk '!seen[$0]++')
              if [ "${#check_urls[@]}" -ge 2 ]; then preview_base="${check_urls[1]}"; fi
              if [ -z "$preview_base" ]; then
                comments="$(curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"
                body="$(jq -r '[.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]")][-1].body // empty' <<<"$comments" 2>/dev/null || true)"
                if grep -q "$short_sha" <<<"$body"; then preview_base="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$body" | tail -n1 || true)"; fi
              fi
              [ -n "$preview_base" ] && break
            fi
            sleep 8
          done
          test -n "$preview_base"
          echo "PREVIEW_BASE=$preview_base" >> "$GITHUB_ENV"
          echo "Cloudflare Functions Preview: $preview_base"

      - name: Verify v3.9.90.2 Cloudflare Preview and Worker journey
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PREVIEW_BASE:-}"
          ready=0
          for attempt in $(seq 1 90); do
            release="$(curl --fail --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/shared/resources/release/current-release.js?candidate=${EXPECTED_SHA}-${attempt}" || true)"
            api="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&candidate=${EXPECTED_SHA}-${attempt}" || true)"
            all_api="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&limit=16&candidate=${EXPECTED_SHA}-${attempt}" || true)"
            if grep -q "display: 'v3.9.90.2'" <<<"$release" \
              && grep -q "siteRuntimeGeneration: 'v3990_2'" <<<"$release" \
              && grep -q '"queryKernelVersion":"major-bands-rank-query-kernel-v3990_2"' <<<"$api" \
              && grep -q '"queryExecutionCacheVersion":"major-bands-query-execution-cache-single-heavy-v3990_2"' <<<"$api" \
              && grep -q '"bucketLoaderVersion":"major-bands-rank-bucket-loader-bounded-all-band-v3990_2"' <<<"$api" \
              && grep -q '"resultOrderVersion":"major-bands-result-order-ephemeral-v3990_2"' <<<"$api" \
              && grep -q '"queryMemoryMode":"requested-band-lightweight-order-current-page-v3990_2"' <<<"$api" \
              && grep -q '"rankBucketMaxConcurrency":1' <<<"$api" \
              && grep -q '"publicHttpSelfFanout":false' <<<"$api" \
              && grep -q '"allBandsSharedProjectionVersion":"major-bands-all-bands-shared-projection-v3990_2"' <<<"$all_api" \
              && grep -q '"allBandsPhysicalAssetPasses":1' <<<"$all_api"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          PAGES_BASE="$PREVIEW_BASE" \
          CUSTOM_BASE="$PREVIEW_BASE" \
          RELEASE_SHA="$EXPECTED_SHA" \
          PRODUCTION_RESOURCE_ATTEMPTS='1' \
          PRODUCTION_RESOURCE_WAIT_MS='0' \
          PRODUCTION_RESOURCE_EVIDENCE='/tmp/v3990-1-preview-resource-graph.json' \
            node tools/verify-production-resource-graph-v3990_2.mjs 2>&1 | tee /tmp/v3990-1-preview-worker-health.out

      - name: Verify currently deployed safe baseline before merge
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          EXPECTED_RELEASE: auto
          PRODUCTION_VERIFY_ATTEMPTS: '8'
          PRODUCTION_VERIFY_WAIT_MS: '10000'
        run: node tools/verify-production-baseline-v3971.mjs 2>&1 | tee /tmp/v3990-1-production-baseline.out

      - name: Verify v3.9.90.2 production after main deployment
        if: github.event_name != 'pull_request'
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          RELEASE_SHA: ${{ github.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '45'
          PRODUCTION_RESOURCE_WAIT_MS: '10000'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-1-production-resource-graph.json
        run: node tools/verify-production-resource-graph-v3990_2.mjs 2>&1 | tee /tmp/v3990-1-production-health.out

      - name: Verify live Workers AI on production
        if: github.event_name != 'pull_request'
        env:
          AI_MODEL_PROBE_BASE: https://gaokao-4y9.pages.dev
          AI_MODEL_PROBE_ATTEMPTS: '12'
          AI_MODEL_PROBE_WAIT_MS: '10000'
          AI_MODEL_PROBE_REQUIRED: 'true'
        run: node tools/verify-live-ai-model-v3990_2.mjs 2>&1 | tee /tmp/v3990-1-production-ai-model.out

      - name: Upload production health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-1-production-api-health
          path: |
            /tmp/v3990-1-*.out
            /tmp/v3990-1-*.json
            /tmp/v3990-1-worker-budget-wrangler.log
            /tmp/v3990-1-*.html
          if-no-files-found: warn
          retention-days: 7
