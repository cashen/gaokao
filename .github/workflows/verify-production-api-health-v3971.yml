name: Verify production API health v3971.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-api-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production score school APIs and static LocalStrength
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          PRODUCTION_VERIFY_ATTEMPTS: '30'
          PRODUCTION_VERIFY_WAIT_MS: '10000'
        run: node tools/verify-production-v3971.mjs | tee /tmp/v3971-production-health.out
      - name: Upload production health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3971-production-api-health
          path: /tmp/v3971-production-health.out
          if-no-files-found: warn
          retention-days: 7
