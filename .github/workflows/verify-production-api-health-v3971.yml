name: Verify production API health v3971.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-api-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate compact school runtime profile
        env:
          SCHOOL_RUNTIME_PROFILE_OUTPUT: /tmp/school-runtime-profile.generated.js
        run: node tools/verify-production-v3971.mjs | tee /tmp/v3971-production-health.out
      - name: Upload runtime profile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3972-school-runtime-profile
          path: |
            /tmp/v3971-production-health.out
            /tmp/school-runtime-profile.generated.js
          if-no-files-found: error
          retention-days: 7
