name: Build v3990.3 Tongxue major handoff repair

on:
  push:
    branches:
      - agent/tongxue-major-handoff-v3990_3

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check one-shot builder
        run: node --check tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs

      - name: Build coherent current generation and immutable Tongxue runtime
        run: node tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs

      - name: Verify generated source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp-tongxue-major-handoff-v3990_3-builder.mjs
          test ! -e .github/workflows/tmp-tongxue-major-handoff-v3990_3-builder.yml
          node --check shared/resources/experience/student-voice-navigation.v002.js
          node --check ln-rank/js/workspace/major-path-handoff.v004.js
          node --check tongxue/app/tongxue-runtime-v160-r3990_3.js
          node --check tongxue/app/tongxue-runtime-controller-v160.js
          node --check tongxue/app/tongxue-runtime-result-view-v160.js
          node --check shared/resources/release/site-runtime-contract.v3990_3.js
          node --check shared/resources/release/runtime-cache-contract.v3990_3.js
          node tools/verify-student-voice-navigation-v002.mjs
          node tools/audit-canonical-release-version-v3990_3.mjs
          node tools/audit-site-runtime-generation-v3990_3.mjs
          node tools/audit-architecture-handoff-v3990_3.mjs
          git diff --check
          git diff --name-only HEAD | tee /tmp/tongxue-major-handoff-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/tongxue-major-handoff-files.txt; then
            echo 'Protected path touched.' >&2
            exit 1
          fi
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'tongxue-runtime-v160-r3990_3.js?v=3990_3' tongxue/index.html
          grep -q 'major-path-handoff.v004.js?v=004_0' ln-rank/js/app.v3990_3.js
          grep -q 'student-voice-navigation.v002.js?v=002_0' ln-rank/js/workspace/major-path-handoff.v004.js

      - name: Install Chromium and run exact school-all browser handoff
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tools/browser-student-voice-handoff-v002.mjs

      - name: Commit generated release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'v3.9.90.3：修复 ln-rank 到同学你好专业直达与缓存身份'
          git push origin "HEAD:${GITHUB_REF_NAME}"
