name: Audit srgaoxiao label source v002

on:
  push:
    branches:
      - 'feat/srgaoxiao-label-reconcile-v002'
    paths:
      - 'tools/srgaoxiao/**'
      - '.github/workflows/audit-srgaoxiao-label-source-v002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Harvest current source taxonomy
        run: >-
          node tools/srgaoxiao/harvest-label-taxonomy-v001.mjs
          --out tmp/srgaoxiao-label-harvest-v002.json
          --maxLabels 200
          --maxPagesPerLabel 400
      - name: Assert non-empty source evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('tmp/srgaoxiao-label-harvest-v002.json', 'utf8'));
          const s = data.summary || {};
          if (!(s.uniqueLabels > 0 && s.totalSchoolLabelRelations > 0)) {
            console.error('Source audit produced no label relations', s);
            process.exit(1);
          }
          console.log(JSON.stringify(s, null, 2));
          NODE
      - name: Probe current school-major source endpoints
        run: node tools/srgaoxiao/probe-school-major-endpoints-v001.mjs tmp/srgaoxiao-label-source-probe-v002.json
      - name: Publish audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srgaoxiao-label-source-v002-${{ github.sha }}
          path: |
            tmp/srgaoxiao-label-harvest-v002.json
            tmp/srgaoxiao-label-source-probe-v002.json
            tmp/raw/*.json
          if-no-files-found: error
          retention-days: 14
