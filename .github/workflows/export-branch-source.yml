name: Export branch source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source archive
        run: git archive --format=tar.gz --output=gaokao-source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-source-${{ github.sha }}
          path: gaokao-source.tar.gz
          retention-days: 1
