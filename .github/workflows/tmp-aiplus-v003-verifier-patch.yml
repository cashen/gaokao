name: tmp AIPLuS v0.03 verifier patch
on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/tmp-aiplus-v003-verifier-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/tmp_aiplus_v003_verifier_patch.py
      - run: |
          set -euo pipefail
          node --check tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
          git diff --check
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-aiplus-parent-semantics-v003.mjs
          git commit -m 'test：覆盖家长决策真实两阶段语义协议'
          git push origin HEAD:agent/aiplus-parent-decision-v003
