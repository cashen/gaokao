name: Temporary AIPLuS region-school builder v9

on:
  push:
    branches:
      - agent/aiplus-region-school-directory-v002

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-region-school-directory-v002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare guarded patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/tmp_aiplus_region_school_patch.py')
          s=p.read_text(encoding='utf-8')
          old="    if count != 1:\n        raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')"
          new="    if count < 1:\n        raise SystemExit(f'{path}: expected at least one match, found {count}: {old[:120]!r}')"
          if old not in s: raise SystemExit('replace_once guard not found')
          s=s.replace(old,new,1)
          old_priority="if(first)out.push(action('region-first-school',`继续看${first}`,`介绍下${first}`,'从地域列表进入具体学校研究。',90));"
          new_priority="if(first)out.push(action('region-first-school',`继续看${first}`,`介绍下${first}`,'从地域列表进入具体学校研究。',98));"
          if old_priority not in s: raise SystemExit('school follow-up priority marker not found')
          s=s.replace(old_priority,new_priority,1)
          old_follow="function looksRegionSchoolDirectoryFollowup(source){return /^(?:本科|本科院校|专科|高职|专科院校|全部|都要|都有哪些|还有哪些|多少所|几所)(?:呢|有哪些|有多少|多少|吗|？|\\\\?)?$/.test(String(source||'').replace(/[\\\\s，,。！!；;：:]/g,''));}"
          new_follow="function looksRegionSchoolDirectoryFollowup(source){return /^(?:本科|本科院校|专科|高职|专科院校|全部|都要|都有哪些|还有哪些|多少所|几所)(?:呢|有哪些|有多少|多少|吗)?[？?]?$/.test(String(source||'').replace(/[\\\\s，,。！!；;：:]/g,''));}"
          if old_follow not in s: raise SystemExit('region directory follow-up marker not found')
          p.write_text(s.replace(old_follow,new_follow,1),encoding='utf-8')
          PY
      - name: Apply architecture patch
        run: python tools/tmp_aiplus_region_school_patch.py
      - name: Apply strict directory language and transient-city guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          refined="/(?:(?:有哪些|有那些|有什么|有啥|有多少|多少所|几所).{0,8}(?:大学|高校|院校|学校|本科(?:院校|大学)?|专科(?:院校|学校)?|高职(?:院校)?)|(?:大学|高校|院校|学校)(?:名单|数量|总数|一共多少所|共有多少所|有多少所|几所))/"
          files=[
            ('functions/_lib/ai/agent-task-kernel.js','function looksRegionSchoolDirectory(source){return ','.test(String(source||\'\'));}'),
            ('functions/_lib/ai/command-interpreter.js','function regionSchoolDirectoryLanguage(text){const source=String(text||\'\');return ','.test(source);}'),
            ('functions/_lib/ai/school-directory-resource.js','export function looksRegionSchoolDirectoryLanguage(text=\'\'){const source=String(text||\'\');return ','.test(source);}')
          ]
          for path,prefix,suffix in files:
            p=Path(path);s=p.read_text(encoding='utf-8');start=s.find(prefix)
            if start<0: raise SystemExit(f'{path}: region language prefix missing')
            body=start+len(prefix);end=s.find(suffix,body)
            if end<0: raise SystemExit(f'{path}: region language suffix missing')
            p.write_text(s[:body]+refined+s[end:],encoding='utf-8')
          p=Path('functions/_lib/ai/turn-orchestrator.js');s=p.read_text(encoding='utf-8')
          im="import {buildIntentContract,intentTopic} from './intent-contract.js';";il="import {resolveSchoolDirectoryRegion} from './school-directory-resource.js';"
          if s.count(im)!=1: raise SystemExit('orchestrator import marker missing')
          s=s.replace(im,im+'\n'+il,1)
          old="  const command=interpreted.command;\n  const explicitCompare="
          lines=["  const command=interpreted.command;","  if(confirmed&&deterministicContinuation&&command.agentTask==='major_region_history'&&command.transientRegionView===true){","    const canonicalRegion=await resolveSchoolDirectoryRegion(executionContext,input,workspace);","    if(!canonicalRegion?.key||!String(canonicalRegion.key).startsWith('city:'))return{ok:false,status:409,message:'本轮城市范围无法从统一高校地域目录重新确认；为避免把城市查询放大成全国查询，本轮未执行。',orchestratorVersion:AI_TURN_ORCHESTRATOR_VERSION};","    command.regionKeys=[canonicalRegion.key];command.regionLabel=canonicalRegion.label;command.regionContext={...canonicalRegion,inherited:false};command.transientRegionView=true;","  }","  const explicitCompare="]
          if s.count(old)!=1: raise SystemExit('confirmed command marker missing')
          s=s.replace(old,'\n'.join(lines),1)
          old2="regionKeys:regionExecution.exact?regionExecution.includeKeys:(view.regionKeys||['all']),bottomLineMode:view.bottomLineMode||'all'});result.partial=!result.majorHistory.ok"
          new2="regionKeys:command.transientRegionView&&command.regionKeys?.length?command.regionKeys:(regionExecution.exact?regionExecution.includeKeys:(view.regionKeys||['all'])),bottomLineMode:view.bottomLineMode||'all'});result.partial=!result.majorHistory.ok"
          if s.count(old2)!=1: raise SystemExit('major history execution marker missing')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Syntax check changed runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/school-directory-resource.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/intent-contract.js
          node --check functions/_lib/ai/task-spec-registry.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/answer-composer.js
          node --check functions/_lib/ai/next-action-engine.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check functions/api/ai/major-history.js
          node --check tools/verify-ai-region-school-directory-v002.mjs
      - name: Verify region-school truth and human language
        run: node tools/verify-ai-region-school-directory-v002.mjs
      - name: Run preserved AIPLuS semantic gates
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-aiplus-v002-contract.mjs
          node tools/audit-aiplus-v002-ui.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
          node tools/audit-site-runtime-generation-v3990_1.mjs
      - name: Verify protected boundaries and no duplicate truth
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/worktree-files
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/worktree-files; then exit 1; fi
          grep -q 'LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'RELEASE_CONTRACT' functions/_lib/release-contract.js
          test ! -e functions/_lib/ai/data/region-schools.json
      - name: Remove temporary builder ownership
        run: rm -f tools/tmp_aiplus_region_school_patch.py .github/workflows/tmp-aiplus-region-school-builder.yml .github/workflows/tmp-aiplus-region-school-builder-v2.yml .github/workflows/tmp-aiplus-region-school-builder-v3.yml .github/workflows/tmp-aiplus-region-school-builder-v4.yml .github/workflows/tmp-aiplus-region-school-builder-v5.yml .github/workflows/tmp-aiplus-region-school-builder-v6.yml .github/workflows/tmp-aiplus-region-school-builder-v7.yml .github/workflows/tmp-aiplus-region-school-builder-v8.yml .github/workflows/tmp-aiplus-region-school-builder-v9.yml
      - name: Commit final candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          if git diff --cached --name-only | grep -E '^(tools/tmp_aiplus_region_school_patch\.py|\.github/workflows/tmp-aiplus-region-school-builder(-v[23456789])?\.yml)$'; then exit 1; fi
          git commit -m 'AIPLuS: add deterministic region school directory'
          git push origin HEAD:agent/aiplus-region-school-directory-v002
