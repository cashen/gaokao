name: Temporary patch AI workspace vNext gate

on:
  push:
    branches:
      - agent/ln-rank-worker-resource-vnext
    paths:
      - '.github/workflows/tmp-patch-ai-workspace-vnext-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ln-rank-worker-resource-vnext
          fetch-depth: 0
      - name: Replace legacy school-history streaming assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/verify-ai-workspace-v3990_1.mjs')
          s=p.read_text()
          replacement="""function testSchoolHistoryStreamingBoundary(){const api=read('functions/api/school-majors.js'),provider=read('functions/_lib/school-record-runtime-provider.vnext.js'),manifest=read('functions/_lib/ln-rank-manifest.js');assert.ok(api.includes(\"from '../_lib/school-record-runtime-provider.vnext.js'\"));assert.ok(api.includes('loadSchoolRuntimeRecords'));assert.equal(api.includes('loadMatchingRecords'),false,'school-majors must not use legacy full matching scan');assert.equal(api.includes('loadExactSchoolRecordsFromFiles'),false,'school-majors must not use legacy rank chunk exact scan');assert.equal(api.includes('loadAllRecords'),false,'school-majors must not expose full admissions loading');assert.ok(api.indexOf('getAdmissionSchoolDirectoryMeta')<api.indexOf('loadSchoolRuntimeRecords('),'school identity must resolve before bounded projection read');assert.ok(provider.includes(\"SCHOOL_RUNTIME_PROJECTION_VERSION = 'ln-rank-school-runtime-projection-vnext-100-shard-v1'\"));assert.ok(provider.includes('SCHOOL_RUNTIME_PROJECTION_TOTAL_RECORDS = 11628'));assert.ok(provider.includes('SCHOOL_RUNTIME_PROJECTION_SCHOOL_COUNT = 956'));assert.ok(provider.includes('SCHOOL_RUNTIME_PROJECTION_SHARD_COUNT = 100'));assert.ok(provider.includes('INDEX_CACHE_MAX_ENTRIES = 1'));assert.ok(provider.includes('SHARD_CACHE_MAX_ENTRIES = 4'));assert.ok(provider.includes('loadSchoolRuntimeRecords'));assert.ok(provider.includes('env?.ASSETS?.fetch'));assert.equal(manifest.includes('loadAllRecords'),false,'ln-rank manifest must not expose full loader');}\nfunction testCompactAliasResolverRows"""
          s2,n=re.subn(r"function testSchoolHistoryStreamingBoundary\(\)\{.*?\}\nfunction testCompactAliasResolverRows",replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'expected one school-history boundary function, got {n}')
          p.write_text(s2)
          PY
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
          git diff --check
      - name: Commit current-generation gate
        shell: bash
        run: |
          set -euo pipefail
          git add tools/verify-ai-workspace-v3990_1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align AI workspace gate with bounded school runtime'
          git push origin HEAD:agent/ln-rank-worker-resource-vnext
