name: Verify major-bands rank kernel v3990.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'functions/api/major-bands.js'
      - 'functions/_lib/major-bands-static-provider.js'
      - 'functions/_lib/major-bands-rank-*.v3990_0.js'
      - 'functions/_lib/major-bands-query-execution-cache.v3990_0.js'
      - 'functions/_lib/major-bands-result-order.v3990_0.js'
      - 'functions/_lib/major-bands-response-transport.v3990_0.js'
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/site-runtime-contract.v3990_0.js'
      - 'shared/resources/release/runtime-cache-contract.v3990_0.js'
      - 'shared/resources/resource-registry.js'
      - 'shared/governance/resource-execution-contract.v3990_0.js'
      - 'shared/governance/production-resource-verification-contract.v3990_0.js'
      - 'ln-rank/site-active-generation.v3990_0.json'
      - 'ln-rank/js/app-runtime.v3990_0.js'
      - 'ln-rank/js/self-check.v3990_0.js'
      - 'ln-rank/js/feature/major-pool/pagination-snapshot-guard.v3990_0.js'
      - 'tools/audit-major-bands-rank-kernel-v3990_0.mjs'
      - 'tools/audit-major-bands-query-execution-cache-v3990_0.mjs'
      - 'tools/build-major-bands-rank-index-v3990_0.mjs'
      - 'tools/verify-major-bands-preview-concurrency-v3990_0.mjs'
      - 'tools/verify-production-pagination-snapshot-guard-v3990_0.mjs'
      - '.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rank-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify protected paths and immutable stable dependencies
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3990-changed-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3990-changed-files.txt; then
            echo 'protected path changed'
            exit 1
          fi
          if grep -E '^(tongxue/|ln-rank/data/local-strength/|ln-rank/data/211-static/|ln-rank/data/major-bands-static-v3972_2/|functions/api/major-bands-bucket\.js$|functions/_lib/major-bands-bucket-(orchestrator|cache|transfer)\.v3972_5\.js$)' /tmp/v3990-changed-files.txt; then
            echo 'declared stable business dependency changed'
            exit 1
          fi
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js

      - name: Verify source syntax and v3990 ownership
        run: |
          set -euo pipefail
          node --check functions/api/major-bands.js
          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/_lib/major-bands-rank-index.v3990_0.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_0.js
          node --check functions/_lib/major-bands-query-execution-cache.v3990_0.js
          node --check functions/_lib/major-bands-rank-query-kernel.v3990_0.js
          node --check functions/_lib/major-bands-result-order.v3990_0.js
          node --check functions/_lib/major-bands-response-transport.v3990_0.js
          node --check ln-rank/js/feature/major-pool/pagination-snapshot-guard.v3990_0.js
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node --check tools/build-major-bands-rank-index-v3990_0.mjs
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/verify-production-pagination-snapshot-guard-v3990_0.mjs
          grep -q "majorBandsQueryKernelVersion: 'major-bands-rank-query-kernel-v3990_0'" shared/resources/release/current-release.js
          grep -q "majorBandsPaginationVersion: 'stable-full-id-snapshot-v3990_0'" shared/resources/release/current-release.js
          grep -q "majorBandsStableWorkerVersion: 'major-bands-bounded-fanout-v3972_5'" shared/resources/release/current-release.js
          grep -q "majorBandsRankTruthEqualsRecall: true" shared/resources/release/site-runtime-contract.v3990_0.js
          grep -q "majorBandsPublicHttpSelfFanoutForbidden: true" shared/resources/release/site-runtime-contract.v3990_0.js
          grep -q "MAJOR_BANDS_QUERY_EXECUTION_CACHE_VERSION" functions/api/major-bands.js
          grep -q "executeMajorBandsQueryOnce" functions/api/major-bands.js
          grep -q "MAJOR_BANDS_QUERY_EXECUTION_CACHE_MODE = 'serialized-compact-snapshot-v3990_0'" functions/_lib/major-bands-query-execution-cache.v3990_0.js
          grep -q "MAX_COMPLETED_QUERIES = 1" functions/_lib/major-bands-query-execution-cache.v3990_0.js
          grep -q "MAX_COMPLETED_RECORDS = 6000" functions/_lib/major-bands-query-execution-cache.v3990_0.js
          grep -q "MAX_COMPLETED_ESTIMATED_BYTES = 2_000_000" functions/_lib/major-bands-query-execution-cache.v3990_0.js
          grep -q "serializedSnapshotOnly: true" functions/_lib/major-bands-query-execution-cache.v3990_0.js
          grep -q "major-bands-pagination-snapshot-guard-v3990_0" ln-rank/js/feature/major-pool/pagination-snapshot-guard.v3990_0.js
          grep -q "majorBandsPaginationSnapshotGuard" ln-rank/site-active-generation.v3990_0.json
          if grep -Eq "runMajorBandsBucketWorkers|new URL\('/api/major-bands-bucket'|maxCandidates|selected\.buckets\.length > 12" functions/api/major-bands.js; then
            echo 'retired self-fanout or candidate cap returned'
            exit 1
          fi

      - name: Run full truth, recall and pagination audit
        run: |
          set -euo pipefail
          node tools/build-major-bands-rank-index-v3990_0.mjs
          git diff --exit-code -- functions/_lib/major-bands-rank-index.v3990_0.js
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/major-bands-rank-kernel-v3990_0.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --experimental-default-type=module tools/audit-canonical-release-version-v3990_0.mjs
          node --experimental-default-type=module tools/audit-site-runtime-generation-v3990_0.mjs
          node --experimental-default-type=module tools/audit-unified-resource-graph-v3990_0.mjs
          python3 tools/ln-2026/verify-final-release-v3990_0.py

      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-bands-rank-source-v3990-0
          path: |
            /tmp/v3990-changed-files.txt
            /tmp/major-bands-rank-kernel-v3990_0.json
          if-no-files-found: warn
          retention-days: 7

  local-real-concurrency:
    if: github.event_name == 'pull_request'
    needs: source-rank-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start local Pages Worker
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8793 --compatibility-date=2026-07-01 >/tmp/v3990-wrangler.log 2>&1 &
          echo "$!" > /tmp/v3990-wrangler.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8793/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16' | grep -q 'major-bands-query-execution-cache-serialized-v3990_0'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Verify local pagination snapshot deployment contract
        env:
          PAGES_BASE: http://127.0.0.1:8793
          CUSTOM_BASE: http://127.0.0.1:8793
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          PRODUCTION_PAGINATION_SNAPSHOT_EVIDENCE: /tmp/major-bands-local-pagination-snapshot-v3990_0.json
        run: |
          set -euo pipefail
          node tools/verify-production-pagination-snapshot-guard-v3990_0.mjs
      - name: Verify real local concurrency levels
        env:
          TARGET_BASE: http://127.0.0.1:8793
          CONCURRENCY_LEVELS: 1,5,10,25,50
          CONCURRENCY_WAVES: '2'
          COLD_HARD_LIMIT_MS: '12000'
          P95_LIMIT_MS: '7000'
          P99_LIMIT_MS: '12000'
          HARD_LIMIT_MS: '20000'
          MAJOR_BANDS_CONCURRENCY_EVIDENCE: /tmp/major-bands-local-concurrency-v3990_0.json
        run: |
          set -euo pipefail
          node tools/verify-major-bands-preview-concurrency-v3990_0.mjs
      - name: Stop local Pages Worker
        if: always()
        run: |
          if [ -f /tmp/v3990-wrangler.pid ]; then kill "$(cat /tmp/v3990-wrangler.pid)" || true; fi
      - name: Upload local concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-bands-local-concurrency-v3990-0
          path: |
            /tmp/major-bands-local-concurrency-v3990_0.json
            /tmp/major-bands-local-pagination-snapshot-v3990_0.json
            /tmp/v3990-wrangler.log
          if-no-files-found: warn
          retention-days: 7

  preview-real-concurrency:
    if: github.event_name == 'pull_request'
    needs: source-rank-audit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve target deployment
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            slug="$(printf '%s' "$PR_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28 | sed -E 's/-+$//')"
            test -n "$slug"
            echo "TARGET_BASE=https://${slug}.gaokao-4y9.pages.dev" >> "$GITHUB_ENV"
          else
            echo 'TARGET_BASE=https://gaokao-4y9.pages.dev' >> "$GITHUB_ENV"
          fi
      - name: Wait for exact rank kernel deployment
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            body="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${TARGET_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&deploy=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q '"queryKernelVersion":"major-bands-rank-query-kernel-v3990_0"' <<<"$body" \
              && grep -q '"queryExecutionCacheVersion":"major-bands-query-execution-cache-serialized-v3990_0"' <<<"$body" \
              && grep -q '"publicHttpSelfFanout":false' <<<"$body" \
              && grep -q '"bucketWorkerCount":0' <<<"$body"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
      - name: Verify Preview pagination snapshot deployment contract
        env:
          PAGES_BASE: ${{ env.TARGET_BASE }}
          CUSTOM_BASE: ${{ env.TARGET_BASE }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '3'
          PRODUCTION_RESOURCE_WAIT_MS: '5000'
          PRODUCTION_PAGINATION_SNAPSHOT_EVIDENCE: /tmp/major-bands-preview-pagination-snapshot-v3990_0.json
        run: |
          set -euo pipefail
          node tools/verify-production-pagination-snapshot-guard-v3990_0.mjs
      - name: Verify Preview real concurrency
        env:
          CONCURRENCY_LEVELS: 1,5,10,25,50
          CONCURRENCY_WAVES: '2'
          COLD_HARD_LIMIT_MS: '15000'
          P95_LIMIT_MS: '8000'
          P99_LIMIT_MS: '15000'
          HARD_LIMIT_MS: '25000'
          MAJOR_BANDS_CONCURRENCY_EVIDENCE: /tmp/major-bands-preview-concurrency-v3990_0.json
        run: |
          set -euo pipefail
          node tools/verify-major-bands-preview-concurrency-v3990_0.mjs
      - name: Upload Preview concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-bands-preview-concurrency-v3990-0
          path: |
            /tmp/major-bands-preview-concurrency-v3990_0.json
            /tmp/major-bands-preview-pagination-snapshot-v3990_0.json
          if-no-files-found: warn
          retention-days: 7
