name: Verify major-bands rank kernel v3990.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'functions/api/major-bands.js'
      - 'functions/_lib/major-bands-static-provider.js'
      - 'functions/_lib/major-bands-rank-*.v3990_2.js'
      - 'functions/_lib/major-bands-query-execution-cache.v3990_1.js'
      - 'functions/_lib/major-bands-all-bands-page-cache.v3990_1.js'
      - 'functions/_lib/major-bands-result-order.v3990_2.js'
      - 'functions/_lib/major-bands-response-transport.v3990_2.js'
      - 'functions/_lib/major-filter.v3990_2.js'
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/site-runtime-contract.v3990_2.js'
      - 'shared/resources/release/runtime-cache-contract.v3990_2.js'
      - 'shared/resources/resource-registry.js'
      - 'shared/resources/geo/china-region-catalog.v3990_2.js'
      - 'shared/governance/resource-execution-contract.v3990_2.js'
      - 'shared/governance/production-resource-verification-contract.v3990_2.js'
      - 'ln-rank/site-active-generation.v3990_2.json'
      - 'ln-rank/js/app-runtime.v3990_2.js'
      - 'ln-rank/js/self-check.v3990_2.js'
      - 'ln-rank/js/feature/major-pool/pagination-snapshot-guard.v3990_2.js'
      - 'tools/audit-major-bands-rank-kernel-v3990_2.mjs'
      - 'tools/build-major-bands-rank-index-v3990_2.mjs'
      - 'tools/verify-major-bands-preview-concurrency-v3990_2.mjs'
      - 'tools/verify-major-bands-preview-concurrency-paced-v3990_2.mjs'
      - '.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'
      - 'docs/plans/major-bands-bounded-fanout-gate-recovery-v001.md'
      - 'docs/status/major-bands-bounded-fanout-gate-recovery-v001-status.json'
  # BF-02: this verification gate is PR/manual only; main is covered by production checks.
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: read

jobs:
  source-rank-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify protected paths and immutable stable dependencies
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3990-1-changed-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3990-1-changed-files.txt; then
            echo 'protected path changed'
            exit 1
          fi
          stable_business_changes="$(grep -E '^(ln-rank/data/local-strength/|ln-rank/data/211-static/|ln-rank/data/major-bands-static-v3972_2/|functions/api/major-bands-bucket[.]js$|functions/_lib/major-bands-bucket-(orchestrator|cache|transfer)[.]v3972_5[.]js$)' /tmp/v3990-1-changed-files.txt || true)"
          stable_business_changes="$stable_business_changes
$(grep -E '^tongxue/' /tmp/v3990-1-changed-files.txt | grep -v -F -e 'tongxue/index.html' -e 'tongxue/changelog.html' || true)"
          if [ -n "$stable_business_changes" ]; then
            echo "$stable_business_changes"
            echo 'declared stable business dependency changed'
            exit 1
          fi
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js

      - name: Verify current owner syntax and invariants
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            functions/api/major-bands.js \
            functions/_lib/major-bands-static-provider.js \
            functions/_lib/major-bands-rank-index.v3990_2.js \
            functions/_lib/major-bands-rank-bucket-loader.v3990_2.js \
            functions/_lib/major-bands-query-execution-cache.v3990_1.js \
            functions/_lib/major-bands-all-bands-page-cache.v3990_1.js \
            functions/_lib/major-bands-rank-query-kernel.v3990_2.js \
            functions/_lib/major-bands-result-order.v3990_2.js \
            functions/_lib/major-bands-response-transport.v3990_2.js \
            functions/_lib/major-filter.v3990_2.js \
            ln-rank/js/feature/major-pool/pagination-snapshot-guard.v3990_2.js \
            tools/audit-major-bands-rank-kernel-v3990_2.mjs \
            tools/build-major-bands-rank-index-v3990_2.mjs \
            tools/verify-major-bands-preview-concurrency-v3990_2.mjs \
            tools/verify-major-bands-preview-concurrency-paced-v3990_2.mjs; do
            node --check "$file"
          done
          grep -q "majorBandsQueryKernelVersion: 'major-bands-rank-query-kernel-v3990_2'" shared/resources/release/current-release.js
          grep -q "majorBandsPaginationVersion: 'stable-full-id-snapshot-v3990_2'" shared/resources/release/current-release.js
          grep -q "majorBandsStableWorkerVersion: 'major-bands-bounded-fanout-v3972_5'" shared/resources/release/current-release.js
          grep -q "majorBandsRankTruthEqualsRecall: true" shared/resources/release/site-runtime-contract.v3990_2.js
          grep -q "majorBandsStrictNextOffset: true" shared/resources/release/site-runtime-contract.v3990_2.js
          grep -q "majorBandsHighBoundaryReturnsEmpty200: true" shared/resources/release/site-runtime-contract.v3990_2.js
          grep -q "majorBandsPublicHttpSelfFanoutForbidden: true" shared/resources/release/site-runtime-contract.v3990_2.js
          grep -q "const MAX_LOAD_CONCURRENCY = 1" functions/_lib/major-bands-rank-bucket-loader.v3990_2.js
          grep -q "const ALL_BANDS_LOAD_CONCURRENCY = 3" functions/_lib/major-bands-rank-bucket-loader.v3990_2.js
          grep -q "MAX_CONCURRENT_EXECUTIONS = 1" functions/_lib/major-bands-query-execution-cache.v3990_1.js
          grep -q "crossRequestResolverQueue: false" functions/_lib/major-bands-query-execution-cache.v3990_1.js
          grep -q "wrangler@4.121.0" .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml
          for workflow in \
            .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml \
            .github/workflows/verify-production-api-health-v3971.yml \
            .github/workflows/verify-ai-workspace-v3990_1.yml; do
            grep -Fq 'group: v3990-1-cloudflare-preview-' "$workflow"
            grep -q 'queue: max' "$workflow"
          done
          grep -q "serializedSnapshotOnly: true" functions/_lib/major-bands-query-execution-cache.v3990_1.js
          grep -q "requestedBand && canonicalPosition.bandKey !== requestedBand" functions/_lib/major-bands-rank-query-kernel.v3990_2.js
          grep -q "const tuples = new WeakMap()" functions/_lib/major-bands-result-order.v3990_2.js
          grep -q "major-bands-pagination-snapshot-guard-v3990_2" ln-rank/js/feature/major-pool/pagination-snapshot-guard.v3990_2.js
          if grep -Eq "runMajorBandsBucketWorkers|new URL\('/api/major-bands-bucket'|maxCandidates|selected\.buckets\.length > 12" functions/api/major-bands.js; then
            echo 'retired self-fanout or candidate cap returned'
            exit 1
          fi

      - name: Run full truth, recall, pagination and memory audits
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-major-bands-rank-index-v3990_2.mjs
          git diff --exit-code -- functions/_lib/major-bands-rank-index.v3990_2.js
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/major-bands-rank-kernel-v3990_2.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_2.mjs
          node --experimental-default-type=module tools/audit-canonical-release-version-v3990_2.mjs
          node --experimental-default-type=module tools/audit-site-runtime-generation-v3990_2.mjs
          node --experimental-default-type=module tools/audit-unified-resource-graph-v3990_2.mjs

          for base in audit-major-bands-query-execution-cache audit-major-bands-request-band-scope verify-production-pagination-snapshot-guard; do
            src="tools/${base}-v3990_0.mjs"
            tmp="tools/.${base}-v3990_2.generated.mjs"
            sed -e 's/v3990_0/v3990_2/g' -e 's/3990_0/3990_2/g' "$src" > "$tmp"
            node --check "$tmp"
            if [ "$base" != 'verify-production-pagination-snapshot-guard' ]; then node "$tmp"; fi
            rm -f "$tmp"
          done

          sed \
            -e 's/v3\.9\.90\.0/v3.9.90.2/g' \
            -e 's/v3990_0/v3990_2/g' \
            -e 's/3990_0/3990_2/g' \
            tools/ln-2026/verify-final-release-v3990_0.py > /tmp/verify-final-release-v3990_2.py
          python3 /tmp/verify-final-release-v3990_2.py

      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-bands-rank-source-v3990-1
          path: |
            /tmp/v3990-1-changed-files.txt
            /tmp/major-bands-rank-kernel-v3990_2.json
          if-no-files-found: warn
          retention-days: 7

  local-real-concurrency:
    if: github.event_name == 'pull_request'
    needs: source-rank-audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start local Pages Worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.121.0
          npx wrangler pages dev . --port 8793 --compatibility-date=2026-07-01 >/tmp/v3990-1-wrangler.log 2>&1 &
          echo "$!" > /tmp/v3990-1-wrangler.pid
          ready=0
          for attempt in $(seq 1 60); do
            body="$(curl -fsS 'http://127.0.0.1:8793/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16' || true)"
            if grep -q 'major-bands-query-execution-cache-single-heavy-v3990_2' <<<"$body" \
              && grep -q 'major-bands-rank-bucket-loader-bounded-all-band-v3990_2' <<<"$body" \
              && grep -q '"resultOrderVersion":"major-bands-result-order-ephemeral-v3990_2"' <<<"$body" \
              && grep -q '"queryMemoryMode":"requested-band-lightweight-order-current-page-v3990_2"' <<<"$body" \
              && grep -q '"rankBucketMaxConcurrency":1' <<<"$body"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Verify local pagination snapshot deployment contract
        env:
          PAGES_BASE: http://127.0.0.1:8793
          CUSTOM_BASE: http://127.0.0.1:8793
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '1'
          PRODUCTION_RESOURCE_WAIT_MS: '0'
          PRODUCTION_PAGINATION_SNAPSHOT_EVIDENCE: /tmp/major-bands-local-pagination-snapshot-v3990_2.json
        shell: bash
        run: |
          set -euo pipefail
          tmp=tools/.verify-production-pagination-snapshot-guard-v3990_2.generated.mjs
          sed -e 's/v3990_0/v3990_2/g' -e 's/3990_0/3990_2/g' tools/verify-production-pagination-snapshot-guard-v3990_0.mjs > "$tmp"
          node "$tmp"
          rm -f "$tmp"
      - name: Verify real local concurrency levels
        env:
          TARGET_BASE: http://127.0.0.1:8793
          CONCURRENCY_LEVELS: 1,5,10,25,50
          CONCURRENCY_WAVES: '2'
          COLD_HARD_LIMIT_MS: '12000'
          P95_LIMIT_MS: '7000'
          P99_LIMIT_MS: '12000'
          HARD_LIMIT_MS: '20000'
          MAJOR_BANDS_CONCURRENCY_EVIDENCE: /tmp/major-bands-local-concurrency-v3990_2.json
        run: node tools/verify-major-bands-preview-concurrency-v3990_2.mjs
      - name: Stop local Pages Worker
        if: always()
        run: |
          if [ -f /tmp/v3990-1-wrangler.pid ]; then kill "$(cat /tmp/v3990-1-wrangler.pid)" || true; fi
      - name: Upload local concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-bands-local-concurrency-v3990-1
          path: |
            /tmp/major-bands-local-concurrency-v3990_2.json
            /tmp/major-bands-local-pagination-snapshot-v3990_2.json
            /tmp/v3990-1-wrangler.log
          if-no-files-found: warn
          retention-days: 7

  preview-real-concurrency:
    concurrency:
      group: v3990-1-cloudflare-preview-${{ github.event.pull_request.head.sha || github.sha }}
      queue: max
    if: github.event_name == 'pull_request'
    needs: source-rank-audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact-SHA Cloudflare branch Preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${EXPECTED_SHA:0:7}"
          target=''
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then exit 2; fi
            if [ "$conclusion" = success ]; then
              comments="$(curl -fsSL --max-time 20 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"
              body="$(jq -r '[.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]")][-1].body // empty' <<<"$comments" 2>/dev/null || true)"
              if grep -q "$short_sha" <<<"$body"; then
                target="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$body" | tail -n1 || true)"
              fi
              [ -n "$target" ] && break
            fi
            sleep 8
          done
          test -n "$target"
          echo "TARGET_BASE=$target" >> "$GITHUB_ENV"
      - name: Wait for exact current rank kernel deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            body="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${TARGET_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16&deploy=${EXPECTED_SHA}-${attempt}" || true)"
            all_body="$(curl --fail --silent --show-error --location --max-time 35 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${TARGET_BASE}/api/major-bands?candidateScore=579&rangePreset=standard&limit=16&deploy=${EXPECTED_SHA}-${attempt}" || true)"
            if grep -q '"queryKernelVersion":"major-bands-rank-query-kernel-v3990_2"' <<<"$body" \
              && grep -q '"queryExecutionCacheVersion":"major-bands-query-execution-cache-single-heavy-v3990_2"' <<<"$body" \
              && grep -q '"bucketLoaderVersion":"major-bands-rank-bucket-loader-bounded-all-band-v3990_2"' <<<"$body" \
              && grep -q '"resultOrderVersion":"major-bands-result-order-ephemeral-v3990_2"' <<<"$body" \
              && grep -q '"rankBucketMaxConcurrency":1' <<<"$body" \
              && grep -q '"publicHttpSelfFanout":false' <<<"$body" \
              && grep -q '"bucketWorkerCount":0' <<<"$body" \
              && grep -q '"allBandsSharedProjectionVersion":"major-bands-all-bands-shared-projection-v3990_2"' <<<"$all_body" \
              && grep -q '"allBandsPhysicalAssetPasses":1' <<<"$all_body"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
      - name: Verify Preview pagination snapshot deployment contract
        env:
          PAGES_BASE: ${{ env.TARGET_BASE }}
          CUSTOM_BASE: ${{ env.TARGET_BASE }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCTION_RESOURCE_ATTEMPTS: '3'
          PRODUCTION_RESOURCE_WAIT_MS: '5000'
          PRODUCTION_PAGINATION_SNAPSHOT_EVIDENCE: /tmp/major-bands-preview-pagination-snapshot-v3990_2.json
        shell: bash
        run: |
          set -euo pipefail
          tmp=tools/.verify-production-pagination-snapshot-guard-v3990_2.generated.mjs
          sed -e 's/v3990_0/v3990_2/g' -e 's/3990_0/3990_2/g' tools/verify-production-pagination-snapshot-guard-v3990_0.mjs > "$tmp"
          node "$tmp"
          rm -f "$tmp"
      - name: Verify Preview real concurrency and paced exhaustive pagination
        env:
          CONCURRENCY_LEVELS: 1,5,10,25,50
          CONCURRENCY_WAVES: '2'
          COLD_HARD_LIMIT_MS: '15000'
          P95_LIMIT_MS: '8000'
          P99_LIMIT_MS: '15000'
          HARD_LIMIT_MS: '25000'
          POST_CONCURRENCY_RECOVERY_MS: '2000'
          PAGINATION_PACE_MS: '120'
          MAJOR_BANDS_CONCURRENCY_EVIDENCE: /tmp/major-bands-preview-concurrency-v3990_2.json
        run: node tools/verify-major-bands-preview-concurrency-paced-v3990_2.mjs
      - name: Upload Preview concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-bands-preview-concurrency-v3990-1
          path: |
            /tmp/major-bands-preview-concurrency-v3990_2.json
            /tmp/major-bands-preview-pagination-snapshot-v3990_2.json
          if-no-files-found: warn
          retention-days: 7
