name: Materialize v3968 release graph commit first

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute reviewed materializer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/materialize-v3968-release.yml').read_text()
          marker="python3 - <<'PY'\n"
          if marker not in source: raise SystemExit('materializer start missing')
          body=source.split(marker,1)[1].split('\n          PY',1)[0]
          Path('/tmp/materialize-v3968.py').write_text(textwrap.dedent(body))
          PY
          python3 /tmp/materialize-v3968.py
          git diff --check
      - name: Commit complete generated worktree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/workflows/materialize-v3968-release.yml' ':!.github/workflows/materialize-v3968-release-commit-first.yml'
          if ! git diff --cached --quiet; then
            git commit -m 'v3.9.68.0：生成统一背景资产活动发布图'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify committed release graph
        run: |
          set -euo pipefail
          for file in \
            ln-rank/js/app.v3968_0.js ln-rank/js/app-runtime.v3968_0.js \
            ln-rank/js/selection-pool.v3968_0.js ln-rank/js/ux/family-home.v3968_0.js \
            ln-rank/js/major-difficulty-2026.v3968_0.js zy2026/assets/zy2026.v3968_0.js \
            tongxue/app/tongxue-runtime-v159-r3968.js \
            shared/resources/release/runtime-cache-contract.v3968_0.js; do node --check "$file"; done
          node tools/audit-academic-background-v3968.mjs
