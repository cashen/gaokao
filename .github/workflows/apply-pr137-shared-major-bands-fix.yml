name: Apply PR137 shared major-bands fix

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - .github/workflows/apply-pr137-shared-major-bands-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 1
      - name: Apply bounded all-bands shared execution fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/api/major-bands.js')
          s = p.read_text(encoding='utf-8')

          old = """    const sharedProjectionEligible = input.filters.region === 'all'\n      && !input.filters.schoolKeyword\n      && !input.filters.schoolEntityId\n      && !input.filters.majorKeyword\n      && input.filters.bottomLineMode === 'all'\n      && input.filters.specialProjectMode === 'hide_eligibility_projects';"""
          new = """    const sharedProjectionEligible = !input.filters.schoolKeyword\n      && !input.filters.schoolEntityId;"""
          assert s.count(old) == 1, 'sharedProjectionEligible anchor mismatch'
          s = s.replace(old, new)

          old = """      const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, {\n        projection: MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n        rawRowStorage: 'serialized-json'\n      });"""
          new = """      const sharedProjectionUsesMinimalRows = input.filters.region === 'all'\n        && !input.filters.majorKeyword\n        && input.filters.bottomLineMode === 'all'\n        && input.filters.specialProjectMode === 'hide_eligibility_projects';\n      const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, {\n        projection: sharedProjectionUsesMinimalRows ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined,\n        rawRowStorage: sharedProjectionUsesMinimalRows ? 'serialized-json' : undefined,\n        predecodeRegion: input.filters.region\n      });"""
          assert s.count(old) == 1, 'shared loader anchor mismatch'
          s = s.replace(old, new)

          old = """        majorKeyword: '',\n        bottomLineMode: input.filters.bottomLineMode,"""
          new = """        majorKeyword: input.filters.majorKeyword,\n        bottomLineMode: input.filters.bottomLineMode,"""
          assert s.count(old) == 1, 'shared keyword anchor mismatch'
          s = s.replace(old, new)

          old = """    const orderedPage = ordered.slice(pageOffset, pageOffset + pageLimit);\n    pageRecords = orderedPage.map(record => {\n      if (!(Array.isArray(record.majorBandsRawRow) || typeof record.majorBandsRawRow === 'string') || !Array.isArray(record.majorBandsRawSchema)) {\n        throw new Error(`位次共享投影缺少原始行引用：${record.id || 'unknown'}`);\n      }\n      return decodeMajorBandsStaticRow(record.majorBandsRawRow, record.majorBandsRawSchema);\n    });"""
          new = """    const orderedPage = ordered.slice(pageOffset, pageOffset + pageLimit);\n    const sharedProjectionUsesRawRows = allBandsShared.loadedStats.minimalProjection === true;\n    pageRecords = sharedProjectionUsesRawRows\n      ? orderedPage.map(record => {\n          if (!(Array.isArray(record.majorBandsRawRow) || typeof record.majorBandsRawRow === 'string') || !Array.isArray(record.majorBandsRawSchema)) {\n            throw new Error(`位次共享投影缺少原始行引用：${record.id || 'unknown'}`);\n          }\n          return decodeMajorBandsStaticRow(record.majorBandsRawRow, record.majorBandsRawSchema);\n        })\n      : orderedPage;"""
          assert s.count(old) == 1, 'shared page reuse anchor mismatch'
          s = s.replace(old, new)

          old = """    orderCacheStatus = 'all-bands-shared-projection';\n    orderPageSource = 'all-bands-shared-projection';"""
          new = """    orderCacheStatus = sharedProjectionUsesRawRows\n      ? 'all-bands-shared-projection'\n      : 'all-bands-shared-full-record';\n    orderPageSource = orderCacheStatus;"""
          assert s.count(old) == 1, 'shared page source anchor mismatch'
          s = s.replace(old, new)

          old = """    const executionIdentity = `${executionBaseIdentity}|current-page:${pageOffset}:${pageLimit}`;\n    const execution = !filters.majorKeyword\n      ? await executeRequestedBandOrderedPage(context, {"""
          new = """    const executionIdentity = `${executionBaseIdentity}|current-page:${pageOffset}:${pageLimit}`;\n    const canReuseAllBandsShared = Boolean(\n      context?.majorBandsAllBandsShared?.version === MAJOR_BANDS_ALL_BANDS_SHARED_PROJECTION_VERSION\n      && context?.majorBandsAllBandsShared?.processed\n    );\n    const execution = (!filters.majorKeyword || canReuseAllBandsShared)\n      ? await executeRequestedBandOrderedPage(context, {"""
          assert s.count(old) == 1, 'keyword shared execution anchor mismatch'
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

          node --check functions/api/major-bands.js
          node tools/verify-major-bands-predecode-region-v3990_1.mjs
          git diff --check
      - name: Commit branch fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-pr137-shared-major-bands-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/api/major-bands.js .github/workflows/apply-pr137-shared-major-bands-fix.yml
          git commit -m "fix: reuse filtered all-band major queries"
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
