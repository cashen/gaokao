name: One-time v3990 Ready deploy gate

on:
  push:
    branches:
      - agent/deploy-workflow-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-ready-deploy-gate.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deploy-workflow-v3990_0
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Ready deploy-gate audit
        run: python3 tools/zz_patch_v3990_ready_deploy_gate.py
      - name: Verify Ready deploy gate and production audit
        run: |
          set -euo pipefail
          grep -Fq 'types: [opened, synchronize, reopened, ready_for_review]' .github/workflows/deploy-cloudflare-pages-main.yml
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-canonical-release-version-v3990_0.mjs
          node tools/audit-site-runtime-generation-v3990_0.mjs
      - name: Commit verified Ready deploy-gate audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'test(release): require deploy gate on Ready transition'
          git push origin HEAD:agent/deploy-workflow-v3990_0
