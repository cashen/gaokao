name: Verify AI major-region history v3992_3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'aiplus/**'
      - 'functions/api/ai/major-history.js'
      - 'functions/_lib/ai/**'
      - 'ln-rank/data/ai-major-history-v3990_1/**'
      - 'tools/build-ai-major-history-index-v3990_2.mjs'
      - 'tools/verify-ai-major-region-history-v3992_3.mjs'
      - 'tools/browser-ai-workspace-v3990_2.mjs'
      - '.github/workflows/verify-ai-major-region-history-v3992_3.yml'
  push:
    branches: [main]
    paths:
      - 'aiplus/**'
      - 'functions/api/ai/major-history.js'
      - 'functions/_lib/ai/**'
      - 'ln-rank/data/ai-major-history-v3990_1/**'
      - 'tools/build-ai-major-history-index-v3990_2.mjs'
      - 'tools/verify-ai-major-region-history-v3992_3.mjs'
      - 'tools/browser-ai-workspace-v3990_2.mjs'
      - '.github/workflows/verify-ai-major-region-history-v3992_3.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: read

jobs:
  source-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce protected paths and no temporary construction files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/major-history-changed-files.txt
          if [ "$(git ls-tree -r "$base" | wc -l)" -ge 100 ] && grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/major-history-changed-files.txt; then
            echo 'protected path changed' >&2
            exit 1
          fi
          if grep -E '(^|/)(tmp[-_]|.*tmp[-_]).*(major|history)|^\.github/workflows/tmp-' /tmp/major-history-changed-files.txt; then
            echo 'temporary construction file leaked into candidate diff' >&2
            exit 1
          fi
      - name: Verify syntax and canonical derived-index truth
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/api/ai/major-history.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check aiplus/app.v3990_2.js
          node --check tools/browser-ai-workspace-v3990_2.mjs
          node --check tools/build-ai-major-history-index-v3990_2.mjs
          node --check tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/build-ai-major-history-index-v3990_2.mjs
          git diff --exit-code -- ln-rank/data/ai-major-history-v3990_1
          node tools/verify-ai-major-region-history-v3992_3.mjs

  exact-deployment-smoke:
    needs: source-truth
    concurrency:
      group: v3990-1-cloudflare-preview-${{ github.event.pull_request.head.sha || github.sha }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Resolve exact deployment target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'push' ]; then
            echo 'TARGET_BASE=https://gaokao-4y9.pages.dev' >> "$GITHUB_ENV"
            exit 0
          fi
          short_sha="${EXPECTED_SHA:0:7}"
          target=''
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            summary="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].output.summary // empty' <<<"$checks" 2>/dev/null || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then
              echo 'Cloudflare Pages exact-SHA check failed.' >&2
              exit 2
            fi
            if [ "$conclusion" = success ]; then
              mapfile -t urls < <(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$summary" | awk '!seen[$0]++')
              if [ "${#urls[@]}" -ge 2 ]; then target="${urls[1]}"; fi
              if [ -z "$target" ]; then
                comments="$(curl -fsSL --max-time 20 \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"
                body="$(jq -r '[.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]")][-1].body // empty' <<<"$comments" 2>/dev/null || true)"
                if grep -q "$short_sha" <<<"$body"; then
                  target="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$body" | tail -n1 || true)"
                fi
              fi
              [ -n "$target" ] && break
            fi
            sleep 8
          done
          test -n "$target"
          echo "TARGET_BASE=$target" >> "$GITHUB_ENV"
          echo "Exact Functions target: $target"
      - name: Wait for exact SHA and verify the user's real question dataset
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 72); do
            health="$(curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${TARGET_BASE}/api/ai/health?majorHistory=${EXPECTED_SHA}-${attempt}" || true)"
            if grep -q "\"commitSha\":\"${EXPECTED_SHA}\"" <<<"$health"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error --location --max-time 45 \
            -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            --get "${TARGET_BASE}/api/ai/major-history" \
            --data-urlencode 'major=测控技术与仪器' \
            --data-urlencode 'region=ln' \
            --data-urlencode 'offset=0' \
            --data-urlencode 'limit=100' > /tmp/major-history-live.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/major-history-live.json','utf8'));
          if(data?.ok!==true) throw new Error(`live major history not ok: ${JSON.stringify(data)}`);
          if(data?.apiVersion!=='ai-major-region-history-api-v3990_2') throw new Error(`api version drift: ${data?.apiVersion}`);
          if(data?.indexVersion!=='ai-major-history-index-v3990_1') throw new Error(`stable index version drift: ${data?.indexVersion}`);
          if(Number(data?.source?.sourceRecordCount)!==11628||data?.source?.sameTruthSet!==true) throw new Error('source truth contract drift');
          if(Number(data?.total)!==14||Number(data?.summary?.schoolCount)!==11) throw new Error(`measurement count drift: ${JSON.stringify(data?.summary)}`);
          if(Number(data?.summary?.minScore)!==467||Number(data?.summary?.maxScore)!==594) throw new Error(`measurement score range drift: ${JSON.stringify(data?.summary)}`);
          if(data?.complete!==true||!Array.isArray(data?.records)||data.records.length!==14) throw new Error('measurement result must be complete');
          if(data.records.some(item=>item?.province!=='辽宁')) throw new Error('region leakage outside Liaoning');
          if(!data.records.some(item=>item?.school==='辽宁大学'&&Number(item?.score2026)===594)) throw new Error('expected Liaoning University top row missing');
          if(!data.records.some(item=>item?.school==='沈阳工业大学'&&Number(item?.score2026)===563)) throw new Error('expected Shenyang University of Technology row missing');
          console.log(JSON.stringify({ok:true,total:data.total,schoolCount:data.summary.schoolCount,minScore:data.summary.minScore,maxScore:data.summary.maxScore},null,2));
          NODE
