name: Bootstrap v3966 validation snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - tools/run-v3966-snapshot.txt

permissions:
  contents: read

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - name: Create working-tree snapshot
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules -czf /tmp/v3966-working-tree.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: v3966-working-tree-${{ github.run_id }}
          path: /tmp/v3966-working-tree.tar.gz
          retention-days: 1
