name: Verify AIPLuS region school directory v0.02

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'functions/_lib/ai/**'
      - 'functions/api/ai/major-history.js'
      - 'tools/verify-ai-region-school-directory-v002.mjs'
      - 'tools/verify-aiplus-human-dialog-v3990_3.mjs'
      - 'tools/verify-ai-major-region-history-v3992_3.mjs'
      - 'tongxue/data/school-name-resolver-v150.js'
      - 'tongxue/data/school-search-index.20260617-v150.json'
      - '.github/workflows/verify-ai-region-school-directory-v002.yml'
  push:
    branches: [main]
    paths:
      - 'functions/_lib/ai/**'
      - 'functions/api/ai/major-history.js'
      - 'tools/verify-ai-region-school-directory-v002.mjs'
      - 'tools/verify-aiplus-human-dialog-v3990_3.mjs'
      - 'tools/verify-ai-major-region-history-v3992_3.mjs'
      - 'tongxue/data/school-name-resolver-v150.js'
      - 'tongxue/data/school-search-index.20260617-v150.json'
      - '.github/workflows/verify-ai-region-school-directory-v002.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce protected paths
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}" --depth=1 || true
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | tee /tmp/region-school-files.txt
          if [ "$(git ls-tree -r "origin/${GITHUB_BASE_REF}" | wc -l)" -ge 100 ] && grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/region-school-files.txt; then
            echo 'Protected path touched by region-school change.' >&2
            exit 1
          fi
      - name: Verify source contracts and preserved AIPLuS semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'RELEASE_CONTRACT' functions/_lib/release-contract.js
          test ! -e functions/_lib/ai/data/region-schools.json
          node --check functions/_lib/ai/school-directory-resource.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/api/ai/major-history.js
          node --check tools/verify-ai-region-school-directory-v002.mjs
          node tools/verify-ai-region-school-directory-v002.mjs
          node tools/verify-aiplus-human-dialog-v3990_3.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/verify-ai-workspace-v3990_3.mjs
          node tools/verify-aiplus-v002-contract.mjs
          node tools/audit-aiplus-v002-ui.mjs
          node tools/audit-architecture-handoff-v3990_3.mjs
          node tools/audit-site-runtime-generation-v3990_3.mjs

  preview-contract:
    if: github.event_name == 'pull_request'
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Resolve exact-SHA Cloudflare Preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          immutable=''
          branch=''
          short="${EXPECTED_SHA:0:7}"
          for attempt in $(seq 1 70); do
            checks="$(curl -fsSL --max-time 20 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GH_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?per_page=100" || true)"
            conclusion="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].conclusion // empty' <<<"$checks" 2>/dev/null || true)"
            summary="$(jq -r '[.check_runs[]? | select(.name == "Cloudflare Pages")][0].output.summary // empty' <<<"$checks" 2>/dev/null || true)"
            if [ "$conclusion" = failure ] || [ "$conclusion" = cancelled ]; then exit 2; fi
            if [ "$conclusion" = success ]; then
              mapfile -t urls < <(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$summary" | awk '!seen[$0]++')
              immutable="${urls[0]:-}"
              if [ "${#urls[@]}" -ge 2 ]; then branch="${urls[1]}"; fi
              if [ -z "$branch" ] || [ "$branch" = "$immutable" ]; then
                comments="$(curl -fsSL --max-time 20 \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "https://api.github.com/repos/${GH_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" || true)"
                body="$(jq -r '[.[]? | select(.user.login == "cloudflare-workers-and-pages[bot]")][-1].body // empty' <<<"$comments" 2>/dev/null || true)"
                if grep -q "$short" <<<"$body"; then branch="$(grep -Eo 'https://[A-Za-z0-9-]+\.gaokao-4y9\.pages\.dev' <<<"$body" | tail -n1 || true)"; fi
              fi
              if [ -n "$immutable" ] && [ -n "$branch" ] && [ "$immutable" != "$branch" ]; then break; fi
            fi
            sleep 8
          done
          test -n "$immutable"
          test -n "$branch"
          test "$immutable" != "$branch"
          echo "immutable=$immutable" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Verify human region queries on Preview Functions
        env:
          PREVIEW_BASE: ${{ steps.preview.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          post_turn() {
            local label="$1" input="$2" score="${3:-}" payload body status
            if [ -n "$score" ]; then
              payload="$(jq -nc --arg input "$input" --argjson score "$score" '{workspace:{contractVersion:"ai-workspace-contract-v3992_1",examContext:{score:$score},activeView:{score:$score,regionKeys:["all"],majorKeywords:[],schoolNames:[],bottomLineMode:"all"},viewHistory:[],tasks:[],hardConstraints:[],softPreferences:[]},input:$input}')"
            else
              payload="$(jq -nc --arg input "$input" '{workspace:{contractVersion:"ai-workspace-contract-v3992_1",examContext:{},activeView:{regionKeys:["all"],majorKeywords:[],schoolNames:[],bottomLineMode:"all"},viewHistory:[],tasks:[],hardConstraints:[],softPreferences:[]},input:$input}')"
            fi
            body="$(mktemp)"
            status="$(curl --silent --show-error --location --max-time 80 -H 'Content-Type: application/json' -H 'Cache-Control: no-cache' -X POST -o "$body" -w '%{http_code}' "${PREVIEW_BASE}/api/ai/turn?candidate=${EXPECTED_SHA}&probe=${label}" --data "$payload" || true)"
            if [ "$status" != 200 ]; then echo "${label} HTTP ${status}" >&2; cat "$body" >&2; rm -f "$body"; return 1; fi
            cat "$body"
            rm -f "$body"
          }

          shenyang="$(post_turn shenyang '沈阳有哪些大学？' 580)"
          jq -e '.command.agentTask=="region_school_directory" and .commitView==false and .result.regionSchools.ok==true and .result.regionSchools.region.city=="沈阳" and .result.regionSchools.summary.regionTotal==45 and .result.regionSchools.summary.regionUndergraduateCount==26 and .result.regionSchools.summary.regionJuniorCollegeCount==19' <<<"$shenyang" >/dev/null

          liaoning="$(post_turn liaoning '辽宁有多少大学？')"
          jq -e '.command.agentTask=="region_school_directory" and .commitView==false and .result.regionSchools.ok==true and .result.regionSchools.region.province=="辽宁" and .result.regionSchools.total>0' <<<"$liaoning" >/dev/null

          shenzhen="$(post_turn shenzhen '深圳有哪些大学？')"
          jq -e '.command.agentTask=="region_school_directory" and .command.regionKeys[0]=="city:深圳" and .commitView==false and .result.regionSchools.ok==true and .result.regionSchools.region.city=="深圳" and .result.regionSchools.summary.regionTotal==10 and .result.regionSchools.summary.regionUndergraduateCount==8 and .result.regionSchools.summary.regionJuniorCollegeCount==2' <<<"$shenzhen" >/dev/null
