name: Agent v3956 integration

on:
  push:
    branches: [agent/tongxue-direct-handoff-v155]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, '[v3956 integrated]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tongxue-direct-handoff-v155
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic integration
        run: python3 tools/agent/apply-v3956-integration.py
      - name: Check protected paths
        run: |
          set -euo pipefail
          git diff --name-only origin/main -- | tee /tmp/v3956-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3956-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi
      - name: Syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile tools/agent/apply-v3956-integration.py
          for file in \
            tongxue/app/tongxue-direct-handoff-v155.js \
            tongxue/app/tongxue-performance-v155.js \
            shared/resources/reports/feishu-report-contract.js \
            functions/_lib/feishu-report-service.js \
            functions/_lib/report-data-service-v3956.js \
            functions/_lib/feishu-report-builder.js \
            functions/_lib/feishu-selection-pool-report-builder.js \
            functions/api/feishu-create-report.js \
            functions/api/feishu-create-selection-pool-report.js \
            functions/api/feishu-report-health.js \
            functions/api/ln-rank-self-check.js \
            ln-rank/js/app.v3956_0.js \
            ln-rank/js/selection-pool.v3956_0.js \
            ln-rank/js/shared/feishu-api-client.v3956_0.js \
            ln-rank/js/feature/report/payload-builder.v3956_0.js \
            ln-rank/js/feature/feishu/report-controller.v3956_0.js \
            ln-rank/js/feature/feishu/report-render.v3956_0.js \
            ln-rank/js/self-check.v3956_0.js \
            tools/verify-feishu-report-v3956.mjs \
            tools/audit-shared-resource-center-v3956.mjs \
            tools/audit-active-runtime-v3956.mjs \
            tools/tongxue/verify-direct-handoff-v155.mjs; do
              node --check "$file"
          done
      - name: Focused integration regressions
        run: |
          set -euo pipefail
          node tools/tongxue/verify-direct-handoff-v155.mjs
          node tools/verify-feishu-report-v3956.mjs
          node tools/audit-feishu-copy-contract.mjs
          node tools/audit-shared-resource-center-v3956.mjs
          node tools/audit-active-runtime-v3956.mjs
      - name: Commit generated integration
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No integration changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate v3956 Feishu and Tongxue fixes [v3956 integrated]'
          git push origin HEAD:agent/tongxue-direct-handoff-v155
