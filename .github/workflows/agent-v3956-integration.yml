name: Agent v3956 finalization

on:
  push:
    branches: [agent/tongxue-direct-handoff-v155]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tongxue-direct-handoff-v155
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release finalization
        id: finalize_patch
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          target = Path('tools/agent/finalize-v3956.py')
          source = target.read_text(encoding='utf-8')
          marker = '# Final branch cleanup. These files exist only to materialize the integration and must not enter main.'
          if marker in source:
              source = source.split(marker, 1)[0] + "print('v3956 release finalized; temporary files retained for connector cleanup')\n"
              target.write_text(source, encoding='utf-8')
          PY
          python3 tools/agent/finalize-v3956.py > /tmp/v3956-finalize.log 2>&1
          status=$?
          cat /tmp/v3956-finalize.log
          exit "$status"
      - name: Upload finalization diagnostic
        if: failure() && steps.finalize_patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v3956-finalize-error
          path: /tmp/v3956-finalize.log
          if-no-files-found: error
          retention-days: 1
      - name: Check protected paths
        run: |
          set -euo pipefail
          git diff --name-only origin/main -- | tee /tmp/v3956-final-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3956-final-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi
      - name: Syntax and release contracts
        run: |
          set -euo pipefail
          node tools/check-ln-2026-release.mjs
          python3 tools/ln-2026/verify-final-release-v3.py
          node tools/tongxue/verify-directory.mjs
          node tools/tongxue/verify-brand-ui-v152.mjs
          node tools/tongxue/verify-interaction-v153.mjs
          node tools/tongxue/verify-school-region-ui-v150.mjs
          node tools/tongxue/verify-share.mjs
      - name: Integrated functional gates
        run: |
          set -euo pipefail
          node tools/tongxue/verify-direct-handoff-v155.mjs
          node tools/verify-feishu-report-v3956.mjs
          node tools/audit-feishu-copy-contract.mjs
          node tools/audit-shared-resource-center-v3956.mjs
          node tools/audit-active-runtime-v3956.mjs
      - name: JavaScript syntax sweep
        run: |
          set -euo pipefail
          git diff --name-only origin/main -- '*.js' '*.mjs' | while read -r file; do
            test -z "$file" || node --check "$file"
          done
      - name: Commit finalized release
        id: commit_release
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v3.9.56.0 release contracts' > /tmp/v3956-commit.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git push origin HEAD:agent/tongxue-direct-handoff-v155 >> /tmp/v3956-commit.log 2>&1
            status=$?
          fi
          cat /tmp/v3956-commit.log
          exit "$status"
      - name: Upload commit diagnostic
        if: failure() && steps.commit_release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v3956-commit-error
          path: /tmp/v3956-commit.log
          if-no-files-found: error
          retention-days: 1
