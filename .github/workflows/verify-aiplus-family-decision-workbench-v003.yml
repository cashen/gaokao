name: Verify AIPLuS family decision workbench v0.03

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'aiplus/**'
      - 'shared/ai/ai-workspace-model.v3992_0.js'
      - 'shared/ai/ai-workspace-contract.v3992_0.js'
      - 'shared/ai/decision-progress.v003.js'
      - 'shared/ai/decision-book.v003.js'
      - 'functions/_lib/ai/mentor-profile.js'
      - 'functions/_lib/ai/decision-reflection.js'
      - 'functions/_lib/ai/next-action-engine.js'
      - 'functions/_lib/ai/advisor-presentation.js'
      - 'functions/_lib/ai/turn-orchestrator.js'
      - 'tools/verify-aiplus-family-decision-workbench-v003.mjs'
      - 'docs/architecture/AIPLUS-FAMILY-DECISION-WORKBENCH-STATUS.md'
      - '.github/workflows/verify-aiplus-family-decision-workbench-v003.yml'
  push:
    branches: [main]
    paths:
      - 'aiplus/**'
      - 'shared/ai/ai-workspace-model.v3992_0.js'
      - 'shared/ai/ai-workspace-contract.v3992_0.js'
      - 'shared/ai/decision-progress.v003.js'
      - 'shared/ai/decision-book.v003.js'
      - 'functions/_lib/ai/mentor-profile.js'
      - 'functions/_lib/ai/decision-reflection.js'
      - 'functions/_lib/ai/next-action-engine.js'
      - 'functions/_lib/ai/advisor-presentation.js'
      - 'functions/_lib/ai/turn-orchestrator.js'
      - 'tools/verify-aiplus-family-decision-workbench-v003.mjs'
      - 'docs/architecture/AIPLUS-FAMILY-DECISION-WORKBENCH-STATUS.md'
      - '.github/workflows/verify-aiplus-family-decision-workbench-v003.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce FDW ownership and protected boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1 || true
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | tee /tmp/fdw-files.txt
            if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/fdw-files.txt; then
              echo 'Protected path touched by FDW.' >&2
              exit 1
            fi
          fi
          grep -q 'LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q "AI_DECISION_PROGRESS_VERSION='ai-decision-progress-v0.03'" shared/ai/decision-progress.v003.js
          grep -q "AI_DECISION_BOOK_VERSION='ai-decision-book-v0.03'" shared/ai/decision-book.v003.js
          grep -q "AI_DECISION_REFLECTION_VERSION='ai-decision-reflection-v0.03'" functions/_lib/ai/decision-reflection.js
          grep -q 'mutatesWorkspace:false' functions/_lib/ai/decision-reflection.js
          grep -q 'autoExecutesTools:false' functions/_lib/ai/decision-reflection.js
          grep -q 'id="decisionProgressList"' aiplus/index.html
          grep -q 'id="decisionBookContent"' aiplus/index.html
          grep -q 'id="mobileDecisionStrip"' aiplus/index.html
          ! grep -q 'id="probeModel"' aiplus/index.html
          ! grep -q 'id="healthBar"' aiplus/index.html
      - name: Syntax check FDW graph
        shell: bash
        run: |
          set -euo pipefail
          node --check shared/ai/ai-workspace-model.v3992_0.js
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check shared/ai/decision-progress.v003.js
          node --check shared/ai/decision-book.v003.js
          node --check functions/_lib/ai/mentor-profile.js
          node --check functions/_lib/ai/decision-reflection.js
          node --check functions/_lib/ai/next-action-engine.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check aiplus/render.v3992_0.js
          node --check aiplus/app.v3990_1.js
          node --check tools/verify-aiplus-family-decision-workbench-v003.mjs
      - name: Verify family decision workbench
        run: node tools/verify-aiplus-family-decision-workbench-v003.mjs
      - name: Preserve established AIPLuS regressions
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/verify-aiplus-aek-v001.mjs
          node tools/verify-aiplus-aek-journeys-v001.mjs
          node tools/verify-ai-major-region-history-v3992_3.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
