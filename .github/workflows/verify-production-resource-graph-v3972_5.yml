name: Historical production resource graph v3972.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve historical v3972.5 production verifier
        run: |
          set -euo pipefail
          node --check tools/verify-production-resource-graph-v3972_5.mjs
          echo 'v3972.5 production evidence is historical; automatic production ownership moved to v3990.0.'

