name: Temporary AI Plus school official integration v3990_2 r12

on:
  push:
    branches:
      - agent/aiplus-school-official-qa-v3990_2
    paths:
      - .github/workflows/agent-aiplus-school-official-v3990-2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-school-official-qa-v3990_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch AI Plus into the existing advisor runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/.agent-aiplus-school-official-v3990_2.py')
          lines=path.read_text().splitlines()
          lines=[line for line in lines if not (line.startswith('(\"  if([\'fact_rank_lookup\'') and 'agentTask))return true;' in line)]
          path.write_text('\n'.join(lines)+'\n')
          PY
          python tools/.agent-aiplus-school-official-v3990_2.py
          git checkout -- tools/.agent-aiplus-school-official-v3990_2.py
          python - <<'PY'
          from pathlib import Path
          path=Path('functions/_lib/ai/agent-task-kernel.js')
          text=path.read_text()
          old_history="function looksHistory(source){return /(多少分|最低分|投档分|位次|排名|去年|往年|历年|历史|202[3456]|分数线)/.test(source);}"
          new_history="function looksHistory(source){return /(多少分|最低分|最低录取分|最低投档分|录取分|投档分|位次|排名|去年|往年|历年|历史|202[3456]|分数线)/.test(source);}"
          if text.count(old_history)!=1: raise SystemExit(f'looksHistory anchor count={text.count(old_history)}')
          text=text.replace(old_history,new_history,1)
          old_fit="function looksFit(source){return /(我.{0,8}(够不够|能不能上|能不能报|能上吗|能报吗|够吗|现实吗)|按我.{0,8}(分|位次)|这个分.{0,6}(能上|能报|够吗)|够得着)/.test(source);}"
          new_fit="function looksFit(source){return /(我.{0,8}(够不够|能不能上|能不能报|能上吗|能报吗|够吗|现实吗)|我\\s*\\d{3}\\s*分?.{0,6}(够|能上|能报|现实)|按我.{0,8}(分|位次)|这个分.{0,6}(能上|能报|够吗)|够得着)/.test(source);}"
          if text.count(old_fit)!=1: raise SystemExit(f'looksFit anchor count={text.count(old_fit)}')
          text=text.replace(old_fit,new_fit,1)
          anchor="  const school=schools[0]||focus.school||'',major=majors[0]||focus.major||'';"
          replacement=anchor+"\n  const explicitMajors=majors.filter(item=>item&&!schools.some(name=>String(name||'').includes(String(item||''))));\n  const officialSchoolOnly=Boolean(school&&looksOfficialSchoolInfo(source)&&!looksFit(source)&&!looksBackground(source)&&!/(多少分|最低分|最低录取分|最低投档分|录取分|投档分|分数线|位次|排名|去年|往年|历年)/.test(source)&&((schools.length&&explicitMajors.length===0)||(!schools.length&&priorTask==='school_official_qa')));"
          if text.count(anchor)!=1: raise SystemExit(f'school/major anchor count={text.count(anchor)}')
          text=text.replace(anchor,replacement,1)
          old="  if(directSchoolMajorFollowup)return'school_major_history';\n  if(school&&!major&&looksOfficialSchoolInfo(source)&&!looksHistory(source)&&!looksFit(source)&&!looksBackground(source))return'school_official_qa';"
          new="  if(officialSchoolOnly)return'school_official_qa';\n  if(directSchoolMajorFollowup&&explicitMajors.length)return'school_major_history';"
          if text.count(old)!=1: raise SystemExit(f'official/direct routing block count={text.count(old)}')
          text=text.replace(old,new,1)
          old_history_routes="  if(school&&major&&looksHistory(source))return'school_major_history';\n  if(school&&looksHistory(source))return'school_history';"
          new_history_routes="  if(school&&explicitMajors.length&&looksHistory(source))return'school_major_history';\n  if(school&&looksHistory(source))return'school_history';"
          if text.count(old_history_routes)!=1: raise SystemExit(f'history route anchor count={text.count(old_history_routes)}')
          path.write_text(text.replace(old_history_routes,new_history_routes,1))

          orchestrator=Path('functions/_lib/ai/turn-orchestrator.js')
          o=orchestrator.read_text();old_pending='result.history,result.officialSchool,result.fit';new_pending='result.history,result.fit,result.officialSchool'
          if o.count(old_pending)!=1: raise SystemExit(f'pending-tool order count={o.count(old_pending)}')
          orchestrator.write_text(o.replace(old_pending,new_pending,1))

          app=Path('ai/app.v3990_1.js')
          a=app.read_text();old_read='const cached=readSchoolHistorySessionCache(tool)||readSchoolOfficialSessionCache(tool);if(cached)return cached;';new_read='const cached=readSchoolHistorySessionCache(tool);if(cached)return cached;const officialCached=readSchoolOfficialSessionCache(tool);if(officialCached)return officialCached;'
          if a.count(old_read)!=1: raise SystemExit(f'cache-read bridge count={a.count(old_read)}')
          a=a.replace(old_read,new_read,1)
          old_put='putSchoolHistorySessionCache(tool,entry);putSchoolOfficialSessionCache(tool,entry);return entry;';new_put="if(tool.kind==='school_history'){putSchoolHistorySessionCache(tool,entry);return entry;}if(tool.kind==='school_official'){putSchoolOfficialSessionCache(tool,entry);return entry;}return entry;"
          if a.count(old_put)!=1: raise SystemExit(f'cache-write bridge count={a.count(old_put)}')
          a=a.replace(old_put,new_put,1)
          old_compact="updatedAt:String(data.updatedAt||'').slice(0,80),evidenceText:String(data.evidenceText||'').slice(0,12000)"
          new_compact="updatedAt:String(data.updatedAt||'').slice(0,80),coverage:String(data.coverage||'').slice(0,80),detailAvailable:data.detailAvailable===true,evidenceText:String(data.evidenceText||'').slice(0,12000)"
          if a.count(old_compact)!=1: raise SystemExit(f'compact official payload count={a.count(old_compact)}')
          app.write_text(a.replace(old_compact,new_compact,1))

          registry=Path('functions/_lib/ai/tool-registry.js')
          r=registry.read_text();old_registry="updatedAt:clean(payload.updatedAt,80),evidenceText:clean(payload.evidenceText,16000)";new_registry="updatedAt:clean(payload.updatedAt,80),coverage:clean(payload.coverage,80),detailAvailable:payload.detailAvailable===true,evidenceText:clean(payload.evidenceText,16000)"
          if r.count(old_registry)!=1: raise SystemExit(f'official registry payload count={r.count(old_registry)}')
          registry.write_text(r.replace(old_registry,new_registry,1))
          PY
          git diff --check
          node --check functions/_lib/ai/school-official-source.js
          node --check functions/api/ai/school-official.js
          node --check functions/_lib/ai/agent-task-kernel.js
          node --check functions/_lib/ai/command-interpreter.js
          node --check functions/_lib/ai/tool-registry.js
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/advisor-presentation.js
          node --check ai/app.v3990_1.js
          node --check ai/render.v3992_0.js
          node --check tools/verify-aiplus-school-official-v3990_2.mjs
          node --check tools/verify-ai-workspace-v3990_1.mjs
      - name: Run existing AI workspace and AI Plus truth gates
        run: node tools/verify-ai-workspace-v3990_1.mjs
      - name: Verify real Sunshine Gaokao school-card baseline
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {loadOfficialSchoolEvidence,AI_SCHOOL_OFFICIAL_ORIGIN,AI_SCHOOL_OFFICIAL_TRANSPORT_VERSION} from './functions/_lib/ai/school-official-source.js';
          const profile=await loadOfficialSchoolEvidence({school:'辽宁石油化工大学',question:'这所学校是什么定位'});
          if(!profile?.ok)throw new Error(`profile failed: ${profile?.code||''} ${profile?.message||''}`);
          if(profile.school!=='辽宁石油化工大学'||profile.schoolCode!=='10148')throw new Error(`profile entity drift ${JSON.stringify({school:profile.school,schoolCode:profile.schoolCode})}`);
          if(profile.coverage!=='official_search_card'||profile.detailAvailable!==false)throw new Error(`profile coverage drift ${profile.coverage}/${profile.detailAvailable}`);
          if(!/辽宁/.test(profile.evidenceText)||!/辽宁省教育厅/.test(profile.evidenceText)||!/本科/.test(profile.evidenceText))throw new Error(`profile card facts missing: ${profile.evidenceText}`);
          if(profile.transportVersion!==AI_SCHOOL_OFFICIAL_TRANSPORT_VERSION)throw new Error(`profile transport drift ${profile.transportVersion}`);
          for(const source of profile.sources||[]){if(new URL(source.sourceUrl).origin!==AI_SCHOOL_OFFICIAL_ORIGIN)throw new Error('profile non-CHSI source');}
          console.log(JSON.stringify({profile:true,school:profile.school,schoolCode:profile.schoolCode,coverage:profile.coverage,evidence:profile.evidenceText,sources:profile.sources},null,2));

          const detail=await loadOfficialSchoolEvidence({school:'东北石油大学',question:'录取规则怎么写'});
          if(!detail?.ok)throw new Error(`detail fallback failed: ${detail?.code||''} ${detail?.message||''}`);
          if(detail.school!=='东北石油大学')throw new Error(`detail entity drift ${detail.school}`);
          if(detail.detailAvailable!==false||detail.coverage!=='official_search_card_only')throw new Error(`detail must be explicit unavailable: ${detail.coverage}/${detail.detailAvailable}`);
          if(!/未可靠定位/.test(detail.evidenceText)||!/不得补猜/.test(detail.evidenceText))throw new Error(`detail boundary missing: ${detail.evidenceText}`);
          for(const source of detail.sources||[]){if(new URL(source.sourceUrl).origin!==AI_SCHOOL_OFFICIAL_ORIGIN)throw new Error('detail non-CHSI source');}
          console.log(JSON.stringify({detailFallback:true,school:detail.school,schoolCode:detail.schoolCode,coverage:detail.coverage,evidence:detail.evidenceText,sources:detail.sources},null,2));
          NODE
      - name: Commit tested AI Plus runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aiplus/index.html \
            ai/index.html ai/app.v3990_1.js ai/render.v3992_0.js \
            functions/api/ai/school-official.js \
            functions/_lib/ai/school-official-source.js \
            functions/_lib/ai/agent-task-kernel.js \
            functions/_lib/ai/command-interpreter.js \
            functions/_lib/ai/tool-registry.js \
            functions/_lib/ai/turn-orchestrator.js \
            functions/_lib/ai/advisor-presentation.js \
            tools/verify-aiplus-school-official-v3990_2.mjs \
            tools/verify-ai-workspace-v3990_1.mjs
          git commit -m "feat: add AI Plus school official Q&A"
          git push origin HEAD:agent/aiplus-school-official-qa-v3990_2
