name: Apply PR137 school loader single pass

on:
  push:
    branches:
      - agent/migrate-ai-frontend-to-aiplus-v3990_2
    paths:
      - .github/workflows/apply-pr137-school-loader-single-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-ai-frontend-to-aiplus-v3990_2
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace redundant exact-school scans with one bounded pass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/_lib/ln-rank-manifest.js')
          s = p.read_text(encoding='utf-8')
          old_count = '''function countToken(text, token) {
            let count = 0;
            let offset = 0;
            while (true) {
              const index = text.indexOf(token, offset);
              if (index < 0) break;
              count += 1;
              offset = index + token.length;
            }
            return count;
          }

          '''
          assert s.count(old_count) == 1, 'countToken anchor mismatch'
          s = s.replace(old_count, '')
          old = '''function exactSchoolRowsFromText(text, schoolNames, expectedRecordCount, predicate) {
            const expected = Number(expectedRecordCount || 0);
            if (!expected || countToken(text, RECORD_START) !== expected || countToken(text, SCHOOL_FIELD) !== expected) return null;
            const arrayEnd = text.lastIndexOf(']}');
            if (arrayEnd < 0) return null;

            const starts = new Set();
            for (const schoolName of [...new Set((Array.isArray(schoolNames) ? schoolNames : []).map(value => String(value || '').trim()).filter(Boolean))]) {
              const marker = `${SCHOOL_FIELD}${JSON.stringify(schoolName)}`;
              let offset = 0;
              while (true) {
                const index = text.indexOf(marker, offset);
                if (index < 0) break;
                const start = text.lastIndexOf(RECORD_START, index);
                if (start < 0) return null;
                starts.add(start);
                offset = index + marker.length;
              }
            }

            const records = [];
            for (const start of [...starts].sort((a, b) => a - b)) {
              const next = text.indexOf(RECORD_START, start + RECORD_START.length);
              const end = next >= 0 ? next - 1 : arrayEnd;
              if (end <= start) return null;
              const raw = JSON.parse(text.slice(start, end));
              if (predicate(raw)) records.push(raw);
            }
            return { records, scanned: expected, mode: 'exact-school-native-text-scan' };
          }
'''
          new = '''function exactSchoolRowsFromText(text, schoolNames, expectedRecordCount, predicate) {
            const expected = Number(expectedRecordCount || 0);
            if (!expected) return null;
            const arrayEnd = text.lastIndexOf(']}');
            if (arrayEnd < 0) return null;

            const markers = [...new Set((Array.isArray(schoolNames) ? schoolNames : [])
              .map(value => String(value || '').trim())
              .filter(Boolean))]
              .map(schoolName => `${SCHOOL_FIELD}${JSON.stringify(schoolName)}`);
            if (!markers.length) return null;

            const records = [];
            let scanned = 0;
            let start = text.indexOf(RECORD_START);
            while (start >= 0) {
              const next = text.indexOf(RECORD_START, start + RECORD_START.length);
              const end = next >= 0 ? next - 1 : arrayEnd;
              if (end <= start) return null;
              const recordText = text.slice(start, end);
              const schoolField = recordText.indexOf(SCHOOL_FIELD);
              if (schoolField < 0 || recordText.indexOf(SCHOOL_FIELD, schoolField + SCHOOL_FIELD.length) >= 0) return null;
              scanned += 1;
              if (markers.some(marker => recordText.includes(marker))) {
                const raw = JSON.parse(recordText);
                if (predicate(raw)) records.push(raw);
              }
              if (next < 0) break;
              start = next;
            }
            if (scanned !== expected) return null;
            return { records, scanned, mode: 'exact-school-native-text-scan' };
          }
'''
          assert s.count(old) == 1, 'exactSchoolRowsFromText anchor mismatch'
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          node --check functions/_lib/ln-rank-manifest.js
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          git diff --check
      - name: Commit loader fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-pr137-school-loader-single-pass.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/_lib/ln-rank-manifest.js .github/workflows/apply-pr137-school-loader-single-pass.yml
          git commit -m "perf: scan exact school chunks once"
          git push origin HEAD:agent/migrate-ai-frontend-to-aiplus-v3990_2
