name: One-time v3990 production baseline fix

on:
  push:
    branches:
      - agent/production-challenge-boundary-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-baseline-fix.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-challenge-boundary-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply baseline patch
        run: python3 tools/zz_patch_v3990_baseline.py
      - name: Verify source and live production baseline
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          EXPECTED_RELEASE: v3.9.90.0
          PRODUCTION_VERIFY_ATTEMPTS: '1'
          PRODUCTION_VERIFY_WAIT_MS: '0'
        run: |
          set -euo pipefail
          node --check tools/verify-production-baseline-v3971.mjs
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          node tools/verify-production-baseline-v3971.mjs | tee /tmp/v3990-baseline-verification.log
      - name: Commit verified baseline tools
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/verify-production-baseline-v3971.mjs tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'fix(release): recognize v3990 production baseline'
          git push origin HEAD:agent/production-challenge-boundary-v3990_0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-production-baseline-evidence
          path: /tmp/v3990-baseline-verification.log
          if-no-files-found: warn
          retention-days: 7
