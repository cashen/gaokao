name: Write v3969 derived trace

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  write:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3969-unified-school-query'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and commit trace
        run: |
          set -euo pipefail
          node tools/build-derived-asset-trace-v3969.mjs --write
          node tools/build-derived-asset-trace-v3969.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/governance/derived-asset-trace.v3969_0.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: write v3969 derived asset trace'
          git push origin HEAD:${{ github.head_ref }}
