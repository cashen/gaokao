name: Verify dual search v3963

on:
  pull_request:
    branches: [main]
    paths:
      - 'ln-rank/**'
      - 'shared/**'
      - 'tongxue/**'
      - 'functions/**'
      - 'tools/**'
      - '.github/workflows/verify-dual-search-v3963.yml'
  workflow_dispatch:

concurrency:
  group: verify-dual-search-v3963-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verified Chromium journey runner
        run: bash .github/scripts/install-playwright-chromium.sh
      - name: Verify no-obstruction family action geometry
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3990-1-family-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ln-rank/ >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-1-family-http.log; exit 1; fi
          V3970_ARTIFACT_DIR=/tmp/v3990-1-browser-family node tools/browser-family-action-v3990_3.mjs 2>&1 | tee /tmp/v3990-1-browser-family.out
      - name: Verify preserved PC Pad Android main journey
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3990-1-main-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/ln-rank/ >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-1-main-http.log; exit 1; fi
          node tools/browser-dual-search-v3990_1.mjs 2>&1 | tee /tmp/v3990-1-browser-main.out
