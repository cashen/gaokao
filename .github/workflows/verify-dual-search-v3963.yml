name: Verify runtime ownership v3965.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  runtime-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check protected paths
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD | tee /tmp/v3965-protected-paths.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3965-protected-paths.txt; then
            echo 'Protected path changed'
            exit 1
          fi

      - name: Check changed source syntax
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git diff --name-only "$base" HEAD -- '*.js' '*.mjs' | while IFS= read -r file; do
            [ -f "$file" ] || continue
            echo "node --check $file"
            node --check "$file"
          done
          python3 -m py_compile tools/ln-2026/verify-final-release-v8.py

      - name: Verify v3.9.65.0 release contract
        env:
          LN_RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ln-2026/verify-final-release-v8.py

      - name: Audit runtime ownership and active graph
        run: node tools/audit-runtime-ownership-v3965.mjs

      - name: Audit MIME and cache ownership
        run: node tools/audit-static-content-types-v3965.mjs

      - name: Verify Feishu year hierarchy and report builders
        run: node tools/verify-feishu-report-v3956.mjs

      - name: Verify shared resource and algorithm owners
        run: |
          node tools/audit-resource-ownership-v3958.mjs
          node tools/audit-algorithm-orchestration-v3960.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/verify-card-ai-2026-v3955.mjs

      - name: Smoke-test governed assets
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3965-smoke-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          paths=(
            /
            /ln-rank/
            /ln-rank/selection-pool.html
            /ln2026.html
            /zy2026/
            /tongxue/
            /ln-rank/js/app.v3965_0.js
            /ln-rank/js/app-runtime.v3965_0.js
            /ln-rank/js/workspace/selection-workspace-orchestrator.v3965_0.js
            /ln-rank/js/feature/feishu/index.v3965_0.js
            /ln-rank/js/feature/feishu/report-state.v3965_0.js
            /ln-rank/js/feature/feishu/report-render.v3965_0.js
            /ln-rank/js/feature/feishu/report-controller.v3965_0.js
            /ln-rank/js/selection-pool.v3965_0.js
            /ln-rank/js/selection-pool-runtime.v3965_0.js
            /shared/resources/release/current-release.js
            /shared/resources/release/runtime-cache-contract.v3965_0.js
            /shared/ui/ui-registry.v3965_0.js
            /shared/ui/shell/family-shell.v3965_0.js
            /tongxue/app/tongxue-runtime-v159.js
            /tongxue/app/tongxue-runtime-controller-v159.js
            /tongxue/app/tongxue-runtime-search-view-v159.js
            /tongxue/app/tongxue-runtime-result-view-v159.js
            /tongxue/app/tongxue-runtime-utils-v159.js
          )
          for path in "${paths[@]}"; do
            echo "GET $path"
            curl --fail --silent --show-error "http://127.0.0.1:8765$path" >/dev/null
          done

      - name: Install Chromium journey runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify complete mainline and ownership journeys
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/v3965-browser-http.log 2>&1 &
          server=$!
          trap 'kill $server' EXIT
          sleep 1
          DUAL_SEARCH_ARTIFACT_DIR=/tmp/v3965-human-task node tools/browser-human-task-journey-v3965_0.mjs | tee /tmp/v3965-human-task.out
          RUNTIME_CACHE_ARTIFACT_DIR=/tmp/v3965-runtime-readiness node tools/browser-runtime-readiness-v3965_0.mjs | tee /tmp/v3965-runtime-readiness.out
          V3965_ARTIFACT_DIR=/tmp/v3965-feishu node tools/browser-feishu-ownership-v3965.mjs | tee /tmp/v3965-feishu.out
          V3965_ARTIFACT_DIR=/tmp/v3965-tongxue node tools/browser-tongxue-runtime-v159.mjs | tee /tmp/v3965-tongxue.out

      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ownership-v3965-diagnostics
          path: |
            /tmp/v3965-*.txt
            /tmp/v3965-*.out
            /tmp/v3965-*.log
            /tmp/v3965-human-task
            /tmp/v3965-runtime-readiness
            /tmp/v3965-feishu
            /tmp/v3965-tongxue
          if-no-files-found: warn
          retention-days: 3
