name: Assemble academic background static index v3972.2

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/assemble-academic-background-static-v3972.mjs'
      - 'tools/audit-211-static-v3972.mjs'
      - 'tools/lib/211-static-*.mjs'
      - 'functions/api/academic-background.js'
      - 'functions/api/211-mainline.js'
      - 'functions/_lib/211-mainline-kb.js'
      - 'functions/_lib/211-static-compat-response.js'
      - 'functions/_lib/academic-background-provider.js'
      - 'shared/resources/background/double-first-class-disciplines.2022*.js'
      - 'shared/resources/schools/**'
      - 'shared/resources/exam/**'
      - 'ln-rank/211-mainline.html'
      - 'ln-rank/js/academic-background/all211-static-app.v3972_0.js'
      - 'ln-rank/css/all211-static.v3972_0.css'
      - 'ln-rank/data/211-static/**'
      - 'fenxi/data/ln-rank-2026/**'
      - 'fenxi/data/rank_2026_physics.json'
      - '.github/workflows/assemble-academic-background-static-v3972.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-static-index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax and Functions isolation
        run: |
          set -euo pipefail
          for file in \
            shared/resources/background/double-first-class-disciplines.2022.js \
            functions/_lib/211-mainline-kb.js \
            functions/_lib/211-static-compat-response.js \
            functions/api/academic-background.js \
            functions/api/211-mainline.js \
            tools/lib/211-static-common.v3972.mjs \
            tools/lib/211-static-evidence.v3972.mjs \
            tools/lib/211-static-records.v3972.mjs \
            tools/assemble-academic-background-static-v3972.mjs \
            tools/audit-211-static-v3972.mjs \
            ln-rank/js/academic-background/all211-static-app.v3972_0.js; do
            node --check "$file"
          done
          if grep -Eq 'school-profile-center|double-first-class-disciplines' functions/_lib/211-mainline-kb.js; then
            echo '211 Functions adapter imports build-time evidence graph'
            exit 1
          fi
          if grep -q 'academic-background-provider' tools/lib/211-static-records.v3972.mjs; then
            echo '211 static builder imports Functions provider'
            exit 1
          fi
      - name: Assemble and audit immutable static index
        run: |
          set -euo pipefail
          node --experimental-default-type=module tools/assemble-academic-background-static-v3972.mjs | tee /tmp/academic-background-static-assemble.out
          node --experimental-default-type=module tools/audit-211-static-v3972.mjs | tee /tmp/academic-background-static-audit.out
          git diff --exit-code -- \
            ln-rank/data/211-static/211-static-index.v3972_0.json \
            ln-rank/data/211-static/211-static-audit.v3972_0.json
          node --experimental-default-type=module - <<'NODE'
          import fs from 'node:fs';
          const file='ln-rank/data/211-static/211-static-index.v3972_0.json';
          const index=JSON.parse(fs.readFileSync(file,'utf8'));
          if(index.version!=='all-211-static-v3972_0') throw new Error('index version');
          if(!index.meta.completeEvaluation) throw new Error('coverage incomplete');
          if(index.meta.evaluatedRecordCount!==index.meta.admission211RecordCount) throw new Error('evaluation mismatch');
          if(index.meta.duplicateAdmissionRecordCount!==0||index.meta.unresolved211RecordCount!==0) throw new Error('data integrity');
          if(index.scoreBands.length!==8) throw new Error('score bands');
          if(index.scoreBands.reduce((sum,item)=>sum+item.admissionRecordCount,0)!==index.records.length) throw new Error('band coverage');
          if(fs.statSync(file).size>3500000) throw new Error('browser index too large');
          const release=fs.readFileSync('shared/resources/release/current-release.js','utf8');
          if(!release.includes("display: 'v3.9.90.3'")) throw new Error('site release display');
          if(!release.includes("all211DataVersion: 'all-211-static-v3972_0'")) throw new Error('release data owner');
          const page=fs.readFileSync('ln-rank/211-mainline.html','utf8');
          if(!page.includes('data-release="v3.9.90.3"')) throw new Error('211 page release lineage');
          if(!page.includes('all211-static-app.v3972_0.js?v=3972_0')) throw new Error('211 stable runtime');
          const compat=fs.readFileSync('functions/_lib/211-static-compat-response.js','utf8');
          if(!compat.includes('scannedCount: 0')||!compat.includes('build-time-static-index')) throw new Error('scan-free compatibility contract');
          const health=fs.readFileSync('functions/api/major-bands-health.js','utf8');
          const fetcher=fs.readFileSync('functions/_lib/fenxi-fetcher.js','utf8');
          if(!health.includes("maximumProbeChunks: 1")||!health.includes("fullDatasetScan: false")) throw new Error('bounded health probe contract');
          if(!fetcher.includes('Large admission chunks are deliberately request-scoped')) throw new Error('request-scoped chunk contract');
          console.log(JSON.stringify({...index.meta,indexBytes:fs.statSync(file).size,siteRelease:'v3.9.90.3',pageRelease:'v3.9.90.3',package:index.version},null,2));
          NODE
      - name: Upload assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-background-static-v3972-2
          path: |
            /tmp/academic-background-static-assemble.out
            /tmp/academic-background-static-audit.out
            ln-rank/data/211-static/211-static-audit.v3972_0.json
          if-no-files-found: error
          retention-days: 7
