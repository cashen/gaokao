name: Assemble academic background static index v3972.0

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/assemble-academic-background-static-v3972.mjs'
      - 'tools/audit-211-static-v3972.mjs'
      - 'tools/sync-all211-static-release-v3972.py'
      - 'tools/lib/211-static-*.mjs'
      - 'functions/_lib/211-mainline-kb.js'
      - 'functions/_lib/academic-background-provider.js'
      - 'shared/resources/background/double-first-class-disciplines.2022*.js'
      - 'shared/resources/schools/**'
      - 'shared/resources/exam/**'
      - 'shared/resources/release/**'
      - 'shared/governance/derived-asset-trace.v3970_0.json'
      - 'ln-rank/211-mainline.html'
      - 'ln-rank/js/academic-background/all211-static-app.v3972_0.js'
      - 'ln-rank/css/all211-static.v3972_0.css'
      - 'fenxi/data/ln-rank-2026/**'
      - 'fenxi/data/rank_2026_physics.json'
      - '.github/workflows/assemble-academic-background-static-v3972.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-static-index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax
        run: |
          set -euo pipefail
          node --check shared/resources/background/double-first-class-disciplines.2022.js
          node --check functions/_lib/211-mainline-kb.js
          node --check tools/lib/211-static-common.v3972.mjs
          node --check tools/lib/211-static-records.v3972.mjs
          node --check tools/assemble-academic-background-static-v3972.mjs
          node --check tools/audit-211-static-v3972.mjs
          node --check ln-rank/js/academic-background/all211-static-app.v3972_0.js
          python3 -m py_compile tools/sync-all211-static-release-v3972.py
      - name: Assemble, audit and synchronize release contracts
        run: |
          set -euo pipefail
          node --experimental-default-type=module tools/assemble-academic-background-static-v3972.mjs | tee /tmp/academic-background-static-assemble.out
          node --experimental-default-type=module tools/audit-211-static-v3972.mjs | tee /tmp/academic-background-static-audit.out
          python3 tools/sync-all211-static-release-v3972.py | tee /tmp/all211-static-release-sync.out
          node tools/build-derived-asset-trace-v3970.mjs --write | tee /tmp/all211-static-derived-trace.out
          node --experimental-default-type=module - <<'NODE'
          import fs from 'node:fs';
          const file='ln-rank/data/211-static/211-static-index.v3972_0.json';
          const index=JSON.parse(fs.readFileSync(file,'utf8'));
          if(index.version!=='all-211-static-v3972_0') throw new Error('index version');
          if(!index.meta.completeEvaluation) throw new Error('coverage incomplete');
          if(index.meta.evaluatedRecordCount!==index.meta.admission211RecordCount) throw new Error('evaluation mismatch');
          if(index.meta.duplicateAdmissionRecordCount!==0||index.meta.unresolved211RecordCount!==0) throw new Error('data integrity');
          if(index.scoreBands.length!==8) throw new Error('score bands');
          if(index.scoreBands.reduce((sum,item)=>sum+item.admissionRecordCount,0)!==index.records.length) throw new Error('band coverage');
          if(fs.statSync(file).size>3500000) throw new Error('browser index too large');
          const release=fs.readFileSync('shared/resources/release/current-release.js','utf8');
          if(!release.includes("display: 'v3.9.72.0'")) throw new Error('release display');
          if(!release.includes("all211DataVersion: 'all-211-static-v3972_0'")) throw new Error('release data owner');
          console.log(JSON.stringify({...index.meta,indexBytes:fs.statSync(file).size},null,2));
          NODE
      - name: Commit generated data and release contracts
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git add \
            VERSION.txt \
            index.html \
            shared/resources/release/current-release.js \
            shared/governance/derived-asset-trace.v3970_0.json \
            tools/browser-school-query-v3970.mjs \
            tools/browser-home-release-v3970.mjs \
            tools/audit-academic-background-v3970.mjs \
            tools/browser-resource-execution-v3970.mjs \
            tools/audit-home-release-ownership-v3970.mjs \
            tools/ln-2026/verify-final-release-v3970.py \
            tools/audit-school-query-v3970.mjs \
            tools/browser-family-action-v3970.mjs \
            tools/audit-family-action-v3970.mjs \
            ln-rank/data/211-static/211-static-index.v3972_0.json \
            ln-rank/data/211-static/211-static-audit.v3972_0.json
          if git diff --cached --quiet; then
            echo 'generated contracts already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'assemble(academic-background): synchronize v3972.0 contracts'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload assembly evidence
        uses: actions/upload-artifact@v4
        with:
          name: academic-background-static-v3972-0
          path: |
            /tmp/academic-background-static-assemble.out
            /tmp/academic-background-static-audit.out
            /tmp/all211-static-release-sync.out
            /tmp/all211-static-derived-trace.out
            ln-rank/data/211-static/211-static-audit.v3972_0.json
          if-no-files-found: error
          retention-days: 7
