name: Temporary patch Worker vNext Preview gate

on:
  push:
    branches:
      - agent/ln-rank-worker-resource-vnext
    paths:
      - .github/workflows/tmp-patch-worker-vnext-preview-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ln-rank-worker-resource-vnext
          fetch-depth: 0
      - name: Insert exact Preview Worker stress gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/verify-ai-workspace-v3990_1.yml')
          s=p.read_text()
          marker='\n  browser-preview:\n'
          if marker not in s:
              raise SystemExit('browser-preview marker missing')
          if 'Verify Worker vNext Preview resource stress' in s:
              raise SystemExit('Worker vNext Preview stress gate already present')
          target_expr='$'+'{{ steps.resolve-preview.outputs.preview_base }}'
          sha_expr='$'+'{{ github.event.pull_request.head.sha }}'
          block=f'''\n      - name: Verify Worker vNext Preview resource stress\n        env:\n          TARGET_BASE: {target_expr}\n          EXPECTED_SHA: {sha_expr}\n          WORKER_VNEXT_PREVIEW_EVIDENCE: /tmp/worker-resource-vnext-preview.json\n        run: node tools/verify-worker-resource-vnext-preview.mjs\n      - name: Upload Worker vNext Preview stress evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: worker-resource-vnext-preview\n          path: /tmp/worker-resource-vnext-preview.json\n          if-no-files-found: warn\n          retention-days: 7\n'''
          p.write_text(s.replace(marker,block+marker,1))
          PY
          node --check tools/verify-worker-resource-vnext-preview.mjs
          grep -F 'Verify Worker vNext Preview resource stress' .github/workflows/verify-ai-workspace-v3990_1.yml
          grep -F 'TARGET_BASE: ${{ steps.resolve-preview.outputs.preview_base }}' .github/workflows/verify-ai-workspace-v3990_1.yml
          git diff --check
      - name: Commit clean Preview gate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-patch-worker-vnext-preview-gate.yml
          git add .github/workflows/verify-ai-workspace-v3990_1.yml tools/verify-worker-resource-vnext-preview.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: gate Worker vNext on exact Preview stress'
          git push origin HEAD:agent/ln-rank-worker-resource-vnext
