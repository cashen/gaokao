name: tmp AIPLuS FDW selection browser

on:
  push:
    branches:
      - agent/aiplus-family-decision-workbench
    paths:
      - '.github/workflows/tmp-aiplus-fdw-selection-browser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-family-decision-workbench
          fetch-depth: 0
      - name: Apply checked browser patcher
        run: |
          node --check tools/tmp-aiplus-fdw-selection-browser.mjs
          node tools/tmp-aiplus-fdw-selection-browser.mjs
          node --check tools/browser-ai-workspace-v3990_1.mjs
      - name: Commit verifier migration and remove construction files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-aiplus-fdw-selection-browser.yml tools/tmp-aiplus-fdw-selection-browser.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/browser-ai-workspace-v3990_1.mjs
          git commit -m 'test(aiplus): exercise selection import through decision drawer'
          git push origin HEAD:agent/aiplus-family-decision-workbench
