name: Verify ln-rank major-all UX v002

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  major-all-contract:
    name: major-all-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse changed JavaScript modules
        run: |
          node --check functions/api/ai/major-history.js
          node --check ln-rank/js/feature/major-all/major-all-mode.v001.js
          node --check ln-rank/js/knowledge/major-understanding-resolver.js
          node --check ln-rank/js/workspace/selection-workspace-orchestrator.v3969_0.js
          node --check ln-rank/js/workspace/major-path-handoff.v003.js
          node --check tools/verify-ln-rank-school-entry-tongxue-v001.mjs

      - name: Verify major-all product and ownership contract
        run: node tools/verify-ln-rank-major-all-v001.mjs

      - name: Verify school link and Tongxue handoff contract
        run: node tools/verify-ln-rank-school-entry-tongxue-v001.mjs

      - name: Install verified Chromium journey runner
        run: bash .github/scripts/install-playwright-chromium.sh

      - name: Start local source preview
        run: |
          python3 -m http.server 8766 --directory . >/tmp/major-all-ux-v002-http.log 2>&1 &
          echo "$!" > /tmp/major-all-ux-v002-http.pid

      - name: Verify explicit multi-major journey on PC Pad Android viewports
        env:
          MAJOR_ALL_BASE: http://127.0.0.1:8766/ln-rank/index.html?mode=major-all
        run: node tools/verify-ln-rank-major-all-ux-v002.mjs

      - name: Stop local source preview
        if: always()
        run: |
          if [ -f /tmp/major-all-ux-v002-http.pid ]; then
            kill "$(cat /tmp/major-all-ux-v002-http.pid)" || true
          fi
