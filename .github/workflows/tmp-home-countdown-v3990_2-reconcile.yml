name: Temporary reconcile v3990.2 verifier paths

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/home-countdown-seconds-v3990_2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Reconcile active generation and stable verifier paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = list(Path('.github/workflows').glob('*.yml')) + list(Path('.github/workflows').glob('*.yaml'))
          changed = []

          # First align the active release/generation references in every live workflow.
          for path in roots:
              if path.name.startswith('tmp-home-countdown-v3990_2-'):
                  continue
              text = path.read_text()
              new = text.replace('v3.9.90.1', 'v3.9.90.2').replace('v3990_1', 'v3990_2').replace('3990_1', '3990_2')

              # A historically-versioned path remains stable when no v3990_2 counterpart exists.
              # Revert only repository-relative path tokens; labels/artifact names may advance harmlessly.
              token_re = re.compile(r"(?P<token>(?:\.?\.?/)?[A-Za-z0-9_./-]*3990_2[A-Za-z0-9_./-]*)")
              def keep_existing(match):
                  token = match.group('token')
                  clean = token.lstrip('./')
                  if not clean or clean.startswith('tmp/'):
                      return token
                  candidate = Path(clean)
                  old_clean = clean.replace('v3990_2', 'v3990_1').replace('3990_2', '3990_1')
                  old = Path(old_clean)
                  if not candidate.exists() and old.exists():
                      prefix = token[:-len(clean)] if len(clean) < len(token) else ''
                      return prefix + old_clean
                  return token
              new = token_re.sub(keep_existing, new)

              if new != text:
                  path.write_text(new)
                  changed.append(str(path))

          # Current home cross-page acceptance follows the canonical major-path v0.04 owner.
          home = Path('tools/browser-home-release-v3990_2.mjs')
          text = home.read_text()
          new = text.replace('[data-major-path-version="major-path-v0.01"]', '[data-major-path-version="major-path-v0.04"]')
          if new != text:
              home.write_text(new)
              changed.append(str(home))

          print('reconciled files:')
          for item in changed:
              print('-', item)
          PY

          rm .github/workflows/tmp-home-countdown-v3990_2-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile v3990_2 verifier and stable dependency paths'
          git push origin HEAD:agent/home-countdown-seconds-v3990_2
