name: Finalize v3969 release graph

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3969-unified-school-query'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize release metadata and active graph
        run: |
          set -euo pipefail
          node tools/finalize-v3969-release.mjs
          node --check ln-rank/js/app.v3969_0.js
          node --check ln-rank/js/app-runtime.v3969_0.js
          node --check shared/resources/release/current-release.js
          node --check shared/resources/release/runtime-cache-contract.v3969_0.js
          node --check shared/resources/release/release-presenter.v3969_0.js
          node --check shared/governance/resource-execution-contract.v3969_0.js
          node --check shared/algorithms/algorithm-registry.js
          node --check shared/resources/resource-registry.js
          grep -q 'v3.9.69.0' VERSION.txt
          grep -q 'app.v3969_0.js?v=3969_0' ln-rank/index.html
          git diff --check
      - name: Commit finalized release graph
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION.txt ln-rank/index.html ln-rank/active-assets.json ln-rank/release-meta.json functions/_lib/release-contract.js
          git commit -m 'v3.9.69.0：完成学校查询执行中心发布图'
          git push origin HEAD:${{ github.head_ref }}
