name: Diagnose Preview distributed major-bands

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/diagnose-preview-distributed-major-bands.yml'

permissions:
  contents: read

jobs:
  diagnose-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PREVIEW_BASE: https://hotfix-v3972-2-production-ga.gaokao-4y9.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact distributed Preview generation
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            marker="$(curl --fail --silent --show-error --location --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "${PREVIEW_BASE}/404.html?diagnostic=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'distributed-major-bands-buckets-v3972-2' <<<"$marker"; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
      - name: Capture parent and every intersecting bucket
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.PREVIEW_BASE;
          const manifest=JSON.parse(fs.readFileSync('ln-rank/data/major-bands-static-v3972_2/manifest.json','utf8'));
          const min=556;
          const max=591;
          const buckets=manifest.buckets.filter(item=>Number(item.maxScore)>=min&&Number(item.minScore)<=max);
          console.log(JSON.stringify({phase:'selected-buckets',count:buckets.length,buckets},null,2));

          async function capture(label,url,headers={}){
            const response=await fetch(url,{headers:{accept:'application/json','cache-control':'no-cache',pragma:'no-cache',...headers}});
            const text=await response.text();
            console.log(JSON.stringify({
              phase:'response',label,status:response.status,
              contentType:response.headers.get('content-type')||'',
              cfRay:response.headers.get('cf-ray')||'',
              body:text.slice(0,4000)
            },null,2));
            return {response,text};
          }

          await capture('parent-579',`${base}/api/major-bands?candidateScore=579&limit=16&diagnostic=${Date.now()}`);

          for(const bucket of buckets){
            const url=new URL('/api/major-bands-bucket',base);
            url.searchParams.set('candidateScore','579');
            url.searchParams.set('rangePreset','standard');
            url.searchParams.set('bucketFile',bucket.file);
            url.searchParams.set('region','all');
            url.searchParams.set('majorKeyword','');
            url.searchParams.set('bottomLineMode','all');
            url.searchParams.set('specialProjectMode','hide_eligibility_projects');
            url.searchParams.set('schoolFilter','0');
            url.searchParams.set('maxCandidates','96');
            url.searchParams.set('diagnostic',`${Date.now()}-${bucket.minScore}`);
            await capture(`bucket-${bucket.minScore}-${bucket.maxScore}`,url,{'x-gaokao-major-bands-bucket':'major-bands-bucket-v3972_2'});
          }
          NODE
