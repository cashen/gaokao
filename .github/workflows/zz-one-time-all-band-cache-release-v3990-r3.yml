name: One-time all-band cache release v3990 r3

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-all-band-cache-release-v3990-r3.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and audit cache release contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          workflow_dir = Path('.github/workflows')
          temp_prefix = 'zz-one-time-all-band-cache-release-v3990'
          old_version = 'major-bands-all-bands-page-cache-v3990_0'
          new_version = 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0'

          def is_temp_workflow(path):
              return path.parent == workflow_dir and path.name.startswith(temp_prefix)

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or is_temp_workflow(path):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old_version in text:
                  path.write_text(text.replace(old_version, new_version), encoding='utf-8')

          cache_path = Path('functions/_lib/major-bands-all-bands-page-cache.v3990_0.js')
          cache = cache_path.read_text(encoding='utf-8')
          cache = cache.replace('let completed = null;\n', 'let completed = null;\nlet releasedOnRequestedBandSwitch = 0;\n', 1)
          marker = 'export function majorBandsAllBandsPageCacheState() {'
          release_fn = '''export function releaseMajorBandsAllBandsCompletedPage() {\n  const released = Boolean(completed);\n  completed = null;\n  if (released) releasedOnRequestedBandSwitch += 1;\n  return released;\n}\n\n'''
          assert marker in cache
          cache = cache.replace(marker, release_fn + marker, 1)
          cache = cache.replace(
              '    serializedFinalPageOnly: true,\n',
              "    serializedFinalPageOnly: true,\n    releaseOnRequestedBandSwitch: true,\n    releaseMode: 'release-completed-on-requested-band-switch-v3990_0',\n    releasedOnRequestedBandSwitch,\n",
              1
          )
          clear_anchor = '''export function clearMajorBandsAllBandsPageCacheForTest() {\n  inFlight.clear();\n  completed = null;\n}\n'''
          clear_patch = '''export function clearMajorBandsAllBandsPageCacheForTest() {\n  inFlight.clear();\n  completed = null;\n  releasedOnRequestedBandSwitch = 0;\n}\n'''
          assert clear_anchor in cache
          cache = cache.replace(clear_anchor, clear_patch, 1)
          cache_path.write_text(cache, encoding='utf-8')

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')
          import_anchor = '  MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n  executeMajorBandsAllBandsPageOnce\n'
          assert import_anchor in api
          api = api.replace(import_anchor, '  MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n  executeMajorBandsAllBandsPageOnce,\n  releaseMajorBandsAllBandsCompletedPage\n', 1)
          branch_anchor = '\n    if (!requestedBand) {\n'
          branch_patch = "\n    const allBandsPageCacheReleasedBeforeBandQuery = requestedBand\n      ? releaseMajorBandsAllBandsCompletedPage()\n      : false;\n\n    if (!requestedBand) {\n"
          assert api.count(branch_anchor) == 1
          api = api.replace(branch_anchor, branch_patch, 1)
          source_anchor = '        queryExecutionPageLimit: cacheRetention.pageLimit,\n'
          source_patch = "        queryExecutionPageLimit: cacheRetention.pageLimit,\n        allBandsPageCacheVersion: MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION,\n        allBandsPageCacheReleaseMode: 'release-completed-on-requested-band-switch-v3990_0',\n        allBandsPageCacheReleasedBeforeBandQuery,\n"
          assert source_anchor in api
          api = api.replace(source_anchor, source_patch, 1)
          api_path.write_text(api, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          source_check_anchor = "  assert.equal(result.payload?.source?.queryExecutionCacheVersion, expectedQueryCacheVersion, `${result.scenario}: query execution cache`);\n"
          source_check_patch = source_check_anchor + "  assert.equal(result.payload?.source?.allBandsPageCacheVersion, expectedAllBandsPageCacheVersion, `${result.scenario}: all-band page cache deployment`);\n  assert.equal(result.payload?.source?.allBandsPageCacheReleaseMode, 'release-completed-on-requested-band-switch-v3990_0', `${result.scenario}: all-band page cache release mode`);\n"
          assert source_check_anchor in verifier
          verifier = verifier.replace(source_check_anchor, source_check_patch, 1)
          verifier_path.write_text(verifier, encoding='utf-8')

          audit_path = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          audit = audit_path.read_text(encoding='utf-8')
          import_anchor = '''  clearMajorBandsAllBandsPageCacheForTest,\n  executeMajorBandsAllBandsPageOnce,\n  majorBandsAllBandsPageCacheState\n'''
          import_patch = '''  clearMajorBandsAllBandsPageCacheForTest,\n  executeMajorBandsAllBandsPageOnce,\n  majorBandsAllBandsPageCacheState,\n  releaseMajorBandsAllBandsCompletedPage\n'''
          assert import_anchor in audit
          audit = audit.replace(import_anchor, import_patch, 1)
          state_anchor = '''assert.equal(allBandsPageState.serializedFinalPageOnly, true);\nassert.equal(allBandsPageState.retainsDecodedBuckets, false);\nassert.equal(allBandsPageState.retainsFullBandSnapshots, false);\nclearMajorBandsAllBandsPageCacheForTest();\n'''
          state_patch = '''assert.equal(allBandsPageState.serializedFinalPageOnly, true);\nassert.equal(allBandsPageState.releaseOnRequestedBandSwitch, true);\nassert.equal(allBandsPageState.releaseMode, 'release-completed-on-requested-band-switch-v3990_0');\nassert.equal(allBandsPageState.retainsDecodedBuckets, false);\nassert.equal(allBandsPageState.retainsFullBandSnapshots, false);\nassert.equal(releaseMajorBandsAllBandsCompletedPage(), true, 'completed all-band page was not released');\nconst releasedAllBandsPageState = majorBandsAllBandsPageCacheState();\nassert.equal(releasedAllBandsPageState.completed, 0);\nassert.equal(releasedAllBandsPageState.releasedOnRequestedBandSwitch, 1);\nassert.equal(releaseMajorBandsAllBandsCompletedPage(), false, 'empty all-band page release should be false');\nclearMajorBandsAllBandsPageCacheForTest();\n'''
          assert state_anchor in audit
          audit = audit.replace(state_anchor, state_patch, 1)
          api_required_anchor = "  'allBandsPageCacheVersion: MAJOR_BANDS_ALL_BANDS_PAGE_CACHE_VERSION',\n"
          api_required_patch = api_required_anchor + "  \"allBandsPageCacheReleaseMode: 'release-completed-on-requested-band-switch-v3990_0'\",\n  'releaseMajorBandsAllBandsCompletedPage()',\n"
          assert api_required_anchor in audit
          audit = audit.replace(api_required_anchor, api_required_patch, 1)
          cache_required_anchor = "  'serializedFinalPageOnly: true',\n"
          cache_required_patch = cache_required_anchor + "  'releaseOnRequestedBandSwitch: true',\n  \"releaseMode: 'release-completed-on-requested-band-switch-v3990_0'\",\n  'releaseMajorBandsAllBandsCompletedPage',\n"
          assert cache_required_anchor in audit
          audit = audit.replace(cache_required_anchor, cache_required_patch, 1)
          audit_path.write_text(audit, encoding='utf-8')

          rank_workflow = Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml')
          rank_text = rank_workflow.read_text(encoding='utf-8')
          broken = "              && grep -q '\"rankRowFilterVersion\":\"major-bands-rank-row-filter-v3990_0\"' <<<\"$body\"\n              && grep -q '\"rankBucketMaxConcurrency\":1' <<<\"$body\"; then"
          fixed = "              && grep -q '\"rankRowFilterVersion\":\"major-bands-rank-row-filter-v3990_0\"' <<<\"$body\" \\\n              && grep -q '\"rankBucketMaxConcurrency\":1' <<<\"$body\"; then"
          assert broken in rank_text
          rank_workflow.write_text(rank_text.replace(broken, fixed, 1), encoding='utf-8')

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or is_temp_workflow(path):
                  continue
              try:
                  assert old_version not in path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  pass
          PY

          node --check functions/_lib/major-bands-all-bands-page-cache.v3990_0.js
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f, aliases: true) }"
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs

      - name: Verify focused cache-switch sequence and full local pressure
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8797 --compatibility-date=2026-07-01 >/tmp/v3990-cache-release-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:8797/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=16' >/tmp/v3990-ready.json; then
              if grep -q 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0' /tmp/v3990-ready.json; then ready=1; break; fi
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-cache-release-wrangler.log; exit 1; fi

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const base = 'http://127.0.0.1:8797';
          const paths = [
            '/api/major-bands?candidateScore=579&rangePreset=standard&limit=37&offset=0',
            '/api/major-bands?candidateScore=579&rangePreset=standard&band=near&limit=37&offset=0',
            '/api/major-bands?candidateScore=508&rangePreset=standard&band=near&limit=37&offset=0',
            '/api/major-bands?candidateScore=508&rangePreset=standard&band=near&limit=37&offset=0'
          ];
          const evidence = [];
          for (let index = 0; index < paths.length; index += 1) {
            const response = await fetch(`${base}${paths[index]}&cacheSwitch=${Date.now()}-${index}`);
            const text = await response.text();
            if (response.status !== 200) throw new Error(`focused sequence ${index}: HTTP ${response.status} ${text.slice(0, 200)}`);
            const payload = JSON.parse(text);
            if (payload.source?.allBandsPageCacheVersion !== 'major-bands-all-bands-page-cache-release-on-band-switch-v3990_0') throw new Error('cache version mismatch');
            if (payload.source?.allBandsPageCacheReleaseMode !== 'release-completed-on-requested-band-switch-v3990_0') throw new Error('release mode mismatch');
            evidence.push({ index, status: response.status, score: payload.meta?.candidateScore, band: payload.meta?.pageBand, released: payload.source?.allBandsPageCacheReleasedBeforeBandQuery, count: payload.counts?.total, rawRows: payload.source?.rankRawRowCount, decodedRows: payload.source?.rankDecodedRowCount, skippedRows: payload.source?.rankRowsSkipped });
          }
          fs.writeFileSync('/tmp/v3990-cache-switch-sequence.json', JSON.stringify(evidence, null, 2));
          NODE

          TARGET_BASE='http://127.0.0.1:8797' \
          CONCURRENCY_LEVELS='1,5,10,25,50' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='12000' \
          P95_LIMIT_MS='7000' \
          P99_LIMIT_MS='12000' \
          HARD_LIMIT_MS='20000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-cache-release-local-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs

      - name: Stage workflow blobs and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-all-band-cache-release-v3990' || true)
          test "${#workflows[@]}" -ge 1
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools
          git commit -m 'fix(rank): release all-band page before band query'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-all-band-cache-release-r3
          path: |
            /tmp/v3990-cache-switch-sequence.json
            /tmp/v3990-cache-release-local-concurrency.json
            /tmp/v3990-cache-release-wrangler.log
          if-no-files-found: warn
          retention-days: 7
