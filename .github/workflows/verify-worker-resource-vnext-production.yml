name: Verify Worker resource vNext Production

on:
  push:
    branches: [main]
    paths:
      - 'data/zy2026/**'
      - 'functions/**'
      - 'shared/**'
      - 'tools/verify-worker-resource-vnext-preview.mjs'
      - 'tools/audit-worker-resource-architecture-vnext.mjs'
      - 'tools/verify-school-runtime-projection-vnext.mjs'
      - 'tools/verify-major-runtime-projection-vnext.mjs'
      - 'tools/verify-school-majors-runtime-vnext.mjs'
      - '.github/workflows/verify-worker-resource-vnext-production.yml'

permissions:
  contents: read

jobs:
  production-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      EXPECTED_SHA: ${{ github.sha }}
      # The Pages production domain is the canonical Functions deployment owner.
      # The custom domain may intentionally return a Cloudflare Managed Challenge;
      # that boundary is verified separately by production-api-health.
      TARGET_BASE: https://gaokao-4y9.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stress script syntax
        run: node --check tools/verify-worker-resource-vnext-preview.mjs
      - name: Wait for production Functions to prove exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            body="$(curl -fsSL --max-time 25 \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${TARGET_BASE}/api/ai/health?vnextProductionSha=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            got_sha="$(jq -r '.deployment.commitSha // empty' <<<"$body" 2>/dev/null || true)"
            if [ "$got_sha" = "$EXPECTED_SHA" ]; then
              echo "Production Functions proved exact main SHA ${EXPECTED_SHA}."
              exit 0
            fi
            sleep 8
          done
          echo "Production Functions did not prove exact main SHA ${EXPECTED_SHA}." >&2
          exit 3
      - name: Run production staged concurrency and mixed workload
        env:
          WORKER_VNEXT_PREVIEW_EVIDENCE: /tmp/worker-resource-vnext-production.json
          REQUEST_TIMEOUT_MS: '30000'
          P95_LIMIT_MS: '15000'
          HARD_LIMIT_MS: '30000'
        run: node tools/verify-worker-resource-vnext-preview.mjs
      - name: Upload Worker vNext production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-resource-vnext-production
          path: /tmp/worker-resource-vnext-production.json
          if-no-files-found: warn
          retention-days: 7
