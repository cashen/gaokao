name: Verify simulation report v009 history inline

on:
  pull_request:
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/css/simulation-report-v009-history-inline.css'
      - 'ln-rank/js/simulation-report-v009-history-inline.js'
      - 'ln-rank/data/simulation-workbench-release-v009.json'
      - 'tools/verify-simulation-report-v009-history-inline.mjs'
      - '.github/workflows/verify-simulation-report-v009-history-inline.yml'
  push:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/css/simulation-report-v009-history-inline.css'
      - 'ln-rank/js/simulation-report-v009-history-inline.js'
      - 'ln-rank/data/simulation-workbench-release-v009.json'
      - 'tools/verify-simulation-report-v009-history-inline.mjs'
      - '.github/workflows/verify-simulation-report-v009-history-inline.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-simulation-report-v009-history-inline.mjs
