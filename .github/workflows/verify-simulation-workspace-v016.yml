name: Verify simulation workspace v016

# v016.62-r152: unified family note editor.
on:
  pull_request:
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/css/simulation-report.css'
      - 'ln-rank/js/simulation-runtime.js'
      - 'ln-rank/js/simulation-report-pdf-service.js'
      - 'ln-rank/js/simulation-school-search-worker-v001.js'
      - 'ln-rank/data/simulation-workbench-release-v016.json'
      - 'docs/plans/simulation-family-note-r152.md'
      - 'docs/dev-progress/simulation-report.md'
      - 'tests/verify-simulation-unified-runtime-r149.mjs'
      - 'tools/browser-simulation-unified-runtime-r149.mjs'
      - 'tools/browser-simulation-family-note-r152.mjs'
      - 'tools/browser-simulation-pdf-r149.mjs'
      - '.github/workflows/verify-simulation-workspace-v016.yml'
  push:
    branches: [main]
    paths:
      - 'ln-rank/simulation-report.html'
      - 'ln-rank/css/simulation-report.css'
      - 'ln-rank/js/simulation-runtime.js'
      - 'ln-rank/js/simulation-report-pdf-service.js'
      - 'ln-rank/js/simulation-school-search-worker-v001.js'
      - 'ln-rank/data/simulation-workbench-release-v016.json'
      - 'docs/plans/simulation-family-note-r152.md'
      - 'docs/dev-progress/simulation-report.md'
      - 'tests/verify-simulation-unified-runtime-r149.mjs'
      - 'tools/browser-simulation-unified-runtime-r149.mjs'
      - 'tools/browser-simulation-family-note-r152.mjs'
      - 'tools/browser-simulation-pdf-r149.mjs'
      - '.github/workflows/verify-simulation-workspace-v016.yml'
  workflow_dispatch:

concurrency:
  group: simulation-workspace-unified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check ln-rank/js/simulation-runtime.js
      - run: node --check ln-rank/js/simulation-report-pdf-service.js
      - run: node tests/verify-simulation-unified-runtime-r149.mjs
  browser:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/gaokao-http.log 2>&1 &
      - run: node tools/browser-simulation-unified-runtime-r149.mjs
      - run: node tools/browser-simulation-family-note-r152.mjs
      - run: node tools/browser-simulation-pdf-r149.mjs
