name: One-time raw-row page reuse v3990 r2

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-raw-row-page-reuse-v3990-r2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse raw-row patch with corrected audit anchor
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/zz-one-time-raw-row-page-reuse-v3990.yml', aliases: true)
          steps = workflow.fetch('jobs').fetch('patch-and-verify').fetch('steps')
          patch = steps.find { |step| step['name'] == 'Patch one-pass raw-row page reuse' }
          verify = steps.find { |step| step['name'] == 'Verify cold raw-row reuse and full local pressure' }
          raise 'patch step missing' unless patch && patch['run']
          raise 'verify step missing' unless verify && verify['run']
          File.write('/tmp/v3990-raw-row-patch.sh', patch['run'])
          File.write('/tmp/v3990-raw-row-verify.sh', verify['run'])
          RUBY

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v3990-raw-row-patch.sh')
          script = path.read_text(encoding='utf-8')
          broken = "api_contract_anchor = '''  'requestedBandOrderCacheRetainsEnrichedRecords: false'\\n'''"
          fixed = "api_contract_anchor = '''  'requestedBandOrderCacheRetainsEnrichedRecords: false',\\n'''"
          if script.count(broken) != 1:
              raise SystemExit(f'audit anchor patch count={script.count(broken)}')
          path.write_text(script.replace(broken, fixed, 1), encoding='utf-8')
          PY

          bash /tmp/v3990-raw-row-patch.sh

      - name: Verify cold raw-row reuse and full local pressure
        run: |
          set -euo pipefail
          bash /tmp/v3990-raw-row-verify.sh

      - name: Stage workflows and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-raw-row-page-reuse-v3990' || true)
          test "${#workflows[@]}" -eq 2
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools
          git commit -m 'fix(rank): reuse raw rows for cold current page'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-raw-row-page-reuse-r2
          path: |
            /tmp/v3990-raw-row-reuse-cold.json
            /tmp/v3990-raw-row-reuse-local-concurrency.json
            /tmp/v3990-raw-row-reuse-wrangler.log
          if-no-files-found: warn
          retention-days: 7
