name: One-time Pages Git identity probe

on:
  push:
    branches:
      - agent/pages-git-identity-v3990_0
    paths:
      - '.github/workflows/zz-one-time-pages-git-env-probe.yml'

permissions:
  contents: read

jobs:
  probe-pages-env:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve branch Preview and probe runtime identity
        env:
          BRANCH_NAME: agent/pages-git-identity-v3990_0
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28 | sed -E 's/-+$//')"
          base="https://${slug}.gaokao-4y9.pages.dev"
          echo "Preview: $base"
          ready=0
          for attempt in $(seq 1 90); do
            status="$(curl --silent --show-error --location --max-time 30 -o /tmp/pages-git-env-probe.json -w '%{http_code}' "$base/api/zz-pages-git-env-probe?probe=${EXPECTED_SHA}-${attempt}" || true)"
            if [ "$status" = '200' ] && grep -q '"ok": true' /tmp/pages-git-env-probe.json; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" -eq 1
          cat /tmp/pages-git-env-probe.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/pages-git-env-probe.json', 'utf8'));
          console.log(JSON.stringify({
            hasCommitSha: Boolean(payload.cfPagesCommitSha),
            hasBranch: Boolean(payload.cfPagesBranch),
            hasUrl: Boolean(payload.cfPagesUrl),
            availableKeys: payload.availableCfPagesKeys || []
          }, null, 2));
          NODE
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-git-env-probe
          path: /tmp/pages-git-env-probe.json
          if-no-files-found: warn
          retention-days: 3
