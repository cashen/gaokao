name: Temporary requested-band response cache isolation v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-fix-requested-band-response-cache-isolation-v3990-1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
      - name: Isolate internal all-band subrequests from requested-band response cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/api/major-bands.js')
          text = path.read_text()
          shared_marker = "        majorBandsAllBandsShared: allBandsShared,"
          shared_replacement = "        majorBandsInternalBandRequest: true,\n        majorBandsAllBandsShared: allBandsShared,"
          cache_marker = "    const requestedBandResponseEdgeCache = requestedBand ? allBandsEdgeCacheHandle() : null;"
          cache_replacement = "    const requestedBandResponseEdgeCache = requestedBand && context?.majorBandsInternalBandRequest !== true\n      ? allBandsEdgeCacheHandle()\n      : null;"
          if text.count(shared_marker) != 1:
              raise SystemExit(f'internal all-band marker count={text.count(shared_marker)}')
          if text.count(cache_marker) != 1:
              raise SystemExit(f'requested-band response cache marker count={text.count(cache_marker)}')
          text = text.replace(shared_marker, shared_replacement, 1)
          text = text.replace(cache_marker, cache_replacement, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- functions/api/major-bands.js
      - name: Commit product fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/major-bands.js
          git commit -m "fix: isolate requested-band response cache from internal orchestration"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
