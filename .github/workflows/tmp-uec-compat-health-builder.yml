name: Temporary UEC compatibility and health repair

on:
  push:
    branches:
      - agent/unified-experience-context-v001

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'UEC compat builder:') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-experience-context-v001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact compatibility repair
        run: python3 tools/tmp_uec_compat_and_health_fix.py
      - name: Syntax proof
        run: |
          node --check functions/_lib/ai/tool-registry.js
          node --check tools/verify-student-voice-source-health-v001.mjs
      - name: Focused regression proof
        run: |
          node tools/verify-aiplus-school-official-v3990_2.mjs
          node tools/verify-aiplus-student-voice-v001.mjs
          node tools/verify-student-voice-source-health-v001.mjs
      - name: Commit repair without construction artifacts
        run: |
          git rm .github/workflows/tmp-uec-compat-health-builder.yml tools/tmp_uec_compat_and_health_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/tool-registry.js tools/verify-student-voice-source-health-v001.mjs
          git commit -m 'UEC compat builder: preserve school experience contract and source diagnostics'
          git push origin HEAD:agent/unified-experience-context-v001
