name: Verify canonical release v3990.1

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify one canonical current release and resource graph
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module tools/audit-canonical-release-version-v3990_2.mjs
          node --experimental-default-type=module tools/audit-site-runtime-generation-v3990_2.mjs
          node --experimental-default-type=module tools/audit-unified-resource-graph-v3990_2.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_2.mjs

          # Preserve the complete historical Python acceptance surface without
          # creating a second maintained copy. Only current-generation identity
          # markers are mapped; declared stable business-resource versions remain unchanged.
          sed \
            -e 's/v3\.9\.90\.0/v3.9.90.2/g' \
            -e 's/v3990_0/v3990_2/g' \
            -e 's/3990_0/3990_2/g' \
            tools/ln-2026/verify-final-release-v3990_0.py > /tmp/verify-final-release-v3990_2.py
          python3 /tmp/verify-final-release-v3990_2.py
