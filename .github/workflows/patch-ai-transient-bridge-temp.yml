name: Patch AI transient bridge temp

on:
  push:
    branches:
      - agent/ai-worker-resource-boundary-v3992_2
    paths:
      - .github/workflows/patch-ai-transient-bridge-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-worker-resource-boundary-v3992_2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded transient retry and browser fault injection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app = Path('ai/app.v3990_1.js')
          text = app.read_text()
          old = "async function executeDeterministicTool(tool,controller){if(!tool||tool.kind!=='major_bands'||tool.method!=='GET'||typeof tool.key!=='string'||typeof tool.url!=='string'||tool.key!==tool.url||!tool.url.startsWith('/api/major-bands?'))throw new Error('确定性候选请求合同无效');const response=await fetch(tool.url,{method:'GET',headers:{accept:'application/json'},cache:'no-store',signal:controller.signal}),payload=await response.json().catch(()=>null);if(!response.ok||!payload?.ok)throw new Error(payload?.message||`候选事实查询失败（HTTP ${response.status}）`);const compact=compactMajorBandsToolPayload(payload),bridgeBytes=new TextEncoder().encode(JSON.stringify(compact)).byteLength;if(bridgeBytes>80*1024)throw new Error('确定性候选桥接超过80KiB安全预算');return{kind:'major_bands',key:tool.key,url:tool.url,status:response.status,payload:compact};}"
          new = "const DETERMINISTIC_TRANSIENT_STATUSES=new Set([502,503,504]),DETERMINISTIC_RETRY_DELAYS=Object.freeze([300,900,2100]);\nfunction deterministicRetryDelay(ms,signal){if(signal?.aborted)return Promise.reject(new DOMException('Aborted','AbortError'));return new Promise((resolve,reject)=>{const onAbort=()=>{clearTimeout(timer);reject(new DOMException('Aborted','AbortError'));},timer=setTimeout(()=>{signal?.removeEventListener('abort',onAbort);resolve();},ms);signal?.addEventListener('abort',onAbort,{once:true});});}\nasync function executeDeterministicTool(tool,controller){if(!tool||tool.kind!=='major_bands'||tool.method!=='GET'||typeof tool.key!=='string'||typeof tool.url!=='string'||tool.key!==tool.url||!tool.url.startsWith('/api/major-bands?'))throw new Error('确定性候选请求合同无效');let lastError=null;for(let attempt=0;attempt<=DETERMINISTIC_RETRY_DELAYS.length;attempt+=1){try{const response=await fetch(tool.url,{method:'GET',headers:{accept:'application/json'},cache:'no-store',signal:controller.signal}),payload=await response.json().catch(()=>null);if(response.ok&&payload?.ok){const compact=compactMajorBandsToolPayload(payload),bridgeBytes=new TextEncoder().encode(JSON.stringify(compact)).byteLength;if(bridgeBytes>80*1024)throw new Error('确定性候选桥接超过80KiB安全预算');return{kind:'major_bands',key:tool.key,url:tool.url,status:response.status,payload:compact};}const error=new Error(payload?.message||`候选事实查询失败（HTTP ${response.status}）`);error.status=response.status;if(!DETERMINISTIC_TRANSIENT_STATUSES.has(response.status)||attempt===DETERMINISTIC_RETRY_DELAYS.length)throw error;lastError=error;}catch(error){if(controller.signal.aborted)throw error;const status=Number(error?.status||0),retryable=status?DETERMINISTIC_TRANSIENT_STATUSES.has(status):error instanceof TypeError;if(!retryable||attempt===DETERMINISTIC_RETRY_DELAYS.length)throw error;lastError=error;}await deterministicRetryDelay(DETERMINISTIC_RETRY_DELAYS[attempt],controller.signal);}throw lastError||new Error('候选事实查询失败');}"
          if text.count(old) != 1:
              raise SystemExit('executeDeterministicTool source changed unexpectedly')
          app.write_text(text.replace(old,new))

          browser = Path('tools/browser-ai-workspace-v3990_1.mjs')
          btext = browser.read_text()
          anchor = "async function turnCount(page){return page.locator('#conversationStream .turn').count();}\n"
          addition = """async function transientMajorBandsRecovery(page,name){\n  if(name!=='pc')return;\n  await reset(page);let injected=false;\n  await page.route('**/api/major-bands**',async route=>{if(!injected){injected=true;await route.fulfill({status:503,contentType:'application/json',body:JSON.stringify({ok:false,message:'synthetic transient 503'})});return;}await route.continue();});\n  try{const data=await submitTurn(page,'500分，辽宁省内先看能上的学校',{candidates:true});assert(injected,`${name}: transient 503 was not injected`);assert(data.result?.candidates?.ok===true,`${name}: deterministic bridge did not recover after transient 503`);}finally{await page.unroute('**/api/major-bands**');}\n}\n"""
          if btext.count(anchor) != 1:
              raise SystemExit('browser turnCount anchor changed unexpectedly')
          btext = btext.replace(anchor, anchor + addition)
          call_anchor = "await coreHumanJourney(page,device.name);await profilePersistence(page,device.name);"
          call_new = "await coreHumanJourney(page,device.name);await transientMajorBandsRecovery(page,device.name);await profilePersistence(page,device.name);"
          if btext.count(call_anchor) != 1:
              raise SystemExit('browser journey call anchor changed unexpectedly')
          browser.write_text(btext.replace(call_anchor,call_new))
          PY
          node --check ai/app.v3990_1.js
          node --check tools/browser-ai-workspace-v3990_1.mjs
          git rm .github/workflows/patch-ai-transient-bridge-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/app.v3990_1.js tools/browser-ai-workspace-v3990_1.mjs
          git commit -m 'fix: retry transient deterministic bridge failures'
          git push origin HEAD:agent/ai-worker-resource-boundary-v3992_2
