name: Temporary restore v3990.2 stable dependency boundaries

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/home-countdown-seconds-v3990_2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Restore declared stable dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            Path('tools/audit-aiplus-v002-ui.mjs'): [
              (".github/workflows/verify-ai-workspace-v3990_2.yml", ".github/workflows/verify-ai-workspace-v3990_1.yml"),
            ],
            Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'): [
              (".github/workflows/verify-ai-workspace-v3990_2.yml", ".github/workflows/verify-ai-workspace-v3990_1.yml"),
            ],
            Path('functions/api/ai/major-history.js'): [
              ("AI_MAJOR_HISTORY_INDEX_VERSION = 'ai-major-history-index-v3990_2'", "AI_MAJOR_HISTORY_INDEX_VERSION = 'ai-major-history-index-v3990_1'"),
              ("/ln-rank/data/ai-major-history-v3990_2/manifest.json", "/ln-rank/data/ai-major-history-v3990_1/manifest.json"),
            ],
          }

          changed=[]
          for path, pairs in replacements.items():
            text=path.read_text()
            new=text
            for old,repl in pairs:
              if old not in new:
                raise SystemExit(f'missing expected token in {path}: {old}')
              new=new.replace(old,repl)
            if new != text:
              path.write_text(new)
              changed.append(str(path))

          # No active runtime may invent a second static major-history truth.
          forbidden=[]
          for root in [Path('functions'), Path('shared'), Path('aiplus'), Path('tools')]:
            for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.js','.mjs','.json','.html'}:
                continue
              try: text=path.read_text()
              except UnicodeDecodeError: continue
              if '/ln-rank/data/ai-major-history-v3990_2/' in text:
                forbidden.append(str(path))
          if forbidden:
            raise SystemExit('remaining invented ai-major-history-v3990_2 data owner: '+', '.join(forbidden))

          print('changed:', *changed, sep='\n- ')
          PY

          rm .github/workflows/tmp-home-countdown-stable-boundary-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore stable verifier and major-history ownership'
          git push origin HEAD:agent/home-countdown-seconds-v3990_2
