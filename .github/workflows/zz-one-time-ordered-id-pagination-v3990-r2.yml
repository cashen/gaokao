name: One-time ordered-id pagination v3990 r2

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-ordered-id-pagination-v3990-r2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse ordered-ID patch with corrected Python newlines
        run: |
          set -euo pipefail
          ruby -ryaml - <<'RUBY'
          workflow = YAML.load_file('.github/workflows/zz-one-time-ordered-id-pagination-v3990.yml', aliases: true)
          steps = workflow.fetch('jobs').fetch('patch-and-verify').fetch('steps')
          patch = steps.find { |step| step['name'] == 'Patch ordered-ID pagination and page-only decode' }
          verify = steps.find { |step| step['name'] == 'Verify repeated pagination and full local pressure' }
          raise 'patch step missing' unless patch && patch['run']
          raise 'verify step missing' unless verify && verify['run']
          File.write('/tmp/v3990-ordered-id-patch.sh', patch['run'])
          File.write('/tmp/v3990-ordered-id-verify.sh', verify['run'])
          RUBY

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v3990-ordered-id-patch.sh')
          script = path.read_text(encoding='utf-8')
          broken = "for workflow_path in [\\n              Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'),\\n              Path('.github/workflows/verify-production-api-health-v3971.yml')\\n          ]:"
          fixed = "for workflow_path in [\n              Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'),\n              Path('.github/workflows/verify-production-api-health-v3971.yml')\n          ]:"
          if script.count(broken) != 1:
              raise SystemExit(f'workflow loop anchor count={script.count(broken)}')
          path.write_text(script.replace(broken, fixed, 1), encoding='utf-8')
          PY

          bash /tmp/v3990-ordered-id-patch.sh

      - name: Verify repeated pagination and full local pressure
        run: |
          set -euo pipefail
          bash /tmp/v3990-ordered-id-verify.sh

      - name: Stage workflows and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-ordered-id-pagination-v3990' || true)
          test "${#workflows[@]}" -ge 1
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools
          git commit -m 'fix(rank): paginate through ordered ID snapshots'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-ordered-id-pagination-r2
          path: |
            /tmp/v3990-ordered-id-ready.json
            /tmp/v3990-ordered-id-local-concurrency.json
            /tmp/v3990-ordered-id-wrangler.log
          if-no-files-found: warn
          retention-days: 7
