name: Patch AI workspace request budget temp
on:
  push:
    branches:
      - agent/ai-workspace-request-budget-v3992_3
    paths:
      - .agent/patch-ai-workspace-request-budget-v3992_3.py
      - .github/workflows/patch-ai-workspace-request-budget-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-workspace-request-budget-v3992_3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact patch
        run: python .agent/patch-ai-workspace-request-budget-v3992_3.py
      - name: Verify source and regression
        run: |
          node --check shared/ai/ai-workspace-contract.v3992_0.js
          node --check ai/app.v3990_1.js
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/ai/ai-workspace-contract.v3992_0.js ai/app.v3990_1.js tools/verify-ai-workspace-v3990_1.mjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: bound AI workspace turn request payload"
          git push origin HEAD:agent/ai-workspace-request-budget-v3992_3
