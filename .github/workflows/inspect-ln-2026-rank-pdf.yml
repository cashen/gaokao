name: Inspect LN 2026 rank PDF layout

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Extract layout samples
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          url='https://img.gaokaozhitongche.com/uploads/file/2026/0625/1782387966574085.pdf'
          with urlopen(Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=60) as r:
              data=r.read()
          assert data.startswith(b'%PDF') and len(data)>100000
          open('/tmp/rank.pdf','wb').write(data)
          PY
          pdftotext -layout /tmp/rank.pdf /tmp/layout.txt
          pdftotext -raw /tmp/rank.pdf /tmp/raw.txt
          {
            echo '=== LAYOUT ANCHORS ==='
            grep -n -E '(^|[^0-9])(650|600|570|550|508|480|450|400|344|150)([^0-9]|$)' /tmp/layout.txt | head -n 120 || true
            echo '=== RAW ANCHORS ==='
            grep -n -E '^(650|600|570|550|508|480|450|400|344|150)$' /tmp/raw.txt | head -n 120 || true
            echo '=== LAYOUT FIRST 260 ==='
            sed -n '1,260p' /tmp/layout.txt
            echo '=== RAW FIRST 260 ==='
            sed -n '1,260p' /tmp/raw.txt
          } > tools/ln-2026/rank-pdf-layout-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ln-2026/rank-pdf-layout-diagnostic.txt
          git commit -m "ci: capture LN 2026 PDF layout diagnostic [generated-ln2026]" || true
          git push origin HEAD:${{ github.head_ref }} || true
