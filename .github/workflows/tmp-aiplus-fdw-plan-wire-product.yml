name: tmp AIPLuS FDW plan wire product

on:
  push:
    branches: [agent/aiplus-family-decision-workbench]
    paths: ['.github/workflows/tmp-aiplus-fdw-plan-wire-product.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-family-decision-workbench
          fetch-depth: 0
      - name: Wire product and verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('functions/_lib/ai/turn-orchestrator.js')
          text=path.read_text()
          old="runSelectionReview(workspace?.selectionSnapshot||null)"
          count=text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 selection review calls, got {count}')
          path.write_text(text.replace(old,"runSelectionReview(workspace?.selectionSnapshot||null,workspace)"))

          path=Path('tools/verify-aiplus-family-decision-workbench-v003.mjs')
          text=path.read_text()
          marker="import {nextActionsForTurn} from '../functions/_lib/ai/next-action-engine.js';"
          if marker not in text:
              raise SystemExit('missing verifier import marker')
          text=text.replace(marker,marker+"\nimport {runSelectionReview} from '../functions/_lib/ai/selection-review.js';",1)
          anchor="// FDW-06/07/08/09 source-level UI contracts."
          if anchor not in text:
              raise SystemExit('missing verifier insertion anchor')
          tests="""// FDW-10: the existing selection-review owner audits structure plus explicit family conflicts.\nconst planItems=[\n  {id:'p1',school:'沈阳工业大学',major:'电气工程及其自动化',bandKey:'near',rank2026:24500,displayLocation:'辽宁 · 沈阳',tuition:'5200'},\n  {id:'p2',school:'沈阳工业大学',major:'电气工程及其自动化',bandKey:'near',rank2026:24500,displayLocation:'辽宁 · 沈阳',tuition:'5200'},\n  {id:'p3',school:'大连交通大学',major:'自动化',bandKey:'steady',rank2026:27000,displayLocation:'辽宁 · 大连',tuition:'5200'}\n];\nconst auditWorkspace=createAiWorkspace({hardConstraints:[{key:'majorExclude',values:['自动化'],label:'明确排除自动化'}],decisions:[{kind:'school_major',status:'reject',subject:{school:'沈阳工业大学',major:'电气工程及其自动化'},reason:'用户明确排除'}]});\nconst planAudit=runSelectionReview({version:'fdw-test',items:planItems},auditWorkspace);\neq(planAudit.ok,true,'plan review must remain deterministic and usable');\nok(planAudit.findings.some(item=>item.key==='duplicate-school-major'),'plan review must detect duplicate school-major rows');\nok(planAudit.findings.some(item=>item.key==='family-major-exclude-conflict'&&item.blocking===true),'plan review must surface explicit family major conflicts');\nok(planAudit.findings.some(item=>item.key==='rejected-school-major-conflict'&&item.blocking===true),'plan review must surface explicitly rejected school-major conflicts');\nok(planAudit.blockingCount>=2,'blocking plan conflicts must be counted for Decision Progress');\nno(String(planAudit.boundary).includes('录取概率'),'plan audit boundary must not claim an admission probability');\n\n"""
          path.write_text(text.replace(anchor,tests+anchor,1))
          PY
      - name: Verify product wire
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/turn-orchestrator.js
          node --check functions/_lib/ai/selection-review.js
          node --check tools/verify-aiplus-family-decision-workbench-v003.mjs
          node tools/verify-aiplus-family-decision-workbench-v003.mjs
      - name: Commit verified product wire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/_lib/ai/turn-orchestrator.js tools/verify-aiplus-family-decision-workbench-v003.mjs
          git commit -m 'feat(aiplus): close family-aware plan audit loop'
          git push origin HEAD:agent/aiplus-family-decision-workbench
