name: Temporary page-id ID-first prefilter v3990_1

on:
  push:
    branches:
      - agent/major-bands-requested-response-edge-cache-v3990_1
    paths:
      - .github/workflows/agent-page-id-first-prefilter-v3990-1.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/major-bands-requested-response-edge-cache-v3990_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch and verify ID-first page prefilter
        shell: bash
        run: |
          set -euo pipefail
          python tools/.agent-page-id-first-prefilter-v3990_1.py
          git diff --check
          node --check functions/_lib/major-bands-static-provider.js
          node --check tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node --experimental-default-type=module tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_1.mjs >/tmp/major-bands-audit.log
          tail -n 40 /tmp/major-bands-audit.log
          git diff -- functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs
      - name: Commit tested ID-first prefilter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/_lib/major-bands-static-provider.js tools/verify-major-bands-rank-native-scan-v3990_1.mjs
          git commit -m "perf: use one-pass ID-first page prefilter"
          git push origin HEAD:agent/major-bands-requested-response-edge-cache-v3990_1
