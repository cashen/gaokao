name: One-time raw-row page reuse v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-raw-row-page-reuse-v3990.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch one-pass raw-row page reuse
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('functions/_lib/major-bands-static-provider.js')
          provider = provider_path.read_text(encoding='utf-8')
          decode_anchor = '''function decodeRow(row, schema) {\n  const record = {};\n'''
          decode_patch = '''function decodeRow(row, schema) {\n  const record = {};\n'''
          assert provider.count(decode_anchor) == 1
          provider = provider.replace(decode_anchor, decode_patch, 1)
          decode_end = '''  return record;\n}\n\n\nconst NO_SPECIAL_PROJECT_FOR_ORDER = Object.freeze({\n'''
          decode_end_patch = '''  return record;\n}\n\nexport function decodeMajorBandsStaticRow(row, schema) {\n  return decodeRow(row, schema);\n}\n\nconst NO_SPECIAL_PROJECT_FOR_ORDER = Object.freeze({\n'''
          assert provider.count(decode_end) == 1
          provider = provider.replace(decode_end, decode_end_patch, 1)
          schema_anchor = '''export function buildMajorBandsRankOrderProjectionSchema(schema = []) {\n  const index = key => schema.indexOf(key);\n  return Object.freeze({\n    id: index('id'),\n'''
          schema_patch = '''export function buildMajorBandsRankOrderProjectionSchema(schema = []) {\n  const index = key => schema.indexOf(key);\n  return Object.freeze({\n    fullSchema: schema,\n    id: index('id'),\n'''
          assert provider.count(schema_anchor) == 1
          provider = provider.replace(schema_anchor, schema_patch, 1)
          projection_return = '''  if (specialHas) {\n    record.specialProject = {\n      hasSpecialProject: true,\n      keys: Array.isArray(value('specialKeys')) ? value('specialKeys') : [],\n      labels: Array.isArray(value('specialLabels')) ? value('specialLabels') : [],\n      primaryLabel: value('specialPrimaryLabel') || '',\n      reviewPoints: Array.isArray(value('specialReviewPoints')) ? value('specialReviewPoints') : []\n    };\n  }\n  return record;\n}\n'''
          projection_patch = '''  if (specialHas) {\n    record.specialProject = {\n      hasSpecialProject: true,\n      keys: Array.isArray(value('specialKeys')) ? value('specialKeys') : [],\n      labels: Array.isArray(value('specialLabels')) ? value('specialLabels') : [],\n      primaryLabel: value('specialPrimaryLabel') || '',\n      reviewPoints: Array.isArray(value('specialReviewPoints')) ? value('specialReviewPoints') : []\n    };\n  }\n  Object.defineProperties(record, {\n    majorBandsRawRow: {\n      value: row,\n      enumerable: false,\n      configurable: false,\n      writable: false\n    },\n    majorBandsRawSchema: {\n      value: projectionSchema.fullSchema,\n      enumerable: false,\n      configurable: false,\n      writable: false\n    }\n  });\n  return record;\n}\n'''
          assert provider.count(projection_return) == 1
          provider_path.write_text(provider.replace(projection_return, projection_patch, 1), encoding='utf-8')

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')
          import_anchor = "import { materializeMajorBandsStaticRecord } from '../_lib/major-bands-static-provider.js';\n"
          import_patch = "import { decodeMajorBandsStaticRow, materializeMajorBandsStaticRecord } from '../_lib/major-bands-static-provider.js';\n"
          assert api.count(import_anchor) == 1
          api = api.replace(import_anchor, import_patch, 1)
          band_anchor = "export const MAJOR_BANDS_REQUESTED_BAND_ORDER_CACHE_VERSION = 'major-bands-requested-band-order-id-lru-v3990_0';\n"
          band_patch = band_anchor + "export const MAJOR_BANDS_ORDER_PAGE_SOURCE_VERSION = 'major-bands-order-page-raw-row-reuse-v3990_0';\n"
          assert api.count(band_anchor) == 1
          api = api.replace(band_anchor, band_patch, 1)

          declaration_anchor = '''  let heavyExecution = null;\n  let loadedStats = null;\n  let selectedBuckets = null;\n  let orderCacheStatus = retained ? 'ordered-id-hit' : 'ordered-id-miss';\n'''
          declaration_patch = '''  let heavyExecution = null;\n  let loadedStats = null;\n  let selectedBuckets = null;\n  let pageRecords = null;\n  let orderPageSource = 'page-id-refetch';\n  let orderCacheStatus = retained ? 'ordered-id-hit' : 'ordered-id-miss';\n'''
          assert api.count(declaration_anchor) == 1
          api = api.replace(declaration_anchor, declaration_patch, 1)

          return_anchor = '''      return {\n        retained: orderSnapshot,\n        loadedStats: loaded.stats,\n        selectedBuckets: selected\n      };\n'''
          return_patch = '''      const rawRowReuse = loaded.stats.minimalProjection === true;\n      const orderedPage = ordered.slice(pageOffset, pageOffset + pageLimit);\n      const currentPageRecords = rawRowReuse\n        ? orderedPage.map(record => {\n            if (!Array.isArray(record.majorBandsRawRow) || !Array.isArray(record.majorBandsRawSchema)) {\n              throw new Error(`位次最小投影缺少原始行引用：${record.id || 'unknown'}`);\n            }\n            return decodeMajorBandsStaticRow(record.majorBandsRawRow, record.majorBandsRawSchema);\n          })\n        : orderedPage;\n      return {\n        retained: orderSnapshot,\n        loadedStats: loaded.stats,\n        selectedBuckets: selected,\n        pageRecords: currentPageRecords,\n        pageOffset,\n        pageLimit,\n        orderPageSource: rawRowReuse ? 'raw-row-reuse' : 'full-record-reuse'\n      };\n'''
          assert api.count(return_anchor) == 1
          api = api.replace(return_anchor, return_patch, 1)

          built_anchor = '''    retained = built.retained;\n    loadedStats = built.loadedStats;\n    selectedBuckets = built.selectedBuckets;\n    retainRequestedBandOrderSnapshot(orderIdentity, retained);\n'''
          built_patch = '''    retained = built.retained;\n    loadedStats = built.loadedStats;\n    selectedBuckets = built.selectedBuckets;\n    if (Number(built.pageOffset) === pageOffset && Number(built.pageLimit) === pageLimit) {\n      pageRecords = built.pageRecords;\n      orderPageSource = built.orderPageSource || 'raw-row-reuse';\n    }\n    retainRequestedBandOrderSnapshot(orderIdentity, retained);\n'''
          assert api.count(built_anchor) == 1
          api = api.replace(built_anchor, built_patch, 1)

          page_load_anchor = '''  selectedBuckets = selectMajorBandsRankBuckets(retained.rankWindows);\n  const pageLoaded = await loadMajorBandsRankWindow(context, selectedBuckets, { allowedIds: new Set(pageIds) });\n  loadedStats = pageLoaded.stats;\n  const byId = new Map(pageLoaded.records.map(record => [record.id, record]));\n  const pageRecords = pageIds.map(id => byId.get(id)).filter(Boolean);\n  if (pageRecords.length !== pageIds.length) {\n    throw new Error(`位次有序 ID 页记录不完整：${pageRecords.length}/${pageIds.length}`);\n  }\n'''
          page_load_patch = '''  if (!pageRecords) {\n    selectedBuckets = selectMajorBandsRankBuckets(retained.rankWindows);\n    const pageLoaded = await loadMajorBandsRankWindow(context, selectedBuckets, { allowedIds: new Set(pageIds) });\n    loadedStats = pageLoaded.stats;\n    const byId = new Map(pageLoaded.records.map(record => [record.id, record]));\n    pageRecords = pageIds.map(id => byId.get(id)).filter(Boolean);\n    orderPageSource = 'page-id-refetch';\n  }\n  if (pageRecords.length !== pageIds.length) {\n    throw new Error(`位次有序 ID 页记录不完整：${pageRecords.length}/${pageIds.length}`);\n  }\n'''
          assert api.count(page_load_anchor) == 1
          api = api.replace(page_load_anchor, page_load_patch, 1)

          helper_return_anchor = '''    orderCacheState: requestedBandOrderCacheState(orderIdentity),\n    orderProjectionVersion: retained.orderProjectionVersion || MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n'''
          helper_return_patch = '''    orderCacheState: requestedBandOrderCacheState(orderIdentity),\n    orderPageSourceVersion: MAJOR_BANDS_ORDER_PAGE_SOURCE_VERSION,\n    orderPageSource,\n    orderColdSecondAssetPass: orderCacheStatus === 'ordered-id-miss' && orderPageSource === 'page-id-refetch',\n    rawRowReferenceNonEnumerable: true,\n    orderProjectionVersion: retained.orderProjectionVersion || MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n'''
          assert api.count(helper_return_anchor) == 1
          api = api.replace(helper_return_anchor, helper_return_patch, 1)

          source_anchor = '''        requestedBandOrderCacheStatus: execution.orderCacheStatus || 'keyword-bypass',\n        requestedBandOrderIds: Number(execution.orderCacheIdCount || 0),\n'''
          source_patch = '''        requestedBandOrderCacheStatus: execution.orderCacheStatus || 'keyword-bypass',\n        requestedBandOrderPageSourceVersion: execution.orderPageSourceVersion || MAJOR_BANDS_ORDER_PAGE_SOURCE_VERSION,\n        requestedBandOrderPageSource: execution.orderPageSource || 'keyword-bypass',\n        requestedBandOrderColdSecondAssetPass: execution.orderColdSecondAssetPass === true,\n        requestedBandRawRowReferenceNonEnumerable: execution.rawRowReferenceNonEnumerable === true,\n        requestedBandOrderIds: Number(execution.orderCacheIdCount || 0),\n'''
          assert api.count(source_anchor) == 1
          api_path.write_text(api.replace(source_anchor, source_patch, 1), encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          constant_anchor = "const expectedOrderProjectionVersion = 'major-bands-rank-order-minimal-projection-v3990_0';\n"
          constant_patch = constant_anchor + "const expectedOrderPageSourceVersion = 'major-bands-order-page-raw-row-reuse-v3990_0';\n"
          assert verifier.count(constant_anchor) == 1
          verifier = verifier.replace(constant_anchor, constant_patch, 1)
          check_anchor = '''  assert.equal(result.payload?.source?.requestedBandOrderMinimalProjection, true, `${result.scenario}: default query did not use minimal projection`);\n'''
          check_patch = check_anchor + '''  assert.equal(result.payload?.source?.requestedBandOrderPageSourceVersion, expectedOrderPageSourceVersion, `${result.scenario}: order page source deployment`);\n  assert.ok(['raw-row-reuse', 'full-record-reuse', 'page-id-refetch'].includes(result.payload?.source?.requestedBandOrderPageSource), `${result.scenario}: invalid order page source`);\n  assert.equal(result.payload?.source?.requestedBandOrderColdSecondAssetPass, false, `${result.scenario}: cold ordered query performed a second asset pass`);\n  assert.equal(result.payload?.source?.requestedBandRawRowReferenceNonEnumerable, true, `${result.scenario}: raw row reference contract`);\n  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-miss') {\n    assert.equal(result.payload?.source?.requestedBandOrderPageSource, 'raw-row-reuse', `${result.scenario}: cold order page did not reuse raw rows`);\n  }\n  if (result.payload?.source?.requestedBandOrderCacheStatus === 'ordered-id-hit') {\n    assert.equal(result.payload?.source?.requestedBandOrderPageSource, 'page-id-refetch', `${result.scenario}: cached order page source`);\n  }\n'''
          assert verifier.count(check_anchor) == 1
          verifier = verifier.replace(check_anchor, check_patch, 1)
          evidence_anchor = '  orderProjectionVersion: expectedOrderProjectionVersion,\n'
          evidence_patch = evidence_anchor + '  orderPageSourceVersion: expectedOrderPageSourceVersion,\n'
          assert verifier.count(evidence_anchor) == 1
          verifier_path.write_text(verifier.replace(evidence_anchor, evidence_patch, 1), encoding='utf-8')

          rank_audit_path = Path('tools/audit-major-bands-rank-kernel-v3990_0.mjs')
          rank_audit = rank_audit_path.read_text(encoding='utf-8')
          import_anchor = '''  buildMajorBandsRankOrderProjectionSchema,\n  decodeMajorBandsRankOrderRow,\n  majorBandsRankValueMatchesRange\n'''
          import_patch = '''  buildMajorBandsRankOrderProjectionSchema,\n  decodeMajorBandsRankOrderRow,\n  decodeMajorBandsStaticRow,\n  majorBandsRankValueMatchesRange\n'''
          assert rank_audit.count(import_anchor) == 1
          rank_audit = rank_audit.replace(import_anchor, import_patch, 1)
          projection_anchor = '''  const projectedRecords = payload.rows.map(row => decodeMajorBandsRankOrderRow(row, projectionSchema));\n  buckets.set(bucket.file, records);\n'''
          projection_patch = '''  const projectedRecords = payload.rows.map(row => decodeMajorBandsRankOrderRow(row, projectionSchema));\n  if (projectedRecords.length) {\n    const projected = projectedRecords[0];\n    assert.equal(Object.prototype.propertyIsEnumerable.call(projected, 'majorBandsRawRow'), false, 'raw row reference enumerable');\n    assert.equal(Object.prototype.propertyIsEnumerable.call(projected, 'majorBandsRawSchema'), false, 'raw schema reference enumerable');\n    assert.ok(Array.isArray(projected.majorBandsRawRow), 'raw row reference absent');\n    assert.ok(Array.isArray(projected.majorBandsRawSchema), 'raw schema reference absent');\n    const restored = decodeMajorBandsStaticRow(projected.majorBandsRawRow, projected.majorBandsRawSchema);\n    assert.equal(restored.id, projected.id, 'raw row page decode id');\n    assert.equal(restored.school, projected.school, 'raw row page decode school');\n    const serialized = JSON.stringify(projected);\n    assert.ok(!serialized.includes('majorBandsRawRow'), 'raw row reference serialized');\n    assert.ok(!serialized.includes('majorBandsRawSchema'), 'raw schema reference serialized');\n  }\n  buckets.set(bucket.file, records);\n'''
          assert rank_audit.count(projection_anchor) == 1
          rank_audit = rank_audit.replace(projection_anchor, projection_patch, 1)
          api_contract_anchor = '''  'requestedBandOrderCacheRetainsEnrichedRecords: false'\n'''
          api_contract_patch = '''  'requestedBandOrderCacheRetainsEnrichedRecords: false',\n  "MAJOR_BANDS_ORDER_PAGE_SOURCE_VERSION = 'major-bands-order-page-raw-row-reuse-v3990_0'",\n  "orderPageSource: rawRowReuse ? 'raw-row-reuse' : 'full-record-reuse'",\n  "orderColdSecondAssetPass: orderCacheStatus === 'ordered-id-miss'",\n  'requestedBandRawRowReferenceNonEnumerable: execution.rawRowReferenceNonEnumerable === true'\n'''
          assert rank_audit.count(api_contract_anchor) == 1
          rank_audit_path.write_text(rank_audit.replace(api_contract_anchor, api_contract_patch, 1), encoding='utf-8')

          cache_audit_path = Path('tools/audit-major-bands-query-execution-cache-v3990_0.mjs')
          cache_audit = cache_audit_path.read_text(encoding='utf-8')
          required_anchor = "  'projection: minimalOrderProjection ? MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION : undefined',\n"
          required_patch = required_anchor + "  'decodeMajorBandsStaticRow(record.majorBandsRawRow, record.majorBandsRawSchema)',\n  'requestedBandOrderPageSourceVersion: execution.orderPageSourceVersion',\n  'requestedBandOrderColdSecondAssetPass: execution.orderColdSecondAssetPass === true',\n"
          assert cache_audit.count(required_anchor) == 1
          cache_audit_path.write_text(cache_audit.replace(required_anchor, required_patch, 1), encoding='utf-8')

          for workflow_path in [
              Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml'),
              Path('.github/workflows/verify-production-api-health-v3971.yml')
          ]:
              workflow = workflow_path.read_text(encoding='utf-8')
              if '<<<"$body"' in workflow:
                  anchor = "              && grep -q '\"requestedBandOrderProjectionVersion\":\"major-bands-rank-order-minimal-projection-v3990_0\"' <<<\"$body\" \\\n"
                  patch = anchor + "              && grep -q '\"requestedBandOrderPageSourceVersion\":\"major-bands-order-page-raw-row-reuse-v3990_0\"' <<<\"$body\" \\\n"
              else:
                  anchor = "              && grep -q '\"requestedBandOrderProjectionVersion\":\"major-bands-rank-order-minimal-projection-v3990_0\"' <<<\"$api\" \\\n"
                  patch = anchor + "              && grep -q '\"requestedBandOrderPageSourceVersion\":\"major-bands-order-page-raw-row-reuse-v3990_0\"' <<<\"$api\" \\\n"
              assert workflow.count(anchor) == 1
              workflow_path.write_text(workflow.replace(anchor, patch, 1), encoding='utf-8')
          PY

          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/api/major-bands.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --check tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].each { |f| YAML.load_file(f, aliases: true) }"
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs

      - name: Verify cold raw-row reuse and full local pressure
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8802 --compatibility-date=2026-07-01 >/tmp/v3990-raw-row-reuse-wrangler.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o /tmp/v3990-raw-row-reuse-cold.json -w '%{http_code}' 'http://127.0.0.1:8802/api/major-bands?candidateScore=449&rangePreset=safe&band=near&limit=37&offset=0' || true)"
            if [ "$status" = '200' ] && grep -q 'major-bands-order-page-raw-row-reuse-v3990_0' /tmp/v3990-raw-row-reuse-cold.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/v3990-raw-row-reuse-cold.json || true; cat /tmp/v3990-raw-row-reuse-wrangler.log; exit 1; fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const cold = JSON.parse(fs.readFileSync('/tmp/v3990-raw-row-reuse-cold.json', 'utf8'));
          if (cold.source?.requestedBandOrderCacheStatus !== 'ordered-id-miss') throw new Error('cold order cache status');
          if (cold.source?.requestedBandOrderPageSource !== 'raw-row-reuse') throw new Error('cold page source');
          if (cold.source?.requestedBandOrderColdSecondAssetPass !== false) throw new Error('cold query performed second asset pass');
          if (cold.source?.requestedBandRawRowReferenceNonEnumerable !== true) throw new Error('raw reference contract');
          if (Number(cold.bands?.near?.count || 0) !== 1001) throw new Error('safe near count drift');
          if ((cold.bands?.near?.records || []).length !== 37) throw new Error('safe near page size');

          const response = await fetch('http://127.0.0.1:8802/api/major-bands?candidateScore=449&rangePreset=safe&band=near&limit=37&offset=0&repeat=1');
          const text = await response.text();
          if (response.status !== 200) throw new Error(`repeat HTTP ${response.status} ${text.slice(0, 200)}`);
          const repeat = JSON.parse(text);
          if (repeat.source?.requestedBandOrderCacheStatus !== 'ordered-id-hit') throw new Error('repeat order cache status');
          if (repeat.source?.requestedBandOrderPageSource !== 'page-id-refetch') throw new Error('repeat page source');
          if (Number(repeat.source?.rankDecodedRowCount || 0) > 37) throw new Error('repeat decoded more than page');
          NODE

          TARGET_BASE='http://127.0.0.1:8802' \
          CONCURRENCY_LEVELS='1,5,10,25,50' \
          CONCURRENCY_WAVES='2' \
          COLD_HARD_LIMIT_MS='12000' \
          P95_LIMIT_MS='7000' \
          P99_LIMIT_MS='12000' \
          HARD_LIMIT_MS='20000' \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE='/tmp/v3990-raw-row-reuse-local-concurrency.json' \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs

      - name: Stage workflows and commit verified source
        run: |
          set -euo pipefail
          mkdir -p tools/.workflow-contract-patches-v3990
          mapfile -t workflows < <(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -v 'zz-one-time-raw-row-page-reuse-v3990.yml' || true)
          test "${#workflows[@]}" -eq 2
          for file in "${workflows[@]}"; do
            cp "$file" "tools/.workflow-contract-patches-v3990/$(basename "$file")"
          done
          git checkout -- "${workflows[@]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions tools
          git commit -m 'fix(rank): reuse raw rows for cold current page'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-raw-row-page-reuse
          path: |
            /tmp/v3990-raw-row-reuse-cold.json
            /tmp/v3990-raw-row-reuse-local-concurrency.json
            /tmp/v3990-raw-row-reuse-wrangler.log
          if-no-files-found: warn
          retention-days: 7
