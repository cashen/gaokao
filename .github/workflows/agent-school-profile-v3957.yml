name: Agent school profile v3957 integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/school-profile-center-v3957
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge Tongxue direct-result branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/tongxue-direct-result-v156
          if git merge-base --is-ancestor origin/agent/tongxue-direct-result-v156 HEAD; then
            echo 'Tongxue direct-result branch already integrated'
          else
            git merge --no-ff origin/agent/tongxue-direct-result-v156 -m 'Merge Tongxue v1.5.6 direct result into v3.9.57.0'
          fi
      - name: Verify protected paths
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | tee /tmp/v3957-integrated-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3957-integrated-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi
      - name: Syntax checks
        run: |
          set -euo pipefail
          for file in \
            shared/resources/schools/school-profile-data.20260617-v3957.js \
            shared/resources/schools/school-profile-center.js \
            functions/_lib/school-tags.js \
            functions/_lib/location-normalizer.js \
            functions/_lib/school-display-tags.js \
            ln-rank/js/app.v3957_0.js \
            ln-rank/js/selection-pool.v3957_0.js \
            ln-rank/js/feature/major-pool/render.v3957_0.js \
            tongxue/app/tongxue-direct-result-v156.js \
            tongxue/app/tongxue-performance-v156.js \
            tools/verify-school-profile-center-v3957.mjs \
            tools/tongxue/verify-direct-result-v156.mjs; do
              node --check "$file"
          done
      - name: Verify school profile and Tongxue integration
        run: |
          set -euo pipefail
          node tools/verify-school-profile-center-v3957.mjs
          node tools/tongxue/verify-direct-result-v156.mjs
          node tools/tongxue/verify-direct-handoff-v155.mjs
          node tools/tongxue/verify-school-entities-v130.mjs
          node tools/tongxue/verify-school-region-ui-v150.mjs
      - name: Push integrated branch
        run: |
          set -euo pipefail
          git push origin HEAD:agent/school-profile-center-v3957
