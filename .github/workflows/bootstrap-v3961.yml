name: Bootstrap v3961 workspace

on:
  push:
    branches:
      - agent/selection-workspace-orchestration-v3961
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selection-workspace-orchestration-v3961
          fetch-depth: 0
      - name: Concatenate payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v3961/payload.part00 .bootstrap/v3961/payload.part01 .bootstrap/v3961/payload.part02 .bootstrap/v3961/payload.part03 .bootstrap/v3961/payload.part04 .bootstrap/v3961/payload.part05 .bootstrap/v3961/payload.part06 .bootstrap/v3961/payload.part07 .bootstrap/v3961/payload.part08 .bootstrap/v3961/payload.part09 > /tmp/v3961.b64
      - name: Decode payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode /tmp/v3961.b64 > /tmp/v3961.tar.gz
          sha256sum /tmp/v3961.tar.gz > /tmp/v3961.sha256
      - name: Upload decoded archive
        uses: actions/upload-artifact@v4
        with:
          name: v3961-decoded-archive
          path: |
            /tmp/v3961.tar.gz
            /tmp/v3961.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Extract payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v3961.tar.gz -C .
      - name: Validate implementation diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v3961.yml
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v3.9.61.0：专业初选工作区统一调度'
          git push origin HEAD:agent/selection-workspace-orchestration-v3961
