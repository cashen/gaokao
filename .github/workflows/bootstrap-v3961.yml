name: Bootstrap v3961 workspace

on:
  push:
    branches:
      - agent/selection-workspace-orchestration-v3961
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selection-workspace-orchestration-v3961
          fetch-depth: 0
      - name: Assemble payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v3961/payload.part{00..09} | base64 -d > /tmp/v3961.tar.gz
          echo '437423131ee3b43141c6e70a54810f2ff9556405a52076fe7359443e2b7487b5  /tmp/v3961.tar.gz' | sha256sum -c -
      - name: Extract payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v3961.tar.gz -C .
      - name: Validate implementation diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v3961.yml
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v3.9.61.0：专业初选工作区统一调度'
          git push origin HEAD:agent/selection-workspace-orchestration-v3961
