name: Bootstrap v3961 workspace

on:
  push:
    branches:
      - agent/selection-workspace-orchestration-v3961
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selection-workspace-orchestration-v3961
          fetch-depth: 0
      - name: Assemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/v3961/payload.part00 .bootstrap/v3961/payload.part01 .bootstrap/v3961/payload.part02 .bootstrap/v3961/payload.part03 .bootstrap/v3961/payload.part04 .bootstrap/v3961/payload.part05 .bootstrap/v3961/payload.part06 .bootstrap/v3961/payload.part07 .bootstrap/v3961/payload.part08 .bootstrap/v3961/payload.part09 > /tmp/v3961.b64
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v3961.b64')
          value = path.read_text(encoding='ascii')
          assert len(value) == 73640
          assert value[57275] == 'l'
          value = value[:57275] + value[57276:]
          value = value[:71946] + 'E' + value[71946:]
          path.write_text(value, encoding='ascii')
          PY
          echo 'df8eb5257a80939ec4b344ec15509f56f5027d633884af25393cda4c2a613d6c  /tmp/v3961.b64' | sha256sum -c -
          base64 --decode /tmp/v3961.b64 > /tmp/v3961.tar.gz
          echo '437423131ee3b43141c6e70a54810f2ff9556405a52076fe7359443e2b7487b5  /tmp/v3961.tar.gz' | sha256sum -c -
          gzip -t /tmp/v3961.tar.gz
      - name: Extract and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v3961.tar.gz -C .
          git checkout -- .github/workflows/verify-ln-2026-final.yml
          rm -rf .bootstrap
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v3.9.61.0：专业初选工作区统一调度'
      - name: Push implementation
        id: push
        shell: bash
        run: |
          set +e
          git push origin HEAD:agent/selection-workspace-orchestration-v3961 > /tmp/v3961-push.log 2>&1
          code=$?
          cat /tmp/v3961-push.log
          echo "$code" > /tmp/v3961-push.code
          exit "$code"
      - name: Upload push diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3961-push-diagnostics
          path: |
            /tmp/v3961-push.log
            /tmp/v3961-push.code
          if-no-files-found: error
          retention-days: 1
