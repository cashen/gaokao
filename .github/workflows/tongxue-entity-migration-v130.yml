name: Tongxue v1.3.0 clean publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tongxue-entity-migration-v130.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tongxue-school-entities-v130
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - name: Verify final implementation
        run: |
          node --check tongxue/data/school-entities-v130.js
          node --check tongxue/data/school-name-resolver.js
          node --check tongxue/app/tongxue-school-entity-ui-v130.js
          node --check tongxue/app/tongxue-performance-v130.js
          node --check tongxue/share/tongxue-share-v130.js
          node --check functions/api/tongxue-summary.js
          node --check functions/api/tongxue-school-portrait.js
          node --check functions/_lib/tongxue-summary-base-v112.js
          node --check functions/_lib/tongxue-school-portrait-base-v120.js
          node tools/tongxue/verify-directory.mjs
          node tools/tongxue/verify-school-entities-v130.mjs
          node tools/tongxue/verify-share.mjs
      - name: Verify portrait and live APIs
        env:
          PORTRAIT_LIVE_SCHOOLS: 东北大学秦皇岛分校,哈尔滨工业大学（威海）
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: |
          node tools/tongxue/verify-portrait.mjs
          node tools/tongxue/run-live-regression.mjs
      - name: Verify official school indexes
        run: |
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' --output /tmp/tongxue-live-artifact/moe-2026-schools.xls 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          python tools/tongxue/build-moe-2026-school-index.py --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls --output tongxue/data/school-name-index.generated.json --search-output tongxue/data/school-search-index.20260617.json
          git diff --exit-code -- tongxue/data/school-name-index.generated.json tongxue/data/school-search-index.20260617.json
          node tools/tongxue/verify-school-name-resolver.mjs
      - name: Publish clean final branch
        run: |
          files=(
            functions/_lib/tongxue-school-portrait-base-v120.js
            functions/_lib/tongxue-summary-base-v112.js
            functions/api/tongxue-school-portrait.js
            functions/api/tongxue-summary.js
            tongxue/app/tongxue-performance-v130.js
            tongxue/app/tongxue-school-entity-ui-v130.js
            tongxue/data/school-entities-v130.js
            tongxue/data/school-name-resolver.js
            tongxue/index.html
            tongxue/portrait/tongxue-school-portrait-v120.js
            tongxue/share/tongxue-share-v130.js
            tools/tongxue/verify-directory.mjs
            tools/tongxue/verify-live.mjs
            tools/tongxue/verify-portrait.mjs
            tools/tongxue/verify-school-entities-v130.mjs
            tools/tongxue/verify-share.mjs
          )
          tar -cf /tmp/tongxue-v130-final.tar "${files[@]}"
          git fetch origin main feat/tongxue-school-entities-v130-final
          git checkout -B feat/tongxue-school-entities-v130-final origin/main
          tar -xf /tmp/tongxue-v130-final.tar
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"
          git commit -m 'feat: support school branches and campuses v1.3.0'
          git push origin HEAD:feat/tongxue-school-entities-v130-final
