name: Tongxue school entities v1.3.0 migration

on:
  pull_request:
    paths:
      - 'tongxue/**'
      - 'functions/api/tongxue-*.js'
      - 'functions/_lib/tongxue-*.js'
      - 'tools/tongxue/**'
      - '.github/workflows/tongxue-entity-migration-v130.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tongxue-school-entities-v130
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check xlrd==2.0.1
      - run: python tools/tongxue/apply-school-entities-v130.py
      - name: Align v1.3.0 share contract
        run: |
          sed -i 's/同学你好 v1.2.1/同学你好 v1.3.0/g; s/tongxue-performance-v120.js?v=121/tongxue-performance-v130.js?v=130/g' tools/tongxue/verify-share.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/tongxue/verify-share.mjs')
          s=p.read_text(encoding='utf-8')
          a=s.index('  shareUrl:');b=s.index('\n',a)
          s=s[:a]+"  shareUrl:share.includes('history.replaceState')&&share.includes('entityId')&&canonical.includes('entity=hit-weihai'),"+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify entity implementation
        run: |
          node --check tongxue/data/school-entities-v130.js
          node --check tongxue/data/school-name-resolver.js
          node --check tongxue/app/tongxue-school-entity-ui-v130.js
          node --check tongxue/app/tongxue-performance-v130.js
          node --check tongxue/share/tongxue-share-v130.js
          node --check functions/api/tongxue-summary.js
          node --check functions/api/tongxue-school-portrait.js
          node tools/tongxue/verify-directory.mjs
          node tools/tongxue/verify-school-entities-v130.mjs
      - name: Verify mobile share workflow
        run: node tools/tongxue/verify-share.mjs
      - name: Verify school portrait workflow
        env:
          PORTRAIT_LIVE_SCHOOLS: 东北大学秦皇岛分校,哈尔滨工业大学（威海）
        run: node tools/tongxue/verify-portrait.mjs
      - name: Rebuild official school indexes
        run: |
          mkdir -p /tmp/tongxue-live-artifact
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 --user-agent 'Mozilla/5.0 Chrome/150 Safari/537.36' --referer 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/t20260618_1441074.html' --output /tmp/tongxue-live-artifact/moe-2026-schools.xls 'https://www.moe.gov.cn/jyb_xxgk/s5743/s5744/202606/W020260618307096078684.xls'
          python tools/tongxue/build-moe-2026-school-index.py --xls /tmp/tongxue-live-artifact/moe-2026-schools.xls --output tongxue/data/school-name-index.generated.json --search-output tongxue/data/school-search-index.20260617.json
          git diff --exit-code -- tongxue/data/school-name-index.generated.json tongxue/data/school-search-index.20260617.json
          node tools/tongxue/verify-school-name-resolver.mjs
      - name: Existing live regression
        env:
          REQUIRED_SUCCESS_SCHOOLS: 吉林大学,大连理工大学
          EXPECTED_REVIEW_FALLBACK_SCHOOLS: 辽宁大学,辽宁科技大学
        run: node tools/tongxue/run-live-regression.mjs
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tongxue functions/api/tongxue-summary.js functions/api/tongxue-school-portrait.js functions/_lib/tongxue-summary-base-v112.js functions/_lib/tongxue-school-portrait-base-v120.js tools/tongxue/verify-live.mjs tools/tongxue/verify-portrait.mjs tools/tongxue/verify-share.mjs tools/tongxue/verify-directory.mjs tools/tongxue/verify-school-entities-v130.mjs
          git diff --cached --quiet || git commit -m 'feat: support school branches and campuses v1.3.0'
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/tongxue-school-entities-v130
            git rebase origin/feat/tongxue-school-entities-v130
            if git push origin HEAD:feat/tongxue-school-entities-v130; then exit 0; fi
            sleep 4
          done
          exit 1
