name: One-time v3990 all-bands serialized-row memory fix

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-all-bands-serialized-rows.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch bounded serialized raw-row ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          provider_path = Path('functions/_lib/major-bands-static-provider.js')
          provider = provider_path.read_text(encoding='utf-8')
          provider = replace_once(
              provider,
              "export function decodeMajorBandsStaticRow(row, schema) {\n  return decodeRow(row, schema);\n}",
              "export function decodeMajorBandsStaticRow(row, schema) {\n  const sourceRow = typeof row === 'string' ? JSON.parse(row) : row;\n  if (!Array.isArray(sourceRow)) throw new Error('静态专业原始行格式异常');\n  return decodeRow(sourceRow, schema);\n}",
              'static row serialized decode'
          )
          provider = replace_once(
              provider,
              "export function decodeMajorBandsRankOrderRow(row = [], projectionSchema = {}) {\n  const value = key => Number.isInteger(projectionSchema[key]) && projectionSchema[key] >= 0\n    ? row[projectionSchema[key]]\n    : undefined;\n  const specialHas = Boolean(value('specialHas'));",
              "export function decodeMajorBandsRankOrderRow(row = [], projectionSchema = {}, options = {}) {\n  const value = key => Number.isInteger(projectionSchema[key]) && projectionSchema[key] >= 0\n    ? row[projectionSchema[key]]\n    : undefined;\n  const specialHas = Boolean(value('specialHas'));\n  const rawRowStorage = options.rawRowStorage === 'serialized-json'\n    ? 'serialized-json'\n    : 'array-reference';\n  const rawRowValue = rawRowStorage === 'serialized-json' ? JSON.stringify(row) : row;",
              'rank order projection storage mode'
          )
          provider = replace_once(
              provider,
              "    majorBandsRawRow: {\n      value: row,\n      enumerable: false,\n      configurable: false,\n      writable: false\n    },\n    majorBandsRawSchema: {",
              "    majorBandsRawRow: {\n      value: rawRowValue,\n      enumerable: false,\n      configurable: false,\n      writable: false\n    },\n    majorBandsRawRowStorage: {\n      value: rawRowStorage,\n      enumerable: false,\n      configurable: false,\n      writable: false\n    },\n    majorBandsRawSchema: {",
              'raw row storage metadata'
          )
          provider = replace_once(
              provider,
              "  const records = projectionSchema\n    ? selectedRows.map(row => decodeMajorBandsRankOrderRow(row, projectionSchema))\n    : selectedRows.map(row => decodeRow(row, schema));",
              "  const records = projectionSchema\n    ? selectedRows.map(row => decodeMajorBandsRankOrderRow(row, projectionSchema, {\n        rawRowStorage: options.rawRowStorage\n      }))\n    : selectedRows.map(row => decodeRow(row, schema));",
              'rank bucket serialized projection'
          )
          provider = replace_once(
              provider,
              "    minimalProjection: projectionVersion === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n    rowCount: payload.rows.length,",
              "    minimalProjection: projectionVersion === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n    rawRowStorage: projectionSchema\n      ? (options.rawRowStorage === 'serialized-json' ? 'serialized-json' : 'array-reference')\n      : 'full-record',\n    rowCount: payload.rows.length,",
              'rank bucket storage telemetry'
          )
          provider_path.write_text(provider, encoding='utf-8')

          loader_path = Path('functions/_lib/major-bands-rank-bucket-loader.v3990_0.js')
          loader = loader_path.read_text(encoding='utf-8')
          loader = replace_once(
              loader,
              "  const projection = options.projection || 'full-record-v3990_0';\n  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}|${projection}`;",
              "  const projection = options.projection || 'full-record-v3990_0';\n  const rawRowStorage = options.rawRowStorage === 'serialized-json' ? 'serialized-json' : 'array-reference';\n  return `${indexBucket.file}|${suffix}|${pageIdFingerprint(options.allowedIds)}|${projection}|${rawRowStorage}`;",
              'bucket cache storage identity'
          )
          loader = replace_once(
              loader,
              "    allowedIds: options.allowedIds,\n    projection: options.projection\n  }).then(loaded => {",
              "    allowedIds: options.allowedIds,\n    projection: options.projection,\n    rawRowStorage: options.rawRowStorage\n  }).then(loaded => {",
              'bucket provider storage option'
          )
          loader = replace_once(
              loader,
              "        minimalProjection: options.projection === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n        rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,",
              "        minimalProjection: options.projection === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n        rawRowStorage: options.projection === MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION\n          ? (options.rawRowStorage === 'serialized-json' ? 'serialized-json' : 'array-reference')\n          : 'full-record',\n        rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,",
              'empty loader storage telemetry'
          )
          loader = replace_once(
              loader,
              "      minimalProjection: results.every(result => result?.loaded?.minimalProjection === true),\n      rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,",
              "      minimalProjection: results.every(result => result?.loaded?.minimalProjection === true),\n      rawRowStorage: results[0]?.loaded?.rawRowStorage || 'full-record',\n      rankRowFilterVersion: MAJOR_BANDS_RANK_ROW_FILTER_VERSION,",
              'loaded storage telemetry'
          )
          loader_path.write_text(loader, encoding='utf-8')

          api_path = Path('functions/api/major-bands.js')
          api = api_path.read_text(encoding='utf-8')
          api = replace_once(
              api,
              "      const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, {\n        projection: MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION\n      });",
              "      const loaded = await loadMajorBandsRankWindow(context, selectedBuckets, {\n        projection: MAJOR_BANDS_RANK_ORDER_PROJECTION_VERSION,\n        rawRowStorage: 'serialized-json'\n      });",
              'all-bands serialized raw rows'
          )
          old_check = "if (!Array.isArray(record.majorBandsRawRow) || !Array.isArray(record.majorBandsRawSchema))"
          new_check = "if (!(Array.isArray(record.majorBandsRawRow) || typeof record.majorBandsRawRow === 'string') || !Array.isArray(record.majorBandsRawSchema))"
          check_count = api.count(old_check)
          if check_count != 2:
              raise SystemExit(f'raw row decode guards: expected two anchors, got {check_count}')
          api = api.replace(old_check, new_check)
          api = replace_once(
              api,
              "    retainRequestedBandOrderSnapshot(orderIdentity, retained);\n    orderCacheStatus = 'all-bands-shared-projection';\n    orderPageSource = 'all-bands-shared-projection';\n    allBandsShared.bandUses = Number(allBandsShared.bandUses || 0) + 1;",
              "    // The all-band response consumes one shared projection synchronously.\n    // Do not duplicate three complete ordered-ID snapshots into module state,\n    // and release each heavy ordered array immediately after its page is decoded.\n    ordered.length = 0;\n    orderCacheStatus = 'all-bands-shared-projection';\n    orderPageSource = 'all-bands-shared-projection';\n    allBandsShared.bandUses = Number(allBandsShared.bandUses || 0) + 1;",
              'shared projection immediate release'
          )
          api = replace_once(
              api,
              "  const orderedIds = Array.isArray(retained.orderedIds) ? retained.orderedIds : [];\n  const pageIds = orderedIds.slice(pageOffset, pageOffset + pageLimit);",
              "  const orderedIds = Array.isArray(retained.orderedIds) ? retained.orderedIds : [];\n  const orderedIdCount = orderedIds.length;\n  const pageIds = orderedIds.slice(pageOffset, pageOffset + pageLimit);",
              'ordered id count capture'
          )
          api = replace_once(api, "  const hasMore = nextOffset < orderedIds.length;", "  const hasMore = nextOffset < orderedIdCount;", 'ordered hasMore count')
          api = replace_once(api, "        count: orderedIds.length,", "        count: orderedIdCount,", 'ordered group count')
          api = replace_once(
              api,
              "  return {\n    value: {\n      candidateRank: retained.candidateRank,",
              "  if (allBandsShared) orderedIds.length = 0;\n  return {\n    value: {\n      candidateRank: retained.candidateRank,",
              'transient ordered IDs release'
          )
          api = replace_once(api, "    orderCacheIdCount: orderedIds.length,", "    orderCacheIdCount: orderedIdCount,", 'ordered cache telemetry count')
          api = replace_once(
              api,
              "        requestedBandRawRowReferenceNonEnumerable: execution.rawRowReferenceNonEnumerable === true,\n        requestedBandOrderIds:",
              "        requestedBandRawRowReferenceNonEnumerable: execution.rawRowReferenceNonEnumerable === true,\n        requestedBandRawRowStorage: loadedStats.rawRowStorage || 'full-record',\n        requestedBandOrderIds:",
              'raw row storage response telemetry'
          )
          api_path.write_text(api, encoding='utf-8')

          audit_path = Path('tools/audit-major-bands-rank-kernel-v3990_0.mjs')
          audit = audit_path.read_text(encoding='utf-8')
          audit = replace_once(
              audit,
              "    assert.ok(!serialized.includes('majorBandsRawSchema'), 'raw schema reference serialized');\n  }\n  buckets.set(bucket.file, records);",
              "    assert.ok(!serialized.includes('majorBandsRawSchema'), 'raw schema reference serialized');\n    const serializedProjected = decodeMajorBandsRankOrderRow(payload.rows[0], projectionSchema, {\n      rawRowStorage: 'serialized-json'\n    });\n    assert.equal(typeof serializedProjected.majorBandsRawRow, 'string', 'serialized raw row absent');\n    assert.equal(serializedProjected.majorBandsRawRowStorage, 'serialized-json', 'serialized raw row storage');\n    assert.equal(Object.prototype.propertyIsEnumerable.call(serializedProjected, 'majorBandsRawRow'), false, 'serialized raw row enumerable');\n    const serializedRestored = decodeMajorBandsStaticRow(\n      serializedProjected.majorBandsRawRow,\n      serializedProjected.majorBandsRawSchema\n    );\n    assert.equal(serializedRestored.id, serializedProjected.id, 'serialized raw row page decode id');\n    assert.equal(serializedRestored.school, serializedProjected.school, 'serialized raw row page decode school');\n  }\n  buckets.set(bucket.file, records);",
              'serialized projection audit'
          )
          audit_path.write_text(audit, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          verifier = replace_once(
              verifier,
              "  assert.equal(result.payload?.source?.requestedBandRawRowReferenceNonEnumerable, true, `${result.scenario}: raw row reference contract`);",
              "  assert.equal(result.payload?.source?.requestedBandRawRowReferenceNonEnumerable, true, `${result.scenario}: raw row reference contract`);\n  assert.equal(\n    result.payload?.source?.requestedBandRawRowStorage,\n    result.allBands ? 'serialized-json' : 'array-reference',\n    `${result.scenario}: raw row storage ownership`\n  );",
              'preview raw row storage gate'
          )
          verifier_path.write_text(verifier, encoding='utf-8')

          workflow_path = Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = replace_once(
              workflow,
              "          grep -q \"MAJOR_BANDS_RANK_ROW_FILTER_VERSION = 'major-bands-rank-row-filter-v3990_0'\" functions/_lib/major-bands-static-provider.js\n          grep -q \"const MAX_LOAD_CONCURRENCY = 1\"",
              "          grep -q \"MAJOR_BANDS_RANK_ROW_FILTER_VERSION = 'major-bands-rank-row-filter-v3990_0'\" functions/_lib/major-bands-static-provider.js\n          grep -q \"options.rawRowStorage === 'serialized-json'\" functions/_lib/major-bands-static-provider.js\n          grep -q \"rawRowStorage: 'serialized-json'\" functions/api/major-bands.js\n          grep -q \"ordered.length = 0\" functions/api/major-bands.js\n          grep -q \"requestedBandRawRowStorage\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs\n          grep -q \"const MAX_LOAD_CONCURRENCY = 1\"",
              'permanent serialized-row source gate'
          )
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Verify syntax, truth, recall and cache contracts
        run: |
          set -euo pipefail
          node --check functions/api/major-bands.js
          node --check functions/_lib/major-bands-static-provider.js
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_0.js
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-request-band-scope-v3990_0.mjs
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/v3990-serialized-rank-audit.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_0.mjs

      - name: Verify local Pages pressure before commit
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8793 --compatibility-date=2026-07-01 >/tmp/v3990-serialized-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              'http://127.0.0.1:8793/api/major-bands?candidateScore=579&rangePreset=standard&limit=16' \
              | grep -q '"requestedBandRawRowStorage":"serialized-json"'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          TARGET_BASE=http://127.0.0.1:8793 \
          CONCURRENCY_LEVELS=1,5,10,25,50 \
          CONCURRENCY_WAVES=2 \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE=/tmp/v3990-serialized-local-pressure.json \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          kill "$worker_pid" 2>/dev/null || true
          wait "$worker_pid" 2>/dev/null || true
          trap - EXIT

      - name: Commit verified memory fix and remove one-time workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-time-v3990-all-bands-serialized-rows.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/major-bands.js \
            functions/_lib/major-bands-static-provider.js \
            functions/_lib/major-bands-rank-bucket-loader.v3990_0.js \
            tools/audit-major-bands-rank-kernel-v3990_0.mjs \
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs \
            .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml \
            .github/workflows/zz-one-time-v3990-all-bands-serialized-rows.yml
          git commit -m 'fix(rank): bound all-bands raw-row memory ownership'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-all-bands-serialized-row-evidence
          path: |
            /tmp/v3990-serialized-rank-audit.json
            /tmp/v3990-serialized-local-pressure.json
            /tmp/v3990-serialized-wrangler.log
          if-no-files-found: warn
          retention-days: 7
