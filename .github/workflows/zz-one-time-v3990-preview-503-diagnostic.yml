name: One-time v3990 Preview 503 diagnostic

on:
  push:
    branches:
      - agent/deploy-workflow-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-preview-503-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-preview-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deploy-workflow-v3990_0
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build diagnostic verifier copy
        run: |
          set -euo pipefail
          cp tools/verify-major-bands-preview-concurrency-v3990_0.mjs /tmp/v3990-preview-503-diagnostic.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v3990-preview-503-diagnostic.mjs')
          text = path.read_text(encoding='utf-8')
          old = """    const result = await requestScenario({ ...scenario, path }, `page-${scenario.name}-${offset}-${Date.now()}`);
    validateResult(result);"""
          new = """    let result = await requestScenario({ ...scenario, path }, `page-${scenario.name}-${offset}-${Date.now()}`);
    if (result.status !== 200) {
      console.error(JSON.stringify({ phase: 'pagination-initial-failure', scenario: scenario.name, offset, status: result.status, cloudflare1102: result.cloudflare1102, bodyPrefix: result.bodyPrefix || '', message: result.payload?.message || '', elapsedMs: result.elapsedMs }));
      for (const retryDelayMs of [1000, 2000, 4000]) {
        await new Promise(resolve => setTimeout(resolve, retryDelayMs));
        result = await requestScenario({ ...scenario, path }, `page-retry-${scenario.name}-${offset}-${retryDelayMs}-${Date.now()}`);
        console.error(JSON.stringify({ phase: 'pagination-retry', scenario: scenario.name, offset, retryDelayMs, status: result.status, cloudflare1102: result.cloudflare1102, bodyPrefix: result.bodyPrefix || '', message: result.payload?.message || '', elapsedMs: result.elapsedMs }));
        if (result.status === 200 || result.cloudflare1102) break;
      }
    }
    validateResult(result);"""
          if text.count(old) != 1:
              raise SystemExit(f'diagnostic anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check /tmp/v3990-preview-503-diagnostic.mjs
      - name: Run identical Preview stress with recovery evidence
        env:
          TARGET_BASE: https://agent-deploy-workflow-v3990.gaokao-4y9.pages.dev
          CONCURRENCY_LEVELS: 1,5,10,25,50
          CONCURRENCY_WAVES: '2'
          COLD_HARD_LIMIT_MS: '15000'
          P95_LIMIT_MS: '8000'
          P99_LIMIT_MS: '15000'
          HARD_LIMIT_MS: '25000'
          MAJOR_BANDS_CONCURRENCY_EVIDENCE: /tmp/v3990-preview-503-recovery.json
        run: |
          set -euo pipefail
          node /tmp/v3990-preview-503-diagnostic.mjs 2>&1 | tee /tmp/v3990-preview-503-recovery.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-preview-503-recovery
          path: |
            /tmp/v3990-preview-503-recovery.json
            /tmp/v3990-preview-503-recovery.log
          if-no-files-found: warn
          retention-days: 7
