name: Verify ln-rank input clear state v001

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'ln-rank/**'
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/active-resource-manifest.v3990_3.js'
      - 'shared/resources/release/site-runtime-contract.v3990_3.js'
      - 'tools/test-ln-rank-human-query-flow-v001.mjs'
      - 'tools/verify-ln-rank-unified-card-context-v001.mjs'
      - 'tools/audit-three-card-entries-v001.mjs'
      - 'docs/plans/ln-rank-input-clear-state-v001.md'
  push:
    branches: [main]
    paths:
      - 'ln-rank/**'
      - 'shared/resources/release/current-release.js'
      - 'shared/resources/release/active-resource-manifest.v3990_3.js'
      - 'shared/resources/release/site-runtime-contract.v3990_3.js'
      - 'tools/test-ln-rank-human-query-flow-v001.mjs'
      - 'tools/verify-ln-rank-unified-card-context-v001.mjs'
      - 'tools/audit-three-card-entries-v001.mjs'
      - 'docs/plans/ln-rank-input-clear-state-v001.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: ln-rank-input-clear-state-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse active owners
        run: |
          node --check ln-rank/js/feature/major-all/major-all-mode.v001.js
          node --check ln-rank/js/feature/school-majors/school-all-mode.v3969_2.js
          node --check ln-rank/js/workspace/selection-workspace-orchestrator.v3969_2.js
          node --check ln-rank/js/workspace/selection-workspace-orchestrator.v3990_3.js
          node --check ln-rank/js/app-runtime.v3990_3.js
          node --check tools/test-ln-rank-human-query-flow-v001.mjs
      - name: Verify input source and history restoration contract
        run: node tools/test-ln-rank-human-query-flow-v001.mjs
      - name: Verify unified card context and cache identity
        run: node tools/verify-ln-rank-unified-card-context-v001.mjs
      - name: Verify three-entry cache references
        run: node tools/audit-three-card-entries-v001.mjs
