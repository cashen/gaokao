name: One-time rank workflow indentation repair v3990

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 0
      - name: Generate validated workflow blobs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch_dir = Path('tools/.workflow-contract-patches-v3990')
          patch_dir.mkdir(parents=True, exist_ok=True)
          names = [
              'verify-major-bands-bounded-fanout-v3972_5.yml',
              'verify-production-api-health-v3971.yml',
              'verify-production-resource-graph-v3972_6.yml'
          ]
          for name in names:
              source = Path('.github/workflows') / name
              text = source.read_text(encoding='utf-8')
              text = re.sub(
                  r'(?m)^grep -q "(MAX_COMPLETED_PAGES = 1|MAX_SERIALIZED_CHARS = 500_000|COMPLETED_TTL_MS = 15_000)"',
                  r'          grep -q "\1"',
                  text
              )
              if 'major-bands-query-execution-cache-serialized-request-timer-v3990_0' in text:
                  raise SystemExit(f'old cache version remains in {name}')
              for line in text.splitlines():
                  if line.startswith('grep -q "'):
                      raise SystemExit(f'unindented shell command remains in {name}: {line}')
              (patch_dir / name).write_text(text, encoding='utf-8')
          PY

          for file in tools/.workflow-contract-patches-v3990/*.yml; do
            ruby -e "require 'yaml'; YAML.parse_file(ARGV[0])" "$file"
          done

      - name: Commit validated workflow blobs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/.workflow-contract-patches-v3990
          git diff --cached --check
          git commit -m 'test(rank): stage validated workflow contracts'
          git push origin HEAD:agent/rank-kernel-v3990_0
