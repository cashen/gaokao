name: Patch final verifier portability v3990_1

on:
  push:
    branches:
      - agent/ai-semantic-active-view-v3990_1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make maintained final verifier safe when runtime-mapped
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/ln-2026/verify-final-release-v3990_0.py')
          text = path.read_text()
          before = "from pathlib import Path\nimport json\nimport re\nimport sys\n\nROOT = Path(__file__).resolve().parents[2]"
          after = "from pathlib import Path\nimport json\nimport os\nimport re\nimport sys\n\n_SCRIPT_PATH = Path(__file__).resolve()\nROOT = (_SCRIPT_PATH.parents[2] if len(_SCRIPT_PATH.parents) > 2\n        else Path(os.environ.get('GITHUB_WORKSPACE') or Path.cwd()).resolve())"
          if before not in text:
              raise SystemExit('final verifier root contract changed; refusing blind patch')
          path.write_text(text.replace(before, after, 1))
          PY
          python3 -m py_compile tools/ln-2026/verify-final-release-v3990_0.py
          sed \
            -e 's/v3\.9\.90\.0/v3.9.90.1/g' \
            -e 's/v3990_0/v3990_1/g' \
            -e 's/3990_0/3990_1/g' \
            tools/ln-2026/verify-final-release-v3990_0.py > /tmp/verify-final-release-v3990_1.py
          GITHUB_WORKSPACE="$PWD" python3 /tmp/verify-final-release-v3990_1.py
      - name: Commit only verifier portability fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ln-2026/verify-final-release-v3990_0.py
          git diff --cached --quiet && { echo 'expected verifier change missing' >&2; exit 1; }
          git commit -m 'v3.9.90.1：让统一最终验收支持映射运行'
          git push origin "HEAD:${GITHUB_REF_NAME}"
