name: One-time v3990 deploy workflow repair

on:
  push:
    branches:
      - agent/deploy-workflow-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-deploy-workflow-repair.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deploy-workflow-v3990_0
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v3990 deploy audit repair
        run: python3 tools/zz_patch_v3990_deploy_workflow.py
      - name: Verify repaired deployment contracts
        run: |
          set -euo pipefail
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node --check tools/verify-production-resource-graph-v3990_0.mjs
          node --check tools/verify-production-baseline-v3971.mjs
          node tools/audit-canonical-release-version-v3990_0.mjs
          node tools/audit-site-runtime-generation-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          grep -q "display: 'v3.9.90.0'" .github/workflows/deploy-cloudflare-pages-main.yml
          grep -q 'verify-production-resource-graph-v3990_0.mjs' .github/workflows/deploy-cloudflare-pages-main.yml
          grep -q 'cloudflare-pages-v3990-0-production' .github/workflows/deploy-cloudflare-pages-main.yml
      - name: Commit verified deploy audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-production-resource-verification-v3990_0.mjs
          git commit -m 'test(release): govern v3990 Cloudflare deploy workflow'
          git push origin HEAD:agent/deploy-workflow-v3990_0
