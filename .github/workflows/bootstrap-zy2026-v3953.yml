name: Bootstrap ZY2026 source

on:
  push:
    branches:
      - agent/zy2026-structure-v3953
    paths:
      - '.bootstrap/zy2026-part-*'
      - '.github/workflows/bootstrap-zy2026-v3953.yml'

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/zy2026-structure-v3953
          fetch-depth: 1
      - name: Restore reviewed source package
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/zy2026-src.tar.gz
          for part in .bootstrap/zy2026-part-*; do
            base64 --decode "$part" >> /tmp/zy2026-src.tar.gz
          done
          echo '8974604931c2da6d7ca1c16141907faef4a85dfe4c05adc4566e7df14711c0e3  /tmp/zy2026-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/zy2026-src.tar.gz
          python3 -m py_compile tools/ln-2026/build-zy2026-structure.py tools/ln-2026/verify-final-release-v3.py
          node --check zy2026/assets/zy2026.v3953_0.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ln-2026/build-zy2026-structure.py tools/ln-2026/verify-final-release-v3.py zy2026
          if git diff --cached --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git commit -m 'Add ZY2026 structure analysis source and family UI'
          git push origin HEAD:agent/zy2026-structure-v3953
