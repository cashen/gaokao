name: Apply homepage version ownership v3965.0

on:
  push:
    branches:
      - agent/v3965-home-release-sync
    paths:
      - 'tools/fix-home-version-ownership-v3965.mjs'
      - '.github/workflows/apply-home-version-ownership-v3965.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-home-version-ownership-v3965-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3965-home-release-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply single release ownership
        run: node tools/fix-home-version-ownership-v3965.mjs
      - name: Validate generated ownership state
        run: |
          node tools/audit-runtime-ownership-v3965.mjs
          node tools/audit-static-content-types-v3965.mjs
      - name: Commit synchronized homepage release
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Homepage release ownership already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m '统一首页倒计时与 Shell 到 v3.9.65.0'
          git push origin HEAD:agent/v3965-home-release-sync
