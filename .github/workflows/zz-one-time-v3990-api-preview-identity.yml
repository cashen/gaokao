name: One-time v3990 API Preview identity

on:
  push:
    branches:
      - agent/pages-git-identity-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-api-preview-identity.yml'

permissions:
  contents: write

jobs:
  generate-verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pages-git-identity-v3990_0
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate candidate workflow and audit
        run: |
          set -euo pipefail
          python3 tools/zz_patch_v3990_api_preview_identity.py
          cp tools/zz_generated_verify-production-api-health-v3971.yml .github/workflows/verify-production-api-health-v3971.yml
      - name: Verify generated workflow and source audit
        run: |
          set -euo pipefail
          node --check tools/audit-production-resource-verification-v3990_0.mjs
          node tools/audit-production-resource-verification-v3990_0.mjs
          grep -Fq 'CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}' .github/workflows/verify-production-api-health-v3971.yml
          grep -Fq 'RELEASE_SHA="$CANDIDATE_SHA"' .github/workflows/verify-production-api-health-v3971.yml
          grep -Fq 'EXPECTED_DEPLOYMENT_BRANCH: main' .github/workflows/verify-production-api-health-v3971.yml
          if grep -Fq 'RELEASE_SHA="$GITHUB_SHA"' .github/workflows/verify-production-api-health-v3971.yml; then exit 1; fi
      - name: Verify exact branch Preview identity
        env:
          PAGES_BASE: https://agent-pages-git-identity-v39.gaokao-4y9.pages.dev
          CUSTOM_BASE: https://agent-pages-git-identity-v39.gaokao-4y9.pages.dev
          RELEASE_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYMENT_BRANCH: agent/pages-git-identity-v3990_0
          VERIFY_DEPLOYMENT_IDENTITY: 'true'
          VERIFY_MAJOR_BANDS: 'false'
          PRODUCTION_RESOURCE_ATTEMPTS: '45'
          PRODUCTION_RESOURCE_WAIT_MS: '10000'
          PRODUCTION_RESOURCE_EVIDENCE: /tmp/v3990-api-preview-identity.json
        run: |
          set -euo pipefail
          node tools/verify-production-resource-graph-v3990_0.mjs \
            2>&1 | tee /tmp/v3990-api-preview-identity.log
      - name: Commit audit and generated workflow blob
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/audit-production-resource-verification-v3990_0.mjs tools/zz_generated_verify-production-api-health-v3971.yml
          git commit -m 'test(release): govern PR head deployment identity'
          git push origin HEAD:agent/pages-git-identity-v3990_0
      - name: Upload identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-api-preview-identity
          path: |
            /tmp/v3990-api-preview-identity.json
            /tmp/v3990-api-preview-identity.log
          if-no-files-found: warn
          retention-days: 7
