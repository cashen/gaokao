name: Synchronize distributed v3972.2 deploy workflow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/sync-deploy-distributed-v3972.yml'

permissions:
  contents: write

jobs:
  synchronize-deploy-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Write exact production deployment contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          expression_open='$'+'{{'
          content=r'''name: Deploy main to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CF_PROJECT_NAME: @@ vars.CLOUDFLARE_PAGES_PROJECT || 'gaokao' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: @@ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployable main source and protected boundaries
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'main'
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f 404.html
          grep -q '页面不存在' 404.html
          grep -q 'distributed-major-bands-buckets-v3972-2' 404.html
          test -f ln-rank/data/major-bands-static-v3972_2/manifest.json
          test -f ln-rank/data/major-bands-static-v3972_2/audit.json
          grep -q "display: 'v3.9.72.2'" shared/resources/release/current-release.js
          grep -q "all211Architecture: 'build-time-static-index'" shared/resources/release/current-release.js
          grep -q "maximumProbeChunks: 1" functions/api/major-bands-health.js
          grep -q "Large admission chunks are deliberately request-scoped" functions/_lib/fenxi-fetcher.js
          grep -q "selectMajorBandsStaticBuckets" functions/_lib/major-bands-static-provider.js
          grep -q "loadMajorBandsStaticBucket" functions/_lib/major-bands-static-provider.js
          grep -q "processMajorBandsStaticBucket" functions/_lib/major-bands-bucket-engine.js
          grep -q "major-bands-bucket-v3972_2" functions/api/major-bands-bucket.js
          grep -q "selectMajorBandsStaticBuckets" functions/api/major-bands.js
          grep -q "/api/major-bands-bucket" functions/api/major-bands.js
          grep -q "distributed-bucket-workers" functions/api/major-bands.js
          if grep -Eq "loadMajorBandsStaticWindow|streamFenxiChunkRecords|loadManifest|fetchFenxiJson" functions/api/major-bands.js; then
            echo 'major-bands still performs multi-bucket or raw admission scanning in one Worker'
            exit 1
          fi
          test ! -e functions/api/local-strength.js
          test ! -e functions/_lib/local-strength-api.js
          for file in \
            functions/api/major-bands-health.js \
            functions/_lib/fenxi-fetcher.js \
            functions/_lib/major-bands-static-provider.js \
            functions/_lib/major-bands-bucket-engine.js \
            functions/api/major-bands-bucket.js \
            functions/api/major-bands.js \
            tools/verify-production-v3971.mjs; do
            node --check "$file"
          done
          node --experimental-default-type=module - <<'NODE'
          import fs from 'node:fs';
          const dir='ln-rank/data/major-bands-static-v3972_2';
          const manifest=JSON.parse(fs.readFileSync(`${dir}/manifest.json`,'utf8'));
          const audit=JSON.parse(fs.readFileSync(`${dir}/audit.json`,'utf8'));
          if(manifest.version!=='major-bands-static-v3972_2'||manifest.architecture!=='build-time-static-score-index'||manifest.encoding!=='schema-row-array-atomic-v2') throw new Error('static major-bands contract');
          if(manifest.bucketSize!==5) throw new Error(`static major-bands bucket size ${manifest.bucketSize}`);
          if(manifest.recordCount!==11628||!manifest.integrity?.completeEvaluation||manifest.integrity.evaluatedRecordCount!==11628) throw new Error('static major-bands coverage');
          if(manifest.integrity.duplicateRecordCount!==0||manifest.integrity.unresolvedRecordCount!==0) throw new Error('static major-bands integrity');
          if(!Array.isArray(manifest.buckets)||manifest.buckets.length<60||manifest.buckets.reduce((sum,item)=>sum+Number(item.recordCount||0),0)!==11628) throw new Error('static major-bands bucket coverage');
          if(audit.indexBytes>8500000) throw new Error(`static major-bands budget ${audit.indexBytes}`);
          if(Math.max(...manifest.buckets.map(item=>Number(item.bytes||0)))>800000) throw new Error('static major-bands single bucket budget');
          NODE
      - name: Resolve and verify Cloudflare deployment credentials
        env:
          CF_TOKEN_PRIMARY: @@ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_FALLBACK: @@ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_PRIMARY: @@ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_FALLBACK: @@ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="${CF_TOKEN_PRIMARY:-${CF_TOKEN_FALLBACK:-}}"
          account="${CF_ACCOUNT_PRIMARY:-${CF_ACCOUNT_FALLBACK:-}}"
          test -n "$token" || { echo 'Missing CLOUDFLARE_API_TOKEN or CF_API_TOKEN repository secret.'; exit 2; }
          test -n "$account" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID or CF_ACCOUNT_ID repository secret.'; exit 2; }
          test -n "${CF_PROJECT_NAME:-}" || { echo 'Missing Cloudflare Pages project name.'; exit 2; }
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
      - name: Deploy exact main commit
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --pretty=%s)"
          npx --yes wrangler@4.28.1 pages deploy . \
            --project-name="$CF_PROJECT_NAME" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$commit_message"
      - name: Verify v3.9.72.2 production with 40 concurrent cycles
        env:
          PAGES_BASE: https://gaokao-4y9.pages.dev
          CUSTOM_BASE: https://gaokao.powers.org.cn
          EXPECTED_RELEASE: v3.9.72.2
          EXPECTED_LOCAL_STRENGTH_PAGE_RELEASE: v3.9.71.2
          PRODUCTION_VERIFY_ATTEMPTS: '45'
          PRODUCTION_VERIFY_WAIT_MS: '10000'
          PRODUCTION_STRESS_CYCLES: '40'
          PRODUCTION_STRESS_WAIT_MS: '1000'
        run: |
          set -euo pipefail
          node tools/verify-production-v3971.mjs 2>&1 | tee /tmp/cloudflare-pages-production-verification.out
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-v3972-2-production
          path: /tmp/cloudflare-pages-production-verification.out
          if-no-files-found: warn
          retention-days: 7
'''.replace('@@',expression_open)
          Path('.github/workflows/deploy-cloudflare-pages-main.yml').write_text(content)
          PY
          git add .github/workflows/deploy-cloudflare-pages-main.yml
          if git diff --cached --quiet; then
            echo 'production deploy workflow already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deploy): synchronize distributed v3.9.72.2 production chain'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
