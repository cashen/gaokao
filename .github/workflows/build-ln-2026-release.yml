name: Build LN 2026 release data

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.pull_request.title, '[generated-ln2026]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Decode and patch build tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, py_compile
          for pattern, target in [
              ('tools/ln-2026/payload/build_release.py.part*', '/tmp/build_release.py'),
              ('tools/ln-2026/payload/verify_release.py.part*', '/tmp/verify_release.py')]:
              parts = sorted(Path('.').glob(pattern))
              encoded = ''.join(''.join(p.read_text().split()) for p in parts)
              Path(target).write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          p = Path('/tmp/build_release.py')
          text = p.read_text()
          text = text.replace(
              'ROOT = Path(os.environ.get("GITHUB_WORKSPACE", Path(__file__).resolve().parents[2]))',
              'ROOT = Path(os.environ["GITHUB_WORKSPACE"]) if os.environ.get("GITHUB_WORKSPACE") else Path(__file__).resolve().parents[2]')
          text = text.replace('subprocess.run(["pdftotext", "-layout", str(pdf), str(txt)], check=True)',
                              'subprocess.run(["pdftotext", "-raw", str(pdf), str(txt)], check=True)')
          text = text.replace('text = txt.read_text(encoding="utf-8", errors="ignore")',
                              'text = txt.read_text(encoding="utf-8", errors="ignore").replace(",", "")')
          needle = 'def download_rank_pdf(dest: Path):\n'
          inject = '''def download_rank_pdf(dest: Path):\n    local = os.environ.get("LN2026_RANK_PDF")\n    if local:\n        dest.write_bytes(Path(local).read_bytes())\n        return os.environ.get("LN2026_RANK_SOURCE", "verified mirror")\n'''
          if needle not in text: raise SystemExit('rank PDF loader not found')
          p.write_text(text.replace(needle, inject, 1))
          py_compile.compile('/tmp/build_release.py', doraise=True)
          py_compile.compile('/tmp/verify_release.py', doraise=True)
          PY
      - name: Download verified score statistics PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import os
          url='https://img.gaokaozhitongche.com/uploads/file/2026/0625/1782387966574085.pdf'
          with urlopen(Request(url, headers={'User-Agent':'Mozilla/5.0'}), timeout=60) as r:
              data=r.read(); final=r.geturl()
          if len(data)<100000 or not data.startswith(b'%PDF'): raise SystemExit('invalid rank PDF')
          target=Path('/tmp/ln2026-rank.pdf'); target.write_bytes(data)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'LN2026_RANK_PDF={target}\nLN2026_RANK_SOURCE={final}\n')
          PY
      - name: Build and verify generated data
        run: |
          set +e
          python3 /tmp/build_release.py > /tmp/ln2026-build.log 2>&1
          status=$?
          cat /tmp/ln2026-build.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/ln2026-build.log tools/ln-2026/last-build-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/ln-2026/last-build-error.log
            git commit -m "ci: capture LN 2026 build failure [generated-ln2026]" || true
            git push origin HEAD:${{ github.head_ref }} || true
            exit "$status"
          fi
          python3 /tmp/verify_release.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tools/ln-2026/last-build-error.log
          git add tools/ln-2026/last-build-error.log fenxi/data/rank_2026_physics.json fenxi/data/ln-rank-2026 functions/_lib/ln-2026-physics-score-rank.js functions/_lib/kb/major-trend-2026.generated.js analysis/2026 ln-rank/data/major-trend-2026.json ln2026.html lngk2026.html
          if ! git diff --cached --quiet; then
            git commit -m "build: generate Liaoning 2026 three-year data [generated-ln2026]"
            git push origin HEAD:${{ github.head_ref }}
          fi
