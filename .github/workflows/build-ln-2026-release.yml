name: Build LN 2026 release data

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.pull_request.title, '[generated-ln2026]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Decode and validate build tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, py_compile
          pairs = [
              ('tools/ln-2026/build_release.py.gz.b64', '/tmp/build_release.py'),
              ('tools/ln-2026/verify_release.py.gz.b64', '/tmp/verify_release.py'),
          ]
          for source, target in pairs:
              encoded = ''.join(Path(source).read_text(encoding='utf-8').split())
              print(source, 'base64 chars', len(encoded))
              payload = base64.b64decode(encoded, validate=True)
              decoded = gzip.decompress(payload)
              Path(target).write_bytes(decoded)
              py_compile.compile(target, doraise=True)
              print(target, 'decoded bytes', len(decoded))
          PY
      - name: Build 2026 admission data and three-year reports
        run: python3 /tmp/build_release.py
      - name: Verify generated release
        run: python3 /tmp/verify_release.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fenxi/data/rank_2026_physics.json \
            fenxi/data/ln-rank-2026 \
            functions/_lib/ln-2026-physics-score-rank.js \
            functions/_lib/kb/major-trend-2026.generated.js \
            analysis/2026 \
            ln-rank/data/major-trend-2026.json \
            ln2026.html \
            lngk2026.html
          if git diff --cached --quiet; then
            echo "Generated outputs are already current."
          else
            git diff --cached --stat
            git commit -m "build: generate Liaoning 2026 three-year data [generated-ln2026]"
            git push origin HEAD:${{ github.head_ref }}
          fi
