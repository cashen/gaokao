name: Temporary diagnose QHD Preview 404

on:
  push:
    branches:
      - agent/ln-rank-worker-resource-vnext
    paths:
      - '.github/workflows/tmp-diagnose-qhd-preview-404.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ln-rank-worker-resource-vnext
      - name: Resolve local QHD projection locator
        id: local
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          idx=json.load(open('data/zy2026/school-index.json',encoding='utf-8'))
          names=['东北大学','东北大学秦皇岛分校','沈阳工业大学','沈阳农业大学','沈阳航空航天大学','辽宁科技大学']
          for name in names:
              hits=[x for x in idx.get('schools',[]) if x.get('name')==name or name in (x.get('admissionNames') or [])]
              print('\nSCHOOL',name,'hits',len(hits))
              for item in hits:
                  print(json.dumps({k:item.get(k) for k in ['key','name','officialName','admissionName','admissionNames','chunk','recordCount2026','projects2026']},ensure_ascii=False))
                  f=pathlib.Path('data/zy2026/chunks')/str(item.get('chunk'))
                  print('file',f,'exists',f.exists(),'bytes',f.stat().st_size if f.exists() else None,'tracked',end=' ')
                  print()
          qhd=next(x for x in idx['schools'] if x.get('name')=='东北大学秦皇岛分校')
          pathlib.Path('/tmp/qhd_chunk.txt').write_text(str(qhd['chunk']))
          PY
          echo "chunk=$(cat /tmp/qhd_chunk.txt)" >> "$GITHUB_OUTPUT"
          git ls-files "data/zy2026/chunks/$(cat /tmp/qhd_chunk.txt)"
      - name: Probe old immutable and branch Preview assets/endpoints
        shell: bash
        env:
          QHD_CHUNK: ${{ steps.local.outputs.chunk }}
        run: |
          set -euo pipefail
          for BASE in \
            'https://b8c42b22.gaokao-4y9.pages.dev' \
            'https://agent-ln-rank-worker-resourc.gaokao-4y9.pages.dev'; do
            echo "===== ${BASE} ====="
            for PATHNAME in \
              '/api/ai/health?diag=qhd' \
              '/data/zy2026/school-index.json' \
              "/data/zy2026/chunks/${QHD_CHUNK}"; do
              code="$(curl -sS --max-time 25 -o /tmp/body -w '%{http_code}' "${BASE}${PATHNAME}" || true)"
              type="$(file -b --mime-type /tmp/body 2>/dev/null || true)"
              bytes="$(wc -c </tmp/body 2>/dev/null || echo 0)"
              echo "GET ${PATHNAME} -> ${code} type=${type} bytes=${bytes}"
              head -c 240 /tmp/body | tr '\n' ' '; echo
            done
            code="$(curl -sS --max-time 30 -o /tmp/body -w '%{http_code}' --get "${BASE}/api/school-majors" \
              --data-urlencode 'school=东北大学秦皇岛分校' \
              --data-urlencode 'schoolIntent=school' \
              --data-urlencode 'candidateScore=561' \
              --data-urlencode 'limit=20' \
              --data-urlencode 'offset=0' || true)"
            echo "QHD endpoint -> ${code} bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
            head -c 1000 /tmp/body | tr '\n' ' '; echo
            code="$(curl -sS --max-time 30 -o /tmp/body -w '%{http_code}' --get "${BASE}/api/school-majors" \
              --data-urlencode 'school=东北大学' \
              --data-urlencode 'schoolIntent=school' \
              --data-urlencode 'candidateScore=560' \
              --data-urlencode 'limit=20' \
              --data-urlencode 'offset=0' || true)"
            echo "NEU endpoint -> ${code} bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
            head -c 500 /tmp/body | tr '\n' ' '; echo
          done
