name: tmp AEK canonical alias repair

on:
  push:
    branches:
      - agent/aiplus-authoritative-education-knowledge
    paths:
      - '.github/workflows/tmp-aek-canonical-alias-fix.yml'

permissions:
  contents: write

jobs:
  repair-and-self-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-authoritative-education-knowledge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical alias and durable ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          center=Path('functions/_lib/ai/education-knowledge-center.js')
          source=center.read_text()
          old="c('special:辽宁省高校专项','辽宁省高校专项计划',['辽宁高校专项','辽宁省专项计划']"
          new="c('special:辽宁省高校专项','辽宁省高校专项计划',['辽宁省高校专项','辽宁高校专项','辽宁省专项计划']"
          if source.count(old)!=1:
              raise SystemExit(f'canonical alias anchor count={source.count(old)}')
          center.write_text(source.replace(old,new,1))

          status=Path('docs/architecture/AIPLUS-AEK-STATUS.md')
          text=status.read_text()
          old_row='| AEK-03 | DONE | Canonical/versioned entity index with aliases, codes/types, provenance and effective metadata; no generated-article truth store |'
          new_row='| AEK-03 | IN_PROGRESS | Canonical/versioned entity index with aliases, codes/types, provenance and effective metadata; no generated-article truth store |'
          if text.count(old_row)!=1:
              raise SystemExit(f'AEK-03 row anchor count={text.count(old_row)}')
          text=text.replace(old_row,new_row,1)
          old_checkpoint='- **AEK-03 remains DONE**: the existing 2026 undergraduate catalog is reused as the 883-major canonical source; the full 2022 graduate directory is versioned locally (184 four-digit entities: 117 first-level disciplines + 67 professional-degree categories); vocational current identity is delegated to the Ministry of Education dynamic catalog instead of copying a stale 1349+ shadow truth source.'
          new_checkpoint='- **AEK-03 is reopened by system-scale QA**: the existing 2026 undergraduate catalog still remains the 883-major canonical source, the full 2022 graduate directory remains versioned locally (184 four-digit entities: 117 first-level disciplines + 67 professional-degree categories), and vocational current identity remains delegated to the Ministry of Education dynamic catalog. The reopened defect is canonical alias completeness for a real human policy label, not a new catalog owner.'
          if text.count(old_checkpoint)!=1:
              raise SystemExit(f'AEK-03 checkpoint anchor count={text.count(old_checkpoint)}')
          text=text.replace(old_checkpoint,new_checkpoint,1)
          anchor='- Root cause is in the singular knowledge-language boundary: it previously required a definition-form question before considering a known education-policy hint. The implementation now treats direct rule/eligibility forms as first-class knowledge questions and strips current/rule question framing before canonical subject resolution. The new deterministic matrix covers年度要求、资格、谁能报、报名截止、报名/申请和现行规定等 classes instead of hard-coding one sentence.\n'
          insert=anchor + '- Formal source QA on head `b34afad0c4dfcb644ffb3c70a59404803a1f5b9c` proved the rule/eligibility entry itself was active, then exposed a separate canonical metadata gap: `辽宁省高校专项谁能报` stripped correctly to `辽宁省高校专项`, but that ordinary label was absent from the `special:辽宁省高校专项` aliases. AEK-03 is therefore reopened. The repair adds the curated natural alias inside the existing canonical concept; it deliberately does **not** introduce a generic “drop 计划/省” heuristic or a second alias table.\n'
          if text.count(anchor)!=1:
              raise SystemExit(f'root-cause anchor count={text.count(anchor)}')
          text=text.replace(anchor,insert,1)
          old_progress='- Repaired the current-rule/eligibility semantic entry in `knowledge-language.js` and expanded first-turn policy journey coverage. The next evidence must come from the normal PR-owned workflow on the current head.'
          new_progress='- Repaired the current-rule/eligibility semantic entry in `knowledge-language.js`, expanded first-turn and remembered-context policy journey coverage, and preserved the >=1/3 multi-turn quality gate. Formal source QA then found the canonical alias gap for `辽宁省高校专项`; the canonical concept now owns that natural alias. The next evidence must come from the normal PR-owned workflow on the resulting head.'
          if text.count(old_progress)!=1:
              raise SystemExit(f'progress anchor count={text.count(old_progress)}')
          text=text.replace(old_progress,new_progress,1)
          old_state='- **AEK-01 and AEK-08 remain IN_PROGRESS until the current normal PR-owned Draft workflow and exact-head Preview prove the combined behavior on one candidate head.** Prior exact Preview proof is evidence, but not a substitute for the final current head.'
          new_state='- **AEK-01, AEK-03 and AEK-08 remain IN_PROGRESS until the current normal PR-owned Draft workflow and exact-head Preview prove the combined behavior on one candidate head.** Prior exact Preview proof is evidence, but not a substitute for the final current head.'
          if text.count(old_state)!=1:
              raise SystemExit(f'open-package anchor count={text.count(old_state)}')
          status.write_text(text.replace(old_state,new_state,1))
          PY
      - name: Verify corrected owner before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/_lib/ai/education-knowledge-center.js
          node --check functions/_lib/ai/knowledge-language.js
          node --check tools/verify-aiplus-aek-journeys-v001.mjs
          node tools/verify-aiplus-aek-v001.mjs
          node tools/verify-aiplus-aek-journeys-v001.mjs
          node tools/verify-aiplus-parent-semantics-v003.mjs
          node tools/verify-aiplus-human-dialog-v3990_2.mjs
          node tools/audit-architecture-handoff-v3990_1.mjs
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-aek-canonical-alias-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/education-knowledge-center.js docs/architecture/AIPLUS-AEK-STATUS.md
          git diff --cached --check
          git commit -m 'AEK-03: add canonical Liaoning special-program alias'
          git push origin HEAD:agent/aiplus-authoritative-education-knowledge
