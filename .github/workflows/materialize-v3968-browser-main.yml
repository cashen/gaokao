name: Materialize v3968 main browser journey

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/v3968-unified-academic-background'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create current journey and compatibility entry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old=Path('tools/browser-resource-execution-v3967.mjs')
          new=Path('tools/browser-resource-execution-v3968.mjs')
          s=old.read_text()
          if "'v3.9.67.0'" not in s: raise SystemExit('release assertion marker missing')
          s=s.replace("'v3.9.67.0'", "'v3.9.68.0'")
          s=s.replace('V3967_BASE_URL', 'V3968_BASE_URL')
          s=s.replace('V3967_ARTIFACT_DIR', 'V3968_ARTIFACT_DIR')
          s=s.replace("'/tmp/v3967-resource-execution-browser'", "'/tmp/v3968-resource-execution-browser'")
          new.write_text(s)
          old.write_text("#!/usr/bin/env node\n// Compatibility entry: the single active journey is v3968.\nimport './browser-resource-execution-v3968.mjs';\n")
          PY
          node --check tools/browser-resource-execution-v3968.mjs
          node --check tools/browser-resource-execution-v3967.mjs
          git diff --check
      - name: Commit current journey
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/browser-resource-execution-v3967.mjs tools/browser-resource-execution-v3968.mjs
          git commit -m 'test: promote main browser journey to v3968'
          git push origin HEAD:${{ github.head_ref }}
