name: One-time v3990 all-bands asset read concurrency retry

on:
  push:
    branches:
      - agent/rank-kernel-v3990_0
    paths:
      - '.github/workflows/zz-one-time-v3990-allbands-asset-read-concurrency-retry.yml'

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rank-kernel-v3990_0
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch bounded all-bands asset reads and audit contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              return text.replace(old, new, 1)

          loader_path = Path('functions/_lib/major-bands-rank-bucket-loader.v3990_0.js')
          loader = loader_path.read_text(encoding='utf-8')
          loader = replace_once(loader, 'const ALL_BANDS_LOAD_CONCURRENCY = 1;', 'const ALL_BANDS_LOAD_CONCURRENCY = 3;', 'all-bands load concurrency')
          loader_path.write_text(loader, encoding='utf-8')

          verifier_path = Path('tools/verify-major-bands-preview-concurrency-v3990_0.mjs')
          verifier = verifier_path.read_text(encoding='utf-8')
          verifier = replace_once(
              verifier,
              "  assert.equal(result.payload?.source?.bucketLoaderVersion, expectedBucketLoaderVersion, `${result.scenario}: bounded bucket loader`);\n  assert.equal(result.payload?.source?.rankRowFilterVersion, expectedRankRowFilterVersion, `${result.scenario}: predecode rank-row filter`);",
              "  assert.equal(result.payload?.source?.bucketLoaderVersion, expectedBucketLoaderVersion, `${result.scenario}: bounded bucket loader`);\n  assert.equal(\n    Number(result.payload?.source?.rankBucketMaxConcurrency),\n    result.allBands ? 3 : 1,\n    `${result.scenario}: bucket asset-read concurrency contract`\n  );\n  assert.ok(\n    Number(result.payload?.source?.rankBucketConcurrency || 0) <= Number(result.payload?.source?.rankBucketMaxConcurrency || 0),\n    `${result.scenario}: bucket asset-read peak exceeded contract`\n  );\n  assert.equal(result.payload?.source?.rankRowFilterVersion, expectedRankRowFilterVersion, `${result.scenario}: predecode rank-row filter`);",
              'preview concurrency contract'
          )
          verifier_path.write_text(verifier, encoding='utf-8')

          audit_path = Path('tools/audit-major-bands-rank-kernel-v3990_0.mjs')
          audit = audit_path.read_text(encoding='utf-8')
          audit = replace_once(audit, "  'const ALL_BANDS_LOAD_CONCURRENCY = 1'", "  'const ALL_BANDS_LOAD_CONCURRENCY = 3'", 'rank audit all-bands gate')
          audit_path.write_text(audit, encoding='utf-8')

          workflow_path = Path('.github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          count = workflow.count('ALL_BANDS_LOAD_CONCURRENCY = 1')
          if count != 2:
              raise SystemExit(f'permanent all-bands gate: expected two anchors, got {count}')
          workflow = workflow.replace('ALL_BANDS_LOAD_CONCURRENCY = 1', 'ALL_BANDS_LOAD_CONCURRENCY = 3')
          workflow = replace_once(
              workflow,
              "          grep -q \"requestedBandRawRowStorage\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs\n          grep -q \"const MAX_LOAD_CONCURRENCY = 1\"",
              "          grep -q \"requestedBandRawRowStorage\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs\n          grep -q \"rankBucketMaxConcurrency\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs\n          grep -q \"result.allBands ? 3 : 1\" tools/verify-major-bands-preview-concurrency-v3990_0.mjs\n          grep -q \"const MAX_LOAD_CONCURRENCY = 1\"",
              'permanent response gate'
          )
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Verify syntax and complete rank contracts
        run: |
          set -euo pipefail
          node --check functions/_lib/major-bands-rank-bucket-loader.v3990_0.js
          node --check tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          node --check tools/audit-major-bands-rank-kernel-v3990_0.mjs
          node tools/audit-major-bands-query-execution-cache-v3990_0.mjs
          node tools/audit-major-bands-request-band-scope-v3990_0.mjs \
            | tee /tmp/v3990-allbands-read-scope.json
          MAJOR_BANDS_RANK_AUDIT_EVIDENCE=/tmp/v3990-allbands-read-rank-audit.json \
            node --experimental-default-type=module tools/audit-major-bands-rank-kernel-v3990_0.mjs

      - name: Verify local Pages mixed pressure
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock wrangler@4.28.1
          npx wrangler pages dev . --port 8794 --compatibility-date=2026-07-01 >/tmp/v3990-allbands-read-wrangler.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 \
              'http://127.0.0.1:8794/api/major-bands?candidateScore=579&rangePreset=standard&limit=16' \
              | grep -q '"rankBucketMaxConcurrency":3'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          TARGET_BASE=http://127.0.0.1:8794 \
          CONCURRENCY_LEVELS=1,5,10,25,50 \
          CONCURRENCY_WAVES=2 \
          MAJOR_BANDS_CONCURRENCY_EVIDENCE=/tmp/v3990-allbands-read-local-pressure.json \
            node tools/verify-major-bands-preview-concurrency-v3990_0.mjs
          kill "$worker_pid" 2>/dev/null || true
          wait "$worker_pid" 2>/dev/null || true
          trap - EXIT

      - name: Commit verified bounded asset-read change
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-time-v3990-allbands-asset-read-concurrency.yml
          rm -f .github/workflows/zz-one-time-v3990-allbands-asset-read-concurrency-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/major-bands-rank-bucket-loader.v3990_0.js \
            tools/verify-major-bands-preview-concurrency-v3990_0.mjs \
            tools/audit-major-bands-rank-kernel-v3990_0.mjs \
            .github/workflows/verify-major-bands-bounded-fanout-v3972_5.yml \
            .github/workflows/zz-one-time-v3990-allbands-asset-read-concurrency.yml \
            .github/workflows/zz-one-time-v3990-allbands-asset-read-concurrency-retry.yml
          git commit -m 'fix(rank): bound all-bands asset read concurrency'
          git push origin HEAD:agent/rank-kernel-v3990_0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3990-allbands-asset-read-concurrency-retry-evidence
          path: |
            /tmp/v3990-allbands-read-scope.json
            /tmp/v3990-allbands-read-rank-audit.json
            /tmp/v3990-allbands-read-local-pressure.json
            /tmp/v3990-allbands-read-wrangler.log
          if-no-files-found: warn
          retention-days: 7
