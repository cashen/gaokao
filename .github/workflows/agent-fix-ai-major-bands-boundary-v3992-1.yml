name: Temporary AI major-bands API boundary v3992_1
on:
  push:
    branches:
      - agent/ai-school-history-background-links-v3992_1
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ai-major-bands-boundary-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-school-history-background-links-v3992_1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore major-bands resource boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/ai/tool-registry.js'); text=p.read_text()
          old="import { onRequest as majorBandsOnRequest } from '../../api/major-bands.js';\n"
          if old not in text: raise SystemExit('major-bands direct import anchor missing')
          text=text.replace(old,'',1)
          old_exec="async function executeMajorBandsOnce(context,params){\n  const response=await majorBandsOnRequest({...context,request:requestForMajorBands(context,params)});let payload=null;try{payload=await response.json();}catch{}\n"
          new_exec="async function executeMajorBandsOnce(context,params){\n  const request=requestForMajorBands(context,params);const response=await fetch(request);let payload=null;try{payload=await response.json();}catch{}\n"
          if old_exec not in text: raise SystemExit('major-bands execute anchor missing')
          p.write_text(text.replace(old_exec,new_exec,1))
          p=Path('tools/verify-ai-workspace-v3990_1.mjs'); text=p.read_text()
          anchor="function testFactsSkillAndUi(){const rank=runRankLookup(600);"
          insert="function testAiMajorBandsResourceBoundary(){const source=read('functions/_lib/ai/tool-registry.js');assert.equal(source.includes(\"onRequest as majorBandsOnRequest\"),false);assert.ok(source.includes('const request=requestForMajorBands(context,params);const response=await fetch(request)'));assert.ok(source.includes(\"new URL('/api/major-bands',sourceUrl.origin)\"));}\n\n"
          if anchor not in text: raise SystemExit('facts test anchor missing')
          text=text.replace(anchor,insert+anchor,1)
          old_calls='await testLockedCommandsSkipProvider();await testModelCanCorrectTaskNotFacts();testPrivacyBudget();testParentHumanJourneysV3992_1();testFactsSkillAndUi();'
          new_calls='await testLockedCommandsSkipProvider();await testModelCanCorrectTaskNotFacts();testPrivacyBudget();testParentHumanJourneysV3992_1();testAiMajorBandsResourceBoundary();testFactsSkillAndUi();'
          if old_calls not in text: raise SystemExit('test call anchor missing')
          p.write_text(text.replace(old_calls,new_calls,1))
          PY
          node --check functions/_lib/ai/tool-registry.js
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Guard scope and commit clean candidate
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$|ln-rank/data/|functions/api/major-bands\.js$)'; then
            echo 'protected path changed' >&2
            exit 1
          fi
          git config user.name 'chatgpt-agent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/agent-fix-ai-major-bands-boundary-v3992-1.yml
          git add functions/_lib/ai/tool-registry.js tools/verify-ai-workspace-v3990_1.mjs
          git commit -m 'v3.9.90.1：恢复 AI 到 major-bands 独立资源边界 v3992_1 [ai-major-bands-boundary-fixed]'
          git push origin HEAD:agent/ai-school-history-background-links-v3992_1
