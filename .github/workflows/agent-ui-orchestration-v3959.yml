name: Agent UI orchestration v3959

on:
  push:
    branches: [agent/ui-orchestration-v3959]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-orchestration-v3959
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic UI integration
        id: patch
        run: |
          set +e
          python3 tools/ui/apply-ui-orchestration-v3959.py > /tmp/v3959-ui.log 2>&1
          status=$?
          cat /tmp/v3959-ui.log
          exit "$status"
      - name: Upload patch diagnostic
        if: failure() && steps.patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: v3959-ui-patch-error
          path: /tmp/v3959-ui.log
          if-no-files-found: error
          retention-days: 1
      - name: Check protected paths
        run: |
          set -euo pipefail
          git diff --name-only origin/main -- | tee /tmp/v3959-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/v3959-files.txt; then
            echo 'Protected path changed'
            exit 1
          fi
      - name: Syntax checks
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ui/apply-ui-orchestration-v3959.py
          for file in \
            shared/ui/ui-registry.js \
            shared/ui/contracts/action-contract.v3959_0.js \
            shared/ui/contracts/state-contract.v3959_0.js \
            shared/ui/contracts/copy-contract.v3959_0.js \
            shared/ui/shell/family-shell.v3959_0.js \
            ln-rank/js/app.v3959_0.js \
            ln-rank/js/selection-pool.v3959_0.js \
            ln-rank/js/self-check.v3959_0.js \
            tools/audit-ui-orchestration-v3959.mjs; do
              node --check "$file"
          done
      - name: Resource ownership regression
        run: node tools/audit-resource-ownership-v3958.mjs
      - name: UI orchestration audit
        run: node tools/audit-ui-orchestration-v3959.mjs
      - name: Existing release contracts
        run: |
          set -euo pipefail
          node tools/check-ln-2026-release.mjs
          python3 tools/ln-2026/verify-final-release-v3.py
          node tools/verify-family-decision-v3955.mjs
          node tools/verify-school-profile-center-v3957.mjs
          node tools/tongxue/verify-direct-result-v156.mjs
          node tools/verify-feishu-report-v3956.mjs
      - name: Commit generated integration
        run: |
          set -euo pipefail
          rm -rf tools/ui/__pycache__ tools/ln-2026/__pycache__
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate v3.9.59.0 resource and UI orchestration [v3959 integrated]'
          git push origin HEAD:agent/ui-orchestration-v3959
