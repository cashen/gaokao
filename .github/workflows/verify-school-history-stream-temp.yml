name: Verify school-history stream boundary temp
on:
  push:
    branches:
      - agent/ai-workspace-request-budget-v3992_3
    paths:
      - .agent/patch-streaming-source-assert-v3992_3.py
      - .github/workflows/verify-school-history-stream-temp.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-workspace-request-budget-v3992_3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update stale formatting assertion
        run: python .agent/patch-streaming-source-assert-v3992_3.py
      - name: Syntax and streaming truth-set verification
        run: |
          node --check functions/_lib/ln-rank-manifest.js
          node --check tools/verify-ai-school-history-bridge-v3992_2.mjs
          node --check tools/verify-ai-workspace-v3990_1.mjs
          node tools/verify-ai-school-history-bridge-v3992_2.mjs
          node tools/verify-ai-workspace-v3990_1.mjs
      - name: Commit permanent verifier update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/verify-ai-workspace-v3990_1.mjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test: align AI streaming source-contract gate"
          git push origin HEAD:agent/ai-workspace-request-budget-v3992_3
