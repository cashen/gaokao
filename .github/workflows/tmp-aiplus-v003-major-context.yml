name: tmp AIPLuS v0.03 major context patch

on:
  push:
    branches: [agent/aiplus-parent-decision-v003]
    paths:
      - '.github/workflows/tmp-aiplus-v003-major-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aiplus-parent-decision-v003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch canonical major mention context owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/_lib/ai/command-interpreter.js')
          s=p.read_text()
          old="const negative=/(不看|不要|不考虑|排除|不接受|别看|去掉|删掉|不是|不选).{0,3}$/.test(before)||/^(不看|不要|不考虑|排除|不接受|别看|去掉|删掉|算了|不要了|不选)/.test(after);out.push({term,index:i,negative});"
          new="const negative=/(不看|不要|不考虑|排除|不接受|别看|去掉|删掉|不是|不选)[^，,。！？!?；;：:\\n]{0,3}$/.test(before)||/^(不看|不要|不考虑|排除|不接受|别看|去掉|删掉|算了|不要了|不选)/.test(after);const irrelevant=['数学','物理','化学','生物','英语'].includes(term)&&/^(?:成绩|基础)?(?:不错|挺好|较好|很好|强|优势|一般|较弱|不好|不太好|弱)/.test(after);out.push({term,index:i,negative,irrelevant});"
          if s.count(old)!=1: raise SystemExit(f'negative owner replacement count={s.count(old)}')
          s=s.replace(old,new)
          oldp="function positiveMajors(text,schoolNames=[],matchedAliases=[]){return unique(majorMentions(text).filter(item=>!item.negative&&!majorMentionOverlapsSchool(text,item,schoolNames,matchedAliases)).map(item=>normalizeMajorTerm(item.term)),8);}"
          newp="function positiveMajors(text,schoolNames=[],matchedAliases=[]){return unique(majorMentions(text).filter(item=>!item.negative&&!item.irrelevant&&!majorMentionOverlapsSchool(text,item,schoolNames,matchedAliases)).map(item=>normalizeMajorTerm(item.term)),8);}"
          oldn="function negativeMajors(text,schoolNames=[],matchedAliases=[]){return unique(majorMentions(text).filter(item=>item.negative&&!majorMentionOverlapsSchool(text,item,schoolNames,matchedAliases)).map(item=>normalizeMajorTerm(item.term)),8);}"
          newn="function negativeMajors(text,schoolNames=[],matchedAliases=[]){return unique(majorMentions(text).filter(item=>item.negative&&!item.irrelevant&&!majorMentionOverlapsSchool(text,item,schoolNames,matchedAliases)).map(item=>normalizeMajorTerm(item.term)),8);}"
          if s.count(oldp)!=1 or s.count(oldn)!=1: raise SystemExit('positive/negative owner replacement mismatch')
          s=s.replace(oldp,newp).replace(oldn,newn)
          p.write_text(s)

          v=Path('tools/verify-aiplus-parent-semantics-v003.mjs')
          t=v.read_text()
          anchor="const student=studentSignalsFromText('孩子数学不错，但是不喜欢编程，不接受倒班，可以出差，动手能力挺好');"
          tests="""const subjectContextCases=[\n  ['孩子数学不错，但不喜欢编程，也不接受倒班，电气和自动化怎么选',['电气','自动化']],\n  ['孩子物理很好，机械和电气怎么选',['机械','电气']],\n  ['孩子化学一般，材料和化工怎么选',['材料','化工']],\n  ['数学和自动化怎么选',['数学','自动化']],\n  ['物理和电气怎么选',['物理','电气']],\n  ['化学和材料怎么选',['化学','材料']]\n];\nfor(const [text,expected] of subjectContextCases){const value=deterministicCommand(text,base,[],[]);assert.deepEqual(value.majorKeywords.slice(0,expected.length),expected,`subject-major context: ${text}`);}\n\n"""
          if t.count(anchor)!=1: raise SystemExit('verifier anchor mismatch')
          t=t.replace(anchor,tests+anchor)
          v.write_text(t)
          PY
          node --check functions/_lib/ai/command-interpreter.js
          node --check tools/verify-aiplus-parent-semantics-v003.mjs
          git diff --check
          git diff -- functions/_lib/ai/command-interpreter.js tools/verify-aiplus-parent-semantics-v003.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/_lib/ai/command-interpreter.js tools/verify-aiplus-parent-semantics-v003.mjs
          git commit -m 'AIPLuS：消除学科能力与专业实体冲突'
          git push origin HEAD:agent/aiplus-parent-decision-v003
