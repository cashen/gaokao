name: Build v3990.2 home countdown release

on:
  push:
    branches:
      - agent/home-countdown-seconds-v3990_2

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize temporary builder source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tmp-home-countdown-v3990_2-builder.mjs')
          s = p.read_text()
          bad = "\x1b[96m\\`距离2027年高考还有\\${days}天\\${hours}小时\\${minutes}分\\${seconds}秒\\`\x1b[0m"
          good = "'距离2027年高考还有' + days + '天' + hours + '小时' + minutes + '分' + seconds + '秒'"
          if bad not in s:
              raise SystemExit('temporary builder ANSI marker not found')
          p.write_text(s.replace(bad, good))
          PY
          node --check tools/tmp-home-countdown-v3990_2-builder.mjs

      - name: Build coherent current generation
        run: node tools/tmp-home-countdown-v3990_2-builder.mjs

      - name: Verify generated source contracts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/tmp-home-countdown-v3990_2-builder.mjs
          test ! -e .github/workflows/tmp-home-countdown-v3990_2-builder.yml
          node --check ln-rank/js/ux/family-home.v3990_2.js
          node --check shared/resources/release/site-runtime-contract.v3990_2.js
          node --check shared/resources/release/runtime-cache-contract.v3990_2.js
          node tools/audit-canonical-release-version-v3990_2.mjs
          node tools/audit-site-runtime-generation-v3990_2.mjs
          node tools/audit-home-release-ownership-v3970.mjs
          if [ -f tools/audit-architecture-handoff-v3990_2.mjs ]; then node tools/audit-architecture-handoff-v3990_2.mjs; fi
          git diff --check
          git diff --name-only HEAD | tee /tmp/home-countdown-files.txt
          if grep -E '^(fenxi/|functions/fenxi/|functions/_middleware\.js$)' /tmp/home-countdown-files.txt; then
            echo 'Protected path touched.' >&2
            exit 1
          fi
          grep -q 'export const LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'export const RELEASE_CONTRACT = LN_RANK_RELEASE_CONTRACT' functions/_lib/release-contract.js
          grep -q 'data-countdown-precision="second"' index.html
          grep -q 'setInterval(renderCountdown, 1000)' ln-rank/js/ux/family-home.v3990_2.js

      - name: Commit generated release tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'v3.9.90.2：首页高考倒计时精确到秒'
          git push origin "HEAD:${GITHUB_REF_NAME}"

# Separate trigger commit: the workflow must pre-exist before this push.
