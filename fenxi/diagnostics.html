<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>V2.9.5.3.fix3 模块诊断</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:24px}.wrap{max-width:980px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 8px 24px rgba(15,23,42,.06)}.ok{color:#047857}.bad{color:#b91c1c}code{background:#f1f5f9;padding:2px 6px;border-radius:6px}.row{display:flex;justify-content:space-between;border-bottom:1px dashed #e2e8f0;padding:8px 0}.row:last-child{border-bottom:0}.small{color:#64748b;font-size:13px}</style>
</head>
<body>
<div class="wrap">
<h1>V2.9.5.3.fix3 模块诊断</h1>
<p class="small">这个页面只检查脚本加载和全局模块是否存在，不执行完整筛选。</p>
<div class="card" id="errors"><b>运行时错误</b><div id="errorList" class="small">等待检测...</div></div>
<div class="card"><b>模块状态</b><div id="moduleList"></div></div>
<div class="card"><b>建议</b><p class="small">如果这里出现红色错误，说明部署或缓存仍有问题。请清缓存、确认上传的是 fix3 包，并检查服务器是否仍引用旧文件。</p></div>
</div>
<script>
window.__DIAG_ERRORS__=[];
window.onerror=function(msg,src,line,col,err){window.__DIAG_ERRORS__.push({msg:String(msg),src:src||'',line:line||0,col:col||0});};
</script>
<script src="./assets/config.v2953fix3.js"></script>
<script src="./assets/rules.v2953fix3.js"></script>
<script src="./assets/major-name-model.v2946.js"></script>
<script src="./assets/confusable-major-model.v29462.js"></script>
<script src="./assets/data-engine.v2953fix3.js"></script>
<script src="./assets/filter-engine.v2953fix3.js"></script>
<script src="./assets/plan-engine.v2953fix3.js"></script>
<script src="./assets/render.v2953fix3.js"></script>
<script src="./assets/selection.v2953fix3.js"></script>
<script src="./assets/export.v2953fix3.js"></script>
<script>
(function(){
  const modules=[
    ['LN_CONFIG',()=>!!window.LN_CONFIG],
    ['LN_GAOKAO_RULES_V2953',()=>!!window.LN_GAOKAO_RULES_V2953],
    ['LN_DATA_ENGINE',()=>!!window.LN_DATA_ENGINE],
    ['LN_FILTER_ENGINE',()=>!!window.LN_FILTER_ENGINE],
    ['LN_PLAN_ENGINE',()=>!!window.LN_PLAN_ENGINE],
    ['LN_RENDER',()=>!!window.LN_RENDER],
    ['LN_SELECTION',()=>!!window.LN_SELECTION],
    ['LN_EXPORT',()=>!!window.LN_EXPORT],
    ['loadMajorNameModelV2944',()=>typeof window.loadMajorNameModelV2944==='function'],
    ['loadConfusableMajorModelV2946',()=>typeof window.loadConfusableMajorModelV2946==='function']
  ];
  const list=document.getElementById('moduleList');
  list.innerHTML=modules.map(([name,fn])=>{let ok=false;try{ok=!!fn();}catch(e){}return `<div class="row"><span><code>${name}</code></span><b class="${ok?'ok':'bad'}">${ok?'通过':'失败'}</b></div>`;}).join('');
  const errs=window.__DIAG_ERRORS__||[];
  document.getElementById('errorList').innerHTML=errs.length?errs.map(e=>`<div class="bad">${e.msg} <span class="small">${e.src}:${e.line}</span></div>`).join(''):'<span class="ok">没有捕获到脚本运行错误。</span>';
})();
</script>
</body>
</html>
