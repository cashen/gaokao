  <meta charset="utf-8" />

<body class="ln-v3 ln-v3-alpha2-fix1 ln-v3-debug-page is-locked" data-ln-version="V3.0.0.alpha2.fix1" data-ln-stamp="v300alpha2fix1-20260512">
  <div id="lnV3AccessGate" class="access-page" aria-live="polite"></div>
  <div id="lnV3Debug" class="v3-debug" hidden>
    <header class="debug-header">
      <div>
        <div class="v3-kicker">V3 Debug · 分步向导诊断</div>
        <h1>辽宁物理类工具 V3 诊断页</h1>
        <p>用于检查访问码、Tab、Step、状态中心、孩子专业偏好和基础性能记录。</p>
      </div>
      <a class="debug-link" href="/fenxi/v3/">返回 V3 工具</a>
    </header>
    <main class="debug-grid">
      <section class="debug-card">
        <h2>版本与入口状态</h2>
        <div id="debugVersionBox" class="debug-kv"></div>
      </section>
      <section class="debug-card">
        <h2>Tab / Step 状态</h2>
        <div id="debugTabBox" class="debug-kv"></div>
      </section>
      <section class="debug-card debug-wide">
        <h2>Store 快照</h2>
        <pre id="debugStoreBox" class="debug-pre"></pre>
      </section>
      <section class="debug-card debug-wide">
        <h2>自测</h2>
        <div class="debug-actions">
          <button type="button" data-debug-run="quick">快速体检</button>
          <button type="button" data-debug-run="rank">Step1 位次加载自测</button>
          <button type="button" data-debug-run="child">Step3 专业偏好自测</button>
          <button type="button" data-debug-run="full">完整骨架自测</button>
          <button type="button" data-debug-copy>复制报告</button>
        </div>
        <pre id="debugSelftestBox" class="debug-pre debug-report-box">尚未运行自测。</pre>
      </section>
    </main>
  </div>

  <script defer src="/fenxi/v3/assets/js/version.v3.js"></script>
