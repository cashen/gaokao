<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>辽宁物理类工具 Debug Report｜V2.9.8.3.fix9</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f8fafc;color:#0f172a;margin:0;padding:18px}main{max-width:980px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 8px 22px rgba(15,23,42,.05)}button{border:0;border-radius:10px;background:#0f172a;color:#fff;padding:9px 12px;margin-right:8px}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:12px;line-height:1.55;max-height:70vh;overflow:auto}.muted{color:#64748b;font-size:13px}code{background:#f1f5f9;padding:2px 5px;border-radius:6px}</style></head><body><main><h1>辽宁物理类工具 Debug Report｜V2.9.8.3.fix9</h1><p class="muted">先在主页面复现问题，再刷新本页，点击“复制诊断报告”发给我。这里不显示密码、Cookie 或 Secret。</p><div class="card"><button id="copyBtn">复制诊断报告</button><button id="copyDeepBtn">复制深度报告</button><button id="refreshBtn">刷新报告</button><a href="./index.html">返回工具</a></div><div class="card"><pre id="report">正在读取 localStorage...</pre></div></main><script>function build(){let raw=localStorage.getItem('ln_v2983_debug_report');let obj={};try{obj=raw?JSON.parse(raw):{};}catch(e){obj={parseError:String(e),raw};}const lines=[];lines.push('【辽宁物理类工具 Debug Report】');lines.push('读取时间：'+new Date().toLocaleString());lines.push('版本：'+(obj.version||''));lines.push('版本戳：'+(obj.stamp||''));if(obj.runtime){lines.push('URL：'+(obj.runtime.url||''));lines.push('body.className：'+(obj.runtime.bodyClass||''));lines.push('JS文件数：'+(obj.runtime.jsFiles||0)+'；失败：'+((obj.runtime.failedFiles||[]).join(',')||'无'));lines.push('抽屉：open='+obj.runtime.drawerOpen+' mask='+obj.runtime.maskVisible+' bodyLock='+obj.runtime.bodyLock+' scrollY='+obj.runtime.scrollY);}lines.push('候选池：'+JSON.stringify(obj.pools||{}));lines.push('当前上下文：'+JSON.stringify(obj.context||{}));lines.push('标记：'+JSON.stringify(obj.flags||{}));lines.push('旧逻辑：'+JSON.stringify(obj.legacy||{}));lines.push('队列：'+JSON.stringify(obj.queue||{}));if(obj.runtime&&obj.runtime.device)lines.push('设备：'+JSON.stringify(obj.runtime.device));if(obj.runtime&&obj.runtime.resources)lines.push('资源：'+JSON.stringify(obj.runtime.resources));if(obj.details){lines.push('深度细分：');Object.keys(obj.details).forEach(k=>lines.push(' - '+k+'：'+JSON.stringify(obj.details[k])));}lines.push('最近耗时：');Object.keys(obj.timings||{}).forEach(k=>lines.push(' - '+k+'：'+obj.timings[k].ms+'ms '+(obj.timings[k].extra?JSON.stringify(obj.timings[k].extra):'')));lines.push('最近操作：');(obj.actions||[]).slice(-25).forEach(a=>lines.push(' - ['+a.t+'] '+a.action+(a.data?' '+JSON.stringify(a.data):'')));if((obj.errors||[]).length){lines.push('错误：');obj.errors.slice(-10).forEach(e=>lines.push(' - '+e.message+' @ '+(e.source||'')+':'+(e.lineno||'')));}if((obj.longTasks||[]).length){lines.push('长任务：');obj.longTasks.slice(-10).forEach(e=>lines.push(' - '+e.duration+'ms @ '+e.t));}return lines.join('\n');}function render(){document.getElementById('report').textContent=build();}document.getElementById('copyBtn').onclick=async()=>{const txt=build();await navigator.clipboard.writeText(txt).catch(()=>{});document.getElementById('copyBtn').textContent='已复制';setTimeout(()=>document.getElementById('copyBtn').textContent='复制诊断报告',1200)};document.getElementById('copyDeepBtn').onclick=async()=>{const txt=build();await navigator.clipboard.writeText(txt).catch(()=>{});document.getElementById('copyDeepBtn').textContent='深度报告已复制';setTimeout(()=>document.getElementById('copyDeepBtn').textContent='复制深度报告',1200)};document.getElementById('refreshBtn').onclick=render;render();</script></body></html>
