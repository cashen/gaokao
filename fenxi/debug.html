<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>辽宁物理类工具｜V2.92RC2.5.audit-human-scenario-runner 一键 Debug</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--card:#fff;--bg:#f8fafc;--ok:#059669;--warn:#d97706;--fail:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:18px;line-height:1.55}main{max-width:1180px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 12px 30px rgba(15,23,42,.06)}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:0;border-radius:12px;background:var(--ink);color:#fff;padding:10px 14px;cursor:pointer;font-weight:700}button.secondary{background:#334155}button.ghost{background:#e2e8f0;color:#0f172a}a{color:var(--blue);text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#f8fafc}.metric b{display:block;font-size:22px}.ok{color:var(--ok)}.warn{color:var(--warn)}.fail{color:var(--fail)}pre{white-space:pre-wrap;word-break:break-word;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:14px;line-height:1.5;max-height:68vh;overflow:auto}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;margin:2px;border:1px solid var(--line);font-size:12px}.pill.ok{background:#ecfdf5;border-color:#a7f3d0}.pill.warn{background:#fff7ed;border-color:#fed7aa}.pill.fail{background:#fef2f2;border-color:#fecaca}.small{font-size:12px}.hide{display:none}.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--blue);transition:width .25s}</style>
</head>
<body>
<main>
  <h1>辽宁物理类高考志愿工具｜V2.92RC2.5.audit-human-scenario-runner 一键 Debug</h1>
  <p class="muted">这个页面用于工程闭环与 ABC 策略审计：检查资源、加载链、最终函数来源、pendingdel、wrapper 收口，并分批模拟真实家庭场景审计 A/B/C：核心 12 例用于快速反馈，完整 36 例用于全量审计。不会读取密码、Cookie 或 Secret。</p>
  <div class="card">
    <h2>一键测试</h2>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <p id="status" class="muted">建议先点“运行核心审计”，完成后复制日志；完整审计会更慢，但会覆盖全部场景。</p>
    <div class="btns">
      <button id="runCoreBtn">运行核心审计（12例）</button>
      <button id="runFullBtn" class="secondary">运行完整审计（36例）</button>
      <button id="copyBtn" class="secondary">复制日志</button>
      <button id="downloadBtn" class="ghost">下载 JSON</button>
      <a href="./index.html">返回工具</a>
    </div>
  </div>
  <div class="card">
    <h2>摘要</h2>
    <div class="grid" id="summaryGrid"></div>
  </div>
  <div class="card">
    <h2>完整日志</h2>
    <pre id="report">尚未运行。</pre>
  </div>
</main>
<script>
(function(){
'use strict';
const VERSION='V2.92RC2.5.audit-human-scenario-runner.debug-oneclick';
let LAST_REPORT=null;
const $=id=>document.getElementById(id);
function setStatus(t,p){$('status').textContent=t; if(typeof p==='number')$('bar').style.width=Math.max(0,Math.min(100,p))+'%';}
function now(){return new Date().toISOString();}
async function fetchText(url){const r=await fetch(url,{cache:'no-store'});return {ok:r.ok,status:r.status,url,size:Number(r.headers.get('content-length')||0)||null,text:r.ok?await r.text():''};}
async function fetchJSON(url){const r=await fetch(url,{cache:'no-store'});let data=null,err=null;try{data=await r.json();}catch(e){err=String(e);}return {ok:r.ok,status:r.status,url,data,error:err};}
async function fetchFirstJSON(urls){
  const tries=[];
  for(const url of urls){
    const r=await fetchJSON(url);
    tries.push({url,status:r.status,ok:r.ok,error:r.error||null});
    if(r.ok&&r.data)return Object.assign(r,{tries});
  }
  return {ok:false,status:0,url:urls[0],data:null,error:'all fallback manifest urls failed',tries};
}
function uniq(a){return [...new Set((a||[]).filter(Boolean))];}
function hashText(s){s=String(s||'');let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0;}return h.toString(16);}
function parseArrayConst(src,name){const re=new RegExp('const\\s+'+name+'\\s*=\\s*(\\[[\\s\\S]*?\\]);');const m=src.match(re);if(!m)return null;try{return JSON.parse(m[1]);}catch(e){return {error:String(e),raw:m[1].slice(0,500)}}}
function applyUiBundles(list,groups){const out=[];let i=0;while(i<list.length){let matched=false;for(const g of groups||[]){const seq=g.files||[];if(seq.length&&list.slice(i,i+seq.length).join('\n')===seq.join('\n')){out.push(g.bundle);i+=seq.length;matched=true;break;}}if(!matched){out.push(list[i]);i++;}}return out;}
function classifyStatus(items){const fail=items.filter(x=>x.status==='FAIL').length;const warn=items.filter(x=>x.status==='WARN').length;return fail?'FAIL':warn?'WARN':'PASS';}
async function assetCheck(files){const out=[];for(const f of files){try{const r=await fetch(f+'?debug='+Date.now(),{cache:'no-store'});out.push({file:f,status:r.ok?'PASS':'FAIL',http:r.status,size:Number(r.headers.get('content-length')||0)||null});}catch(e){out.push({file:f,status:'FAIL',error:String(e)});} }return out;}
async function runIframeAudit(activeFiles,auditMode){
  return new Promise(resolve=>{
    const frame=document.createElement('iframe');
    frame.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;opacity:0;pointer-events:none';
    const started=performance.now();let done=false;let loadSeen=false;
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    function bootCount(w){try{return Array.isArray(w.__LN_BOOT_LOADS__)?w.__LN_BOOT_LOADS__.length:0;}catch(e){return 0;}}
    function runtimeReady(w){
      try{
        const boot=bootCount(w);
        const hasCore=!!w.LN_COMPUTE_PIPELINE_V2983?.applyFilters;
        const hasClosure=typeof w.renderPlanABC==='function' && typeof w.planScoreV29475==='function';
        const hasAudit=!!w.LN_ABC_POLICY_AUDIT_V292RC2?.runAll;
        // activeFiles 为 index 的理论正式链；如果动态脚本仍在加载，至少等核心、closure、audit 全到位。
        return hasCore && hasClosure && hasAudit && (boot>=Math.min(activeFiles.length,60));
      }catch(e){return false;}
    }
    async function waitUntilRuntimeReady(){
      const maxMs=90000;
      while(!done && performance.now()-started<maxMs){
        const w=frame.contentWindow;
        if(w && runtimeReady(w)){
          // 给 rules-closure4、frontend-trust、interact 补丁和 refresh-controller owner guard 留最后收口时间。
          await sleep(6500);
          return 'runtime-ready';
        }
        await sleep(450);
      }
      return 'runtime-wait-timeout';
    }
    async function finish(reason){
      if(done)return;done=true;
      let audit={reason,durationMs:Math.round(performance.now()-started),status:'WARN'};
      try{
        const w=frame.contentWindow;
        try{w.LN_REFRESH_CONTROLLER_V292RC?.finalize?.('debug-before-report');}catch(e){}
        await sleep(700);
        const boot=Array.isArray(w.__LN_BOOT_LOADS__)?w.__LN_BOOT_LOADS__:[];
        const reg=w.LN_RUNTIME_REGISTRY_V292RC?.getReport?.()||null;
        const runtime=w.LN_STATE_ADAPTER_V292RC?.readRuntime?.()||null;
        const wrappers=[];
        let fn=w.applyFilters,depth=0;
        while(typeof fn==='function'&&depth<12){wrappers.push({depth,name:fn.name||'(anonymous)',flags:{v2983:!!fn.__v2983Wrapped,interact:!!fn.__v29rcInteractMarked,dedupe:!!fn.__v29rcInteractDedupeWrapped,lnRefreshManaged:!!fn.__lnRefreshManaged,original:!!fn.__original},hash:hashText(Function.prototype.toString.call(fn).slice(0,1800)),coreHash:fn.__lnRefreshCoreHash||'',capturedWrapperDepth:fn.__lnCapturedWrapperDepth||0});if(!fn.__original)break;fn=fn.__original;depth++;}
        const refreshController=w.LN_REFRESH_CONTROLLER_V292RC?.getStats?.()||null;
        const bootIncomplete=boot.length<Math.min(activeFiles.length,60);
        audit={
          reason,durationMs:Math.round(performance.now()-started),status:boot.some(x=>!x.ok)?'FAIL':(bootIncomplete?'WARN':'PASS'),
          url:w.location.href,loadSeen,
          toolVersion:w.__LN_TOOL_VERSION||w.LN_TOOL_VERSION||'',cleanupVersion:w.LN_ENGINE_CLEANUP_VERSION||'',
          boot:{total:boot.length,failed:boot.filter(x=>!x.ok),files:boot.map(x=>x.file),activeExpected:activeFiles.length,incomplete:bootIncomplete},
          functions:{applyFilters:typeof w.applyFilters,renderPlanABC:typeof w.renderPlanABC,planScoreV29475:typeof w.planScoreV29475,detailCard:typeof w.LN_DETAIL_CARD_UI_V2981,abcAudit:typeof w.LN_ABC_POLICY_AUDIT_V292RC2},
          wrappers:{applyFiltersDepth:wrappers.length,managed:!!w.applyFilters?.__lnRefreshManaged,capturedDepth:Number(w.applyFilters?.__lnCapturedWrapperDepth||0),chain:wrappers},
          refreshController,
          registry:reg,
          runtime,
          data:{DATA:Array.isArray(w.DATA)?w.DATA.length:null,filtered:Array.isArray(w.filtered)?w.filtered.length:null,currentRank:w.currentRank||null},
          debugReportPresent:!!localStorage.getItem('ln_v2983_debug_report')
        };
        if(w.LN_ABC_POLICY_AUDIT_V292RC2&&typeof w.LN_ABC_POLICY_AUDIT_V292RC2.runAll==='function'){
          const mode=auditMode||'core';
          const totalTimeout=mode==='full'?480000:220000;
          const runPromise=w.LN_ABC_POLICY_AUDIT_V292RC2.runAll({mode:mode,perCaseTimeoutMs:mode==='full'?12000:10000,dataTimeoutMs:4200,computeTimeoutMs:2200,bucketTimeoutMs:1200,betweenCaseMs:60,progress:function(i,total,c,res){try{window.parent&&window.parent.postMessage({kind:'abc-audit-progress',i:i,total:total,id:c&&c.id,status:res&&res.humanAudit&&res.humanAudit.status},'*');}catch(e){}}});
          audit.abcHumanAudit=await Promise.race([
            runPromise,
            new Promise(function(resolve){setTimeout(function(){
              let partial=null;
              try{partial=w.__LN_ABC_POLICY_AUDIT_LAST__||w.LN_ABC_POLICY_AUDIT_V292RC2.lastReport?.();}catch(e){}
              if(partial&&partial.expectedTotal){
                partial=Object.assign({},partial,{status:partial.caseTotal?'WARN':'FAIL',partial:true,error:'ABC human audit total timeout；已返回已完成 case，不再清零。',totalTimeoutMs:totalTimeout});
                resolve(partial);
              }else{
                resolve({status:'FAIL',partial:true,error:'ABC human audit total timeout before first case finished',mode:mode,counts:{TIMEOUT:1},caseTotal:0,expectedTotal:mode==='full'?36:12,results:[]});
              }
            },totalTimeout);})
          ]);
          if(!audit.abcHumanAudit){audit.abcHumanAudit={status:'FAIL',error:'ABC human audit empty result',counts:{FAIL:1},caseTotal:0,results:[]};}
        }else{
          audit.abcHumanAudit={status:'FAIL',error:'LN_ABC_POLICY_AUDIT_V292RC2 not loaded',counts:{FAIL:1},caseTotal:0,results:[]};
        }
      }catch(e){audit.status='FAIL';audit.error=String(e&&e.message||e);audit.stack=e&&e.stack?String(e.stack).slice(0,1200):'';} 
      try{frame.remove();}catch(e){}
      resolve(audit);
    }
    frame.onload=()=>{loadSeen=true;};
    frame.src='./index.html?debug_iframe=1&ts='+Date.now();
    document.body.appendChild(frame);
    (async()=>{const why=await waitUntilRuntimeReady(); await finish(why);})();
  });
}

async function run(auditMode){
  auditMode=auditMode||'core';
  const report={kind:'LN Fenxi V2.92RC2.5 Audit Human Scenario Runner One Click Debug Report',version:VERSION,generatedAt:now(),url:location.href,userAgent:navigator.userAgent,checks:[]};
  try{
    setStatus('读取 index.html 与引用链...',8);
    const idx=await fetchText('./index.html');report.index={http:idx.status,size:idx.text.length,hash:hashText(idx.text),status:idx.ok?'PASS':'FAIL'};
    const bundled=parseArrayConst(idx.text,'filesRulesBundled');const groups=parseArrayConst(idx.text,'uiBundleGroups');
    const active=Array.isArray(bundled)&&Array.isArray(groups)?applyUiBundles(bundled,groups):[];
    report.loader={bundledCount:Array.isArray(bundled)?bundled.length:null,uiBundleGroups:Array.isArray(groups)?groups.length:null,activeCount:active.length,activeFiles:active,status:active.length?'PASS':'FAIL'};
    setStatus('检查核心资源文件...',22);
    const css=[...idx.text.matchAll(/href="\.\/([^"?]+\.css)/g)].map(m=>m[1]);
    const extra=['assets/config.v297fix2.js','assets/ln-reference-map.v292rc.js','assets/ln-runtime-registry.v292rc.js','assets/ln-state-adapter.v292rc.js','assets/ln-refresh-controller.v292rc.js','assets/ln-debug-baseline.v292rc.js','assets/ln-abc-policy-audit.v292rc2.js'];
    const assetFiles=uniq([...active,...css,...extra]);
    report.assetChecks=await assetCheck(assetFiles);
    report.assetSummary={total:report.assetChecks.length,PASS:report.assetChecks.filter(x=>x.status==='PASS').length,FAIL:report.assetChecks.filter(x=>x.status==='FAIL').length};
    setStatus('检查数据 manifest 与 chunks...',40);
    const manifest=await fetchFirstJSON(['./data/manifest.json','/fenxi/data/manifest.json','data/manifest.json']);
    report.dataManifestTries=manifest.tries||[];
    report.dataSummary={status:manifest.ok?'PASS':'FAIL',manifestVersion:manifest.data?.version,totalRecords:manifest.data?.totalRecords,chunks:manifest.data?.chunks?.length||0,chunkRecords:(manifest.data?.chunks||[]).reduce((s,c)=>s+(Number(c.recordCount)||0),0),manifestError:manifest.error||null};
    const chunkFiles=(manifest.data?.chunks||[]).map(c=>c.file).slice(0,20);
    report.chunkChecks=await assetCheck(chunkFiles);
    setStatus('读取 pendingdel 隔离清单...',55);
    const pd=await fetchJSON('./pendingdel/2026-v292-engine-cleanup/manifest.pendingdel.v292rc.json');
    report.pendingdel={status:pd.ok?'PASS':'WARN',version:pd.data?.version,movedCount:pd.data?.movedCount,categories:pd.data?.items?pd.data.items.reduce((a,x)=>{a[x.category]=(a[x.category]||0)+1;return a;},{}):null,manifestError:pd.error||null};
    setStatus('运行 iframe 实际加载链审计与 ABC 人类场景审计（'+auditMode+'）...',72);
    report.auditMode=auditMode;
    report.runtimeAudit=await runIframeAudit(active,auditMode);
    report.abcHumanAudit=report.runtimeAudit.abcHumanAudit||null;
    setStatus('生成结论...',92);
    const failures=[];const warnings=[];
    if(report.assetSummary.FAIL)failures.push('存在资源 404 或加载失败');
    if(report.dataSummary.status!=='PASS')failures.push('manifest 加载失败');
    if((report.chunkChecks||[]).some(x=>x.status==='FAIL'))failures.push('chunk 文件检查失败');
    if(report.runtimeAudit.status==='FAIL')failures.push('iframe 运行时加载失败');
    if(report.runtimeAudit.wrappers?.managed){
      // 已由 refresh-controller 后置接管，历史 capturedDepth 仅作为保真审计信息，不再判 WARN。
    }else{
      warnings.push('refresh-controller 没有保持 applyFilters 最终所有权，可能被后续脚本重新包装。');
      if(report.runtimeAudit.wrappers?.applyFiltersDepth>=4)warnings.push('applyFilters wrapper 层数较多：这是原始版本 SP 补丁链的主要工程风险，建议后续统一到 refresh-controller。');
    }
    if(!report.pendingdel.movedCount)warnings.push('pendingdel 本轮未记录移动文件或清单不可读');
    if(report.abcHumanAudit){
      const c=report.abcHumanAudit.counts||{};
      if(!report.abcHumanAudit.caseTotal)failures.push('ABC 人类场景审计没有跑出任何 case，不能作为策略依据。');
      if(report.abcHumanAudit.status==='FAIL'||c.FAIL)warnings.push('ABC 人类场景审计存在 FAIL：'+(c.FAIL||0)+' 个，请把日志发给我分析。');
      if(c.TIMEOUT)warnings.push('ABC 人类场景审计存在 TIMEOUT：'+c.TIMEOUT+' 个，已跳过并继续其他场景。');
      if(c.WARN)warnings.push('ABC 人类场景审计存在 WARN：'+c.WARN+' 个，用于判断策略是否过稳/过冲/兴趣失效。');
    }else{failures.push('ABC 人类场景审计结果缺失。');}
    report.conclusion={status:failures.length?'FAIL':warnings.length?'WARN':'PASS',failures,warnings};
    report.checks=[
      {name:'index',status:report.index.status},
      {name:'assets',status:report.assetSummary.FAIL?'FAIL':'PASS'},
      {name:'data',status:report.dataSummary.status},
      {name:'chunks',status:(report.chunkChecks||[]).some(x=>x.status==='FAIL')?'FAIL':'PASS'},
      {name:'pendingdel-manifest',status:report.pendingdel.status},
      {name:'runtime-iframe',status:report.runtimeAudit.status},
      {name:'wrapper-depth',status:report.runtimeAudit.wrappers?.managed?'PASS':'WARN'},
      {name:'abc-human-audit',status:(!report.abcHumanAudit||!report.abcHumanAudit.caseTotal)?'FAIL':(report.abcHumanAudit.counts?.FAIL||report.abcHumanAudit.counts?.TIMEOUT)?'WARN':'PASS'}
    ];
  }catch(e){report.conclusion={status:'FAIL',failures:[String(e)],warnings:[]};report.error=String(e);}
  LAST_REPORT=report;
  renderReport(report);
  setStatus('完成：'+(report.conclusion?.status||'UNKNOWN')+'。请复制日志发给我。',100);
}
function renderReport(r){
  $('report').textContent=JSON.stringify(r,null,2);
  const checks=r.checks||[]; const summary=r.conclusion||{};
  const grid=$('summaryGrid');grid.innerHTML='';
  const metrics=[
    ['总体',summary.status||'-'],['资源失败',String(r.assetSummary?.FAIL??'-')],['数据记录',String(r.dataSummary?.totalRecords??'-')],['chunks',String(r.dataSummary?.chunks??'-')],['pendingdel',String(r.pendingdel?.movedCount??'-')],['applyFilters层',String(r.runtimeAudit?.wrappers?.applyFiltersDepth??'-')+(r.runtimeAudit?.wrappers?.managed?' / managed':'' )],['历史捕获层',String(r.runtimeAudit?.wrappers?.capturedDepth??'-')],['运行时',r.runtimeAudit?.status||'-'],['ABC模式',r.auditMode||'-'],['ABC审计',r.abcHumanAudit?('P'+(r.abcHumanAudit.counts?.PASS||0)+' W'+(r.abcHumanAudit.counts?.WARN||0)+' F'+(r.abcHumanAudit.counts?.FAIL||0)+' T'+(r.abcHumanAudit.counts?.TIMEOUT||0)+' / '+(r.abcHumanAudit.caseTotal||0)):'-'],['检查项',checks.map(c=>c.status).join('/')||'-']
  ];
  metrics.forEach(([k,v])=>{const cls=/FAIL/.test(v)?'fail':/WARN/.test(v)?'warn':/PASS/.test(v)?'ok':'';const div=document.createElement('div');div.className='metric';div.innerHTML='<span class="muted">'+k+'</span><b class="'+cls+'">'+v+'</b>';grid.appendChild(div);});
}
async function copy(){const txt=LAST_REPORT?JSON.stringify(LAST_REPORT,null,2):$('report').textContent;await navigator.clipboard.writeText(txt).catch(()=>{});$('copyBtn').textContent='已复制';setTimeout(()=>$('copyBtn').textContent='复制日志',1400)}
function download(){const txt=LAST_REPORT?JSON.stringify(LAST_REPORT,null,2):$('report').textContent;const blob=new Blob([txt],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fenxi-v292rc24-audit-data-safe-runner-debug-'+Date.now()+'.json';a.click();URL.revokeObjectURL(a.href)}
$('runCoreBtn').onclick=function(){run('core')};$('runFullBtn').onclick=function(){run('full')};$('copyBtn').onclick=copy;$('downloadBtn').onclick=download;
})();
</script>
</body>
</html>
