<script>
function build(){
  let raw=localStorage.getItem('ln_v2983_debug_report');let obj={};
  try{obj=raw?JSON.parse(raw):{};}catch(e){obj={parseError:String(e),raw};}
  const lines=[];
  lines.push('【辽宁物理类工具 Debug Report】');
  lines.push('读取时间：'+new Date().toLocaleString());
  lines.push('版本：'+(obj.version||''));
  lines.push('版本戳：'+(obj.stamp||''));
  if(obj.runtime){
    lines.push('URL：'+(obj.runtime.url||''));
    lines.push('body.className：'+(obj.runtime.bodyClass||''));
    lines.push('JS文件数：'+(obj.runtime.jsFiles||0)+'；失败：'+((obj.runtime.failedFiles||[]).join(',')||'无'));
    lines.push('抽屉：open='+obj.runtime.drawerOpen+' mask='+obj.runtime.maskVisible+' bodyLock='+obj.runtime.bodyLock+' scrollY='+obj.runtime.scrollY);
  }
  lines.push('候选池：'+JSON.stringify(obj.pools||{}));
  lines.push('当前上下文：'+JSON.stringify(obj.context||{}));
  lines.push('标记：'+JSON.stringify(obj.flags||{}));
  lines.push('旧逻辑：'+JSON.stringify(obj.legacy||{}));
  lines.push('队列：'+JSON.stringify(obj.queue||{}));
  if(obj.runtime&&obj.runtime.device)lines.push('设备：'+JSON.stringify(obj.runtime.device));
  if(obj.runtime&&obj.runtime.resources)lines.push('资源：'+JSON.stringify(obj.runtime.resources));
  if(obj.details){lines.push('深度细分：');Object.keys(obj.details).forEach(k=>lines.push(' - '+k+'：'+JSON.stringify(obj.details[k])));}
  lines.push('最近耗时：');Object.keys(obj.timings||{}).forEach(k=>lines.push(' - '+k+'：'+obj.timings[k].ms+'ms '+(obj.timings[k].extra?JSON.stringify(obj.timings[k].extra):'')));
  lines.push('最近操作：');(obj.actions||[]).slice(-25).forEach(a=>lines.push(' - ['+a.t+'] '+a.action+(a.data?' '+JSON.stringify(a.data):'')));
  if((obj.errors||[]).length){lines.push('错误：');obj.errors.slice(-10).forEach(e=>lines.push(' - '+e.message+' @ '+(e.source||'')+':'+(e.lineno||'')));}
  if((obj.longTasks||[]).length){lines.push('长任务：');obj.longTasks.slice(-10).forEach(e=>lines.push(' - '+e.duration+'ms @ '+e.t));}
  const stRaw=localStorage.getItem('ln_v2983_selftest_report');
  if(stRaw){try{const st=JSON.parse(stRaw);lines.push('自测摘要：'+JSON.stringify(st.summary||{}));if(st.coverage)lines.push('自测覆盖：'+JSON.stringify(st.coverage));}catch(e){}}
  return lines.join('
');
}
function render(){document.getElementById('report').textContent=build();try{window.LN_DEBUG_SELFTEST_V2983FIX10?.render?.();}catch(e){}}
document.getElementById('copyBtn').onclick=async()=>{const txt=build();await navigator.clipboard.writeText(txt).catch(()=>{});document.getElementById('copyBtn').textContent='已复制';setTimeout(()=>document.getElementById('copyBtn').textContent='复制诊断报告',1200)};
document.getElementById('copyDeepBtn').onclick=async()=>{const txt=build();await navigator.clipboard.writeText(txt).catch(()=>{});document.getElementById('copyDeepBtn').textContent='深度报告已复制';setTimeout(()=>document.getElementById('copyDeepBtn').textContent='复制深度报告',1200)};
document.getElementById('refreshBtn').onclick=render;
render();
</script>

    if((r.warnings||[]).length){lines.push('警告摘要：');r.warnings.forEach(f=>lines.push(' - '+f.name+': '+(f.note||'')));}
    el.textContent=lines.join('\n');}
  function addUi(){
    const card=q('#selfTestCard'); if(card)return;
    const div=document.createElement('div');div.className='card';div.id='selfTestCard';
    div.innerHTML='<h2 style="margin:0 0 8px">一键联动自测</h2><p class="muted">用于自动模拟位次、家庭底线、画像、兴趣、只看真实命中、场景、A/B/C、翻页、抽屉等链路。会自动使用测试凭证进入沙盒工具页，不需要先手动进入工具。</p><button id="runSmokeSelfTest">快速体检</button><button id="runDeepSelfTest">深度矩阵自测</button><button id="copySelfTest">复制自测报告</button><span id="selfTestStatus" class="muted">尚未运行</span><pre id="selfReport" style="margin-top:12px;max-height:48vh">尚未运行自测。</pre>';

  }
  function fire(win,el,type='change'){if(!el)return;el.dispatchEvent(new win.Event(type,{bubbles:true,cancelable:true}));}
  function click(win,el){if(!el)return false;el.dispatchEvent(new win.MouseEvent('click',{bubbles:true,cancelable:true,view:win}));return true;}

  function setProvinceMode(win,mode,group){setSelect(win,'regionMode',mode); if(typeof win.clearProvinces==='function')win.clearProvinces(); if(group&&typeof win.selectRegionGroup==='function')win.selectRegionGroup(group,true); fire(win,win.document.getElementById('regionMode'),'change');}
  async function waitFor(cond,timeout=12000,label='条件'){const start=now();while(now()-start<timeout){try{if(cond())return true;}catch(e){}await sleep(80);}throw new Error('等待超时：'+label);}
  async function autoLoginFromDebug(){
    const out={ok:false,via:'debug-fetch',status:0};
    try{localStorage.setItem('ln_access_ok','1');}catch(e){}
    try{
      const res=await fetch('./api/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:ACCESS_CODE})});

    return out;
  }

    const input=win.document.getElementById('accessCodeTop');
    if(input){input.value=ACCESS_CODE;fire(win,input,'input');fire(win,input,'change');}
    try{
      if(typeof win.unlockAccess==='function'){
        const r=win.unlockAccess();
        if(r&&typeof r.then==='function') await r;
      }else{
        click(win,win.document.querySelector('[data-action="unlock-top"]'));
      }
    }catch(e){}
    const start=now();
    while(now()-start<10000){
      if(app()&&!app().classList.contains('locked')) return {ok:true,via:'frame-unlock'};
      await sleep(120);
    }
    return {ok:false,via:'frame-unlock-timeout'};
  }
  async function waitBoot(win){
    await waitFor(()=>win.document&&win.document.readyState!=='loading',15000,'iframe document ready');
    await waitFor(()=>!!(win.LN_DEBUG_V2983&&win.LN_APP_V2983&&win.LN_COMPUTE_PIPELINE_V2983),18000,'核心脚本就绪');

  async function waitComputeQuiet(win,minWait=220){await sleep(minWait);const start=now();while(now()-start<6000){const q=win.LN_DEBUG_V2983?.state?.queue||{};if(!q.running&&!q.pending)break;await sleep(100);}await sleep(120);}
  function debugSnap(win){try{return win.LN_DEBUG_V2983?.report?.()||{};}catch(e){return {snapError:String(e)};}}

  async function runStep(ctx,name,fn,opts={}){const t=now();const item={name,status:'pass',ms:0,asserts:[]};try{const res=await fn(); if(res){if(res.note)item.note=res.note;if(res.asserts)item.asserts=res.asserts;if(res.warn){item.status='warn';item.note=res.warn;}} if(hasFail(item.asserts)){item.status=opts.warnOnly?'warn':'fail';}}catch(e){item.status=opts.warnOnly?'warn':'fail';item.err=String(e&&e.message||e);}finally{item.ms=Math.round(now()-t);ctx.steps.push(item);if(item.status==='fail')ctx.failures.push(item);if(item.status==='warn')ctx.warnings.push(item);setStatus('自测中：'+ctx.steps.length+' 步，最近：'+name+'（'+item.status+'）');writeStored(makeReport(ctx));renderSelfReport();}return item;}
