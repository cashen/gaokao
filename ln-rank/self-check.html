<body class="ln-self-check-guided-page ui-orchestrated" data-ui-page="selected" data-ui-brand="family" data-ui-density="reading" data-release="v3.9.90.2" data-site-runtime-generation="v3990_2" data-release-surface="self-check">
  <div data-ui-global-header-mount></div>
  <div data-ui-family-status-mount></div>
  <main class="self-wrap">
    <section class="self-hero">
      <h1>当前发布与全站统一资源自测</h1>
      <p class="muted">核验当前发布中心、统一资源图、UI/CSS、数据与算法所有者，以及原生地区选择器的单事件族和打开前零 DOM 变更合同。这个页面只用于发版自查。</p>
      <button id="runSelfCheck" class="btn" type="button">运行自测</button>
      <span id="overallBadge" class="status warn">等待自测</span>
    </section>

    <section class="self-card">
      <h2>版本与统一资源状态</h2>
      <div id="versionBox" class="mono">等待读取…</div>
    </section>

    <section class="self-card">
      <h2>数据资源所有者</h2>
      <div id="cases" class="grid"></div>
    </section>

    <section class="self-card">
      <h2>报告资源所有者</h2>
      <div id="reports" class="grid"></div>
    </section>

    <section class="self-card">
      <h2>UI、CSS、组件与原生交互所有者</h2>
      <p class="muted">当前代际资源与明确保留的稳定依赖分开登记；地区数据与原生选择器交互分别拥有唯一所有者。</p>
      <div id="uiChecks" class="grid"></div>
    </section>

    <section class="self-card">
      <h2>错误日志</h2>
      <div id="errors" class="mono">暂无。</div>
      <p class="muted">失败时检查发布中心、资源注册表、UI 注册表、选择器激活所有者、数据与算法所有者，以及旧活动资源的 404。</p>
    </section>
  </main>
