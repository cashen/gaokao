<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7f6" />
  <title>ln-rank 当前发布与统一资源自测</title>
  <link rel="stylesheet" href="/shared/ui/tokens/foundation.v3959_0.css?v=3961_0" />
  <link rel="stylesheet" href="/shared/ui/tokens/semantic.v3959_0.css?v=3962_2" />
  <link rel="stylesheet" href="/shared/ui/shell/family-shell.v3972_5.css?v=3972_5" />
  <link rel="stylesheet" href="/shared/ui/components/family-plan-entry.v3972_5.css?v=3972_5" />
  <link rel="stylesheet" href="/ln-rank/css/dist/ln-rank-self-check.v3956_0.css?v=3959_0" />
</head>
<body class="ln-self-check-guided-page ui-orchestrated" data-ui-page="selected" data-ui-brand="family" data-ui-density="reading" data-release="v3.9.72.5" data-site-runtime-generation="v3972_5">
  <div data-ui-global-header-mount></div>
  <div data-ui-family-status-mount></div>
  <main class="self-wrap">
    <section class="self-hero">
      <h1>当前发布与全站统一资源自测</h1>
      <p class="muted">直接核验当前发布中心、统一资源图、UI/CSS 组件所有者、数据所有者、算法所有者和旧活动清单移除。这个页面是发版自查入口，不向家长提供业务判断。</p>
      <button id="runSelfCheck" class="btn" type="button">运行自测</button>
      <span id="overallBadge" class="status warn">等待自测</span>
    </section>

    <section class="self-card">
      <h2>版本与统一资源状态</h2>
      <div id="versionBox" class="mono">等待读取…</div>
    </section>

    <section class="self-card">
      <h2>数据资源所有者</h2>
      <div id="cases" class="grid"></div>
    </section>

    <section class="self-card">
      <h2>报告资源所有者</h2>
      <div id="reports" class="grid"></div>
    </section>

    <section class="self-card">
      <h2>UI、CSS 与组件所有者</h2>
      <p class="muted">活动代际资源和明确保留的稳定依赖分开登记；旧版本文件不得继续宣称当前所有权。</p>
      <div id="uiChecks" class="grid"></div>
    </section>

    <section class="self-card">
      <h2>错误日志</h2>
      <div id="errors" class="mono">暂无。</div>
      <p class="muted">失败时重点检查发布中心、统一资源注册表、UI 资源注册表、数据所有者、算法所有者和资源移除引用证明。</p>
    </section>
  </main>
  <script type="module" src="/ln-rank/js/self-check.v3972_5.js?v=3972_5"></script>
  <script type="module" src="/shared/ui/shell/family-shell.v3972_5.js?v=3972_5"></script>
</body>
</html>
