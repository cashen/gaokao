<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI现实诊断自检</title>
  <style>
    body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f2ea;color:#1f2933;margin:0;padding:24px}
    .box{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px #0001}
    button{padding:10px 14px;border-radius:12px;border:1px solid #ddd;background:#fff;font-weight:800}
    .ok{color:#2f7d68}.bad{color:#a85f4d}
    pre{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:12px;line-height:1.55}
  </style>
</head>
<body>
  <main class="box">
    <h1>AI现实诊断自检</h1>
    <p>用于检查 Cloudflare Workers AI 绑定是否可用。即使未绑定 AI，也会返回规则版诊断。</p>
    <button id="run">测试 AI 诊断</button>
    <pre id="out">等待测试…</pre>
  </main>
<script>
const out=document.getElementById('out');
function oneLine(s){return String(s||'').replace(/\s+/g,' ').slice(0,240)}
function looksLikeHtml(s){const x=String(s||'').trim().toLowerCase();return x.startsWith('<!doctype html')||x.startsWith('<html')||x.includes('<html')}
document.getElementById('run').onclick=async()=>{
  out.textContent='正在调用 /api/card-diagnose …';
  out.className='';
  try{
    const record={
      id:'demo-lnu-ee',
      school:'辽宁大学',
      major:'电气工程及其自动化',
      statusLabel:'主体偏稳',
      position:'主体讨论',
      scoreDelta:-7,
      score2025:598,
      rank2025:14257,
      score2024:591,
      rank2024:15820,
      historyCompare:{has2024:true,rankTrendText:'两年位次：前移约 1,563 位'},
      displayLocation:'辽宁 · 沈阳',
      natureLabel:'公办',
      schoolTags:['211','双一流']
    };
    const r=await fetch('/api/card-diagnose',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({candidateScore:605,record})
    });
    const raw=await r.text();
    if(looksLikeHtml(raw)) throw new Error('接口返回 HTML，不是 JSON。返回开头：'+oneLine(raw));
    let j; try{j=JSON.parse(raw)}catch(e){throw new Error('接口返回内容不是 JSON：'+oneLine(raw))}
    if(!r.ok||!j.ok) throw new Error(j.message||j.hint||r.status);
    out.className='ok';
    out.textContent='✓ 诊断接口可用\n来源：'+j.source+'\n模型：'+(j.model||'规则版')+'\n\n'+JSON.stringify(j.diagnosis,null,2);
  }catch(e){
    out.className='bad';
    out.textContent='✗ 自检失败：'+(e.message||e);
  }
};
</script>
</body>
</html>
