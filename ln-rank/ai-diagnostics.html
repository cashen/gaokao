<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 双接口诊断自检</title>
  <style>
    body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f2ea;color:#1f2933;margin:0;padding:24px}
    .box{max-width:1040px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px #0001}
    .intro{line-height:1.7;color:#52616b;margin-bottom:16px}
    button{padding:10px 14px;border-radius:12px;border:1px solid #d8e4de;background:#fff;font-weight:800;cursor:pointer}
    button:hover{background:#f4faf7}.ok{color:#2f7d68}.bad{color:#a85f4d}.muted{color:#6b7280}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
    .card{border:1px solid #e1e9e4;border-radius:16px;padding:14px;background:#fbfdfb}
    .card h2{font-size:18px;margin:0 0 8px}.meta{line-height:1.8;margin:8px 0}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;background:#eef7f2;color:#2f665b;font-weight:800;font-size:13px}
    pre{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:12px;line-height:1.55;max-height:360px;overflow:auto}
    @media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:14px}.box{padding:16px}}
  </style>
</head>
<body>
  <main class="box">
    <h1>AI 双接口诊断自检 · V3.9.7.0</h1>
    <p class="intro">用于同时检查两个 AI 入口：单卡诊断 <b>/api/card-diagnose</b> 与自选池诊断 <b>/api/path-analysis</b>。模型优先级为：专用变量（AI_CARD_MODEL / AI_PATH_MODEL）→ 统一变量 AI_MODEL → 默认模型。</p>
    <button id="run">同时测试单卡诊断和自选池诊断</button>
    <div class="grid">
      <section class="card" id="cardBox">
        <h2>单卡诊断</h2>
        <div class="meta muted">接口：/api/card-diagnose</div>
        <pre id="cardOut">等待测试…</pre>
      </section>
      <section class="card" id="pathBox">
        <h2>自选池诊断</h2>
        <div class="meta muted">接口：/api/path-analysis</div>
        <pre id="pathOut">等待测试…</pre>
      </section>
    </div>
  </main>
<script>
const cardOut=document.getElementById('cardOut');
const pathOut=document.getElementById('pathOut');
function oneLine(s){return String(s||'').replace(/\s+/g,' ').slice(0,260)}
function looksLikeHtml(s){const x=String(s||'').trim().toLowerCase();return x.startsWith('<!doctype html')||x.startsWith('<html')||x.includes('<html')}
async function readJsonResponse(r){
  const raw=await r.text();
  if(looksLikeHtml(raw)) throw new Error('接口返回 HTML，不是 JSON。返回开头：'+oneLine(raw));
  let j; try{j=JSON.parse(raw)}catch(e){throw new Error('接口返回内容不是 JSON：'+oneLine(raw))}
  if(!r.ok||!j.ok) throw new Error(j.message||j.hint||r.status);
  return j;
}
function formatResult(title,j){
  const dbg=j.modelDebug||{};
  const lines=[];
  lines.push('✓ '+title+'可用');
  lines.push('来源：'+(j.source||'未知'));
  lines.push('模型：'+(j.model||'规则版'));
  if(dbg.modelKey) lines.push('模型变量：'+dbg.modelKey+(dbg.usedFallbackKey?'（由 AI_MODEL 兜底）':'')+(dbg.usedDefault?'（默认模型）':''));
  lines.push('提示：'+(j.message||'无'));
  if(j.aiError) lines.push('AI错误：'+j.aiError);
  return lines.join('\n')+'\n\n原始摘要：\n'+JSON.stringify({source:j.source,model:j.model,modelDebug:j.modelDebug,message:j.message,summary:j.summary,narrative:j.narrative&&j.narrative.overall},null,2);
}
async function testCard(){
  cardOut.className='';cardOut.textContent='正在调用 /api/card-diagnose …';
  const record={
    id:'demo-lnu-ee',school:'辽宁大学',major:'电气工程及其自动化',statusLabel:'主体偏稳',position:'主体讨论',scoreDelta:-7,score2025:598,rank2025:14257,score2024:591,rank2024:15820,historyCompare:{has2024:true,rankTrendText:'两年位次：前移约 1,563 位'},displayLocation:'辽宁 · 沈阳',natureLabel:'公办',schoolTags:['211','双一流']
  };
  const r=await fetch('/api/card-diagnose',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({candidateScore:605,record})});
  const j=await readJsonResponse(r);
  cardOut.className='ok';cardOut.textContent=formatResult('单卡诊断',j);
}
async function testPath(){
  pathOut.className='';pathOut.textContent='正在调用 /api/path-analysis …';
  const items=[
    {id:'p1',schoolName:'大连交通大学',school:'大连交通大学',majorName:'机械工程',major:'机械工程',admitScore:578,score2025:578,admitRank:21329,rank2025:21329,displayLocation:'辽宁 · 大连',natureLabel:'公办'},
    {id:'p2',schoolName:'沈阳工业大学',school:'沈阳工业大学',majorName:'电气工程及其自动化',major:'电气工程及其自动化',admitScore:565,score2025:565,admitRank:28500,rank2025:28500,displayLocation:'辽宁 · 沈阳',natureLabel:'公办'},
    {id:'p3',schoolName:'辽宁工程技术大学',school:'辽宁工程技术大学',majorName:'自动化',major:'自动化',admitScore:535,score2025:535,admitRank:43000,rank2025:43000,displayLocation:'辽宁 · 阜新',natureLabel:'公办'}
  ];
  const r=await fetch('/api/path-analysis',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({candidateScore:550,year:2025,region:'ln',subject:'physics',items,bottomLineMode:'all'})});
  const j=await readJsonResponse(r);
  pathOut.className='ok';pathOut.textContent=formatResult('自选池诊断',j);
}
document.getElementById('run').onclick=async()=>{
  await Promise.allSettled([testCard().catch(e=>{cardOut.className='bad';cardOut.textContent='✗ 单卡诊断失败：'+(e.message||e)}),testPath().catch(e=>{pathOut.className='bad';pathOut.textContent='✗ 自选池诊断失败：'+(e.message||e)})]);
};
</script>
</body>
</html>
