<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>高校知识库自检</title>
  <style>
    body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f2ea;color:#1f2933;margin:0;padding:24px}
    .box{max-width:980px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px #0001}
    input,button{padding:10px 14px;border-radius:12px;border:1px solid #ddd;background:#fff}
    input{min-width:260px} button{font-weight:800}
    pre{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:12px;line-height:1.55}
    .ok{color:#2f7d68}.bad{color:#a85f4d}.hint{color:#64748b}
  </style>
</head>
<body>
  <main class="box">
    <h1>高校知识库自检</h1>
    <p class="hint">检查 Cloudflare 端是否已经能读取 school-kb.generated.js 和 major-kb.generated.js。</p>
    <input id="school" value="辽宁大学" placeholder="学校，如 辽宁大学" />
    <input id="major" value="电气工程及其自动化" placeholder="专业，如 电气工程及其自动化" />
    <button id="run">查询知识库</button>
    <pre id="out">等待查询…</pre>
  </main>
<script>
const out=document.getElementById('out');
document.getElementById('run').onclick=async()=>{
  out.className='';
  out.textContent='正在查询…';
  const school=document.getElementById('school').value.trim();
  const major=document.getElementById('major').value.trim();
  try{
    const r=await fetch('/api/kb-inspect?school='+encodeURIComponent(school)+'&major='+encodeURIComponent(major),{cache:'no-store'});
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error(j.message||r.status);
    out.className='ok';
    out.textContent=JSON.stringify(j,null,2);
  }catch(e){
    out.className='bad';
    out.textContent='查询失败：'+(e.message||e);
  }
};
</script>
</body>
</html>
