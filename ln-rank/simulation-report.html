<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f2ec" />
<title>辽宁模拟志愿</title>
<link rel="stylesheet" href="/ln-rank/css/simulation-report.css?v=v016.65-r155" />
</head>
<body>
<main class="workbench-page" data-simulation-page-version="v1.1">
<header class="workbench-hero"><div><p class="eyebrow">辽宁物理类 · 家庭讨论用</p><h1>模拟志愿</h1><p class="hero-copy">把想考虑的学校和专业放进来，一条条看清楚、聊清楚，再决定怎么排。这里只做家庭整理，不是正式填报。</p></div><a class="quiet-link" href="/ln-rank/">返回专业初选</a></header>
<section class="candidate-panel" aria-label="考生信息"><div class="candidate-main"><label>学生姓名<input id="wbStudentName" type="text" maxlength="30" placeholder="可不填" autocomplete="name" /></label><label>考试类型<select id="wbSubject"><option>辽宁物理类（物化生）</option></select></label><label>考试总分<input id="wbTotalScore" type="text" inputmode="numeric" maxlength="3" placeholder="例如 555" /></label></div><div class="rank-note"><span>2026辽宁物理类参考位次</span><strong id="wbRank">—</strong><small id="wbRankSource">输入总分后自动换算</small></div></section>
<section class="workbench-panel" aria-label="我的志愿"><div class="panel-head"><div><p class="panel-kicker">家庭志愿整理</p><h2>我的志愿</h2><p id="wbStatus" class="status-copy">先加入一所已经考虑过的学校，不需要一次填完。</p></div><div class="panel-actions"><button id="wbAdd" class="btn primary" type="button">＋ 添加志愿</button><button id="wbPdf" class="btn" type="button">打印 / 保存这份方案</button><button id="wbReset" class="btn subtle-danger" type="button">清空重填</button></div></div><div id="wbSummary" class="summary-strip" aria-live="polite" aria-label="家庭整理进度"></div><div id="wbRows" class="volunteer-list" aria-live="polite"></div><div id="wbEmpty" class="empty-state" hidden><div class="empty-title">还没有志愿</div><p>先放进一所已经考虑过的学校，后面可以慢慢补专业、看参考、讨论是否保留。</p><button class="btn primary" type="button" data-empty-add>＋ 添加第一条志愿</button></div></section>
</main>
<script type="module" src="/ln-rank/js/simulation-runtime.js?v=v016.65-r155"></script>
<script type="module" src="/shared/resources/release/release-footer.v3990_3.js?v=v3990_3&r=r155-school-major-mobile"></script>
</body>
</html>
