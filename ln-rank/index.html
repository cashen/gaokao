<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>辽宁物理类志愿梯度位次参考工具</title><link rel="stylesheet" href="./css/tokens.css"/><link rel="stylesheet" href="./css/base.css"/><link rel="stylesheet" href="./css/layout.css"/><link rel="stylesheet" href="./css/cards.css"/><link rel="stylesheet" href="./css/filters.css"/><link rel="stylesheet" href="./css/major-list.css"/><link rel="stylesheet" href="./css/responsive.css"/></head><body><main class="page"><header class="app-header"><div><h1 class="app-title">辽宁物理类志愿梯度位次参考工具</h1><p class="app-subtitle">输入物理类考生分数，查看上探、主体、稳妥三个分数区间里的院校专业。</p></div><div class="scope-pill">数据口径：辽宁 2025 物理类专业数据</div></header><section class="dashboard"><aside class="stack"><section class="panel"><h2 class="panel-title">基础设置</h2><p class="panel-desc">先填考生分数，再用地域、学校或专业关键词缩小专业池。</p><div class="field"><label for="candidateScore">考生分数</label><input id="candidateScore" class="input score-input" type="text" inputmode="numeric" value="520"/></div><div class="field"><label>查看范围</label><div class="range-buttons" id="rangeButtons"><button class="range-button is-active" data-preset="standard">标准</button><button class="range-button" data-preset="wide">放宽</button><button class="range-button" data-preset="safe">保守</button></div><p class="filter-hint">标准：上探 +1~+10，主体 0~-10，稳妥 -11~-25。</p></div></section><section class="panel"><h2 class="panel-title">筛选专业池</h2><p class="panel-desc">筛选只缩小结果范围，不改变分数区间。</p><div class="filters-grid"><div class="field"><label for="region">地域</label><select id="region" class="select"><option value="all">不限</option><option value="ln">辽宁省内</option><option value="shenyang">沈阳</option><option value="dalian">大连</option><option value="ln-other">辽宁其他</option><option value="outside">省外</option></select></div><div class="field"><label for="schoolKeyword">学校名称</label><input id="schoolKeyword" class="input" type="search" placeholder="如：大连、沈阳工业"/></div><div class="field"><label for="majorKeyword">专业名称</label><input id="majorKeyword" class="input" type="search" placeholder="如：计算机、电气、通信"/></div></div></section></aside><section class="panel"><h2 class="panel-title">分数区间</h2><p class="panel-desc">系统按考生分数自动生成三个区间。点击卡片可聚焦对应结果。</p><div id="bandCards"></div><div class="note">本页用于形成可讨论专业池，不等同于录取预测。正式填报仍需结合当年位次、等位分/同位分、招生计划和专业要求综合判断。</div></section><section class="panel results-panel"><div class="results-head"><div><h2 class="results-title">专业列表</h2><div id="resultsMeta" class="results-meta">正在读取数据…</div></div><button id="reloadButton" class="range-button">重新读取</button></div><div id="results" class="results-scroll loading">正在读取 /fenxi 专业数据…</div></section></section></main><script type="module" src="./js/app.v395.js?v=395"></script></body></html>
