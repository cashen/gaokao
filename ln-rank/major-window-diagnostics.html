<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>major-window 自检</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f2ea;color:#1f2933;margin:0;padding:24px}.box{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px #0001}button{padding:10px 14px;border-radius:12px;border:1px solid #ddd;background:#fff}.ok{color:#2f7d68}.bad{color:#a85f4d}pre{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:12px}</style></head><body><main class="box"><h1>major-window 自检</h1><p>检查 ln-rank 是否能通过 Cloudflare Function 读取 /fenxi 物理类专业数据。</p><button id="run">开始自检</button><pre id="out">等待自检…</pre></main><script type="module">
const out=document.getElementById('out');
function oneLine(s){return String(s||'').replace(/\s+/g,' ').slice(0,220)}
function looksLikeHtml(s){const x=String(s||'').trim().toLowerCase();return x.startsWith('<!doctype html')||x.startsWith('<html')||x.includes('<html')}
document.getElementById('run').onclick=async()=>{
  out.textContent='请求中…';
  out.className='';
  try{
    const url='/api/major-window?candidateScore=520&viewScore=533&region=all';
    const r=await fetch(url,{cache:'no-store'});
    const raw=await r.text();
    if(looksLikeHtml(raw)){
      throw new Error('API 返回了 HTML，不是 JSON。说明 /api/major-window 没有命中 Cloudflare Function，常见原因是 functions 目录没有放在项目根目录，或部署没有生效。返回开头：'+oneLine(raw));
    }
    let j;
    try{ j=JSON.parse(raw); }catch(e){
      throw new Error('API 返回内容不是 JSON。返回开头：'+oneLine(raw));
    }
    if(!r.ok||!j.ok)throw new Error(j.message||j.hint||r.status);
    const lines=[];
    lines.push('✓ API 可访问');
    lines.push(`✓ 窗口：${j.meta.window.lower}-${j.meta.window.upper}`);
    lines.push(`✓ 上探：${j.counts.upper} 条`);
    lines.push(`✓ 主体：${j.counts.near} 条`);
    lines.push(`✓ 稳妥：${j.counts.lower} 条`);
    lines.push(`✓ 总数：${j.counts.total} 条`);
    out.innerHTML=lines.join('\n')+'\n\n'+JSON.stringify(j.source,null,2);
    out.className='ok';
  }catch(e){
    out.innerHTML='✗ 自检失败：'+(e.message||e);
    out.className='bad';
  }
};
</script></body></html>
