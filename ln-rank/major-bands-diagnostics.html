<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>major-bands 自检</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f2ea;color:#1f2933;margin:0;padding:24px}.box{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px #0001}button{padding:10px 14px;border-radius:12px;border:1px solid #ddd;background:#fff}.ok{color:#2f7d68}.bad{color:#a85f4d}pre{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:12px}</style></head><body><main class="box"><h1>major-bands 自检</h1><p>检查 /api/major-bands 是否能读取 /fenxi 物理类专业数据，并生成上探、主体、稳妥三个区间。</p><button id="run">开始自检</button><pre id="out">等待自检…</pre></main><script>const out=document.getElementById('out');function oneLine(s){return String(s||'').replace(/\s+/g,' ').slice(0,220)}function looksLikeHtml(s){const x=String(s||'').trim().toLowerCase();return x.startsWith('<!doctype html')||x.startsWith('<html')||x.includes('<html')}document.getElementById('run').onclick=async()=>{out.textContent='请求中…';out.className='';try{const r=await fetch('/api/major-bands?candidateScore=520&rangePreset=standard&region=all',{cache:'no-store'}),raw=await r.text();if(looksLikeHtml(raw))throw new Error('API 返回了 HTML，不是 JSON。说明 /api/major-bands 没有命中 Cloudflare Function。返回开头：'+oneLine(raw));let j;try{j=JSON.parse(raw)}catch(e){throw new Error('API 返回内容不是 JSON：'+oneLine(raw))}if(!r.ok||!j.ok)throw new Error(j.message||j.hint||r.status);const lines=[];lines.push('✓ API 可访问');lines.push(`✓ 上探区间：${j.bands.upper.rangeText}，${j.counts.upper} 条`);lines.push(`✓ 主体区间：${j.bands.near.rangeText}，${j.counts.near} 条`);lines.push(`✓ 稳妥区间：${j.bands.steady.rangeText}，${j.counts.steady} 条`);lines.push(`✓ 总数：${j.counts.total} 条`);out.className='ok';out.textContent=lines.join('\n')+'\n\n'+JSON.stringify(j.source,null,2)}catch(e){out.className='bad';out.textContent='✗ 自检失败：'+(e.message||e)}};</script></body></html>
