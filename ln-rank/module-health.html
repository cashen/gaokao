<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ln-rank 模块自检</title>
  <style>
    body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f7f2ea;color:#1f2933;margin:0;padding:24px}
    .box{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 16px 38px #0001}
    button{padding:10px 14px;border-radius:12px;border:1px solid #ddd;background:#fff}
    .ok{color:#2f7d68}.bad{color:#a85f4d}
    pre{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:12px}
  </style>
</head>
<body>
  <main class="box">
    <h1>ln-rank 模块自检</h1>
    <p>用于检查前端模块导出是否完整，避免页面启动时报 export 错误。</p>
    <button id="run">开始自检</button>
    <pre id="out">等待自检…</pre>
  </main>
<script type="module">
const out = document.getElementById('out');
const checks = [
  ['./js/core/number-utils.v3912.js', ['toInt','fmt']],
  ['./js/config/region-options.v3912.js', ['REGION_OPTIONS']],
  ['./js/feature/score-bands/score-bands-render.v3912.js', ['renderBandTabs']],
  ['./js/feature/major-pool/major-pool-render.v3912.js', ['renderMajorResults']],
  ['./js/feature/major-pool/major-bands-api.v3912.js', ['fetchMajorBands']],
  ['./js/core/score-guard.v3912.js', ['getScoreGuard']],
  ['./js/feature/feishu/feishu-report-controller.v3916.js', ['initFeishuReport','renderFeishuReport','clearFeishuReport']],
  ['./js/feature/feishu/feishu-report-api.v3913.js', ['createFeishuReport']],
  ['./js/feature/feishu/feishu-report-render.v3916.js', ['renderFeishuReportView']],
  ['./js/feature/report/report-payload-builder.v3913.js', ['buildFeishuReportPayload','canGenerateFeishuReport']]
];

document.getElementById('run').onclick = async () => {
  const lines = [];
  let ok = true;
  for (const [path, names] of checks) {
    try {
      const mod = await import(path + '?t=' + Date.now());
      for (const name of names) {
        if (!(name in mod)) {
          ok = false;
          lines.push(`✗ ${path} 缺少导出：${name}`);
        } else {
          lines.push(`✓ ${path} 导出 ${name}`);
        }
      }
    } catch (error) {
      ok = false;
      lines.push(`✗ ${path} 加载失败：${error.message || error}`);
    }
  }
  out.className = ok ? 'ok' : 'bad';
  out.textContent = lines.join('\n');
};
</script>
</body>
</html>
